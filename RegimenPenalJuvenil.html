del día en que cumplan dieciocho (18) años de edad, cuando fueran imputadas por un hecho tipificado como delito en el Código Penal o en las leyes penales especiales vigentes o que se dicten en el futuro."], "z": ["14 años", "18 años"]}, {"n": 2, "t": "Presunción de edad", "s": "Las edades indicadas en el presente Capítulo se entienden siempre referidas al momento de la comisión del hecho y se acreditarán con Documento Nacional de Identidad, partidas de los…", "p": ["Las edades indicadas en el presente Capítulo se entienden siempre referidas al momento de la comisión del hecho y se acreditarán con Documento Nacional de Identidad, partidas de los Registros correspondientes y cualquier otro documento que permita determinarlas. Si no resulta posible comprobar fehacientemente las edades mínima o máxima establecida en el artículo 1º, deberá recabarse la prueba adecuada, requerirse los informes correspondientes o practicarse los peritajes necesarios. En caso de que los resultados de los informes requeridos no resultaran concluyentes, se presumirá la minoría de edad."], "z": []}, {"n": 3, "t": "Aplicación supletoria", "s": "Se aplicarán supletoriamente las disposiciones del Código Penal en cuanto no se opongan a la presente ley.", "p": ["Se aplicarán supletoriamente las disposiciones del Código Penal en cuanto no se opongan a la presente ley."], "z": []}, {"n": 4, "t": "Finalidad", "s": "La finalidad del Régimen de Responsabilidad Penal Juvenil es fomentar en el adolescente imputado el sentido de la responsabilidad legal por sus actos y lograr su educación,…", "p": ["La finalidad del Régimen de Responsabilidad Penal Juvenil es fomentar en el adolescente imputado el sentido de la responsabilidad legal por sus actos y lograr su educación, resocialización e integración social.", "El objetivo de la ley es procurar que supere el riesgo social y la conflictividad puesta en evidencia en la comisión del delito y, mediante las medidas establecidas en la presente ley."], "z": []}, {"n": 5, "t": "Principios, derechos y garantías generales", "s": "Desde el inicio del proceso penal y hasta su finalización, el niño, niña o adolescente gozará de los derechos y garantías reconocidos en la Constitución Nacional, los instrumentos…", "p": ["Desde el inicio del proceso penal y hasta su finalización, el niño, niña o adolescente gozará de los derechos y garantías reconocidos en la Constitución Nacional, los instrumentos internacionales de derechos humanos, las Constituciones provinciales, de los ordenamientos locales y demás normas de aplicación.", "Sin perjuicio de lo expuesto en el primer párrafo, deberán asegurarse durante el proceso los siguientes principios, derechos y garantías judiciales:", "a) Legalidad: no ser objeto de medidas que no estén previstas en la legislación nacional o provincial;", "b) Necesidad, proporcionalidad e idoneidad de las medidas que restrinjan derechos: cualquier medida de restricción o injerencia en sus derechos constitucionales y convencionales deberá ser indispensable, proporcional, idónea y que resulte ser la medida menos lesiva a sus derechos. Cualquier medida que afecte sus derechos deberá ser interpretada de modo restrictivo y excepcional;", "c) Debido proceso legal y derecho de defensa en juicio: el adolescente imputado deberá contar desde el inicio del procedimiento con asistencia legal, eficaz e idónea; deberá comunicársele inmediatamente la imputación de modo claro y preciso de manera que la pueda comprender, informársele la totalidad de los derechos con los que cuenta, a fin de asegurarle eficazmente los medios y el tiempo adecuado para confrontar la acusación; informársele del derecho constitucional a guardar silencio y garantizarse de modo amplio el debido proceso y el derecho de defensa en juicio;", "d) In dubio pro reo e interpretación pro minoris: en la resolución judicial de su responsabilidad penal, el juez deberá tener especial consideración del principio in dubio pro reo, tanto en lo que respecta a la comprobación de la autoría o participación del adolescente imputado en la comisión del delito como en la constatación judicial de la concurrencia de causas de justificación;", "e) Penas: el régimen de penas deberá orientarse siempre a la educación y resocialización, a fin de que el adolescente imputado obtenga un futuro con integración social y trabajo, comprensión y arrepentimiento por la conducta punible perpetrada. Además, deberá tender a disminuir el riesgo de que incurra en la comisión de nuevos delitos.", "La elección de la sanción a aplicarse y la graduación de la pena dentro de las escalas legales previstas se efectuarán conforme las finalidades previstas en el artículo 4°, atendiendo, entre otras circunstancias, a la gravedad del daño causado, a la edad y a las condenas previas recaídas contra el adolescente imputado;", "f) Respeto: el adolescente imputado deberá ser tratado con respeto y consideración a lo largo del proceso;", "g) Dignidad humana y prohibición de discriminación: el adolescente imputado tendrá derecho a que se respete su dignidad humana y a no ser discriminado por motivos de raza, color, sexo, identidad de género, idioma, religión, opinión política o de otra índole, origen nacional, étnico o social, posición económica, impedimentos físicos, nacimiento o cualquier otra condición de él mismo, de sus padres o de sus representantes legales, entre otros;", "h) Plazo razonable de juzgamiento, brevedad y celeridad procesal: el adolescente imputado tendrá derecho a ser juzgado en un plazo razonable, sin dilaciones injustificadas o indebidas.", "Se deberá tramitar el proceso con premura, priorizando los casos en los que el imputado se encuentre detenido con prisión preventiva. La dilación injustificada a contar desde la intimación del hecho al adolescente imputado hará responsable al magistrado interviniente por falta grave y motivará que deban remitirse los antecedentes al ámbito disciplinario correspondiente;", "i) Reserva del proceso: el proceso deberá tener carácter reservado, salvo para las partes, la defensa, la víctima y los padres o responsables del adolescente imputado. Se prohíbe la publicidad del nombre del adolescente imputado, salvo que el mismo renuncie expresamente a este derecho.", "Queda prohibida la publicación de nombres, sobrenombres, filiación, parentesco o residencia del adolescente imputado y la exhibición de fotografías o de cualquier otro dato que posibilite su identificación, sin perjuicio de las medidas que el magistrado pueda disponer para la individualización o localización de aquel.", "El incumplimiento de lo dispuesto en el párrafo anterior será sancionado en los términos de lo dispuesto en el artículo 2º de la ley 20.056;", "j) Privación de la libertad. Requisitos necesarios e imprescindibles: se entenderá como privación de la libertad a toda forma de detención, internación, encarcelamiento o alojamiento en un establecimiento dispuesta por el juez o tribunal en la que no se le permita el egreso por propia voluntad.", "La medida que implique la restricción de la libertad durante el procedimiento deberá decretarse en auto motivado y fundamentarse en la existencia de riesgos procesales debidamente constatados;", "k) Lugar del alojamiento: producida la detención de un adolescente y en caso de que sea indispensable su encierro, su alojamiento deberá hacerse efectivo en dependencias acondicionadas especialmente para ese fin, bajo la dirección de personal idóneo para el trato con aquellos. Queda prohibido dicho alojamiento junto a personas mayores de edad;", "l) Derechos de los padres o de sus responsables. Información: al formularse la imputación a un niño, niña o adolescente, la autoridad judicial competente deberá comunicar su actuación y los actos procesales desarrollados a los padres o responsables parentales, momento en el que se informará también el hecho atribuido al imputado;", "m) Tutela juvenil: durante el proceso, el juez podrá ordenar todas las medidas protectorias que considere necesarias al efecto de salvaguardar la integridad física, mental y social del niño, niña o adolescente, incluidas las enumeradas en el artículo 8º de la presente;", "n) Otros principios rectores: se deberá tener en especial consideración la protección integral de la víctima y sus familiares, la seguridad pública y la protección de la sociedad, entre otros principios que prevé esta ley. En todo proceso que involucre como imputada o víctima a una persona menor de dieciocho (18) años, deberá intervenir la asesoría tutelar correspondiente a la jurisdicción donde se lo substancie."], "z": ["18 años"]}, {"n": 6, "t": "Protección permanente de los derechos de las víctimas", "s": "El juez y el representante del Ministerio Público Fiscal deberán velar en todo momento por la tutela efectiva de los derechos de las víctimas y de las personas perjudicadas por los…", "p": ["El juez y el representante del Ministerio Público Fiscal deberán velar en todo momento por la tutela efectiva de los derechos de las víctimas y de las personas perjudicadas por los delitos cometidos por los adolescentes."], "z": []}, {"n": 7, "t": "Derechos", "s": "Desde el inicio de un proceso penal juvenil y hasta su finalización, la víctima gozará de los derechos reconocidos en la Constitución Nacional, los instrumentos internacionales de…", "p": ["Desde el inicio de un proceso penal juvenil y hasta su finalización, la víctima gozará de los derechos reconocidos en la Constitución Nacional, los instrumentos internacionales de derechos humanos y las leyes de protección de los derechos de las víctimas que en cada jurisdicción corresponda aplicar.", "Los progenitores de los niños, niñas y adolescentes sometidos a proceso penal serán civilmente responsables por los ilícitos cometidos por sus hijos, de conformidad con lo establecido por el Código Civil y Comercial de la Nación (ley 26.994)."], "z": []}, {"n": 8, "t": "Enunciación", "s": "Al disponerse una condena de ejecución condicional o alguna de las penas previstas en el artículo 12, y en el marco de alguno de los institutos regulados en los artículos 42 y 43 de la…", "p": ["Al disponerse una condena de ejecución condicional o alguna de las penas previstas en el artículo 12, y en el marco de alguno de los institutos regulados en los artículos 42 y 43 de la presente ley, deberán imponerse al adolescente una o algunas de las siguientes medidas complementarias:", "a) asesoramiento, orientación o supervisión periódica de un equipo interdisciplinario;", "b) asistencia a programas educativos y a medidas conducentes para garantizar al adolescente su derecho a la educación y conclusión de los estudios obligatorios. A los fines de la escolaridad obligatoria, deberán implementarse programas específicos de manera coordinada con el sistema educativo de la jurisdicción. Las sanciones disciplinarias aplicadas al imputado en ningún caso pueden implicar una interrupción de los estudios;", "c) asistencia a programas de formación ciudadana, cursos o programas dirigidos a su inserción social, a evitar futuros conflictos, a comprender sus derechos y deberes cívicos, familiares y sociales;", "d) asistencia a programas de capacitación laboral, con el objeto de aprender un oficio o profesión para su futura inserción laboral;", "e) participación en programas deportivos, recreativos o culturales, para su adecuado desarrollo personal y su integración con sus pares;", "f) concurrencia a los servicios de salud acorde a su edad;", "g) participación en un tratamiento médico o psicológico por el plazo que los profesionales de la salud estimen necesario;", "h) obtención, en un plazo razonable en tanto sea permitido por la legislación laboral, de un trabajo, en el que deberá dar cuenta de su ingreso y registro laboral y aportar al tribunal las constancias pertinentes, que deberán ser verificadas por el juzgado interviniente;", "i) obligación de concurrir al tribunal o ante la autoridad que el juez determine;", "j) prohibición del consumo o uso de estupefacientes o de bebidas alcohólicas."], "z": []}, {"n": 9, "t": "Custodia del adolescente imputado y derecho a ser oído", "s": "Si el adolescente careciera de grupo familiar o si este resultara inconveniente y perjudicial para su interés superior, a requerimiento del fiscal, de la defensa o de los organismos de…", "p": ["Si el adolescente careciera de grupo familiar o si este resultara inconveniente y perjudicial para su interés superior, a requerimiento del fiscal, de la defensa o de los organismos de protección de la niñez, se dispondrá su permanencia temporal en ámbitos familiares considerados alternativos o bajo la custodia de organismos de protección de la niñez que garanticen de mejor modo la seguridad y el interés superior del niño.", "En todos los casos, se deberá oír y tener en cuenta la opinión del adolescente imputado, su defensor, el fiscal y la víctima.", "El juez podrá solicitar la asistencia de los órganos especializados de protección de la niñez, los que actuarán bajo su supervisión y responsabilidad."], "z": []}, {"n": 10, "t": "Control de las medidas. Revocación", "s": "El cumplimiento de las medidas reseñadas en esta Sección estará sometido a control judicial.", "p": ["El cumplimiento de las medidas reseñadas en esta Sección estará sometido a control judicial. A tales efectos, las partes y los funcionarios a cargo de los organismos pertinentes deberán aportar al juez de la causa toda la información requerida.", "En caso de incumplimiento de tales medidas, se deberá disponer el inmediato cumplimiento de la pena dejada en suspenso, sin computar el plazo de trasgresión, imponerse alguna o algunas de las previstas en el artículo 12 o continuarse con el proceso, si se hubiera dispuesto en el marco previsto en los artículos 42 y 43 de esta ley."], "z": []}, {"n": 11, "t": "", "s": "Cuando la pena prevista para el delito o concurso de delitos imputados sea de hasta tres (3) años de prisión y se cumplieran las demás condiciones del título III del Libro Primero del…", "p": ["Cuando la pena prevista para el delito o concurso de delitos imputados sea de hasta tres (3) años de prisión y se cumplieran las demás condiciones del título III del Libro Primero del Código Penal de la Nación, se deberá reemplazar la pena de prisión por alguna de las penas previstas en el artículo 12.", "Cuando la pena prevista para el delito o concurso de delitos imputados supere los tres (3) años de prisión y hasta un máximo de diez (10) años de prisión y ninguno de los hechos reprochados haya implicado la muerte de la víctima, una grave violencia física o psíquica sobre las personas o, si se tratare de delitos culposos, no existieran lesiones gravísimas ni se haya causado la muerte o un daño psíquico grave a la víctima y el adolescente imputado no registrare condenas u otros procesos en trámite con auto de procesamiento o auto procesal equivalente firme, el tribunal, previo dictamen pericial con la conformidad del Ministerio Público Fiscal y habiendo escuchado a la víctima, podrá reemplazar la pena privativa de la libertad por alguna de las penas previstas en el artículo 12."], "z": ["3 años", "10 años"]}, {"n": 12, "t": "Enunciación", "s": "Podrán imponerse al adolescente las siguientes penas:", "p": ["Podrán imponerse al adolescente las siguientes penas:", "a) Amonestación, en los términos establecidos en el artículo 13 de esta ley;", "b) Prohibición de contacto o de aproximarse a la víctima, su familia u otras personas que el juez estime corresponder o de relacionarse con determinadas personas;", "c) Prohibición de conducción de vehículos, si el delito imputado se vincula con la conducción de vehículos motorizados de cualquier naturaleza, el juez o tribunal podrá prohibirle la conducción de uno (1) o más tipos de vehículos;", "d) Prohibición de concurrir a determinados lugares, establecimientos o espectáculos, inclusive deportivos, musicales o culturales;", "e) Prohibición de salir del país o del lugar en el cual reside o del ámbito territorial que el juez determine;", "f) Prestación de servicios a la comunidad. La prestación de servicios a la comunidad consiste en la realización de tareas de interés social en entidades de asistencia, públicas o privadas sin fines de lucro como hospitales, escuelas, sociedades o fundaciones destinadas al bien común y con fines sociales u otros establecimientos similares.", "Dichos servicios deberán ser determinados con estricta observancia de las regulaciones que en materia laboral se establecen respecto del trabajo de las personas menores de dieciocho (18) años de edad en cuanto al tipo de tareas. Las tareas deberán asignarse según las aptitudes del adolescente imputado y no deberán afectar ni perjudicar su concurrencia a establecimientos educativos o laborales;", "g) Monitoreo electrónico. El monitoreo electrónico consiste en la aplicación de un dispositivo electrónico para rastrear y registrar la ubicación y actividades del adolescente, a fin de garantizar el cumplimiento de alguna de las penas impuestas o bien como pena en sí misma. El monitoreo electrónico podrá imponerse de forma autónoma o como complemento de las otras penas previstas en este artículo y en el artículo 17 de la presente ley;", "h) Reparación integral del daño a la víctima;", "i) Penas privativas de libertad."], "z": ["18 años"]}, {"n": 13, "t": "Amonestación", "s": "La amonestación consiste en un llamado de atención, reproche oral y recomendaciones sobre formas de conducta comunitaria formulado personalmente, bajo consecuencia de nulidad, por el…", "p": ["La amonestación consiste en un llamado de atención, reproche oral y recomendaciones sobre formas de conducta comunitaria formulado personalmente, bajo consecuencia de nulidad, por el juez o tribunal al adolescente imputado en audiencia privada y en presencia del defensor, del fiscal, de los padres o representantes legales y de la víctima, si ella así lo desea.", "En la citada audiencia, el magistrado interviniente deberá hacer saber al imputado, de forma clara y en lenguaje sencillo, la ilegalidad y gravedad del hecho cometido y su responsabilidad, y promover su determinación a no cometer nuevos delitos.", "Podrá también convocar en otra audiencia a los padres o responsables y advertirlos sobre la conducta ilícita del adolescente imputado, su necesidad de enmienda y de procurar que aquella no se repita en el futuro.", "La amonestación deberá ser impuesta de forma conjunta con al menos una (1) de las demás penas previstas en el artículo 12."], "z": []}, {"n": 14, "t": "", "s": "Salvo cuando fuera necesario para la protección de la víctima o de testigos, las penas establecidas en el artículo 12, incisos b), d) y e) no podrán impedir u obstaculizar vínculos…", "p": ["Salvo cuando fuera necesario para la protección de la víctima o de testigos, las penas establecidas en el artículo 12, incisos b), d) y e) no podrán impedir u obstaculizar vínculos afectivos de importancia, la asistencia a lugares para su formación educativa o laboral o a su lugar de trabajo o de educación, o el acceso a servicios de salud."], "z": []}, {"n": 15, "t": "", "s": "Las penas determinadas en el artículo 12, con excepción de las establecidas en los incisos a), h) e i), no podrán exceder de tres (3) años.", "p": ["Las penas determinadas en el artículo 12, con excepción de las establecidas en los incisos a), h) e i), no podrán exceder de tres (3) años."], "z": ["3 años"]}, {"n": 16, "t": "Verificación de cumplimiento de las penas", "s": "El cumplimiento de las penas referidas en el artículo 12, incisos a) a h) deberá ser controlado periódicamente por el juez interviniente, atendiendo a los informes que presenten las…", "p": ["El cumplimiento de las penas referidas en el artículo 12, incisos a) a h) deberá ser controlado periódicamente por el juez interviniente, atendiendo a los informes que presenten las partes y los organismos cuyo objeto sea controlar el cumplimiento de las sanciones impuestas. Podrá participar la víctima, si es su deseo. En caso de verificarse su incumplimiento, se deberá revocar la pena y disponerse una pena privativa de la libertad."], "z": []}, {"n": 17, "t": "Enunciación", "s": "Las penas privativas de la libertad son las siguientes:", "p": ["Las penas privativas de la libertad son las siguientes:", "a) privación de la libertad en domicilio;", "b) privación de la libertad en un instituto abierto;", "c) privación de la libertad en un instituto especializado de detención.", "La decisión deberá ser tomada por el tribunal o juez en una resolución en la que se expongan los motivos que justifican la privación de la libertad y deberá indicarse el lugar de cumplimiento, conforme a los parámetros de esta ley."], "z": []}, {"n": 18, "t": "Otras medidas", "s": "En todos los casos, se deberán imponer al adolescente, conjuntamente, medidas específicas tendientes a desarrollar su educación, el trabajo y la conciencia de la gravedad del hecho…", "p": ["En todos los casos, se deberán imponer al adolescente, conjuntamente, medidas específicas tendientes a desarrollar su educación, el trabajo y la conciencia de la gravedad del hecho cometido, con vistas a lograr su resocialización y desarrollo de su vida."], "z": []}, {"n": 19, "t": "Prohibición y plazo máximo de detención", "s": "Respecto de los adolescentes alcanzados por la presente ley, queda prohibida la imposición de las penas privativas de la libertad de reclusión perpetua y de prisión perpetua.", "p": ["Respecto de los adolescentes alcanzados por la presente ley, queda prohibida la imposición de las penas privativas de la libertad de reclusión perpetua y de prisión perpetua. El plazo máximo de las penas privativas de la libertad respecto de personas adolescentes será de quince (15) años. La regla es aplicable aun si la escala penal fuera más elevada, producto de la concurrencia real de varios hechos independientes.", "Cuando el adolescente condenado cumpla dos tercios (2/3) de la pena impuesta en detención y se dieran las circunstancias previstas en el Código Penal para otorgar la libertad condicional, el tribunal podrá disponer que el resto de la pena sea cumplida mediante las restantes penas establecidas en esta ley, de modo conjunto o alternativo. Previamente a la decisión se requerirá el dictamen pericial favorable, la conformidad del Ministerio Público Fiscal y la opinión de la víctima, que deberá ser notificada al efecto.", "Son de aplicación los beneficios establecidos por las leyes de estímulo educativo vigentes o por las que se dicten en el ámbito nacional o en las jurisdicciones locales."], "z": ["15 años"]}, {"n": 20, "t": "Imposición de múltiples medidas y penas", "s": "Cuando no corresponda aplicar una pena privativa de libertad o cuando ésta sea sustituída conforme lo establecido en el artículo 11, el tribunal podrá imponer una (1) o más de las…", "p": ["Cuando no corresponda aplicar una pena privativa de libertad o cuando ésta sea sustituída conforme lo establecido en el artículo 11, el tribunal podrá imponer una (1) o más de las medidas y penas previstas en las Secciones 1ª y 2ª de este Capítulo, en forma simultánea o sucesiva."], "z": []}, {"n": 21, "t": "Incumplimiento de la pena", "s": "Ante el incumplimiento injustificado de una pena alternativa impuesta como condena, el juez deberá sustituirla por otra pena más severa, conforme lo dispuesto en el artículo 12.", "p": ["Ante el incumplimiento injustificado de una pena alternativa impuesta como condena, el juez deberá sustituirla por otra pena más severa, conforme lo dispuesto en el artículo 12."], "z": []}, {"n": 22, "t": "Suspensión de la prescripción de la acción penal", "s": "Además de las causales previstas en el Código Penal, la prescripción de la acción penal para los delitos en cuyo juzgamiento se aplique esta ley se suspende en los supuestos de:", "p": ["Además de las causales previstas en el Código Penal, la prescripción de la acción penal para los delitos en cuyo juzgamiento se aplique esta ley se suspende en los supuestos de:", "a) delitos para cuyo juzgamiento fuera necesaria la resolución de cuestiones previas o prejudiciales que deban ser resueltas en otro juicio;", "b) sustanciación de los procedimientos de mediación;", "c) intervención del profesional previsto en la Ley Nacional de Salud Mental Nº 26.657.", "Finalizada la causa de la suspensión, se reanuda el plazo de la prescripción de la acción penal."], "z": []}, {"n": 23, "t": "Supervisor", "s": "Una vez determinadas las medidas previstas en el artículo 8º o las penas enunciadas en el artículo 12, el juez deberá designar un supervisor especializado a cargo del seguimiento,…", "p": ["Una vez determinadas las medidas previstas en el artículo 8º o las penas enunciadas en el artículo 12, el juez deberá designar un supervisor especializado a cargo del seguimiento, asistencia y control del imputado.", "Las provincias y la Ciudad Autónoma de Buenos Aires normarán sobre los procesos de nombramiento, remoción y sanción de los supervisores, como así todo lo referido a su situación procesal, siguiendo los lineamientos generales del presente artículo.", "El supervisor deberá contar con conocimientos y formación académica en educación, pedagogía infantojuvenil, psicología, adicciones y trabajo social.", "Se deberá garantizar que la cantidad de adolescentes asignados a cada supervisor permita el adecuado seguimiento y supervisión de cada uno de los adolescentes imputados.", "El supervisor deberá:", "a) mantener entrevistas semanales con el adolescente y seguir, asistir, supervisar y controlar su evolución durante el proceso y su detención;", "b) elaborar informes mensuales sobre la educación, formación y actitud del adolescente, detallando su desempeño, evolución y demás datos de interés que se incorporarán al legajo personal;", "c) procurar resolver los problemas personales, familiares o de salud mental o de adicciones del adolescente;", "d) relacionarse y trabajar en conjunto con los demás profesionales intervinientes."], "z": []}, {"n": 24, "t": "Inimputabilidad", "s": "En ningún caso los menores inimputables serán pasibles de las sanciones previstas en la presente ley.", "p": ["En ningún caso los menores inimputables serán pasibles de las sanciones previstas en la presente ley.", "La declaración de inimputabilidad del niño, niña o adolescente no implicará en ningún caso la suspensión de la investigación, que deberá continuar a los efectos de determinar la existencia y circunstancias del hecho ilícito y la presunta intervención de terceras personas que pudieran estar involucradas."], "z": []}, {"n": 25, "t": "Determinación de la inimputabilidad", "s": "En forma previa a la declaración de la inimputabilidad de adolescentes que tuvieran entre catorce (14) y dieciocho (18) años de edad, el juez deberá:", "p": ["En forma previa a la declaración de la inimputabilidad de adolescentes que tuvieran entre catorce (14) y dieciocho (18) años de edad, el juez deberá:", "a) ordenar un peritaje psicológico y psiquiátrico, así como otros estudios que estimase necesarios para determinar si la persona inimputable resulta peligrosa para sí o para terceros, o si existe riesgo de que incurra en nuevos delitos. A estos fines, también podrá ordenar un peritaje médico con finalidad preventiva de consumo problemático, y solicitar en su caso recomendaciones para su recuperación;", "b) ordenar un amplio informe ambiental para comprobar sus condiciones de vida, familia, educación, trabajo, estudios, contención y comprobar su relación con la sociedad;", "c) consultar al equipo interdisciplinario y dar intervención en forma conjunta o alternativa, según resulte necesario, a:", "c.1) los organismos de protección de derechos del niño para que implementen los controles, brinden la colaboración y la asistencia legalmente establecidas.", "c.2) los equipos de salud conforme la Ley Nacional de Salud Mental Nº 26.657."], "z": ["18 años"]}, {"n": 26, "t": "Responsabilidad civil", "s": "La responsabilidad civil por los hechos a los que se refiere este Capítulo quedará a salvo y la acción pertinente se deberá ejercer ante los tribunales competentes.", "p": ["La responsabilidad civil por los hechos a los que se refiere este Capítulo quedará a salvo y la acción pertinente se deberá ejercer ante los tribunales competentes."], "z": []}, {"n": 27, "t": "Lugar de alojamiento", "s": "El adolescente deberá ser alojado en un instituto adecuado de detención, con personal que cuente con capacitación especializada en el trato con jóvenes en conflicto con la ley penal, que…", "p": ["El adolescente deberá ser alojado en un instituto adecuado de detención, con personal que cuente con capacitación especializada en el trato con jóvenes en conflicto con la ley penal, que cada jurisdicción organizará siguiendo los principios generales que se establecen en el presente Capítulo."], "z": []}, {"n": 28, "t": "Dirección", "s": "El lugar de alojamiento deberá ser dirigido por personal capacitado.", "p": ["El lugar de alojamiento deberá ser dirigido por personal capacitado."], "z": []}, {"n": 29, "t": "Características de la detención", "s": "La detención se deberá orientar a la educación, formación, resocialización y reinserción social del adolescente, mediante la tutela de la dignidad humana.", "p": ["La detención se deberá orientar a la educación, formación, resocialización y reinserción social del adolescente, mediante la tutela de la dignidad humana."], "z": []}, {"n": 30, "t": "Condiciones de detención", "s": "Se establecen las siguientes reglas:", "p": ["Se establecen las siguientes reglas:", "a) los adolescentes imputados no deberán tener contacto con personas detenidas mayores de edad. Al alcanzar la mayoría de edad y mientras aún no hubiere concluido la pena establecida, deberán cumplir el resto de la condena en los establecimientos penitenciarios para mayores de edad.", "A petición del interesado, y con la aceptación de las autoridades del establecimiento respectivo, el adolescente que llegara a la mayoría de edad podrá seguir en el mismo instituto especializado hasta la finalización del año calendario en que hubiera alcanzado la mayoría, siempre que ello fuera conveniente para la continuidad de un tratamiento médico o psicológico, o de un programa educativo o laboral;", "b) dentro de los lugares de detención, los menores en conflicto con la ley penal serán ubicados atendiendo a los siguientes criterios:", "b.1) personalidad, características personales y condiciones de salud.", "b.2) edad de los alojados, se debe procurar respetar las franjas etarias.", "b.3) identidad cultural y educativa.", "b.4) naturaleza cautelar o punitiva de la privación de la libertad."], "z": []}, {"n": 31, "t": "Atención médica, psicológica y psiquiátrica", "s": "Se deberá garantizar el acceso a asistencia médica y psicológica a cargo de profesionales de la salud especializados en adolescentes.", "p": ["Se deberá garantizar el acceso a asistencia médica y psicológica a cargo de profesionales de la salud especializados en adolescentes. Solo el juez competente podrá autorizar las salidas del lugar de detención en los casos en que deba ser atendido fuera del establecimiento, salvo supuestos de urgencia que deberán ser informados al tribunal."], "z": []}, {"n": 32, "t": "Actividades formativas y de capacitación laboral", "s": "El adolescente privado de libertad tendrá derecho a recibir formación y capacitación laboral a fin de lograr una futura inserción social y laboral.", "p": ["El adolescente privado de libertad tendrá derecho a recibir formación y capacitación laboral a fin de lograr una futura inserción social y laboral. Se deberá brindar, en lo posible, una amplia oferta de cursos y talleres que le permitan elegir entre aquellos de acuerdo con sus intereses y capacidades."], "z": []}, {"n": 33, "t": "Actividades deportivas, culturales, religiosas y recreativas", "s": "Se deberá promover en la medida de lo posible el desarrollo de actividades deportivas, culturales, religiosas, en su caso, y de acuerdo a la preferencia del adolescente, y recreativas,…", "p": ["Se deberá promover en la medida de lo posible el desarrollo de actividades deportivas, culturales, religiosas, en su caso, y de acuerdo a la preferencia del adolescente, y recreativas, orientadas a una efectiva inclusión social.", "Los adolescentes tendrán derecho al acceso a libros, diarios y revistas, con las limitaciones pertinentes, música y a las diversas fuentes de información existentes."], "z": []}, {"n": 34, "t": "Informe trimestral", "s": "El director del instituto especializado deberá enviar a la autoridad judicial competente un informe trimestral sobre la situación del adolescente, su evolución, prácticas y el desarrollo…", "p": ["El director del instituto especializado deberá enviar a la autoridad judicial competente un informe trimestral sobre la situación del adolescente, su evolución, prácticas y el desarrollo del tratamiento individual."], "z": []}, {"n": 35, "t": "Regla general", "s": "En el supuesto de que el juez o fiscal consideren que el adolescente presenta un uso problemático de drogas o alcohol, se deberá recabar la opinión del equipo interdisciplinario, que…", "p": ["En el supuesto de que el juez o fiscal consideren que el adolescente presenta un uso problemático de drogas o alcohol, se deberá recabar la opinión del equipo interdisciplinario, que mantendrá las entrevistas necesarias para que el adolescente realice el tratamiento que sea adecuado en el ámbito que corresponda."], "z": []}, {"n": 36, "t": "Comunicación al juez civil", "s": "Si se dispusiera la internación del adolescente, el juez penal deberá remitir copia del legajo personal, de los antecedentes y de la información necesaria del adolescente al juez civil…", "p": ["Si se dispusiera la internación del adolescente, el juez penal deberá remitir copia del legajo personal, de los antecedentes y de la información necesaria del adolescente al juez civil correspondiente a los fines pertinentes."], "z": []}, {"n": 37, "t": "Incumplimiento del plazo razonable de juzgamiento. Falta grave", "s": "La dilación injustificada del proceso, normada en el segundo párrafo del artículo 5°, inciso h), de la presente ley, hará incurrir al juez y al fiscal en falta grave y se informará a sus…", "p": ["La dilación injustificada del proceso, normada en el segundo párrafo del artículo 5°, inciso h), de la presente ley, hará incurrir al juez y al fiscal en falta grave y se informará a sus efectos al Consejo de la Magistratura, o al área disciplinaria pertinente según la jurisdicción, a la Procuración General de la Nación y al tribunal y fiscal superiores, según corresponda."], "z": []}, {"n": 38, "t": "Especialización", "s": "La sustanciación de los procesos penales comprendidos en esta ley, el control de las medidas y de la ejecución de las sanciones deberán estar a cargo de jueces, fiscales, defensores y…", "p": ["La sustanciación de los procesos penales comprendidos en esta ley, el control de las medidas y de la ejecución de las sanciones deberán estar a cargo de jueces, fiscales, defensores y órganos con capacitación especializada en el trato con jóvenes en conflicto con la ley penal y con conocimientos del espíritu y de los contenidos y alcance de la Convención sobre los Derechos del Niño, de las normas internacionales, de los pronunciamientos de la Corte Interamericana de Derechos Humanos, de la Corte Suprema de Justicia de la Nación y de los tribunales superiores y de la presente ley.", "Los agentes que desempeñen funciones en los institutos especializados de detención deberán contar con capacitación especializada y no podrán intervenir en ningún caso en el tratamiento de personas mayores de edad privadas de su libertad.", "El Consejo de la Magistratura, la Procuración General de la Nación, la Defensoría General de la Nación y los órganos establecidos para la selección de los fiscales, defensores y jueces en cada jurisdicción local, deberán adecuar su procedimiento para la selección de magistrados, fiscales y defensores con competencia para aplicar la presente ley con el objeto de corroborar fehacientemente la especialidad, conocimiento, experiencia o capacidad de los postulantes en derecho penal juvenil."], "z": []}, {"n": 39, "t": "Medidas de coerción", "s": "Las medidas de coerción impuestas en el marco de la aplicación de la presente ley solo podrán fundarse en el peligro real de fuga o de obstaculización de la investigación, en los…", "p": ["Las medidas de coerción impuestas en el marco de la aplicación de la presente ley solo podrán fundarse en el peligro real de fuga o de obstaculización de la investigación, en los términos del artículo 17 del Código Procesal Penal Federal (ley 27.063 y sus modificatorias).", "En ningún caso el plazo de prisión preventiva podrá superar el impuesto por el artículo 1º de la ley 24.390, conforme la modificación introducida por la ley 25.430."], "z": []}, {"n": 40, "t": "Derechos de las víctimas de delitos", "s": "Además de los derechos y garantías previstos por la Ley de Derechos y Garantías de las Personas Víctimas de Delitos Nº 27.372, las víctimas de delitos, en el marco del presente régimen,…", "p": ["Además de los derechos y garantías previstos por la Ley de Derechos y Garantías de las Personas Víctimas de Delitos Nº 27.372, las víctimas de delitos, en el marco del presente régimen, tendrán derecho a:", "a) ser asistidas en forma especializada con el objeto de propender a su recuperación psíquica, física y social, durante el tiempo que indiquen los profesionales intervinientes; a tales efectos, se encontrarán a disposición de las víctimas psicólogos y asistentes sociales del Ministerio de Justicia;", "b) recibir gratuitamente el patrocinio jurídico que solicite para ejercer sus derechos y, en su caso, para querellar, si por sus circunstancias personales se encontraran imposibilitadas de solventarlo; en tales casos, deberán ser asistidas por defensores públicos de las víctimas o por abogados especializados del Ministerio de Justicia;", "c) participar, si es de su interés, en instancias de mediación con el adolescente imputado."], "z": []}, {"n": 41, "t": "Criterio de oportunidad", "s": "El fiscal podrá prescindir total o parcialmente del ejercicio de la acción penal respecto de un adolescente imputado solamente si el delito que se le atribuye tiene prevista una pena…", "p": ["El fiscal podrá prescindir total o parcialmente del ejercicio de la acción penal respecto de un adolescente imputado solamente si el delito que se le atribuye tiene prevista una pena máxima inferior o igual a seis (6) años de prisión, siempre que ninguno de los hechos imputados haya importado la muerte de la víctima, una grave violencia física o psíquica sobre las personas o, si se tratare de delitos culposos, no existieran lesiones gravísimas ni se haya causado la muerte o un daño psíquico grave a la víctima y el adolescente imputado no registrare condenas u otros procesos en trámite con auto de procesamiento o auto procesal equivalente firme. La decisión de prescindir del ejercicio de la acción penal deberá fundamentarse en los parámetros precedentes y en las circunstancias del hecho, las causas que lo motivaron y el resarcimiento del daño, si lo hubiera.", "La decisión deberá ser informada a la víctima, quien podrá intervenir en el proceso conforme lo determinado en la Ley de Derechos y Garantías de las Personas Víctimas de Delitos Nº 27.372, y oponerse al criterio propiciado por el fiscal, en cuyo caso deberá resolver el fiscal superior jerárquico conforme a lo dispuesto a las leyes y resoluciones respectivas y sin perjuicio de las facultades acordadas a la querella.", "Sin perjuicio de que el fiscal decida aplicar en un caso concreto algún criterio de oportunidad en los términos del presente artículo, podrá igualmente darle intervención a la justicia civil o a organismos especializados para su control y seguimiento."], "z": ["6 años"]}, {"n": 42, "t": "Mediación penal juvenil", "s": "En cualquier etapa del proceso con anterioridad al dictado de la sentencia, el Ministerio Público Fiscal, la víctima o el imputado, cuando se cumplan los requisitos exigidos para la…", "p": ["En cualquier etapa del proceso con anterioridad al dictado de la sentencia, el Ministerio Público Fiscal, la víctima o el imputado, cuando se cumplan los requisitos exigidos para la procedencia de la aplicación del principio de oportunidad reglado en el artículo 41, podrán solicitar que se inicie un proceso de mediación penal ante el juez para delitos cuya pena máxima no sea superior a los seis (6) años. Este procedimiento tendrá carácter confidencial, voluntario, imparcial e informal y se le deberá dar intervención a todas las partes. El consentimiento de la víctima será condición necesaria, bajo consecuencia de nulidad, para la procedencia de la mediación. La oposición del fiscal será vinculante."], "z": ["6 años"]}, {"n": 43, "t": "Suspensión del proceso a prueba", "s": "Si al adolescente imputado se le atribuyera la comisión de un delito cuyo mínimo de pena no exceda de los tres (3) años de prisión y no resultare posible la mediación, el juez podrá…", "p": ["Si al adolescente imputado se le atribuyera la comisión de un delito cuyo mínimo de pena no exceda de los tres (3) años de prisión y no resultare posible la mediación, el juez podrá disponer, a solicitud del imputado y con la conformidad del Ministerio Público Fiscal, la suspensión del proceso a prueba.", "El adolescente imputado deberá ofrecer hacerse cargo de la reparación del daño en la medida de lo posible. El pedido de suspensión del proceso a prueba deberá sustanciarse en audiencia oral, bajo consecuencia de nulidad, con la participación del adolescente imputado, su defensor, la asesoría tutelar, el Ministerio Público Fiscal y la víctima, que será escuchada.", "Será condición que el imputado abandone en favor del Estado los bienes que, en caso de condena, serían pasibles de decomiso.", "No será causa para el rechazo de la suspensión del juicio a prueba que el delito tenga prevista pena de multa conjunta o alternativa a la de prisión.", "La suspensión del proceso podrá extenderse entre uno (1) y tres (3) años de acuerdo a las circunstancias concretas del hecho imputado y según las características personales del autor.", "Las tareas comunitarias que se impongan deberán establecerse de acuerdo con lo previsto en el artículo 12, inciso f), de la presente ley."], "z": ["3 años"]}, {"n": 44, "t": "Condiciones de cumplimiento", "s": "Las condiciones de cumplimiento determinadas en virtud de los institutos regulados en los artículos 42 y 43 de la presente ley podrán incluir las medidas establecidas en la Sección 1ª…", "p": ["Las condiciones de cumplimiento determinadas en virtud de los institutos regulados en los artículos 42 y 43 de la presente ley podrán incluir las medidas establecidas en la Sección 1ª del Capítulo IV, si fueran necesarias para lograr que el adolescente imputado asuma compromisos que coadyuven a su educación, formación intelectual, emocional, adaptación social y trabajo. En caso de aplicarse alguna de estas medidas al suspenderse el juicio a prueba, su plazo de duración no podrá exceder de tres (3) años."], "z": ["3 años"]}, {"n": 45, "t": "Plazos y cumplimiento", "s": "Si el adolescente imputado cumpliera con las obligaciones asumidas durante el plazo establecido, se extinguirá la acción penal a su respecto.", "p": ["Si el adolescente imputado cumpliera con las obligaciones asumidas durante el plazo establecido, se extinguirá la acción penal a su respecto.", "Si se verificara el incumplimiento injustificado por parte del adolescente imputado de las condiciones impuestas, el juez dispondrá que se continúe con la tramitación del proceso y se reanuden los plazos suspendidos o que no se compute el tiempo que hubiera demorado ese incumplimiento."], "z": []}, {"n": 46, "t": "Supervisor", "s": "El supervisor establecido en el Capítulo VI de esta ley deberá ser designado entre una lista de profesionales del Ministerio de Justicia y contar con conocimientos y formación académica…", "p": ["El supervisor establecido en el Capítulo VI de esta ley deberá ser designado entre una lista de profesionales del Ministerio de Justicia y contar con conocimientos y formación académica en alguna de estas especialidades, a saber: educación, pedagogía infantojuvenil, psicología, adicciones o trabajo social."], "z": []}, {"n": 47, "t": "", "s": "En los procesos penales seguidos contra niños, niñas o adolescentes, regirán todos los principios, derechos y garantías que surgen del sistema procesal acusatorio previsto en el Código…", "p": ["En los procesos penales seguidos contra niños, niñas o adolescentes, regirán todos los principios, derechos y garantías que surgen del sistema procesal acusatorio previsto en el Código Procesal Penal Federal (ley 27.063 y sus modificatorias), de conformidad con el régimen de implementación previsto en la ley 27.150."], "z": []}, {"n": 48, "t": "Derogación", "s": "Derógase la ley 22.278 y sus modificatorias.", "p": ["Derógase la ley 22.278 y sus modificatorias."], "z": []}, {"n": 49, "t": "Adecuación de regímenes procesales", "s": "Se invita a las provincias y a la Ciudad Autónoma de Buenos Aires a adecuar la legislación procesal penal y las normas administrativas aplicables a los adolescentes desde los catorce…", "p": ["Se invita a las provincias y a la Ciudad Autónoma de Buenos Aires a adecuar la legislación procesal penal y las normas administrativas aplicables a los adolescentes desde los catorce (14) años de edad hasta los dieciocho (18) años de edad a los principios, garantías y derechos consagrados en esta ley."], "z": ["14 años", "18 años"]}, {"n": 50, "t": "Control de la implementación", "s": "El control de la implementación de esta ley estará a cargo del Poder Ejecutivo nacional a través de la autoridad de aplicación que determine, el cual promoverá el trabajo coordinado con…", "p": ["El control de la implementación de esta ley estará a cargo del Poder Ejecutivo nacional a través de la autoridad de aplicación que determine, el cual promoverá el trabajo coordinado con otras áreas y el desarrollo de intervenciones basadas en evidencia con el objetivo de reducir la reincidencia delictual."], "z": []}, {"n": 51, "t": "Asignación presupuestaria", "s": "Las erogaciones que requiere el cumplimiento de la presente ley se atenderán con los recursos que se incluyan en las leyes presupuestarias correspondientes a cada ejercicio.", "p": ["Las erogaciones que requiere el cumplimiento de la presente ley se atenderán con los recursos que se incluyan en las leyes presupuestarias correspondientes a cada ejercicio. Al efecto de su implementación durante el ejercicio presupuestario correspondiente al año de su entrada en vigencia, destínase el monto total de pesos veintitrés mil setecientos treinta y nueve millones ciento cincuenta y cinco mil trescientos tres con ocho centavos ($23.739.155.303,08), a fin de hacer frente a los gastos dispuestos por la presente ley, conforme el siguiente detalle: pesos tres mil ciento treinta y un millones novecientos noventa y seis mil setecientos ochenta y cuatro con veintiocho centavos ($3.131.996.784,28), con cargo a la Jurisdicción 40 Ministerio de Justicia, inciso 1 - gastos en personal, partida principal 1.8, fuente de financiamiento 13.a., pesos veinte mil seiscientos siete millones ciento cincuenta y ocho mil quinientos dieciocho con ochenta centavos ($20.607.158.518,80), con cargo a la Jurisdicción 10 - Defensoría General de la Nación, programa 17, actividad 01. La Nación, las provincias y la Ciudad Autónoma de Buenos Aires podrán celebrar convenios de colaboración y cooperación a los efectos de dar cumplimiento a todos los estándares previstos en el presente régimen. Estos acuerdos podrán versar sobre el traslado o alojamiento de adolescentes en conflicto con la ley penal en extraña jurisdicción."], "z": []}, {"n": 52, "t": "Vigencia", "s": "La presente ley entrará en vigencia a los ciento ochenta (180) días de su publicación en el Boletín Oficial.", "p": ["La presente ley entrará en vigencia a los ciento ochenta (180) días de su publicación en el Boletín Oficial."], "z": ["180 días"]}, {"n": 53, "t": "", "s": "Comuníquese al Poder Ejecutivo nacional.", "p": ["Comuníquese al Poder Ejecutivo nacional."], "z": []}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),C=D.chapters,A=D.arts;
const $=s=>document.querySelector(s),M=$('#main'),S=$('#side'),H=$('header.bar');
const COL=['#5a4fc2','#2b72b0','#217d62','#b65e29','#ae4269','#836e1f','#4f5d77'];
const B={},CH={};A.forEach(a=>B[a.n]=a);
const arts=i=>C[i].secs.flatMap(s=>s.arts);
C.forEach((c,i)=>arts(i).forEach(n=>CH[n]=i));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const rub=a=>a.t||'Artículo '+a.n;
const lab=i=>'Capítulo '+C[i].n;
const rng=i=>{const s=arts(i);return s.length>1?`Arts. ${s[0]}–${s[s.length-1]}`:`Art. ${s[0]}`};
const sty=i=>`--ac:${COL[i%COL.length]}`;
const ref=h=>h.replace(/(art[íi]culos?\s+)(\d{1,2}[º°]?(?:(?:,\s*|\s+y\s+)\d{1,2}[º°]?)*)(\s+(?:de la ley|del c[oó]digo))?/gi,(m,p,ns,ext)=>ext?m:p+ns.replace(/\d{1,2}/g,n=>B[n]?`<a class="x" href="#/a/${n}">${n}</a>`:n)+'');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('No se pudo copiar'));
const hh=()=>document.documentElement.style.setProperty('--hh',H.offsetHeight+'px');

/* búsqueda */
const STOP=new Set('de del la las el los y e o en a al un una por con para que se su sus es lo como'.split(' '));
const stem=w=>/^\d+$/.test(w)?w:w.length>5?w.slice(0,-2):w.length>4?w.slice(0,-1):w;
const toks=q=>(norm(q).match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w)||/\d/.test(w)).map(stem);
const hl=(t,ts)=>{if(!ts.length)return esc(t);let o='',p=0;for(const m of t.matchAll(/[\p{L}\d]+/gu)){o+=esc(t.slice(p,m.index));const n=norm(m[0]);o+=ts.some(s=>n.startsWith(s))?`<mark>${esc(m[0])}</mark>`:esc(m[0]);p=m.index+m[0].length}return o+esc(t.slice(p))};
let lib='';
const setLib=v=>{lib=v;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))};

/* vistas */
function side(){S.innerHTML='<h5>Índice</h5>'+C.map((c,i)=>`<a href="#/c/${i}" data-i="${i}" style="${sty(i)}">${lab(i)}<small>${esc(c.name)}</small></a>`).join('');
 $('#chips').innerHTML=`<button class="chip" data-l="" aria-pressed="true">Toda la ley</button>`+C.map((c,i)=>`<button class="chip" data-l="${i}" title="${esc(c.name)}" aria-pressed="false">Cap. ${c.n}</button>`).join('')}
function card(a,o={}){const ix=CH[a.n],ts=o.ts||[];
 return `<article class="art" id="a${a.n}" style="${sty(ix)}"><header><span class="num">Art. ${a.n}</span><div><h4>${hl(rub(a),ts)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</h4><p class="sum">${o.snip?hl(o.snip,ts):esc(a.s)}</p>${a.z.length&&!o.snip?`<div class="zs">${a.z.map(z=>`<span class="pz">⏱ ${esc(z)}</span>`).join('')}</div>`:''}</div></header>
 <div class="acts">${o.snip?`<a class="btn sm" href="#/a/${a.n}">Abrir en su capítulo</a>`:`<button class="btn sm" data-a="t">Ver texto completo</button><button class="ghost sm" data-a="c" data-n="${a.n}">Copiar</button><button class="ghost sm" data-a="l" data-n="${a.n}">Enlace</button>`}</div>
 ${o.snip?'':`<div class="full" hidden>${a.p.map(p=>`<p${/^([a-z]|[a-z]\.\d)\)\s/.test(p)?' class="inc"':''}>${ref(esc(p))}</p>`).join('')}</div>`}</article>`}
const foot=()=>`<p class="foot">Texto de la Ley 27.801 (Régimen Penal Juvenil), sancionada el 27 de febrero de 2026 y publicada en el Boletín Oficial el 9 de marzo de 2026 (e. 09/03/2026 N° 13028/26). Según su artículo 52, entra en vigencia a los 180 días de su publicación. Las síntesis y los plazos se extraen automáticamente del texto de cada artículo y son solo una guía de lectura: verificá siempre con la versión oficial.</p>`;
function cardC(i){const s=arts(i),t=s.slice(0,3).map(n=>rub(B[n])).join(' · ')+(s.length>3?' · …':'');
 return `<a class="card" href="#/c/${i}" style="${sty(i)}"><h3><span class="tag tint">${lab(i)}</span><br>${esc(C[i].name)}</h3><p>${esc(t)}</p><div class="meta"><span>${rng(i)}</span><span>${s.length} art.</span></div></a>`}
function home(){const z=A.reduce((k,a)=>k+a.z.length,0);
 M.style.cssText='';M.innerHTML=`<section class="hero"><span class="kick">República Argentina</span><h1>Régimen Penal Juvenil</h1><p>Ley 27.801: el régimen penal para adolescentes desde los catorce años hasta los dieciocho. Con índice navegable, síntesis de cada artículo, referencias cruzadas y búsqueda por capítulo.</p>
 <div class="pills"><div class="pill"><b>${A.length}</b><span>artículos</span></div><div class="pill"><b>${C.length}</b><span>capítulos</span></div><div class="pill"><b>${z}</b><span>plazos y edades detectados</span></div></div>
 <div class="go"><input id="gn" inputmode="numeric" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button></div></section>
 <div class="sec"><h2>Capítulos</h2><span>Acceso rápido a cada capítulo de la ley</span></div><div class="grid">${C.map((_,i)=>cardC(i)).join('')}</div>${foot()}`;
 const go=()=>{const v=+$('#gn').value;B[v]?location.hash='/a/'+v:toast('Ingresá un artículo entre 1 y '+A.length)};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function chapter(i){const c=C[i],s=arts(i);M.style.cssText=sty(i);
 let h=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><a href="#/c/${i}">${lab(i)}</a></nav><header class="nh tint"><span class="kick">${lab(i)}</span><h1>${esc(c.name)}</h1><div class="meta"><span>${rng(i)}</span><span>${s.length} artículo${s.length>1?'s':''}</span></div></header>
 <div class="box"><h4>Contenido del capítulo</h4><ul>${s.map(n=>`<li><a href="#/a/${n}"><b>Art. ${n}</b> – ${esc(rub(B[n]))}</a></li>`).join('')}</ul></div>
 <div class="bar2"><button class="btn sm" data-a="all">Expandir todos los textos</button><button class="ghost sm" data-a="none">Contraer todos</button></div>`;

 h+=`<div class="pn">${i?`<a class="ghost" href="#/c/${i-1}">← ${lab(i-1)}</a>`:'<span></span>'}${i<C.length-1?`<a class="ghost" href="#/c/${i+1}">${lab(i+1)} →</a>`:''}</div>`+foot();

function find(v){const ts=toks(v);if(!ts.length)return route();
 if(/^\d+$/.test(v.trim())&&B[+v]){location.hash='/a/'+v;return}
 M.style.cssText='';const rs=A.filter(a=>(!lib||CH[a.n]==+lib)&&ts.every(t=>(a._x=a._x||norm(rub(a)+' '+a.p.join(' '))).includes(t)));
 rs.sort((x,y)=>ts.every(t=>norm(rub(y)).includes(t))-ts.every(t=>norm(rub(x)).includes(t)));
 const snip=a=>{const b=a.p.join(' '),n=norm(b);let k=n.indexOf(ts[0]);k=Math.max(0,k-70);return(k?'…':'')+b.slice(k,k+240)+(b.length>k+240?'…':'')};
 M.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${lib?' · '+lab(+lib):''}</span></div><p class="hint">Entiende varias palabras en cualquier orden y busca también en el texto completo.</p>`+
 (rs.map(a=>card(a,{ts,snip:snip(a),sub:lab(CH[a.n])+' · '+C[CH[a.n]].name})).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de capítulo.</p>')}
function setT(a,hide){a.querySelector('.full').hidden=hide;a.querySelector('[data-a=t]').textContent=hide?'Ver texto completo':'Ocultar texto completo'}
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/([ca])\/(\d+)/);S.classList.remove('open');
 const ci=m?(m[1]=='c'?+m[2]:CH[+m[2]]):null;setLib(ci!=null&&C[ci]?String(ci):'');
 if(!m||(m[1]=='c'&&!C[+m[2]])||(m[1]=='a'&&!B[+m[2]])){home();scrollTo(0,0);S.querySelectorAll('a').forEach(a=>a.classList.remove('on'));return}
 chapter(ci);if(m[1]=='c')scrollTo(0,0);else{const e=$('#a'+m[2]);e.classList.add('hit');setT(e,false);setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}
document.addEventListener('click',e=>{
 const c=e.target.closest('.chip');if(c){$('#q').value='';setLib(c.dataset.l);location.hash=c.dataset.l?'/c/'+c.dataset.l:'/';route();return}
 const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a,art=b.closest('.art');
 if(k=='t')setT(art,!art.querySelector('.full').hidden);
 else if(k=='all'||k=='none')document.querySelectorAll('.art').forEach(x=>setT(x,k=='none'));
 else if(k=='c'){const a=B[+b.dataset.n];copy(`Artículo ${a.n}.- ${a.t}\n\n`+a.p.join('\n'),'Texto copiado')}
 else if(k=='l')copy(location.href.split('#')[0]+'#/a/'+b.dataset.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>find(e.target.value),180)};

$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#11151e';r.dataset.theme=dk?'light':'dark'};
