y simple."],"s":"Será considerado acto sujeto al pago del impuesto que esta ley determina, aquel que se formalice en forma epistolar, por carta, cable o telegrama, siempre que se verifique cualquiera de las siguientes condiciones:"},{"n":176,"t":"Interdependencia","p":["Si en un mismo instrumento se formalizan entre las mismas partes varios actos que versan sobre un mismo objeto y guardan relación de interdependencia entre sí, sólo debe abonarse el impuesto correspondiente al acto cuyo gravamen resulte mayor.","Si el instrumento no reuniera esas condiciones, cada acto abonará el impuesto que, aisladamente considerado, le corresponde."],"s":"Si en un mismo instrumento se formalizan entre las mismas partes varios actos que versan sobre un mismo objeto y guardan relación de interdependencia entre sí, sólo debe abonarse el impuesto correspondiente al acto cuyo…"},{"n":177,"t":"Ejemplares","p":["Si los instrumentos se extienden en varios ejemplares de un mismo tenor, el impuesto sólo deberá pagarse en uno de ellos; en los demás ejemplares, a solicitud del poseedor, la Dirección dejará constancia del impuesto pagado."],"s":"Si los instrumentos se extienden en varios ejemplares de un mismo tenor, el impuesto sólo deberá pagarse en uno de ellos; en los demás ejemplares, a solicitud del poseedor, la Dirección dejará constancia del impuesto pagado."},{"n":178,"t":"Perfeccionamiento de Contratos con Entes Oficiales","p":["Cuando se trate de contratos celebrados con el Estado Nacional, Provincial o la Municipalidad o sus dependencias y organismos o con las empresas y entidades que les pertenezcan total o parcialmente, que para su aprobación se encuentren sujetos a un acto expreso de autoridad pública, a los fines del impuesto de esta ley dichos contratos se considerarán perfeccionados en el momento en que la autoridad preste la conformidad respectiva y a partir de la fecha en que se notifique a la misma."],"s":"Cuando se trate de contratos celebrados con el Estado Nacional, Provincial o la Municipalidad o sus dependencias y organismos o con las empresas y entidades que les pertenezcan total o parcialmente, que para su aprobación se…"},{"n":179,"t":"Contra documentos","p":["Los contra documentos en instrumento público o privado, estarán sujeto al mismo impuesto aplicable a los actos que contradicen."],"s":"Los contra documentos en instrumento público o privado, estarán sujeto al mismo impuesto aplicable a los actos que contradicen."},{"n":180,"t":"Responsables","p":["Los que otorguen, endosen, autoricen o conserven en su poder por cualquier título o razón, actos o instrumentos sujetos al impuesto, son solidariamenteresponsables del gravamen omitido parcial o totalmente y de las multas aplicables.","El impuesto correspondiente a las escrituras públicas, será pagado bajo responsabilidad directa del notario titular del Registro, sin perjuicio de la solidaridad de los adscriptos porlas escrituras que autoricen y de la prevista en el párrafo anterior, de las partes intervinientes.","Si una parte está exenta del pago del impuesto en los actos y contratos bilaterales, la exención alcanzará sólo a la mitad del impuesto. Las fianzas quedan comprendidas en este régimen en En dicha eventualidad, sólo deberá abonarse el tributo por toda la correspondencia que se refiere a un mismo acto.","Quedan comprendidos como actos jurídicos y operaciones gravados, los contratos entre ausentes con cláusulas de aceptación ficta formalizados mediante propuestas, pedidos,presupuestos, compromiso o promesa de venta, proformas, ofertas o cartas de ofertas aceptadas tácitamente o en forma pura y simple.","Interdependencia todos los casos.","Cuando alguno de los otorgantes esté exento del impuesto en los actos y contratos multilaterales, la exención beneficiará el acto en forma proporcional al interés que tenga en el mismo la parte exenta.","En los actos y contratos unilaterales corresponderá la exención total del impuesto cuando la exención subjetiva beneficie al otorgante o al deudor. Por el contrario, corresponderá aplicar la totalidad del tributo si aquella beneficia al tomador, destinatario o parte no obligada.","Los convenios sobre traslación del impuesto sólo tendrán efectos entre las partes y no podrán oponerse al Fisco."],"s":"Los que otorguen, endosen, autoricen o conserven en su poder por cualquier título o razón, actos o instrumentos sujetos al impuesto, son solidariamenteresponsables del gravamen omitido parcial o totalmente y de las multas…"},{"n":181,"t":"Contratos de Seguro","p":["También están sujetos al Impuesto de Sellos que establezca la Ley XXII","– N.° 25, Ley de Alícuotas, los contratos de seguros, excepto los de seguro de vida obligatorio."],"s":"También están sujetos al Impuesto de Sellos que establezca la Ley XXII"},{"n":182,"t":"Operaciones registradas en Bolsas y Mercados - Operaciones sometidas a Arbitraje","p":["Pagarán la tasa que fije por cada parte, las operaciones de compra venta al contado o a plazo, de mercaderías, cereales, oleaginosas, productos o subproductos de la agricultura, ganadería o minería y frutos del país, semovientes, títulos, acciones y debentures, así como las contrataciones de obras y servicios, siempre que sean registradas en las bolsas y mercados que las mismas agrupan, de acuerdo con las disposiciones estatutarias y reglamentarias de aquella y concertadas bajo las siguientes condiciones, que podrá reglamentar el Poder Ejecutivo:","a) que sean formalizadas por las partes o por comisionistas intermediarios, de acuerdo con lo que al respecto establezcan las bolsas o mercados;","b) que se inscriban en los registros que al efecto llevarán las bolsas y mercados para el registro de las operaciones.","Cuando se trate de operaciones que se realicen durante las ruedas oficiales, la alícuota a aplicar se fijará por cada parte en la forma dispuesta por la Ley XXII – N.° 25, Ley de Alícuotas, idéntico tratamiento tendrán las operaciones de igual naturaleza que excepcionalmente se efectuarenfuera de las horas de rueda.","Pagarán asimismo la tasa que se establezca, las operaciones enumeradas en el primer párrafo, respecto de las cuales se hayan pactado compromisos para someter las cuestiones relativas o los respectivos contratos, al arbitraje de las entidades que determine la Secretaría de Hacienda de la Nación, siempre que el compromiso arbitral no esté prohibido y que sea irrevocable, con designación de la entidad que intervendrá en la constitución del tribunal arbitral y, asimismo, que se encuentre debidamente inscripto en los registros habilitados al efecto por dicha entidad."],"s":"Pagarán la tasa que fije por cada parte, las operaciones de compra venta al contado o a plazo, de mercaderías, cereales, oleaginosas, productos o subproductos de la agricultura, ganadería o minería y frutos del país,…"},{"n":183,"t":"Gravamen en operaciones sobre inmuebles","p":["Estarán sujetos al impuesto proporcional que fije la Ley XXII – N.° 25, Ley de Alícuotas sobre los montos imponibles respectivos, los actos que se mencionan a continuación, en oportunidad del otorgamiento de las escrituras públicas:","a) compraventa o permuta de inmuebles o cualquier otro acto por el cual se transfiere el dominio de estos bienes a título oneroso. Están incluidas las transferencias del dominio de inmuebles que se realicen con motivo de:","1) aportes de capital a sociedades;","2) transferencias de establecimientos comerciales o industriales;","3) disolución de sociedades y adjudicación a los socios;","b) constitución de derechos reales sobre inmuebles;","c) emisión de debentures con garantía hipotecaria;","d) los casos mencionados en el artículo 1998 del Código Civil y Comercial de la Nación;","e) los títulos informativos de propiedad, al dictarse el auto de aprobación judicial."],"s":"Estarán sujetos al impuesto proporcional que fije la Ley XXII – N.° 25, Ley de Alícuotas sobre los montos imponibles respectivos, los actos que se mencionan a continuación, en oportunidad del otorgamiento de las escrituras…"},{"n":184,"t":"Actos sin escrituras - Boletos de compraventa y permuta - Pago a cuenta","p":["El impuesto previsto en el artículo anterior debe abonarse aún en los casos en que no se realice escritura pública, por existir disposiciones legales que así lo autoricen en las oportunidades que determine la Dirección.","En el caso de transferencias de inmuebles se computará como pago a cuenta el Impuesto de Sellos pagado sobre los boletos de compraventa y permuta y las cesiones de los mismos cuando se trate de bienes inmuebles, o sobre los contratos de sociedad en la parte correspondiente al valor de los inmuebles."],"s":"El impuesto previsto en el artículo anterior debe abonarse aún en los casos en que no se realice escritura pública, por existir disposiciones legales que así lo autoricen en las oportunidades que determine la Dirección."},{"n":185,"t":"Contratos de Ejecución Sucesivas","p":["En los contratos de ejecución sucesiva, pagos periódicos y otros análogos, el impuesto se aplicará sobre el valor correspondiente a la duración total o a los primeros cinco (5) años, si son por más tiempo. Si la duración no fuera prevista, el impuesto se calculará como si aquella fuera de cinco (5) años."],"s":"En los contratos de ejecución sucesiva, pagos periódicos y otros análogos, el impuesto se aplicará sobre el valor correspondiente a la duración total o a los primeros cinco (5) años, si son por más tiempo"},{"n":186,"t":"Prórrogas","p":["El valor de los contratos en que se prevea su prórroga, se determinará de la manera siguiente:","a) cuando la prórroga deba producirse por el sólo silencio de las partes o aun cuando exista el derecho de rescisión por manifestación expresa de voluntad de ambas o de una de ellas, se calculará el tiempo de duración del contrato inicial más el período de prórroga. Cuando la prórroga sea por tiempo indeterminado, se la considerará como de cuatro (4) años, que se sumará al período inicial; si la prórroga fuera por períodos sucesivos se tomará el total de éstos, hasta un máximo de cinco (5) años;","b) cuando la prórroga está supeditada a una expresa declaración de voluntad de ambas partes o de una de ellas, se tomará como monto imponible sólo el que corresponde al período inicial; al instrumentarse la prórroga o la opción, se abonará el impuesto correspondiente a la misma."],"s":"El valor de los contratos en que se prevea su prórroga, se determinará de la manera siguiente:"},{"n":187,"t":"Sociedades formalizadas en la jurisdicción - Prórrogas - Aumento de capital","p":["El impuesto correspondiente a los contratos de constitución de sociedad y ampliaciones de su capital social formalizados en esta jurisdicción se calculará sobre el monto del capital social o del aumento, respectivamente, deduciéndose el valor asignado a los bienes mencionados en el inciso e) del artículo 171. Si correspondiere deducir el valor de aportes constituidos por bienes inmuebles, se tomará el valor asignado en el contrato o la valuación fiscal, el que sea mayor.","En las prórrogas del término de duración de la sociedad se tomará el importe del capital social sin considerar la naturaleza y ubicación de los bienes que lo componen.","Si simultáneamente con la prórroga se aumentase el capital social, se tomará el importe del capital primitivo y del aumento, deduciéndose el valor de los nuevos bienes que se aporten con motivo del aumento, que correspondan a la naturaleza de los designados en el inciso e) del artículo 171. Si correspondiere deducir el valor de nuevos aportes constituidos por bienes inmuebles, se tomará el valor asignado en el contrato o la valuación fiscal, el que sea mayor."],"s":"El impuesto correspondiente a los contratos de constitución de sociedad y ampliaciones de su capital social formalizados en esta jurisdicción se calculará sobre el monto del capital social o del aumento, respectivamente,…"},{"n":188,"t":"Sociedades formalizadas fuera de la jurisdicción – Prórrogas","p":["El impuesto que corresponda por los aportes en bienes de la naturaleza de los designados en el inciso e) del artículo 170, se pagará en oportunidad de constituirse la sociedad o formalizarse el aumento, sobre el valor asignado a dichos bienes en el respectivo contrato.","Si se tratara de bienes inmuebles se estará al valor asignado en el contrato o la valuación fiscal, el que sea mayor.","Las prórrogas del término de duración del contrato de sociedades domiciliadas en la Provincia que se convinieran fuera de ella pagarán el impuesto de acuerdo con lo establecido en el párrafo segundo del artículo 187 en oportunidad de documentarse las respectivas prórrogas."],"s":"El impuesto que corresponda por los aportes en bienes de la naturaleza de los designados en el inciso e) del artículo 170, se pagará en oportunidad de constituirse la sociedad o formalizarse el aumento, sobre el valor asignado…"},{"n":189,"t":"Sociedades - Aportes de inmuebles","p":["En el caso de escrituras traslativas de dominio de bienes inmuebles efectuadas en cumplimiento del compromiso de aportes, se deducirá el importe del impuestoque se hubiera satisfecho en oportunidad de constituirse la sociedad o formalizarse el aumento de su capital social, en un todo de acuerdo con lo establecido en el artículo 184, último párrafo.","Si no se demostrase el pago del impuesto correspondiente al acto de constitución de la sociedad o aumento de su capital social, se integrará la totalidad de la tasa por la transferenciade inmuebles, con más la multa correspondiente sobre el impuesto omitido por aquellos actos.En las transferencias de inmuebles como aporte de capital a sociedades, el impuesto se aplicará sobre el valor de los inmuebles o de su valuación fiscal, el que sea mayor."],"s":"En el caso de escrituras traslativas de dominio de bienes inmuebles efectuadas en cumplimiento del compromiso de aportes, se deducirá el importe del impuestoque se hubiera satisfecho en oportunidad de constituirse la sociedad…"},{"n":190,"t":"Sociedades Anónimas - Sociedades constituidas en el extranjero","p":["Las sociedades anónimas abonarán el impuesto en el momento de su constitución definitiva.","En los casos de constitución por suscripción pública corresponderá abonar el impuesto en el momento de ser labrada el acta de la asamblea constitutiva.","Los aumentos del capital accionario de cualquier tipo de sociedad abonarán el impuesto en el momento de ser decidido el aumento sobre la respectiva acta de asamblea o sobre una copia de la misma en la cual el órgano de representación social deberá dejar constancia de su autenticidad.","En las prórrogas del término de duración de la sociedad se tomará el importe del capital social sin considerar la naturaleza y ubicación de los bienes que lo componen.","Si simultáneamente con la prórroga se aumentase el capital social, se tomará el importe del capital primitivo y del aumento, deduciéndose el valor de los nuevos bienes que se aporten con motivo del aumento, que correspondan a la naturaleza de los designados en el inciso e) del artículo 171. Si correspondiere deducir el valor de nuevos aportes constituidos por bienes inmuebles, se tomará el valor asignado en el contrato o la valuación fiscal, el que sea mayor.","Sociedades formalizadas fuera de la jurisdicción – Prórrogas Cuando por ley o por los estatutos o por resolución de la asamblea que decide el aumento, sea necesaria la escritura pública para dejar perfeccionado este último, el impuesto podrá abonarse en oportunidad de otorgarse la respectiva escritura.","Si luego de tales actos se efectuaren aportes en bienes comprendidos en el inciso e) del artículo 171, se admitirá la devolución de la parte del impuesto ingresado que corresponda a dichos bienes, debidamente actualizado de acuerdo con las disposiciones vigentes, desde la fecha de pago hasta la fecha de efectivización del aporte referido. Las sociedades constituidas en el extranjero que solicitan la inscripción de sus contratos en la Dirección General de Personas Jurídicas y Registro Público de la Provincia u organismos correspondientes, pagarán el impuesto sobre el capital asignado a la sucursal o agencia a establecer en la Provincia, que se determinará, en su caso, por estimación fundada. Este impuesto deberá hacerse efectivo antes de procederse a la inscripción."],"s":"Las sociedades anónimas abonarán el impuesto en el momento de su constitución definitiva."},{"n":191,"t":"Pólizas de fletamento","p":["En las pólizas de fletamento el valor imponible estará constituido por el importe del flete más el de la capa o gratificación al capitán."],"s":"En las pólizas de fletamento el valor imponible estará constituido por el importe del flete más el de la capa o gratificación al capitán."},{"n":192,"t":"Derechos Reales","p":["En la constitución de derechos reales el monto imponible será el precio pactado, o en su caso, la suma garantizada; en su defecto, los siguientes:","a) en el usufructo vitalicio se determinará de acuerdo a la siguiente escala sobre la valuación fiscal del o de los inmuebles:","Edad del usufructuario: Porcentaje hasta 30 años 90% Más de 30 y hasta 40 80% Más de 40 y hasta 50 70% Más de 50 y hasta 60 50% Más de 60 y hasta 70 40% Más de 70 20%","b) en el usufructo temporario se determinará como monto imponible el 20% de la valuación del bien por cada período de diez (10) años de duración, o la parte proporcional en caso de períodos o fracciones menores. Si el usufructo fuera por un tiempo mayor de treinta (30) años se aplicará la escala del inciso a);","c) en la transferencia de la nuda propiedad se considerará como monto imponible la mitad de la valuación fiscal;","d) en la constitución de derechos de uso y habitación se considerará como monto imponible el cinco por ciento (5%) de la valuación fiscal por cada año o fracción de duración;","e) en la constitución de otros derechos reales se determinará el valor por estimación fundada, de conformidad con lo dispuesto en el artículo 204."],"s":"En la constitución de derechos reales el monto imponible será el precio pactado, o en su caso, la suma garantizada; en su defecto, los siguientes:"},{"n":193,"t":"Operaciones sobre Inmuebles","p":["El impuesto establecido en el inciso a) del artículo 183 se abonará sobre el precio total, aun cuando en el contrato se reconozcan hipotecas preexistentes que se descuenten del precio. Si el adquirente se hace cargo de esas obligaciones, salvo que se prorrogue su vencimiento en cuyo caso se aplicará el impuesto del inciso b) del artículo 183independientemente del gravamen a la transferencia del dominio.","Si en el contrato no se fijare precio o el pactado en el mismo, determinado según el párrafo anterior, fuera inferior a la valuación fiscal del inmueble, se tomará ésta como monto imponible."],"s":"El impuesto establecido en el inciso a) del artículo 183 se abonará sobre el precio total, aun cuando en el contrato se reconozcan hipotecas preexistentes que se descuenten del precio"},{"n":194,"t":"Permutas","p":["En las permutas el impuesto se aplicará sobre la mitad de la suma de los valores que se permuten. Si en la permuta de inmuebles no hubiera valor asignado a los mismos o éste fuera inferior a las valuaciones fiscales de los bienes respectivos, el impuestose aplicará sobre la mitad del valor resultante de la suma de las valuaciones fiscales."],"s":"En las permutas el impuesto se aplicará sobre la mitad de la suma de los valores que se permuten"},{"n":195,"t":"Casos de inmuebles ubicados en varias jurisdicciones","p":["Si los inmuebles están ubicados parte en jurisdicción de la Provincia y parte en otra jurisdicción, y la transferencia se realiza por un precio sin determinarse en el respectivo instrumento los valores que corresponden a cada jurisdicción, el impuesto se aplicará sobre el importe resultante de proporcionar el monto imponible, en función de las valuaciones fiscales de los inmuebles. En ningún caso el monto imponible podrá ser inferiora la valuación fiscal del o de los inmuebles ubicados en esta jurisdicción."],"s":"Si los inmuebles están ubicados parte en jurisdicción de la Provincia y parte en otra jurisdicción, y la transferencia se realiza por un precio sin determinarse en el respectivo instrumento los valores que corresponden a cada…"},{"n":196,"t":"Permutas de bienes ubicados en varias jurisdicciones","p":["En caso de permutas que comprendan bienes ubicados en varias jurisdicciones el impuesto se aplicará sobre la valuación fiscal total del o de los inmuebles ubicados en esta jurisdicción o sobre el mayor valor asignado a tales bienes."],"s":"En caso de permutas que comprendan bienes ubicados en varias jurisdicciones el impuesto se aplicará sobre la valuación fiscal total del o de los inmuebles ubicados en esta jurisdicción o sobre el mayor valor asignado a tales…"},{"n":197,"t":"Hipotecas sobre inmuebles ubicados en varias jurisdicciones","p":["Cuando se constituyen hipotecas sobre inmuebles ubicados en varias jurisdicciones sin afectarse a cada uno de ellos con una cantidad líquida, el impuesto se aplicará sobre la valuación fiscal del o de los inmuebles ubicados en esta jurisdicción. En ningún caso el impuesto podrá aplicarse sobre una suma mayor a la del crédito garantizado."],"s":"Cuando se constituyen hipotecas sobre inmuebles ubicados en varias jurisdicciones sin afectarse a cada uno de ellos con una cantidad líquida, el impuesto se aplicará sobre la valuación fiscal del o de los inmuebles ubicados en…"},{"n":198,"t":"Locación - Varias jurisdicciones","p":["En los contratos de locación o sublocación de inmuebles ubicados en varias jurisdicciones, así como los que instrumenten la locación de servicios y obras - públicas o privadas - sobre tales bienes, el impuesto se aplicará:","a) En los contratos de locación o sublocación de los bienes: sobre el importe resultante de proporcionar el monto imponible en función de las valuaciones fiscales de los inmuebles, siempre que del instrumento respectivo no surja el monto atribuible a cada jurisdicción;","b) en los contratos de locación de servicios y obras públicas o privadas; sobre el valor que corresponda a la parte realizada o a realizarse en jurisdicción de la Provincia."],"s":"En los contratos de locación o sublocación de inmuebles ubicados en varias jurisdicciones, así como los que instrumenten la locación de servicios y obras - públicas o privadas - sobre tales bienes, el impuesto se aplicará:"},{"n":199,"t":"Transferencias de Establecimientos Comerciales Industriales","p":["En las transferencias de establecimientos comerciales o industriales, el monto imponible será el precio neto de la operación. Si en la transferencia estuvieran comprendidos bienes inmuebles ubicados en la Provincia, se procederá análogamente a lo dispuesto en el artículo 193."],"s":"En las transferencias de establecimientos comerciales o industriales, el monto imponible será el precio neto de la operación"},{"n":200,"t":"Renta Vitalicia","p":["En los contratos de renta vitalicia se aplicará el impuesto sobre el valor de los bienes entregados para obtenerla. Cuando éstos fueran inmuebles se aplicarán las reglas del artículo 192."],"s":"En los contratos de renta vitalicia se aplicará el impuesto sobre el valor de los bienes entregados para obtenerla"},{"n":201,"t":"Contratos de Fideicomiso o Transferencia Fiduciaria","p":["Los contratos de transmisión de la propiedad fiduciaria de muebles e inmuebles resultan alcanzados por el Impuesto, siempre que se cumplan los requisitos configuradores del hecho imponible a saber: territorialidad, onerosidad e instrumentación.","En los actos de constitución y transferencia fiduciaria, cuando el desplazamiento de los bienes en favor del fiduciario se produce en seguridad de una deuda propia del transmitente, la base imponible del impuesto será la suma garantida.","En los contratos de fideicomiso de administración, el impuesto se liquidará a la alícuota del diez por mil (10 ‰) sobre la retribución periódica pactada con el fiduciario.","En los casos de contratos de fideicomiso financiero el impuesto se liquidará sobre el monto de la suma garantida aplicando la alícuota del diez por mil (10 ‰).","El acto de transferencia del dominio a la fiduciaria a los efectos de la constitución del patrimonio de afectación no tributará el impuesto de esta ley, siempre que se trate de un actogratuito.","Se reputará oneroso el acto de adjudicación de unidades funcionales debiendo liquidarse el impuesto tomando como base imponible el valor asignado a las unidades funcionales a adjudicarse o la valuación fiscal de las mismas, el que fuere mayor."],"s":"Los contratos de transmisión de la propiedad fiduciaria de muebles e inmuebles resultan alcanzados por el Impuesto, siempre que se cumplan los requisitos configuradores del hecho imponible a saber: territorialidad, onerosidad…"},{"n":202,"t":"Contratos de leasing","p":["En los contratos de leasing cuando el dador conviene transferir al tomador la tenencia de un bien cierto y determinado para su uso y goce, contra el pago de un canon periódico y le confiere una opción de compra por un precio, la base imponible estará constituida por el valor del canon establecido en función al tiempo del contrato.","En el caso que la transferencia de dominio de inmuebles o muebles registrables tuviere lugar como consecuencia de un contrato de leasing, la base imponible al momento de formalizarse la escritura, estará constituida por el valor adjudicado al bien -canon de la locación más valor residual-, o su valuación fiscal, el que fuera mayor.","El impuesto correspondiente al canon abonado durante la vigencia del contrato de leasing, será tomado como pago a cuenta en caso de realizarse la opción de compra del bien.","En caso de prórroga del contrato por un nuevo período a opción del tomador, conforme a la ley de contrato de leasing (artículo 15 de la Ley Nacional N.º 25248), se deberá abonar el impuesto por el período de la prórroga. La base imponible estará constituida por el valor del canon incluido el débito fiscal del Impuesto al Valor Agregado.","Cuando la prórroga es por tiempo indeterminado para calcular la base imponible se debe seguir el criterio establecido en el artículo 186."],"s":"En los contratos de leasing cuando el dador conviene transferir al tomador la tenencia de un bien cierto y determinado para su uso y goce, contra el pago de un canon periódico y le confiere una opción de compra por un precio,…"},{"n":203,"t":"Conversión","p":["Si el valor imponible se expresa en moneda extranjera, el impuesto deberá liquidarse sobre el equivalente en pesos moneda argentina, al tipo de cambio convenido por las partes. A falta de éste o si estando convenido fuera incierto, se tomará el vigente al primer día hábil anterior a la fecha del acto; si hubiere distintos tipos de cambio la conversión se hará sobre la base del tipo vendedor fijado por el banco que actúe como agente financiero de la provincia de Misiones, al cierre de las operaciones de ese día."],"s":"Si el valor imponible se expresa en moneda extranjera, el impuesto deberá liquidarse sobre el equivalente en pesos moneda argentina, al tipo de cambio convenido por las partes"},{"n":204,"t":"Valor Indeterminado – Estimación","p":["Cuando el valor de los actos sujetos a impuestos sea indeterminado, las partes deberán estimarlo a continuación del instrumento en que lo formalicen, fundándose en elementos de juicio adecuado.","Cuando se fije como precio el corriente en fecha futura, el impuesto se pagará con arreglo al precio corriente en la fecha de otorgamiento del acto.","Cuando se careciese de antecedentes y no pudiera practicarse una estimación del valor económico atribuible al acto, se satisfará un impuesto fijo, que establecerá la Ley XXII – N.° 25, Ley de Alícuotas."],"s":"Cuando el valor de los actos sujetos a impuestos sea indeterminado, las partes deberán estimarlo a continuación del instrumento en que lo formalicen, fundándose en elementos de juicio adecuado."},{"n":205,"t":"Valor indeterminado – Impugnación","p":["La Dirección podrá impugnar la estimación efectuada por las partes y practicarla de oficio sobre la base de los elementos justificativos que se determinen, sin perjuicio de las sanciones que se impongan a las partes si la estimación practicada por ellos careciese de fundamentos justificativos o éstos resultaren falsos."],"s":"La Dirección podrá impugnar la estimación efectuada por las partes y practicarla de oficio sobre la base de los elementos justificativos que se determinen, sin perjuicio de las sanciones que se impongan a las partes si la…"},{"n":206,"t":"Exenciones","p":["Están exentos:","Exenciones Subjetivas de Pleno Derecho","a) de pleno derecho del pago del impuesto establecido en este Título:","1) el Estado Nacional, los Estados Provinciales, la Ciudad Autónoma de Buenos Aires y las Municipalidades, sus dependencias y reparticiones autárquicas o descentralizadas.","No se encuentran comprendidas en esta exención las empresas o entidades pertenecientes total o parcialmente a los Estados mencionados, cuando realicen operaciones comerciales, industriales, bancarias o de prestación de servicios a terceros a título oneroso;","2) los Estados extranjeros acreditados ante el Gobierno de la Nación;","3) los partidos políticos reconocidos legalmente;","Exenciones Subjetivas que no Operan de Pleno Derecho","b) decláranse exentos del impuesto previsto en el presente Título:","1) las fundaciones, asociaciones civiles de asistencia social, de caridad, beneficencia, de educación e instrucción, gremiales, mutuales, instituciones religiosas, científicas, artísticas, culturales, deportivas, de fomento vecinal, protectoras de animales, cooperativas de trabajo o consumo y las entidades públicas no estatales que conforme a sus estatutos, documentos de constitución o instrumento legal de creación, según corresponda, no persigan fines de lucro y los ingresos, réditos o patrimonio social sean destinados exclusivamente al objeto previsto en sus estatutos sociales, actas de constitución o documento similar y en ningún caso se distribuyan directa o indirectamente entre sus asociados, consejeros o directivos bajo la forma de utilidades, gratificaciones, honorarios u otros conceptos similares;","2) los Obispados de la Provincia de Misiones y sus dependencias jurisdiccionales;","3) los actos de constitución, modificación y disolución de Cooperativas de Vivienda constituidas con arreglo a la Ley deCooperativas (LeyNacional N.º 20337) ymodificatorias,inscriptas en el Instituto Nacional de Asociativismo y Economía Social, y los trámites internos con los socios y en general, todos los actos y operaciones vinculadas con la actividadespecífica de dichas cooperativas.","Para gozar de las exenciones previstas en la presente norma, los contribuyentes deberán solicitar su reconocimiento a la Dirección General de Rentas, acompañando las pruebas que justifiquen la procedencia de la exención;","Exenciones Objetivas","c) declárense exentos del Impuesto de Sellos, además de los hechos imponibles previstos por leyes especiales, los siguientes actos, instrumentos públicos o privados, documentos, contratos, operaciones y registraciones:","1) los instrumentos correspondientes a créditos otorgados por bancos o instituciones oficiales en virtud de planes de fomento minero, forestal, agropecuario e industrial;","2) las fianzas y demás instrumentos que los empleados, funcionarios públicos, personal contratado por el Estado Provincial y Municipalidades y entidades autárquicas, descentralizadas u Organismos de la Constitución otorguen por razón de sus cargos;","3) los instrumentos otorgados a favor del Gobierno Nacional, de los Gobiernos Provinciales, de la Ciudad Autónoma de Buenos Aires y Municipales y de sus dependencias, que tengan por objeto documentar o afianzar obligaciones de carácter fiscal o previsional;","4) las transferencias de bienes muebles y las cesiones de derechos que han debido tributar el impuesto de esta ley con motivo de la constitución de sociedades, su modificación o ampliaciones de su capital;","5) las transferencias postales o telegráficas y los giros vendidos por entidades regidas por la Ley de Entidades Financieras (Ley Nacional N.º 21526), pagaderos a su presentación o hasta cinco (5) días vista;","6) los endosos efectuados en documentos a la orden;","7) las fianzas y otras obligaciones accesorias, como asimismo la constitución de prendas, cuando se pruebe que han sido constituidas para garantizar obligaciones que hayan pagado el Impuesto de Sellos correspondiente en la respectiva jurisdicción de otorgamiento o que se encontraban exentos del mismo, salvo que correspondan a créditos destinados a la adquisición de automóviles, embarcaciones, aeronaves o motos.","Si no se demostrare el pago del impuesto sobre el instrumento principal, o en su caso la exención, el documento en el cual se formalicen las obligaciones accesorias estará sometido al impuesto establecido en el presente Título o al que grava la operación principal, el que sea mayor, sin perjuicio de las sanciones que pueda corresponder;","8) las hipotecas constituidas en garantía de todo o parte del precio de adquisición del inmueble gravado. Quedan asimismo comprendidas en la presente exención las que se constituyan en garantía del préstamo acordado por instituciones bancarias oficiales para adquisición, refacción o ampliación del inmueble gravado, siempre que el mismo constituya única unidad habitacional;","9) los pagarés o las fianzas otorgados en garantía de ofertas en licitaciones o contrataciones directas con reparticiones públicas Nacionales, Provinciales, de la Ciudad Autónoma de Buenos Aires y Municipales, como asimismo las garantías otorgadas por los adjudicatarios;","10) los pagarés entregados como parte del precio de un contrato de compraventa deinmuebles, cuando se haya efectuado la escritura traslativa de dominio, siempre que llevenal dorso la certificación del notario ante el cual fuera otorgada dicha escritura, del queresulte la fecha y número de éste y el importe del impuesto pagado. No gozarán de estaexención los nuevos documentos que se otorguen para renovar las obligaciones no cumplidasa su vencimiento;","11) los valores o fianzas de terceros para garantizar operaciones de entidades de bien público;","12) los instrumentos públicos otorgados a favor de los Gobiernos Nacional, Provincial, de la Ciudad Autónoma de Buenos Aires y Municipales por los inmuebles adquiridos por cualquier título y que no hayan sido inscriptos en el Registro de la Propiedad Inmueble;","13) las cuentas o facturas con o sin especificación de precios y conforme del deudor, el recibo-factura establecido por la ley de factura de crédito (Ley Nacional N.º 24760) y normas complementarias, los vales que no consignen la obligación de pagar sumas de dinero y la simple constancia de remisión de mercaderías, consignen o no valores;","14) las divisiones y subdivisiones de hipotecas, sustitución del inmueble hipotecado, refuerzos de garantías hipotecarias y las modificaciones en las formas de pago de capital o intereses, siempre que no se modifique el plazo establecido originariamente para la extincióntotal del monto aún cuando se varíen los plazos de pago parciales convenidos;","15) los adelantos entre bancos y las transferencias que efectúen entre sí las casas matrices y sucursales de un mismo banco, con motivo de sus propias operaciones;","16) los depósitos y extracciones de cuenta corriente, caja de ahorro, cuentas especiales de ahorro y depósitos a plazo fijo realizados en entidades financieras y de ahorro y préstamo para la vivienda reguladas por las leyes respectivas;","17) las letras de cambio y órdenes de pago libradas sobre instituciones financieras regidas por la Ley de Entidades Financieras (Ley Nacional N.º 21526) y las Cooperativas de Crédito;","18) los actos, documentos o contratos referentes a la constitución, otorgamiento, autorización, renovación, inscripción o cancelación de las operaciones celebradas por los beneficiarios de los bancos oficiales nacionales o de la Provincia e Instituto Provincial de Desarrollo Habitacional (IPRODHA), en virtud de planes de vivienda que desarrollan, siempre que se traten de unidad habitacional o vivienda única;","19) la transformación, la fusión y la escisión de sociedades de acuerdo con la Ley General de Sociedades (Ley Nacional N.º 19550) y sus modificatorias. Esta exención es válida en tanto no se aumente el capital social, no se sustituyan los socios o no se prorrogue el plazo de duración de la sociedad o sociedades subsistentes. A los fines de este inciso no se considerará aumento de capital social, cuando el capital de la sociedad subsistente o de la nueva sociedad, en su caso, no fuese mayor a la suma de los capitales de las sociedades reorganizadas; con respecto al plazo, se considerará que no existe prórroga entanto y en cuanto el plazo de duración de la nueva sociedad o sociedad subsistente no supereel mayor plazo de las sociedades reorganizadas;","20) los contratos de seguros de vida obligatorios, individuales o colectivos;","21) las pólizas de seguros, sus endosos y reaseguros, cuando el tomador desarrolle actividades primarias agropecuarias, forestales y mineras. La Dirección General de Rentas dictará las normas para acreditar el carácter de operaciones exentas;","22) los contratos que instrumenten la realización de obras bajo el régimen de contratación de la Ley X – N.° 4, Ley de Obras Públicas, incluyendo los contratos de ejecución de obras realizadas a través del Instituto Provincial de Desarrollo Habitacional (IPRODHA) y los contratos de concesiones de obras públicas. Quedan excluidas de la presente exención los contratos de concesión de obras públicas en lamedida que sean retribuidas a través del sistema de peaje, solamente, en la proporción abonada por este sistema;","23) los créditos concedidos y sus garantías, para financiar operaciones de importación y exportación y las efectuadas con motivo de operaciones de cambio sujetas al impuesto sobrelas ventas, compras, cambio o permutas de divisas que se vinculan con aquella;","24) los actos, contratos u operaciones instrumentados relacionados con la emisión, suscripción, colocación o transferencia de certificados de depósito y warrants establecidos por las leyes respectivas (Ley Nacional N.º 9643);","25) los actos, contratos y operaciones que realicen las instituciones comprendidas en la Ley Nacional de Entidades Financieras, instrumentados o no, con motivo del otorgamiento, renovación, cancelación y refinanciación de créditos y préstamos, incluyendo las garantías que se constituyan, destinados al financiamiento de actividades primarias: forestales, agropecuarias o mineras;","26) los actos, contratos u operaciones instrumentados relacionados con la emisión, suscripción, colocación o transferencia de debentures;","27) los instrumentos, actos, contratos y operaciones de cualquier naturaleza y actos conexos, relacionados o vinculados con la emisión, suscripción, colocación, cesión, caución o transmisión de cédulas hipotecarias que realicen las entidades comprendidas en la Ley de Entidades Financieras (Ley Nacional N.º 21526). Esta exención alcanza a todo tipo de garantías personales o reales que se constituyan vinculadas con tales títulos;","28) los actos, contratos y operaciones que se instrumenten con motivo de la obtención, renovación, refinanciación o cancelación de créditos de cualquier naturaleza, y sus garantías,por parte del Gobierno de la Provincia y de las Municipalidades;","29) los actos jurídicos relacionados con la prospección, exploración de sustancias minerales;","30) las fianzas, avales y demás garantías personales, cuando sean otorgadas para garantizar contratos de locación o sublocación de bienes inmuebles y siempre que se formalicen en un mismo acto;","31) los actos, contratos u operaciones instrumentados relacionados con la emisión, suscripción, colocación o transferencias de obligaciones negociables establecidas por la ley respectiva (Ley Nacional N.º 23962). Esta exención alcanza además a todo tipo de garantíaspersonales o reales, constituidas a favor de los inversores o de terceros que garanticen la emisión, sean anteriores, simultáneas o posteriores a la misma;","32) las letras hipotecarias instituidas por la ley de financiamiento de la vivienda y construcción (Ley Nacional N. º 24441);","33) los conformes prestados con motivo de circularizaciones a deudores y acreedoresefectuadas en virtud de la ejecución de prácticas de auditoría interna o externa, y las conformidades prestadas en los estados, resúmenes o movimientos de cuentas corrientes de cualquier tipo, así como en los remitos y facturas, excepto las conformadas, siempre que reúnan los requisitos establecidos en las leyes respectivas;","34) quedan subsistentes las exenciones del Impuesto de Sellos establecidas en leyes especiales que no hubieren sido derogadas tácita o expresamente;","35) los contratos de trabajo o locación de servicios celebrados entre la Provincia, Municipalidades y sus dependencias o poderes, organismos de la Constitución y organismosautárquicos y descentralizados, sociedades del Estado, y anónimas con capital estatal mayoritario y quienes pasen a revistar categoría presupuestaria de personal temporario o contratado.","Los actos, instrumentos públicos o privados, documentos o contratos que instrumenten planes sociales, a través de subsidios, subvenciones, aportes no reintegrables u otros conceptos análogos, financiados con fondos: nacionales, provinciales, municipales o provenientes de entes binacionales, con destino a la promoción o utilización de mano de obra desocupada o subocupada en territorio de la provincia de Misiones, excluidos los contratos con empresas;","36) exímese del pago del Impuesto de Sellos a los contratos que celebren Electricidad de Misiones S.A. (EMSA) con los usuarios que tengan por objeto la electrificación rural.","Facúltase al Poder Ejecutivo a conceder exenciones totales o parciales, en forma general o particular, por razones económico-sociales que lo justifiquen."],"s":"Están exentos:"},{"n":207,"t":"Exención - Reorganización de Sociedades","p":["Estarán también exentos los actos que formalicen la reorganización de sociedades o fondos de comercio (fusión, escisión o división), siempre que no se prorrogue el término de duración de la sociedad subsistente o de la nueva sociedad, según corresponda, respecto a la de mayor plazo de las que se reorganicen. Si el capital de la sociedad subsistente o de la nueva sociedad, en su caso, fuera mayor a la suma de los capitales de las sociedades reorganizadas, se abonará el impuesto sobre el aumento de capital. Se entiende por reorganización de sociedades o fondos de comercio, las operaciones definidas como tales enla Ley de Impuesto a las Ganancias y sus modificaciones, su decreto reglamentario y las normas complementarias dictadas por la Agencia de Recaudación y Control Aduanero (ARCA)."],"s":"Estarán también exentos los actos que formalicen la reorganización de sociedades o fondos de comercio (fusión, escisión o división), siempre que no se prorrogue el término de duración de la sociedad subsistente o de la nueva…"},{"n":208,"t":"Hecho Imponible","p":["Están sujetas al impuesto proporcional que fije la ley, por año, las operaciones monetarias o financieras que representen entregas o recepciones de dinero, que devenguen intereses, efectuadas por entidades regidas por la Ley de Entidades Financieras (Ley Nacional N.º 21526), o sus modificatorias, con asiento en la Provincia, aunque se tratede sucursales o agencias de una entidad con domicilio fuera de ella.","El impuesto de este Capítulo se pagará sobre la base de los numerales establecidos para la liquidación de los intereses, en proporción al tiempo de utilización de los fondos en la forma y plazo que la Dirección General de Rentas establezca.","El impuesto será exigible a partir del momento en que los intereses se debiten, acrediten o abonen. En los casos de cuentas con saldos alternativamente deudores y acreedores, el gravamen deberá liquidarse en forma independiente sobre los numerales respectivos."],"s":"Están sujetas al impuesto proporcional que fije la ley, por año, las operaciones monetarias o financieras que representen entregas o recepciones de dinero, que devenguen intereses, efectuadas por entidades regidas por la Ley…"},{"n":209,"t":"","p":["En las operaciones monetarias y financieras previstas en el presente Capítulo el impuesto será soportado íntegramente por las entidades financieras, como sujetosde derecho y de hecho, las que en ningún caso podrán trasladar su incidencia a quienes contraten con las entidades financieras."],"s":"En las operaciones monetarias y financieras previstas en el presente Capítulo el impuesto será soportado íntegramente por las entidades financieras, como sujetosde derecho y de hecho, las que en ningún caso podrán trasladar su…"},{"n":210,"t":"Exenciones","p":["Están exentos del impuesto establecido en este Capítulo:","a) los depósitos en cajas de ahorro, cuentas especiales de ahorro y los depósitos a plazo fijo;","b) los créditos concedidos para financiar operaciones de importación y exportación;","c) los adelantos entre entidades bancarias regidas por la Ley Nacional N.º 21526 o sus modificatorias y las transferencias que efectúen entre sí las casas matrices y sucursales de unmismo banco con motivo de sus propias operaciones;","d) los créditos en moneda de curso legal en la República Argentina concedidos por los bancos a corresponsales del exterior;","e) los préstamos documentados en vales, billetes, pagarés, contratos de mutuo o reconocimiento de deudas y obligaciones de dar sumas de dinero, aunque tales actos se otorguen en distinta jurisdicción;","f) las escrituras hipotecarias y demás garantías otorgadas en seguridad de las operaciones sujetas al gravamen, aun cuando estas garantías sean extensivas a las futuras renovaciones de dichas operaciones.","Cuando las entregas o recepciones de dinero que devenguen intereses queden garantizadas mediante vales, billetes, pagarés, letras de cambio y órdenes de pago, o la firma de fórmulas en blanco de dichos documentos, se deberá abonar por los mismos el impuesto correspondiente."],"s":"Están exentos del impuesto establecido en este Capítulo:"},{"n":211,"t":"Infracciones","p":["Se considerarán infracciones:","a) omitir el pago del impuesto total o parcial;","b) no cumplir las disposiciones referentes al tiempo y forma de pagar el impuesto;","c) presentar copias o instrumentos privados o fotocopias de los mismos, sin demostrar el pago del impuesto;","d) invocar la existencia de un instrumento gravado sin demostrar que fue debidamente pagado el impuesto correspondiente o sin invocar o aportar medios eficaces para su comprobación cuando, por conformidad de partes dichos instrumentos produzcan efectos jurídicos en juicio;","e) no presentar la prueba del pago del impuesto cuando la Dirección General hubiera comprobado la existencia de un instrumento gravado;","f) emitir instrumentos sin fecha o lugar de otorgamiento, cuando de tales actos pudiera resultar un perjuicio a la renta fiscal;","g) no cumplir la obligación de retener el Impuesto de Sellos;","h) no conservar los instrumentos sujetos al impuesto o los comprobantes de pago respectivos, por el tiempo que las leyes hubieran establecido;","i) contradicción evidente entre los libros rubricados o autorizados por la Dirección, utilizados para satisfacer el gravamen por el sistema de declaración jurada, con los datos consignados en las respectivas declaraciones;","j) omitir de registrar en los libros respectivos, instrumentos en los que conste haberse satisfecho el gravamen por el sistema de declaración jurada. Se presumirá esta omisión sin admitirse prueba en contrario, cuando se comprobare la existencia de numeración de orden repetida en los documentos en que el impuesto se abone por declaración jurada;","k) no practicar los asientos en los libros especiales para el pago de impuesto sobre documentos por declaración jurada. Dentro de los plazos establecidos al efecto;","l) presentar las declaraciones juradas de este impuesto con datos inexactos o que comprendan actos con denominación indudablemente distinta a la que corresponda de acuerdo con su naturaleza jurídica."],"s":"Se considerarán infracciones:"},{"n":212,"t":"Sanciones","p":["Cuando se trate de Impuesto de Sellos, el monto de los recargos o multa será el siguiente:","a) la simple mora en el pago, cuando el mismo se efectúe espontáneamente, inclusive los casos en que el impuesto se abone por declaración jurada, será sancionado con una multa que resultará de aplicar la siguiente escala: hasta quince (15) días de retardo: el diez por ciento (10%) del impuesto que se ingrese fuera de término, más de quince (15) días y hasta tres (3) meses de retardo: el cincuenta por ciento (50%) del impuesto que se ingrese fuera de término. Más de tres (3) meses y hasta seis (6) meses de retardo: el cien por ciento (100%) del impuesto que se ingrese fuera de término.","Más de seis (6) meses y hasta nueve (9) meses de retardo: el ciento cincuenta por ciento (150%) del impuesto que se ingrese fuera de término. Más de nueve (9) y hasta doce (12) meses de retardo: el doscientos por ciento (200%) del impuesto que se ingrese fuera de término. Más de doce (12) meses de retardo: el doscientos cincuenta por ciento (250%) del impuesto que se ingrese fuera de término;","b) en los casos de incumplimiento de los deberes formales la multa será del uno por ciento (1%) del valor del impuesto que correspondiera con un mínimo de quince pesos cuando se trate de la primera infracción.","Para la segunda y las siguientes infracciones, la multa será la determinada en el párrafo anterior multiplicada por dos (2), cuatro (4), ocho (8), dieciséis (16) y como máximo treintay dos (32). La aplicación de la multa es sin perjuicio de los recargos por mora u otras sanciones;","c) en los casos de los incisos a) y f) del artículo 211 corresponderá una multa de tres (3) veces el impuesto respectivo debidamente actualizado en los de carácter proporcional y del décuplo en los fijos. En el caso del inciso f) del artículo 211, se considerará que los instrumentos fueron emitidos con un año de anterioridad a la toma de conocimiento de los mismos por parte de la Dirección General de Rentas, salvo pruebas fehacientes en contrario;","d) en los casos de defraudación, la multa será de tres (3) a diez (10) veces el impuesto que correspondiere satisfacer sin perjuicio de los recargos precedentemente indicados cuando procediere."],"s":"Cuando se trate de Impuesto de Sellos, el monto de los recargos o multa será el siguiente:"},{"n":213,"t":"Adulteración – Sanciones","p":["Sin perjuicio de la aplicación de las sanciones penales que pudieran corresponder y de lo dispuesto en el inciso d) del artículo 212 precedente, serán pasibles de una multa de tres (3) a diez (10) veces el impuesto omitido o que se pretendió omitir, quienesincurrieran en alguno de los siguientes hechos:","a) adulteración de la fecha de los instrumentos;","b) adulteración de las estampillas o la fecha de su inutilización;","c) adulteración del timbrado mecánico o la fecha de su emisión;","d) adulteración de las certificaciones de pago extendidas por la Dirección en ejemplares o copias de instrumentos gravados;","e) adulteración o destrucción de la documentación respecto de la cual los contribuyentes hubieran sido nombrados depositarios por la Dirección.","Se presumirá que existe adulteración cuando se observen diferencias entre los datos consignados por el inspector en las actas o planillas de cargos y el contenido de los documentos, salvo que éstos permaneciesen en paquetes lacrados y sellados que no presentensignos de violación o que los originales o las copias fotostáticas debidamente controladas sehubieran agregado al expediente."],"s":"Sin perjuicio de la aplicación de las sanciones penales que pudieran corresponder y de lo dispuesto en el inciso d) del artículo 212 precedente, serán pasibles de una multa de tres (3) a diez (10) veces el impuesto omitido o…"},{"n":214,"t":"Multa por simple Mora - Procedimiento – Pago","p":["La aplicación de la multa por simple mora en el pago del impuesto a que se refiere el artículo 212 será automática y no requerirá pronunciamiento alguno, debiendo hacerse efectiva juntamente con el pago del impuesto identificándose la imputación a dicho concepto.","No se habilitarán instrumentos fuera de fecha sin el pago simultáneo de la multa proporcionada al valor del impuesto debidamente actualizada de acuerdo con el Código Fiscal, sin perjuicio del derecho de los interesados a interponer, en su caso, la acción de repetición de la multa abonada."],"s":"La aplicación de la multa por simple mora en el pago del impuesto a que se refiere el artículo 212 será automática y no requerirá pronunciamiento alguno, debiendo hacerse efectiva juntamente con el pago del impuesto…"},{"n":215,"t":"Instrumentos sin Monto – Sanciones","p":["Si se comprobaren omisiones de impuestos sin determinar monto en razón de no haberse presentado los elementos probatorios necesarios, se impondrá la multa que fijará la Ley XXII – N.° 25, Ley de Alícuotas por cada documento, operación o período de liquidación de intereses, en su caso, según la importancia económica que hicieran presumir las pruebas reunidas."],"s":"Si se comprobaren omisiones de impuestos sin determinar monto en razón de no haberse presentado los elementos probatorios necesarios, se impondrá la multa que fijará la Ley XXII – N.° 25, Ley de Alícuotas por cada documento,…"},{"n":216,"t":"Notarios – Sanciones","p":["Los Notarios de Registro no podrán aceptar para darle fecha cierta, transcribir, ni dar fe de haber tenido a la vista instrumentos gravados, sin acreditar el pago del impuesto, debiendo dejar constancia en el cuerpo de la escritura, de la numeración, serie e importe de los valores con que se encuentren habilitados, o de la respectiva individualización del timbrado mecánico o de la autorización para abonar el impuesto por declaración jurada.","Tampoco podrán extender protestos de documentos en infracción, sin exigir su reposición o garantizarla para el primer día hábil siguiente.","La falta de cumplimiento de estos requisitos los constituirá en infractores, siendo pasibles de la multa prevista en el inciso c) del artículo 212 si se comprobaren omisiones de impuesto, o de la de su inciso b) si se tratara de una infracción formal."],"s":"Los Notarios de Registro no podrán aceptar para darle fecha cierta, transcribir, ni dar fe de haber tenido a la vista instrumentos gravados, sin acreditar el pago del impuesto, debiendo dejar constancia en el cuerpo de la…"},{"n":217,"t":"Multas - Base de Cálculo","p":["Para la fijación de las multas sólo se tendrá en cuenta el impuesto omitido en el instrumento u operación debidamente actualizado, con independencia del número de partes intervinientes en el acto o de infractores, siendo estos responsables solidarios."],"s":"Para la fijación de las multas sólo se tendrá en cuenta el impuesto omitido en el instrumento u operación debidamente actualizado, con independencia del número de partes intervinientes en el acto o de infractores, siendo estos…"},{"n":218,"t":"Infracciones - Representantes o Dependientes","p":["Las personas jurídicas, mandantes y empleadores son responsables solidariamente por las infracciones relativas a sus negocios, que cometan sus representanteso dependientes."],"s":"Las personas jurídicas, mandantes y empleadores son responsables solidariamente por las infracciones relativas a sus negocios, que cometan sus representanteso dependientes."},{"n":219,"t":"Multas - Independencia del Impuesto","p":["En todos los casos las multas se aplicarán sin perjuicio del impuesto que corresponda, del cual los infractores serán también solidariamente responsables."],"s":"En todos los casos las multas se aplicarán sin perjuicio del impuesto que corresponda, del cual los infractores serán también solidariamente responsables."},{"n":220,"t":"Plazo – Forma","p":["El impuesto debe abonarse dentro del plazo de quince (15) días hábiles, a contar desde el día siguiente del otorgamiento del acto, de su perfeccionamiento de acuerdo con las normas de este Código o del cumplimiento de efectos determinantes de la aplicación del Impuesto de Sellos.","Si el plazo del instrumento fuere menor, debe pagarse el impuesto antes del vencimiento de aquél.","Los demás derechos al presentarse, ordenarse o registrarse el acto. El cumplimiento de esta disposición se justificará con el sello fechador de expendio de valores o con la fecha del recibo otorgado por la entidad recepcionista y se abonará conforme a las siguientes reglas:","a) extendiendo los instrumentos en papel sellado por el valor respectivo;","b) habilitando con estampillas fiscales los instrumentos extendidos en papel sellado o complementándolos con éstos cuando el papel sea de inferior valor;","c) por medio del timbrado especial efectuado por la impresión oficial en formularios u otros papeles;","d) mediante depósitos que se realicen en las entidades habilitadas al efecto, en formularios especiales."],"s":"El impuesto debe abonarse dentro del plazo de quince (15) días hábiles, a contar desde el día siguiente del otorgamiento del acto, de su perfeccionamiento de acuerdo con las normas de este Código o del cumplimiento de efectos…"},{"n":221,"t":"Declaración Jurada","p":["La Dirección General cuando considere conveniente, podrá disponer que el Impuesto de Sellos, se abone por medio de declaraciones juradas que deberán serpresentadas en la forma y plazo que la Dirección determine."],"s":"La Dirección General cuando considere conveniente, podrá disponer que el Impuesto de Sellos, se abone por medio de declaraciones juradas que deberán serpresentadas en la forma y plazo que la Dirección determine."},{"n":222,"t":"Hecho Imponible","p":["Los billetes de loterías y rifas cualquiera sea su origen, que circulen y se vendan en el territorio de la Provincia, pagarán un impuesto que fijará la Ley XXII – N.° 25, Ley de Alícuotas sobre su valor escrito. Se considerará también sujeto al gravamen los bonos contribución de canje y similares que ofrezcan premios a sus adquirentes."],"s":"Los billetes de loterías y rifas cualquiera sea su origen, que circulen y se vendan en el territorio de la Provincia, pagarán un impuesto que fijará la Ley XXII – N.° 25, Ley de Alícuotas sobre su valor escrito"},{"n":223,"t":"Contribuyentes","p":["Son contribuyentes de este impuesto los compradores de billetes de loterías y rifas. La Dirección General de Rentas establecerá el momento y forma de pago."],"s":"Son contribuyentes de este impuesto los compradores de billetes de loterías y rifas"},{"n":224,"t":"Responsables","p":["Son responsables del pago del tributo y están obligados a asegurar su percepción en la forma y condiciones establecidas en el presente artículo los vendedores, distribuidores, introductores o representantes de las loterías y rifas.","Los responsables a que se refiere el apartado anterior, deberán inscribirse en un registro especial que al efecto llevará la Dirección General de Rentas, tanto si las rifas o loterías se juegan una sola vez o en períodos sucesivos.","Los inscriptos deberán estampar al dorso de los billetes de loterías y rifas un sello en que conste su nombre o el de la entidad correspondiente y el número de inscripción."],"s":"Son responsables del pago del tributo y están obligados a asegurar su percepción en la forma y condiciones establecidas en el presente artículo los vendedores, distribuidores, introductores o representantes de las loterías y…"},{"n":225,"t":"Secuestro de Billetes de Loterías y Rifas","p":["Sin perjuicio de las sanciones que puedan corresponder, en virtud de las disposiciones del Título Octavo del Libro Primero de este Código, la Dirección de Rentas procederá al secuestro de los billetes de loterías y rifas que no hubieren abonado el impuesto o carezcan del sello previsto en el artículo anterior.","A tal fin podrán solicitar la colaboración policial.","Si resultare premiado un billete secuestrado, el valor del producido del premio será imputado al pago del impuesto y sus accesorios."],"s":"Sin perjuicio de las sanciones que puedan corresponder, en virtud de las disposiciones del Título Octavo del Libro Primero de este Código, la Dirección de Rentas procederá al secuestro de los billetes de loterías y rifas que…"},{"n":226,"t":"Publicación","p":["Efectuado el sorteo, los responsables de este impuesto deberán publicar en órganos periodísticos o radiales, por tres días consecutivos, los números que hubieren resultado premiados."],"s":"Efectuado el sorteo, los responsables de este impuesto deberán publicar en órganos periodísticos o radiales, por tres días consecutivos, los números que hubieren resultado premiados."},{"n":227,"t":"","p":["Estarán exentos del impuesto establecido en el presente título las rifas y loterías emitidas por sociedades científicas, vecinales, de fomento, cooperadoras, entidades deportivas con personería jurídica y las que tengan por finalidad exclusiva la inversión total del producido en actos de beneficencia siempre que en la organización y venta no intervenga organización comercial y comparta los beneficios.","Las instituciones referidas deberán solicitar la exención del impuesto al Poder Ejecutivo con constancia expresa del destino de los fondos que se recaudaren.","La Dirección General de Rentas fiscalizará la inversión de los fondos de acuerdo con la declaración formalizada en la referida solicitud."],"s":"Estarán exentos del impuesto establecido en el presente título las rifas y loterías emitidas por sociedades científicas, vecinales, de fomento, cooperadoras, entidades deportivas con personería jurídica y las que tengan por…"},{"n":228,"t":"Servicios Administrativos","p":["Por los servicios que preste la Administración Pública y que por disposiciones de este Título o de leyes especiales estén sujetos a retribución deberán abonarselas tasas que fije la Ley XXII – N.° 25, Ley de Alícuotas."],"s":"Por los servicios que preste la Administración Pública y que por disposiciones de este Título o de leyes especiales estén sujetos a retribución deberán abonarselas tasas que fije la Ley XXII – N.° 25, Ley de Alícuotas."},{"n":229,"t":"Forma de pago","p":["Las tasas retributivas de servicios serán pagadas por medio de:","a) declaraciones juradas habilitadas;","b) depósito bancario en boletas especiales al efecto;","c) estampillas o valores fiscales;","d) en cualquier otra forma que determine la Dirección."],"s":"Las tasas retributivas de servicios serán pagadas por medio de:"},{"n":230,"t":"Actuaciones Administrativas","p":["Salvo disposición en contrario, todas las actuaciones ante la Administración Pública Provincial, abonarán una tasa general por expediente cualquiera fuerelacantidad de fojas utilizadas, elementos o documentos que se incorporen a los mismos.","Servicios Especiales Dicha tasa deberá satisfacerse en la oportunidad de iniciarse la actuación administrativa y sin perjuicio de las tasas por retribución de servicios especiales que se establezcan."],"s":"Salvo disposición en contrario, todas las actuaciones ante la Administración Pública Provincial, abonarán una tasa general por expediente cualquiera fuerelacantidad de fojas utilizadas, elementos o documentos que se incorporen…"},{"n":231,"t":"","p":["Quedan exentas del pago de la tasa general retributiva de servicios, las siguientes actuaciones administrativas:","1) las iniciadas por el Estado Nacional, el Estado Provincial, las Municipalidades de la Provincia,sus dependencias y reparticiones autárquicas. Las iniciadas por los demás Estados Provinciales bajo condición de reciprocidad;","2) las peticiones y presentaciones ante los poderes públicos en ejercicios de los derechos políticos;","3) las licitaciones por títulos de la deuda pública;","4) las actuaciones promovidas por asociaciones o colegios que agrupan las profesiones liberales;","5) expedientes que se originan con motivo de las relaciones entre el Ministerio competente y los colonos;","6) las promovidas con motivo de las relaciones jurídicas vinculadas con el trabajo en la parte correspondiente a los empleados y obreros o a sus causahabientes;","Las denuncias y demás actuaciones promovidas ante la autoridad competente, por cualquier persona o entidad sobre infracciones a las leyes obreras en indemnización por despido;","7) expedientes de jubilaciones y pensiones y documentos que deban agregarse a los mismos como consecuencia de su tramitación;","8) expedientes que tengan por objeto reconocimientos de servicios prestados a la Administración Pública;","9) las notas consultadas dirigidas a las reparticiones públicas;","10) las originadas por las fianzas de los empleados públicos en razón de sus funciones y las garantías en general por deudas al fisco;","11) pedido de licencia, justificaciones de inasistencia de los empleados públicos y certificados médicos que se adjuntan, así también como las legalizaciones de los mismos y trámites pertinentes;","12) los escritos presentados por los contribuyentes acompañando letras, giros, cheques, u otros documentos de libranzas para el pago de gravámenes;","13) reclamos sobre valuaciones y reajustes de afirmados, siempre que los mismos prosperen;","14) expedientes por devolución de impuestos, cuando el reclamo prospere;","15) solicitudes por exenciones impositivas, siempre que las mismas se resuelvan favorablemente;","16) expedientes por pago de haberes a los empleados públicos;","17) expedientes iniciados por los beneficiarios de seguro colectivos o por las autoridades respectivas;","18) expedientes sobre devolución de depósitos en garantía;","19) las autorizaciones para percibir devolución de tributos y las otorgadas para el cobro de la devolución de depósitos en garantía;","20) expedientes sobre pago de subvenciones;","21) los duplicados de certificados de deudas por impuestos, contribuciones o tasas que se agreguen a los corresponde judiciales;","22) cotizaciones de precios a pedido de reparticiones públicas, en los casos de compras directas autorizadas por el Poder Ejecutivo dentro de las prescripciones de la Ley VII – N.° 11, Ley de Contabilidad;","23) los expedientes iniciados por sociedades mutuales con personería jurídica;","24) las actuaciones formuladas a raíz de denuncias siempre que se certifiquen por el órgano administrativo que corresponde;","25) las informaciones que los profesionales hagan llegar al Ministerio competente comunicando la existencia de enfermedades infectocontagiosas y las que, en general, suministren, a la sección estadística, así como también las notas comunicando el traslado desus consultorios;","26) las actuaciones referentes al certificado de domicilio;","27) las informaciones requeridas por la administración con fines estadísticos;","28) en los procedimientos seguidos por la Dirección General de Rentas para la determinación de gravámenes y fiscalización de declaraciones juradas y cuando se requiera del Estado el pago de facturas o cuentas;","29) las declaraciones exigidas por las leyes impositivas y los reclamos correspondientes, siempre que se haga lugar a los mismos;","30) los expedientes referentes a donaciones de bienes a la Provincia;","31) la carta de pobreza eximirá del pago de servicios administrativos cualquiera sea el organismo que deba prestarlo;","32) las actuaciones relacionadas con los regímenes de las leyes de colonización."],"s":"Quedan exentas del pago de la tasa general retributiva de servicios, las siguientes actuaciones administrativas:"},{"n":232,"t":"Registro de la Propiedad: Exenciones","p":["No pagan tasa por servicio fiscal del Registro de la Propiedad:","a) el Estado Provincial, las Municipalidades de la Provincia, sus dependencias y reparticiones autárquicas, salvo aquellas entidades que el propio Estado organice como empresas lucrativas;","b) las divisiones o subdivisiones de hipotecas y las modificaciones en la forma de pago del capital e interés siempre que no se modifiquen los plazos contratados;","c) las inhibiciones y embargos voluntarios e hipotecas que tengan por fin garantizar pagos de tributos;","d) las declaraciones o rectificaciones de inscripciones que corrijan errores imputables a la administración;","e) las diligencias de oficios judiciales en las que consta que se actúe con la carta de pobreza;","f) las inscripciones en el Régimen de Protección de la Vivienda;","g) los contratos, actos y obligaciones que se otorguen en virtud de planes oficiales de colonización de acuerdo a la ley respectiva;","h) las Cédulas Hipotecarias Rurales emitidas por el Banco de la Nación Argentina;","i) los que gocen del beneficio de litigar sin gastos, con exclusión de los apoderados o letrados de las partes litigantes."],"s":"No pagan tasa por servicio fiscal del Registro de la Propiedad:"},{"n":233,"t":"Registro Provincial de las Personas","p":["Por las actuaciones realizadas ante el Registro Provincial de las Personas se abonarán las tasas, por los conceptos y montos que se fijen en la Ley XXII – N.° 25, Ley de Alícuotas."],"s":"Por las actuaciones realizadas ante el Registro Provincial de las Personas se abonarán las tasas, por los conceptos y montos que se fijen en la Ley XXII – N.° 25, Ley de Alícuotas."},{"n":234,"t":"Registro Provincial de las Personas – Exenciones","p":["Quedan exentas del pago de las tasas y aranceles previstos en la presente ley, por los servicios que preste el Registro Provincial de las Personas:","a) las personas que presenten el pertinente certificado de pobreza otorgado por autoridad competente y sus hijos menores de 18 años u otros incapaces que se hallen a su cargo. Esta exención es extensiva a las instituciones privadas de beneficencia con respecto a sus pupilos;","b) cuando del informe socio económico, realizado por la División de Asistencia Social del Registro Provincial de las Personas o de las distintas dependencias del Ministerio deDesarrollo Social, la Mujer y la Juventud, surja que son personas carenciadas o sin medios económicos para afrontar los gastos;","c) cuando fuera por promover demandas por accidentes de trabajo u otras previstas en el Ley XIII – N.° 2, Código Procesal Laboral de la Provincia de Misiones por parte del trabajador, no alcanzando esta exención a la parte patronal."],"s":"Quedan exentas del pago de las tasas y aranceles previstos en la presente ley, por los servicios que preste el Registro Provincial de las Personas:"},{"n":235,"t":"Inspección de Sociedades – Exenciones","p":["No pagarán tasa por servicio de inspección de sociedad:","a) las sociedades científicas, vecinales y las que tengan exclusivamente fines de beneficencia;","b) las sociedades de ejercicio de tiro, bomberos voluntarios, bibliotecas populares y las que tengan por finalidad exclusiva el fomento de industrias sobre aves, conejos, chinchillas y abejas;","c) las mutuales y cooperadoras;","d) las cooperativas sujetas al régimen de la Ley Nacional de Cooperativas (Ley Nacional N.º 20337)."],"s":"No pagarán tasa por servicio de inspección de sociedad:"},{"n":236,"t":"Bancos - Exención de Tasas Administrativas","p":["Exímese de toda tasa administrativa provincial, incluyendo las inscripciones en los Registros, a los actos, contratos u operaciones vinculados con planes depromoción de construcción de viviendas económicas a cargo de cualquier institución oficialo privada que actúe dentro de las normas dictadas al respecto por el Banco Central de la República Argentina y los Organismos Públicos Nacionales competentes en la materia, que persiguen idénticos fines sociales."],"s":"Exímese de toda tasa administrativa provincial, incluyendo las inscripciones en los Registros, a los actos, contratos u operaciones vinculados con planes depromoción de construcción de viviendas económicas a cargo de cualquier…"},{"n":237,"t":"Hecho imponible","p":["Por los vehículos automotores, remolques y acoplados, radicados en esta Provincia, se pagará un impuesto anual único de conformidad al presente Título y lopreceptuado en la Ley XXII – N.° 25, Ley de Alícuotas.","Dichos vehículos no podrán ser objeto por parte de las municipalidades o comunas, de imposición o gravamen, ya sea en calidad de adicional, peaje, inspección u otros, cualquiera sea su denominación, especie o forma de percepción, salvo las vigentes a la fecha de sanción de la presente."],"s":"Por los vehículos automotores, remolques y acoplados, radicados en esta Provincia, se pagará un impuesto anual único de conformidad al presente Título y lopreceptuado en la Ley XXII – N.° 25, Ley de Alícuotas."},{"n":238,"t":"Radicación – Baja","p":["Se considera radicado en la Provincia todo vehículo que se encuentre inscripto en los registros seccionales del Registro Nacional de la Propiedad del Automotor correspondientes a esta jurisdicción, u otros organismos Nacionales, Provinciales o Municipales.","Asimismo, se considerará radicado en la Provincia todo vehículo que se guarde habitualmente en su territorio, ya sea como consecuencia del domicilio del propietario o responsable, o por el asiento de sus actividades.","Los vehículos provenientes de otras jurisdicciones que se radiquen en el período fiscal, deberán pagar el gravamen correspondiente, dentro de los treinta días de su radicación, en los formularios que a tal efecto habiliten los respectivos Municipios.","No se cobrará el gravamen cuando los responsables acrediten fehacientemente haber abonado el mismo, por el total del período que corresponde, en la jurisdicción de procedencia.","Los vehículos cuya baja por cambio de radicación a registros seccionales de otra jurisdicción opere a partir del primero de enero inclusive, abonarán el gravamen correspondiente al total del año. Cuando dicho cambio de radicación opere dentro de la jurisdicción provincial, sólo deberán acreditar haber abonado el gravamen hasta la fecha en que se produzca el mismo.","No se tendrán por incorporados al parque automotor los vehículos nuevos adquiridos a fábrica para su reventa por las entidades o personas que hagan de la compra venta de automotores el objeto habitual de su actividad."],"s":"Se considera radicado en la Provincia todo vehículo que se encuentre inscripto en los registros seccionales del Registro Nacional de la Propiedad del Automotor correspondientes a esta jurisdicción, u otros organismos…"},{"n":239,"t":"Contribuyentes","p":["Las personas a cuyo nombre figuran inscriptos los automotores son responsables directos del pago del gravamen mientras no obtengan la baja como contribuyentes."],"s":"Las personas a cuyo nombre figuran inscriptos los automotores son responsables directos del pago del gravamen mientras no obtengan la baja como contribuyentes."},{"n":240,"t":"Inscripción – Responsables","p":["Los representantes, concesionarios, fabricantes, agentes autorizados o comerciantes habituales en el ramo de venta de automotores, remolques y acoplados, están obligados a asegurar la inscripción de los mismos en los registros de las Municipalidades que correspondan al domicilio del comprador o asiento de sus actividades y el pago del gravamen respectivo por parte del mismo, suministrando documentación necesaria al efecto, inclusive comprobantes del cumplimiento de otras obligaciones fiscales que afecten al vehículo."],"s":"Los representantes, concesionarios, fabricantes, agentes autorizados o comerciantes habituales en el ramo de venta de automotores, remolques y acoplados, están obligados a asegurar la inscripción de los mismos en los registros…"},{"n":241,"t":"Transmisión – Comunicación","p":["Cuando se transfiera un automotor por cualquier causa, el transmitente y el adquirente, en forma conjunta o separada, estarán obligados a comunicar dentro de los treinta días, a los registros de las Municipalidades respectivas, por medio de los formularios que se habiliten al efecto, dicha transferencia. Tal operación deberá ser acreditada fehacientemente, todo ello previo a su inscripción ante el Registro Nacional de la Propiedaddel Automotor, u otros organismos Nacionales, Provinciales o Municipales."],"s":"Cuando se transfiera un automotor por cualquier causa, el transmitente y el adquirente, en forma conjunta o separada, estarán obligados a comunicar dentro de los treinta días, a los registros de las Municipalidades…"},{"n":242,"t":"Transmisión – Sanciones","p":["La falta de cumplimiento de lo establecido en el artículo anterior,importará infracción a los deberes formales."],"s":"La falta de cumplimiento de lo establecido en el artículo anterior,importará infracción a los deberes formales."},{"n":243,"t":"Vehículos - Garantía del Pago del Tributo","p":["Los vehículos comprendidos en el presente Título quedarán afectados a la cancelación de las cantidades adeudadas en concepto de gravamen y recargos, cualquiera sea su actual poseedor o propietario, teniendo éste el derecho de repetir contra los deudores por quienes hubiere pagado."],"s":"Los vehículos comprendidos en el presente Título quedarán afectados a la cancelación de las cantidades adeudadas en concepto de gravamen y recargos, cualquiera sea su actual poseedor o propietario, teniendo éste el derecho de…"},{"n":244,"t":"Base Imponible – Parámetros","p":["A efectos de la determinación del gravamen se tendrá en cuenta: los diferentes modelos de fabricación, año, peso, cilindrada, o valuación de los vehículos.","Para el caso de los camiones furgones, su tara en kilogramos, más la carga máximatransportable.","En el caso de los acoplados y trailers, se tendrá en cuenta su tara en kilogramos más la carga máxima transportable.","La Ley XXII – N° 25, Ley de Alícuotas fijará la base imponible y las alícuotas del impuesto."],"s":"A efectos de la determinación del gravamen se tendrá en cuenta: los diferentes modelos de fabricación, año, peso, cilindrada, o valuación de los vehículos."},{"n":245,"t":"Base Imponible – Datos","p":["El monto de la obligación tributaria se liquidará sobre la base de la documentación o datos aportados por los responsables.","A falta de ella, o cuando el Municipio interprete que los mismos no se ajustan a la realidad, se determinará tomando en consideración los datos que la municipalidad posea o establezca."],"s":"El monto de la obligación tributaria se liquidará sobre la base de la documentación o datos aportados por los responsables."},{"n":246,"t":"Transformación de Vehículos","p":["Cuando un vehículo sea transformado de manera tal que implique un cambio de uso o destino, o su peso se modificara con posterioridad a su inscripción, el propietario deberá comunicarlo al Municipio de su jurisdicción y abonar el gravamen que corresponda a la nueva clasificación de tipo y categoría. La liquidación se hará en forma proporcional según la fecha en que se materialice la modificación, computándose por mes entero."],"s":"Cuando un vehículo sea transformado de manera tal que implique un cambio de uso o destino, o su peso se modificara con posterioridad a su inscripción, el propietario deberá comunicarlo al Municipio de su jurisdicción y abonar…"},{"n":247,"t":"Tipos","p":["Los vehículos automotores, remolques y acoplados se clasificarán en los siguientes tipos:","Tipo 1: Vehículos automotores de cuatro ruedas aptos para el transporte de personas. Se consideran incluidos en este tipo a los automotores denominados automóviles, rurales, ambulancias, coches fúnebres, taxis y remises.","Tipo 2: Vehículos automotores aptos para el transporte de cargas. En este tipo se incluyen los denominados camiones, camionetas, furgones, pick-ups, chatitas, jeeps y todo otro rodado apto para este tipo de transporte.","Tipo 3: Vehículos automotores de cuatro o más ruedas destinados al transporte colectivo de pasajeros, colectivos, micro-ómnibus y micro-cupés.","Tipo 4: Vehícu
