os del artículo 107 serán suficiente título para el cobro de los créditos fiscales en los concursos u otros juicios universales."],"s":"Las boletas de deuda expedidas en los términos del artículo 107 serán suficiente título para el cobro de los créditos fiscales en los concursos u otros juicios universales."},{"n":119,"t":"Falta de Títulos de Propiedad","p":["Mientras no esté terminada la organización inmobiliaria catastral, y cuando en los juicios de ejecución fiscal no pudiera obtenerse el título de propiedad del ejecutado sin un segundo testimonio, la Dirección, previo informe del Registro de laPropiedad, procederá a formalizar las bases del título."],"s":"Mientras no esté terminada la organización inmobiliaria catastral, y cuando en los juicios de ejecución fiscal no pudiera obtenerse el título de propiedad del ejecutado sin un segundo testimonio, la Dirección, previo informe…"},{"n":120,"t":"Aplicación supletoria del Código Procesal Civil, Comercial, de Familia y Violencia Familiar","p":["Son aplicables supletoriamente las disposiciones referentes al juicio de ejecución fiscal del Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones."],"s":"Son aplicables supletoriamente las disposiciones referentes al juicio de ejecución fiscal del Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones."},{"n":121,"t":"Términos","p":["Prescriben por el transcurso de diez (10) años las facultades y poderes de la Dirección de determinar las obligaciones fiscales, verificar y rectificar las declaraciones juradas de contribuyentes y responsables y aplicar multas.","Prescribe por el transcurso de diez (10) años la acción para el cobro judicial de impuestos, tasas y contribuciones, sus accesorios y multas por infracciones fiscales.","Prescribe por el transcurso de diez (10) años la acción de repetición de impuestos, tasas y contribuciones y accesorios a que se refiere el artículo 101."],"s":"Prescriben por el transcurso de diez (10) años las facultades y poderes de la Dirección de determinar las obligaciones fiscales, verificar y rectificar las declaraciones juradas de contribuyentes y responsables y aplicar multas."},{"n":122,"t":"Iniciación de los Términos","p":["Los términos de prescripción de las facultades, poderes y atribuciones indicados en el artículo 121, comenzarán a correr desde el 1 de enero siguiente al año al cual se refieren las obligaciones fiscales, excepto para las obligaciones cuya determinación se produzca sobre la base de declaraciones juradas del período fiscal anual, en cuyo caso tales términos de prescripción comenzarán a correr desde el 1 de enero siguiente al año en que se produzca el vencimiento de los plazos generales para la presentación de declaraciones juradas e ingreso del gravamen.","El término de prescripción de la acción para aplicar multas y clausuras comenzará a correr desde el 1 de enero siguiente al año en que haya tenido lugar la violación de los deberes formales o materiales.","El término de prescripción para hacer efectivas las multas y clausuras comenzará a correr desde la fecha de notificación de la resolución firme que la imponga.","El término de prescripción de la acción de repetición comenzará a correr desde la fecha de pago.","El término de prescripción para el cobro judicial de impuestos, tasas y contribuciones, accesorios y multas, comenzará a correr desde la fecha de la notificación de la determinaciónimpositiva o aplicación de multas o de las resoluciones definitivas que decidan los recursos contra aquellas, salvo en el caso del Impuesto Inmobiliario resultante de padrones y registros respectivos, en el supuesto previsto en el artículo 113 en que comenzará a correr desde el 1 de enero siguiente al año al que se refieran."],"s":"Los términos de prescripción de las facultades, poderes y atribuciones indicados en el artículo 121, comenzarán a correr desde el 1 de enero siguiente al año al cual se refieren las obligaciones fiscales, excepto para las…"},{"n":123,"t":"Suspensión de la Prescripción","p":["Los términos de prescripción establecidos en el artículo 121, no correrán en los siguientes casos:","a) mientras los hechos imponibles no hayan podido ser conocidos por la Dirección por algún acto, hecho o circunstancia que lo exteriorice en la Provincia;","b) durante la vigencia de planes especiales de regularización de obligaciones fiscales;","c) durante la tramitación del procedimiento administrativo o judicial tendiente a ladeterminación o cobro de las obligaciones fiscales;","d) hasta tanto se dicte sentencia firme en fueros penales o tributarios."],"s":"Los términos de prescripción establecidos en el artículo 121, no correrán en los siguientes casos:"},{"n":124,"t":"Interrupción de la Prescripción","p":["La prescripción de facultades, poderes y atribuciones de la Dirección para determinar las obligaciones fiscales, aplicar sanciones y exigir sus pagos se interrumpirá:","a) por el reconocimiento expreso o tácito del contribuyente o responsable de su obligación tributaria;","b) por renuncia expresa al término corrido de la prescripción en curso del contribuyente o responsable;","c) por la notificación administrativa de la determinación o verificación impositiva;","d) por la notificación administrativa para cumplir un deber formal o efectuar un pago;","e) por la iniciación de juicio de ejecución fiscal u otra acción judicial hábil para obtener el pago de las obligaciones tributarias;","f) por cualquier acción judicial o administrativa tendiente a establecer sus créditos o a obtener su pago;","g) tratándose de multas u otras infracciones formales o materiales, por la comisión de nuevas infracciones.","El nuevo término de prescripción comenzará a correr a partir del 1 de enero siguiente al año en que alguna de las circunstancias mencionadas ocurra.","La prescripción de la acción de repetición del contribuyente o responsable se interrumpirá por la interposición de la demanda respectiva ante la Dirección."],"s":"La prescripción de facultades, poderes y atribuciones de la Dirección para determinar las obligaciones fiscales, aplicar sanciones y exigir sus pagos se interrumpirá:"},{"n":125,"t":"","p":["Facúltase al Poder Ejecutivo para delegar en la Dirección General de Rentas el cobro extrajudicial y judicial de créditos y acreencias que posea el EstadoProvincial u pago.","El término de prescripción para el cobro judicial de impuestos, tasas y contribuciones, accesorios y multas, comenzará a correr desde la fecha de la notificación de la determinaciónimpositiva o aplicación de multas o de las resoluciones definitivas que decidan los recursos contra aquellas, salvo en el caso del Impuesto Inmobiliario resultante de padrones y registros respectivos, en el supuesto previsto en el artículo 113 en que comenzará a correr desde el 1 de enero siguiente al año al que se refieran."],"s":"Facúltase al Poder Ejecutivo para delegar en la Dirección General de Rentas el cobro extrajudicial y judicial de créditos y acreencias que posea el EstadoProvincial u pago."},{"n":126,"t":"","p":["Facúltase al Poder Ejecutivo para que a través de la Dirección General de Rentas dicte los actos reglamentarios o complementarios que requiera la aplicación de la presente ley."],"s":"Facúltase al Poder Ejecutivo para que a través de la Dirección General de Rentas dicte los actos reglamentarios o complementarios que requiera la aplicación de la presente ley."},{"n":127,"t":"Formas de las Notificaciones","p":["Salvo disposiciones especiales, las notificaciones, citaciones, eintimaciones se efectuarán en la siguiente forma:","a) personalmente o por cédula;","b) por carta certificada con aviso de retorno;","c) por telegrama colacionado o carta documento;","d) por constancia firmada por el interesado en expediente respectivo;","e) por edictos publicados por dos (2) días en el Boletín Oficial, cuando no fuera posible efectuarlas en una de las formas indicadas en los incisos anteriores, sin perjuicio de las diligencias que la Dirección disponga a ese efecto requiriendo si fuere necesario el auxilio de la fuerza pública.","Cuando se deban notificar por este medio actos administrativos, la Dirección podrá publicar solamente la parte resolutiva de los mismos.","Las notificaciones efectuadas en las formas previstas en los incisos a), b) y c) serán válidas si se efectúan en el domicilio fiscal o en el domicilio real o legal de los contribuyentes."],"s":"Salvo disposiciones especiales, las notificaciones, citaciones, eintimaciones se efectuarán en la siguiente forma:"},{"n":128,"t":"Secreto de las Informaciones","p":["Las declaraciones juradas, comunicaciones e informaciones que los contribuyentes, responsables y terceros presenten a la Dirección, son secretos, así como los juicios ante la Cámara Fiscal en cuanto en ellos se consignen informaciones referentes a la situación económica u operaciones de aquellos o a sus personas o a la de sus familiares.","Los magistrados, funcionarios, empleados judiciales o de la Dirección están obligados a mantener en la más estricta reserva todo lo que llegue a su conocimiento en el ejercicio de sus funciones, sin poder comunicarlo a nadie, salvo a sus superiores jerárquicos o a solicitudde los interesados.","Las informaciones antedichas no serán admitidas como prueba en causas judiciales, debiendo los jueces rechazarlas de oficio, salvo en las cuestiones de familia, o en los procesos criminales por delitos comunes cuando aquellas se hallen directamente relacionadas con loshechos que se investiguen o que las solicite el interesado, siempre que la información no revele datos referentes a terceros.","El deber del secreto no alcanza a la utilización de las informaciones que la Dirección haya obtenido en asuntos referentes a un impuesto a los efectos de la fiscalización de otras obligaciones tributarias ni subsiste frente a los pedidos de informes del fisco nacional y otrosfiscos provinciales o comunales, siempre que existan normas o acuerdos que establezcan la reciprocidad.","No están alcanzados por el secreto fiscal los datos referidos a la falta de presentación de declaraciones juradas, a la falta de pago de obligaciones exigibles, a los montos resultantes de las determinaciones de oficio firmes y de los ajustes conformados, a las sanciones firmes por infracciones formales o materiales y al nombre del contribuyente o responsable y al delito que se le impute en las denuncias penales. La Dirección, queda facultada para dar apublicidad esos datos, en la oportunidad y condiciones que ella establezca.","El secreto establecido en el presente artículo no regirá:","a) para el supuesto que, por desconocerse el domicilio del responsable, sea necesario recurrir a la notificación por edictos;","b) para personas o empresas o entidades a quienes la Dirección encomiende la realización de tareas administrativas, relevamientos de estadísticas, computación, procesamiento de información, confección de padrones y otras para el cumplimiento de sus fines. En estos casos regirán las disposiciones de los tres primeros párrafos del presente artículo, y en el supuesto que las personas o entes referidos precedentemente o terceros divulguen, reproduzcan o utilicen la información suministrada u obtenida con motivo o en ocasión de latarea encomendada por la Dirección, será de aplicación el artículo 157 del Código Penal."],"s":"Las declaraciones juradas, comunicaciones e informaciones que los contribuyentes, responsables y terceros presenten a la Dirección, son secretos, así como los juicios ante la Cámara Fiscal en cuanto en ellos se consignen…"},{"n":129,"t":"Definición de Ausentismo","p":["A los efectos de la aplicación de este Código y otras leyes fiscales, se consideran ausentes:","a) las personas humanas, que en forma permanente o transitoria residan en el extranjero durante más de un año, excepto que se encuentren desempeñando comisiones oficiales de la Nación,de Provincia, de las comunas o que se trate de funcionarios de carrera del cuerpo diplomático yconsular argentino, o becarios de entidades científicas o culturales con personería jurídica acreditada;","b) las personas jurídicas con directorio o sede principal en el extranjero, aunque tengan directorio o administraciones locales."],"s":"A los efectos de la aplicación de este Código y otras leyes fiscales, se consideran ausentes:"},{"n":130,"t":"Cómputo de los Términos","p":["Todos los términos de días señalados en este Código, se refieren a días hábiles."],"s":"Todos los términos de días señalados en este Código, se refieren a días hábiles."},{"n":131,"t":"Acceso a las actuaciones","p":["Las partes y los abogados inscriptos en la matrícula tendrán libre acceso a las actuaciones y podrán tomar conocimiento de ellas en cualquier estado de su tramitación, salvo cuando estuvieren a estudio para su resolución."],"s":"Las partes y los abogados inscriptos en la matrícula tendrán libre acceso a las actuaciones y podrán tomar conocimiento de ellas en cualquier estado de su tramitación, salvo cuando estuvieren a estudio para su resolución."},{"n":132,"t":"Hecho Imponible","p":["Por los inmuebles situados en la provincia de Misiones deberán pagarse los impuestos anuales establecidos en este Título."],"s":"Por los inmuebles situados en la provincia de Misiones deberán pagarse los impuestos anuales establecidos en este Título."},{"n":133,"t":"Impuesto Inmobiliario Básico","p":["Por cada inmueble de las plantas urbanas, suburbanas y rural de acuerdo a la clasificación de la Ley II – N.° 2, Ley de Catastro Provincial, se pagará un importe progresivo que se denominará Inmobiliario Básico cuya alícuota y escalas seránfijadas por la ley respectiva, sobre la base imponible determinada de conformidad con las normas del Capítulo Cuarto. El importe anual del impuesto por cada cargo no podrá ser inferior al monto mínimo que fije la Ley XXII – N.° 25, Ley de Alícuotas."],"s":"Por cada inmueble de las plantas urbanas, suburbanas y rural de acuerdo a la clasificación de la Ley II – N.° 2, Ley de Catastro Provincial, se pagará un importe progresivo que se denominará Inmobiliario Básico cuya alícuota y…"},{"n":134,"t":"Adicional por baldíos","p":["Los inmuebles baldíos ubicados en las zonas que se determinen de las plantas urbanas pagarán el Impuesto Básico establecido en el presente Título, con un incremento que establecerá la Ley XXII – N.° 25, Ley de Alícuotas.","El Decreto Reglamentario establecerá las localidades y zonas afectadas por este adicional."],"s":"Los inmuebles baldíos ubicados en las zonas que se determinen de las plantas urbanas pagarán el Impuesto Básico establecido en el presente Título, con un incremento que establecerá la Ley XXII – N.° 25, Ley de Alícuotas."},{"n":135,"t":"Adicional por ausentismo","p":["El Impuesto Inmobiliario Básico, será aumentado en un porcentaje que se denominará Ausentismo cuyo monto será fijado por la Ley XXII – N.° 25, Ley de Alícuotas, cuando el contribuyente se encuentre en la situación prevista en el artículo 129."],"s":"El Impuesto Inmobiliario Básico, será aumentado en un porcentaje que se denominará Ausentismo cuyo monto será fijado por la Ley XXII – N.° 25, Ley de Alícuotas, cuando el contribuyente se encuentre en la situación prevista en…"},{"n":136,"t":"Nacimiento de las Obligaciones","p":["Las obligaciones fiscales establecidas en el presente Título se generan por los hechos imponibles que se produzcan, con prescindencia de la incorporación de las valuaciones fiscales al catastro, padrón o registro o de la determinación por parte de la Dirección."],"s":"Las obligaciones fiscales establecidas en el presente Título se generan por los hechos imponibles que se produzcan, con prescindencia de la incorporación de las valuaciones fiscales al catastro, padrón o registro o de la…"},{"n":137,"t":"Contribuyentes","p":["Son contribuyentes del impuesto:","a) los propietarios o condóminos con exclusión de los nudos propietarios;","b) los usufructuarios;","c) los poseedores a título de dueño; se considerarán en tal carácter:","1) los compradores con escritura otorgada y cuyo testimonio aún no se hubiese inscripto en el Registro de la Propiedad;","2) los compradores que tengan la posesión aun cuando no se hubiera otorgado la escritura traslativa de dominio;","3) los que posean con ánimo de adquirir el dominio por prescripción veinteñal;","d) los ocupantes de tierras fiscales autorizados."],"s":"Son contribuyentes del impuesto:"},{"n":138,"t":"Adicionales de Inmuebles en Condominio, Indivisión Hereditaria,Usufructo o Posesión de Dueño","p":["Cuando sobre un inmueble exista condominio o indivisión hereditaria o usufructo o posesión a título de dueño de varias personas, cada condómino o heredero, o legatario, o usufructuario o poseedor, computará a los efectos de los adicionales establecidos en el artículo 134, la cuota que a él corresponda en el valor imponible del inmueble."],"s":"Cuando sobre un inmueble exista condominio o indivisión hereditaria o usufructo o posesión a título de dueño de varias personas, cada condómino o heredero, o legatario, o usufructuario o poseedor, computará a los efectos de…"},{"n":139,"t":"Transferencias de Sujetos Exentos o Gravados y Viceversa","p":["Cuando se realicen transferencias de inmuebles de un sujeto exento a otro gravado o viceversa, la obligación o la exención respectivamente, comenzara al año siguiente de la fecha de otorgamiento del acto traslativo del dominio.","Cuando uno de los sujetos fuere el Estado la obligación o la exención comenzará al año siguiente de la toma de posesión."],"s":"Cuando se realicen transferencias de inmuebles de un sujeto exento a otro gravado o viceversa, la obligación o la exención respectivamente, comenzara al año siguiente de la fecha de otorgamiento del acto traslativo del dominio."},{"n":140,"t":"Exenciones. Casos Admitidos","p":["Están exentos del impuesto establecido en este Título:","a) los inmuebles del Estado Nacional, del Estado Provincial y de los Municipios de la Provincia, y sus dependencias, mientras sean utilizados en sus funciones específicas, excluyéndose aquellas que estén organizadas como empresas lucrativas;","b) los inmuebles destinados a templos religiosos y sus dependencias;","c) los inmuebles que pertenezcan en propiedad o usufructo o que les hayan cedido en uso gratuito a Asociaciones Civiles, con Personería Jurídica, cuando dichos bienes sean utilizados para los siguientes fines:","1) servicio de Salud Pública, beneficencia y asistencia social y de bomberos voluntarios;","2) escuelas, colegios, bibliotecas públicas, universidades populares, institutos educacionales y de investigaciones científicas;","3) deportes;","d) los inmuebles ocupados por asociaciones obreras, gremiales o profesionales con personería jurídica o gremial, por las asociaciones de fomento o mutualistas con personería jurídica, por los partidos políticos, siempre que les pertenezcan en propiedad o usufructo;","e) los inmuebles de las asociaciones cooperativas constituidas de acuerdo a la Ley Nacional de Cooperativas (Ley Nacional N.º 20337), efectivamente ocupados por las mismas;","f) el valor de la masa boscosa correspondiente a forestaciones o reforestaciones de especies silvícolas, y el valor de la implantación de praderas artificiales;","g) las nuevas construcciones destinadas a viviendas del propietario y su familia siempre que el mismo no posea otra propiedad urbana en jurisdicción provincial. Para que sea procedente esta exención, las mejoras no deberán exceder la valuación fiscal que fije la LeyXXII– N.° 25, Ley de Alícuotas,la exención será por un término de cinco (5) años;","h) las propiedades efectivamente ocupadas por industrias comprendidas en la ley de fomento vigente;","i) Las plantaciones permanentes con fines industriales o comerciales, según la clasificación de la Ley II – N.° 2, Ley de Catastro Provincial, y de acuerdo a las especiesque determine el Poder Ejecutivo;","j) los inmuebles que pertenezcan en propiedad a legaciones extranjeras, embajadas, consulados, residencias de jefes de misión y de agencias extranjeras de carácter oficial en cuanto éstas sean contribuyentes de iure de los países adheridos a convenios internacionalesvigentes, bajo condición de reciprocidad;","k) los inmuebles de propiedad de los ex-soldados conscriptos de las Islas Malvinas amparados por las leyes respectivas, Ley XIX – N.º 20, siempre y cuando se cumplan las siguientes condiciones:","1) hayan sido adjudicados en virtud de las leyes referidas o se encuentren inscriptos en el Registro de la Propiedad a nombre exclusivo de los beneficiarios;","2) sirvan de domicilio real, continuo y permanente de los beneficiados y su grupo familiar habitual;","l) por el término de cinco (5) años los inmuebles - tierras y nuevas construcciones adjudicados por el Instituto Provincial de Desarrollo Habitacional (IPRODHA) o por la Entidad Binacional Yacyretá (EBY);","m) los inmuebles rurales afectados a emprendimientos turísticos alternativos educativos, en proporción a la superficie afectada al servicio y siempre que la explotación constituya su única actividad comercial. Si el emprendimiento se complementare con otros rubros o actividades, el titular del inmueble, a los fines de la exención prevista en el presente inciso, deberá acreditar la subdivisión del inmueble y su afectación al emprendimiento;","n) los inmuebles propiedad de jubilados y pensionados o de sus cónyuges afectados al Régimen de Protección de la Vivienda en el Registro de la Propiedad Inmueble, siempre que los mismos no posean otro inmueble en jurisdicción de la Provincia, acrediten que la pasividad que perciben es su única fuente de ingresos y la misma no supere el cuatrocientos por ciento (400%) del mínimo móvil vigente para pensionados provinciales.","Los jubilados y pensionados, o sus cónyuges, adjudicatarios de inmuebles otorgados por el Instituto Provincial de Desarrollo Habitacional (IPRODHA) o por la Entidad Binacional Yacyretá (EBY), gozarán del beneficio establecido en el párrafo precedente, aún cuando no tengan la transferencia de dominio inscripta en el Registro de la Propiedad Inmueble, previo informe sobre la fecha de adjudicación y posesión del inmueble, por los organismos mencionados precedentemente, según corresponda."],"s":"Están exentos del impuesto establecido en este Título:"},{"n":141,"t":"Base imponible","p":["La base imponible y la valuación fiscal de los impuestos establecidos en el Capítulo Primero, está constituida por el valor económico de los inmuebles determinada en función de lo establecido en la Ley II – N.° 2, Ley de Catastro Provincial,y normas que en consecuencia se dicten por el Organismo fiscal."],"s":"La base imponible y la valuación fiscal de los impuestos establecidos en el Capítulo Primero, está constituida por el valor económico de los inmuebles determinada en función de lo establecido en la Ley II – N.° 2, Ley de…"},{"n":142,"t":"Forma y Condiciones","p":["El impuesto y sus adicionales deberán ser pagados anualmente, conjunta o separadamente, en una o varias cuotas, en las condiciones y términos que la Dirección establezca.","El ausentismo establecido en el artículo 135 deberá pagarse desde el primero de enero del año en que el propietario salga del país hasta el 31 de diciembre del año en que el ausente regrese definitivamente."],"s":"El impuesto y sus adicionales deberán ser pagados anualmente, conjunta o separadamente, en una o varias cuotas, en las condiciones y términos que la Dirección establezca."},{"n":143,"t":"Alcance de las Liquidaciones","p":["Las liquidaciones para el pago de los impuestos expedidas por la Dirección sobre la base de declaraciones juradas, no constituyen determinaciones impositivas."],"s":"Las liquidaciones para el pago de los impuestos expedidas por la Dirección sobre la base de declaraciones juradas, no constituyen determinaciones impositivas."},{"n":144,"t":"Hecho imponible","p":["El ejercicio habitual y a título oneroso en jurisdicción de la provincia de Misiones, del comercio, industria, profesión, oficio, negocio, locación de bienes, obras o servicios, o de cualquier otra actividad a título oneroso, cualquiera sea el resultado económicoobtenido y la naturaleza del sujeto que la preste, y lugar donde se realice (zonas portuarias, espacios ferroviarios, aeródromos y aeropuertos, terminales de transporte, edificios, lugares de dominio público y privado y todo otro de similar naturaleza) estará alcanzado con un Impuesto sobre los Ingresos Brutos en las condiciones que se determinan en los artículos siguientes.","La habitualidad deberá determinarse teniendo en cuenta especialmente la índole de las actividades, el objeto de la empresa, profesión o locación y los usos y costumbres de la vida económica.","Se entenderá como ejercicio habitual de la actividad gravada el desarrollo, en el ejercicio fiscal, de hechos, actos u operaciones de la naturaleza de las gravadas por el impuesto, con prescindencia de su cantidad o monto, cuando los mismos sean efectuados por quienes hagan profesión de tales actividades.","La habitualidad no se pierde por el hecho de que, después de adquirida, las actividades se ejerzan en forma periódica o discontinua."],"s":"El ejercicio habitual y a título oneroso en jurisdicción de la provincia de Misiones, del comercio, industria, profesión, oficio, negocio, locación de bienes, obras o servicios, o de cualquier otra actividad a título oneroso,…"},{"n":145,"t":"Actividades Comprendidas","p":["Se considerarán también actividades alcanzadas por este impuesto las siguientes operaciones, realizadas dentro de la Provincia, sea en forma habitual o esporádica:","a) profesiones liberales. El hecho imponible está configurado por su ejercicio, no existiendo gravabilidad por la mera inscripción en la matrícula respectiva;","b) la mera compra de productos agropecuarios, forestales, frutos del país y minerales para industrializarlos o venderlos fuera de la jurisdicción. Se considerará fruto del país a todos los bienes que sean resultado de la producción nacional pertenecientes a los reinos vegetal, animal o mineral, obtenidos por acción de la naturaleza, el trabajo o el capital y mientras conserven su estado natural, aún en el caso de haberlos sometido a algún proceso otratamiento indispensable o no - para su conservación o transporte (lavado, salazón, derretimiento, pisado, clasificación, etcétera);","c) el fraccionamiento y la venta de inmuebles (loteos) y la compraventa y la locación de inmuebles;","Esta disposición no alcanza a:","1) alquiler de hasta dos (2) unidades habitacionales, cuando el impuesto que corresponda sobre la renta percibida o devengada en concepto de alquiler, no supere el impuesto mínimo establecido para anticipos mensuales fijados por la Ley XXII – N.° 25, Ley de Alícuotas, salvo que el propietario o usufructuario sea una sociedad, empresa o persona inscripta en la Dirección General de Personas Jurídicas y Registro Público de la Provincia.","Cuando el impuesto determinado, cualquiera sea el número de unidades arrendadas supere el citado importe mínimo, la actividad se encuentra gravada aún cuando se realice en forma esporádica, discontinua o sin habitualidad en el tiempo.","Considérese unidades habitacionales, única y exclusivamente a aquellas destinadas a viviendas. Para el caso de locaciones de inmuebles de usos múltiples -mixtasla no aplicacióndel gravamen sólo alcanza a las destinadas a viviendas.","En casos de locación o arrendamiento de más de dos (2) unidades habitacionales, debe pagarse el impuesto sobre el total de los ingresos obtenidos;","2) ventas de unidades habitacionales efectuadas después de los dos (2) años de su escrituración, en los ingresos correspondientes al enajenante, salvo que éste sea una sociedado empresa inscripta en la Dirección General de Personas Jurídicas y Registro Público de la Provincia.","Este plazo no será exigible cuando se trate de ventas efectuadas por sucesiones, de ventas de única vivienda efectuadas por el propietario y las que se encuentren afectadas a la actividad como bienes de uso;","3) venta de lotes pertenecientes a subdivisiones de no más de diez (10) unidades, excepto que se trate de loteos efectuados por una sociedad o empresa inscripta en la Dirección General de Personas Jurídicas y Registro Público de la Provincia;","4) transferencias de boletos de compra - venta en general;","d) las explotaciones agrícolas, pecuarias, mineras, forestales e ictícolas;","e) la comercialización de productos o mercaderías que entren a la jurisdicción por cualquier medio;","f) la intermediación que se ejerza percibiendo comisiones, bonificaciones, porcentajes u otras retribuciones análogas;","g) las operaciones de préstamo de dinero, con o sin garantía;","h) Los servicios digitales desarrollados a través de la red internet o de cualquier adaptación o aplicación de los protocolos, plataformas o de la tecnología utilizada por internet u otra red a través de la que se prestan servicios equivalentes que, por su naturaleza, están básicamente automatizados, requieren una intervención humana mínima y precisan el uso de dispositivos para su descarga, visualización o utilización.","En el supuesto del ejercicio de la actividad de prestación de servicios digitales por parte de sujetos no residentes en el país, se entiende que existe una actividad alcanzada por el impuesto cuando la prestación del servicio produce efectos económicos en la provincia de Misiones o recae sobre sujetos, bienes, personas o cosas situadas o domiciliadas en esta jurisdicción -con independencia del medio, plataforma o tecnología utilizada a tal fino cuando el prestador contare con una presencia digital, la que se entenderá verificada cuando se cumpla, en el período fiscal inmediato anterior, con alguno de los siguientes parámetros:","1) efectuar transacciones, operaciones o contratos con usuarios domiciliados en la provincia de Misiones;","2) ser titular o registrar un nombre de dominio de Internet de nivel superior Argentina (ar) de conformidad con las normas y reglamentaciones que dicte la Dirección Nacional del Registro de Dominios de Internet dependiente de la Secretaría Legal y Técnica de la Nación, o la que en un futuro la reemplace, o poseer una plataforma digital orientada, total o parcialmente, al desarrollo de su actividad con sujetos ubicados o domiciliados en la provincia de Misiones;","3) los servicios destinados a facilitar la gestión o intercambio de monedas digitales, criptomonedas, instrumentos financieros, acciones o activos digitales por monedas fiduciarias de curso legal o cualquier tipo de bienes -y viceversa o entre sí mismos-, a través de plataformas online, sitios web, aplicaciones tecnológicas, dispositivos o plataformas digitales o móviles o similares (exchanges de criptomonedas);","4) poner a disposición respecto de sujetos radicados, domiciliados o ubicados en la provincia de Misiones de una interfaz digital multifacética que les permita localizar a otros usuarios e interactuar entre ellos;","5) poner a disposición respecto de sujetos radicados, domiciliados o ubicados en la provincia de Misiones de una interfaz digital multifacética que les facilite la entrega de bienes o las prestaciones de servicios subyacentes entre los sujetos que utilicen tales servicios;","6) poner a disposición respecto de sujetos radicados, domiciliados o ubicados en la provincia de Misiones de una interfaz digital multifacética y que la misma se nutra de los datos recopilados acerca de los usuarios o las actividades desarrolladas o realizadas por estos últimos en esa interfaz digital multifacética;","7) la puesta a disposición de una plataforma digital, cualquiera sea su medio, cuya actividad se despliegue mediante el acceso a la misma a través de direcciones de protocolo de internet o de cualquier otro método de geolocalización ubicados dentro de la provincia de Misiones.","Asimismo, se considera que existe actividad gravada en el ámbito de la provincia de Misiones cuando por la comercialización de servicios de suscripción online, para el acceso a toda clase de entretenimientos audiovisuales (películas, series, música, juegos, videos, transmisiones televisivas online, etc.) que se transmitan desde internet a televisión, computadoras, dispositivos móviles, consolas conectadas o plataformas tecnológicas, por sujetos no residentes en el país y se verifique que tales actividades tengan efectos sobre sujetos radicados, domiciliados o ubicados en territorio de la provincia de Misiones. Idéntico tratamiento resultará de aplicación para la intermediación en la prestación de servicios y las actividades de juego que se desarrollen o exploten a través de cualquier medio, plataforma o aplicación tecnológica o dispositivo o plataforma digital o móvil o similares, tales como: juegos de azar en casinos online, apuestas en línea, ruleta online, blackjack, baccarat, punto y banca, póker mediterráneo, video póker on line, siete y medio, hazzard, monte, rueda de la fortuna, seven fax, bingo, tragaperras, apuestas deportivas, craps, keno, etc., cuando se verifiquen las condiciones detalladas precedentemente y con total independencia donde se organicen, localicen los servidores o plataforma digital o red móvil, u ofrezcan tales actividades de juego.","A los fines de determinar la calidad de no residente en el país de los sujetos aludidos en el segundo párrafo del presente inciso, serán de aplicación las disposiciones pertinentes de la Ley Nacional N.° 20628 y sus normas modificatorias y complementarias o la que en el futuro la reemplace."],"s":"Se considerarán también actividades alcanzadas por este impuesto las siguientes operaciones, realizadas dentro de la Provincia, sea en forma habitual o esporádica:"},{"n":146,"t":"Determinación del Hecho Imponible - Realidad Económica","p":["Para la determinación del hecho imponible, se atenderá a la naturaleza específica de la actividad desarrollada, con prescindencia en caso de discrepancia de la calificación que mereciera a los fines de policía municipal o de cualquier otra índole, o a los fines del encuadramiento en otras normas nacionales, provinciales o municipales, ajenas a lafinalidad de la ley."],"s":"Para la determinación del hecho imponible, se atenderá a la naturaleza específica de la actividad desarrollada, con prescindencia en caso de discrepancia de la calificación que mereciera a los fines de policía municipal o de…"},{"n":147,"t":"Actividades No Gravadas","p":["No constituyen ingresos gravados en este impuesto los correspondientes a:","a) el trabajo personal ejecutado en relación de dependencia, con remuneración fija o variable;","b) el desempeño de cargos públicos;","c) el transporte internacional de pasajeros o cargas efectuados por empresas constituidas en el exterior en estados con los cuales el país tenga suscripto o suscriba acuerdo o convenios para evitar la doble imposición en la materia, de los que surja a condición de reciprocidad, que la aplicación de gravámenes queda reservada únicamente al país en el que esténconstituidas las empresas;","d) honorarios de Directorios y Consejos de Vigilancia, ni otros de similar naturaleza. Esta disposición no alcanza a los ingresos en concepto de sindicatura;","e) jubilaciones y otras pasividades en general;","f) los ingresos provenientes de la venta al exterior de productos y mercaderías efectuadas por el exportador con sujeción a los mecanismos aplicados por la Dirección General de Aduanas.","No se encuentran comprendidas en esta exclusión las ventas vinculadas con actividades mineras o hidrocarburíferas y sus servicios complementarios, ni las actividades conexas de transporte, eslingaje, estibaje, depósito y toda otra de similar naturaleza;","g) los ingresos provenientes de prestaciones de servicios cuya utilización o explotación efectiva se lleve a cabo en el exterior del país."],"s":"No constituyen ingresos gravados en este impuesto los correspondientes a:"},{"n":148,"t":"Definición","p":["Son contribuyentes del impuesto las personas humanas, sociedades con o sin personería jurídica y demás entes que realicen las actividades gravadas.","Cuando lo establezca la Dirección de Rentas, deberán actuar como agentes de retención, percepción o información las personas humanas, sociedades con o sin personería jurídica y toda entidad que intervenga en operaciones o actos de los que deriven o puedan derivar ingresos alcanzados por el impuesto."],"s":"Son contribuyentes del impuesto las personas humanas, sociedades con o sin personería jurídica y demás entes que realicen las actividades gravadas."},{"n":149,"t":"Cese de Actividades","p":["En caso de cese de actividades -incluido transferencias de fondo de comercio, sociedades y explotaciones gravadasdeberá satisfacerse el impuesto correspondiente hasta la fecha de cese, previa presentación de la declaración jurada respectiva. Si se tratara de contribuyentes cuya liquidación se efectúa por el sistema de lo percibido, deberán computar también los importes devengados no incluidos en aquel concepto.","Lo dispuesto precedentemente no será de aplicación obligatoria en los casos de transferencia en las que se verifique continuidad económica para la explotación de la o de las mismas actividades y se conserve la inscripción como contribuyente, supuesto en el cual se considera que existe sucesión de las obligaciones fiscales.","Evidencian continuidad económica:","a) la fusión de empresas u organizaciones -incluidas unipersonalesa través de una tercera que se forme o por absorción de una de ellas;","b) la venta o transferencia de una entidad a otra que, a pesar de ser jurídicamenteindependiente, constituyan un mismo conjunto económico;","c) el mantenimiento de la mayor parte del capital en la nueva entidad;","d) la permanencia de las facultades de dirección empresarial en la misma o mismas personas."],"s":"En caso de cese de actividades -incluido transferencias de fondo de comercio, sociedades y explotaciones gravadasdeberá satisfacerse el impuesto correspondiente hasta la fecha de cese, previa presentación de la declaración…"},{"n":150,"t":"Iniciación de Actividades","p":["En los casos de iniciación de actividades deberá solicitarse con carácter previo la inscripción como contribuyente, presentando una declaración jurada y abonando el impuesto mínimo que correspondiera a la actividad.","En caso de que durante el período fiscal el impuesto a liquidar resultare mayor, lo abonado al iniciar la actividad será tomado como pago a cuenta, debiendo satisfacerse el saldo resultante.","En caso que la determinación arroje un impuesto menor, el pago del impuesto mínimo efectuado será considerado como único y definitivo del período."],"s":"En los casos de iniciación de actividades deberá solicitarse con carácter previo la inscripción como contribuyente, presentando una declaración jurada y abonando el impuesto mínimo que correspondiera a la actividad."},{"n":151,"t":"Definición","p":["Salvo expresa disposición en contrario, el gravamen se determinará sobre la base de los ingresos brutos devengados durante el período fiscal por el ejercicio de la actividad gravada.","Se considera ingreso bruto el valor o monto total en valores monetarios, en especies o en servicios devengado en concepto de venta de bienes, de remuneraciones total obtenidas por los servicios, la retribución por la actividad ejercida, los intereses obtenidos por préstamos de dinero o plazos de financiación o, en general, el de las operaciones realizadas.","En las operaciones de ventas de inmuebles en cuotas por plazos superiores a doce (12) meses, se considera ingreso bruto devengado, a la suma total de las cuotas o pagos que vencieran en cada período.","En las operaciones realizadas por las entidades financieras comprendidas en el régimen que las regula, se considerará ingreso bruto a los importes devengados en función del tiempo en cada período. En las operaciones realizadas por responsables que no tengan obligación legal de llevar libros y formular balances en forma comercial, la base imponible será el total de los ingresos percibidos en el período.","No estarán obligados a inscribirse los contribuyentes por actividades de explotación agropecuaria, cuando la totalidad de su producción sea comercializada a través de agentes deretención."],"s":"Salvo expresa disposición en contrario, el gravamen se determinará sobre la base de los ingresos brutos devengados durante el período fiscal por el ejercicio de la actividad gravada."},{"n":152,"t":"Ingresos no computables","p":["No integran la base imponible, los siguientes conceptos:","a) los importes correspondientes a impuestos internos, impuesto al valor agregado (débito fiscal), impuestos para los Fondos: Nacional de Autopista, Tecnológico del Tabaco y de los Combustibles y el Impuesto a los Servicios de Radiodifusión.","Esta deducción sólo podrá ser efectuada por los contribuyentes de derecho de los gravámenes citados en tanto se encuentren inscriptos como tales. El importe a computar será el del débito fiscal o el del monto liquidado, según se trate del Impuesto al Valor Agregado o delos restantes gravámenes, respectivamente y en todos los casos, en la medida que correspondan a las operaciones de la actividad sujeta a impuesto, realizados en el período fiscal que se liquida;","b) los importes que constituyen reintegro de capital en los casos de depósitos, préstamos, créditos, descuentos y adelantos, y toda otra operación de tipo financiero, así como sus renovaciones, repeticiones, prórrogas, esperas u otras facilidades, cualquiera sea la modalidad o forma de instrumentación adoptada;","c) los reintegros que perciban los comisionistas, consignatarios y similares, correspondientes a gastos efectuados por cuenta de terceros, en las operaciones de intermediación en que actúen. Tratándose de concesionarios o agentes oficiales de ventas, lo dispuesto en el párrafo anterior sólo será de aplicación a los del estado en materia de juegos de azar y similares y de combustibles;","d) los subsidios y subvenciones que otorgue el Estado -Nacional y Provincialy las Municipalidades, excluidos los que otorgue el Estado Provincial de acuerdo a la Ley VI – N.° 189;","e) las sumas percibidas por los exportadores de bienes o servicios en concepto de reintegros o reembolsos, acordados por la Nación;","f) los importes que correspondan al productor asociado por los retornos percibidos;","g) las cooperativas de grado superior, los importes que correspondan a las cooperativas agrícolas asociadas de grado inferior, por los retornos percibidos;","h) los importes abonados a otras entidades prestatarias, de servicios públicos, en el caso de cooperativas o secciones de provisión de los mismos servicios, excluidos transportes y comunicaciones."],"s":"No integran la base imponible, los siguientes conceptos:"},{"n":153,"t":"Bases Imponibles Especiales - Diferencia entre precios de compra y venta","p":["La base imponible estará constituida por la diferencia entre los precios de compra y venta, en los siguientes casos:","a) comercialización de billetes de lotería y juegos de azar autorizados, cuando los valores de compra y de venta sean fijados por el Estado;","b) comercialización mayorista y minorista de tabacos, cigarros y cigarrillos;","c) las operaciones de compra venta de divisas;","d) comercialización de productos con precio oficial de venta fijado por el Estado, cuando en la determinación de dicho precio de venta no se hubiere considerado la incidencia del impuesto sobre el monto total;","A opción del contribuyente, el impuesto podrá liquidarse aplicando las alícuotas pertinentes sobre el total de los ingresos respectivos."],"s":"La base imponible estará constituida por la diferencia entre los precios de compra y venta, en los siguientes casos:"},{"n":154,"t":"Bases Imponibles Especiales","p":["Para las actividades expresamente indicadas, se utilizarán las siguientes bases imponibles:","Entidades financieras","a) en las operaciones realizadas por las entidades financieras comprendidas en la Ley Nacional N.º 21526, se considera ingreso bruto a los importes devengados, en función del tiempo, en cada período.","La base imponible está constituida por el total de la suma del haber de las cuentas de resultados, no admitiéndose deducciones de ningún tipo;","Compañías de Seguros y Reaseguros","b) para las compañías de seguros y reaseguros y de capitalización y ahorro, se considera monto imponible aquel que implique una remuneración de los servicios o un beneficio para la entidad.","Se conceptúan especialmente en tal carácter:","1) la parte que sobre las primas, cuotas o aportes se afecte a gastos generales, de administración, pago de dividendo, distribución de utilidades u otras obligaciones a cargo dela institución;","2) las sumas integradas por locación de bienes inmuebles y la venta de valores mobiliarios no exenta del gravamen, así como las provenientes de cualquier otra inversión de sus reservas.","No se computarán como ingresos, la parte de las primas de seguros destinadas a reservas matemáticas y de riesgos en curso, reaseguros pasivos y siniestros y otras obligaciones con asegurados;","Comisionistas","c) para las operaciones efectuadas por comisionistas, consignatarios, mandatarios,corredores, representantes o cualquier otro tipo de intermediación en operaciones de naturaleza análoga, la base imponible estará dada por la diferencia entre los ingresos del período fiscal y los importes que correspondan transferir en el mismo a sus comitentes.","Esta disposición no será de aplicación en los casos de operaciones de compra venta que por","b) comercialización mayorista y minorista de tabacos, cigarros y cigarrillos;","c) las operaciones de compra venta de divisas;","d) comercialización de productos con precio oficial de venta fijado por el Estado, cuando en la determinación de dicho precio de venta no se hubiere considerado la incidencia del impuesto sobre el monto total;","A opción del contribuyente, el impuesto podrá liquidarse aplicando las alícuotas pertinentes sobre el total de los ingresos respectivos.","Bases Imponibles Especiales cuenta propia efectúen los intermediarios citados en el párrafo anterior. Tampoco para los concesionarios o agentes oficiales de venta, los que se regirán por las normas generales;","Préstamos de dinero","d) en los casos de operaciones de préstamos de dinero, realizados por personas humanas o jurídicas que no sean las contempladas por la Ley de Entidades Financieras (Ley Nacional N.º 21526), la base imponible será el monto de los intereses y ajustes por desvalorización monetaria.","Cuando en los documentos referidos a dichas operaciones no se mencione el tipo de interés, o se fije uno inferior al que determine la ley impositiva, se computará este último a los fines de la determinación de la base imponible;","Comercialización de bienes usados","e) en el caso de comercialización de bienes usados recibidos como parte de pago, la base imponible será la diferencia entre su precio de venta y el monto que se le hubiere atribuido en oportunidad de su recepción.","En el caso de bienes usados registrables, con excepción de aeronaves y embarcaciones, si el precio de venta fuere inferior, igual o superior en menos de un diez por ciento (10%) al de compra o recepción, se presume, sin admitir prueba en contrario, que la base imponible es del diez por ciento (10%) sobre estos últimos valores;","Agencias de publicidad","f) para las agencias de publicidad, la base imponible está dada por los ingresos provenientes de los Servicios de Agencia, las bonificaciones por volúmenes y los montos provenientes de servicios propios y productos que facturen.","Cuando la actividad consista en la simple intermediación, los ingresos provenientes de las comisiones recibirán el tratamiento previsto para comisionistas, consignatarios, mandatarios, corredores y representantes;","Profesiones liberales","g) en el caso de ejercicio de profesionales liberales, cuando la percepción de los honorarios se efectúe - total o parcialmente - por intermedio de consejos o asociaciones profesionales, la base imponible estará constituida por el monto líquido percibido por los profesionales, entendiéndose por tal el resultante luego de deducidos los conceptos inherentes a la intermediación;","Laudo","h) de la base imponible no podrán detraerse el laudo correspondiente al personal, ni los tributos que incidan sobre la actividad, salvo los específicamente determinados en la ley."],"s":"Para las actividades expresamente indicadas, se utilizarán las siguientes bases imponibles:"},{"n":155,"t":"Precio en especie","p":["Cuando el precio se pacte en especie el ingreso bruto estará constituido por la valuación de la cosa entregada, la locación, el interés o el servicio prestado, aplicando los precios, la tasa de interés, el valor locativo, etcétera, oficiales o corrientes en plaza, a la fecha de generarse el devengamiento."],"s":"Cuando el precio se pacte en especie el ingreso bruto estará constituido por la valuación de la cosa entregada, la locación, el interés o el servicio prestado, aplicando los precios, la tasa de interés, el valor locativo,…"},{"n":156,"t":"Ingresos devengados","p":["Los ingresos brutos se imputarán al período fiscal en que se devengan. Se entenderá que los ingresos se han devengado, salvo las excepciones previstas en la presente ley:","a) en el caso de venta de bienes inmuebles, desde el momento de la firma del boleto, de la posesión o escrituración, el que fuere anterior;","b) en el caso de venta de otros bienes, desde el momento de la facturación o de la entrega del bien o acto equivalente, el que fuere anterior;","c) en los casos de trabajos sobre inmuebles de terceros, desde el momento de la aceptación del certificado de obra, parcial o total o de la percepción total o parcial del precio o de la facturación, el que fuere anterior;","d) en el caso de prestaciones de servicios y de locaciones de obras y servicios - excepto las comprendidas en el inciso anterior -, desde el momento en que se factura o termina total o parcialmente, la ejecución o prestación pactada, el que fuere anterior, salvo que las mismas se efectuaren sobre bienes o mediante su entrega, en cuyo caso el gravamen se devengará desde el momento de la entrega de tales bienes;","e) en el caso de provisión de energía eléctrica, agua o gas, o prestaciones de servicios de: cloacas, desagües o telecomunicaciones, desde el momento en que se produzca el vencimiento del plazo fijado para su pago o desde su percepción total o parcial, el que fuereanterior;","f) en el caso de intereses, desde el momento en que se generan y en proporción al tiempo transcurrido hasta cada período de pago del impuesto;","g) en el caso de recupero total o parcial de créditos deducidos con anterioridad como incobrables, en el momento que se verifique el recupero;","h) en los demás casos, desde el momento en que se genera el derecho o la contraprestación.","A los fines de lo dispuesto precedentemente, se presume que el derecho a la percepción se devenga con prescindencia de la exigibilidad del mismo."],"s":"Los ingresos brutos se imputarán al período fiscal en que se devengan"},{"n":157,"t":"Deducciones Admitidas","p":["De la base imponible - en los casos en que se determine por el principio general - se deducirán los siguientes conceptos:","a) las sumas correspondientes a devoluciones, bonificaciones y descuentos efectivamente acordados por época de pago, volumen de ventas, u otros conceptos similares, generalmente admitidos según los usos y costumbres, correspondientes al período fiscal que se liquida;","b) el importe de los créditos incobrables producidos en el transcurso del período fiscal que se liquida y que hayan sido computados como ingreso gravado en cualquier período fiscal.","Esta deducción no será procedente cuando la liquidación se efectúe por el método de lo percibido.","Constituyen índices justificativos de la incobrabilidad cualquiera de los siguientes: la cesación de pagos real y manifiesta, la quiebra, el concurso preventivo, la desaparición del deudor, la prescripción, la iniciación del cobro compulsivo.","En caso de posterior recupero, total o parcial, de los créditos deducidos por este concepto, se considerará que ello es un ingreso gravado imputable al período fiscal en que el hecho ocurra;","c) los importes correspondientes a envases y mercaderías devueltas por el comprador, siempre que no se trate de actos de retroventa o retrocesión.","Las deducciones enumeradas precedentemente podrán efectuarse cuando los conceptos a que se refieren correspondan a operaciones o actividades de los que derivan los ingresos objeto de la imposición.","Las mismas deberán efectuarse en el período fiscal en que la erogación, débito fiscal o detracción tenga lugar y siempre que sean respaldadas por las registraciones contables o comprobantes respectivos."],"s":"De la base imponible - en los casos en que se determine por el principio general - se deducirán los siguientes conceptos:"},{"n":158,"t":"Estados Provinciales, las Municipalidades, sus dependencias, reparticiones autárquicas y des","p":["Están exentos del pago de este gravamen:","a) las actividades ejercidas por el Estado Nacional, los Estados Provinciales y las Municipalidades, sus dependencias, reparticiones autárquicas y descentralizadas. No seencuentran comprendidos en esta disposición los organismos o empresas que ejerzan actos de comercio o industria;","b) la prestación de servicios públicos efectuados directamente por el Estado Nacional, los Estados Provinciales, las Municipalidades, sus dependencias, reparticiones autárquicas y descentralizadas, cuando las prestaciones efectuadas lo sean en función de Estado como poder público, y siempre que no constituyan actos de comercio o industria o de naturaleza financiera, salvo los casos de transporte y comunicaciones a cargo de las empresas estatales;","c) las bolsas de comercio autorizadas a cotizar títulos valores y los mercados de valores;","d) toda operación realizada por personas humanas sobre títulos, letras, bonos, obligaciones y demás papeles emitidos y que se emitan en el futuro por la Nación, las Provincias, la Ciudad Autónoma de Buenos Aires y las Municipalidades, como así también las rentas producidas por los mismos y/o los ajustes de estabilización o corrección monetaria. Esta exención no alcanza a los títulos, bonos, letras, certificados de participación y demás instrumentos, emitidos y que se emitan en el futuro por el Banco Central de la República Argentina;","e) la edición de libros, diarios, periódicos y revistas, en todo su proceso de creación, ya sea que la actividad la realice el propio editor, o terceros por cuenta de éste.","Considerase libros, únicamente las obras literarias de cualquier clase, los manuales y libros técnicos, las bibliografías, los libros escolares, diccionarios, enciclopedias, anuarios,catálogos de museos, de bibliotecas (con excepción de los catálogos comerciales), los libroslitúrgicos, de salterios (que no sean obras musicales impresas) y los libros para niños (con excepción de los álbumes o libros de estampas y de los cuadernos para dibujar o colorear).","Las cubiertas, cierres protectores y similares que se vendan con las obras, se considera que forman parte integrante de los libros.","Igual tratamiento tendrá la distribución y venta de los impresos citados.","Están comprendidos en esta exención los ingresos provenientes de la locación de espacios publicitarios (avisos, edictos, solicitadas, etcétera);","f) las representaciones diplomáticas y consulares de los países extranjeros acreditados ante el gobierno de la República, dentro de las condiciones establecidas por la ley nacional de exenciones impositivas para representaciones diplomáticas (Ley Nacional N.º 13238);","g) las asociaciones mutualistas, por las cuotas sociales y por las contribuciones que perciba, con excepción de la actividad que puedan desarrollar en materia de seguros;","h) los ingresos de los socios o accionistas de cooperativas de trabajo, provenientes de los servicios prestados en las mismas. Esta exención no alcanza a los ingresos provenientes de prestaciones o locaciones de obra o de servicios por cuenta de terceros, aun cuando dichos terceros sean socios o accionistas o tengan inversiones que no integren el capital societario.","Tampoco alcanza a los ingresos de las cooperativas citadas;","i) los ingresos obtenidos por asociaciones, entidades o comisiones de beneficencia, de bien público, asistencia social, de educación, científica, artísticas, culturales y deportivas, instituciones religiosas y asociaciones gremialistas, y únicamente por el cobro de las cuotas sociales y otras contribuciones que perciba de sus asociados, benefactores o terceros o por larealización de festivales o actos de cultura, deportivos o esparcimientos, siempre que los ingresos obtenidos sean destinados exclusivamente al objeto previsto en sus estatutos sociales, acta de constitución o documento similar, y en ningún caso se distribuyan directa o indirectamente entre los socios. En estos casos, se deberá contar con personería jurídica o gremial o el reconocimiento o autorización por autoridad competente, según corresponda;","j) los intereses de depósito en cajas de ahorro y a plazo fijo correspondientes a personas humanas;","k) los ingresos provenientes de las siguientes actividades de producción primaria:","1) agropecuaria;","2) silvicultura y extracción de madera;","3) caza;","4) pesca.","En todos los casos, solamente estarán exentos los ingresos obtenidos por el productor primario en la primera venta que realice de los bienes obtenidos por el ejercicio de las actividades anteriormente mencionadas;","l) los establecimientos educacionales privados, incorporados a los planes de enseñanza oficial y reconocidos como tales por las respectivas jurisdicciones;","m) los ingresos provenientes de la explotación de servicios de radiodifusión y televisión, excepto el cobro del abono mensual realizado por los canales de cables;","n) los ingresos de profesiones liberales, correspondientes a cesiones o participaciones que les efectúen otros profesionales, cuando éstos últimos computen la totalidad de los ingresos como materia gravada.","Esta disposición no será de aplicación en los casos de cesiones o participaciones efectuadas por empresas o sociedades inscriptas en la Dirección General de Personas Jurídicas y Registro Público de la Provincia; ñ)los préstamos hipotecarios otorgados a personas humanas para la adquisición, construcción, refacción o ampliación de vivienda única familiar y de ocupación permanente otorgados por entidades financieras u otras instituciones sujetas al régimen de la Ley de Entidades Financieras."],"s":"Están exentos del pago de este gravamen:"},{"n":159,"t":"","p":["El período fiscal será el año calendario.","El pago se hará por el sistema de anticipos y ajuste fiscal, sobre ingresos calculados sobre base cierta en las condiciones y plazos que determine la Dirección.","Tratándose de contribuyentes comprendidos en las disposiciones del Convenio Multilateral del 18/08/77 y sus modificaciones, los anticipos y el pago final serán mensual, con vencimiento en la fecha que determinen los organismos de aplicación del citado convenio y que se trasladará al primer día hábil posterior cuando la fecha adoptada con carácter generalrecayera en un día que no lo fuere."],"s":"El período fiscal será el año calendario."},{"n":160,"t":"Liquidación","p":["El impuesto se liquidará por declaración jurada, en los plazos y condiciones que se determinen de acuerdo con lo establecido en el artículo 29.","La Dirección General de Rentas establecerá, asimismo, la forma y plazos de inscripción de los contribuyentes y demás responsables.","Los contribuyentes comprendidos en las disposiciones del Convenio Multilateral del 18/08/77 y sus modificaciones, presentarán:","a) con la liquidación del primer anticipo: una declaración jurada determinativa de los coeficientes de ingresos y gastos a aplicar según las disposiciones del citado Convenio, durante el ejercicio;","b) con la liquidación del último pago: una declaración jurada en la que se resumirán las operaciones de todo el ejercicio."],"s":"El impuesto se liquidará por declaración jurada, en los plazos y condiciones que se determinen de acuerdo con lo establecido en el artículo 29."},{"n":161,"t":"Contribuyentes por Deuda Propia","p":["Los contribuyentes por deuda propia y los agentes de retención opercepción ingresarán el impuesto de conformidad con lo que determine al efecto la Dirección.","El impuesto se ingresará por depósito en el banco que actúe como agente financiero de la provincia de Misiones o en las entidades bancarias con las que se convenga la percepción. como materia gravada.","Esta disposición no será de aplicación en los casos de cesiones o participaciones efectuadas por empresas o sociedades inscriptas en la Dirección General de Personas Jurídicas y Registro Público de la Provincia; ñ)los préstamos hipotecarios otorgados a personas humanas para la adquisición, construcción, refacción o ampliación de vivienda única familiar y de ocupación permanente otorgados por entidades financieras u otras instituciones sujetas al régimen de la Ley de Entidades Financieras.","Cuando resulte necesario a los fines de facilitar la recaudación del impuesto, el Poder Ejecutivo podrá establecer otras formas de percepción."],"s":"Los contribuyentes por deuda propia y los agentes de retención opercepción ingresarán el impuesto de conformidad con lo que determine al efecto la Dirección."},{"n":162,"t":"Ejercicio de Varias Actividades","p":["Cuando un contribuyente ejerza dos o más actividades o rubros alcanzados con distinto tratamiento, deberá discriminar en sus declaraciones juradas el monto de los ingresos brutos correspondiente a cada uno de ellos.","Cuando omitiera esta discriminación, estará sujeto a la alícuota más elevada, tributando en su caso, un impuesto no menor a la suma de los mínimos establecidos en la Ley XXII – N.° 25, Ley de Alícuotas para cada actividad o rubro.","Las actividades o rubros complementarios de una actividad principal -incluido financiación y ajustes por desvalorización monetariaestarán sujetos a la alícuota que, para aquella, contemple la Ley XXII – N.° 25, Ley de Alícuotas."],"s":"Cuando un contribuyente ejerza dos o más actividades o rubros alcanzados con distinto tratamiento, deberá discriminar en sus declaraciones juradas el monto de los ingresos brutos correspondiente a cada uno de ellos."},{"n":163,"t":"Actividades no previstas","p":["Del ingreso bruto no podrán efectuarse otras detracciones que las explícitamente enunciadas en la presente ley, las que, únicamente podrán ser usufructuadas por parte de los responsables que, en cada caso, se indican.","No dejará de gravarse un ramo o actividad por el hecho de que no haya sido previsto en forma expresa en esta ley o en la Ley XXII – N.° 25, Ley de Alícuotas. En tal supuesto, se aplicará la alícuota general."],"s":"Del ingreso bruto no podrán efectuarse otras detracciones que las explícitamente enunciadas en la presente ley, las que, únicamente podrán ser usufructuadas por parte de los responsables que, en cada caso, se indican."},{"n":164,"t":"Deducción de Retenciones","p":["En la declaración jurada de los anticipos o del último pago, se deducirá el importe de las retenciones sufridas, procediéndose, en su caso, al depósito del saldo resultante a favor del Fisco."],"s":"En la declaración jurada de los anticipos o del último pago, se deducirá el importe de las retenciones sufridas, procediéndose, en su caso, al depósito del saldo resultante a favor del Fisco."},{"n":165,"t":"Convenio Multilateral - Impuestos Mínimos","p":["Los contribuyentes que ejerzan actividades en dos o más jurisdicciones, ajustarán su liquidación a las normas del Convenio Multilateral vigente.","No son aplicables a los mencionados contribuyentes, las normas generales relativas aimpuestos mínimos, salvo el caso de iniciación de actividades."],"s":"Los contribuyentes que ejerzan actividades en dos o más jurisdicciones, ajustarán su liquidación a las normas del Convenio Multilateral vigente."},{"n":166,"t":"Convenio Multilateral - Formas de Pago","p":["Las normas relativas a la mecánica de pago y transferencia y losformularios de pago, serán dispuestos por la Comisión Arbitral del Convenio Multilateral."],"s":"Las normas relativas a la mecánica de pago y transferencia y losformularios de pago, serán dispuestos por la Comisión Arbitral del Convenio Multilateral."},{"n":167,"t":"Fijación de Alícuotas y Montos Fijos","p":["La Ley XXII – N.° 25, Ley de Alícuotas establecerá las distintas alícuotas a aplicar a los hechos imponibles alcanzados por la presente ley.","La misma ley fijará los importes que se fijen para actividades que tributen por monto fijo, tomando en consideración la actividad, la categoría de los servicios prestados o actividades realizadas, el mayor o menor número de suntuosidad, las características económicas u otros parámetros representativos de la actividad desarrollada."],"s":"La Ley XXII – N.° 25, Ley de Alícuotas establecerá las distintas alícuotas a aplicar a los hechos imponibles alcanzados por la presente ley."},{"n":168,"t":"Hecho imponible","p":["Por los actos jurídicos, instrumentos públicos o privados, documentos, contratos, operaciones y registraciones de carácter oneroso que se realicen en el territorio de la Provincia, formalizados entre presentes o ausentes, sea mediante correspondencia, correo electrónico, con firma electrónica o digital o cualquier otro medio, así como los que se efectúen con intervención de las bolsas o mercados, se deberá pagar un impuesto con arregloa las disposiciones de este Título y de acuerdo con las alícuotas o cuotas fijas que establezca la ley respectiva.","Quedan comprendidas en el párrafo anterior las operaciones monetarias o financieras que representen entregas o recepciones de dinero que devenguen interés efectuados por entidades financieras regidas por la Ley Nacional N.º 21526 y sus modificaciones.","Los instrumentos que no fueren nominados de un modo especial, quedarán sujetos a las tasas o cuota fija que establezca la Ley XXII – N.° 25, Ley de Alícuotas para los no gravados expresamente con una tasa determinada.","Los instrumentos por los cuales se formalicen préstamo de uso o comodato, a los fines de esta ley, se presumirán onerosos -salvo prueba en contrariocuando al menos una de las partes revista o asuma la calidad de comerciante o cuando la cosa no fungible, mueble o raíz, sea destinada al desarrollo o explotación de actividades mercantiles o actos de comercio, de acuerdo con las constataciones que efectúe la Dirección.","Quedan también sujetos al pago de este impuesto los actos, instrumentos públicos o privados, documentos, contratos, operaciones y registraciones de las características indicadas en los párrafos anteriores que se realicen fuera de la Provincia, cuando surtan efectos jurídicos o económicos en ella, sea que se formalicen o concierten en lugares de dominio público o privado, incluidos: aeropuertos, aeródromos, estaciones ferroviarias, yacimientos y demás lugares de interés público o establecimientos de utilidad nacional, en tanto la imposición no interfiera en el cumplimiento de los fines específicos de dichos establecimientos.","En todos los casos, los actos formalizados en el exterior deberán pagar el impuesto de acuerdo con las prescripciones de la presente ley, al tener efectos en la jurisdicción de la provincia de Misiones.","Los contratos de seguro serán gravados únicamente cuando cubran riesgos sobre cosas situadas o personas radicadas o domiciliadas en la provincia de Misiones.","Los instrumentos que no consignen el lugar en que fueron extendidos, se reputarán otorgados en jurisdicción provincial, sin admitir prueba en contrario.","En el caso de compraventa de automotores y motocicletas cero (0) kilómetro deberá suscribirse el formulario que al efecto suministre la Dirección General de Rentas."],"s":"Por los actos jurídicos, instrumentos públicos o privados, documentos, contratos, operaciones y registraciones de carácter oneroso que se realicen en el territorio de la Provincia, formalizados entre presentes o ausentes, sea…"},{"n":169,"t":"","p":["También estarán sujetos al impuesto los documentos de cualquier naturaleza, que se presenten como título justificativo de la propiedad a los efectos de obtenerla matriculación respectiva o la inscripción de la transmisión del dominio de automotores decualquier tipo, motocicletas, embarcaciones y aeronaves, en este caso, el tributo abonado cubre el que pueda corresponder sobre la instrumentación del acto."],"s":"También estarán sujetos al impuesto los documentos de cualquier naturaleza, que se presenten como título justificativo de la propiedad a los efectos de obtenerla matriculación respectiva o la inscripción de la transmisión del…"},{"n":170,"t":"Actos Gravados Celebrados en Otras Jurisdicciones Provinciales o Nacionales","p":["Los actos imponibles de acuerdo con la presente ley, formalizados en instrumentos públicos o privados en otras jurisdicciones provinciales o nacionales del país se encuentran sujetos al pago de este impuesto en los siguientes casos:","a) cuando se trate de actos que tengan por objeto o que prometan la constitución, modificación o extinción de cualquier derecho real sobre bienes inmuebles ubicados dentro de la Provincia o sobre bienes muebles registrables, inscriptos en esta jurisdicción;","b) los contratos de locación o sublocación de inmuebles ubicados en la Provincia, así como los que instrumenten la locación de servicios y obras públicas o privadas sobre tales bienes;","c) los contratos de suministro de materiales y equipos para la ejecución de obras públicas en el país, que se formalicen en instrumentos separados del de la ejecución de la obra, cuando en tales instrumentos conste que a la fecha de celebración del contrato de dichos bienes se encontraban ubicados en la Provincia o, no habiendo constancia de la ubicación de los mismos, que el domicilio del vendedor esté ubicado en esta jurisdicción;","d) las operaciones de compra venta de cereales, oleaginosas, semovientes, productos y subproductos ganaderos, agrícolas, forestales, apícolas, avícolas, frutícolas, de la pesca y dela minería, registrados o no en bolsas y mercados, cuando en los respectivos instrumentos o registros conste que a la fecha de celebración del contrato dichos bienes se encontraban ubicados en la Provincia, o, no habiendo constancia de la ubicación de los mismos, que el domicilio del vendedor esté ubicado en esta jurisdicción;","e) los contratos de constitución de sociedades o ampliación de su capital, sobre los aportes efectuados en:","1) bienes inmuebles o muebles registrables que resulten sujetos al impuesto de esta ley en virtud de lo dispuesto por el inciso a) de este artículo;","2) semovientes, cuando en el instrumento conste que a la fecha de celebración del contrato; dichos bienes se encontraban ubicados en la Provincia;","f) los contratos de prórroga del término de duración de sociedades con domicilio social en la Provincia;","g) los demás actos otorgados fuera de la Provincia al tener efectos en ella cuando no estén alcanzados por el impuesto del lugar de su otorgamiento y siempre que dicha liberación tributaria no provenga de una exención objetiva o subjetiva, salvo lo dispuesto en el inciso i);","h) en todos los casos los actos formalizados en el exterior deberán pagar el impuesto de acuerdo con las prescripciones de la presente ley al tener efectos en jurisdicción de la Provincia;","i) se considerarán sujetos al presente impuesto, los contratos de seguros que cubran riesgos sobre cosas situadas o personas domiciliadas en la Provincia, exceptuando los contratos de seguros de vida obligatorio.","A los fines previstos en los incisos g) y h) se consideran efectos de los instrumentos en esta Provincia cuando se realicen en ella cualesquiera de los siguientes actos:","Aceptación, protesto, cumplimiento de los actos que constaten, inscripción en los registros públicos, presentación ante autoridades judiciales, administrativas, árbitros, jueces o amigables componedores, cuando tengan por objeto hacer valer, modificar o dejar sin efectolos derechos u obligaciones constatados en los respectivos instrumentos.","La escritura de fecha cierta o la agregación de documentos con el solo objeto de acreditar personería o extremos probatorios que no tengan el objeto designado en el párrafo anterior, no se considerarán efectos para la imposición de los documentos."],"s":"Los actos imponibles de acuerdo con la presente ley, formalizados en instrumentos públicos o privados en otras jurisdicciones provinciales o nacionales del país se encuentran sujetos al pago de este impuesto en los siguientes…"},{"n":171,"t":"Actos celebrados en la Provincia - No gravados","p":["Los actos imponibles de acuerdo con la presente ley, formalizados en instrumentos públicos o privados en jurisdicción de la Provincia, no estarán sujetos al pago de este impuesto en los siguientes casos:","a) cuando se trate de actos que tengan por objeto o prometan la constitución, transmisión, modificación o extinción de cualquier derecho real sobre inmuebles ubicados fuera de la Provincia o sobre bienes muebles registrables, inscriptos en otras jurisdicciones;","b) los contratos de locación o sublocación de inmuebles ubicados fuera de la Provincia, así como los que instrumenten la locación de servicios y obras públicas o privadas sobre tales bienes;","c) los contratos de suministros de materiales y equipos para la ejecución de obras públicas en el país, que se formalicen en instrumentos separados del de la ejecución de la obra, cuando en tales instrumentos conste que a la fecha de celebración del contrato dichos bienes se encontraban ubicados fuera de la Provincia o, no habiendo constancia de la ubicación de los mismos, que el domicilio del vendedor esté ubicado fuera de esta jurisdicción;","d) las operaciones de compra venta de cereales, oleaginosas, semovientes, productos y subproductos ganaderos, agrícolas, forestales, apícolas, avícolas, frutícolas, de la pesca y dela minería, registrados o no en bolsas y mercados, cuando en los respectivos instrumentos o registros conste que a la fecha de celebración del contrato dichos bienes se encontraban fuera de la Provincia o, no habiendo constancia de la ubicación de los mismos, que el domicilio del vendedor esté ubicado en otra jurisdicción;","e) cuando se trate de constitución de sociedades o ampliación de su capital, por el monto que corresponda asignar de acuerdo con el instrumento respectivo a los aportes efectuados en:","1) bienes inmuebles o muebles registrables que deban atribuirse a otra jurisdicción en virtud de lo dispuesto en el inciso a) de este artículo;","2) semovientes, cuando en el instrumento conste que a la fecha de celebración del contrato dichos bienes se encontraban ubicados fuera de la Provincia;","f) los contratos de prórroga del término de duración de sociedades con domicilio social fuera de la Provincia."],"s":"Los actos imponibles de acuerdo con la presente ley, formalizados en instrumentos públicos o privados en jurisdicción de la Provincia, no estarán sujetos al pago de este impuesto en los siguientes casos:"},{"n":172,"t":"Instrumentación","p":["Los actos y contratos a que se refiere la presente ley quedarán sujetos al impuesto por la sola creación y existencia material de los instrumentos respectivos, con abstracción de su validez, eficacia jurídica o posterior cumplimiento.","A los fines de esta ley, se entenderá por instrumento toda escritura, papel o documento del que surja el perfeccionamiento de los actos, contratos u operaciones alcanzados por la misma, de manera que revista los caracteres exteriores de un título jurídico con el cual pueda ser exigido el cumplimiento de las obligaciones, con abstracción e independencia de los actos que efectivamente realicen los contribuyentes y aun cuando se haya prescindido de las formas y modalidades que los usos, costumbres, normas legales especiales y la legislación común determinen para su instrumentación.","Salvo los casos que expresamente se prevean en la ley o su reglamentación, la anulación de los actos o la no utilización total o parcial de los instrumentos, no dará lugar a devolución, compensación o acreditación del impuesto pagado."],"s":"Los actos y contratos a que se refiere la presente ley quedarán sujetos al impuesto por la sola creación y existencia material de los instrumentos respectivos, con abstracción de su validez, eficacia jurídica o posterior…"},{"n":173,"t":"Obligaciones condicionales","p":["Las obligaciones condicionales se entenderán, a los efectos del impuesto como si fueran puras y simples."],"s":"Las obligaciones condicionales se entenderán, a los efectos del impuesto como si fueran puras y simples."},{"n":174,"t":"Actos no gravados","p":["No abonarán nuevo impuesto los actos de aclaratoria, confirmación o ratificación de actos anteriores sujetos al tributo y los de simple modificación de las cláusulas pactadas, siempre que:","a) no se aumente su valor, cualquiera fuera la causa (aumento del precio pactado, mayores costos, actualización por desvalorización monetaria, etcétera);","b) no se cambie su naturaleza o los términos del acuerdo, o de otro modo no se efectúe la novación de las obligaciones convenidas;","c) no se sustituyan las partes intervinientes o no se prorrogue el plazo convenido, cuando la prórroga pudiera hacer variar el impuesto aplicable.","Si se dieran estos supuestos, se pagará, sobre el respectivo instrumento, el impuesto que corresponda por el nuevo acto o la ampliación de valor que resulte.","Tampoco abonarán impuesto los documentos que se emitan en ejecución de cláusulas pactadas en un contrato anterior sujeto al tributo (certificados de obra, liquidaciones y sus complementos, actas de reconocimiento, etcétera) aunque en los mismos se reconozca un mayor valor, siempre que éste sea la consecuencia de la aplicación de los mecanismos previstos en el contrato anterior."],"s":"No abonarán nuevo impuesto los actos de aclaratoria, confirmación o ratificación de actos anteriores sujetos al tributo y los de simple modificación de las cláusulas pactadas, siempre que:"},{"n":175,"t":"Actos entre ausentes","p":["Será considerado acto sujeto al pago del impuesto que esta ley determina, aquel que se formalice en forma epistolar, por carta, cable o telegrama, siempre que se verifique cualquiera de las siguientes condiciones:","a) se acepte la propuesta o el pedido formulado por carta, cable o telegrama, reproduciendo totalmente la propuesta o sus enunciaciones o elementos esenciales que permitan determinar el objeto del contrato;","b) las propuestas o pedidos, o los presupuestos aplicados, aceptados con su firma por sus destinatarios.","A los fines del párrafo anterior, será en todos los casos requisito para la gravabilidad del acto, que la aceptación respectiva haya sido recibida por el emisor de la propuesta, pedido o presupuesto.","La carta, cable o telegrama o cualquier otra correspondencia o papel firmado que acepte la propuesta o el pedido, sin reunir las condiciones establecidas en el primer párrafo de este artículo, estarán gravados en el caso de ser presentados en juicio para hacer valer las obligaciones convenidas, su modificación o resolución.","En dicha eventualidad, sólo deberá abonarse el tributo por toda la correspondencia que se refiere a un mismo acto.","Quedan comprendidos como actos jurídicos y operaciones gravados, los contratos entre ausentes con cláusulas de aceptación ficta formalizados mediante propuestas, pedidos,presupuestos, compromiso o promesa de venta, proformas, ofertas o cartas de ofertas aceptadas tácitamente o en forma pura
