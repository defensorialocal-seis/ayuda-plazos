los sin tracción propia, aptos para el transporte de cargas por remolque. Se considerarán incluidos en este tipo los denominados acoplados, semiacoplados, acoplados de un eje y trailers.","Tipo 5: Vehículos denominados cuatriciclos, motos, motonetas, motocicletas, con o sin acoplados, motocargas y triciclos motorizados.","Tipo 6: Vehículos sin tracción propia, denominados casillas rodantes.","Se incluirá en cada categoría a las versiones o variantes de los modelos automotores que por sus características y valores fueren similares a los señalados ut supra, siendo las clasificaciones anteriores descriptas meramente enunciativas."],"s":"Los vehículos automotores, remolques y acoplados se clasificarán en los siguientes tipos:"},{"n":248,"t":"Plazo – Forma","p":["El pago del gravamen se efectuará en la forma y oportunidad que establezca la Dirección General de Rentas, de acuerdo a las constancias de los registros de contribuyentes y a los aforos que provea la Ley XXII – N° 25, Ley de Alícuotas.","Procedimiento – Inscripción Transcurridos más de tres (3) años sin que se logre la disponibilidad del vehículo, el contribuyente quedará automáticamente liberado de los gravámenes suspendidos y se procederá a darle la baja de los registros.","En el supuesto que, transcurrido el término previsto en el párrafo anterior, se obtuviese su disponibilidad legal, corresponderá la reinscripción y el pago del gravamen a partir de dicha fecha."],"s":"El pago del gravamen se efectuará en la forma y oportunidad que establezca la Dirección General de Rentas, de acuerdo a las constancias de los registros de contribuyentes y a los aforos que provea la Ley XXII – N° 25, Ley de…"},{"n":249,"t":"Transformación de Vehículos","p":["El Poder Ejecutivo reglamentará el procedimiento para el cobro del gravamen y el trámite de inscripción de los responsables."],"s":"El Poder Ejecutivo reglamentará el procedimiento para el cobro del gravamen y el trámite de inscripción de los responsables."},{"n":250,"t":"Cambio de Radicación","p":["En los casos de nueva radicación el gravamen debe ser abonado previo el trámite de inscripción del dominio en proporción al tiempo que resta para finalizar el año fiscal, computándose dicho plazo por meses enteros.","Cuando la incorporación a que se refiere el párrafo anterior origine un cambio en la radicación del vehículo, el gravamen correspondiente al año fiscal en que ocurre dicho acto no será exigible en tanto el responsable acredite que fue abonado en la Provincia o municipalidad de origen. En caso contrario se tributará el correspondiente a dicho año fiscal."],"s":"En los casos de nueva radicación el gravamen debe ser abonado previo el trámite de inscripción del dominio en proporción al tiempo que resta para finalizar el año fiscal, computándose dicho plazo por meses enteros."},{"n":251,"t":"Baja – Pago","p":["Cuando se solicite la baja como contribuyente por algún vehículo automotor, el gravamen se abonará totalmente por el ejercicio fiscal en que ocurre el hecho,salvo que se trate del caso previsto en el inciso c) del artículo siguiente. En este caso se abonará en función del tiempo transcurrido durante dicho ejercicio."],"s":"Cuando se solicite la baja como contribuyente por algún vehículo automotor, el gravamen se abonará totalmente por el ejercicio fiscal en que ocurre el hecho,salvo que se trate del caso previsto en el inciso c) del artículo…"},{"n":252,"t":"Baja – Casos","p":["Sólo puede otorgarse la baja como contribuyente en los siguientes casos:","a) transferencia del dominio del vehículo considerado;","b) radicación del vehículo fuera de la Provincia, por cambio de domicilio del contribuyente;","c) inhabilitación definitiva del vehículo debidamente acreditado mediante los informes policiales correspondientes.","Los Municipios implementarán sus registraciones cuando se produzcan modificaciones por cambio de domicilio dentro de la Provincia, con el objeto de mantener el padrón de su jurisdicción actualizado.","En caso de indisponibilidad del vehículo a causa de una decisión judicial o como consecuencia de un hecho de carácter delictivo, debidamente denunciado o probado, no se abonará el gravamen desde la fecha del hecho o acto que originara dicha indisponibilidad y hasta la fecha en que esta cese."],"s":"Sólo puede otorgarse la baja como contribuyente en los siguientes casos:"},{"n":253,"t":"","p":["Están exentos del pago del presente gravamen:","a) El Estado Nacional, los Estados Provinciales y las Municipalidades, sus dependencias y reparticiones autárquicas o descentralizadas. No se encuentran comprendidas en ésta exención las empresas de los Estados mencionados, cuando realicen operaciones comerciales, industriales, bancarias, de seguros, de prestación de servicios y cualquier otra actividad a título oneroso;","b) instituciones religiosas e instituciones de beneficencia pública, con personería jurídica;","c) representaciones diplomáticas y cónsules acreditados en nuestro país, de los Estados con los cuales exista reciprocidad, afectados al servicio de sus funciones;","d) cuerpos de bomberos voluntarios;","e) los vehículos de propiedad de las personas sujetas a alguna discapacidad de carácter permanente, que por su grado requiera la utilización de vehículos con comandos o mecanismos de adaptación necesaria para su uso exclusivo.","Asimismo, los vehículos adquiridos mediante el régimen nacional de beneficio para personas discapacitadas.","En todos los casos, el interesado deberá acreditar con certificado médico, expedido por instituciones estatales, su condición para acceder al beneficio.","La exención alcanzará a un solo vehículo cuyo valor sea inferior al fijado por la Dirección General de Rentas de la tabla de valuación vigente, deducidos los impuestos que declara exento la Ley Nacional de Automotores para personas con Discapacidad (Ley N° 19279) y sus modificatorias por beneficiario y se mantendrá mientras conserve la titularidad dominial y tenencia del mismo."],"s":"Están exentos del pago del presente gravamen:"},{"n":254,"t":"Distribución","p":["Lo recaudado en concepto del presente gravamen será distribuido de la siguiente forma:","a) a los Municipios del total, el cien por ciento (100%), de lo devengado a partir de la vigencia de la presente, en concepto del tributo aplicado sobre los vehículos Tipos 1, 2, 3, 4, 5 y 6 con más de dieciséis (16) años de antigüedad en su año de fabricación o modelo y en relación a los vehículos registrados en cada uno;","b) a los Municipios el setenta y cinco por ciento (75%), y en relación a los vehículos registrados en cada uno, exceptuando lo establecido en el inciso a);","c) a Rentas Generales de la Provincia, el veinticinco por ciento (25%) restante exceptuando lo establecido en el inciso a);","d) la provisión de los formularios para la liquidación del impuesto se hará con cargo a los Municipios y en relación a los vehículos registrados en cada uno."],"s":"Lo recaudado en concepto del presente gravamen será distribuido de la siguiente forma:"},{"n":255,"t":"Intereses","p":["Los contribuyentes que abonaren el gravamen fuera de los términos que se establezcan serán pasibles de los intereses previstos en el Libro Primero del Código Fiscal.","La distribución de ese concepto se efectuará entre la Provincia y los Municipios en la proporción fijada en el artículo anterior."],"s":"Los contribuyentes que abonaren el gravamen fuera de los términos que se establezcan serán pasibles de los intereses previstos en el Libro Primero del Código Fiscal."},{"n":256,"t":"Municipios - Falta de depósito - Descuento de la Coparticipación","p":["Cuando los Municipios no depositen en término el porcentaje correspondiente a la Provincia, dicho monto, cuando sea detectado será descontado de la primera coparticipación comunal que se liquide."],"s":"Cuando los Municipios no depositen en término el porcentaje correspondiente a la Provincia, dicho monto, cuando sea detectado será descontado de la primera coparticipación comunal que se liquide."},{"n":257,"t":"Municipios - Falta de depósito – Intereses","p":["Sin perjuicio de lo establecido en el artículo anterior, los montos omitidos devengarán automáticamente un interés equivalente al doble de la tasa diaria que cobre el banco que actúe como agente financiero de la provincia de Misiones para las operaciones de descuento a treinta días, en concepto de multa.","Dicho importe será descontado de la coparticipación mensual, en el mes en que se realice la liquidación.","Autorízase a la Contaduría General de la Provincia a los efectos establecidos en el presente artículo y en el precedente, a practicar los correspondientes descuentos."],"s":"Sin perjuicio de lo establecido en el artículo anterior, los montos omitidos devengarán automáticamente un interés equivalente al doble de la tasa diaria que cobre el banco que actúe como agente financiero de la provincia de…"},{"n":258,"t":"Baja - Libre deuda","p":["Para obtener la baja como contribuyente, el interesado deberá solicitar un certificado de libre deuda, que a tal fin otorgará la municipalidad que corresponde."],"s":"Para obtener la baja como contribuyente, el interesado deberá solicitar un certificado de libre deuda, que a tal fin otorgará la municipalidad que corresponde."},{"n":259,"t":"Tributos Comprendidos","p":["El gravamen previsto en la presente ley comprende la unificación del Impuesto al Parque Automotor y la Tasa Municipal de Patentamiento de Automotores."],"s":"El gravamen previsto en la presente ley comprende la unificación del Impuesto al Parque Automotor y la Tasa Municipal de Patentamiento de Automotores."},{"n":260,"t":"Adicionales","p":["Sobre el presente gravamen, se adicionará el diez por ciento (10%). Lo recaudado se destinará:","a) el siete y medio por ciento (7,5%) al Fondo Energético Provincial y;","b) el dos y medio por ciento (2,5%) al Fondo Provincial para Hogares de Menores en situación de riesgo. Dicho adicional deberá percibirse conjuntamente con el ImpuestoProvincial al Automotor."],"s":"Sobre el presente gravamen, se adicionará el diez por ciento (10%)"},{"n":261,"t":"Anticipos","p":["El Poder Ejecutivo de la Provincia podrá autorizar a efectuar descuentos por pago anticipado del gravamen."],"s":"El Poder Ejecutivo de la Provincia podrá autorizar a efectuar descuentos por pago anticipado del gravamen."},{"n":262,"t":"Disposiciones Transitorias","p":["Los procesos iniciados con anterioridad a la vigencia de éste Código continuarán su tramitación a través del presente."],"s":"Los procesos iniciados con anterioridad a la vigencia de éste Código continuarán su tramitación a través del presente."},{"n":263,"t":"","p":["Toda norma que haga referencia al anterior Código Fiscal se entenderá que se refieren al presente cuerpo legal."],"s":"Toda norma que haga referencia al anterior Código Fiscal se entenderá que se refieren al presente cuerpo legal."},{"n":264,"t":"","p":["Comuníquese al Poder Ejecutivo.liquidación.","Autorízase a la Contaduría General de la Provincia a los efectos establecidos en el presente artículo y en el precedente, a practicar los correspondientes descuentos."],"s":"Comuníquese al Poder Ejecutivo.liquidación."}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),N=D.nodes,A=D.arts,MAX=A.length,$=s=>document.querySelector(s),main=$('#main'),side=$('#side');
const PAL=[['#5b50c4','#eeecfb'],['#237f64','#e3f5ee']];
const SW=new Set('de del la las los el y e o en a al por para con u'.split(' '));
const tc=s=>(s||'').toLowerCase().split(' ').map((w,i)=>i&&SW.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const xref=s=>s.replace(/\b(art[íi]culos?\s+(?:N\.?\s?[º°]\s*)?)(\d{1,3})\b/gi,(m,p,n)=>+n>=1&&+n<=MAX?`${p}<a class="x" href="#/a/${n}">${n}</a>`:m);
const byN={};A.forEach(a=>byN[a.n]=a);
N.forEach((n,i)=>{n.i=i;n.ch=[]});N.forEach(n=>{if(n.par>=0)N[n.par].ch.push(n.i)});
const nodeOf={};N.forEach(n=>n.arts.forEach(x=>nodeOf[x]=n.i));
const sub=i=>{const n=N[i];if(n._s)return n._s;let r=[...n.arts];n.ch.forEach(c=>r=r.concat(sub(c)));return n._s=r.sort((a,b)=>a-b)};
const libros=N.filter(n=>n.lv==1),root=i=>{while(N[i].par>=0)i=N[i].par;return i};
const col=i=>PAL[libros.indexOf(N[root(i)])%2][0],bg=i=>PAL[libros.indexOf(N[root(i)])%2][1];
const roman=s=>/^[IVXL]+$/i.test(s)?s.toUpperCase():tc(s);
const label=n=>n.kind+' '+roman(n.num);
const title=n=>n.kind=='Libro'?tc(n.name):(tc(n.name)||label(n));
const rng=i=>{const s=sub(i);return s.length?(s[0]==s[s.length-1]?'Art. '+s[0]:`Arts. ${s[0]}–${s[s.length-1]}`):''};
const PL={Título:'títulos',Capítulo:'capítulos'};
const rub=a=>a.t||'Artículo '+a.n;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('No se pudo copiar'));

/* plazos: se detectan en el texto de cada artículo */
const PZ=/\((\d+)\)\s+(d[ií]as(?:\s+h[aá]biles|\s+corridos)?|d[ií]a|meses|mes|a[ñn]os|a[ñn]o|horas|hora)/gi;
const UN=u=>/^d/i.test(u)?'días':/^m/i.test(u)?'meses':/^a/i.test(u)?'años':'horas';
A.forEach(a=>{a.z=[];a.p.forEach(p=>{for(const m of p.matchAll(PZ)){const s=Math.max(0,m.index-90),e=Math.min(p.length,m.index+m[0].length+60);
 a.z.push({v:+m[1],u:UN(m[2]),l:m[1]+' '+m[2].toLowerCase(),c:(s?'…':'')+p.slice(s,e).trim()+(e<p.length?'…':'')})}});
 a.zl=[...new Set(a.z.map(z=>z.l))]});
const hlpz=s=>s.replace(PZ,'<mark class="pz">$&</mark>');

function nav(){let h='<h5>Índice</h5>';libros.forEach(l=>{h+=`<details><summary style="border-left:4px solid ${col(l.i)}">${label(l)} · ${esc(tc(l.name))}</summary>`;
 l.ch.forEach(c=>h+=`<a class="l" data-n="${c}" href="#/n/${c}">${label(N[c])} · ${esc(tc(N[c].name))}</a>`);h+='</details>'});side.innerHTML=h;
 $('#fc').innerHTML=`<button class="chip" data-l="" aria-pressed="true">Todo el Código</button>`+libros.map(l=>`<button class="chip" data-l="${l.i}" aria-pressed="false">${label(l)} · ${esc(tc(l.name))}</button>`).join('')}
function artHTML(a){const body=a.p.map(p=>`<p class="${/^(\d+|[a-zñ])\)\s|^[-•–]\s/.test(p)?'inc':''}">${xref(hlpz(esc(p)))}</p>`).join('');
 return `<article class="art" id="a${a.n}"><header><div class="num">Art. ${a.n}</div><div><h4>${esc(rub(a))}</h4><p class="sum">${xref(esc(a.s))}</p>${a.zl.length?`<div class="zs">${a.zl.map(z=>`<span class="pzc">⏱ ${esc(z)}</span>`).join('')}</div>`:''}</div></header>
 <div class="acts"><button class="btn sm" data-act="t">Ver texto completo</button><button class="ghost sm" data-act="c" data-n="${a.n}">Copiar</button><button class="ghost sm" data-act="l" data-n="${a.n}">Enlace</button></div><div class="full" hidden>${body}</div></article>`}
function crumbs(i){let c=[],k=i;while(k>=0){c.unshift(`<a href="#/n/${k}">${label(N[k])}</a>`);k=N[k].par}return `<nav class="crumb"><a href="#/">Inicio</a><span>›</span>${c.join('<span>›</span>')}</nav>`}
function card(i){const n=N[i],s=sub(i);const txt=n.ch.length?n.ch.slice(0,4).map(c=>tc(N[c].name)||label(N[c])).join(' · ')+(n.ch.length>4?' · …':''):s.slice(0,4).map(x=>rub(byN[x])).join(' · ')+(s.length>4?' · …':'');
 return `<a class="card" href="#/n/${i}" style="--ac:${col(i)};--b:${bg(i)}"><h3><span class="big">${label(n)}</span><br>${esc(title(n))}</h3><p>${esc(txt)}</p><div class="meta"><span>${rng(i)}</span><span>${s.length} art.</span>${n.ch.length?`<span>${n.ch.length} ${PL[N[n.ch[0]].kind]}</span>`:''}</div></a>`}
const foot=()=>`<p class="foot">Texto ordenado según la Resolución General N.º 11/2025 de la Agencia Tributaria Misiones (Boletín Oficial N.º 16397). Las síntesis y los plazos se extraen automáticamente del texto de cada artículo y son solo una guía de lectura: verificá siempre con la versión oficial vigente.</p>`;
function home(){const cnt=k=>N.filter(n=>n.kind==k).length;
 main.innerHTML=`<section class="hero"><span class="eyebrow">Provincia de Misiones</span><h1>Código Fiscal de la Provincia de Misiones</h1><p>Texto ordenado de la Ley XXII – N.º 35, con índice navegable, síntesis de cada artículo, búsqueda inteligente, referencias cruzadas y buscador de plazos.</p>
 <div class="stats"><div class="stat"><b>${A.length}</b><span>artículos</span></div><div class="stat"><b>${cnt('Libro')}</b><span>libros</span></div><div class="stat"><b>${cnt('Título')}</b><span>títulos</span></div><div class="stat"><b>${cnt('Capítulo')}</b><span>capítulos</span></div></div>
 <div class="go"><input id="gn" type="number" min="1" max="${MAX}" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button><a class="btn" href="#/plazos">⏱ Buscar plazos</a></div></section>
 <div class="sec"><h2>Libros</h2><span>Acceso rápido a cada parte del Código</span></div><div class="grid">${libros.map(l=>card(l.i)).join('')}</div>
 <div class="sec"><h2>Accesos rápidos por título</h2><span>${cnt('Título')} títulos</span></div><div class="grid">${N.filter(n=>n.lv==2).map(n=>card(n.i)).join('')}</div>${foot()}`;
 const go=()=>{const v=+$('#gn').value;v>=1&&v<=MAX?location.hash='/a/'+v:toast('Ingresá un número entre 1 y '+MAX)};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function nodeView(i){const n=N[i],s=sub(i);
 let h=crumbs(i)+`<header class="nh"><span class="eyebrow">${label(n)}</span><h1>${esc(title(n))}</h1><div class="meta"><span>${rng(i)}</span><span>${s.length} artículo${s.length>1?'s':''}</span></div></header>`;
 h+=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${s.length>1?`los artículos <b>${s[0]}</b> a <b>${s[s.length-1]}</b> (${s.length} en total)`:`el artículo <b>${s[0]}</b>`}${n.ch.length?`, organizados en ${n.ch.length} ${PL[N[n.ch[0]].kind]}:`:', que regulan:'}</p><ul>`+
 (n.ch.length?n.ch.map(c=>`<li><a href="#/n/${c}"><b>${label(N[c])}</b> – ${esc(tc(N[c].name))}</a> <small>(${rng(c)})</small></li>`).join(''):n.arts.map(x=>`<li><a href="#/a/${x}"><b>Art. ${x}</b> – ${esc(rub(byN[x]))}</a></li>`).join(''))+'</ul></div>';
 if(n.ch.length)h+=`<div class="grid">${n.ch.map(card).join('')}</div>`;
 if(n.arts.length)h+=`<div class="bar"><button class="btn sm" data-act="all">Expandir todos los textos</button><button class="ghost sm" data-act="none">Contraer todos</button></div>`+n.arts.map(x=>artHTML(byN[x])).join('');
 const u=N.filter(m=>m.arts.length),k=u.indexOf(n);if(k>=0)h+=`<div class="pn">${k>0?`<a class="ghost" href="#/n/${u[k-1].i}">← ${esc(title(u[k-1]))}</a>`:'<span></span>'}${k<u.length-1?`<a class="ghost" href="#/n/${u[k+1].i}">${esc(title(u[k+1]))} →</a>`:''}</div>`;
 main.innerHTML=h+foot();main.style.cssText=`--ac:${col(i)};--b:${bg(i)}`;
 side.querySelectorAll('.l').forEach(l=>l.classList.remove('on'));
 let t=i;while(N[t].lv>2)t=N[t].par;const l=side.querySelector(`.l[data-n="${t}"]`);if(l){l.classList.add('on');l.parentElement.open=true}}

/* búsqueda: palabras en cualquier orden, sinónimos, números y variantes */
const STOP=new Set('de del la las el los lo al a y e o u en con por para que se su sus es son ser un una como si no mas muy le les sobre entre hay ha han este esta cuando donde cual quiero busco necesito puede pueden debe deben'.split(' '));
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
function stem(w){if(/^\d+$/.test(w)||w.length<5)return w;for(const x of ['amientos','amiento','imientos','imiento','aciones','acion','uciones','ucion','adores','ador','mente','ables','able','ando','iendo','ados','adas','idos','idas','ado','ada','ido','ida','es','s','ar','er','ir','a','o','e'])if(w.endsWith(x)&&w.length-x.length>=4)return w.slice(0,-x.length);return w}
const NUM={1:'uno un una',2:'dos',3:'tres',5:'cinco',10:'diez',15:'quince',20:'veinte',30:'treinta',60:'sesenta',90:'noventa'};
const SYN=new Map();
['plazo termino lapso periodo vencimiento vence','prescripcion prescribe caducidad','impuesto tributo gravamen','multa sancion infraccion recargo','contribuyente responsable obligado sujeto','pago abono ingreso deposito','inmueble inmobiliario propiedad','automotor vehiculo rodado','sellos instrumento','ingresos brutos actividad comercio','exencion exento exime','intereses mora','determinacion liquidacion','fiscalizacion inspeccion verificacion','recurso apelacion impugnacion reconsideracion','ejecucion apremio cobro','domicilio residencia','notificacion notificar cedula intimacion','tasa servicio retribucion','base imponible valuacion aforo','rentas direccion organismo agencia','dia dias habil','mes meses','ano anos','hora horas'].forEach(g=>{const st=[...new Set(g.split(' ').map(stem))];st.forEach(s=>{if(!SYN.has(s))SYN.set(s,new Set());st.forEach(x=>SYN.get(s).add(x))})});
function accepted(t){const set=new Set(),s=stem(t);set.add(s);SYN.has(s)&&SYN.get(s).forEach(x=>set.add(x));if(/^\d+$/.test(t)&&NUM[+t])NUM[+t].split(' ').forEach(w=>set.add(stem(w)));for(const[n,ws]of Object.entries(NUM))if(ws.split(' ').includes(t))set.add(n);return set}
const near=(a,t)=>{if(a===t)return true;const sh=a.length<t.length?a:t,lg=a.length<t.length?t:a;return sh.length>=4&&lg.startsWith(sh)&&sh.length/lg.length>=.6};
const hit=(tk,acc)=>{for(const a of acc)for(const t of tk)if(near(a,t))return true;return false};
let ixd=0;const idx=()=>{if(ixd)return;ixd=1;A.forEach(a=>{a._m=new Set(words(rub(a)+' '+a.s+' '+a.n).map(stem));a._a=new Set([...a._m,...words(a.p.join(' ')).map(stem)])})};
const W=/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g,mk=(w,accs)=>{const s=stem(norm(w));return accs.some(a=>[...a].some(x=>near(x,s)))};
const hl=(t,accs)=>{let o='',p=0;for(const m of t.matchAll(W)){o+=esc(t.slice(p,m.index))+(mk(m[0],accs)?'<mark>'+esc(m[0])+'</mark>':esc(m[0]));p=m.index+m[0].length}return o+esc(t.slice(p))};
let lib='';
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
const inLib=a=>!lib||root(nodeOf[a.n])==+lib;
function search(v){const terms=[...new Set(words(v).filter(w=>!STOP.has(w)||/^\d+$/.test(w)))];if(!terms.length)return route();
 if(/^\d+$/.test(v.trim())&&byN[+v]){location.hash='/a/'+(+v);return}
 idx();main.style.cssText='';const accs=terms.map(accepted),run=need=>A.filter(a=>inLib(a)&&accs.filter(x=>hit(a._a,x)).length>=need);
 let rs=run(terms.length),partial=false;if(!rs.length&&terms.length>1){partial=true;rs=run(Math.max(1,Math.ceil(terms.length/2)))}
 rs=rs.map(a=>({a,s:accs.some(x=>hit(a._m,x))?0:1,k:accs.filter(x=>hit(a._a,x)).length})).sort((x,y)=>y.k-x.k||x.s-y.s||x.a.n-y.a.n);
 const snip=a=>{const b=a.p.join(' ');let ix=0;for(const m of b.matchAll(W))if(mk(m[0],accs)){ix=m.index;break}const st=Math.max(0,ix-70);return(st?'…':'')+b.slice(st,st+240)+(b.length>st+240?'…':'')};
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${rs.length>60?' · se muestran 60':''}${lib?' · '+esc(label(N[+lib])):''}</span></div>
 <p class="hint">${partial?'Coincidencia parcial: no hay artículos con todas las palabras; se muestran los que tienen al menos la mitad. ':''}Entiende varias palabras en cualquier orden, sinónimos y números (5 = cinco), y busca también en el texto completo.</p>`+
 (rs.slice(0,60).map(({a})=>{const n=N[nodeOf[a.n]];return `<article class="art"><header><div class="num">Art. ${a.n}</div><div><h4>${hl(rub(a),accs)}<small>${esc(label(N[root(n.i)])+' › '+label(n)+' · '+tc(n.name))}</small></h4><p class="sum">${hl(snip(a),accs)}</p></div></header><div class="acts"><a class="btn sm" href="#/a/${a.n}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Libro.</p>')}

/* vista de plazos */
let pu='todos';
function plazosView(){main.style.cssText='';
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Plazos</span></nav><div class="sec"><h2>Buscador de plazos</h2><span>Detectados en el texto de los artículos</span></div>
 <div class="tabs">${['todos','días','meses','años','horas'].map(u=>`<button data-u="${u}" class="${u==pu?'on':''}">${tc(u)}</button>`).join('')}</div>
 <div class="ctl"><input id="pq" type="search" placeholder="Filtrar por tema: ej. prescripción, recurso, pago…"><input id="pv" type="number" min="1" placeholder="Cantidad"><select id="pl"><option value="">Todo el Código</option>${libros.map(l=>`<option value="${l.i}"${lib==l.i?' selected':''}>${label(l)} · ${esc(tc(l.name))}</option>`).join('')}</select></div>
 <p class="cnt hint" id="pc"></p><table class="tb"><thead><tr><th>Artículo</th><th>Plazo</th><th>Contexto</th></tr></thead><tbody id="pb"></tbody></table>${foot()}`;
 const draw=()=>{const q=norm($('#pq').value),v=+$('#pv').value,l=$('#pl').value;let r=[];
  A.forEach(a=>a.z.forEach(z=>{if((pu=='todos'||z.u==pu)&&(!v||z.v==v)&&(!l||root(nodeOf[a.n])==+l)&&(!q||norm(rub(a)+' '+z.c).includes(q)))r.push({a,z})}));
  $('#pc').textContent=`${r.length} plazo${r.length==1?'':'s'}${r.length>150?' · se muestran 150':''}`;
  $('#pb').innerHTML=r.slice(0,150).map(({a,z})=>`<tr><td data-l="Artículo"><a class="x" href="#/a/${a.n}">Art. ${a.n}</a><div class="hint">${esc(rub(a))}</div></td><td data-l="Plazo"><span class="pzc">⏱ ${esc(z.l)}</span></td><td data-l="Contexto">${xref(esc(z.c))}</td></tr>`).join('')||'<tr><td colspan="3">Sin plazos con esos filtros.</td></tr>'};
 ['#pq','#pv'].forEach(s=>$(s).oninput=draw);$('#pl').onchange=e=>{setLib(e.target.value);draw()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{pu=b.dataset.u;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));draw()});draw()}

function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');main.style.cssText='';
 const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;if(ri!=null&&N[ri])setLib(String(root(ri)));else if(h!='/plazos')setLib('');
 if(h=='/plazos'){plazosView();scrollTo(0,0);return}
 if(!m||(m[1]=='n'&&!N[+m[2]])||(m[1]=='a'&&!byN[+m[2]])){home();scrollTo(0,0);side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));return}
 if(m[1]=='n'){nodeView(+m[2]);scrollTo(0,0)}
 else{const n=+m[2];nodeView(nodeOf[n]);const e=document.getElementById('a'+n);if(e){e.classList.add('hit');e.querySelector('.full').hidden=false;e.querySelector('[data-act=t]').textContent='Ocultar texto completo';setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}}
const setT=(a,t)=>{a.querySelector('.full').hidden=t;a.querySelector('[data-act=t]').textContent=t?'Ver texto completo':'Ocultar texto completo'};
document.addEventListener('click',e=>{
 const c=e.target.closest('#fc .chip');if(c){setLib(c.dataset.l);$('#q').value='';location.hash=c.dataset.l?'/n/'+c.dataset.l:'/';route();return}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,art=b.closest('.art');
 if(act=='t')setT(art,!art.querySelector('.full').hidden);
 else if(act=='all'||act=='none')document.querySelectorAll('.art').forEach(x=>setT(x,act=='none'));
 else if(act=='c'){const a=byN[+b.dataset.n];copy(`Artículo ${a.n}.- ${a.t}\n\n`+a.p.join('\n'),'Texto copiado')}
 else if(act=='l')copy(location.href.split('#')[0]+'#/a/'+b.dataset.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#12161f';r.dataset.theme=dk?'light':'dark'};
addEventListener('hashchange',route);
nav();route();
</script>
</body>
