irección, devengará automáticamente y sin necesidad de intimación previa, los intereses, multas o demás sanciones que por ley o este Código pudieran corresponder.","Los intereses establecidos en el presente Título no podrán ser remitidos total ni parcialmente, salvo por ley formal que así lo disponga con carácter general.","La obligación de pagar intereses subsiste no obstante la falta de reserva por parte de la Dirección al recibir el pago de la deuda principal."],"s":"Todo pago efectuado una vez vencidos los plazos fijados por este Código, leyes fiscales o la Dirección, devengará automáticamente y sin necesidad de intimación previa, los intereses, multas o demás sanciones que por ley o este…"},{"n":48,"t":"Responsabilidad Penal por Delitos Comunes y Tributarios","p":["Las contravenciones establecidas por este Código se aplicarán sin perjuicio de la responsabilidad penal por los delitos comunes o por los delitos tributarios establecidos por la Ley Penal Tributaria Nº 24769."],"s":"Las contravenciones establecidas por este Código se aplicarán sin perjuicio de la responsabilidad penal por los delitos comunes o por los delitos tributarios establecidos por la Ley Penal Tributaria Nº 24769."},{"n":49,"t":"","p":["La Dirección podrá formular denuncia penal por los delitos previstos en el artículo anterior una vez resuelto el recurso de reconsideración previsto en el artículo 86 del Código Fiscal, aun cuando se encontraren recurridos los actos respectivos. Asimismo, la Dirección podrá formular la denuncia penal con la determinación de oficio si se encuentra formada la convicción administrativa de la presunta comisión del hecho ilícito.","En aquellos casos en que no corresponda la determinación administrativa de la deuda se formulará de inmediato la pertinente denuncia, una vez formada la convicción administrativade la presunta comisión del hecho ilícito."],"s":"La Dirección podrá formular denuncia penal por los delitos previstos en el artículo anterior una vez resuelto el recurso de reconsideración previsto en el artículo 86 del Código Fiscal, aun cuando se encontraren recurridos los…"},{"n":50,"t":"","p":["La formulación de la denuncia penal no suspende ni impide la sustanciación y resolución de los procedimientos tendientes a la determinación y ejecución de la deuda tributaria, ni la de los recursos administrativos, contencioso administrativos o judiciales que se interpongan contra las resoluciones recaídas en aquellos.","El Organismo Fiscal se abstendrá de aplicar sanciones administrativas hasta que sea dictada la sentencia definitiva en sede penal.","Una vez firme la sentencia penal, la autoridad administrativa aplicará las sanciones que correspondan, sin alterar las declaraciones de hechos contenidas en la sentencia judicial."],"s":"La formulación de la denuncia penal no suspende ni impide la sustanciación y resolución de los procedimientos tendientes a la determinación y ejecución de la deuda tributaria, ni la de los recursos administrativos, contencioso…"},{"n":51,"t":"Infracciones a los Deberes Formales – Multas","p":["El incumplimiento total, parcial o defectuoso de los deberes formales establecidos en este Código, en leyes fiscales especiales, en decretos reglamentarios o resoluciones de la Dirección, constituye infracción que será reprimida con multas cuyos topesmínimos y máximos serán establecidos por la LeyXXII–N.°25,LeydeAlícuotas, sin perjuicio de las sancionesque pudieren corresponder por otras infracciones.","Los valores máximos y mínimos fijados en la Ley XXII – N.° 25, Ley de Alícuotas se aplicarán en los casos de infracciones primarias. A partir de la misma se incrementarán en un veinte por ciento (20%) dicho tope ante cada reiteración.","La infracción se considerará reiterada cuando se configure el incumplimiento por parte del contribuyente a dos o más requerimientos o emplazamientos respecto de un mismo deber formal."],"s":"El incumplimiento total, parcial o defectuoso de los deberes formales establecidos en este Código, en leyes fiscales especiales, en decretos reglamentarios o resoluciones de la Dirección, constituye infracción que será…"},{"n":52,"t":"","p":["Serán sancionados con multa de pesos diez mil ($10.000,00) a pesos quinientos mil ($ 500.000,00) y clausura de tres (3) a diez (10) días del establecimiento, local, oficina, puesto de venta, recinto comercial, industrial, agropecuario, forestal, mineral o de prestación de servicios, siempre que el valor de los bienes o servicios de que se trate exceda de pesos mil ($ 1.000,00), quienes:","a) no entregaren o no emitieren facturas o comprobantes equivalentes por una o más operaciones comerciales, industriales, agropecuarias o de prestación de servicios que realicen en las formas, requisitos y condiciones que establezca la Dirección General de Rentas;","b) no llevaren registros o anotaciones de sus adquisiciones de bienes, obras o servicios o de sus ventas, o de las prestaciones de servicios, o, si las llevaren, fueren incompletas o defectuosas, incumpliendo con las formas, requisitos y condiciones exigidos por la Dirección General de Rentas;","c) encarguen o transporten con fines comerciales mercaderías, aunque no fueren de su propiedad, sin el respaldo documental que exige la Dirección General de Rentas;","d) no se encontraren inscriptos como contribuyentes o responsables ante la Dirección General de Rentas, cuando estuvieren obligados a hacerlos en virtud de normas legales y reglamentarias;","e) no poseyeren o no conservaren las facturas o comprobantes equivalentes que acreditaren la adquisición o tenencia de los bienes, obras o servicios destinados o necesarios para el desarrollo de la actividad de que se trate;","f) no poseyeren o no conservaren en condiciones de operatividad o no utilizaren los instrumentos de medición y control de la producción, industrialización o comercialización dispuestos por leyes, decretos y normas reglamentarias, tendientes a posibilitar la verificación y fiscalización de los tributos cuya administración se encuentre a cargo de la Dirección General de Rentas.","El mínimo y el máximo de las sanciones de multa y clausura se duplicarán cuando se cometa otra infracción delas previstas eneste artículodentro delos dos (2) años desde quese detectólaanterior.","Sin perjuicio de las sanciones de multa y clausura, cuando sea pertinente, también se podrá aplicar la suspensión en el uso de la matrícula, licencia o inscripción en registros que las disposiciones legales y reglamentarias exigen para el ejercicio de determinadas actividades, cuando su otorgamiento sea competencia del Poder Ejecutivo Provincial.","La sanción de clausura podrá aplicarse atendiendo a la gravedad del hecho y a la condición de reincidente del infractor."],"s":"Serán sancionados con multa de pesos diez mil ($10.000,00) a pesos quinientos mil ($ 500.000,00) y clausura de tres (3) a diez (10) días del establecimiento, local, oficina, puesto de venta, recinto comercial, industrial,…"},{"n":53,"t":"Comiso - Medidas Preventivas – Depositario","p":["En los supuestos en que se detecte la tenencia, el traslado o transporte de bienes, cosas, obras o mercancías sin cumplir con los recaudos previstos en los incisos c) y veinte por ciento (20%) dicho tope ante cada reiteración.","La infracción se considerará reiterada cuando se configure el incumplimiento por parte del contribuyente a dos o más requerimientos o emplazamientos respecto de un mismo deber formal.","Multa y Clausura","e) del artículo precedente, los funcionarios o agentes de la Dirección General de Rentas deberán convocar inmediatamente a la fuerza de seguridad con jurisdicción en el lugar dondese haya detectado la presunta infracción, quienes deberán instrumentar sin dilación elprocedimiento tendiente a la aplicación de las siguientes medidas preventivas:","a) interdicción, en cuyo caso se designará como depositario al propietario, transportista, tenedor o a quien acredite ser poseedor al momento de comprobarse el hecho;","b) secuestro, en cuyo supuesto se deberá designar depositario a una tercera persona.","En todos los casos, el personal de seguridad actuante, en presencia de dos (2) testigos hábiles que convoque para el acto, procederá a informar al presunto infractor las previsiones y obligaciones que establecen las leyes civiles y penales para el depositario, debiendo, en su caso, disponer las medidas de depósito y traslado de los bienes secuestrados que resulten necesarias para asegurar una buena conservación, atendiendo a la naturaleza y característicasde los mismos."],"s":"En los supuestos en que se detecte la tenencia, el traslado o transporte de bienes, cosas, obras o mercancías sin cumplir con los recaudos previstos en los incisos c) y veinte por ciento (20%) dicho tope ante cada reiteración."},{"n":54,"t":"Multa, Clausura y Comiso – Acta","p":["Los hechos u omisiones que den lugar a la multa y clausura, y en su caso, a la suspensión de la matrícula, licencia o registro de habilitación, a que refieren los artículos precedentes, deberán ser objeto de un acta de comprobación en el cual los funcionarios fiscales dejarán constancia de todas las circunstancias relativas a las infracciones y a los hechos, de las que desee incorporar el interesado, a su prueba y a su encuadramiento legal, conteniendo, además, una citación para que el responsable, provisto de las pruebas de que intente valerse, comparezca a una audiencia para su defensa que se fijará para una fecha no anterior a los cinco (5) días ni superior a los quince (15) días. El acta deberá ser firmada porlos actuantes y notificada al responsable o representante legal del mismo. En caso de no hallarse presente este último en el acto del escrito, se notificará el acta labrada en el domiciliofiscal por los medios establecidos en el artículo 127. El Director General de Rentas, se pronunciará una vez terminada la audiencia o en un plazo no mayor a los dos (2) días."],"s":"Los hechos u omisiones que den lugar a la multa y clausura, y en su caso, a la suspensión de la matrícula, licencia o registro de habilitación, a que refieren los artículos precedentes, deberán ser objeto de un acta de…"},{"n":55,"t":"Comiso – Procedimiento","p":["A los fines de aplicar las medidas preventivas previstas, como asimismo, el comiso de las mercaderías, bienes o cosas, resultarán de aplicación las previsiones del artículo anterior, sin perjuicio de lo dispuesto en este artículo.","A tales efectos, cuando corresponda, se adjuntará al acta de comprobación un inventario de las mercaderías, cosas o bienes que detalle el estado en que se encuentran, el cual deberá confeccionarse juntamente con el personal de la fuerza de seguridad requerida y los dos (2) testigos hábiles que hayan sido convocados a ese efecto.","En el supuesto de verificarse razones de urgencia que así lo exijan la audiencia de descargo deberá fijarse dentro de las cuarenta y ocho (48) horas de efectivizada la medida preventiva.","El acta deberá ser firmada por los actuantes y notificada al responsable o representante legal del mismo y los testigos convocados en su caso. En oportunidad de resolver, el Director General de Rentas, podrá disponer el comiso de las mercaderías, cosas o bienes o revocar la medida de secuestro o interdicción. En el supuesto de que se levanten las medidas preventivas, se despachará en forma urgente una comunicación a la fuerza de seguridad respectiva a fin de que las mercaderías, cosas o bienes objeto del procedimiento sean devueltos o liberados en forma inmediata a favor de la persona desapoderada, de quien no podrá exigirse el pago de gasto alguno. Para el caso que se confirmen las medidas preventivasserán a cargo del imputado la totalidad de los gastos ocasionados por las mismas."],"s":"A los fines de aplicar las medidas preventivas previstas, como asimismo, el comiso de las mercaderías, bienes o cosas, resultarán de aplicación las previsiones del artículo anterior, sin perjuicio de lo dispuesto en este artículo."},{"n":56,"t":"Clausura - Cumplimiento de la Sanción","p":["La autoridad administrativa que hubiere dictado la providencia que ordene la clausura dispondrá los alcances y los días en que deba cumplirse.","La Dirección General de Rentas, por intermedio de sus funcionarios o agentes autorizados, procederá a hacerla efectiva, adoptando los recaudos y seguridades del caso.","Podrá realizar asimismo comprobaciones con el objeto de verificar el acatamiento de la medida y dejar constancia documentada de las violaciones que se observaren en la misma."],"s":"La autoridad administrativa que hubiere dictado la providencia que ordene la clausura dispondrá los alcances y los días en que deba cumplirse."},{"n":57,"t":"Clausura – Efectos","p":["Durante el período de clausura cesará totalmente la actividad en los establecimientos, salvo la que fuese habitual para la conservación o la custodia de las mercaderías, cosas o bienes o para la continuación de los procesos de producción que no pudieren interrumpirse por causas relativas a su naturaleza. No podrá suspenderse el pago desalarios y obligaciones de previsión social, sin perjuicio del derecho del principal a disponerde su personal en la forma que autoricen las normas aplicables a la relación de trabajo."],"s":"Durante el período de clausura cesará totalmente la actividad en los establecimientos, salvo la que fuese habitual para la conservación o la custodia de las mercaderías, cosas o bienes o para la continuación de los procesos de…"},{"n":58,"t":"Violación de Clausura","p":["Quien violare o incumpliere una clausura o destruyere o alterare los sellos, precintos o instrumentos que hubieran sido utilizados para hacerla efectiva, será sancionado con arresto de diez (10) a treinta (30) días y con una nueva clausura por el doble de tiempo de aquella. Son competentes para la aplicación de tales sanciones los jueces provinciales en lo correccional.","La Dirección General de Rentas, con conocimiento del juez que se hallare en turno, procederá a instruir el correspondiente sumario de prevención, el cual, una vez concluido, será elevado de inmediato a dicho juez.","La Dirección General de Rentas prestará a los magistrados judiciales la mayor colaboración durante la secuencia del juicio."],"s":"Quien violare o incumpliere una clausura o destruyere o alterare los sellos, precintos o instrumentos que hubieran sido utilizados para hacerla efectiva, será sancionado con arresto de diez (10) a treinta (30) días y con una…"},{"n":59,"t":"Comiso – Transporte","p":["Quienes transportaren comercialmente mercaderías, cosas o bienes en territorio provincial, aunque no sean de su propiedad, por sí o por terceros, desprovistos de la documentación de respaldo exigida por la Dirección General de Rentas, o bien cuando el documento no responda a la realidad comercial efectivamente realizada, serán pasibles de la sanción de comiso de las mercaderías, cosas o bienes que sean objetos de la infracción."],"s":"Quienes transportaren comercialmente mercaderías, cosas o bienes en territorio provincial, aunque no sean de su propiedad, por sí o por terceros, desprovistos de la documentación de respaldo exigida por la Dirección General de…"},{"n":60,"t":"Comiso - Medidas Preventivas","p":["Cuando los funcionarios o agentes constataren hechos u omisiones que determinen prima facie la configuración de la infracción prevista en el artículo anterior, procederán a instrumentar el procedimiento tendiente a la aplicación de las medidas preventivas de interdicción y secuestro. En caso de interdicción, se confiará al interesado como depositario de los bienes, con la específica indicación de las previsiones y obligacionesque imponen las leyes civiles y penales al depositario. Si hubiere dispuesto el secuestro, tomará todos los recaudos del caso para su buena conservación."],"s":"Cuando los funcionarios o agentes constataren hechos u omisiones que determinen prima facie la configuración de la infracción prevista en el artículo anterior, procederán a instrumentar el procedimiento tendiente a la…"},{"n":61,"t":"Medidas Preventivas – Acta","p":["Los funcionarios o agentes deberán dejar constancia en el Acta de Comprobación del secuestro o interdicción de las mercaderías, cosas o bienes que sepracticare como medida preventiva y del valor de la misma, con arreglo a las pautas de valuación previstas en la reglamentación a los efectos de la eventual aplicación de multa a opción del infractor. A efectos de establecer la valuación prevista, se deberá tomar en cuentael valor corriente en plaza, precio mayorista tipo comprador, en el ámbito de la provincia. Los valores allí establecidos no admitirán prueba en contrario.","Asimismo, emplazarán al interesado para que constituya, en ese acto, domicilio especial, a todos los efectos del procedimiento, en el radio urbano de la ciudad de Posadas. Si el interesado no constituyese en ese acto domicilio especial, se le hará saber que podrá hacerlohasta la fecha fijada para la audiencia de descargo, bajo apercibimiento de tener porconstituido domicilio en el de la sede de la Dirección General de Rentas y en el del JuzgadoCorreccional en turno, de acuerdo con la instancia procesal de que se trate, en donde quedaránnotificadas de pleno derecho todas las resoluciones o providencias que se dictaren."],"s":"Los funcionarios o agentes deberán dejar constancia en el Acta de Comprobación del secuestro o interdicción de las mercaderías, cosas o bienes que sepracticare como medida preventiva y del valor de la misma, con arreglo a las…"},{"n":62,"t":"Acta de Comprobación - Firma y Notificación","p":["El Acta de Comprobación deberá ser firmada por los funcionarios actuantes y notificada al interesado o persona encargada o responsable del transporte, presente al momento de su confección, a quien se le hará entrega de un ejemplar de la misma. En caso de que se negare a firmar o a recibir el ejemplar del Acta de Comprobación, los funcionarios actuantes dejarán constancia de tal circunstancia."],"s":"El Acta de Comprobación deberá ser firmada por los funcionarios actuantes y notificada al interesado o persona encargada o responsable del transporte, presente al momento de su confección, a quien se le hará entrega de un…"},{"n":63,"t":"Comiso – Procedimiento","p":["El Acta de Comprobación deberá ser elevada inmediatamente al Director General de Rentas, a los fines de la celebración de la audiencia de descargo, quien deberá dejar constancia en el sumario de la justificación de la valuación asignada a la mercadería, de acuerdo con las pautas contenidas en la reglamentación.","El imputado podrá presentar su defensa por escrito hasta la audiencia de descargo, debiendo acompañar toda la prueba de que intente valerse u ofrecer la que no se encuentre en su poder.","El Director General de Rentas emitirá resolución fundada en un plazo no superior a las setenta y dos (72) horas de la fecha fijada para la celebración de la audiencia o presentación del escrito de descargo."],"s":"El Acta de Comprobación deberá ser elevada inmediatamente al Director General de Rentas, a los fines de la celebración de la audiencia de descargo, quien deberá dejar constancia en el sumario de la justificación de la…"},{"n":64,"t":"Multa, Clausura y Comiso – Recursos","p":["La resolución de la Dirección General de Rentas será revisable por recurso de apelación, con efecto suspensivo ante el Juez Correccional en turno de la Primera Circunscripción Judicial de Misiones. El recurso deberá interponerse y fundarse en el mismoacto en sede de la Dirección General de Rentas, en el término de tres (3) días de su notificación personal o por cédula.","La Dirección General de Rentas deberá elevar el sumario administrativo al Juez Correccional que en turno corresponda, dentro de las cuarenta y ocho (48) horas de interpuesto el recurso de apelación. En caso de no interponerse el recurso de apelación quedará firme la sanción impuesta.","El Juez Correccional deberá emitir resolución en el plazo de cinco (5) días de recibido el sumario."],"s":"La resolución de la Dirección General de Rentas será revisable por recurso de apelación, con efecto suspensivo ante el Juez Correccional en turno de la Primera Circunscripción Judicial de Misiones"},{"n":65,"t":"Comiso - Sustitución por Multa","p":["La sanción de comiso podrá ser reemplazada por multa del cuarenta por ciento (40%) o sesenta por ciento (60%) del valor de las mercaderías, cosas o bienes objeto de la sanción.","El monto de la multa se calculará sólo sobre las mercaderías, cosas o bienes que careciesen de documentación de respaldo.","El beneficio no será acordado en caso de reincidencia."],"s":"La sanción de comiso podrá ser reemplazada por multa del cuarenta por ciento (40%) o sesenta por ciento (60%) del valor de las mercaderías, cosas o bienes objeto de la sanción."},{"n":66,"t":"Reconocimiento y Pago","p":["A los efectos de la opción prevista en el artículo anterior, el imputado podrá, previo reconocimiento de la materialidad de la infracción, y cumplimiento de lo exigido por la normativa vigente en lo que es materia de infracción:","a) abonar el monto equivalente al cuarenta por ciento (40%) del valor de las mercaderías, cosas o bienes, hasta la oportunidad fijada para la audiencia de descargo;","b) abonar el monto equivalente al sesenta por ciento (60%) del valor de las mercaderías, cosas o bienes, hasta el vencimiento del plazo para interponer el recurso de apelación."],"s":"A los efectos de la opción prevista en el artículo anterior, el imputado podrá, previo reconocimiento de la materialidad de la infracción, y cumplimiento de lo exigido por la normativa vigente en lo que es materia de infracción:"},{"n":67,"t":"Impedimento, recusación, excusación - Reemplazo - Normas Supletorias","p":["En caso de ausencia, impedimento, recusación o excusación del Director General de Rentas para intervenir, será reemplazado por un funcionario de la Dirección, conforme lo disponga la reglamentación.","Las disposiciones del Código Procesal Penal de la Provincia de Misiones serán de aplicación supletoria a los Capítulos de Clausura y Comiso en tanto no se opongan a sus previsiones."],"s":"En caso de ausencia, impedimento, recusación o excusación del Director General de Rentas para intervenir, será reemplazado por un funcionario de la Dirección, conforme lo disponga la reglamentación."},{"n":68,"t":"Bienes Comisados – Destino","p":["Consentida o ejecutada la sanción de comiso, las mercaderías, cosas o bienes que resultaran incautadas son remitidas, siempre y cuando no estén sometidas a destrucción o inutilización, al Ministerio de Desarrollo Social, la Mujer y la Juventud, con destino a personas indigentes, carecientes, entidades de bien público, comedorescomunitarios, escolares, hospitales públicos, asociaciones civiles de beneficencia. En casos debidamente justificados también pueden ser destinados a la Dirección de Defensa Civil, dependiente del Ministerio de Gobierno.","Se faculta a la Dirección General de Rentas a los efectos de establecer condiciones o dictar los actos reglamentarios necesarios a fin de proceder a la venta por subasta, donación o disposición del destino de los bienes, ante el comiso por resolución firme, que no son aptospara el destino señalado en el primer párrafo del presente artículo, y en el marco de las actuaciones administrativas que se llevan a cabo en cumplimiento de lo previsto por la presente ley y sus reglamentaciones."],"s":"Consentida o ejecutada la sanción de comiso, las mercaderías, cosas o bienes que resultaran incautadas son remitidas, siempre y cuando no estén sometidas a destrucción o inutilización, al Ministerio de Desarrollo Social, la…"},{"n":69,"t":"Omisión – Multas","p":["Constituirá omisión y será reprimida con multa graduable del veinte por ciento (20%) al doscientos por ciento (200%) del monto de la obligación fiscal omitida, el incumplimiento total o parcial de las obligaciones fiscales.","La misma sanción se aplicará a los agentes de retención o percepción que no actuaren como tales.","No corresponderá esta sanción cuando la infracción fuera considerada como defraudación, ni cuando fuera de aplicación un recargo especial establecido por este Código o por leyes tributarias para un tributo en particular."],"s":"Constituirá omisión y será reprimida con multa graduable del veinte por ciento (20%) al doscientos por ciento (200%) del monto de la obligación fiscal omitida, el incumplimiento total o parcial de las obligaciones fiscales."},{"n":70,"t":"Defraudación – Multas","p":["Incurrirán en defraudación fiscal y serán pasibles de multas graduables entre dos (2) y diez (10) veces el monto del gravamen que total o parcialmente se haya defraudado o intentado defraudar al fisco, sin perjuicio de la responsabilidad penal por delitos comunes:","a) los contribuyentes, responsables o terceros, que realicen cualquier hecho, omisión, aserción, simulación, ocultación o en general cualquier acto con el propósito de producir la evasión total o parcial de las obligaciones fiscales que les incumben a ellos o a otros sujetos;","b) los agentes de recaudación que mantengan en su poder impuestos retenidos después de General de Rentas para intervenir, será reemplazado por un funcionario de la Dirección, conforme lo disponga la reglamentación.","Las disposiciones del Código Procesal Penal de la Provincia de Misiones serán de aplicación supletoria a los Capítulos de Clausura y Comiso en tanto no se opongan a sus previsiones.","Bienes Comisados – Destino haber vencidos los plazos en que debieron hacerlos ingresar al fisco, salvo que prueben la imposibilidad de efectuarlos por fuerza mayor o disposición legal, judicial o administrativa.","La graduación de la multa se establecerá teniendo en consideración los montos del impuesto adeudado, antecedentes del contribuyente, la importancia de su actividad, su representatividad y otros valores que deberán merituarse en los fundamentos de la resoluciónque aplique la multa."],"s":"Incurrirán en defraudación fiscal y serán pasibles de multas graduables entre dos (2) y diez (10) veces el monto del gravamen que total o parcialmente se haya defraudado o intentado defraudar al fisco, sin perjuicio de la…"},{"n":71,"t":"Presunciones","p":["Se presume el propósito de procurar para sí, o para otro la evasión de las obligaciones fiscales salvo prueba en contrario, cuando se presente cualquiera de las siguientes circunstancias u otras análogas:","a) contradicción evidente entre los libros, documentos o demás antecedentes y los datos contenidos en las declaraciones juradas;","b) manifiesta disconformidad entre los preceptos legales y reglamentarios y la aplicación de que los mismos hagan los contribuyentes y responsables con respecto a sus obligaciones fiscales;","c) declaraciones juradas que contengan datos falsos;","d) omisión en las declaraciones juradas de bienes, actividades u operaciones que constituyan objetos o hechos imponibles;","e) producción de informes y comunicaciones falsas a la Dirección, con respecto a los hechos u operaciones que constituyan hechos imponibles;","f) no llevar o no exhibir libros, contabilidad y documentos de comprobación suficiente, ni los libros especiales que disponga la Dirección de conformidad con el artículo 30 de este Código, cuando la naturaleza o el volumen de las operaciones desarrolladas no justifiquen esa omisión;","g) no haberse inscripto a efectos del pago de los gravámenes cuando este hecho le fuese conocido por inspección o verificación efectuada por el fisco, después de transcurrido un (1) año del término que las normas legales imponen para la inscripción;","h) recurrir a formas jurídicas manifiestamente improcedentes adoptadas exclusivamente para evadir gravámenes."],"s":"Se presume el propósito de procurar para sí, o para otro la evasión de las obligaciones fiscales salvo prueba en contrario, cuando se presente cualquiera de las siguientes circunstancias u otras análogas:"},{"n":72,"t":"Presentación Espontánea","p":["Quedan exentos de multas aquellos contribuyentes y responsables del Impuesto Inmobiliario, que se presenten espontáneamente a regularizar su situación fiscal.","Reincidencia Las multas por omisión fiscal o infracción a los deberes formales, serán aplicadas de oficio por la autoridad de aplicación, sin necesidad de sumario y dictando al efecto una resolución comprendiendo las obligaciones fiscales principales y accesorias, salvo lo dispuesto en el último párrafo del artículo 74.","Las multas por infracciones a los deberes formales, por omisión o defraudación fiscal, serán aplicadas por el Director General de Rentas o los funcionarios en quienes éste haya delegado tal facultad, y deberán ser satisfechas dentro de los quince (15) días de notificada la resolución respectiva."],"s":"Quedan exentos de multas aquellos contribuyentes y responsables del Impuesto Inmobiliario, que se presenten espontáneamente a regularizar su situación fiscal."},{"n":73,"t":"Reincidencia","p":["Incurrirán en reincidencia y serán pasibles del máximo de la pena establecida en los artículos 69 y 70 quienes hayan sido sancionados mediante resolución firme y consentida por las infracciones aludidas en los citados artículos y siempre que no hayan transcurrido más de tres (3) años de la fecha de dicha resolución."],"s":"Incurrirán en reincidencia y serán pasibles del máximo de la pena establecida en los artículos 69 y 70 quienes hayan sido sancionados mediante resolución firme y consentida por las infracciones aludidas en los citados…"},{"n":74,"t":"Error Excusable de Hecho o de Derecho","p":["La Dirección podrá no aplicar las multas previstas en los artículos 51 y 69 cuando las infracciones impliquen error excusable de hecho o de derecho.","Multa – Remisión La Dirección podrá con carácter general y cuando medien circunstancias debidamente justificadas, remitir en todo o en parte las multas a que se refieren los artículos 51 y 69 del presente Código.","En los casos de infracciones a los deberes formales o de simple omisión, las multas podrán ser remitidas por la Dirección total o parcialmente, cuando las mismas impliquen culpas leves de los infractores."],"s":"La Dirección podrá no aplicar las multas previstas en los artículos 51 y 69 cuando las infracciones impliquen error excusable de hecho o de derecho."},{"n":75,"t":"Sumario Previo para Multas por Defraudación","p":["La autoridad de aplicación antes de aplicar las multas establecidas en el artículo 70 dispondrá la instrucción de un sumario notificándolo al presunto infractor, y emplazándolo para que en quince (15) días, presente su defensa, ofrezca y produzca las pruebas que hagan a su derecho.","Vencido este término la autoridad de aplicación podrá disponer que se practiquen otras medidas de prueba o cerrar el sumario y dictar resolución. Si el sumariado notificado en legal forma no compareciera en el término fijado en el párrafo anterior se procederá a seguir el sumario en rebeldía. Cuando existan actuaciones pendientes a la determinación de obligaciones fiscales y medien semiplena prueba o indicios vehementes de la existencia de defraudación, la autoridad de aplicación deberá disponer la instrucción del sumario antes dedictar la resolución que determine las obligaciones fiscales. En este caso la autoridad de aplicación, siempre que el contribuyente no hubiere hecho uso de la opción que prevé el apartado 1) de la segunda parte del artículo 46 de este Código, dictará una sola resolución con referencia a las obligaciones fiscales, accesorios o infracciones para lo cual acumulará los procesos, si hubieran sido separados.","h) recurrir a formas jurídicas manifiestamente improcedentes adoptadas exclusivamente para evadir gravámenes."],"s":"La autoridad de aplicación antes de aplicar las multas establecidas en el artículo 70 dispondrá la instrucción de un sumario notificándolo al presunto infractor, y emplazándolo para que en quince (15) días, presente su…"},{"n":76,"t":"Requisitos - Resoluciones - Multas","p":["Las resoluciones que apliquen multas o que declaren la inexistencia de las infracciones, deberán ser notificadas a los interesados, comunicándoseles al mismo tiempo íntegramente su fundamento.","Estas resoluciones deberán contener la indicación del lugar y fecha en que se practiquen, a nombre del interesado, circunstancias agravantes y atenuantes tenidas en cuenta para la graduación aplicada, examen de la prueba cuando se hubiera producido, normas fiscales, decisión concreta en el caso y firma del funcionario competente.","Las resoluciones podrán ser modificadas o revocadas por el funcionario que las hubiere dictado o por el superior jerárquico siempre que no estuvieren válidamente notificadas o porvía de recurso de reconsideración."],"s":"Las resoluciones que apliquen multas o que declaren la inexistencia de las infracciones, deberán ser notificadas a los interesados, comunicándoseles al mismo tiempo íntegramente su fundamento."},{"n":77,"t":"Muerte del Infractor - Responsables de las Sanciones","p":["Las sanciones previstas no serán de aplicación en los casos en que ocurra el fallecimiento del infractor aún cuando la resolución respectiva haya quedado firme y pasada en autoridad de cosa juzgada. No estarán sujetos a las sanciones previstas en los artículos 69 y 70 los incapaces, los penados, a que se refiere el artículo 12 del Código Penal,los concursados y quebrados, las sociedades en liquidación, a menos que sean contribuyentespor actividades cuyas gestión o administración escape al contralor de sus representantes, liquidadores de sus bienes, administradores o mandatarios.","Todos los demás contribuyentes enumerados en este Código sean o no personas de existencia visible, estarán sujetos a las multas previstas en este Código y por las infracciones que ellos mismos cometan o que, en su caso, les sean imputadas por el hecho u omisión en que incurran sus representantes, directores, gerentes, administradores o mandatarios, o con relación a unos y otros, por el hecho u omisión de quienes les estén subordinados, como sus agentes, factores o dependientes, todo sin perjuicio de la acción personal que tenga contra los mismos."],"s":"Las sanciones previstas no serán de aplicación en los casos en que ocurra el fallecimiento del infractor aún cuando la resolución respectiva haya quedado firme y pasada en autoridad de cosa juzgada"},{"n":78,"t":"Aplicación Ley más Benigna","p":["Las normas tributarias punitivas sólo regirán para el futuro.","No obstante, tendrán efecto retroactivo las que supriman infracciones, establezcan sanciones más benignas o términos de prescripción más breves.","El pago de las sanciones impuestas por infracciones tributarias es independiente del pago de las demás obligaciones tributarias."],"s":"Las normas tributarias punitivas sólo regirán para el futuro."},{"n":79,"t":"Plazo","p":["Salvo disposición expresa en contrario de este Código, de leyes fiscales especiales, el pago de los impuestos, tasas y contribuciones que resulten de declaraciones juradas, deberá ser efectuado por los contribuyentes o responsables dentro de los plazos generales que la Dirección establezca para la presentación de aquellas.","El pago de los impuestos, tasas y contribuciones determinadas por la Dirección o por decisión superior, deberá efectuarse dentro de los quince (15) días de la notificación.","El pago de las obligaciones fiscales que en virtud de este Código o leyes fiscales especiales no exijan declaraciones juradas de los contribuyentes o responsables, deberá efectuarse dentro de los quince (15) días de realizado el hecho imponible, salvo disposición diferente de este Código, leyes especiales o de la Dirección.","La Dirección podrá establecer sistemas generales de retenciones en la fuente sobre gravámenes o hechos imponibles establecidos en este Código y leyes tributarias especiales debiendo actuar como agentes de retención los responsables que ella designe.","La Dirección estará facultada para emitir normas generales sobre redondeos de importes destinados al pago de obligaciones fiscales, por la que se contempla la eliminación de centavos, con o sin ajuste de la unidad superior, según los casos."],"s":"Salvo disposición expresa en contrario de este Código, de leyes fiscales especiales, el pago de los impuestos, tasas y contribuciones que resulten de declaraciones juradas, deberá ser efectuado por los contribuyentes o…"},{"n":80,"t":"Formas","p":["Los pagos e impuestos, tasas y contribuciones, deben efectuarse depositando la suma correspondiente en las cuentas especiales de la Dirección, en el banco que actúe como agente financiero de la provincia de Misiones u otros bancos autorizados o en las oficinas que la Dirección habilite al efecto.","También pueden efectuarse mediante el envío de cheques o giros a la orden de la Dirección, o a través de medios electrónicos o cualquier otro medio de pago habilitado al efecto.","En el caso de pagos realizados a través de las modalidades previstas en el párrafo anterior solo tienen efecto cancelatorio cuando se constate que el importe ingresó de forma efectiva en la Dirección.","El pago total o parcial del impuesto aun cuando fuera recibido sin reserva alguna no constituye presunción de pago de:","1) las presentaciones anteriores del mismo impuesto relativas al mismo año fiscal ni a períodos fiscales anteriores;","2) de los adicionales;","3) de los intereses y multas.","El Poder Ejecutivo puede aceptar como forma de pago total o parcial de deudas fiscales vencidas, líquidas y exigibles, incluidas las sometidas a juicio de ejecución fiscal, la dación en pago, consistente en la entrega de bienes inmuebles que propongan contribuyentes o responsables, sean personas humanas o jurídicas deudoras del fisco en concepto de impuesto,intereses, recargos y sanciones de los gravámenes legislados en el Código Fiscal, siempre que se encuentren en situación económica o financiera deficiente y que razones de oportunidad y conveniencia para los intereses provinciales lo justifiquen a criterio de la máxima autoridad de la Dirección General de Rentas.","El Poder Ejecutivo, a través del órgano de aplicación de los tributos provinciales, debe establecer la reglamentación pertinente a los fines de implementar la facultad prevista en esteartículo."],"s":"Los pagos e impuestos, tasas y contribuciones, deben efectuarse depositando la suma correspondiente en las cuentas especiales de la Dirección, en el banco que actúe como agente financiero de la provincia de Misiones u otros…"},{"n":81,"t":"Imputación","p":["Cuando el contribuyente fuera deudor de gravámenes y accesorios por diferentes períodos fiscales y efectuara el pago, el mismo se imputará primeramente a recargos, intereses y multas, y el remanente, si hubiera, al principal, comenzando por el período más remoto.","Cuando se opusiera expresamente excepción de prescripción y la misma fuera procedente, la imputación se hará a la deuda fiscal del período más remoto aún no prescripto.","Compensación saldos acreedores La Dirección podrá compensar de oficio los saldos acreedores del contribuyente, cualquiera sea la forma o el procedimiento que se establezca, con las deudas o saldos deudores de impuestos declarados por aquellos o determinados por la Dirección comenzando por los más remotos, salvo excepción de prescripción y aunque se refieran a distintas obligaciones fiscales.","La Dirección podrá compensar en primer término los saldos acreedores con recargos,intereses y multas aplicados por resolución firme."],"s":"Cuando el contribuyente fuera deudor de gravámenes y accesorios por diferentes períodos fiscales y efectuara el pago, el mismo se imputará primeramente a recargos, intereses y multas, y el remanente, si hubiera, al principal,…"},{"n":82,"t":"Cobro por Vía de Ejecución Fiscal","p":["La resolución definitiva de la Dirección, o la decisión de la Cámara Fiscal que determine obligaciones impositivas debidamente notificadas, o la deuda resultante de declaraciones juradas, montos mínimos que fije la Ley XXII – N.° 25, Ley de Alícuotas o de los padrones de los contribuyentes del Impuesto Inmobiliario, que no sea seguida del pago en los términos establecidos en el artículo 79, podrá ser ejecutada por vía de ejecución fiscal, sin ulterior intimación de pago."],"s":"La resolución definitiva de la Dirección, o la decisión de la Cámara Fiscal que determine obligaciones impositivas debidamente notificadas, o la deuda resultante de declaraciones juradas, montos mínimos que fije la Ley XXII –…"},{"n":83,"t":"Acreditación y Devolución","p":["La Dirección deberá, de oficio o a demanda de repetición del interesado, acreditarle las sumas que resultaren a beneficio del contribuyente o responsable por pagos no debidos o excesivos, como también disponer la devolución de lo pagado de más a solicitud del interesado, en forma simple y rápida según el procedimiento que aquella establezca.","Rectificación de Declaraciones Juradas e Impugnaciones Los contribuyentes que rectifiquen declaraciones juradas anteriores, podrán compensar el saldo acreedor resultante de dicha rectificación, con la deuda emergente de nuevas declaraciones juradas del mismo gravamen, sin perjuicio de la facultad de la Dirección, de impugnar dicha compensación si la rectificación no fuere fundada y reclamar el pago de los importes indebidamente compensados, con más los recargos e intereses que pudieran corresponder.","Intereses Resarcitorios La falta total o parcial de pago de los gravámenes, retenciones, percepciones, anticipos y demás pagos a cuenta, devengará desde sus respectivos vencimientos, sin necesidad de interpelación alguna y hasta el día del pago, de pedido de prórroga, de interposición de la demanda de ejecución fiscal, o de apertura de concurso, un tipo de interés cuya tasa no podrá exceder, en el momento de su fijación, al doble de la tasa nominal anual de descubiertos en cuenta corriente acordado previamente aplicada por el Banco que actúe como Agente Financiero de la provincia de Misiones, que fijará con carácter general la Dirección, teniendo en cuenta en su caso, si se tratara de montos actualizados o no. La obligación de abonar estos intereses subsiste no obstante la falta de reserva por parte de la Dirección al recibir el pago de la deuda principal.","Intereses Punitorios Cuando sea necesario recurrir a la vía judicial para hacer efectivos los pagos de las deudas por impuestos, tasas, contribuciones u otras obligaciones fiscales, sus anticipos, pagos a cuenta, retenciones, percepciones y multas, los importes correspondientes devengarán un interés punitorio computable desde la interposición de la demanda. Dicho interés será fijado por la Dirección, no pudiendo exceder al momento de su fijación en más de la mitad de la tasa de interés que deba aplicarse conforme a las previsiones del tercer párrafo del presente artículo."],"s":"La Dirección deberá, de oficio o a demanda de repetición del interesado, acreditarle las sumas que resultaren a beneficio del contribuyente o responsable por pagos no debidos o excesivos, como también disponer la devolución de…"},{"n":84,"t":"Devoluciones, acreditaciones y compensaciones – Intereses","p":["El importe de las devoluciones, acreditaciones o compensaciones devengará el interés resarcitorio vigente desde la fecha de interposición del pedido de devolución, del reclamo administrativo, de la demanda judicial o del pedido de compensación, según corresponda.","Cuando el pago indebido o en exceso fuere originado en determinaciones fehacientemente probadas o informaciones erróneas efectuadas por la Dirección General de Rentas, el interés establecido en el párrafo anterior, se devengará a partir de la fecha de dicho pago."],"s":"El importe de las devoluciones, acreditaciones o compensaciones devengará el interés resarcitorio vigente desde la fecha de interposición del pedido de devolución, del reclamo administrativo, de la demanda judicial o del…"},{"n":85,"t":"Cámara Fiscal","p":["Créase la Cámara Fiscal de Apelaciones. La ley orgánica a dictarse precisará su integración y normas de funcionamiento.","Hasta tanto se ponga en funcionamiento la Cámara Fiscal entenderá en los recursos de su competencia el Ministerio de Hacienda, Finanzas, Obras y Servicios Públicos de la Provincia, ajustándose a las normas vigentes en este Código y su reglamentación."],"s":"Créase la Cámara Fiscal de Apelaciones"},{"n":86,"t":"Recurso de Reconsideración","p":["Contra las resoluciones de la Dirección que determinen gravamen, multas, liquiden intereses, calculen actualizaciones de deudas o denieguen exenciones, ya sea que hayan sido dictadas en forma conjunta o separada, el contribuyente o los responsables podrán interponer recursos de reconsideración respecto de cada resolución dentro de los quince (15) días de su notificación."],"s":"Contra las resoluciones de la Dirección que determinen gravamen, multas, liquiden intereses, calculen actualizaciones de deudas o denieguen exenciones, ya sea que hayan sido dictadas en forma conjunta o separada, el…"},{"n":87,"t":"Prueba - Ofrecimiento - Medios de Prueba","p":["El recurso de reconsideración se presentará ante la dependencia que haya dictado la resolución impugnada.","Con el recurso deberá acompañarse la prueba documental y ofrecerse todas las demás de que el recurrente intentare valerse. Si no tuviere la prueba documental a su disposición, el recurrente la individualizará, indicando su contenido, el lugar del archivo, oficina pública y persona en cuyo poder se encuentre. Luego de la interposición del recurso no podrán ofrecerse otras pruebas, excepto por nuevos hechos acaecidos posteriormente. Serán admisibles todos los medios de pruebas, pudiéndose agregar informes, certificaciones y pericias producidas por profesionales con título habilitante."],"s":"El recurso de reconsideración se presentará ante la dependencia que haya dictado la resolución impugnada."},{"n":88,"t":"Plazo de Prueba","p":["El plazo para la producción de la prueba ofrecida, será de diez (10) días a contar desde la fecha de la interposición del recurso. Se podrá fijar un plazo mayor que no podrá exceder de treinta (30) días cuando la naturaleza de las pruebas ofrecidas así lo justifique. del reclamo administrativo, de la demanda judicial o del pedido de compensación, según corresponda.","Cuando el pago indebido o en exceso fuere originado en determinaciones fehacientemente probadas o informaciones erróneas efectuadas por la Dirección General de Rentas, el interés establecido en el párrafo anterior, se devengará a partir de la fecha de dicho pago.","Durante el transcurso del término de producción de prueba y hasta el momento de dictar resolución, la Dirección podrá realizar todas las verificaciones, inspecciones y demás diligencias que se estimen convenientes para el esclarecimiento de los hechos objeto del recurso."],"s":"El plazo para la producción de la prueba ofrecida, será de diez (10) días a contar desde la fecha de la interposición del recurso"},{"n":89,"t":"Resolución","p":["Vencido el período de prueba fijado en el artículo 88 o desde la interposición del recurso en el supuesto de no producirse prueba se dictará resolución fundadadentro de los sesenta (60) días, pudiendo el Tribunal requerir medidas para mejor proveer lasque serán evacuadas dentro de los quince (15) días."],"s":"Vencido el período de prueba fijado en el artículo 88 o desde la interposición del recurso en el supuesto de no producirse prueba se dictará resolución fundadadentro de los sesenta (60) días, pudiendo el Tribunal requerir…"},{"n":90,"t":"Efectos - Interposición - Reconsideración","p":["La interposición del recurso de reconsideración suspende la obligación de pago y la ejecución fiscal de los importes no aceptados: pero no interrumpe la aplicación de la actualización e intereses, en cuanto confirmada total o parcialmente la obligación fiscal recurrida.","A tal efecto será requisito para interponer recurso de reconsideración, que el contribuyente o responsable regularice su situación fiscal en cuanto a los importes que se le reclaman y respecto de los cuales preste conformidad. Este requisito no será exigible cuando en el recurso se discuta la calidad de contribuyente o responsable.","Término para apelar La resolución recaída en el recurso de reconsideración quedará firme a los quince (15) días de notificada, salvo que dentro de este plazo el recurrente interponga recurso de apelación ante la Cámara Fiscal."],"s":"La interposición del recurso de reconsideración suspende la obligación de pago y la ejecución fiscal de los importes no aceptados: pero no interrumpe la aplicación de la actualización e intereses, en cuanto confirmada total o…"},{"n":91,"t":"Recurso de Apelación","p":["El recurso de apelación deberá interponerse por escrito expresando punto por punto los agravios que cause al apelante la resolución recurrida.","El recurrente deberá constituir domicilio en la ciudad capital y ser representado o patrocinado por abogado o contador público matriculado en la Provincia.","Admisibilidad Presentado el recurso de apelación, la Dirección sin más trámite ni sustanciación, examinará si el mismo es admisible y dictará resolución dentro de los cinco (5) días de presentado."],"s":"El recurso de apelación deberá interponerse por escrito expresando punto por punto los agravios que cause al apelante la resolución recurrida."},{"n":92,"t":"Elevación a la Cámara Fiscal","p":["Declarado admisible el recurso se elevarán las actuaciones a la Cámara Fiscal para su conocimiento y decisión, dentro de los quince (15) días juntamente con un escrito de contestación a los fundamentos del apelante y ofrecimiento de la prueba a producir."],"s":"Declarado admisible el recurso se elevarán las actuaciones a la Cámara Fiscal para su conocimiento y decisión, dentro de los quince (15) días juntamente con un escrito de contestación a los fundamentos del apelante y…"},{"n":93,"t":"Autos para resolver","p":["Cumplidos los trámites previstos en los artículos anteriores, la causa quedará en condiciones de ser fallada definitivamente, salvo lo dispuesto en el artículo 95, debiendo dictarse la correspondiente providencia de autos, la que será notificada a las partes."],"s":"Cumplidos los trámites previstos en los artículos anteriores, la causa quedará en condiciones de ser fallada definitivamente, salvo lo dispuesto en el artículo 95, debiendo dictarse la correspondiente providencia de autos, la…"},{"n":94,"t":"Nuevas pruebas","p":["En el recurso de apelación ante la Cámara Fiscal los recurrentes no podrán presentar nuevas pruebas salvo aquellas que se refieran a hechos posteriores o documentos que no pudieron presentarse ante la Dirección. Asimismo, podrán reiterar las pruebas no admitidas por la Dirección o aquellas que debiendo ser sustanciadas por ésta, no se hubieren cumplido debidamente."],"s":"En el recurso de apelación ante la Cámara Fiscal los recurrentes no podrán presentar nuevas pruebas salvo aquellas que se refieran a hechos posteriores o documentos que no pudieron presentarse ante la Dirección"},{"n":95,"t":"Medidas para Mejor Proveer","p":["La Cámara Fiscal tendrá facultades para disponer medidas para mejor proveer.","En especial podrá convocar a las partes, a los peritos y a cualquier funcionario fiscal para procurar aclaraciones sobre puntos controvertidos. En este supuesto las partes podrán intervenir activamente e interrogar a los demás intervinientes. Las pruebas deben cumplimentarse con intervención de la Dirección, como órdenes, emplazamientos o diligencias y estarán a cargo del representante o apoderado de la Dirección interviniente en la causa, quien podrá dirigirse directamente a cualquier dependencia para recabar datos, elementos, antecedentes o todo tipo de información necesaria para tal fin. Las dependenciasdeberán proporcionarle toda documentación que requiera dentro de los plazos que se fijen alefecto."],"s":"La Cámara Fiscal tendrá facultades para disponer medidas para mejor proveer."},{"n":96,"t":"Resolución Cámara Fiscal","p":["La Cámara Fiscal dictará su decisión dentro de los sesenta (60) días de recibido el expediente. En dicho plazo no se computarán los días que requieren las medidas para mejor proveer dispuesta de conformidad con el artículo anterior.","La decisión definitiva de la Cámara Fiscal se notificará dentro de los cinco (5) días de dictada.","La notificación se realizará por cédula en la cual se transcribirán los fundamentos."],"s":"La Cámara Fiscal dictará su decisión dentro de los sesenta (60) días de recibido el expediente"},{"n":97,"t":"Recurso de Nulidad","p":["El recurso de apelación comprende el de nulidad. La nulidad procede por omisión de alguno de los requisitos establecidos en el artículo 44 de este Código, defectos de forma en la resolución denegatoria del recurso de reconsideración, incompetencia del funcionario que la hubiere dictado, falta de admisión de la prueba ofrecida conducente a la solución de la causa o que admitida no fuere producida cuando su diligenciamiento estuvierea cargo del Fisco.","Admitida la nulidad, el expediente se remitirá a la Dirección, quien deberá dictar resolución dentro de los treinta (30) días contados a partir de la fecha de recibidos los autos."],"s":"El recurso de apelación comprende el de nulidad"},{"n":98,"t":"Recurso de Queja","p":["Si la Dirección denegare la apelación, la resolución respectiva deberá ser fundada y especificar las circunstancias que la motivan, debiendo notificarse al apelante, el que podrá ocurrir en queja ante la Cámara Fiscal dentro de los cinco (5) días de haber sido notificado.","Se entenderá que existe denegatoria tácita del recurso de apelación cuando no se resolviera sobre su admisibilidad dentro del plazo establecido en el artículo 91 de este Código.","Cuando concedido el recurso no se elevará el expediente a la Cámara Fiscal dentro del plazo respectivo, el apelante podrá dirigirse directamente a la Cámara, quien dispondrá la remisión de las actuaciones dentro del tercer día."],"s":"Si la Dirección denegare la apelación, la resolución respectiva deberá ser fundada y especificar las circunstancias que la motivan, debiendo notificarse al apelante, el que podrá ocurrir en queja ante la Cámara Fiscal dentro…"},{"n":99,"t":"Recurso de Queja – Trámite","p":["Interpuesta la queja, la Cámara Fiscal librará oficio a la Dirección solicitando la remisión de las actuaciones, las que se elevarán dentro del tercer día.","La resolución sobre la admisibilidad del recurso deberá dictarse dentro de los treinta (30) días de recibidas las actuaciones notificándola al recurrente.","Si la Cámara declarara bien denegado el recurso, quedará abierta la vía contencioso administrativa en la forma prescripta por el artículo 100 de este Código.","Si la Cámara declarara mal denegado el recurso acordando la apelación interpuesta, conferirá traslado de las actuaciones a los efectos de la contestación que prevé el artículo 92, debiendo contarse el término correspondiente desde la recepción de los mismos."],"s":"Interpuesta la queja, la Cámara Fiscal librará oficio a la Dirección solicitando la remisión de las actuaciones, las que se elevarán dentro del tercer día."},{"n":100,"t":"Demanda Contencioso – Administrativa","p":["Contra las decisiones definitivas de la Cámara Fiscal dictadas en materia de su competencia o cuando la Cámara no las hubiera dictado en el plazo establecido en el artículo 96 de este Código, se podrá interponer demanda contenciosa administrativa ante el Superior Tribunal de Justicia previo pago de la suma adeudada a la Dirección en concepto de impuestos, actualizaciones e intereses en su caso, sin perjuicio del derecho de la Dirección de iniciar la correspondiente ejecución fiscal.","La demanda deberá ser interpuesta dentro de los treinta (30) días hábiles, de notificada la resolución de la Cámara Fiscal.","No serán aplicables las disposiciones de los artículos: 15, 24, 25, 27 al 33 y concordantes de la Ley I – N.° 95, Código de Procedimiento Contencioso Administrativo.","Intervención de la Fiscalía de Estado En todas las acciones contenciosas administrativas iniciadas contra la Dirección General de Rentas se deberá dar participación como parte al Fiscal de Estado en los términos del artículo 128 de la Constitución Provincial.","En aquellos procesos en trámite, en los que no se hubiere clausurado el período probatorio, se suspenderá el proceso y se dará debida participación al Fiscal de Estado.","El incumplimiento de esta disposición determinará la nulidad del proceso."],"s":"Contra las decisiones definitivas de la Cámara Fiscal dictadas en materia de su competencia o cuando la Cámara no las hubiera dictado en el plazo establecido en el artículo 96 de este Código, se podrá interponer demanda…"},{"n":101,"t":"Demandas de Repetición. Trámite","p":["Los contribuyentes o responsables podrán interponer ante la Dirección reclamos de repetición de los gravámenes y sus accesorios cuando consideren que el pago hubiere sido indebido o sin causa.","En caso de que el reclamo fuera promovido por agentes de recaudación, éstos deberán presentar nómina de los contribuyentes a quienes la Dirección efectuará la devolución de los importes cuestionados, salvo que acrediten la debida autorización en dicho acto pero que hubieran sido debidamente individualizados.","La Dirección, previa sustanciación de las pruebas ofrecidas o de las otras medidas que considere oportuno disponer, deberá dictar resolución dentro de los ciento ochenta (180) díasde la fecha de interposición, con todos los recaudos formales que se establecen en este Código.","Si la parte interesada para la producción de la prueba a su cargo y fundada en la naturaleza de la misma hubiere solicitado un plazo de más de treinta (30) días, el término para dictar resolución se considerará prorrogado en lo que excediere de dicho plazo.","En los casos en que la prueba resulte necesariamente de verificaciones, pericias o constatación de los pagos cuando hayan sido efectuados por agentes de recaudación o que elinteresado se encontrare en condiciones de ofrecer prueba diferida, el plazo para dictar la resolución del reclamo de repetición se computará a partir de la fecha en que se queden cumplidos todos los recaudos necesarios y efectuada la verificación, pericia, o constatación de pagos.","El cumplimiento de estas diligencias previas a la resolución en ningún caso podrá exceder de ciento ochenta (180) días.","Antes de dictar resolución la Dirección podrá requerir asesoramiento de los organismos oficiales competentes."],"s":"Los contribuyentes o responsables podrán interponer ante la Dirección reclamos de repetición de los gravámenes y sus accesorios cuando consideren que el pago hubiere sido indebido o sin causa."},{"n":102,"t":"Recursos - Denegación Tácita","p":["La resolución recaída sobre la demanda de repetición tendrá todos los efectos de la resolución del recurso de reconsideración y podrá ser objeto del recurso de apelación en los mismos casos y términos que los previstos en los artículos 90 y 91 de este Código.","Si la Dirección, en los recursos de reconsideración y en los reclamos de repetición, no dictara su resolución dentro de los plazos establecidos en los artículos pertinentes, el recurrente podrá considerarlos como resuelto negativamente y presentar recurso de apelación ante la Dirección, que elevara las actuaciones a conocimiento y decisión de la Cámara Fiscal."],"s":"La resolución recaída sobre la demanda de repetición tendrá todos los efectos de la resolución del recurso de reconsideración y podrá ser objeto del recurso de apelación en los mismos casos y términos que los previstos en los…"},{"n":103,"t":"","p":["La Dirección otorgará poder general para juicios, a favor del Apoderado General de la Dirección a los efectos de los juicios de ejecución fiscal y contencioso administrativo en los cuales sea parte el organismo. Este poder podrá ser sustituido únicamente a favor de los apoderados de la Dirección."],"s":"La Dirección otorgará poder general para juicios, a favor del Apoderado General de la Dirección a los efectos de los juicios de ejecución fiscal y contencioso administrativo en los cuales sea parte el organismo"},{"n":104,"t":"Apoderados de la Dirección","p":["En los juicios por cobro de impuestos, tasas, multas, intereses, actualizaciones u otras cargas, cuya aplicación, fiscalización o percepción esté a cargo de laDirección General de Rentas, la representación del Fisco ante todas las jurisdicciones e instancias será ejercida por los funcionarios apoderados de la Dirección o los abogados de lamatrícula que la misma designe, de acuerdo a las normas y procedimiento que ella fije.","El Poder Ejecutivo reglamentará el sistema de sorteo o licitación."],"s":"En los juicios por cobro de impuestos, tasas, multas, intereses, actualizaciones u otras cargas, cuya aplicación, fiscalización o percepción esté a cargo de laDirección General de Rentas, la representación del Fisco ante todas…"},{"n":105,"t":"Honorarios","p":["Los honorarios de los apoderados, funcionarios o abogados de la matrícula de la Dirección, por la gestión de cobro del crédito fiscal serán cobrados exclusivamente al deudor o sus sucesores. Las sumas que se perciban a cuenta o en pago total, de créditos en ejecución judicial, se imputarán primero a la cancelación de los gastos causídicos erogados por los letrados y luego los que la Dirección pudiera haber desembolsado; el saldo, si existiere, se prorrateará en directa proporción al crédito por capital y honorarios regulados oconvenidos, que devengarán el mismo interés y actualización que el interés y actualización que el capital. Los gastos que demande el proceso judicial estarán a cargo de los apoderadosfuncionarios o abogados de la matrícula de la Dirección, a excepción de la publicación de edictos y aquellos que expresamente autorice la Dirección."],"s":"Los honorarios de los apoderados, funcionarios o abogados de la matrícula de la Dirección, por la gestión de cobro del crédito fiscal serán cobrados exclusivamente al deudor o sus sucesores"},{"n":106,"t":"Expedición de Boleta de Deuda","p":["La Dirección expedirá boleta de deuda por las obligaciones fiscales y sus accesorios y por las multas impuestas por resolución firme o por sentencia firme y consentida de la Cámara Fiscal, por las sumas emergentes de las propias declaraciones juradas de los contribuyentes que no hubieren sido pagadas en los términos legales, así como los impuestos inmobiliarios resultantes de los registros y padrones respectivos, siempre que las valuaciones fiscales correspondientes no hubieran sido impugnadas."],"s":"La Dirección expedirá boleta de deuda por las obligaciones fiscales y sus accesorios y por las multas impuestas por resolución firme o por sentencia firme y consentida de la Cámara Fiscal, por las sumas emergentes de las…"},{"n":107,"t":"Requisitos de la boleta de deuda","p":["La boleta de deuda deberá ser firmada por funcionario autorizado y contendrá, so pena de nulidad:","a) serie y número;","b) nombre del deudor o deudores y domicilio respectivo conocido;","c) naturaleza de la deuda;","d) su importe, discriminado por concepto;","e) lugar y fecha."],"s":"La boleta de deuda deberá ser firmada por funcionario autorizado y contendrá, so pena de nulidad:"},{"n":108,"t":"Mandamiento de Intimación de Pago - Medidas Cautelares","p":["Si el juez encontrara en forma el documento de ejecución, ordenará de inmediato el libramiento del mandamiento de intimación de pago y embargo y facultará al oficial de justicia y a los oficiales de justicia ad hoc de la Dirección General de Rentas, para que hagan uso de la fuerza pública y allanen domicilio en caso de ser necesario, habilitándose a tal fin: día, hora y lugar. El apoderado de la Dirección librará bajo su firma mandamiento de intimación de pago y embargo, por las sumas ordenadas, sin necesidad de confronte judicial.","El mandamiento deberá contener como mínimo: el juzgado y secretaría interviniente, la sede del juzgado, la intimación de pago por las sumas indicadas en el párrafo anterior, la citación para oponer las excepciones en el término de cinco días, copia de la boleta de deuda en ejecución y de la demanda.","Los oficiales de justicia y los oficiales ad hoc de la Dirección, estarán facultados a requerir el auxilio de la fuerza pública, denunciar bienes a embargo, nuevos domicilios y proponer depositario judicial; debiendo proceder de conformidad con lo previsto en el artículo 500 y siguientes de la Ley XII – N.° 27, Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones.","El mandamiento y la demanda se diligenciarán y notificarán en el domicilio fiscal, quedando autorizados los oficiales intervinientes a proceder de conformidad con lo previsto en el artículo 143 de la Ley XII – N.° 27, Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones.","El auto que ordena el traslado de las excepciones deberá notificarse personalmente o por cédula al apoderado interviniente en el domicilio legal constituido. Al contestar el traslado el actor podrá ofrecer la prueba que haga a su derecho.","Todas las notificaciones y comunicaciones se librarán bajo firma y responsabilidad de los letrados de las partes, sin necesidad de confronte judicial. A opción de los letrados se podrán cursar las notificaciones por telegramas colacionados o cartas documentos y en ese caso servirá como suficiente prueba de la notificación al ejecutado el recibo especial que expida el prestador postal, contándose los términos a partir de la fecha consignada en el mismo.","En cualquier estado del juicio, incluso con anterioridad al traslado de la demanda, el actor podrá solicitar embargos, designación de interventor recaudador y otras medidas cautelares.","En todos los casos se designará interventor recaudador al propuesto por la parte ejecutante.","En los casos en que se concedan medidas cautelares el actor estará exento de otorgar fianza o caución. Se podrá solicitar el embargo de saldos en cuentas corrientes bancarias, cajas de ahorro, certificados de plazo fijo, depósitos en moneda extranjera, u otros bienes depositados en entidades financieras reguladas por la Ley de Entidades Financieras (Ley Nacional N.º 21526) y allanamiento de cajas de seguridad.","Iniciada la demanda se devengarán los intereses previstos en el artículo 83 del Código Fiscal."],"s":"Si el juez encontrara en forma el documento de ejecución, ordenará de inmediato el libramiento del mandamiento de intimación de pago y embargo y facultará al oficial de justicia y a los oficiales de justicia ad hoc de la…"},{"n":109,"t":"Medidas cautelares","p":["En cualquier momento y aún antes de iniciarse la ejecución fiscal, puede la Dirección General de Rentas solicitar, para asegurar el crédito fiscal que adeudan los contribuyentes o responsables, y el juez deberá disponerla en el término de veinticuatro (24)horas sin más recaudo ni necesidad de acreditación de peligro en la demora, cualquiera de las medidas cautelares establecidas en el Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones o las que a continuación se prevén:","a) traba de embargos sobre:","1) cuentas o activos bancarios y financieros, a diligenciar directamente ante las entidades correspondientes para el supuesto de encontrarse determinadas, o ante el Banco Central de la República Argentina para que proceda a efectuar las comunicaciones pertinentes a las instituciones donde puedan existir, instruyendo la transferencia dentro del término de cuarenta y ocho (48) horas a la cuenta de autos exclusivamente del monto reclamado con másintereses y costas. Para el caso de resultar insuficientes, las cuentas permanecerán embargadas hasta que se acredite y transfiera el monto total por el cual procedió la medida asegurativa. En todos los casos las entidades deberán informar los movimientos producidos en los cinco (5) días hábiles previos a la toma de razón;","2) bienes inmuebles y muebles sean o no registrables;","3) sueldos u otras remuneraciones en las proporciones que prevé la ley;","b) allanamiento y embargo sobre bienes contenidos en cajas de seguridad;","c) inhibición general de bienes e incluso su extensión a los activos bancarios y financieros, sin más requisitos para otorgar la medida de que no obren bienes en los registros de la Dirección, pudiendo oficiarse a las entidades bancarias correspondientes o al Banco Centralde la República Argentina. No resultará de aplicación el artículo 231 de la Ley XII – N.° 27, Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones;","d) intervención de caja y embargo de las entradas brutas equivalentes al veinte por ciento (20%) y hasta el cuarenta por ciento (40%) de las mismas. Debiendo designarse interventor recaudador al propuesto por la Dirección General de Rentas.","La anotación y levantamiento de las medidas cautelares y la orden de transferencia de fondos se practicará por oficio expedido por el apoderado de la Dirección, el cual tendrá el mismo valor que una requisitoria y orden judicial, con transcripción de la parte pertinente del auto que lo ordena.","Establécese que todos los organismos, reparticiones, entes e instituciones, estatales o privados, incluidos los bancos oficiales y particulares, bolsas, agentes y mercados, tienen la obligación de suministrar a la Dirección todas las informaciones que se les soliciten para facilitar la determinación o percepción de los tributos establecidos en el presente Código.","Las solicitudes de informes sobre personas humanas o jurídicas y sobre documentos, actos, bienes o derechos registrados, la anotación y levantamiento de medidas cautelares y las órdenes de transferencia de fondos que tengan como destinatarios a registros públicos, instituciones financieras y terceros tenedores, requeridas por la Dirección y las requeridas y decretadas por los jueces competentes, podrán diligenciarse y efectivizarse a través de sistemas y medios de comunicación informáticos, en la forma y condiciones que determine la reglamentación que dictará la Dirección.","Se podrá requerir en un único oficio el informe de bienes registrables (inmuebles, muebles, etcétera) a nombre del deudor, condiciones y estado de dominio, restricciones, etcétera y la traba del embargo sobre los bienes informados. En los casos de embargos de inmuebles e inhibiciones generales de bienes a trabarse en registros de esta Provincia, salvo que se hubiere comunicado el levantamiento se deberá reinscribir por el registro respectivo en forma automática por una única vez.","La información solicitada deberá contestarse dentro de los diez (10) días corridos, computados desde la fecha de recepción y, en ningún caso, podrá denegarse mediante la invocación de contenidos dispuestos en las leyes, cartas orgánicas o reglamentaciones que hayan determinado la creación o rijan el funcionamiento de los referidos organismos,reparticiones, entes o instituciones estatales o privadas.","Con relación a las medidas cautelares previstas en el Código Fiscal no será de aplicación lo dispuesto por el artículo 207 de la Ley XII – N.° 27, Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones. El juez deberá priorizar la traba y mantenimiento de cautelaressobre montos líquidos en lugar de hacerlo sobre bienes realizables, excepto petición o consentimiento expreso de la parte actora.","Con la información proveniente de cada cautelar, el juez podrá de oficio o a pedido de parte, previo traslado al actor por cinco (5) días, que será notificado personalmente o por cédula, resolver respecto del levantamiento o reducción de alguna de las medidas cuando resulte evidente la suficiencia de las mismas y pueda ocasionarse un perjuicio al demandado. La providencia deberá ser notificada por cédula siendo apelable dentro de los cinco (5) días. El recurso se fundará en el mismo escrito de interposición y se concederá con efecto suspensivo para el supuesto en que el auto ordene el levantamiento o la reducción de alguna de las medidas.","Las disposiciones precedentes prevalecerán sobre las normas legales o reglamentarias específicas de cualquier naturaleza o materia, que impongan formas o solemnidades distintaspara la toma de razón de dichas solicitudes, órdenes, medidas cautelares o alternativas."],"s":"En cualquier momento y aún antes de iniciarse la ejecución fiscal, puede la Dirección General de Rentas solicitar, para asegurar el crédito fiscal que adeudan los contribuyentes o responsables, y el juez deberá disponerla en…"},{"n":110,"t":"Competencia - Aspectos procesales - Juicio ordinario posterior- Notificaciones","p":["Serán competentes a los efectos de los juicios de ejecuciones fiscales, los jueces de paz o de primera instancia del fuero provincial competentes que correspondan al domicilio fiscal del obligado en jurisdicción de la provincia de Misiones, o el que corresponda al lugar de cumplimiento de la obligación o el del lugar en que se encuentren losbienes afectados por la obligación que se ejecute, a elección del actor.","Cuando no se conozca el domicilio del deudor en la Provincia, será tramitado ante los jueces de la ciudad de Posadas, ante los del lugar de la radicación de los bienes o ante los del lugar de realización del hecho imponible, a elección del Fisco. En ningún caso, la facultad que el Fisco confiera a los contribuyentes para el pago de sus obligaciones fuera de la jurisdicción provincial, podrá entenderse como declinación de esta última.","En el caso de existir varios créditos contra una misma persona, podrán acumularse en una ejecución, también a elección del actor.","No es admisible la recusación sin causa.","En las ejecuciones fiscales no podrá cuestionarse la inconstitucionalidad del tributo cuyo cobro se persigue ni plantearse cuestión alguna sobre el origen del crédito ejecutado, ni se producirá la caducidad de instancia.","El derecho de las partes a promover proceso ordinario posterior caduca a los treinta (30) días de quedar firme la sentencia dictada en el juicio de ejecución fiscal y siempre que se haya cumplido con las condenaciones impuestas.","Las notificaciones que deban practicarse en esta clase de juicio se efectuarán en el domicilio fiscal o procesal del deudor o el que corresponda al lugar de cumplimiento de la obligación, a elección del actor.","Los jueces podrán autorizar notificaciones por telegramas colacionados o cartas documentos a solicitud del actor, y en ese caso servirá como suficiente prueba de la notificación al ejecutado el recibo especial que expida el prestador postal, contándose los términos a partir de la fecha consignada en el mismo."],"s":"Serán competentes a los efectos de los juicios de ejecuciones fiscales, los jueces de paz o de primera instancia del fuero provincial competentes que correspondan al domicilio fiscal del obligado en jurisdicción de la…"},{"n":111,"t":"Notificaciones por Edictos","p":["Cuando el demandado fuere persona desconocida, desaparecida, ausente o no se conociera su domicilio fiscal en la Provincia, se citará por medio de edictos que se publicarán durante dos (2) días en el Boletín Oficial. Si vencido dicho término no compareciera se le nombrará al defensor oficial que corresponda y con él se seguirán los trámites de la ejecución fiscal."],"s":"Cuando el demandado fuere persona desconocida, desaparecida, ausente o no se conociera su domicilio fiscal en la Provincia, se citará por medio de edictos que se publicarán durante dos (2) días en el Boletín Oficial"},{"n":112,"t":"Pruebas de Excepciones","p":["La prueba del pago deberá consistir exclusivamente en los recibosotorgados por funcionarios o reparticiones fiscales o constancias en instrumentos públicos oen actuaciones judiciales. El comprobante respectivo deberá acompañarse al oponerse la excepción.","La prueba de las demás excepciones deberá ofrecerse en el escrito en que se opongan, no procediéndose de esta manera serán rechazadas sin más trámite siendo inapelable el pronunciamiento."],"s":"La prueba del pago deberá consistir exclusivamente en los recibosotorgados por funcionarios o reparticiones fiscales o constancias en instrumentos públicos oen actuaciones judiciales"},{"n":113,"t":"Cobro por Vía de Ejecución Fiscal","p":["Los pagos efectuados después de iniciado el juicio, los pagos malimputados o no comunicados por el contribuyente o responsable en la forma que establezca la Dirección, no serán hábiles para fundar excepción.","Acreditados los mismos en los autos, procederá su archivo o reducción del monto demandado, con costas al ejecutado."],"s":"Los pagos efectuados después de iniciado el juicio, los pagos malimputados o no comunicados por el contribuyente o responsable en la forma que establezca la Dirección, no serán hábiles para fundar excepción."},{"n":114,"t":"Repetición - Pago previo","p":["En los casos de sentencias dictadas en los juicios de ejecución fiscal por cobro de impuestos, la acción de repetición sólo podrá deducirse una vez satisfecho el impuesto adeudado, accesorios y costas."],"s":"En los casos de sentencias dictadas en los juicios de ejecución fiscal por cobro de impuestos, la acción de repetición sólo podrá deducirse una vez satisfecho el impuesto adeudado, accesorios y costas."},{"n":115,"t":"Sentencia de Remate","p":["Si no se han opuesto excepciones o éstas no han sido admitidas o han sido rechazadas, se dictará sentencia de remate mandando llevar adelante la ejecución.","La sentencia sólo será apelable en los casos regulados por el artículo 523 de la Ley XII – N.° 27, Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones, con efecto devolutivo, debiendo el recurso interponerse y fundarse en un único acto, dentro del términode cinco (5) días desde su notificación. De la apelación se dará traslado a la contraria por igual término, en forma personal o por cédula."],"s":"Si no se han opuesto excepciones o éstas no han sido admitidas o han sido rechazadas, se dictará sentencia de remate mandando llevar adelante la ejecución."},{"n":116,"t":"Ejecución de sentencia - Designación Martillero - Remate de bienes del deudor","p":["Dictada la sentencia de remate, se procederá a la venta de los bienes del deudor, en cantidad suficiente para responder al crédito fiscal.","A los fines de la venta de bienes, se nombrará martillero al que proponga la parte ejecutante quien podrá ser recusado con causa dentro del tercer día de su designación, no resultando de aplicación el artículo 20 de la Ley XII – N.° 3. Los martilleros designados,sólo podrán reclamar honorarios y gastos a la parte ejecutada.","La Dirección General de Rentas podrá adquirir los bienes muebles o inmuebles en caso de fracasar la subasta por falta de postores, por el valor de la base del último remate, compensando total o parcialmente el precio con el monto del crédito ejecutado.","La Dirección General de Rentas, podrá requerir el concurso de instituciones financieras radicadas en la Provincia, para financiar parte del precio de venta de los bienes a subastarse."],"s":"Dictada la sentencia de remate, se procederá a la venta de los bienes del deudor, en cantidad suficiente para responder al crédito fiscal."},{"n":117,"t":"Independencia del Sumario","p":["El cobro de los impuestos por vía de ejecución fiscal, se tramitará independientemente del curso del sumario a que pueda dar origen la falta de pago del mismoo por las infracciones fiscales en que haya incurrido el contribuyente o responsable."],"s":"El cobro de los impuestos por vía de ejecución fiscal, se tramitará independientemente del curso del sumario a que pueda dar origen la falta de pago del mismoo por las infracciones fiscales en que haya incurrido el…"},{"n":118,"t":"Boleta de Deuda - Presentación en Concurso","p":["Las boletas de deuda expedidas en los términ
