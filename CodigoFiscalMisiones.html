art":"","par":43,"arts":[253]},{"lv":3,"kind":"Capítulo","num":"VI","name":"DEL DESTINO DE LA RECAUDACIÓN","part":"","par":43,"arts":[254,255,256]},{"lv":3,"kind":"Capítulo","num":"VII","name":"DISPOSICIONES GENERALES","part":"","par":43,"arts":[257,258,259,260,261,262,263,264]}],"arts":[{"n":1,"t":"Disposiciones que Rigen las Obligaciones Fiscales","p":["Las obligaciones fiscales que establezca la Provincia de Misiones, sean impuestos, tasas o contribuciones, se regirán por las disposiciones de este Código o leyes fiscales especiales."],"s":"Las obligaciones fiscales que establezca la Provincia de Misiones, sean impuestos, tasas o contribuciones, se regirán por las disposiciones de este Código o leyes fiscales especiales."},{"n":2,"t":"Impuestos","p":["Son impuestos las prestaciones pecuniarias que, por disposición de este Código o de leyes especiales, estén obligadas a pagar a la Provincia las personas que realicen actos y operaciones o se encuentren en situaciones que la ley considera como hechos imponibles. Es hecho imponible todo hecho, acto, operación o situación de la vida económicade los que este Código o leyes fiscales especiales hagan depender el nacimiento de la obligación impositiva."],"s":"Son impuestos las prestaciones pecuniarias que, por disposición de este Código o de leyes especiales, estén obligadas a pagar a la Provincia las personas que realicen actos y operaciones o se encuentren en situaciones que la…"},{"n":3,"t":"Tasas","p":["Son tasas las prestaciones pecuniarias que, por disposición de este Código o de leyes especiales, estén obligadas a pagar como retribución a la Provincia las personas a que ésta presta servicios administrativos o judiciales."],"s":"Son tasas las prestaciones pecuniarias que, por disposición de este Código o de leyes especiales, estén obligadas a pagar como retribución a la Provincia las personas a que ésta presta servicios administrativos o judiciales."},{"n":4,"t":"Contribuciones","p":["Son contribuciones las prestaciones pecuniarias que por disposición del presente Código o de leyes especiales, estén obligadas a pagar a la Provincia las personas que obtengan beneficios o mejoras en los bienes de su propiedad o poseídos a título de dueñopor obras o servicios públicos generales."],"s":"Son contribuciones las prestaciones pecuniarias que por disposición del presente Código o de leyes especiales, estén obligadas a pagar a la Provincia las personas que obtengan beneficios o mejoras en los bienes de su propiedad…"},{"n":5,"t":"Vigencia Normas Tributarias","p":["Las normas tributarias son obligatorias a partir del octavo día hábil posterior al de su publicación en el Boletín Oficial, salvo que ellas mismas dispongan otra fecha de vigor."],"s":"Las normas tributarias son obligatorias a partir del octavo día hábil posterior al de su publicación en el Boletín Oficial, salvo que ellas mismas dispongan otra fecha de vigor."},{"n":6,"t":"Métodos de Interpretación","p":["Son admisibles todos los métodos para la interpretación de las disposiciones d e este Código y demás leyes fiscales, pero en ningún caso se establecerán impuestos, tasas o contribuciones, ni se considerará a ninguna persona como contribuyente o responsable del pago de una obligación fiscal, sino en virtud de este Código u otra ley."],"s":"Son admisibles todos los métodos para la interpretación de las disposiciones d e este Código y demás leyes fiscales, pero en ningún caso se establecerán impuestos, tasas o contribuciones, ni se considerará a ninguna persona…"},{"n":7,"t":"Normas de Interpretación","p":["Para los casos que no puedan ser resueltos por las disposiciones pertinentes de este Código o de una ley fiscal especial, se recurrirá a las disposiciones de este Código u otra ley fiscal relativa a materia análoga, salvo, sin embargo, lo dispuesto en el artículo anterior.","En defecto de normas establecidas para materia análoga se recurrirá a los principios generales del derecho, teniendo en cuenta la naturaleza y finalidad de las normas fiscales.","Cuando los términos o conceptos contenidos en las disposiciones del presente Código o demás leyes fiscales no resulten aclarados en su significación y alcance por los métodos de interpretación indicados en el párrafo anterior, se atenderá al significado y alcance que los mismos tengan en las normas del derecho privado."],"s":"Para los casos que no puedan ser resueltos por las disposiciones pertinentes de este Código o de una ley fiscal especial, se recurrirá a las disposiciones de este Código u otra ley fiscal relativa a materia análoga, salvo, sin…"},{"n":8,"t":"Aplicación Normas Supletorias Procesales","p":["Serán de aplicación supletoria respecto al procedimiento para los casos no previstos en este Código, las disposiciones de la ley de trámite administrativo, el Código de Procedimiento Contencioso Administrativo de la Provincia de Misiones, el Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones y el Código Procesal Penal de la Provincia de Misiones."],"s":"Serán de aplicación supletoria respecto al procedimiento para los casos no previstos en este Código, las disposiciones de la ley de trámite administrativo, el Código de Procedimiento Contencioso Administrativo de la Provincia…"},{"n":9,"t":"Naturaleza del Hecho Imponible","p":["Para determinar la verdadera naturaleza de los hechos imponibles, se atenderá a los actos o situaciones efectivamente realizadas, con prescindencia de las formas o de los contratos del derecho privado en que se exterioricen.","La elección de actos o contratos diferentes de los que normalmente se utilizan para realizar las operaciones económicas que el presente Código u otras leyes especiales consideren como hechos imponibles, es irrelevante a los efectos de la aplicación del impuesto. A este efecto se tendrá en cuenta el conjunto de circunstancias concretas que dan origen al hecho imponible, actividades industriales o profesionales o de las relaciones civiles que a él se refieren, la contabilidad correcta y ordenada de los contribuyentes y los usos y costumbres de la vida económica y social."],"s":"Para determinar la verdadera naturaleza de los hechos imponibles, se atenderá a los actos o situaciones efectivamente realizadas, con prescindencia de las formas o de los contratos del derecho privado en que se exterioricen."},{"n":10,"t":"Funciones","p":["Todas las funciones referentes a la recaudación, fiscalización, determinación, aplicación de sanciones, devolución de los impuestos, tasas y contribucionesestablecidos por este Código y demás leyes fiscales, corresponderán a la Dirección General de Rentas.","La Dirección General de Rentas actuará como entidad autárquica en el orden administrativo, financiero, presupuestario y operativo en lo que se refiere a su organización y funcionamiento, según las normas que al efecto se prevén en la presente ley.","En lo que atañe a la aplicación, percepción y fiscalización de los tributos a su cargo, se desenvolverá bajo la superintendencia general que ejercerá sobre la misma el Ministerio de Hacienda, Finanzas, Obras y Servicios Públicos a través de su estructura orgánica.","A tales fines, su patrimonio estará constituido por todos los bienes que le asigne el Estado Provincial y por aquellos que le sean transmitidos o adquiera por cualquier causa jurídica.","El Poder Ejecutivo Provincial queda facultado para transferir sin cargo los inmueblesactualmente en uso por la Dirección General de Rentas, y que son de propiedad del Estado Provincial.","La fiscalización de la Dirección General de Rentas será realizada por el Tribunal de Cuentas y por la Contaduría General de la Provincia.","La Dirección General de Rentas será denominada en este Código simplemente: La Dirección."],"s":"Todas las funciones referentes a la recaudación, fiscalización, determinación, aplicación de sanciones, devolución de los impuestos, tasas y contribucionesestablecidos por este Código y demás leyes fiscales, corresponderán a…"},{"n":11,"t":"Recursos","p":["Los recursos de la Dirección provienen de:","a) los importes que surjan de aplicar el trece por ciento (13%) de lo recaudado en concepto de tributos provinciales, que se presupuestan anualmente para su inclusión en el Presupuesto de la Administración Pública Provincial de acuerdo a lo previsto en el inciso h) del artículo 18 del presente Código;","b) las sumas provenientes de las prestaciones a terceros y ventas de publicaciones, formularios e instrucciones que realiza el organismo;","c) los importes que provengan de la venta de bienes muebles o inmuebles, registrables o no;","d) todo otro ingreso no contemplado expresamente, pero cuya percepción no sea incompatible con las facultades otorgadas al Organismo.","En caso de que los recursos previstos en el inciso a) son insuficientes, el Poder Ejecutivo efectúa las adecuaciones y refuerzos que resultan necesarios para financiar el funcionamiento de la Dirección.","La Dirección tiene a su cargo la administración y manejo de los fondos destinados a atender su presupuesto, con amplias facultades para asignar y redistribuir los fondos, quedando facultada para deducir el importe de los mismos del monto de las recaudaciones a su cargo.","Los bienes y cuentas de la Dirección son inembargables.","El agente financiero de la Provincia deposita el importe establecido en el inciso a), a disposición de la Dirección General de Rentas, informando mensualmente a la Tesorería General de la Provincia los importes transferidos.","Se crea la cuenta: Dirección General de Rentas-Cuenta Operativa, la que se forma con el trece por ciento (13%) de la recaudación neta total de los gravámenes provinciales.","Los fondos son aplicados por la Dirección para cubrir gastos operativos y de funcionamiento.","En caso de existir excedentes de recursos no utilizados, ni comprometidos, los mismos son transferidos a la Tesorería General de la Provincia según lo determina la reglamentación.","A los efectos de esta norma debe entenderse por recaudación neta total las sumas que resultan de deducir de los ingresos totales, las devoluciones, repeticiones, reintegros y reembolsos dispuestos por las leyes correspondientes a tributos que recauda la Dirección, incluyendo a todas las modalidades de cancelación de las obligaciones, vigentes o a crearse, que aplican los contribuyentes y responsables."],"s":"Los recursos de la Dirección provienen de:"},{"n":12,"t":"Facultades, Atribuciones y Deberes","p":["La Dirección estará a cargo de un Director General cuyas funciones, atribuciones y deberes se establecen en el presente Código, leyes fiscales y decretos reglamentarios.","Condiciones para ser Director General Para ser Director General se requiere: ser argentino nativo, con cinco años de residencia en la Provincia, poseer título de Contador Público Nacional o Doctor en Ciencias Económicas expedido por Universidad Argentina debiendo acreditar además cinco años en el ejercicio de la profesión o desempeño de una función pública.","Representación de la Dirección General El Director General o quien legalmente lo sustituya representará a la Dirección frente a los Poderes Públicos, contribuyentes, responsables y terceros.","Delegación de funciones y facultades del Director General El Director General podrá delegar sus funciones en funcionarios dependientes, de manera general o especial; empero no son delegables las atribuciones de:","a) reglamentación de normas e interpretación de las mismas mediante actos de contenido general;","b) evacuación de consultas de la Dirección. Las mismas deberán presentarse antes de configurarse el hecho imponible o dentro del plazo previsto para su declaración, conforme lareglamentación que fije la Dirección. La presentación de la consulta no suspenderá el transcurso de los plazos ni justificará el incumplimiento de los obligados, salvo para el Impuesto de Sellos de conformidad con la reglamentación. Las respuestas tendrán carácter vinculante y surtirán efectos únicamente entre las partes, en tanto no se hubieren alterado lascircunstancias, antecedentes, modalidades de producción, elaboración o comercialización o los datos suministrados en oportunidad de emitirse dictamen o evacuación del asunto sobre el cual se hubiera requerido definición;","c) otorgamiento de facilidades de pagos especiales;","d) allanamiento y renuncias de apelaciones en las causas tributarias;","e) resolución de pedidos de reconsideración y recursos de repetición de impuestos;","f) remisión de sanciones.","El Director General podrá facultar para la verificación y cobro de impuestos de personas humanas o jurídicas que tengan el asiento de sus negocios fuera de la Provincia, a terceros contratados por el Poder Ejecutivo, con ámbito de actuación en las respectivas zonas, conforme a las atribuciones y responsabilidades que surjan del decreto respectivo."],"s":"La Dirección estará a cargo de un Director General cuyas funciones, atribuciones y deberes se establecen en el presente Código, leyes fiscales y decretos reglamentarios."},{"n":13,"t":"Sub - Director General","p":["Secundará al Director General en sus funciones el número de Subdirectores Generales que, hasta un máximo de cuatro determine el Ministerio de Hacienda, Finanzas, Obras y Servicios Públicos quienes deberán ser profesionales en ciencias económicas o abogados y reunir además los requisitos establecidos en el artículo 12 del Código Fiscal.","Los Subdirectores Generales, de acuerdo con el orden de prelación que establezca lareglamentación vigente, lo reemplazarán en caso de ausencia o impedimento en todas sus funciones y atribuciones.","Sin perjuicio de la competencia que se establece en los párrafos anteriores, podrá disponer el Director General que los Subdirectores Generales asuman la responsabilidad de determinadas funciones y atribuciones, señaladas por la naturaleza de las materias, por el ámbito territorial en que ejerzan sus funciones o por otras circunstancias."],"s":"Secundará al Director General en sus funciones el número de Subdirectores Generales que, hasta un máximo de cuatro determine el Ministerio de Hacienda, Finanzas, Obras y Servicios Públicos quienes deberán ser profesionales en…"},{"n":14,"t":"Inconstitucionalidad de Normas Tributarias","p":["La Dirección no será competente para declarar la inconstitucionalidad de normas tributarias, pudiendo no obstante, la Cámara Fiscal aplicar la jurisprudencia de la Corte Suprema de Justicia de la Nación o del Superior Tribunal de Justicia de la Provincia de Misiones que haya declarado la inconstitucionalidad de dichas normas."],"s":"La Dirección no será competente para declarar la inconstitucionalidad de normas tributarias, pudiendo no obstante, la Cámara Fiscal aplicar la jurisprudencia de la Corte Suprema de Justicia de la Nación o del Superior Tribunal…"},{"n":15,"t":"Embargo Preventivo","p":["En cualquier momento podrá la autoridad de aplicación solicitar embargo preventivo por la cantidad que presumiblemente adeudan los contribuyentes o responsables y los jueces deberán decretarlo en el término de veinticuatro (24) horas, bajo la responsabilidad del Fisco.","Para probar la pretensión fiscal se deberá acompañar copia de la vista corrida o de las resoluciones dictadas en las actuaciones administrativas. En virtud de la presunción de legitimidad de los actos administrativos, tales elementos serán suficientes para la conviccióny, por ende, para la acreditación de la verosimilitud del derecho del Fisco.","Este embargo podrá ser sustituido por garantía real o personal suficiente, y podrá solicitarse la caducidad si dentro del término de noventa (90) días contados a partir de la traba de la última medida precautoria solicitada la autoridad de aplicación no iniciare el correspondiente juicio de ejecución fiscal. Iniciada la ejecución fiscal no podrá decretarse la caducidad de las medidas.","A los fines de efectivizar el embargo preventivo decretado sobre los bienes muebles contenidos en una caja de seguridad bancaria, el oficial de justicia ad hoc debe realizar un prolijo inventario no pudiendo recaer la medida sobre bienes inembargables conforme a lo dispuesto por el Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones y debiendo preservarse el derecho a la privacidad, con relación a aquellos otros elementos que pudieren encontrarse guardados en las cajas de seguridad, pero que resultan inconducentes para asegurar el crédito reclamado. El oficial de justicia ad hoc dejará los bienes embargados en poder del banco como depositario provisional. En el caso de que lo embargado fuese dinero,deberá depositarlo en una cuenta en el banco que actúe como agente financiero de la Provincia a nombre de la causa y a la orden del juez competente.","El término fijado para la caducidad del embargo se suspenderá desde la fecha de interposición del recurso administrativo o judicial, y hasta noventa (90) días después de quedar firme la resolución dictada.","En todo cuanto no fuere previsto en este artículo resultará de aplicación las disposiciones contendidas en el Título XI del Libro I del presente Código."],"s":"En cualquier momento podrá la autoridad de aplicación solicitar embargo preventivo por la cantidad que presumiblemente adeudan los contribuyentes o responsables y los jueces deberán decretarlo en el término de veinticuatro…"},{"n":16,"t":"Delegaciones y Receptorías","p":["En las cabeceras de Departamentos de la Provincia o donde el Poder Ejecutivo y la Dirección lo determinen, habrá una delegación o receptoría, que tendrá a su cargo la percepción de los tributos establecidos en este Código u otras leyes que así lo establezcan.","Obligaciones de Delegados y Receptores Sin perjuicio de las demás funciones que se le asignen serán obligaciones de los delegados y receptores de rentas:","a) recaudar los tributos de conformidad con las instrucciones que le imparte la Dirección;","b) registrar el movimiento de fondos y valores y rendir cuenta en la forma y tiempo que determine la reglamentación;","c) prestar asesoramiento a los contribuyentes y velar por el estricto cumplimiento de las normas fiscales;","Municipios: Sus funciones como delegados y receptores.","El Poder Ejecutivo podrá convenir con los municipios cuando lo estime necesario, el cumplimiento por parte de éstos de las funciones atribuidas a las Delegaciones o Receptoríasde Rentas.","Asimismo, podrá autorizar a los municipios que cuenten con estructura adecuada para ello, a ejecutar por vía de ejecución fiscal los créditos que registre en concepto de Impuesto Provincial al Automotor, con las mismas facultades otorgadas a la Dirección, dentro de lo establecido por este Código."],"s":"En las cabeceras de Departamentos de la Provincia o donde el Poder Ejecutivo y la Dirección lo determinen, habrá una delegación o receptoría, que tendrá a su cargo la percepción de los tributos establecidos en este Código u…"},{"n":17,"t":"Poderes y Facultades de la Dirección","p":["Con el fin de asegurar la verificación oportuna de la situación impositiva de los contribuyentes y demás responsables la Dirección está facultada para:","a) dictar actos reglamentarios o interpretativos de contenido general, con observancia del principio de legalidad tributaria;","b) fijar fecha de vencimiento general para la presentación de declaraciones juradas, pagos de impuestos, anticipos cuando fueran determinados por ley, retenciones, y demás conceptos que fueran necesarios y no dependan de ley. En los regímenes previstos en el artículo 12 inciso c) el plazo que se otorgue para la cancelación total de la deuda no puede exceder de los cinco (5) años, pudiendo remitirse total o parcialmente las sanciones. La remisión podrá comprender además, los intereses devengados, según la reglamentación que dicte el Poder Ejecutivo;","El término fijado para la caducidad del embargo se suspenderá desde la fecha de interposición del recurso administrativo o judicial, y hasta noventa (90) días después de quedar firme la resolución dictada.","En todo cuanto no fuere previsto en este artículo resultará de aplicación las disposiciones contendidas en el Título XI del Libro I del presente Código.","Delegaciones y Receptorías","c) condicionar el cómputo de deducciones, quitas o bonificaciones por parte de los contribuyentes o responsables, al cumplimiento de determinados requisitos y condiciones y a la utilización de determinados medios de pago u otras formas de comprobación de las operaciones en cuyo caso los contribuyentes que no utilicen tales medios o formas de comprobación quedarán obligados a acreditar la veracidad de las operaciones para poder computar a su favor los conceptos indicados. Idénticos efectos se aplicarán a aquellos contribuyentes o responsables que por sus compras o locaciones reciban facturas o documentos equivalentes, apócrifos o no autorizados, cuando estuvieren obligados pordisposiciones nacionales o provinciales a efectuar la constatación de los mismos;","d) fijar y aceptar las garantías necesarias con relación a las deudas fiscales. La ejecución de las garantías, no gozará del beneficio de excusión, y se realizará mediante el procedimiento previsto en el Título XI del Libro I del presente Código;","e) designar obligados a efectuar inscripciones en el carácter que determine y a operar como agentes de retención, percepción e información;","f) disponer la comunicación de hechos, actos o actividades dentro del plazo que determine;","g) exigir que sean llevados los libros, registros o anotaciones, ordinarios o especiales, conminar su exhibición y conservación durante un término de diez (10) años, así como con referencia a los comprobantes respectivos, en concordancia con la Ley Nacional N° 26994, Código Civil y Comercial de la Nación;","h) verificar las declaraciones juradas y todo otro elemento necesario para establecer la situación de los contribuyentes y responsables;","i) solicitar información de contribuyentes, responsables o terceros, tanto particulares como organismos administrativos o judiciales;","j) exigir la comparecencia a sus oficinas a contribuyentes y responsables y citar a comparecer a terceros, para contestar o informar respecto a requerimientos que se les hagan sobre las ventas, ingresos, egresos y, en general, datos referidos a las operaciones y circunstancias que a juicio de la Dirección estén vinculados al hecho imponible previsto por este Código y las leyes respectivas. La citación indicará la materia del comparendo;","k) requerir en cualquier momento la realización de inventarios, avalúos, tasaciones, operitajes;","l) liquidar tributos, efectuar su determinación, aplicar sanciones, actualizaciones, recargos e intereses, recibir pagos totales o parciales de los mismos, imputar, compensar, acreditar y devolver las sumas correspondientes, remitir multas.","Cuando en la declaración jurada de los contribuyentes o responsables se computen contra el impuesto determinado, conceptos o importes improcedentes, tales como retenciones, pagos a cuenta, acreditaciones de saldos a favor propios o de terceros o el saldo a favor de la Dirección se cancele o se difiera impropiamente (certificados de cancelación de deuda falsos, regímenes de promoción incumplidos, caducos o inexistentes, cheques sin fondo, etcétera), no procederá para su impugnación el procedimiento normado en los artículos 39 y siguientes de este Código, sino que bastará la simple intimación de pago de los conceptos reclamados o de la diferencia a favor del Fisco que resulte de dicha declaración jurada. Incumplida la intimación de pago quedará habilitada la vía de ejecución fiscal;","m) solicitar órdenes de allanamiento para proceder a la apertura de cajas de seguridad a fin de embargar bienes contenidos en ellas, sin necesidad de agotar otras vías;","n) disponer clausuras preventivas de establecimientos, locales, oficinas, recinto comercial o puesto de ventas, industrial, agropecuario o de prestación de servicios; interdicción; secuestro, comiso de mercaderías, bienes o cosas; yaplicar suspensión en el uso de matrícula,licencia o inscripción en registros que las disposiciones exigen para el ejercicio de determinadas actividades, cuando su otorgamiento sea competencia del Poder Ejecutivo Provincial;","ñ) imponer a los consumidores finales de bienes, obras o servicios, o a quienes de acuerdo con las leyes tributarias deban revestir o recibir ese tratamiento, la obligación de exigir la entrega de facturas o comprobantes que documenten sus operaciones de adquisición o de pago de servicios. La obligación incluye la conservación en su poder y la exhibición a los funcionarios de la Dirección General de Rentas que pudieran requerirlos en el momento de la operación o a la salida del establecimiento, local, oficina, recinto o puesto de ventas donde se hubieran celebrado las transacciones. La sanción a quien haya incumplido el deber de emitir o entregar facturas o comprobantes equivalentes será un requisito previo para que recaiga sanción al consumidor final por la misma omisión;","o) autorizar, mediante orden expresa, a sus agentes para actuar en ejercicio de sus funciones, como compradores de bienes o locatarios de obras o servicios y constaten el cumplimiento por parte de los vendedores o locadores, de la obligación de emitir y entregar facturas o comprobantes equivalentes con los que documenten las respectivas operaciones, en los términos y con las formalidades que exige la Dirección General de Rentas. Una vez que los funcionarios habilitados se identifiquen como tales ante el contribuyente o responsable, de no haberse consumido los bienes o servicios adquiridos, se procederá a anular la operación y, en su caso, la factura o documento emitido. De no ser posible la eliminación de dichos comprobantes, se emitirá la pertinente nota de crédito;","p) requerir al Juez interviniente la designación de Oficial de Justicia ad hoc, fundando la petición, el Juez resolverá sin traslado alguno;","q) promover ejecuciones por vía de ejecución fiscal y efectuar pedidos de quiebra;","r) realizar ante la Cámara Fiscal y la Justicia Provincial y Nacional la defensa de los intereses del Fisco Provincial. Asimismo, queda facultado para la formulación de denuncias penales, pudiendo actuar como actor civil o querellante particular a través de funcionarios designados para que asuman su representación;","s) allanarse o no apelar en las causas ante la Cámara Fiscal, en las ejecuciones fiscales, o en causas judiciales cuando se estime suficientemente refutada la pretensión fiscal, en igual forma que la requerida legalmente para Fiscalía de Estado o de acuerdo a lo que establezca la reglamentación;","t) disponer la digitalización de documentaciones y actuaciones administrativas, su archivo y destrucción. Una vez digitalizadas las mismas, se podrá proceder a su destrucción en el término previsto por el Poder Ejecutivo, siendo plenamente válidas y de igual valor probatorio a todos los efectos legales las copias digitalizadas, quedando la Dirección excluida de la aplicación del artículo 157 de la Ley VII – N.° 11, Ley de Contabilidad, y del que lo sustituya;","u) ejercer toda otra acción necesaria para implementar o ejecutar funciones otorgadas a través del texto del Código y de las leyes especiales;","v) la Dirección podrá establecer valores de transacción de referencia para bienes o servicios alcanzados por los tributos vigentes. A los fines de establecer los valores de transacción de referencia se podrá considerar entre otros: el valor económico de los bienes y servicios en el mercado comercial; los valores de referencias de productos publicados por cámaras, asociaciones y similares; los valores de venta al público publicados; todo otro indicador quepermita establecer el valor de los bienes o servicios. En todos aquellos casos en que coexistauna valuación fiscal con el valor de transacción de referencia, deberá tomarse el mayor de ellos para luego realizar las demás comparaciones que exige este Código a los efectos de determinar la base imponible, conforme lo determine la Dirección;","w) recibir denuncias de terceros y los antecedentes que suministre la justicia provincial, respecto de los hechos u omisiones que pudieran encuadrar, presuntamente, en alguno de los delitos tipificados en la Ley Nacional N.º 24769, debiendo comenzar inmediatamente el procedimiento de verificación y determinación de deuda, procediendo al dictado de la resolución determinativa de la obligación tributaria, en un plazo no mayor de ciento veinte (120) días hábiles administrativos, el que podrá ser prorrogado a requerimiento fundado del organismo recaudador.","La Dirección tendrá amplios poderes para verificar en cualquier momento, por intermedio de sus funcionarios, o empleados, inclusive en forma simultánea con el hecho imponible, el cumplimiento que los obligados den a las normas fiscales de cualquier índole.","A tal fin podrá:","1) inspeccionar los lugares y establecimientos donde esté el domicilio real, legal o fiscal, o donde ocurra el hecho imponible, exigiendo la exhibición de bienes, libros, documentos y comprobantes, e inspeccionarlos, intervenirlos y disponer medidas para su conservación y seguridad;","2) requerir el auxilio de la fuerza pública cuando fuera menester para ejercer sus facultades, o cumplimentar órdenes judiciales o allanamientos;","3) solicitar órdenes de allanamiento, las que deberán ser libradas por la autoridad judicial competente, bajo responsabilidad de la peticionante, dentro de las veinticuatro (24) horas, habilitando días y horas si fuera solicitado.","La orden especificará lugar y oportunidad, y en su ejecución será de aplicación en lo pertinente el Código Procesal Penal de la Provincia de Misiones."],"s":"Con el fin de asegurar la verificación oportuna de la situación impositiva de los contribuyentes y demás responsables la Dirección está facultada para:"},{"n":18,"t":"Facultades de Organización Interna","p":["El Director General tendrá, con relación a la organización interna del organismo las atribuciones y responsabilidades que se detallan a continuación:","a) proponer al Poder Ejecutivo Provincial el reglamento del funcionamiento interno de la Dirección General en sus aspectos funcionales y de administración de personal, incluyendo el dictado o modificación de la estructura orgánica o funcional;","b) proponer al Poder Ejecutivo Provincial, por intermedio del Ministerio de Hacienda, Finanzas, Obras y Servicios Públicos, el proyecto de estatuto y escalafón del personal y su reglamento, el cual contemplará la escala salarial y preverá la compensación económica por las incompatibilidades creadas por el artículo 19;","c) proponer al Poder Ejecutivo Provincial por intermedio del Ministerio de Hacienda,Finanzas, Obras y Servicios Públicos, el régimen disciplinario, pudiéndose dictar las disposiciones reglamentarias pertinentes;","d) designar personal con destino a la planta permanente o temporaria, así como también promover, aceptar renuncias, disponer cesantías, exoneraciones y otras sanciones disciplinarias, con arreglo al régimen legal vigente. Designar directamente al personal que resulte necesario para poner en funcionamiento las direcciones y jefaturas de la Dirección, como asimismo, proceder a su reemplazo, según el procedimiento establecido en la Ley I – N.° 104, de incompatibilidades de cargos para el personal de la Administración Pública Provincial;","e) aplicar sanciones disciplinarias al personal de la Dirección, de conformidad con las normas legales y reglamentarias y determinar los funcionarios con facultad para hacerlo;","f) disponer la realización de los sumarios administrativos correspondientes en el ámbito de Dirección General;","g) efectuar contrataciones de personal para la realización de labores estaciónales, extraordinarias o especiales que no puedan ser realizadas por sus recursos de planta permanente, fijando las condiciones de trabajo y su retribución según el procedimiento establecido en la Ley I – N° 104, de incompatibilidades de cargos para elpersonal de la Administración Pública Provincial;","h) elevar anualmente al Ministerio de Hacienda, Finanzas, Obras y Servicios Públicos el plan de acción y el anteproyecto de presupuesto del organismo, el que comprenderá el presupuesto de funcionamiento y un presupuesto operativo según la modalidad vigente en la Administración Pública, con las atribuciones y limitaciones que anualmente fije la Ley de Presupuesto General;","i) administrar el presupuesto y disponer los gastos e inversiones del organismo;","j) licitar, adjudicar y contratar obras públicas y suministros, adquirir, vender, permutar, transferir, locar y disponer de toda forma respecto de bienes muebles e inmuebles para el usode sus oficinas o del personal, conforme las necesidades del servicio, aceptar donaciones cono sin cargo, conforme a lo dispuesto en la Ley de Contabilidad y sus reglamentaciones;","k) establecer con carácter general los límites para disponer el archivo de los casos de fiscalización, determinación de oficio, liquidación de deudas en gestión administrativa o judicial, aplicación de sanciones u otros conceptos o procedimientos a cargo de la Dirección,que en razón de su bajo monto o incobrabilidad no impliquen créditos de cierta, oportuna o económica concreción;","l) toda otra atribución compatible con el cargo necesario para el cumplimiento de las funciones del organismo."],"s":"El Director General tendrá, con relación a la organización interna del organismo las atribuciones y responsabilidades que se detallan a continuación:"},{"n":19,"t":"Incompatibilidades","p":["Sin perjuicio de las incompatibilidades establecidas por las leyes y reglamentos vigentes, queda prohibido al personal de la Dirección General de Rentas prestarcualquier clase de asesoramiento y servicio en forma gratuita u onerosa por sí o por interpósita persona, en materia de gravámenes cuya verificación, fiscalización y percepción estén a cargo de esta repartición u otros organismos nacionales o municipales, así como patrocinar o representar a contribuyentes o responsables ante los mismos, o intervenir, tramitar o gestionar actuaciones administrativas o judiciales vinculadas con los mencionadosgravámenes, salvo que se trate de derecho propio, del cónyuge, ascendientes, descendientes o colaterales hasta el segundo grado inclusive.","La prohibición establecida en este artículo debe entenderse referida al asesoramiento efectuado en forma privada y no aquel en que el agente evacua la consulta en carácter de empleado del Fisco y en cumplimiento de sus funciones.","Estas prohibiciones alcanzan a todo el personal de la Dirección General de Rentas, incluyendo al Director General y su personal jerárquico y, en general, todo ejercicio de la profesión en ciencias económicas.","Las prohibiciones contenidas en este artículo no rigen para las funciones de liquidador, partidor, perito, letrado o de apoderado en los juicios de carácter universal en los que el Estado Provincial sólo tiene interés contra la universalidad de bienes o la masa, limitado al cobro del impuesto, tasa o crédito.","Existirá incompatibilidad absoluta cuando el ejercicio de cualquier actividad permitida fuera de la repartición redunde en perjuicio o sea efectuada dentro del horario que debe cumplir el agente del organismo.","Declarase compatible el ejercicio de la docencia y de aquellas actividades expresamente autorizadas al personal de la Administración Pública Provincial, por disposiciones legales o reglamentarias en tanto no contravenga ninguna de las condiciones exigidas por el presente Código.","En caso de comprobarse violaciones al presente régimen de incompatibilidades, el agente será exonerado previo sumario."],"s":"Sin perjuicio de las incompatibilidades establecidas por las leyes y reglamentos vigentes, queda prohibido al personal de la Dirección General de Rentas prestarcualquier clase de asesoramiento y servicio en forma gratuita u…"},{"n":20,"t":"Contribuyentes y Herederos, Responsables y Terceros","p":["Los contribuyentes y sus herederos según las disposiciones del Código Civil y Comercial de la Nación, los responsables y los terceros, están obligados al cumplimiento de las disposiciones de este Código y de las leyes tributarias."],"s":"Los contribuyentes y sus herederos según las disposiciones del Código Civil y Comercial de la Nación, los responsables y los terceros, están obligados al cumplimiento de las disposiciones de este Código y de las leyes tributarias."},{"n":21,"t":"Contribuyentes","p":["Son contribuyentes de los impuestos las personas humanas, capaces o incapaces, las personas jurídicas, las sociedades, asociaciones, entidades con o sinpersonería jurídica, uniones transitorias de empresas, asociaciones de colaboración empresaria, patrimonios de afectación yaún los patrimonios destinados aun fin determinado,que realicen los actos u operaciones o se hallen en las situaciones que este Código o leyes fiscales consideren como hecho imponible.","Son contribuyentes de las tasas, las personas y los otros sujetos indicados en el párrafo anterior, a los cuales la Provincia presta un servicio administrativo o judicial, que por disposición de este Código o de leyes fiscales debe retribuirse con el pago de una tasa.","Son contribuyentes de las contribuciones, las personas y los otros sujetos indicados en el primer párrafo de este artículo, que obtengan el beneficio o mejora que, por disposición de este Código o leyes fiscales, sea causa de la obligación pertinente."],"s":"Son contribuyentes de los impuestos las personas humanas, capaces o incapaces, las personas jurídicas, las sociedades, asociaciones, entidades con o sinpersonería jurídica, uniones transitorias de empresas, asociaciones de…"},{"n":22,"t":"Solidaridad Codeudores","p":["Cuando un mismo acto, operación o situación que origine obligaciones fiscales sea realizado o se verifique respecto a dos o más personas, todas serán consideradas como contribuyentes por igual y obligadas solidariamente al pago del gravamen en su totalidad salvo el derecho del fisco a dividir la obligación a cargo de cada una de ellas. Los actos, operaciones o situaciones en que interviniese una persona o entidad se atribuirán también a otra persona o entidad con la cual aquella tenga vinculaciones económicas o jurídicas cuando de la naturaleza de esas vinculaciones resultare que ambas personas o entidades pueden ser consideradas, como constituyendo una unidad o conjunto económico que hubiere sido adoptado para eludir en todo o en parte obligaciones fiscales.","En este caso ambas personas o entidades se considerarán como contribuyentes codeudores de los gravámenes con responsabilidad solidaria y total.","Análoga disposición rige con respecto a las tasas y a las contribuciones."],"s":"Cuando un mismo acto, operación o situación que origine obligaciones fiscales sea realizado o se verifique respecto a dos o más personas, todas serán consideradas como contribuyentes por igual y obligadas solidariamente al…"},{"n":23,"t":"Responsables por Deudas Ajenas","p":["Son responsables por deudas ajenas los obligados a pagar el tributo con los recursos que administran, perciban o que disponen.","Pertenecen a esta categoría:","a) los representantes en general, como el cónyuge que percibe y dispone de los bienes del otro, padres, tutores y curadores de incapaces, síndicos y liquidadores de concurso, administradores de sociedades y sucesiones, directores, gerentes y demás mandatarios de ente jurídicos y patrimonios, etcétera.","Ellos deberán cumplir por cuenta de sus representados los deberes tributarios que las normas imponen a los contribuyentes en general;","b) los agentes de retención y los de percepción de impuestos."],"s":"Son responsables por deudas ajenas los obligados a pagar el tributo con los recursos que administran, perciban o que disponen."},{"n":24,"t":"Solidaridad","p":["Responden con sus bienes propios y solidariamente con los deudores del tributo y si los hubiere, con otros responsables del mismo gravamen, sin perjuicio de las sanciones correspondientes a las infracciones cometidas.","Representantes en General","a) todos los representantes a que se refiere el inciso a) del artículo anterior cuando, por incumplimiento de cualesquiera de sus deberes tributarios no abonarán oportunamente el debido tributo, si los deudores no cumplen la intimación administrativa de pago. No existirá esta responsabilidad personal y solidaria con respecto a quienes demuestren que sus representados los han colocado en la imposibilidad de cumplir con sus deberes fiscales;","Síndicos y Liquidadores","b) sin perjuicio de lo dispuesto en el inciso anterior y con carácter general, los síndicos de los concursos preventivos y de las quiebras que no hicieren las gestiones necesarias para la determinación y ulterior ingreso de los tributos adeudados por los responsables respecto de los períodos anteriores y posteriores a la apertura del concurso o auto de quiebra, según el caso; en particular, si dentro de los quince (15) días corridos de aceptado el cargo en el expediente judicial, no hubieran requerido a la Dirección General de Rentas las constancias de las respectivas deudas tributarias, en la forma y condiciones que establezca dichoorganismo;","Agentes de Retención y Percepción","c) los agentes de retención y percepción por el tributo que omitieren retener o percibir o que dejaron de pagar al Fisco una vez retenido o percibido, en la forma y tiempo que establezcan las normas respectivas, si no acreditaren que los contribuyentes han pagado el gravamen, y sin perjuicio de la obligación solidaria que para abonarlo existe a cargo de éstos desde el vencimiento del plazo respectivo;","Unidad o Conjunto Económico","d) las personas o entidades que tengan vinculaciones económicas o jurídicas con loscontribuyentes o responsables, cuando de la naturaleza de esas vinculaciones resultare que pueden ser consideradas junto con ésta como constituyendo una unidad o conjunto económico que hubiere sido adoptado para eludir en todo o en parte sus obligaciones fiscales;","Terceros que Facilitaren la Evasión","e) los terceros que, aun cuando no tuvieren deberes tributarios a su cargo, facilitaren por su culpa o dolo el incumplimiento total o parcial de las obligaciones fiscales o la evasión del tributo;","Sociedades de la Sección IV del Capítulo I de la Ley General de Sociedades N° 19.550","f) en las mismas condiciones del inciso a) de este artículo, los sujetosincluidosenlaSecciónIVdel Capítulo I de la ley General de Sociedades N° 19.550, responderán solidaria e ilimitadamente por las obligaciones incumplidas por los entes que integran. También serán responsables, en su caso, los socios solidariamente responsables de acuerdo con el derecho común, respecto de las obligaciones fiscales que correspondan a las sociedades o personas jurídicas que los mismos representen o integren;","Unión Transitoria de Empresas y Agrupamiento de Colaboración Empresaria","g) cualesquiera de los integrantes de una unión transitoria de empresas o de un agrupamiento de colaboración empresaria, respecto de las obligaciones tributarias generadas por la unión o el agrupamiento como tal y hasta el monto de las mismas;","Documentos Apócrifos o no Autorizados","h) los contribuyentes o responsables que por sus compras o locaciones reciban facturas o documentos equivalentes, apócrifos o no autorizados, cuando estuvieren obligados a constatar su adecuación, conforme a las disposiciones legales provinciales y nacionales vigentes.","En estos casos responderán por los impuestos adeudados por el emisor, emergentesde la respectiva operación y hasta el monto generado por la misma, siempre que no puedan acreditar la existencia y veracidad del hecho imponible."],"s":"Responden con sus bienes propios y solidariamente con los deudores del tributo y si los hubiere, con otros responsables del mismo gravamen, sin perjuicio de las sanciones correspondientes a las infracciones cometidas."},{"n":25,"t":"Solidaridad de los Sucesores a Título Particular","p":["Los sucesores a título particular en el activo o pasivo de empresas o explotaciones o en bienes que constituyan el objeto del hecho imponible o servicios retribuibles o beneficios causas de contribuciones o de bienes adquiridos en subasta, responderán solidariamente con el contribuyente y demás responsables por el pago de impuestos, tasas y contribuciones, recargos, intereses y multas, salvo que la Dirección hubiere expedido certificación de no adeudarse gravámenes, o ante un pedido de certificaciónde deuda no se hubiere expedido en el plazo fijado al efecto."],"s":"Los sucesores a título particular en el activo o pasivo de empresas o explotaciones o en bienes que constituyan el objeto del hecho imponible o servicios retribuibles o beneficios causas de contribuciones o de bienes…"},{"n":26,"t":"Definición Domicilio Fiscal","p":["El domicilio fiscal de los contribuyentes y demás responsables, a todos los efectos administrativos y judiciales que surjan de la aplicación de este Código y demás leyes tributarias, es el real o en su caso, el legal de carácter general, legislados en el Código Civil y Comercial de la Nación, ajustado a lo que establece el presente artículo y a lo que determine la reglamentación. Este domicilio deberá ser consignado en las declaraciones juradas y en toda otra presentación de los obligados ante la Dirección. Todo cambio del mismo deberá ser comunicado a la Dirección, dentro de los quince (15) días de efectuado.","En el caso de las personas humanas, cuando el domicilio real no coincida con el lugar donde esté situada la dirección o administración principal y efectiva de sus actividades,este último será el domicilio fiscal.","En el caso de las personas jurídicas del Código Civil y Comercial de la Nación, las sociedades, asociaciones y entidades a las que el derecho privado reconoce la calidad de sujetos de derecho, los patrimonios destinados a un fin determinado y las demás sociedades,asociaciones, entidades y empresas, cuando el domicilio legal no coincida con el lugar donde esté situada la dirección o administración principal y efectiva, este último será el domicilio fiscal.","Cuando los contribuyentes o demás responsables se domicilien en el extranjero y no tengan representantes en el país o no pueda establecerse el de estos últimos, se considerará como domicilio fiscal el del lugar de la provincia en que dichos responsables tengan su principal negocio o explotación o la principal fuente de recursos o subsidiariamente el lugar de su última residencia.","Cuando no se hubiera denunciado el domicilio fiscal y la Dirección General de Rentas conociere alguno de los domicilios previstos en el presente artículo, el mismo tendrá valideza todos los efectos legales.","Cuando se comprobare que el domicilio denunciado no es el previsto en la presente ley o fuere físicamente inexistente, quedare abandonado o desapareciere o se alterare o suprimiere su numeración, y la Dirección General de Rentas conociere el lugar de su asiento, podrá declararlo por resolución fundada como domicilio fiscal.","En los supuestos contemplados por el párrafo anterior, cuando la Dirección, tuviere conocimiento, a través de datos concretos colectados conforme a sus facultades de verificación y fiscalización, de la existencia de un domicilio o residencia distinto al domiciliofiscal del responsable, podrá declararlo, mediante resolución fundada, como domicilio fiscalalternativo, el que, salvo prueba en contrario de su veracidad, tendrá plena validez a todos los efectos legales. Ello, sin perjuicio de considerarse válidas las notificaciones practicadas en el domicilio fiscal del responsable. En tales supuestos, con relación al domicilio fiscal delresponsable no se alterará la jurisdicción y competencia originaria.","Se considerará domicilio fiscal electrónico al sitio informático seguro, personalizado, válido y optativo registrado por los contribuyentes y responsables para el cumplimiento de sus obligaciones fiscales y para la entrega o recepción de comunicaciones de cualquier naturaleza.","Su constitución, implementación y cambio se efectuará conforme a las formas, requisitos y condiciones que establezca la Dirección, quien deberá evaluar que se cumplan las condiciones antes expuestas y la viabilidad de su implementación tecnológica con r elación a los contribuyentes y responsables. Dicho domicilio surtirá en el ámbito administrativo, los efectos del domicilio fiscal constituido, siendo válidas y plenamente eficaces todas las notificaciones, emplazamientos y comunicaciones que allí se practiquen por esta vía.","Sólo se considerará que existe cambio de domicilio cuando se haya efectuado la traslación del domicilio fiscal anterior o también, si se tratara de un domicilio legal, cuando el mismo hubiere desaparecido de acuerdo con lo previsto en el Código Civil y Comercial de la Nación.","Todo contribuyente o responsable que haya presentado una vez una declaración jurada u otra comunicación a la Dirección, está obligado a denunciar cualquier cambio de domicilio dentro del plazo previsto a tal efecto, quedando en caso contrario sujeto a las sanciones previstas en esta ley, en leyes especiales o en la reglamentación.","La Dirección General de Rentas sólo quedará obligada a tener en cuenta el cambio de domicilio si la respectiva notificación hubiera sido hecha por el contribuyente o responsableen la forma que determine la reglamentación.","Sin perjuicio de ello, en aquellas actuaciones en las que corresponda el ejercicio de las facultades previstas en los artículos 10 y 17, siguientes y concordantes, el cambio de domicilio sólo surtirá efectos legales si se comunicara fehacientemente y en forma directa enlas actuaciones administrativas y en su caso, judiciales.","Sin perjuicio de las sanciones que correspondan por la infracción del deber de comunicar el cambio de domicilio, se podrá reputar subsistente el último que se hubiera consignado. Los contribuyentes y responsables que soliciten facilidades de pago, deberán constituir undomicilio especial a ese efecto dentro del perímetro de la ciudad o localidad en que se encuentre la dependencia fiscal cuya jurisdicción les corresponda.","Para el Impuesto Inmobiliario, el domicilio fiscal será el lugar en el cual estén situados los bienes objeto del gravamen, salvo que el contribuyente hubiese constituido un domicilio especial.","En el caso de inmuebles baldíos, el contribuyente deberá constituir un domicilio especial dentro de los sesenta (60) días de publicada la presente ley. Cuando se produjeren adquisiciones de inmuebles considerados baldíos, el contribuyente deberá constituir un domicilio especial dentro de los sesenta (60) días de realizada la compra, cualquiera fuese el instrumento de la adquisición. Cuando no se diere cumplimiento a lo dispuesto en el presenteartículo, se tendrá por constituido el domicilio en la Dirección General de Rentas.","Sin perjuicio de lo enunciado, se consideran domicilios fiscales especiales los siguientes:","a) el domicilio ante el Registro Nacional de la Propiedad Automotor, en el caso del Impuesto Provincial al Automotor;","b) el especial constituido por los contratantes en el respectivo instrumento en relación al Impuesto de Sellos;","c) el domicilio real denunciado en los autos pertinentes a los efectos del pago de las Tasas de Justicia y del Impuesto de Sellos.","Los contribuyentes que no cumplan con la obligación de denunciar su domicilio fiscal o cuando el denunciado es incorrecto o inexistente, se tendrá por constituido el domicilio fiscal en la Dirección General de Rentas, Despacho del Director Provincial, con excepción del Impuesto Inmobiliario.","Sólo podrá constituirse domicilio especial en los casos de tramitación de recursos o sustanciación de sumarios y planes de facilidades de pago.","Se considerará aceptado el domicilio especial o en su caso su cambio cuando la Dirección no se opusiera expresamente dentro de los ciento ochenta (180) días de serle debidamente comunicado.","El domicilio fiscal de los contribuyentes y demás responsables, para todos los efectos tributarios, tiene el carácter de domicilio constituido siendo válidas y vinculantes todas las notificaciones administrativas y judiciales que allí se realicen."],"s":"El domicilio fiscal de los contribuyentes y demás responsables, a todos los efectos administrativos y judiciales que surjan de la aplicación de este Código y demás leyes tributarias, es el real o en su caso, el legal de…"},{"n":27,"t":"","p":["Los contribuyentes o responsables están obligados a constituir un domicilio fiscal electrónico. En caso de incumplimiento de la obligación de denunciar el domicilio fiscal o fiscal electrónico, o habiéndose denunciado un domicilio incorrecto o inexistente, y mientras se mantenga tal irregularidad, la Dirección podrá denegar al contribuyente o responsable cualquier beneficio fiscal establecido por esta u otras normas, así como suspender la emisión de certificados de cualquier tipo, denegar el cómputo de bonificaciones, fijar alícuotas especiales de retención o percepción respecto de las operaciones en que intervenga dicho sujeto o cualquier otra medida que considere pertinente para el restablecimiento del domicilio, sin perjuicio de las sanciones que pudiere corresponder. La Dirección queda facultada a tener por inexistente los domicilios fiscales denunciados de acuerdo a la información suministrada por los prestadores postales u oficiales notificadores. Cuando en ésta u otras leyes tributarias se haga referencia al domicilio o domicilio fiscal, dicha referencia se entenderá hecha al domicilio fiscal electrónico en todo lo que resulte aplicable. El domicilio fiscal electrónico para todos los efectos tributarios y procesales, tiene el carácter de domicilio constituido teniendo todas las notificaciones administrativas y judiciales que allí se realicen los mismos efectos que las notificaciones previstas en el artículo 127. Facúltase a la Dirección a dictar las disposiciones reglamentarias del presente."],"s":"Los contribuyentes o responsables están obligados a constituir un domicilio fiscal electrónico"},{"n":28,"t":"Contribuyentes Domiciliados fuera de la Provincia","p":["Los contribuyentes domiciliados fuera de la Provincia, deberán constituir domicilio fiscal en ella.","Cuando el contribuyente o responsable no posea domicilio ni representante acreditado en la Provincia, se considerará como domicilio fiscal el lugar de la provincia en que se encuentra su dirección o administración principal y subsidiariamente, será aquél donde ejerza su actividad comercial, industrial, de servicios, profesional o medio de vida o establecimiento permanente, también dentro de la Provincia.","La determinación de un domicilio a los efectos de un gravamen, tendrá plena eficacia respecto a todos los tributos provinciales.","La Dirección podrá en cualquier momento requerir la constitución de un domicilio especial.","Cualquiera de los domicilios previstos en este artículo, a los fines administrativos, contenciosos o judiciales, producirá los efectos legales del domicilio constituido."],"s":"Los contribuyentes domiciliados fuera de la Provincia, deberán constituir domicilio fiscal en ella."},{"n":29,"t":"Contribuyentes y Responsables – Deberes","p":["Los contribuyentes y demás responsables tienen que cumplir los deberes que este Código, leyes fiscales o la Dirección establezca con el fin de facilitar la determinación, verificación, fiscalización y ejecución de los impuestos, tasas y contribuciones.","Sin perjuicio de lo que establezca de manera especial, los contribuyentes y demás responsables están obligados:","a) a presentar declaración jurada de los hechos imponibles atribuidos a ellos por las normas de este Código o leyes fiscales especiales, salvo cuando en éstas se dispongan expresamente de otra manera;","b) a comunicar a la Dirección, dentro de los quince (15) días de realizado cualquier cambio en su situación que pueda dar origen a nuevos hechos imponibles o modificar o extinguir los existentes;","c) a conservar durante el término de diez (10) años y presentar a cada requerimiento de la Dirección, todos los documentos que de algún modo se refieran a las operaciones o situaciones, que constituyan los hechos imponibles;","d) a contestar cualquier pedido de la Dirección, informes y aclaraciones con respecto a sus declaraciones juradas o, en general a las operaciones que a juicio de la Dirección puedan constituir hechos imponibles y en general a facilitar con todos los medios a su alcance las tareas de verificación, fiscalización y determinación impositiva de conformidad con lo dispuesto en el artículo 38."],"s":"Los contribuyentes y demás responsables tienen que cumplir los deberes que este Código, leyes fiscales o la Dirección establezca con el fin de facilitar la determinación, verificación, fiscalización y ejecución de los…"},{"n":30,"t":"Libros","p":["La Dirección podrá imponer, con carácter general, a toda categoría de contribuyentes y responsables, lleven o no contabilidad rubricada, el deber de tener regularmente uno o más libros en que se anoten las operaciones y los actos relevantes a los fines de la determinación de las obligaciones fiscales."],"s":"La Dirección podrá imponer, con carácter general, a toda categoría de contribuyentes y responsables, lleven o no contabilidad rubricada, el deber de tener regularmente uno o más libros en que se anoten las operaciones y los…"},{"n":31,"t":"Obligación de Terceros a Suministrar Informes","p":["La Dirección podrá requerir a terceros y éstos estarán obligados a suministrarle todos los informes a que se refieran a hechos que, en el ejercicio de sus actividades, profesionales o comerciales, hayan contribuido a realizar o hayan debidoconocer y que constituyan o modifiquen hechos imponibles, según las normas de este Código u otras leyes fiscales, salvo en el caso en que normas de derecho nacional o provincial establezcan para esas personas el deber del secreto profesional."],"s":"La Dirección podrá requerir a terceros y éstos estarán obligados a suministrarle todos los informes a que se refieran a hechos que, en el ejercicio de sus actividades, profesionales o comerciales, hayan contribuido a realizar…"},{"n":32,"t":"Deberes de Funcionarios y Oficinas Públicas","p":["Todos los funcionarios y oficinas públicas de la Provincia o de las comunas están obligados a comunicar a la Dirección todos los hechos que lleguen a su conocimiento en el desempeño de sus funciones públicas específicas y que puedan constituir o modificar hechos imponibles, salvo cuando se lo prohíban otras disposiciones legales expresas."],"s":"Todos los funcionarios y oficinas públicas de la Provincia o de las comunas están obligados a comunicar a la Dirección todos los hechos que lleguen a su conocimiento en el desempeño de sus funciones públicas específicas y que…"},{"n":33,"t":"Notarios y Certificados - Transferencias de Negocios - Bienes – Etcétera","p":["En las transferencias a título gratuito u oneroso de inmuebles, bienes registrables, negocios, activos y pasivos de personas, entidades civiles o comerciales o en cualquier acto de similar naturaleza, se deberá acreditar la inexistencia de deudas fiscales hasta la fecha de otorgamiento del acto mediante certificación expedida por la Dirección.","Los notarios autorizantes deberán recaudar o asegurar el pago de los gravámenes a que se refiere el párrafo anterior o los correspondientes al acto mismo.","La expedición del certificado de deuda sólo tiene por objeto facilitar el acto al cual se refiere y no posee efecto liberatorio, salvo cuando expresamente lo indicare el mismo certificado.","Deberes de Funcionarios Públicos Los funcionarios de la Provincia y de las municipalidades no podrán en ejercicio de sus funciones:","a) dar entrada o curso a solicitudes, documentos, expedientes, escritos, libros, u otros antecedentes que carezcan de los requisitos tributarios específicos del trámite;","b) inscribir, precisar, registrar, autorizar o celebrar actos, sin que previamente se acredite el cumplimiento de las obligaciones tributarias específicas al acto;","c) autorizar o efectuar pagos a proveedores de bienes, obras o servicios, sin la constatación de la situación fiscal del contribuyente en el Impuesto sobre los Ingresos Brutos, según la reglamentación que dicte la Dirección General de Rentas.","El incumplimiento de las disposiciones del presente artículo constituirá al funcionario en responsable solidario de la obligación tributaria, sin perjuicio de las sanciones penales o administrativas que correspondan.","Estarán sujetos a las normas de este artículo los jueces provinciales excepto con relación al párrafo precedente. La Dirección General de Personas Jurídicas y Registro Público de la Provincia, al tramitar la inscripción de disoluciones y liquidaciones de sociedades comerciales con domicilio social en la provincia de Misiones, deberán exigir que se acredite el pago o la regularización de obligaciones tributarias adeudadas por las mismas.","A los fines de las normas precedentes entiéndase como funcionario asimismo a los empleados y demás dependientes."],"s":"En las transferencias a título gratuito u oneroso de inmuebles, bienes registrables, negocios, activos y pasivos de personas, entidades civiles o comerciales o en cualquier acto de similar naturaleza, se deberá acreditar la…"},{"n":34,"t":"Contadores Públicos","p":["Los Contadores Públicos que certifiquen balances de entidades de cualquier tipo, deberán hacer constar en el pasivo en renglón separado, claramente desglosado, la deuda impaga por gravámenes provinciales y sus accesorios en el supuesto de mora."],"s":"Los Contadores Públicos que certifiquen balances de entidades de cualquier tipo, deberán hacer constar en el pasivo en renglón separado, claramente desglosado, la deuda impaga por gravámenes provinciales y sus accesorios en el…"},{"n":35,"t":"Bases de Determinación de las Obligaciones Fiscales","p":["La determinación de las obligaciones fiscales se efectuará sobre las bases de declaraciones juradas que los contribuyentes, responsables o terceros presenten a la Dirección o en base a datos que ésta posea y que utilice para efectuar la determinación o liquidación administrativa según lo establecido por este Código o leyes fiscales para el gravamen de que se tratare."],"s":"La determinación de las obligaciones fiscales se efectuará sobre las bases de declaraciones juradas que los contribuyentes, responsables o terceros presenten a la Dirección o en base a datos que ésta posea y que utilice para…"},{"n":36,"t":"Declaraciones Juradas - Elementos - Boletas de Depósitos Adulteradas o Inexactas","p":["La Declaración Jurada deberá contener todos los elementos y datosnecesarios para hacer conocer el hecho imponible realizado y el monto total de la obligación fiscal correspondiente y será presentada en la forma y tiempo que la ley, el Poder Ejecutivo o la Dirección establezcan.","Las boletas de depósito adulteradas o inexactas confeccionadas por el contribuyente o responsable con datos que él mismo aporte, tienen el carácter de declaración jurada, y las omisiones, errores o falsedades que en dichos instrumentos se comprueben, están sujetos a las sanciones previstas en los artículos 51 y 69 o 70 del citado cuerpo legal."],"s":"La Declaración Jurada deberá contener todos los elementos y datosnecesarios para hacer conocer el hecho imponible realizado y el monto total de la obligación fiscal correspondiente y será presentada en la forma y tiempo que la…"},{"n":37,"t":"Responsabilidad de los Declarantes","p":["Los declarantes son responsables y quedan obligados al pago de los impuestos y contribuciones que de ellos resulten, salvo error de cálculo o de concepto, sin perjuicio de la obligación fiscal que en definitiva determine la Dirección."],"s":"Los declarantes son responsables y quedan obligados al pago de los impuestos y contribuciones que de ellos resulten, salvo error de cálculo o de concepto, sin perjuicio de la obligación fiscal que en definitiva determine la…"},{"n":38,"t":"Verificación y Determinación de Oficio","p":["La Dirección verificará las declaraciones juradas para comprobar la exactitud de los datos en ella consignados. Cuando el contribuyente o responsable no hubierepresentado declaración jurada o la misma resulte inexacta por ser falsos o erróneos los hechos consignados, o por errónea aplicación de las normas de este Código u otras leyes fiscales o de las disposiciones reglamentarias o cuando este Código u otras leyes fiscales prescindan de la declaración jurada como base de la determinación, la Dirección determinará la obligación fiscal sobre base cierta y presunta."],"s":"La Dirección verificará las declaraciones juradas para comprobar la exactitud de los datos en ella consignados"},{"n":39,"t":"Determinación de Oficio Total o Parcial","p":["La determinación de oficio será total con respecto al período y tributo de que se trate, debiendo comprender todos los elementos de la obligación tributaria, salvo cuando en la resolución respectiva se hubiera dejado expresa constancia del carácter parcial de dicha determinación y definido los aspectos y el período en que han sido objeto de la verificación, en cuyo caso serán susceptibles de modificación aquellos no considerados expresamente."],"s":"La determinación de oficio será total con respecto al período y tributo de que se trate, debiendo comprender todos los elementos de la obligación tributaria, salvo cuando en la resolución respectiva se hubiera dejado expresa…"},{"n":40,"t":"Determinación sobre Base Cierta y sobre Base Presunta","p":["La determinación sobre base cierta corresponderá cuando el contribuyente o los responsables suministren a la Dirección todos los elementos comprobatorios de las operaciones o situaciones que constituyan hechos imponibles o cuando este Código u otra ley establezca taxativamente los hechos y las circunstancias que la Dirección debe tener en cuenta a los fines de la determinación.","Base Presunta En caso contrario corresponderá la determinación sobre base presunta, que se fundará en los hechos y circunstancias conocidas, que por su vinculación o conexión normal con los que este Código o leyes especiales prevén como hecho imponible, permitan inducir en el caso particular, la existencia y mérito del gravamen. Podrán servir especialmente como indicios: el capital invertido en la explotación, las fluctuaciones patrimoniales, el volumen de las transacciones de otros períodos fiscales, el monto de las compras o ventas efectuadas, la existencia de mercaderías, el movimiento normal del negocio o explotación o el de empresas similares, los gastos generales, los salarios, el alquiler del local y de la casa habitación, los retiros del dueño o socios, la capitalización de un determinado período, el nivel de vida del contribuyente y cualesquiera otros elementos de juicio que obren en poder de la Dirección o que deberán proporcionarle los agentes de retención e información, cámaras de comercio o industria, bancos, asociaciones gremiales, entidades públicas o privadas y los terceros.","Podrá servir como indicio representativo del monto de ventas omitidas, la suma de los depósitos bancarios debidamente depurados, que superen las ventas o ingreso declarados delperíodo.","En los casos de operaciones comprendidas en el artículo 145 inc. b), se presumirá, salvo prueba en contrario, que el sustento territorial está dado por el origen del producto. En las determinaciones de oficio podrán tomarse como presunciones las operaciones registradas en los controles de ruta u otros, habilitados a tal efecto por la Dirección General de Rentas, entes públicos provinciales o nacionales u organismos de regulación específicos de la actividad.","En las estimaciones de oficio podrán aplicarse los promedios, coeficientes y demás índices generales que a tal fin establezca la Dirección con relación a las explotaciones de un mismo género.","A los efectos de este artículo podrán tomarse también como presunciones las siguientes:","a) en el Impuesto de Sellos, cuando los precios de los inmuebles que figuren en las escrituras sean notoriamente inferiores a los vigentes en plaza y ello no sea explicado satisfactoriamente por los interesados por las condiciones de pago, o por las características peculiares de los inmuebles o por otras circunstancias, la Dirección podrá impugnar dichos precios y fijar de oficio otros, sobre la base de la última valuación inmobiliaria incrementada en un veinticinco por ciento (25%) y actualizada a la fecha de la escrituración;","b) en el Impuesto sobre los Ingresos Brutos, representan ingresos gravados omitidos:","1) los que resulten de aplicar el coeficiente obtenido según se indica en el párrafo siguiente, sobre el monto de las diferencias de inventario de bienes de cambio recuento físico comprobado por la Dirección u otros organismos recaudadores oficiales, más el diez por ciento (10%) en concepto de renta dispuesta o consumida. El coeficiente mencionado se obtiene dividiendo el total de las ventas gravadas correspondiente al ejercicio fiscal cerrado inmediato anterior al de verificación de la diferencia de inventario, por el valor de las mercaderías en existencia al final del ejercicio citado precedentemente registradas por el contribuyente o que surjan de la información que se suministra a la Dirección u otros organismos recaudadores oficiales. A los efectos de establecer el valor de las existencias se usará el método de valuación empleado por el contribuyente para la determinación del Impuesto a las Ganancias.","Se presume sin admitir prueba en contrario que la diferencia de base imponible estimada según lo indicado anteriormente corresponde al último ejercicio fiscal cerrado, inmediato anterior al de la verificación de las diferencias de inventario de mercaderías;","2) las diferencias determinadas conforme al siguiente procedimiento: Se controlarán los ingresos durante no menos de diez (10) días continuos o alternados de un mismo mes; el promedio de ingresos de los días controlados, multiplicado por el total de los días hábiles comerciales por mes o los trabajados habitualmente de acuerdo al ramo de que se trate, proporcionará el monto de ingresos presuntos de dicho período.","Cuando se promedien los ingresos de cuatro (4) meses alternados de un ejercicio fiscal en la forma detallada en el párrafo anterior, el promedio resultante podrá aplicarse a cualquiera de los meses no controlados del mismo ejercicio;","3) los incrementos patrimoniales no justificados que surjan de la información suministrada a la Dirección u otros organismos recaudadores oficiales, serán considerados ganancia neta del ejercicio en que se produzcan, y servirán de base para estimar las operaciones gravadas omitidas del respectivo ejercicio, mediante aplicación del porcentaje que resulte de relacionarel total de las operaciones registradas o declaradas con la utilidad neta del período en cuestión, declarada a otros organismos recaudadores oficiales o establecida por la inspección;","4) se presume, salvo prueba en contrario, que el valor locativo de todo inmueble no es inferior al valor locativo de mercado que rige en la zona donde el bien esté ubicado, conforme las pautas que fije la reglamentación."],"s":"La determinación sobre base cierta corresponderá cuando el contribuyente o los responsables suministren a la Dirección todos los elementos comprobatorios de las operaciones o situaciones que constituyan hechos imponibles o…"},{"n":41,"t":"Concursos","p":["En los concursos, serán títulos suficientes para la verificación del crédito fiscal, las liquidaciones de deudas expedidas por funcionariosautorizados al efecto, cuando el contribuyente o responsable no hubiere presentado declaración jurada por uno (1) o más períodos fiscales y la Dirección conozca por declaraciones anteriores o determinaciones de oficio la medida en que presuntivamente le corresponda tributar el gravamen respectivo."],"s":"En los concursos, serán títulos suficientes para la verificación del crédito fiscal, las liquidaciones de deudas expedidas por funcionariosautorizados al efecto, cuando el contribuyente o responsable no hubiere presentado…"},{"n":42,"t":"Determinación sobre Anticipos Anteriores - Vía de Ejecución Fiscal","p":["Podrá la Dirección exigir hasta el vencimiento del plazo general, el ingreso del importe a cuenta del tributo que se deba abonar al término de aquél.","Después de haberse operado el vencimiento del plazo general para la liquidación e ingreso del impuesto, la Dirección no podrá reclamar el pago de los anticipos correspondientes al mismo. No obstante, conservará la acción para exigir el ingreso de los intereses y actualizaciones respectivas, en proporción al gravamen efectivamente adeudado al vencimiento de cada anticipo.","En los casos de contribuyentes o responsables que no presenten declaración jurada para el pago de uno (1) o más anticipos, o de uno (1) o más períodos fiscales, y la Dirección conozca por declaraciones o determinaciones de oficio la medida en que les habría correspondido tributar en períodos anteriores, podrá requerírseles por vía de ejecución fiscal, el pago a cuenta del gravamen que en definitiva le corresponda abonar, de una suma equivalente a tantas veces el total del gravamen ingresado por el último anticipo o período fiscal declarado o liquidado, cuantos sean los anticipos o períodos por los cuales dejaron de presentar declaraciones, con más la actualización e intereses correspondientes.","Previo a proceder a la vía de ejecución fiscal, la Dirección intimará a los contribuyentes o responsables para que dentro de los quince (15) días presenten las declaraciones juradas y abonen el gravamen correspondiente con su actualización e intereses.","Luego de iniciado el juicio de ejecución fiscal, la Dirección, no estará obligada a considerar el reclamo del contribuyente o responsable contra el importe requerido sino por vía de demanda repetición, previo pago de las costas y gastos del juicio y cumplidas las condenas impuestas en un todo de conformidad con el artículo 522 de la Ley XII – N.° 27, Código Procesal Civil, Comercial, de Familia y Violencia Familiar de la Provincia de Misiones."],"s":"Podrá la Dirección exigir hasta el vencimiento del plazo general, el ingreso del importe a cuenta del tributo que se deba abonar al término de aquél."},{"n":43,"t":"Actas","p":["En todos los casos del ejercicio de las facultades de inspección y verificación, los funcionarios que las efectúen deberán extender constancia escrita de los resultados, así como de la existencia o de la individualización de los elementos exhibidos.","Dichas actas deberán ser también firmadas por los contribuyentes, responsables o terceros.","Las mismas constituirán elementos de prueba en todos los procedimientos tributariosadministrativos o judiciales.","En caso de negarse los interesados a participar del procedimiento o a firmar las constancias, las mismas harán fe con la sola firma de los funcionarios actuantes, mientras no se pruebe su falsedad."],"s":"En todos los casos del ejercicio de las facultades de inspección y verificación, los funcionarios que las efectúen deberán extender constancia escrita de los resultados, así como de la existencia o de la individualización de…"},{"n":44,"t":"Determinación – Procedimiento","p":["Antes de dictar la resolución que determine, total o parcialmente, la obligación fiscal, la Dirección correrá vista de las actuaciones por el término de quince (15)días.","Si el interesado no compareciere, las actuaciones proseguirán en rebeldía. Dentro del término otorgado, el contribuyente o responsable, podrá formular su descargo.","En el mismo escrito deberá ofrecer las pruebas que haga a su derecho y presentar la prueba documental que resulte pertinente y admisible. El interesado dispondrá para la producción de la prueba del término que a tal efecto le fije la Dirección y que en ningún caso podrá ser inferior a diez (10) días.","El término de la prueba no podrá ser prorrogado ni suspendido sino por disposición de la Dirección, no admitirán las pruebas inconducentes ni las presentadas fuera de término.","Medidas para mejor proveer La Dirección podrá disponer medidas para mejor proveer, en cualquier estado del trámite, con notificación al interesado. Vencido el término probatorio o cumplidas las medidas para mejor proveer, la Dirección dictará resolución motivada dentro de los sesenta (60) días la que será notificada al interesado, incluyendo, en su caso las razones de rechazo de las pruebas consideradas inconducentes o no sustanciadas."],"s":"Antes de dictar la resolución que determine, total o parcialmente, la obligación fiscal, la Dirección correrá vista de las actuaciones por el término de quince (15)días."},{"n":45,"t":"Resolución determinativa","p":["La resolución determinativa deberá contener la indicación del lugar y fecha en que se practica, el nombre del contribuyente, en su caso el período fiscal a que se refiere, la base imponible, las disposiciones legales aplicadas, los hechos que las sustentan, examen de las pruebas producidas, cuestiones planteadas, su fundamento, el gravamen adeudado y la firma del funcionario competente.","Recursos de Reconsideración Todas las resoluciones que determinen impuestos y accesorios podrán ser modificadas o revocadas por el funcionario que las hubiere dictado, o por el superior jerárquico, siempre que no estuvieran válidamente notificadas.","La resolución dictada como consecuencia de un proceso de determinación de oficio es recurrible ante la misma autoridad que la dictó por la vía de reconsideración según el procedimiento instituido en este Código."],"s":"La resolución determinativa deberá contener la indicación del lugar y fecha en que se practica, el nombre del contribuyente, en su caso el período fiscal a que se refiere, la base imponible, las disposiciones legales…"},{"n":46,"t":"Notificación Resolución Determinativa","p":["La resolución determinativa que rectifique una declaración jurada o, que se efectúe en ausencia de la misma, quedará firme a los quince (15) días de notificada al contribuyente o responsable. Vencido dicho término sólo podrá ser modificada la determinación en los siguientes casos:","a) en contra del contribuyente: cuando surjan nuevos elementos de juicio o se descubra la existencia de error, omisión o dolo en la exhibición o consideración de datos o elementos que sirvieron de base para la determinación anterior;","b) a favor del contribuyente: cuando se probare error de cálculo o error en la consideración de datos o elementos que sirvieron de base para la determinación por parte de la administración.","No será necesario dictar resolución determinativa de tributos cuando el contribuyente o responsable dentro del plazo previsto para contestar la vista del artículo 44 optare por:","1) aceptar los ajustes, imputaciones o cargos formulados por la inspección procediendo a su pago con más sus intereses, sin perjuicio de la continuación del sumario por parte del organismo fiscal, en los casos de la presunta defraudación fiscal;","2) aceptar los ajustes, imputaciones o cargos formulados por la inspección, procediendo a su pago con más sus intereses y el mínimo de la multa por omisión o infracción a los deberes formales que correspondiere, dentro del plazo de quince (15) días de la notificación. En este supuesto el organismo fiscal, previa verificación de la exactitud de los importes, procederá al archivo de todas las actuaciones."],"s":"La resolución determinativa que rectifique una declaración jurada o, que se efectúe en ausencia de la misma, quedará firme a los quince (15) días de notificada al contribuyente o responsable"},{"n":47,"t":"Mora en el Pago","p":["Todo pago efectuado una vez vencidos los plazos fijados por este Código, leyes fiscales o la D
