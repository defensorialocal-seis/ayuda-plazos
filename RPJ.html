un término que no podrá exceder de diez días hábiles siguientes a la recepción.","nt":["Ac. 68/88. Notificaciones por medio de la Justicia de Paz. (Anexo)"]},{"n":134,"l":"134","t":"Libros de los Juzgados de Paz","p":["Además de los libros que señala el art. 53 del Reglamento y de aquellos que fuesen necesarios para el cumplimiento de las funciones que les son encomendadas por leyes específicas en cada Juzgado de Paz deberán llevarse los siguientes:","1) de contravenciones","2) de comisiones encomendadas","3) de arreglos verbales, con indicación del nombre, de las partes, causas motivantes, y soluciones arribadas."],"s":"Además de los libros que señala el art. 53 del Reglamento y de aquellos que fuesen necesarios para el cumplimiento de las funciones que les son encomendadas por leyes específicas en cada Juzgado de Paz deberán llevarse los…","nt":["Ac. 101/83. Art. 10 (Anexo)","Ac. 55/08. Libros de Requerimientos de certificaciones de Firmas y Fotocopias. (Anexo)"]},{"n":135,"l":"135","t":"Cabello – Itaembé Guazú","p":["En caso de licencia, vacancia, recusación, excusación, declinación, inhibición o cualquier otro impedimento del Juez de Paz Titular, el reemplazo se efectuará recíprocamente por los Jueces de Paz Titulares, respetándose la competencia en razón de la materia. Cuando éstos no puedan intervenir, entenderán los de distinta competencia en razón de la materia en forma alternada por orden numérico del Juzgado. Cuando la licencia acordada supere el término de treinta (30) días o en caso de vacancia, la subrogación se efectuará sucesivamente por períodos de hasta quince (15) días por los demás Jueces. No obstante, cuando las necesidades del servicio así lo requieran, la Inspección de Justicia de Paz dispondrá la intervención del Juez de Paz Titular o Suplente más próximo que se encuentre disponible. (Ac.131/04, Art. 8) En los casos de recusación, excusación, impedimento, vacancia o licencia,el Juez de Paz de Posadas del Barrio Villa Cabello y el Juez de Paz de Posadas del Barrio Itaembé Miní se subrogarán entre sí; posteriormente, en materia Civil y Comercial, por los Jueces de Paz en lo Civil y Comercial Nº 1 y Nº 2 de Posadas y por el Juzgado de Paz en lo Contravencional de esta ciudad en tal materia; de acuerdo a lo establecido por este artículo. (Ac. 159/15, pto. Quinto; Ac. 62/19, pto. Quinto) En los casos de recusación, excusación, impedimento, vacancia o licencia, los Jueces de Paz de Garupá y Barrio Fátima se subrogarán entre sí; seguidamente –en materia contravencional- por el Juez de Paz en lo Contravencional; en las demás materias de competencia, por los Jueces de Paz en lo Civil y Comercial Nº 1 y Nº 2 de Posadas, de acuerdo a las disposiciones del presente artículo. (Ac. 236/15, pto. Sexto) En los casos de recusación, excusación, impedimento, vacancia o licencia, el Juez de Paz de Itaembé Guazú será subrogado en materia Contravencional- por el Juez de Paz en lo Contravencional de la ciudad de Posadas; en las demás materias de competencia, en primer lugar, por el Juez de Paz de Itaembé Miní, luego por el Juez de Paz del barrio Villa Cabello y finalmente, por los Jueces de Paz en lo Civil y Comercial N° 1 y N° 2 de Posadas de acuerdo a lo establecido por el art. 135 del R.P.J. (Ac. 208/23, Pto. Quinto)"],"s":"En caso de licencia, vacancia, recusación, excusación, declinación, inhibición o cualquier otro impedimento del Juez de Paz Titular, el reemplazo se efectuará recíprocamente por los Jueces de Paz Titulares, respetándose la…","nt":["Ac.131/04. Anexo"]},{"n":136,"l":"136","t":"Cesación del motivo de subrogación de los Jueces de Paz del interior","p":["En los casos previstos por el art. 93 de la Ley IV-Nº 15 y por la Acordada 101/83*, si desapareciere el motivo de la subrogación del Juez de Paz, titular o suplente, la causa, a pedido del actor o de la mayoría de los mismos si son varios, deberá volver al Juzgado de Paz de origen. En caso de haberse producido reconvención se requerirá para ello el acuerdo de partes; si las partes fueran más de dos se requerirá la conformidad de la mayoría."],"s":"En los casos previstos por el art. 93 de la Ley IV-Nº 15 y por la Acordada 101/83*, si desapareciere el motivo de la subrogación del Juez de Paz, titular o suplente, la causa, a pedido del actor o de la mayoría de los mismos…","nt":["Ac. 101/83. Art. 9 (Anexo)","Ac. 213/22. Creación Juzgado de Paz N.º 2 de Oberá. Subrogación (pto. Sexto) Anexo","Ac. 42/23. Creación Juzgado de Paz N.º 2 de Puerto Rico. Subrogación (pto. Sexto) Anexo"]},{"n":137,"l":"137","t":"Turnos","p":["a) Para el sorteo remoto de causas con competencia en la Justicia de Paz de Posadas, el sistema permitirá seleccionar el Juzgado que por competencia territorial corresponda, a saber: Itaembé Miní, Garupá, Fátima, Villa Cabello y Juzgados de Paz en lo Civil y Comercial N° 1 y N° 2. Para estos últimos, se implementa la distribución de causas por sorteo en plataforma, dejando sin efecto el turno de trescientos (300) expedientes por Juzgado dispuesto en el art. 7 de la Acordada 181/83 -Modif. por"],"s":"a) Para el sorteo remoto de causas con competencia en la Justicia de Paz de Posadas, el sistema permitirá seleccionar el Juzgado que por competencia territorial corresponda, a saber: Itaembé Miní, Garupá, Fátima, Villa Cabello…","nt":["Ac. 131/04.","Ac. 131/04. Anexo","Ac. 213/22. Creación Juzgado de Paz N.º 2 de Oberá. Anexo","Ac. 42/23. Creación Juzgado de Paz N.º 2 de Puerto Rico. Anexo","Ac. 23/25. SIGED JUSTICIA DE PAZ – Sorteo vía MEUI de Causas Civiles, Comerciales y de Familia"]},{"n":138,"l":"138","t":"Armas decomisadas","p":["Las armas de toda índole que fuesen decomisadas por los Jueces de Paz por contravención al Código de Faltas, serán remitidas al Registro Provincial de Armas a los fines previstos en el art. 119 del presente Reglamento."],"s":"Las armas de toda índole que fuesen decomisadas por los Jueces de Paz por contravención al Código de Faltas, serán remitidas al Registro Provincial de Armas a los fines previstos en el art. 119 del presente Reglamento.","nt":["Ac. 17/73. Armas depositadas en sede judicial (Anexo)","Ac. 10/75. Modificación Ac. 17/73 (Anexo)","Ac. 49/79. Informes sobre Armas (Anexo)","Ac. 16/20: Art. 53 inc. 8 Libro de Registro de Armas"]},{"n":139,"l":"139","t":"El Jefe de la Inspección de Justicia de Paz,…","p":["El Jefe de la Inspección de Justicia de Paz, controlará el funcionamiento de los Juzgados de Paz, a cuyo efecto deberá realizar inspecciones por lo menos dos veces al año en cada Juzgado previa autorización del Presidente del Superior Tribunal de Justicia.","Al practicar cada inspección, se labrará acta del resultado de la misma en un libro especial que al efecto llevará cada Juzgado. De la misma el Juez deberá remitir copia fiel, debidamente certificada, a la Secretaría Administrativa y de Superintendencia, para que, previo conocimiento del Superior Tribunal de Justicia, se archive en un bibliorato especial; todo ello sin perjuicio del informe que deberá elevar el Jefe de la Inspección."],"s":"El Jefe de la Inspección de Justicia de Paz, controlará el funcionamiento de los Juzgados de Paz, a cuyo efecto deberá realizar inspecciones por lo menos dos veces al año en cada Juzgado previa autorización del Presidente del…","nt":["Ac. 102/82. Inspección de Justicia de Paz. Reglamentación (Anexo)","Ac. 42/11. Cuerpo de Inspectores. Inspección de órdenes de pago de los Juzgados de Paz. (Anexo)"]},{"n":140,"l":"140","t":"Reuniones periódicas","p":["Asimismo reunirá a los Jueces de Paz titulares de cada Circunscripción Judicial, en la ciudad asiento de los Juzgados de Primera Instancia, a los fines establecidos en el art. 193 inc. 3) de la Ley IV-Nº 15, debiendo elevar a la Secretaría Administrativa y de Superintendencia, un informe de las reuniones realizadas."],"s":"Asimismo reunirá a los Jueces de Paz titulares de cada Circunscripción Judicial, en la ciudad asiento de los Juzgados de Primera Instancia, a los fines establecidos en el art. 193 inc. 3) de la Ley IV-Nº 15, debiendo elevar a…","nt":["Ac. 102/82. art. 4º, inc. b) (Anexo)"]},{"n":141,"l":"141","t":"Licencias, justificaciones de inasistencias y autorizaciones para ausentarse","p":["Conocerá de los pedidos de licencias de hasta cinco días, justificaciones de inasistencias y de las autorizaciones para ausentarse de sus respectivas jurisdicciones que le fuesen formuladas por los Jueces de Paz."],"s":"Conocerá de los pedidos de licencias de hasta cinco días, justificaciones de inasistencias y de las autorizaciones para ausentarse de sus respectivas jurisdicciones que le fuesen formuladas por los Jueces de Paz.","nt":[]},{"n":142,"l":"142","t":"Sumarios Administrativos","p":["Instruirá los sumarios administrativos que ordene el Superior Tribunal o los que aconseje por anormalidades que observare en las inspecciones realizadas."],"s":"Instruirá los sumarios administrativos que ordene el Superior Tribunal o los que aconseje por anormalidades que observare en las inspecciones realizadas.","nt":[]},{"n":143,"l":"143","t":"Asesoramiento","p":["Deberá asesorar a los Jueces de Paz sobre la organización administrativa de los Juzgados en ocasión de realizar las inspecciones y toda vez que mediare consulta de los mismos."],"s":"Deberá asesorar a los Jueces de Paz sobre la organización administrativa de los Juzgados en ocasión de realizar las inspecciones y toda vez que mediare consulta de los mismos.","nt":[]},{"n":144,"l":"144","t":"Iniciativas - Informe anual","p":["Proyectará y elevará a consideración del Superior Tribunal cuanta medida o providencia tienda al mejoramiento de la marcha de la Justicia de Paz.","Elevará en la oportunidad señalada por el art. 46 del presente Reglamento, un informe escrito al Superior Tribunal, con referencias a las observaciones, conclusiones y necesidades que deriven de las periódicas inspecciones de los Juzgados de Paz."],"s":"Proyectará y elevará a consideración del Superior Tribunal cuanta medida o providencia tienda al mejoramiento de la marcha de la Justicia de Paz.","nt":[]},{"n":145,"l":"145","t":"Sustitución","p":["En los casos de ausencia, vacancia u otros impedimentos, del Jefe de la Inspección de Justicia de Paz, asumirá automáticamente la dirección de la misma el Secretario Administrativo de Superintendencia que corresponda sin perjuicio de las funciones que le competen al Subjefe de la dependencia."],"s":"En los casos de ausencia, vacancia u otros impedimentos, del Jefe de la Inspección de Justicia de Paz, asumirá automáticamente la dirección de la misma el Secretario Administrativo de Superintendencia que corresponda sin…","nt":[]},{"n":146,"l":"146","t":"Jefe - Deberes y atribuciones","p":["Serán atribuciones del Jefe:","a) Ejercer la vigilancia y contralor del funcionamiento de las distintas dependencias del Archivo General, impartiendo las órdenes y observaciones que fueran conducentes al mejor funcionamiento de las mismas.","b) Asentar notas marginales, otorgar testimonios y copias, informes y certificados autenticándolos con su firma y sello de todos los documentos que obraran bajo su custodia y guarda, a requerimiento judicial o de parte legítimamente interesada. Sin embargo, cuando se tratare de escrituras públicas y en ellas hubiere alguna obligación pendiente de cumplimiento deberá proceder de acuerdo a los artículos 1007/8 del Código Civil. También estos documentos podrán ser examinados en la Oficina por quienes acrediten un interés valedero, a criterio del Jefe.","c) Presentar informe al Superior Tribunal de toda irregularidad que notare en documentos y expedientes judiciales, protocolos de Escribanos y Jueces de Paz y de cuanto otro hecho o situación anormal ocurriere.","d) Presentar al Superior Tribunal un informe estadístico en la oportunidad señalada por el art. 46 del presente Reglamento.","e) Aplicar sanciones disciplinarias al personal a su cargo en los casos y de acuerdo con las condiciones que establece el presente Reglamento dando cuenta inmediata al Superior Tribunal.","f) Asignar a los empleados de las dependencias las tareas que éstos deben desempeñar de acuerdo a las necesidades del servicio."],"s":"Serán atribuciones del Jefe: a) Ejercer la vigilancia y contralor del funcionamiento de las distintas dependencias del Archivo General, impartiendo las órdenes y observaciones que fueran conducentes al mejor funcionamiento de…","nt":["Ac. 112/82 “Reglamento Orgánico del Archivo General de Tribunales”, actualizada por Ac. 74/00, Ac. 30/13, Ac. 174/22 y"]},{"n":147,"l":"147","t":"Secciones","p":["El Archivo se organizará en cinco secciones:","a) Protocolos","b) Expedientes terminados y paralizados.","c) Libros de Resoluciones.","d) Incineración de Expedientes.","e) Mesa de Entradas y Salidas.","Sección Protocolos: Habrá un agente encargado de dicha sección que tendrá como tarea específica la determinada por el art. 152 del Reglamento para el Poder Judicial y la extracción de testimonios y copias de los protocolos notariales.","Sección Expedientes Terminados y Paralizados: Los empleados de esta sección tendrán como tareas propias las determinadas por el art. 153 del Reglamento.","Incineración de Expedientes: Compete a esta sección confeccionar anualmente las planillas de incineración de expedientes conforme la clasificación efectuada por el Jefe del Archivo y el asiento de las causas a incinerar en el Libro de Incineraciones.","Mesa de Entradas: Se formará con un Encargado y los auxiliares que permite el presupuesto.","Funcionará con una subdivisión a saber:","Sección de Libros de Resoluciones: Compete a esta subdivisión dar entrada en un libro especial a los libros que se remitan y por orden cronológico, para luego archivarlos por Secretaría y Juzgados.","Funciones del Encargado de Mesa de Entradas:","a) Dar entrada y salida a todo documento oficio y expedientes que tengan trámite en el Archivo.","b) Recepcionar la correspondencia y los boletines oficiales y judiciales de la Nación y de la Provincia ordenándolos por fecha y año.","c) Recibir los pedidos de búsquedas de expedientes y efectuar la tramitación a respecto.","d) Redactar las notas que remita el Archivo.","Auxiliares de Mesa de Entradas: Registrar en un libro especial y por orden cronológico a todos los expedientes que ingresen al Archivo.","En cada una de las secciones se formarán los índices especiales con las indicaciones establecidas en el art. 173 de la Ley IV-N° 15, sin perjuicio del índice general señalado en la misma disposición legal."],"s":"El Archivo se organizará en cinco secciones: a) Protocolos","nt":[]},{"n":148,"l":"148","t":"Libros","p":["En el Archivo se llevarán los libros que señala la Ley IV-Nº 15, sin perjuicio de otros que aconseje la buena marcha del organismo."],"s":"En el Archivo se llevarán los libros que señala la Ley IV-Nº 15, sin perjuicio de otros que aconseje la buena marcha del organismo.","nt":[]},{"n":149,"l":"149","t":"Expedición de Testimonios","p":["Los testimonios, copias, certificados, etc., que el Jefe expidiera, serán entregados a los interesados previa reposición de la tasa que establezca el Código Fiscal; cuando sea un Juez quien lo solicite al pie del instrumento se pondrá la suma a reponerse, y ella se mandará abonar en el respectivo expediente.-"],"s":"Los testimonios, copias, certificados, etc., que el Jefe expidiera, serán entregados a los interesados previa reposición de la tasa que establezca el Código Fiscal; cuando sea un Juez quien lo solicite al pie del instrumento…","nt":[]},{"n":150,"l":"150","t":"Recurso","p":["De las resoluciones que dictare el Jefe los interesados podrán recurrir en apelación para ante el Superior Tribunal, dentro del tercer día, debiendo fundarse el recurso al ser interpuesto. El Tribunal resolverá sin otra substanciación, sin perjuicio de las acciones que pudieren corresponder a aquéllos en sede contencioso-administrativo. Si el recurso no fuere fundado se lo desestimará sin más trámite.-"],"s":"De las resoluciones que dictare el Jefe los interesados podrán recurrir en apelación para ante el Superior Tribunal, dentro del tercer día, debiendo fundarse el recurso al ser interpuesto","nt":[]},{"n":151,"l":"151","t":"Remisión de Protocolos, Expedientes y Libros","p":["En los dos primeros meses de cada año, los Escribanos de Registro y los Tribunales y Juzgados remitirán al Archivo General los protocolos y expedientes para su guarda y conservación.","Los protocolos de Escribanos de Registro estarán encuadernados, foliados correlativamente con un índice alfabético por otorgante y aceptante que expresará además, número de escritura naturaleza del acto, folio y fecha.","Toda documentación que estuviese glosada en los protocolos que los Escribanos de Registro deban remitir al Archivo General de los Tribunales debe hallarse individualizada por orden alfabético o numérico correlativo, independiente de la foliatura del protocolo, indicándose además en el índice del protocolo cuántos de tales documentos corren agregados a la correspondiente escritura.","Los expedientes judiciales vendrán acompañados de las planillas a que se refiere el art. 170 de la Ley IV-Nº 15. Los expedientes agregados por cuerda floja se consignarán individualmente.","Los libros de resoluciones que se remitieran al Archivo General para su guarda y conservación deberán contar con su correspondiente índice, con nota final que exprese número de folios y resoluciones, firmado por el Secretario o Jefe de la dependencia."],"s":"En los dos primeros meses de cada año, los Escribanos de Registro y los Tribunales y Juzgados remitirán al Archivo General los protocolos y expedientes para su guarda y conservación.","nt":[]},{"n":152,"l":"152","t":"Protocolos","p":["Los protocolos de Escribanos se archivarán por orden alfabético con respecto al patronímico del titular del Registro, y los correspondientes a un mismo Escribano por orden cronológico."],"s":"Los protocolos de Escribanos se archivarán por orden alfabético con respecto al patronímico del titular del Registro, y los correspondientes a un mismo Escribano por orden cronológico.","nt":[]},{"n":153,"l":"153","t":"Expedientes Judiciales - Orden de Archivo","p":["Los expedientes judiciales se archivarán agrupándolos en legajos que estarán numerados y ordenados correlativamente. A cada expediente se le confeccionarán tantas fichas como partes hubiere si fueran del fuero Civil, Comercial y Laboral; o procesados si fueran del Criminal o Correccional.","Estas se archivarán por orden alfabético, teniendo en cuenta el apellido y nombre de las partes o procesados; cuando éstos coincidan, por el año y número de expediente. Cada fuero o instancia tendrá un color de ficha distinta. Los libros de resoluciones se archivarán por Juzgados, Secretarías o dependencias y siguiendo un orden cronológico."],"s":"Los expedientes judiciales se archivarán agrupándolos en legajos que estarán numerados y ordenados correlativamente","nt":[]},{"n":154,"l":"154","t":"Constancias","p":["De los testimonios, certificados, informes etc., que se expidiesen se dejará constancia mediante nota marginal en los protocolos, o al dorso de la o las fichas, tratándose de expedientes; dicha constancia contendrá; nombre del solicitante, fecha y objeto del pedido."],"s":"De los testimonios, certificados, informes etc., que se expidiesen se dejará constancia mediante nota marginal en los protocolos, o al dorso de la o las fichas, tratándose de expedientes; dicha constancia contendrá; nombre del…","nt":[]},{"n":155,"l":"155","t":"Prohibiciones","p":["En ningún caso se podrá hacer anotaciones, doblar o extraer hojas o documentos, hacer marcas o cualquier otra señal en expedientes, protocolos, libros de resoluciones, etc.","Las sustracciones o daños que el personal notare serán comunicadas de inmediato al Jefe quien tomará las medidas que juzgue oportunas y comunicará la novedad al Superior Tribunal."],"s":"En ningún caso se podrá hacer anotaciones, doblar o extraer hojas o documentos, hacer marcas o cualquier otra señal en expedientes, protocolos, libros de resoluciones, etc.","nt":[]},{"n":156,"l":"156","t":"Incineración de Expedientes","p":["Para la incineración de expedientes se observarán las disposiciones de las Acordadas del Superior Tribunal N° 38/73, 37/75, 112/82, 74/00 y 30/13."],"s":"Para la incineración de expedientes se observarán las disposiciones de las Acordadas del Superior Tribunal N° 38/73, 37/75, 112/82, 74/00 y 30/13.","nt":["Ac. 112/82 “Reglamento Orgánico del Archivo General de Tribunales”, sus modificatorias Ac. 74/00 y 30/13, y las Ac. 38/73"]},{"n":157,"l":"157","t":"Revisión de Expedientes en el Archivo","p":["Los Abogados, Escribanos, Procuradores, las partes y sus apoderados, los representantes de la Nación, de las Provincias, de las Municipalidades y de reparticiones autárquicas y demás personas que justifiquen debidamente intereses legítimos, podrán interiorizarse de los expedientes, escrituras y demás documentación existente en el Archivo. La petición deberá ser efectuada por escrito ante el Jefe, quien dejará constancia de la documentación acreditante que se acompañe, la que será devuelta al interesado. Son de aplicación a éste efecto las disposiciones de los artículos 16 y 17 del presente Reglamento."],"s":"Los Abogados, Escribanos, Procuradores, las partes y sus apoderados, los representantes de la Nación, de las Provincias, de las Municipalidades y de reparticiones autárquicas y demás personas que justifiquen debidamente…","nt":[]},{"n":158,"l":"158","t":"Sustitución","p":["En los casos de ausencia, vacancia u otro impedimento el Jefe del Archivo General de los Tribunales será reemplazado, por su orden por el secretario del Registro Público de Comercio, y por el Jefe de Inspección de Justicia de Paz."],"s":"En los casos de ausencia, vacancia u otro impedimento el Jefe del Archivo General de los Tribunales será reemplazado, por su orden por el secretario del Registro Público de Comercio, y por el Jefe de Inspección de Justicia de Paz.","nt":[]},{"n":159,"l":"159","t":"En cada circunscripción judicial, funcionará un Registro, cuyos respectivos…","p":["En cada circunscripción judicial, funcionará un Registro, cuyos respectivos asientos son: En Posadas, el Juzgado Civil y Comercial N° 2 y en Oberá y Eldorado, el Juzgado del mencionado fuero.","Estará a cargo del Secretario más antiguo de dicho Juzgado, y en caso de igual antigüedad por el de mayor edad, quien será subrogado por el otro Secretario del mismo Juzgado. Subsidiariamente, en la Primera Circunscripción por los demás Secretarios de los Juzgados N° 3, 4, 5, 6, 7, 8 y 1, en dicho orden; y en la Segunda y Tercera Circunscripción, por los Secretarios del fuero Laboral y luego por los del fuero Penal, comenzando siempre por el de mayor antigüedad."],"s":"En cada circunscripción judicial, funcionará un Registro, cuyos respectivos asientos son: En Posadas, el Juzgado Civil y Comercial N° 2 y en Oberá y Eldorado, el Juzgado del mencionado fuero.","nt":[]},{"n":160,"l":"160","t":"Disposiciones aplicables. Libros","p":["El Registro Público de Mandatos, Actos y Contratos, ajustará su funcionamiento a las disposiciones del Capítulo III del Título XII de la Ley IV-N° 15.","Los actos serán transcriptos íntegramente en el Registro, a cuyo efecto los interesados deberán acompañar juntamente con el original una copia escrita a máquina en papel de 25 líneas con las que se formarán los libros a que se refiere el art. 195 de la ley mencionada."],"s":"El Registro Público de Mandatos, Actos y Contratos, ajustará su funcionamiento a las disposiciones del Capítulo III del Título XII de la Ley IV-N° 15.","nt":["Ac. 4/83: Reglamento del Registro de Mandatos, Actos, Contratos y Juicios Universales de Naturaleza Civil (Anexo)"]},{"n":161,"l":"161","t":"Art. 8 de este RPJ: Normas para la presentación de Escritos Normas Supletorias","p":["Se aplicarán supletoriamente las normas pertinentes del Registro Público de Comercio debiendo tenerse presente al efecto la naturaleza jurídica de los actos y contratos a registrar."],"s":"Se aplicarán supletoriamente las normas pertinentes del Registro Público de Comercio debiendo tenerse presente al efecto la naturaleza jurídica de los actos y contratos a registrar.","nt":[]},{"n":162,"l":"162","t":"Recurso","p":["Las observaciones que pueda formular el Secretario encargado del Registro se tomarán en forma de providencia, las que podrán ser recurribles ante el mismo funcionario por revocatoria y apelables en relación y con efecto devolutivo ante el Juez titular del Juzgado de Primera Instancia donde funcione el Registro, en los términos y en la forma prevista por el Código Procesal Civil."],"s":"Las observaciones que pueda formular el Secretario encargado del Registro se tomarán en forma de providencia, las que podrán ser recurribles ante el mismo funcionario por revocatoria y apelables en relación y con efecto…","nt":[]},{"n":163,"l":"163","t":"Registro de Juicios Universales de Naturaleza Civil","p":["El Registro de los juicios universales a que se refiere el art. 193 de la Ley IV-Nº 15 se llevará en la forma establecida en la Acordada del Superior Tribunal N° 4/83*.","El Registro informará trimestralmente a la Dirección General de Estadística y Censos de la Provincia, el número de Concursos Civiles, indicando nombre o razón social, domicilio, rama o actividad, deuda, activo y pasivo."],"s":"El Registro de los juicios universales a que se refiere el art. 193 de la Ley IV-Nº 15 se llevará en la forma establecida en la Acordada del Superior Tribunal N° 4/83*.","nt":["Ac. 4/83. Reglamento del Registro de Mandatos, Actos, Contratos y Juicios Universales de Naturaleza Civil (Anexo)"]},{"n":164,"l":"164","t":"Registro Público de Comercio","p":["En cada Circunscripción Judicial funcionará un Registro que tendrá su asiento en el Juzgado Civil y Comercial N° 1 de la Circunscripción respectiva. Estará a cargo del Juez titular del Juzgado y en la Primera Circunscripción actuará un Secretario designado al efecto, quien será subrogado por los Secretarios del mismo Juzgado, comenzando por el que no estuviese en turno administrativo, y luego por los Secretarios subrogantes de aquéllos.","En las demás circunscripciones judiciales actuará el Secretario designado en la forma prevista por el art. 159 del presente Reglamento."],"s":"En cada Circunscripción Judicial funcionará un Registro que tendrá su asiento en el Juzgado Civil y Comercial N° 1 de la Circunscripción respectiva","nt":[]},{"n":165,"l":"165","t":"Disposiciones aplicables","p":["El Registro Público de Comercio ajustará su funcionamiento a las disposiciones del Capítulo II del Título XII de la Ley IV-Nº 15 y a las de la Acordada del Superior Tribunal de Justicia 100/83 y 205/87 (Derogadas por Ac. 6/16)."],"s":"El Registro Público de Comercio ajustará su funcionamiento a las disposiciones del Capítulo II del Título XII de la Ley IV-Nº 15 y a las de la Acordada del Superior Tribunal de Justicia 100/83 y 205/87 (Derogadas por Ac. 6/16).","nt":["Ac. 6/16. Reglamenta el Registro Público (Ex Reg. de Comercio, Martilleros y Corredores). Deroga la Ac. 100/83 (Anexo)"]},{"n":166,"l":"166","t":"Registro de Juicios Universales de Naturaleza Comercial","p":["El Registro de los juicios universales a que se refiere el art. 189 de la Ley IV-Nº 15 se llevará en la forma establecida en las Acordadas del Superior Tribunal N° 100/83 y 205/87 (Derogadas por Ac. 6/16).","El Registro informará trimestralmente a la Dirección General de Estadística y Censos de la Provincia, el número de quiebras y convocatorias indicando nombre o razón social, domicilio rama o actividad, deuda, activo y pasivo."],"s":"El Registro de los juicios universales a que se refiere el art. 189 de la Ley IV-Nº 15 se llevará en la forma establecida en las Acordadas del Superior Tribunal N° 100/83 y 205/87 (Derogadas por Ac. 6/16).","nt":["Ac. 6/16. Reglamenta el Registro Público (Ex Reg. de Comercio, Martilleros y Corredores). Deroga la Ac. 100/83 (Anexo)"]},{"n":167,"l":"167","t":"El Superior Tribunal de Justicia tendrá a su cargo…","p":["El Superior Tribunal de Justicia tendrá a su cargo la dirección superior y contralor de las actividades bibliotecarias y la superintendencia de la publicación oficial prevista en el art. 205 de la Ley IV-Nº 15."],"s":"El Superior Tribunal de Justicia tendrá a su cargo la dirección superior y contralor de las actividades bibliotecarias y la superintendencia de la publicación oficial prevista en el art. 205 de la Ley IV-Nº 15.","nt":[]},{"n":168,"l":"168","t":"Director","p":["La Biblioteca estará bajo el contralor inmediato de un Director quien tendrá a su cargo la atención del caudal bibliográfico y la ordenación correspondiente, según el sistema adoptado para dicho trabajo en este capítulo.","También estará obligado a hacer cumplir las disposiciones de este Reglamento e informar al Superior Tribunal de toda irregularidad que notare en la utilización del material bibliográfico.","Además de estas funciones, el Director tendrá a su cargo las encomendadas en el art. 204 de la Ley IV-Nº 15."],"s":"La Biblioteca estará bajo el contralor inmediato de un Director quien tendrá a su cargo la atención del caudal bibliográfico y la ordenación correspondiente, según el sistema adoptado para dicho trabajo en este capítulo.","nt":[]},{"n":169,"l":"169","t":"Deberes y obligaciones del personal","p":["Son tareas específicas del Director, Subdirector y del personal de la biblioteca:","a) Conservar en debido estado toda la existencia bibliográfica, muebles, útiles y documentación.","b) Atender al público lector, facilitándole las consultas, los préstamos de las obras.","c) Llevar las anotaciones correspondientes en los formularios de consultas y préstamos de las obras.","d) Requerir la devolución de las obras facilitadas en préstamos al día siguiente del vencimiento, dando cuenta del incumplimiento al Presidente del Superior Tribunal de Justicia.","e) Elevar anualmente al Superior Tribunal una estadística del número de lectores, obras consultadas, obras facilitadas en préstamos y obras recibidas en canje.","f) Promover la adquisición de muebles, útiles y libros indispensables.","g) Vigilar el cuidado diario del ordenamiento del material bibliográfico utilizado y disponer del arreglo o encuadernación de impresos deteriorados.","h) Cumplir y hacer cumplir las disposiciones de este Reglamento, dando cuenta de sus violaciones al Superior Tribunal."],"s":"Son tareas específicas del Director, Subdirector y del personal de la biblioteca: a) Conservar en debido estado toda la existencia bibliográfica, muebles, útiles y documentación.","nt":[]},{"n":170,"l":"170","t":"Libros","p":["Para el contralor y mejor utilización del caudal bibliográfico se llevará:","a) Libro Inventario de toda obra y material impreso.","b) Catálogo alfabético por autores por sistema de fichas.","c) Catálogo metódico, sistemático o clasificado mediante el mismo sistema.","d) Catálogo por título, mediante el mismo sistema.","e) Catálogo por materias, mediante el mismo sistema.","f) Catálogo topográfico.","g) Fichero del lector, para el préstamo de las obras.","h) Archivo de correspondencia.","En el libro inventario se consignará, por orden de fecha de adquisición, todos los libros y publicaciones que ingresen como valor propio de la Biblioteca, con indicación; número de orden; fecha de entrada, título de obra, encuadernación, edición, editorial, precio unitario y total, baja y fecha de la misma. Además toda publicación impresa del servicio bibliotecario."],"s":"Para el contralor y mejor utilización del caudal bibliográfico se llevará: a) Libro Inventario de toda obra y material impreso.","nt":[]},{"n":171,"l":"171","t":"Régimen de préstamo y contralor - Prioridad","p":["Los Magistrados y Funcionarios del Poder Judicial utilizarán los libros y publicaciones con prioridad a todo otro préstamo. El préstamo en hora de despacho tiene prioridad sobre el préstamo domiciliario. Debe controlarse este préstamo diariamente anotando las novedades correspondientes."],"s":"Los Magistrados y Funcionarios del Poder Judicial utilizarán los libros y publicaciones con prioridad a todo otro préstamo","nt":[]},{"n":172,"l":"172","t":"Término","p":["Los Magistrados y Funcionarios podrán tener en su despacho la obra prestada, no más de cinco días."],"s":"Los Magistrados y Funcionarios podrán tener en su despacho la obra prestada, no más de cinco días.","nt":[]},{"n":173,"l":"173","t":"Renovación de préstamos","p":["Las renovaciones de las obras prestadas se harán de acuerdo a la presentación del libro ante el bibliotecario. Siempre que no hubiera un pedido con preferencia anterior a la solicitud de renovación.-"],"s":"Las renovaciones de las obras prestadas se harán de acuerdo a la presentación del libro ante el bibliotecario","nt":[]},{"n":174,"l":"174","t":"Préstamo a domicilio","p":["El préstamo domiciliario a Magistrados y Funcionarios se hará con cargo de devolución a los tres días, salvo las obras muy consultadas, las que podrán ser solicitadas por el bibliotecario al prestatario antes del vencimiento de dicho término."],"s":"El préstamo domiciliario a Magistrados y Funcionarios se hará con cargo de devolución a los tres días, salvo las obras muy consultadas, las que podrán ser solicitadas por el bibliotecario al prestatario antes del vencimiento…","nt":[]},{"n":175,"l":"175","t":"Sistema de Préstamo","p":["Para el préstamo de las obras se confeccionará una ficha con el nombre del lector, título de la obra, fecha de entrega y firma del que lo retira. Esta ficha será entregada a la devolución de la obra."],"s":"Para el préstamo de las obras se confeccionará una ficha con el nombre del lector, título de la obra, fecha de entrega y firma del que lo retira","nt":[]},{"n":176,"l":"176","t":"Préstamo a empleados judiciales","p":["El préstamo a empleados del Poder Judicial se hará en casos excepcionales y con cargo de devolución a los tres días."],"s":"El préstamo a empleados del Poder Judicial se hará en casos excepcionales y con cargo de devolución a los tres días.","nt":[]},{"n":177,"l":"177","t":"Préstamo a Funcionarios no judiciales","p":["En casos excepcionales y con autorización del Presidente del Superior Tribunal de Justicia podrá prestarse el material bibliográfico, por los términos señalados, a funcionarios profesionales o entidades oficiales."],"s":"En casos excepcionales y con autorización del Presidente del Superior Tribunal de Justicia podrá prestarse el material bibliográfico, por los términos señalados, a funcionarios profesionales o entidades oficiales.","nt":[]},{"n":178,"l":"178","t":"Prohibición","p":["No podrá ser objeto de préstamo a los mencionados en el artículo anterior las colecciones, enciclopedias, diccionarios, repertorios de jurisprudencias y libros de ediciones agotadas.","El Director o Subdirector, en su caso, podrán en casos especiales, solicitar la devolución de las publicaciones a las personas o entidades mencionadas en el art. 177, ante del vencimiento del término, como así también cuando éste se hallare excedido un tiempo prudencial y en ese caso se dará un plazo de veinticuatro horas."],"s":"No podrá ser objeto de préstamo a los mencionados en el artículo anterior las colecciones, enciclopedias, diccionarios, repertorios de jurisprudencias y libros de ediciones agotadas.","nt":[]},{"n":179,"l":"179","t":"Marcas - Deterioros","p":["Está prohibido marcar, escribir, o extraer páginas de las obras de la Biblioteca. En estos casos se cobrará el costo de la reparación o reposición de la obra al responsable.","De todo deterioro, uso indebido, pérdida del material bibliográfico, se hará responsable al prestatario."],"s":"Está prohibido marcar, escribir, o extraer páginas de las obras de la Biblioteca","nt":[]},{"n":180,"l":"180","t":"Firma del libro de préstamo","p":["Los lectores que necesiten retirar una obra, no lo harán sin antes firmar la ficha respectiva.","En ningún caso se prestarán las obras que no estén inventariadas o en proceso de catalogación."],"s":"Los lectores que necesiten retirar una obra, no lo harán sin antes firmar la ficha respectiva.","nt":[]},{"n":181,"l":"181","t":"Consultas de obras","p":["Las obras que se encontraren en los estantes abiertos podrán ser consultadas directamente.","El Subdirector y el personal ejercerán el contralor de esta consulta y de la debida ubicación del material, una vez hecha la misma.","Oportunamente se llevará un registro de consultas, donde se anotarán los datos pertinentes para el informe anual."],"s":"Las obras que se encontraren en los estantes abiertos podrán ser consultadas directamente.","nt":[]},{"n":182,"l":"182","t":"Horario","p":["La Biblioteca es pública durante el horario judicial. Fíjase el horario de 13,00 a 19,00 horas para el funcionamiento en turno vespertino, determinándose como horario de atención al público de 13,30 a 18,30 hs."],"s":"La Biblioteca es pública durante el horario judicial","nt":["Ac. 199/21. Establece el horario vespertino de la Biblioteca a partir del 13/12/21."]},{"n":183,"l":"183","t":"Manifestaciones molestas","p":["Los lectores de la Biblioteca se abstendrán de toda manifestación molesta a los demás debiendo el personal controlar la vigencia de esta prohibición."],"s":"Los lectores de la Biblioteca se abstendrán de toda manifestación molesta a los demás debiendo el personal controlar la vigencia de esta prohibición.","nt":[]},{"n":184,"l":"184","t":"Pedido de libros","p":["Los Magistrados y Funcionarios que requieren la adquisición de libros y revistas de interés para la Biblioteca, efectuarán su pedido en Formulario de Selección de Libros. Los pedidos serán conformados por el Superior Tribunal de Justicia previamente a toda diligencia para su adquisición.","Se gestionará la obtención gratuita de publicaciones oficiales, revistas, folletos y diarios.","El Director informará periódicamente al Superior de las publicaciones recibidas."],"s":"Los Magistrados y Funcionarios que requieren la adquisición de libros y revistas de interés para la Biblioteca, efectuarán su pedido en Formulario de Selección de Libros","nt":[]},{"n":185,"l":"185","t":"Sustitución","p":["En los casos de ausencia, vacancia, o impedimento, el Director será sustituido por el Subdirector."],"s":"En los casos de ausencia, vacancia, o impedimento, el Director será sustituido por el Subdirector.","nt":[]},{"n":186,"l":"186","t":"En cada Circunscripción Judicial habrá una Oficina de Mandamientos…","p":["En cada Circunscripción Judicial habrá una Oficina de Mandamientos y Notificaciones que tendrá a su cargo la tramitación de los mandamientos y notificaciones que el Superior Tribunal, las Cámaras de Apelaciones, los Tribunales Penales y los Juzgados de Primera Instancia en lo Civil, Comercial y Laboral y en lo Penal, expidan a tal efecto.","Hasta tanto se disponga la creación de la Oficina de Mandamientos para las demás Circunscripciones Judiciales, los Oficiales de Justicia actuantes en la misma dependerán del Juzgado Civil y Comercial N° 1 en todo lo concerniente a su funcionamiento."],"s":"En cada Circunscripción Judicial habrá una Oficina de Mandamientos y Notificaciones que tendrá a su cargo la tramitación de los mandamientos y notificaciones que el Superior Tribunal, las Cámaras de Apelaciones, los Tribunales…","nt":["Ac. 68/88. Notificaciones por medio de la Justicia de Paz. (Anexo)","Ac.98/96. Eldorado. Reglamento Ofic. Mandamientos (Anexo)","Ac. 80/97. Oberá. Trámites expedido por el Juzgado de Paz (Anexo)","Ac. 49/98. Oberá. Radio Oficina de Mandamientos (Anexo)","Ac.113/98. Aristóbulo del Valle. Radio Juzgado de Paz (Anexo)","Ac. 83/04. Notificaciones por Casilleros. Reglamento (Anexo)","Res. Presidencia Nº 1732/06. Posadas. Radio Oficina de Mandamientos y Notificaciones. (Anexo)","Ac. 20/13. San Vicente. Radio Oficina De Mandamientos. (Anexo)","Ac. 129/14. Jardín América. Radio Oficina de Mandamientos. (Anexo)","Ac. 60/17. Leandro N. Alem. Radio Oficina de Mandamientos","Ac. 38/18. San Ignacio. Radio Juzgado de Paz(Anexo)","Ac. 150/18. Reintegro de Gastos de Movilidad de Abogados y Procuradores. (Anexo)","Ac. 169/18. Puerto Iguazú. Radio Oficina de Mandamientos (Anexo)","Ac. 54/21. Apóstoles. Radio Oficina de Mandamientos. (Anexo)","Ac. 74/21. Puerto Rico. Radio Oficina de Mandamientos. (Anexo)"]},{"n":187,"l":"187","t":"Deberes y Atribuciones","p":["Las oficinas de Mandamientos y Notificaciones, además de los deberes y atribuciones impuesta por la Ley Orgánica del Poder Judicial y del presente Reglamento, tendrán a su cargo la ejecución de las ordenes judiciales que expidan los Tribunales Nacionales o Provinciales de conformidad a la Ley que rija el trámite uniforme para exhortos y oficios a la que la provincia se halle adherida.* Asimismo diligenciarán las notificaciones que se libren en las causas en trámite por ante el Tribunal de Disciplina del Colegio de Abogados de la Provincia, ajustándose dicho diligenciamiento a las disposiciones reglamentarias vigentes, en lo que fuere aplicable. *Ley 22.172. Exhortos. Tramitación (Anexo) Ley XII-Nº 8 (Antes Ley 1.243). Adhesión a la Ley 22.172 (Anexo)"],"s":"Las oficinas de Mandamientos y Notificaciones, además de los deberes y atribuciones impuesta por la Ley Orgánica del Poder Judicial y del presente Reglamento, tendrán a su cargo la ejecución de las ordenes judiciales que…","nt":["Ac. 69/83. Exhortos. Oficinas habilitadas (Anexo)"]},{"n":188,"l":"188","t":"Secciones","p":["La oficina estará dividida en dos secciones denominadas: Sección Mandamientos y Sección Notificaciones. Cada una de ellas entenderá en el diligenciamiento de los documentos que les corresponde por su propia denominación. Contará además con una Mesa general de Entradas y Salidas."],"s":"La oficina estará dividida en dos secciones denominadas: Sección Mandamientos y Sección Notificaciones","nt":[]},{"n":189,"l":"189","t":"Jefe","p":["La Dirección de la Oficina estará a cargo de un Jefe responsable del correcto desenvolvimiento de la misma, sin perjuicio de la responsabilidad de los demás Funcionarios y empleados que corresponda."],"s":"La Dirección de la Oficina estará a cargo de un Jefe responsable del correcto desenvolvimiento de la misma, sin perjuicio de la responsabilidad de los demás Funcionarios y empleados que corresponda.","nt":[]},{"n":190,"l":"190","t":"Atribuciones","p":["El Jefe de la Oficina vigilará su normal funcionamiento, impartirá instrucciones al personal, asignará las tareas a los empleados, adjudicará las zonas al Cuerpo de Oficiales de Justicia y Notificaciones, y procederá al traslado de éstos a nuevas zonas cuando lo considere conveniente o necesario, atenderá los reclamos del público, de acuerdo a cuya naturaleza o importancia los solucionará o los elevará al Superior, siguiendo esta última vía en todos los casos que aquéllos fueren por escrito, harán cumplir estrictamente lo dispuesto en las Acordadas del Superior Tribunal, que les concierne y en el presente Reglamento."],"s":"El Jefe de la Oficina vigilará su normal funcionamiento, impartirá instrucciones al personal, asignará las tareas a los empleados, adjudicará las zonas al Cuerpo de Oficiales de Justicia y Notificaciones, y procederá al…","nt":[]},{"n":191,"l":"191","t":"Sustitución","p":["Ausente el Jefe de la Oficina, automáticamente ejercerá provisionalmente la Jefatura de la Oficina el Oficial de Justicia de mayor antigüedad de la Justicia Provincial de la Circunscripción y así sucesivamente."],"s":"Ausente el Jefe de la Oficina, automáticamente ejercerá provisionalmente la Jefatura de la Oficina el Oficial de Justicia de mayor antigüedad de la Justicia Provincial de la Circunscripción y así sucesivamente.","nt":[]},{"n":192,"l":"192","t":"Pedido de informes de Jueces","p":["Los Jueces recabarán informes, aclaraciones o cualquier otra diligencia directamente al Jefe de la Oficina, quien dará y hará dar a su personal urgente y fiel cumplimiento a los mismos. A tal efecto, si lo considerasen más expeditivo, citarán a los Oficiales de Justicia y Notificadores de la Oficina para que comparezcan ante el Tribunal."],"s":"Los Jueces recabarán informes, aclaraciones o cualquier otra diligencia directamente al Jefe de la Oficina, quien dará y hará dar a su personal urgente y fiel cumplimiento a los mismos","nt":[]},{"n":193,"l":"193","t":"Suspensión de diligencias","p":["Toda orden que mande devolver sin diligenciar un mandamiento, o suspender transitoriamente su ejecución, o la que consecuentemente deje sin efecto esta medida, el Tribunal las impartirá por oficio dirigido al Jefe de la Oficina, o notificándolo en su despacho en el expediente.","Si el mandamiento estuviese ejecutándose, el Juez podrá disponer para los supuestos del presente artículo, el envío de la orden escrita y firmada al Oficial de Justicia, por conducto del interesado.","Fuera del propio Tribunal que libró el mandamiento o cédula, se rechazará de plano toda contra orden, cualquiera sea su proveniencia o alcance, excepto que emane del Tribunal del mismo fuero en grado o superior o del Superior Tribunal, por escrito y firmada."],"s":"Toda orden que mande devolver sin diligenciar un mandamiento, o suspender transitoriamente su ejecución, o la que consecuentemente deje sin efecto esta medida, el Tribunal las impartirá por oficio dirigido al Jefe de la…","nt":[]},{"n":194,"l":"194","t":"Personal","p":["El personal de la Oficina de Mandamientos y Notificaciones estará integrado por personal externo e interno. El personal externo estará compuesto por los Oficiales de Justicia esenciales y preferentes funciones fuera de la Oficina. El personal interno lo formarán dos encargados de sección, uno de la sección Mandamientos y otro de la sección Notificaciones, auxiliares y ordenanzas.","El Jefe de la Oficina dispondrá, de acuerdo con las necesidades del servicio, qué Oficiales de Justicia actuarán en la Sección Mandamientos y quiénes lo harán en la Sección Notificaciones en calidad de Oficiales Notificadores.","Los encargados de Sección darán cumplimiento a las órdenes y funciones que les indique el Jefe de la Oficina, de conformidad a la Ley y a este Reglamento.","Los auxiliares y ordenanzas realizarán las tareas que se les indique. Acatarán las órdenes que les impartan el Jefe de la Oficina y no estarán subordinados al personal externo. El Jefe de la Oficina para el mejor funcionamiento de la misma distribuirá las tareas entre el personal interno teniendo en cuenta la capacidad y jerarquía de cada empleado."],"s":"El personal de la Oficina de Mandamientos y Notificaciones estará integrado por personal externo e interno","nt":[]},{"n":195,"l":"195","t":"Remisión de cédulas y mandamientos","p":["El Superior Tribunal de Justicia, las Cámaras de Apelaciones y los Juzgados de Primera Instancia, deberán remitir todos los días hábiles, debidamente asentados en libros habilitados al efecto, las cédulas y mandamientos que se hubieren ordenado en los respectivos expedientes.","Cédulas y Mandamientos ordenados en Causas Civiles y Laborales"],"s":"El Superior Tribunal de Justicia, las Cámaras de Apelaciones y los Juzgados de Primera Instancia, deberán remitir todos los días hábiles, debidamente asentados en libros habilitados al efecto, las cédulas y mandamientos que se…","nt":[]},{"n":196,"l":"196","t":"Las cédulas y mandamientos ordenados en causas que tramiten…","p":["Las cédulas y mandamientos ordenados en causas que tramiten ante los Juzgados de Primera Instancia en lo Civil, Comercial y Laboral, podrán ser retirados de la Secretaría por la parte interesada en la notificación o diligencia bajo recibo en autos y entrega en la Mesa de Entradas y Salidas de la Oficina de Mandamiento y Notificaciones.","Exceptúase de la regla establecida en el presente artículo, las cédulas y mandamientos cuyo libramiento se ordene en aquéllas causas en que intervengan los defensores oficiales y sólo respecto a la parte que representan los mismos, en cuyo supuesto el procedimiento se ajustará a lo previsto en el artículo anterior."],"s":"Las cédulas y mandamientos ordenados en causas que tramiten ante los Juzgados de Primera Instancia en lo Civil, Comercial y Laboral, podrán ser retirados de la Secretaría por la parte interesada en la notificación o diligencia…","nt":[]},{"n":197,"l":"197","t":"Recepción de Mandamientos y Cédulas Requisitos","p":["Recibidos los mandamientos y cédulas de notificaciones por la Mesa de Entradas y Salidas, se sellarán inmediatamente con sello fechador, el cual contendrá la hora, día, mes y año.","El encargado de la Mesa de Entradas certificará con su firma la intervención que le cupo en la recepción de los documentos. Los mandamientos y cédulas con sus duplicados correspondientes, si los llevaren, serán sellados a continuación de las firmas que los mismos contengan."],"s":"Recibidos los mandamientos y cédulas de notificaciones por la Mesa de Entradas y Salidas, se sellarán inmediatamente con sello fechador, el cual contendrá la hora, día, mes y año.","nt":[]},{"n":198,"l":"198","t":"Libro","p":["A los efectos de la recepción, contralor y distribución de las cédulas y mandamientos, la Mesa de Entradas, una vez efectuado el sellado de los mismos, procederá a registrar en libros separados, que se denominarán “Libro de Movimiento”, la entrada de aquéllos, en el que se anotará 1) Número de orden;","2) Juzgado o Tribunal de origen; 3) Secretaría; 4) Carátula de los autos; 5) Nombre y domicilio de la persona a quien va dirigida la orden judicial o notificación; 6) Gestión que le corresponde; 7) Fecha de entrada a la Sección; 8) Fecha de devolución de la Sección; 9) Fecha de entrega al Juzgado o Tribunal."],"s":"A los efectos de la recepción, contralor y distribución de las cédulas y mandamientos, la Mesa de Entradas, una vez efectuado el sellado de los mismos, procederá a registrar en libros separados, que se denominarán “Libro de…","nt":[]},{"n":199,"l":"199","t":"Devolución de Cédulas y Mandamientos","p":["La devolución de los mandamientos y cédulas al Juzgado de origen se hará única y exclusivamente, por intermedio del personal dependiente de la Oficina de Mandamientos y Notificaciones."],"s":"La devolución de los mandamientos y cédulas al Juzgado de origen se hará única y exclusivamente, por intermedio del personal dependiente de la Oficina de Mandamientos y Notificaciones.","nt":[]},{"n":200,"l":"200","t":"Diligenciamiento","p":["Los Oficiales de Justicia acordarán con la parte interesada el día y la hora del diligenciamiento de aquellos mandamientos en que el Juez hubiere dispuesto la intervención del interesado para el embargo, secuestro o cualquier otra medida ordenada.","La diligencia deberá practicarse dentro de un término que no podrá exceder de los ocho días hábiles siguientes a la fecha de recepción del mandamiento por la Oficina. A tal efecto dichos Funcionarios permanecerán en sus despachos los días lunes y miércoles en la Oficina, hasta la hora diez. El acuerdo realizado para el día y hora en que se efectuará el diligenciamiento, se consignará al margen del mandamiento, firmando el interesado. Si la parte interesada no concurriese a la Oficina en la fecha y hora convenida, el Oficial de Justicia retendrá en su poder hasta por cinco días hábiles más el mandamiento y si para entonces no se cumpliera la diligencia, procederá a devolver el mandamiento sin diligenciar, a la sección correspondiente, con la constancia de la causa motivante, para su devolución al organismo judicial de origen.","Texto según Ac. Nº 55/2010. Vigente a partir del primer día hábil del mes de febrero de 2011."],"s":"Los Oficiales de Justicia acordarán con la parte interesada el día y la hora del diligenciamiento de aquellos mandamientos en que el Juez hubiere dispuesto la intervención del interesado para el embargo, secuestro o cualquier…","nt":[]},{"n":201,"l":"201","t":"Movilidad","p":["Para el diligenciamiento de cédulas de notificaciones y de aquellos mandamientos en que no sea necesaria la presencia de la parte interesada, ésta podrá optar entre poner a disposición del Oficial de Justicia interviniente el medio de movilidad adecuado para el cumplimiento de la diligencia, o abonar al mismo el gasto de movilidad que fije el arancel que al efecto establezca mediante acordada del Superior Tribunal.","El Oficial de Justicia o Notificador no podrá percibir otra suma que importe una alteración o modificación al arancel fijado. La infracción de esta norma será considerada falta grave. Cuando sea menester trasladar objetos o elementos secuestrados o embargados, la parte interesada deberá poner a disposición del Oficial de Justicia el medio de transporte adecuado."],"s":"Para el diligenciamiento de cédulas de notificaciones y de aquellos mandamientos en que no sea necesaria la presencia de la parte interesada, ésta podrá optar entre poner a disposición del Oficial de Justicia interviniente el…","nt":["Ac. 150/18. Reintegro de Gastos de Movilidad de Abogados y Procuradores. (Anexo)"]},{"n":202,"l":"202","t":"Radio sin provisión de Movilidad","p":["Para el diligenciamiento de cédulas y mandamientos que deba efectuar la Oficina de Mandamientos y Notificaciones de la Primera Circunscripción Judicial, se fija el radio comprendido por: al Sur la Av. Cabred y su continuación la Av. Martín Fierro incluyéndose ambas aceras; al Oeste la Av. San Martín incluyendo ambas aceras y al Norte y Este el Río Paraná, dentro del cual las diligencias deberán ser practicadas sin obligación de que la parte interesada provea la movilidad o abone gasto, salvo lo dispuesto por la última parte del artículo anterior; permitiéndose la constitución de domicilio requerido por el artículo 9 en el perímetro trazado precedentemente.","Resol, Presidencia STJ Nº 1732/06 – PRIMERA CIRCUNSCRIPCIÓN- Ampliación del radio de diligenciamiento sin provisión de movilidad. (Anexo)"],"s":"Para el diligenciamiento de cédulas y mandamientos que deba efectuar la Oficina de Mandamientos y Notificaciones de la Primera Circunscripción Judicial, se fija el radio comprendido por: al Sur la Av","nt":["Ac. 150/18 Reintegro de Gastos de Movilidad de Abogados y Procuradores. (Anexo)"]},{"n":203,"l":"203","t":"Zonas","p":["Así mismo, a los fines del diligenciamiento de las cédulas y mandamientos recibidos por la Oficina de Mandamientos y Notificaciones de la Primera Circunscripción Judicial y mientras no se disponga otro temperamento, el ejido municipal de la ciudad de Posadas se dividirá en zonas dentro de las cuales actuarán los Oficiales de Justicia y Oficiales Notificadores, de acuerdo a las necesidades del servicio.","En lugar visible de la Mesa de Entradas de la Oficina se colocará un plano de la ciudad con el señalamiento de las zonas en que se encuentre dividida y el nombre de los Oficiales de Justicia y Oficiales Notificadores que actúen en cada uno."],"s":"Así mismo, a los fines del diligenciamiento de las cédulas y mandamientos recibidos por la Oficina de Mandamientos y Notificaciones de la Primera Circunscripción Judicial y mientras no se disponga otro temperamento, el ejido…","nt":[]},{"n":204,"l":"204","t":"Horario","p":["Los abogados, profesionales e interesados podrán concurrir diariamente a la Oficina de Mandamientos y Notificaciones, en el horario de oficina, para gestiones que hagan a su derecho.","El horario de labor de los Oficiales de Justicia y Oficiales Notificadores, será de 7 a 12 debiendo además, completar en horas de la tarde el horario de trabajo que se encuentre vigente en la administración de la Justicia Provincial, sin perjuicio de lo dispuesto por el art. 143 apartado 3° de la Ley IV-Nº 15."],"s":"Los abogados, profesionales e interesados podrán concurrir diariamente a la Oficina de Mandamientos y Notificaciones, en el horario de oficina, para gestiones que hagan a su derecho.","nt":[]},{"n":205,"l":"205","t":"Rotación","p":["Cada tres meses se hará rotación del Oficial de Justicia y del Oficial de Notificaciones a la zona siguiente a la que estuviere actuando y así sucesivamente. Cuando razones fundadas lo exigieren, el Jefe de la Oficina podrá disponer la prórroga del tiempo que el Funcionario debe actuar en una zona por un lapso mayor que el que le corresponde."],"s":"Cada tres meses se hará rotación del Oficial de Justicia y del Oficial de Notificaciones a la zona siguiente a la que estuviere actuando y así sucesivamente","nt":[]},{"n":206,"l":"206","t":"Informe Semestral","p":["Derogado por Acordada Nº 17/05. (Anexo)."],"s":"Derogado por Acordada Nº 17/05. (Anexo).","nt":[]},{"n":207,"l":"207","t":"Diligenciamiento en la Justicia de Paz","p":["En los Juzgados de Paz Provinciales de todas las categorías, las cédulas y mandamientos serán diligenciadas por los empleados de los mismos, designados al efecto, en el término señalado en el art. 133 del presente reglamento.","Los empleados que se desempeñen como Oficiales de Justicia en los Juzgados de Paz de Primera Categoría de la Ciudad Capital, Oberá y Eldorado observarán las normas dispuestas por el art. 202 y el horario determinado en el art. 204 del presente reglamento, siendo aplicable también al respecto de los mismos las disposiciones establecidas en el presente capítulo."],"s":"En los Juzgados de Paz Provinciales de todas las categorías, las cédulas y mandamientos serán diligenciadas por los empleados de los mismos, designados al efecto, en el término señalado en el art. 133 del presente reglamento.","nt":["Ac. 68/88. Notificaciones por medio de los Juzgados de Paz (Anexo)","Ac. 80/97. Juzgado de Paz de Oberá. (Anexo)","Ac. 113/98. Juzgado de Paz de Aristóbulo del Valle (Anexo)","Ac. 38/18. San Ignacio. Radio Juzgado de Paz (Anexo)"]},{"n":208,"l":"208","t":"La gestión administrativa-contable será cumplida por la Dirección de…","p":["La gestión administrativa-contable será cumplida por la Dirección de Administración del Poder Judicial. Tendrá a su cargo:","a) Centralizar la preparación del anteproyecto de presupuesto de su respectiva jurisdicción e intervenir en los reajustes posteriores.","b) Intervenir obligatoriamente en la gestión previa y en la ejecución de todas las contrataciones.","c) Liquidar los sueldos y demás retribuciones del personal de su jurisdicción.","d) Informar y asesorar en toda actuación o asunto que sea de su competencia comunicando por escrito a la superioridad por intermedio de la Secretaría Administrativa y de Superintendencia, sobre toda trasgresión a las disposiciones legales y/o reglamentarias que, a su juicio, se deslizara en algún acto de la superioridad, quedando así a salvo su responsabilidad si ésta insistiera.","e) Llevar la registración analítica y sintética de las operaciones económico-financieras de su jurisdicción, en la forma determinada en este Reglamento en el Capítulo X y disposiciones correlativas de la Ley de Contabilidad y de acuerdo a normas reglamentarias que dicte el Superior Tribunal de Justicia.","f) Las demás funciones que se le adjudiquen por vía reglamentaria."],"s":"La gestión administrativa-contable será cumplida por la Dirección de Administración del Poder Judicial. Tendrá a su cargo: a) Centralizar la preparación del anteproyecto de presupuesto de su respectiva jurisdicción e…","nt":[]},{"n":209,"l":"209","t":"De la Organización de la Dirección de Administración","p":["a) Jefatura-Estructura Organizativa. Para la ejecución de las tareas específicas, la Dirección de Administración del Poder Judicial actuará bajo la Jefatura de un Director de Administración, con la estrecha colaboración de un Subdirector y su estructura orgánica y funcional estará constituida por los siguientes Sectores: Tesorería; Contabilidad, Liquidaciones de Haberes, Rendiciones de Cuentas, Patrimonio, Suministros, Compras, Mesa de Entradas, Secretaría, Secretaría de Planeamiento y Control y Asesoría Jurídica.","b) Del Personal. La organización referida en el artículo anterior será cubierta con el personal de presupuesto, adscripto y/o contratado, y podrá ser modificada por acordada cuando necesidades de carácter orgánico funcional así lo requieran.","c) Responsabilidad de los agentes. Todos los agentes de la Dirección de Administración son responsables por toda omisión o falta en que incurrieren en el desempeño de sus funciones, siendo pasibles de las sanciones previstas en el título II capítulo IX de este Reglamento. A los fines de la determinación de la responsabilidad ante el Tribunal de Cuentas, la Dirección enviará a dicho Tribunal, junto con las rendiciones de cuentas de cada ejercicio, el conjunto de disposiciones de organización y procedimiento dictadas en el lapso anual que se rinde, así como la nómina de los agentes, de las funciones y de los períodos en que cada uno de ellos ha actuado. Tanto el Director como el Subdirector serán responsables de las medidas que se dicten con respecto a la organización y funcionamiento de la Dirección. *d) Sustitución. En los casos de ausencia, vacancia o impedimento del Director de Administración, este será sustituido por el Subdirector. En caso de ausencia, vacancia o impedimento del Subdirector, será sustituido por el Secretario de Planeamiento y Control. En caso de ausencia, vacancia, o impedimento simultáneo, tanto del Director como del Subdirector, el Secretario de Planeamiento y Control reemplazará al Director. En caso de ausencia, vacancia, o impedimento simultáneo, tanto del Director, Subdirector, como del Secretario de Planeamiento y Control, el Tesorero reemplazará al Director. En caso de ausencia, vacancia o impedimento del Tesorero, este será sustituido por el Subtesorero.","e) Fondos del Poder Judicial. Los fondos que ingresan al Poder Judicial, en relación o no a la integración y/o ejecución de su presupuesto, serán depositados en el Banco designado como Agente Financiero de la Provincia de Misiones. Serán titulares de la o de las cuentas respectivas el Director, el Subdirector, el Secretario de Planeamiento y Control, el Tesorero y el Subtesorero. Los fondos se moverán con la firma de los tres nombrados en primer término, juntamente con la del Tesorero y/o Subtesorero.","Texto según Ac. 22/09. *Modif. por Ac. 75/12. Vigencia: a partir del 14 de agosto 2012"],"s":"a) Jefatura-Estructura Organizativa","nt":[]},{"n":210,"l":"210","t":"Del Director de Administración","p":["El Director en su carácter de jefe, tiene a su cargo el gobierno interno del Organismo, con las atribuciones que las leyes, los Reglamentos y/o las Acordadas del Superior Tribunal le confieren.","Corresponde al Director de Administración:","1) Proyectar y proponer al Superior Tribunal de Justicia las soluciones de todas las cuestiones relacionadas con la misión asignada a su área y/o las tareas necesarias para el cumplimiento de las mismas.","2) Aprobar los Estados Contables asumiendo la responsabilidad técnica de su confección.","3) Supervisar la información relacionada con la confección de los Balances mensuales y anuales.","4) Centralizar la preparación del anteproyecto de Presupuesto Anual del Poder Judicial e intervenir en los reajustes posteriores.","5) Participar en la confección de informes administrativos contables y todo lo relacionado con Licitaciones Publicas, Privadas y/o Concursos de Precios, como así también en el control y liquidación de cuentas a pagar. 6)Intervenir conjuntamente con la Tesorería, todos los pagos que realice el Poder Judicial, emitiendo bajo su firma, las órdenes de pago contra la orden de disposición de fondos en poder de la Tesorería General de la Provincia y las órdenes de cargo o de entrega y de pago contra la Tesorería del Poder Judicial.","7) Disponer mediante órdenes de cargo emitidas sobre la base y dentro de los límites establecidos por resolución de Presidencia, la provisión de fondos para las Cajas Chicas, en vista de cada comienzo del ejercicio financiero y las veces que se vuelva necesario en el curso de los mismos.","8) Sobre la base de resolución de Presidencia dictada conforme a las disposiciones del inciso 5º apartado c) del Art. 225) proveer fondos mediante órdenes de cargo a los Fondos Permanentes, tanto en oportunidad de su institución anual como las veces que resulte necesario en el curso del ejercicio financiero.","9) Todas las órdenes de pago, de cargo o de entrega serán remitidas por el Director, sobre la base de las liquidaciones que le presenten, bajo sus firmas, los agentes que tengan a su cargo las liquidaciones de diversa índole. Estos tendrán la responsabilidad exclusiva por la correcta confección de dichas liquidaciones y el Director tendrá la exclusiva responsabilidad de la corrección formal del libramiento (orden de cargo, entrega, de pago) que emita sobre la base precedentemente mencionada.","10) Disponer, cualquiera sea su monto, la liquidación y pago de los haberes del personal de todas las categorías y niveles, permanente y temporario, de las obligaciones que resulten a cargo del Poder Judicial por suministro de servicios públicos, comisiones, gastos bancarios, tasas, impuestos y cualesquiera otros gravámenes, pasajes, fletes, publicaciones, etc., así como las que provengan de contratos de ejecución, sucesiva o continuada dentro de los plazos y condiciones establecidos en los mismos.","11) Intervenir en las certificaciones de sueldos y/o formularios de préstamos solicitados por los agentes del Poder Judicial.","12) Verificar las Rendiciones de Cuentas que se efectúan ante el Tribunal de Cuentas de la Provincia.","13) Autorizar y aprobar la adquisición de elementos de menor precio y cuantía, conforme lo establecido por Acordadas del STJ.","14) Verificar los estados contables sintéticos que le presenten bajo su firma y exclusiva responsabilidad cada uno de los jefes o encargados de las distintas subdivisiones de la Dirección.","15) Participar en trabajos con otras áreas del Poder Judicial en tareas que requieran elaboración en conjunto.","16) Elevar mensualmente a la Presidencia una planilla de ejecución de presupuestos, una de ajuste de saldos, junto con la o las certificaciones de los saldos de las cuentas bancarias.","17) Delegar las funciones que considere apropiadas al Sub-director de Administración, siendo responsable de las decisiones o de las medidas que este tome dentro de sus atribuciones.","18) Ejercer las facultades disciplinarias vigentes y el control de las dependencias que integran la Dirección de Administración y distribuir entre el personal que la Dirección tiene asignado, las atribuciones, funciones y responsabilidades de acuerdo con el Organigrama y el Manual de Funciones de la Dirección de Administración.","19) Instituir, modificar y/o dejar sin efecto, por vía de resolución, modalidades operativas y correspondientes formularios que permitan organizar las contrataciones y las demás operaciones de administración y/o contables, de modo que se obtenga la mayor racionalización, simplificación y agilización de los respectivos trámites sin desmedro de las imprescindibles medidas de control y seguridad.","20) Representar a la Dirección de Administración del Poder Judicial en grupos de trabajo, organizados por reparticiones o instituciones Nacionales o Provinciales."],"s":"El Director en su carácter de jefe, tiene a su cargo el gobierno interno del Organismo, con las atribuciones que las leyes, los Reglamentos y/o las Acordadas del Superior Tribunal le confieren.","nt":[]},{"n":211,"l":"211","t":"Del Subdirector","p":["Corresponde al Subdirector:","1) Cumplir con las tareas específicas encomendadas por el Director de Administración, siendo responsable por las decisiones que tome en la ejecución de las mismas.","2) Ser el reemplazante natural del Director de Administración, con todos los deberes y atribuciones propios de la función. 3)Ejercer el control global conjuntamente con el Director de Administración, de todos los Sectores que integran la Dirección de Administración, proponiendo todas las medidas que considere oportunas para modificar la estructura orgánica y funcional a fin de lograr mayor eficacia, mejor control y el cumplimiento de los objetivos Del Secretario de Planeamiento y Control 211 bis) Corresponde al Secretario de Planeamiento y Control:","1) Desarrollo e implementación de de la Sistematización de las tareas y los procedimientos en los trámites administrativos.","2) Promover la incorporación permanente de los nuevos avances en materia administrativa, de las modernas tecnologías de gestión y del rediseño permanente para mejoramiento del servicio administrativo.","3) Análisis situacional y desarrollo de programas para el rediseño y adecuación permanente del Sistema de Gestión Integrado conforme a las necesidades de la Dirección de Administración.","4) Implementación y puesta en marcha de los programas y planes a ejecutar.","5) Supervisión y seguimiento de todos los planes y programas.","6) Control, mediciones de resultados y evaluación de los mismos mediante la información obtenida del Sistema de Gestión.","7) Elaboración de proyectos tendientes a corregir los desvíos a fin de alcanzar las metas propuestas.","8) Establecimiento de la información requerida a los efectos de los controles internos y externos por parte de los Organismos de Contralor.","9) Cumplir con las tareas específicas encomendadas por el Director de Administración.","10) Ser reemplazante natural y subrogar al Subdirector de Administración."],"s":"Corresponde al Subdirector: 1) Cumplir con las tareas específicas encomendadas por el Director de Administración, siendo responsable por las decisiones que tome en la ejecución de las mismas.","nt":[]},{"n":212,"l":"212","t":"Artículo incorporado por Ac. 22/09 Del Tesorero","p":["Corresponde al Tesorero:","1) Recibir de la Tesorería General de la Provincia los fondos transferidos a la Dirección de Administración del Poder Judicial, así como todos los demás fondos, títulos o valores cualquiera sea su origen, que deban ingresar por cualquier título en forma definitiva o provisoria, al patrimonio del Poder Judicial, o que estén bajo su custodia o de la Dirección de Administración.","2) El fiel cumplimiento de la Ley de Contabilidad y toda norma que fije el Poder Judicial, la Contaduría General y el Tribunal de Cuentas de la Provincia.","3) Hacer efectivas las órdenes de Pago y Cargo, previa verificación de los requisitos legales y reglamentarios vigentes.","4) Depositar los fondos en poder de la Tesorería en las cuentas bancarias oficiales determinadas y/o que se determinen dentro de los plazos establecidos por las disposiciones legales, reglamentarias o disposiciones internas dictadas por el Director. Los fondos se depositarán a la orden conjunta del Director o Subdirector y del Tesorero o Subtesorero, tal como lo dispone el art. 209 inc. e) del RPJ, excepto los fondos de Caja Chica, que se depositarán a la orden de quien los administre, según corresponda.","5) Los pagos se harán preferentemente con cheque no a la orden, siendo el Tesorero el único responsable de la confección del cheque, del comprobante respectivo, de su autenticidad, y en general, del estricto cumplimiento de todos los requisitos que un comprobante deba reunir de acuerdo con las disposiciones vigentes al momento de su confección y recepción. Será necesaria y suficiente la firma aclarada del tesorero en los comprobantes de pago para garantizar la autenticidad de los mismos, demás condiciones previstas en el presente inciso y cualquiera otras disposiciones obligatorias que rijan al respecto.","6) El Tesorero será el único y exclusivo responsable de efectuar, en los términos establecidos o que se establezcan, las retenciones y los depósitos correspondientes a las retenciones de cualquier índole en el ejercicio de sus funciones específicas, así como también el cumplimiento en término de todas las obligaciones que tenga a su cargo como jefe de la Tesorería.","7) Administrar directamente la Caja Chica de la Dirección de Administración y por medio de los subresponsables respectivos de las demás dependencias del Poder Judicial. La responsabilidad del Tesorero en lo que respecta a la gestión de las Cajas Chicas tanto la Central como las demás es total, con respecto a la validez formal de los comprobantes como a la regularidad de los gastos efectuados, siempre que no los haya observado al serle rendidos los anticipos que bajo ese título hiciere. La misma responsabilidad cabe en lo que respecta a todos los demás anticipos que hiciere, bajo cualquier otro título.","8) Rendir cuentas directamente al Director en forma documentada, analítica y sintéticamente del movimiento de fondos, títulos y valores en que intervino, demostrando separadamente el saldo anterior, las entradas, las salidas y el saldo que pasa al día siguiente, todo ello discriminando los fondos del ejercicio corriente de los que pertenecen a Residuos Pasivos, de conformidad con las instrucciones que al respecto diera el Director.","9) Ser agente de retención de los Organismos e Instituciones Públicas o Privadas a favor de las cuales se concreten deducciones en los haberes del Personal y/o por créditos de terceros.","10) El cierre de las cuentas bancarias utilizadas durante el ejercicio presupuestario vencido y la apertura de las que serán utilizadas durante el nuevo ejercicio, juntamente con el registro de firmas de los responsables de cada una de ellas.","11) El control global de los fondos de la Cuenta Especial Fondo de Justicia.","12) Control del cumplimiento de las obligaciones impositivas nacionales y provinciales a cargo del Poder Judicial.","13) La evaluación y distribución de las tareas que se le asignen a las Secciones a su cargo.","14) Responderá personalmente, en forma exclusiva, del cumplimiento estricto de las obligaciones establecidas a su cargo por este reglamento, por las disposiciones dictadas por la Dirección, Acordadas del Superior Tribunal de Justicia y demás disposiciones legales."],"s":"Corresponde al Tesorero: 1) Recibir de la Tesorería General de la Provincia los fondos transferidos a la Dirección de Administración del Poder Judicial, así como todos los demás fondos, títulos o valores cualquiera sea su…","nt":[]},{"n":213,"l":"213","t":"Del Subtesorero","p":["Corresponde al Subtesorero:","1) Cumplir con las tareas específicas encomendadas por el Tesorero, siendo responsable por las decisiones que tome en la ejecución de las mismas.","2) Ser el reemplazante natural del Tesorero, con todos los deberes y atribuciones propios de la función.","3) Ejercer el control global conjuntamente con el Tesorero, de todas las Secciones que integran la Tesorería, proponiendo todas las medidas que considere oportunas a fin de lograr mayor eficacia, mejor control y el cumplimiento de los objetivos."],"s":"Corresponde al Subtesorero: 1) Cumplir con las tareas específicas encomendadas por el Tesorero, siendo responsable por las decisiones que tome en la ejecución de las mismas.","nt":[]},{"n":214,"l":"214","t":"Sector Tesorería","p":["Sector Tesorería: Su misión será intervenir en todo movimiento de fondos, custodiar valores y realizar pagos por todo concepto. Estará conformado por tres Secciones: Sección Presupuesto General, Sección Fondo de Justicia y Sección Impuestos. Sus funciones serán:","Sección Presupuesto General:","1) Recibir de la Tesorería de la Provincia los fondos transferidos a la Dirección de Administración del Poder Judicial, así como todos los demás fondos, títulos o valores cualquiera sea su origen, que deban ingresar por cualquier título en forma definitiva o provisoria al patrimonio del Poder Judicial, o que estén bajo su custodia o de la Dirección de Administración.","2) El fiel cumplimiento de la Ley de Contabilidad y toda norma que fije el Poder Judicial, la Contaduría General o el Tribunal de Cuentas de la Provincia.","3) Hacer efectivas las Órdenes de Pago y Cargo previa verificación del cumplimiento de los requisitos legales y reglamentarios vigentes.","4) Depositar en las cuentas bancarias oficiales determinadas y/o que se determinen, dentro de los plazos que señalen las disposiciones legales, reglamentarias y/o disposiciones internas dictadas por el Director, todos aquellos fondos que no deban permanecer por mas tiempo en la caja de Tesorería. Los fondos que administran se depositarán en cuenta bancaria a la orden conjunta del Director y del Tesorero tal como lo dispone el art. 209 inc. e) del RPJ, salvo los de caja chica que se depositarán a la orden de quien las administre según corresponda.","5) El Tesorero será responsable de efectuar, en los términos establecidos o que se establezcan, las retenciones y los depósitos correspondientes a las retenciones de cualquier índole en el ejercicio de sus funciones específicas, así como también el cumplimiento en término de todas las obligaciones que tenga a su cargo como jefe de la Tesorería.","6) Administrar directamente la Caja Chica de la Dirección de Administración y por medio de los subresponsables respectivos las de las demás dependencias del Poder Judicial. La responsabilidad del Tesorero en lo que respecta a la gestión de las Cajas Chicas tanto la Central como las demás es total, con respecto a la validez formal de los comprobantes como a la regularidad de los gastos efectuados.","7) Rendir cuentas directamente al Director en forma documentada, analítica y sintéticamente del movimiento de fondos, títulos y valores en que intervino, demostrando separadamente el saldo anterior, las entradas, las salidas y el saldo que pasa al día siguiente, todo ello discriminando los fondos del ejercicio corriente de los que pertenecen a Residuos Pasivos.","8) Ser agente de retención de las Instituciones Públicas o Privadas a favor de las cuales se concreten deducciones en los haberes del Personal.","9) El cierre de las cuentas bancarias utilizadas durante el ejercicio presupuestario vencido y la apertura de las que serán utilizadas durante el nuevo ejercicio, juntamente con el registro de firmas de los responsables de cada una de ellas.","10) La evaluación y calificación de las tareas que se le asignen a las Secciones a su cargo.","Sección Fondo de Justicia:","1) Afectación de saldos bancarios a expedientes.","2) Contabilización y control de recaudación.","3) Contabilización, control y rendición de cheques librados.","4) Elaboración de partes de rendición.","5) Conciliación bancaria de la Cuenta Especial.","6) Elaboración de informes requeridos por los distintos Organismos Públicos de Control de la Provincia, de acuerdo a las normas vigentes.","7) Control de acreditaciones en la cuenta Especial Fondo de Justicia. 8-Elaboración del Cierre de Ejercicio y conciliación del saldo.","Ley XXII-Nº 37 – Ley de Fondo de Justicia (Anexo) Sección Impuestos:","1) Control mensual y depósito periódico de las retenciones de Impuestos Nacionales y Provinciales del Personal y de los proveedores y/o locadores.","2) Confección de las declaraciones juradas mensuales y anuales de las retenciones realizadas y su correspondiente presentación ante la AFIP y la Dirección General de Rentas.","3) Recepción de los formularios de modificación de datos para el cálculo de los impuestos que gravan al Personal e incorporación al sistema de sueldos.","4) Cumplimiento del Régimen de Información de las obligaciones previsionales de Autónomos.","5) Realizar todo informe sugerido y/o requerido por la Autoridad Superior pertinente sobre su área de competencia."],"s":"Sector Tesorería: Su misión será intervenir en todo movimiento de fondos, custodiar valores y realizar pagos por todo concepto. Estará conformado por tres Secciones: Sección Presupuesto General, Sección Fondo de Justicia y…","nt":[]},{"n":215,"l":"215","t":"Sector Contabilidad","p":["Sector Contabilidad: Su misión será efectuar la registración contable de los gastos e inversiones que efectúe el Poder Judicial, con sus partidas correspondientes, sobre la base de los créditos del Presupuesto vigente de la Cuenta General del Ejercicio, de la Cuenta Especial de Fondo de Justicia Ley XXII-Nº 37, y modificatorias y del Consejo de la Magistratura, y sus funciones será
