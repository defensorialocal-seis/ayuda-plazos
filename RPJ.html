<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--ink:#27304a;--mut:#66708c;--line:#e3e7f1;--card:#fff;--soft:#eef0fa;--mark:#ffe9a8;--ac:#4f5d77;--b:#e9edf3;--serif:'Newsreader',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--th:96px}
:root[data-theme=dark]{--bg:#12161f;--ink:#e6e9f2;--mut:#98a2bd;--line:#2a3142;--card:#1a2030;--soft:#232b3f;--mark:#6b5a1c;--b:#252d42}

html{scroll-padding-top:calc(var(--th) + 12px);scroll-behavior:smooth;height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}

.r1,#fc,.app{max-width:1360px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tt{font:600 20px/1.1 var(--serif);cursor:pointer;margin-right:6px}
.tt small{display:block;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.search{flex:1 1 280px;display:flex}
.search input{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;color:inherit}
:is(input,select,button,a,summary):focus-visible{outline:2px solid #7b83e6;outline-offset:2px}
.ib,.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:600 .85rem var(--sans);cursor:pointer;display:inline-block}

#menu{display:none}
#fc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font:500 .8rem var(--sans);color:var(--mut);cursor:pointer;display:inline-block}

aside .l.on{color:var(--ink);font-weight:700;background:var(--soft)}
main{padding:26px 28px 70px;min-width:0}
.crumb{font-size:13px;color:var(--mut);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.hero{padding:26px 0 10px}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.08;letter-spacing:-.01em;max-width:20ch}
.hero p{max-width:62ch;margin:12px 0 0;color:var(--mut);font-size:1.02rem}
.eyebrow{font:700 .8rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.stats,.go,.bar,.tabs,.ctl{display:flex;flex-wrap:wrap;gap:10px}
.stats{margin-top:22px}.go{margin-top:20px}.bar{margin:18px 0 10px}.tabs{margin:16px 0 12px}.ctl{margin:10px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:flex;gap:6px;align-items:baseline;font-weight:600;font-size:.85rem}
.stat b{font:600 1.15rem var(--serif)}
input[type=number],.ctl input,.ctl select{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
.go input{width:180px}.ctl input[type=search]{flex:1 1 240px}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:12px;padding:10px 16px;font:600 .85rem var(--sans);cursor:pointer;display:inline-block}
.btn:hover{filter:brightness(1.25)}
.sm{padding:6px 12px!important;font-size:.8rem!important;border-radius:10px!important}

@media print{.top,aside,.ctl,.tabs,.bar,.acts,#toast{display:none!important}.app{display:block}body{background:#fff}.art,.card{break-inside:avoid}}

s":[252,253]},{"lv":2,"kind":"Capítulo","num":"IV","name":"Obligaciones de Magistrados, Funcionarios y Empleados","part":"","par":24,"arts":[254,255,256,257,258,259,260,261,262,263,264,265]},{"lv":2,"kind":"Capítulo","num":"V","name":"De la asistencia y puntualidad","part":"","par":24,"arts":[266,267,268,269,270,271,272,273,274,275,276,277,278,279,280,281]},{"lv":2,"kind":"Capítulo","num":"VI","name":"Del régimen de licencias","part":"","par":24,"arts":[282,283,284,285,286,287,288,289,290,291]},{"lv":2,"kind":"Capítulo","num":"VII","name":"Licencia por feria ordinaria y extraordinaria","part":"","par":24,"arts":[292,293,294]},{"lv":2,"kind":"Capítulo","num":"VIII","name":"De las licencias especiales","part":"","par":24,"arts":[295,296,297,298,299,300,301,302,303,304,305,306,307,308,309,310,311,312,313,314,315,316,317,318,319,320,321,322,323]},{"lv":2,"kind":"Capítulo","num":"IX","name":"Del régimen disciplinario","part":"","par":24,"arts":[324,325,326]},{"lv":2,"kind":"Capítulo","num":"X","name":"Del escalafón","part":"","par":24,"arts":[336,337,338,339,340,1005]},{"lv":1,"kind":"Título","num":"III","name":"Disposiciones generales","part":"","par":-1,"arts":[341,342]}],"arts":[{"n":1,"l":"1","t":"Días hábiles e inhábiles","p":["Los tribunales y demás organismos del Poder Judicial no funcionarán durante las ferias ordinarias o extraordinarias que determine el Superior Tribunal de Justicia de acuerdo al art. 148 de la Ley IV-Nº 15; los días sábado y domingo; los que por disposición del Poder Ejecutivo Nacional y Provincial sean declarados no laborales y los que el Superior Tribunal declare feriados judiciales. Todos los demás días del año son hábiles."],"s":"Los tribunales y demás organismos del Poder Judicial no funcionarán durante las ferias ordinarias o extraordinarias que determine el Superior Tribunal de Justicia de acuerdo al art. 148 de la Ley IV-Nº 15; los días sábado y…","nt":[]},{"n":2,"l":"2","t":"Asueto","p":["El asueto no inhabilita el día ni alcanza a los Magistrados y Funcionarios. Tampoco alcanza a los empleados indispensables en cada organismo a fin de cubrir las guardias necesarias para la atención del público y el cumplimiento de las diligencias dispuestas para esa fecha. El personal que hubiere quedado de guardia hará uso de la compensación equivalente al siguiente día hábil o el subsiguiente si éste fuere día de notificación."],"s":"El asueto no inhabilita el día ni alcanza a los Magistrados y Funcionarios","nt":[]},{"n":3,"l":"3","t":"Ferias Judiciales","p":["Durante las ferias judiciales se suspenderá el funcionamiento de los tribunales y demás organismos del Poder Judicial. También se suspenderán los plazos procesales y sólo se despacharán por los jueces y tribunales de feria los asuntos señalados en el art. 144 de la Ley IV-Nº 15."],"s":"Durante las ferias judiciales se suspenderá el funcionamiento de los tribunales y demás organismos del Poder Judicial","nt":["Ac. 80/09. Establece que la Feria Judicial de verano se extiende desde el día 26 de Diciembre hasta el 31 de Enero, ambas","Ac. 81/13. Feria de la Cámara de Apelaciones Penal y de Menores –Art. 26 (Anexo)"]},{"n":4,"l":"4","t":"Horario","p":["Fíjase el horario de 6,30 a 12,30 hs. para el funcionamiento de los organismos de la Administración de Justicia, sin perjuicio de la prolongación que, con carácter general, disponga el Superior Tribunal o, accidentalmente, según lo requieran las necesidades del propio servicio la Cámara de Apelaciones, jueces, titulares del Ministerio Público, jefes de dependencias. Asimismo se determina como horario de atención al público el de 7 a 12 hs.","Los Defensores Oficiales deberán encontrarse en sus despachos a la hora de iniciación de las tareas diarias de atención al público, y no podrán abandonar sus oficinas durante las tres primeras horas; los Jueces de Primera Instancia no fijarán, en lo posible, audiencias que requieran su presencia durante dichas horas."],"s":"Fíjase el horario de 6,30 a 12,30 hs. para el funcionamiento de los organismos de la Administración de Justicia, sin perjuicio de la prolongación que, con carácter general, disponga el Superior Tribunal o, accidentalmente,…","nt":["Ac. 35/82. Horario de los Defensores Oficiales (Anexo)","Ac. 31/08. Relojes para control de asistencia. Horario general. Horario vespertino. Horario Personal de servicio (Anexo)","Res. 1616/09. Modif. parcial Ac. 31/08: En los Edificios de Santa Fe 1630 y Bolívar 1745, los Relojes Biométricos"]},{"n":5,"l":"5","t":"Habilitación de día y hora","p":["Los tribunales habilitarán días y horas en los asuntos señalados en el art. 144 de la Ley IV-Nº 15, con excepción de las causas a que se hacen referencia en el art. 146 de la misma.","Los pedidos de habilitación deberán ser efectuados dentro del horario de atención al público."],"s":"Los tribunales habilitarán días y horas en los asuntos señalados en el art. 144 de la Ley IV-Nº 15, con excepción de las causas a que se hacen referencia en el art. 146 de la misma.","nt":[]},{"n":6,"l":"6","t":"Orden de Despacho","p":["Las causas serán resueltas en el orden de su entrada a sentencia. Sin embargo, serán de preferente despacho los recursos de amparo, de hábeas corpus y de hecho, las causas de naturaleza penal, especialmente los incidentes de excarcelación, de libertad condicional y de prescripción de la acción penal; los juicios de alimentos, tenencia de hijos, indemnizaciones por incapacidad física, cobros de salarios, sueldos y honorarios, jubilaciones y pensiones; las cuestiones de competencia y medidas precautorias; las ejecuciones fiscales y los interdictos acciones posesorias e incidentes.","Excepcionalmente se podrá disponer la preferente resolución de una causa no comprendida entre las anteriores, cuando mediare atendible razón de urgencia."],"s":"Las causas serán resueltas en el orden de su entrada a sentencia","nt":["Ac. 81/13. Cámara de Apelaciones Penal y de Menores. Distribución de causas –Art. 8º, 9º. (Anexo)"]},{"n":7,"l":"7","t":"Cargo – Plazo de gracia","p":["Al pie de todos los escritos deberá ponerse el cargo de presentación autorizado por el secretario o por el oficial superior, con indicación de la fecha, nombre la persona que lo presentó firma del mismo y detalle de la documentación que se acompaña.","En el caso de las peticiones a que se refiere el art. 117 del Código de Procedimientos Civil y Comercial el Secretario o el oficial superior pondrán cargo, o la suscribirán junto con el solicitante.","Los escritos no presentados dentro del horario judicial del día en que venciere un plazo, sólo lo podrán ser entregados válidamente en la secretaría que corresponda, el día hábil inmediato y dentro de las dos primeras horas de abierta la oficina para la atención al público."],"s":"Al pie de todos los escritos deberá ponerse el cargo de presentación autorizado por el secretario o por el oficial superior, con indicación de la fecha, nombre la persona que lo presentó firma del mismo y detalle de la…","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":8,"l":"8","t":"Formas de Presentación de los Escritos","p":["Todo escrito judicial deberá ser presentado con su texto mecanografiado en tinta negra con excepción de los casos previstos en el art. 117 del Código de Procedimientos en lo Civil y Comercial, los que podrán ser manuscritos; deberán ser confeccionados con una extensión máxima de cuarenta paginas (40), en papel Tipo: “A4”, de 80 gr. como mínimo. Deberá observarse un interlineado de 1,5 como mínimo, con un máximo de 26 líneas por carilla y utilizarse tanto el anverso como el reverso de cada hoja, con un tipo de letra “tamaño” claramente legible, no menor de (paso 12). Deberá dejarse, como mínimo, un margen izquierdo de 5 cms., un margen derecho de 1,5 cms. (los que se invertirán en el reverso), un margen superior de 5 cms., y un margen inferior de 2 cms. Podrá utilizarse papel con márgenes y renglones preimpresos, siempre que se ajusten a los requisitos apuntados precedentemente.","Cuando no se cumplimentara con alguno de los recaudos se desestimará la presentación mediante la sola mención de la norma reglamentaria pertinente, salvo que, según la sana discreción, el incumplimiento no constituya un obstáculo insalvable para la dar trámite a la presentación, atento a las características de ésta (v.gr. pluralidad de actores o demandados). En este caso, las actuaciones respectivas se repuntaran inoficiosas. Serán permitidos los escritos judiciales realizados con medios de inscripción complementarios de equipamientos informáticos y efectuados sobre el papel empleado por estos, siempre que se ajusten a los requisitos enunciados en el apartado precedente en cuanto a tamaño aproximado del papel, color de tinta y margen mínimo. Deberá emplearse tinta azul o negra y las firmas serán aclaradas al pie en tinta negra o azul. Los abogados, Procuradores y demás profesionales auxiliares de la justicia, indicarán además el tomo, folio y el numero de la matricula de su inscripción”.","Texto según Ac. 218/15. Vigencia: a partir del 1º de diciembre de 2015 Resol. Presidencia STJ 1204/08. Recomendación a Cámaras y Tribunales Penales el estricto cumplimiento de los Art. 8º y 9º del RPJ, Ley XIX-Nº 18 (antes Ley 2349) de Fondo Permanente y Ley I-Nº 5 (antes Ley 267) de creación del Colegio de Abogados. (Anexo)"],"s":"Todo escrito judicial deberá ser presentado con su texto mecanografiado en tinta negra con excepción de los casos previstos en el art. 117 del Código de Procedimientos en lo Civil y Comercial, los que podrán ser manuscritos;…","nt":["Ac. 46/12. Recurso de Casación se limitará a 40 pág. Vigencia: a partir del 1º de Julio de 2012","Ac. 123/12. Recurso de Apelación se limitará a 50 pág. Vigencia: a partir del 1º de Febrero de 2013","Ac.180/22. Expediente Electrónico. (Anexo)","Ac. 155/23. Fondo Permanente Electrónico"]},{"n":9,"l":"9","t":"Todo escrito debe encabezarse con la expresión de su…","p":["Todo escrito debe encabezarse con la expresión de su objeto, el nombre de quien lo presenta, su documento nacional de identidad y/o CUIL y/o CUIT, su domicilio constituido y la enunciación precisa de la carátula del expediente. Las personas que actúen por terceros deberán expresar, además, en cada escrito el nombre completo de todos sus representados y del letrado patrocinante si lo hubiera.","Cuando las partes deban denunciar su domicilio real, deberán hacerlo mediante la enunciación de los caracteres que permitan su pronta y correcta localización, comenzando, en orden excluyente por el nombre de la calle y el número de la finca. A falta de tales datos, número de la calle y número o nombre de las calles transversales que flanquean el domicilio.","En defecto de ello número de chacra y manzana. En las rutas nacionales, provinciales y comunales el número de hito kilométrico más cercano.","Cuando esta regla fuera infringida, los jueces, de oficio o a petición de parte, intimarán al obligado a subsanar la omisión dentro del término de veinticuatro horas de notificado, bajo apercibimiento de lo dispuesto en la segunda parte del art. 41 del Código de Procedimientos Civil y Comercial, haciéndose efectivo el mismo, en caso de incumplimiento.- Texto según Ac. 20/06.","Resol. Presidencia STJ 1204/08. Recomendación a Cámaras y Tribunales Penales el estricto cumplimiento de los Art. 8º y 9º del RPJ, Ley XIX-Nº 18 (antes Ley 2349) de Fondo Permanente y Ley I-Nº 5 (antes Ley 267) de Creación del Colegio de Abogados. (Apéndice)"],"s":"Todo escrito debe encabezarse con la expresión de su objeto, el nombre de quien lo presenta, su documento nacional de identidad y/o CUIL y/o CUIT, su domicilio constituido y la enunciación precisa de la carátula del expediente","nt":["Res. Presidencia Nº 1732/06. Amplía radio de la Oficina de Mandamientos sin provisión de movilidad de la Primera","Ac.180/22. Expediente Electrónico. (Anexo)","Ac. 155/23. Fondo Permanente Electrónico"]},{"n":10,"l":"10","t":"Copias","p":["En el cargo de los escritos se indicará el número de copias que se acompañen. Dichas copias deberán conservarse en Secretaría durante dos meses.","De todo escrito o documento que se presente al Tribunal, se devolverá al interesado que lo solicite, una copia en la cual deberá constar, bajo firma del funcionario o empleado que la reciba, la fecha y la hora de presentación del original Texto según Ac. 59/09."],"s":"En el cargo de los escritos se indicará el número de copias que se acompañen","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":11,"l":"11","t":"Carátula y compaginación de expedientes","p":["Los expedientes serán compaginados en cuerpos que no excedan de doscientas fojas, salvo los casos en que tal límite obligara a dividir escritos o documentos que constituyan una sola pieza. Se llevarán bien cosidos y foliados, con exclusión de broches metálicos, y estarán provistos de carátula en que se indique el nombre de las partes, la naturaleza del juicio, el tomo y folio de su registro y el año de su iniciación. La parte actora figurará comenzando por su apellido y siendo mujer casada por el apellido de soltera. Cuando los litigantes fuesen más de uno por parte, la carátula podrá limitarse al nombre del primero de ellos, con el agregado “y otros”. Igual temperamento se seguirá cuando sean varios los procesados.","En las Salas de las Cámaras de Apelaciones se colocará en la carátula del Juzgado de origen un sello, con indicaciones de la Sala que actúe, número de su registro, año, fuero, fecha de entrada y de salida, sin perjuicio del número interno que le correspondiere."],"s":"Los expedientes serán compaginados en cuerpos que no excedan de doscientas fojas, salvo los casos en que tal límite obligara a dividir escritos o documentos que constituyan una sola pieza","nt":["Ac. 81/13. Cámara de Apelaciones Penal y de Menores. Expedientes elevados por los Juzgados –Art. 25º. (Anexo)","Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":12,"l":"12","t":"Agregación de documentos","p":["Los documentos deberán ser agregados a los autos en forma tal que sean legibles en su totalidad.","Si fuesen de pequeño tamaño podrán adosarse varios en una hoja de papel de oficio foliándose cada uno de ellos."],"s":"Los documentos deberán ser agregados a los autos en forma tal que sean legibles en su totalidad.","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":13,"l":"13","t":"Desglose de poder","p":["Los desgloses de poder en los juicios en trámite, deberán hacerse con transcripción íntegra de ellos en los autos."],"s":"Los desgloses de poder en los juicios en trámite, deberán hacerse con transcripción íntegra de ellos en los autos.","nt":[]},{"n":14,"l":"14","t":"Devolución de escritos","p":["Sin resolución del Presidente del Tribunal o del Juez que corresponda no podrá devolverse por Secretaría ningún escrito, aunque adoleciere de cualquier defecto de forma o la petición fuera improcedente; con excepción de los presentados fuera de plazo, o sin copias."],"s":"Sin resolución del Presidente del Tribunal o del Juez que corresponda no podrá devolverse por Secretaría ningún escrito, aunque adoleciere de cualquier defecto de forma o la petición fuera improcedente; con excepción de los…","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":15,"l":"15","t":"Revisión de expedientes","p":["Podrán revisar los expedientes:","a) Las partes, sus abogados, apoderados, representantes legales y los peritos y martilleros propuestos o designados en el juicio. También podrán hacerlo las personas facultadas debidamente por los abogados y procuradores, y por los representantes de la Nación, de las Provincias, de las Municipalidades y de las reparticiones autárquicas, previa autorización otorgada por el tribunal de la causa.","b) Cualquier abogado, escribano o procurador, aunque no intervenga en el juicio, siempre que justifique su calidad de tal cuando no fuere conocida.","c) Los periodistas, con motivo del fallo definitivo de la causa."],"s":"Podrán revisar los expedientes: a) Las partes, sus abogados, apoderados, representantes legales y los peritos y martilleros propuestos o designados en el juicio. También podrán hacerlo las personas facultadas debidamente por…","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":16,"l":"16","t":"Expedientes reservados","p":["Exceptuase de los incisos b) y c) del artículo precedente:","a) Los expedientes que contengan actuaciones administrativas que tengan carácter reservado.","b) Los expedientes referentes a cuestiones de derecho de familia (divorcio, filiación nulidad de matrimonio, pérdida de la patria potestad, tenencia de hijos, alimentos, insanias, etc.) así como aquellos cuya reserva se ordena especialmente."],"s":"Exceptuase de los incisos b) y c) del artículo precedente: a) Los expedientes que contengan actuaciones administrativas que tengan carácter reservado.","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":17,"l":"17","t":"Sumarios criminales","p":["Los sumarios criminales sólo podrán ser revisados por las partes, sus abogados, apoderados representantes legales y peritos designados en la causa. También podrán examinarlos los abogados de la matrícula siempre que justificaren su calidad de tales cuando no fuese conocida. Los periodistas podrán revisarlos con motivo del fallo definitivo de la causa.","Sin perjuicio de las medidas procesales que deban adoptarse por el vencimiento del término, todo profesional que se encuentre demorado más de veinte días hábiles en la devolución de un expediente penal, no podrá retirar otro del mismo tribunal."],"s":"Los sumarios criminales sólo podrán ser revisados por las partes, sus abogados, apoderados representantes legales y peritos designados en la causa","nt":["Ac. 81/13. Cámara de Apelaciones Penal y de Menores. Revisión de Expedientes, Art. 28 (Anexo)","Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":18,"l":"18","t":"Firma y Sello","p":["Las providencias de trámite podrán ser suscriptas con media firma. En las demás actuaciones deberá emplearse la firma entera. Ambas aclaradas al pie con sello de goma.","Los oficios, exhortos, certificaciones y otras piezas análogas llevarán además en cada foja, media firma y el sello de tinta correspondiente a quienes los expidan.","Las notificaciones y demás diligencias realizadas en expedientes judiciales llevarán también la firma y el sello aclaratorio de los funcionarios correspondientes."],"s":"Las providencias de trámite podrán ser suscriptas con media firma","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":19,"l":"19","t":"Exhortos al extranjero y Oficios a Magistrados","p":["Las comunicaciones a los agentes diplomáticos extranjeros acreditados en el país, se harán por oficio dirigido al Ministerio de Relaciones Exteriores.","Los exhortos a autoridades judiciales extranjeras podrán remitirse directamente a los agentes diplomáticos argentinos o, en su defecto, a los cónsules acreditados en el país respectivo.","Las comunicaciones entre jueces del mismo grado, dentro de la provincia se efectuarán por medio de oficio, siendo aplicables a tal fin las normas de la ley que rijan el trámite uniforme para exhortos y oficios a la que la provincia se halle adherida*.","Asimismo los Jueces de Primera Instancia dirigirán directamente los mandamientos y oficios a los Jueces de Paz de cualquiera de las circunscripciones judiciales de la provincia.","Ley Nac. 22.172. Convenio de comunicaciones entre Tribunales de distinta jurisdicción. (Anexo) Ley XXI-Nº 8 (Antes Ley 1243). Adhesión de la Provincia de Misiones a la Ley 22.172. (Anexo)"],"s":"Las comunicaciones a los agentes diplomáticos extranjeros acreditados en el país, se harán por oficio dirigido al Ministerio de Relaciones Exteriores.","nt":["Ac. 69/83. Sello de Agua. Oficinas habilitadas a los fines de la Ley 22.172 (Anexo)","Ac.180/22. Expediente Electrónico. (Anexo)","Ac. 219/23. Sello de Agua Quinta Circunscripción (Anexo)"]},{"n":20,"l":"20","t":"Oficios y Exhortos. Normas para su redacción","p":["En la redacción de oficios y exhortos deberán observarse las siguientes formalidades:","OFICIOS:","1) Lugar y fecha de otorgamiento;","2) el oficio deberá librarse al cargo y no a la persona (excepto cuando se tratase de los titulares y Ministros de los Poderes del Estado; en cuyo caso deberá nombrársele, con el tratamiento de estilo);","3) autos en que se libra;","4) lo solicitado en forma clara con transcripción de la parte pertinente del auto que las ordena.","EXHORTOS: se observarán las disposiciones de la ley provincial que rija el tramite uniforme para exhortos a la que la provincia se halla adherida*, debiendo usarse también en su redacción las formas de ritual, tales como “saluda y hace saber”, “ruego y exhorto”, “ofrezco reciprocidad”, etc.","Haciéndose constar al pie de la rogatoria el lugar y fecha de su otorgamiento.","Ley Nac. 22.172. Convenio de comunicaciones entre Tribunales de distinta jurisdicción. (Anexo) Ley XXI-Nº 8 (Antes Ley 1243). Adhesión de la Provincia de Misiones a la Ley 22.172. (Anexo)"],"s":"En la redacción de oficios y exhortos deberán observarse las siguientes formalidades: OFICIOS:","nt":["Ac. 69/83. Sello de Agua. Oficinas habilitadas a los fines de la Ley 22.172 (Anexo)","Ac.180/22. Expediente Electrónico. (Anexo)","Ac. 219/23. Sello de Agua Quinta Circunscripción (Anexo)"]},{"n":21,"l":"21","t":"Tramitación","p":["Cuando los juzgados en lo penal de la provincia reciban un mandamiento, exhorto o suplicatoria de otros tribunales nacionales o provinciales, procederán inmediatamente a acusar recibo, a no ser que la diligencia encomendada sea susceptible de cumplimiento inmediato.","Entiéndese por cumplimiento inmediato el que puede realizarse en un plazo no mayor de tres días.","Cuando se acuse recibo el tribunal requerido deberá hacer constar la denominación del mismo y de la Secretaría que intervenga, con indicación del Magistrado y Secretario actuantes."],"s":"Cuando los juzgados en lo penal de la provincia reciban un mandamiento, exhorto o suplicatoria de otros tribunales nacionales o provinciales, procederán inmediatamente a acusar recibo, a no ser que la diligencia encomendada…","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":22,"l":"22","t":"Remisión a otro Tribunal","p":["Si el tribunal destinatario del requerimiento lo remitiese a otro tribunal para su diligenciamiento deberá dar inmediato aviso de ello al Juez requirente, con indicación del tribunal al que se haya remitido la rogatoria."],"s":"Si el tribunal destinatario del requerimiento lo remitiese a otro tribunal para su diligenciamiento deberá dar inmediato aviso de ello al Juez requirente, con indicación del tribunal al que se haya remitido la rogatoria.","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":23,"l":"23","t":"Transferencias de fondos al Juez exhortante","p":["En los casos en que se disponga la transferencia de fondos al Juez exhortante, el exhorto recibido debe quedar reservado en el juzgado en que la rogatoria tramitó, por el término de dos años, debiendo el magistrado exhortado limitarse a librar oficio dirigido al Juez exhortante haciendo saber el cumplimiento de la diligencia, con transcripción de las piezas que corresponda y acompañando duplicado de la boleta de depósito o transferencia."],"s":"En los casos en que se disponga la transferencia de fondos al Juez exhortante, el exhorto recibido debe quedar reservado en el juzgado en que la rogatoria tramitó, por el término de dos años, debiendo el magistrado exhortado…","nt":[]},{"n":24,"l":"24","t":"Oficios de Embargos e Inhibiciones","p":["Los oficios que se libren para la anotación de embargo e inhibiciones deberán expresar, en cuanto fuera posible, el nombre, estado, nacionalidad, edad, domicilio, profesión y datos de enrolamiento del embargado o inhibido, además, los nombres de sus padres y del cónyuge si fueren conocidos."],"s":"Los oficios que se libren para la anotación de embargo e inhibiciones deberán expresar, en cuanto fuera posible, el nombre, estado, nacionalidad, edad, domicilio, profesión y datos de enrolamiento del embargado o inhibido,…","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":25,"l":"25","t":"Copias de los Oficios, Exhortos y Comunicaciones","p":["De todo exhorto, oficio o comunicación que se libre en los tribunales se dejará copia carbónica en las actuaciones respectivas, sin perjuicio del cumplimiento de lo dispuesto en el art. 53, inc. 2º del presente Reglamento."],"s":"De todo exhorto, oficio o comunicación que se libre en los tribunales se dejará copia carbónica en las actuaciones respectivas, sin perjuicio del cumplimiento de lo dispuesto en el art. 53, inc. 2º del presente Reglamento.","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":26,"l":"26","t":"Movimiento de Fondos","p":["Los fondos depositados judicialmente, sólo pueden ser removidos por extracciones o transferencias ordenadas por el Juez o Presidente del Tribunal a cuya orden se encuentren.","Ley IV-Nº 50. Depósitos Judiciales. (Anexo)"],"s":"Los fondos depositados judicialmente, sólo pueden ser removidos por extracciones o transferencias ordenadas por el Juez o Presidente del Tribunal a cuya orden se encuentren.","nt":["Ac. 36/21. Órdenes de Pago Judicial Electrónicas (Anexo)"]},{"n":27,"l":"27","t":"Extracción de Fondos","p":["Los autos que ordenen extracción de fondos podrán cumplirse de inmediato cuando mediare conformidad expresa de los interesados.","Ley IV-Nº 50. Depósitos Judiciales. (Anexo)"],"s":"Los autos que ordenen extracción de fondos podrán cumplirse de inmediato cuando mediare conformidad expresa de los interesados.","nt":["Ac. 36/21. Órdenes de Pago Judicial Electrónicas (Anexo)"]},{"n":28,"l":"28","t":"Unificación de Cuentas","p":["Las órdenes de pago se librarán contra una sola cuenta debiendo procederse previamente a la unificación de las existentes si hubieren varias.","Ley IV-Nº 50. Depósitos Judiciales. (Apéndice) Prohibición de Órdenes de Pago a Empleados de la Administración de Justicia"],"s":"Las órdenes de pago se librarán contra una sola cuenta debiendo procederse previamente a la unificación de las existentes si hubieren varias.","nt":[]},{"n":29,"l":"29","t":"No se librará orden de pago a favor de…","p":["No se librará orden de pago a favor de ningún empleado de la administración de justicia salvo para solventar créditos a su favor. Cuando hubiere que pagar impuestos o tasas, la orden se librará a favor de los jefes de la repartición encargada de cobrarlos."],"s":"No se librará orden de pago a favor de ningún empleado de la administración de justicia salvo para solventar créditos a su favor","nt":[]},{"n":30,"l":"30","t":"Transferencias","p":["Para las transferencias a cuentas bancarias deberá detallarse el nombre del beneficiario, la cantidad a transferir, el banco con especificación de casa o localidad y el número o libro y folio de la cuenta bancaria.","Ley IV-Nº 50. Depósitos Judiciales. (Anexo)"],"s":"Para las transferencias a cuentas bancarias deberá detallarse el nombre del beneficiario, la cantidad a transferir, el banco con especificación de casa o localidad y el número o libro y folio de la cuenta bancaria.","nt":["Ac. 36/21. Órdenes de Pago Judicial Electrónicas (Anexo)"]},{"n":31,"l":"31","t":"Entrega de Fondos Órdenes de Pago - Oficios","p":["La entrega de fondos se ordenará mediante el libramiento de órdenes de pago firmadas por el Juez y refrendados por el Secretario del Juzgado. Los formularios de órdenes de pago serán numerados, tanto en el cuerpo principal como en el talón, conteniendo ambas piezas las siguientes menciones: denominación del Juzgado y Secretaría; carátula del expediente; nombre del beneficiario y número de documento de identidad; importe de la libranza en letras y números como así también la fecha de dicho libramiento. Los talonarios o libretas de órdenes de pago estarán bajo el control del Juez o Secretario, quienes serán los únicos responsables del manejo y utilización de las órdenes de pago.","Exceptúase del sistema de extracción de fondos con órdenes de pago, los casos de pagos de cuotas periódicas por plazos determinados (alimentos, pensiones, rentas de incapaces y otros supuestos semejantes) en los que se librará oficio firmado por el Juez a la orden del beneficiario, consignándose el plazo de vigencia de la orden de pago. En todos los casos sin excepción el actuario deberá verificar y certificar la identidad de quien retire la orden de pago u oficio.","Ley IV-Nº 50. Depósitos Judiciales. (Anexo)"],"s":"La entrega de fondos se ordenará mediante el libramiento de órdenes de pago firmadas por el Juez y refrendados por el Secretario del Juzgado","nt":["Ac. 36/21. Órdenes de Pago Judicial Electrónicas (Anexo)"]},{"n":32,"l":"32","t":"Títulos","p":["Para la entrega, venta o canje de títulos, debe remitirse al Banco el recibo o resguardo correspondiente al depósito original. Si no fuera posible su remisión, se dejará expresa constancia de ello en el oficio.","En las órdenes de entrega de títulos el actuario certificará al pie del oficio la firma del beneficiario o, en su defecto, procederá como lo dispone el artículo anterior."],"s":"Para la entrega, venta o canje de títulos, debe remitirse al Banco el recibo o resguardo correspondiente al depósito original","nt":[]},{"n":33,"l":"33","t":"Reglamentaciones Impositivas","p":["En los giros y oficios de transferencias de fondos, se cumplirá lo dispuesto en las reglamentaciones impositivas pertinentes."],"s":"En los giros y oficios de transferencias de fondos, se cumplirá lo dispuesto en las reglamentaciones impositivas pertinentes.","nt":[]},{"n":34,"l":"34","t":"Pedidos de Regulación de Honorarios","p":["En los escritos en que se solicite regulación de honorarios deberá indicarse con precisión los trabajos a regular, practicando previamente, en su caso la clasificación de aquellos."],"s":"En los escritos en que se solicite regulación de honorarios deberá indicarse con precisión los trabajos a regular, practicando previamente, en su caso la clasificación de aquellos.","nt":[]},{"n":35,"l":"35","t":"Citas","p":["Las resoluciones y escritos no deberán contener citas ni fojas en blanco y mencionarán con precisión las normas, resoluciones y jurisprudencias que se invoquen."],"s":"Las resoluciones y escritos no deberán contener citas ni fojas en blanco y mencionarán con precisión las normas, resoluciones y jurisprudencias que se invoquen.","nt":[]},{"n":36,"l":"36","t":"Registro de Expedientes a Sentencia","p":["El Superior Tribunal, las Salas de las Cámaras de Apelaciones y los Juzgados llevarán un registro, que estará a disposición de las partes, de los expedientes en estado de sentencia clasificados separadamente por orden cronológico de entrada a sentencia, y por la índole de las causas. En esta segunda parte del registro serán especialmente señalados los juicios de preferente despacho."],"s":"El Superior Tribunal, las Salas de las Cámaras de Apelaciones y los Juzgados llevarán un registro, que estará a disposición de las partes, de los expedientes en estado de sentencia clasificados separadamente por orden…","nt":["Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":37,"l":"37","t":"Notificación de Sentencias Criminales","p":["Toda sentencia condenatoria en causa criminal deberá ser notificada personalmente al procesado.","Si la sentencia fuese recurrida y el tribunal de apelación tuviera distinto asiento, se emplazará al procesado para que nombre defensor en la alzada, bajo apercibimiento de designarse el oficial."],"s":"Toda sentencia condenatoria en causa criminal deberá ser notificada personalmente al procesado.","nt":[]},{"n":38,"l":"38","t":"Emplazamiento","p":["Cuando se concedan recursos para ante el Superior Tribunal, las Salas de las Cámaras de Apelaciones, o los Juzgados de Primera Instancia, el emplazamiento respectivo para comparecer ante ellos deberá ser señalado en la providencia que los otorgue y notificado a los interesados por cédula o personalmente. Exceptúanse los recursos concedidos por los tribunales con asiento en la Capital, siempre que las notificaciones a los litigantes pudieran hacerse dentro de los límites del ejido municipal."],"s":"Cuando se concedan recursos para ante el Superior Tribunal, las Salas de las Cámaras de Apelaciones, o los Juzgados de Primera Instancia, el emplazamiento respectivo para comparecer ante ellos deberá ser señalado en la…","nt":["Ac. 159/96. Recurso de Casación (Arts. 464 y 465 del CPP) Autoriza a Defensores de 2ª y 3ª Circ. a cumplir el","Ac. 118/97. Recurso de Queja (Art. 474). Amplía Ac. 159/96: Autoriza a cumplir el emplazamiento para su interposición de","Ac. 77/08. Recursos de Casación (Art. 467) Plazo para la emisión de votos y Acuerdo en caso de varios recursos de"]},{"n":39,"l":"39","t":"De la Libertad Condicional. Presentación de la Solicitud","p":["El penado que solicitare libertad condicional deberá formular su pedido por intermedio del establecimiento donde se hallare cumpliendo la pena, cuyas autoridades certificarán la autenticidad de la firma de aquel. Si el penado no supiere firmar, suplirá ese requisito estampando su impresión dígito-pulgar."],"s":"El penado que solicitare libertad condicional deberá formular su pedido por intermedio del establecimiento donde se hallare cumpliendo la pena, cuyas autoridades certificarán la autenticidad de la firma de aquel","nt":[]},{"n":40,"l":"40","t":"Informe Carcelario","p":["La solicitud será remitida al Tribunal que corresponde acompañada de los siguientes recaudos:","a) Informe sobre observación de los reglamentos carcelarios en cada uno de los establecimientos en que hubiere permanecido el solicitante, sea como procesado o como penado, con especificación de las sanciones disciplinarias que se le hubiesen impuesto, fechas y causas de las mismas y la calificación personal que registrara.","b) Informe sobre trabajo, educación, capacitación profesional, progresos alcanzados y apoyo moral y material con que pudiere contar el recurrente para el caso de acordársele libertad condicional.","c) Manifestación expresa del penado sobre su lugar de residencia si obtuviera su libertad condicional.","d) Observaciones que merezca la personalidad del peticionario."],"s":"La solicitud será remitida al Tribunal que corresponde acompañada de los siguientes recaudos: a) Informe sobre observación de los reglamentos carcelarios en cada uno de los establecimientos en que hubiere permanecido el…","nt":[]},{"n":41,"l":"41","t":"Cumplimiento de la Resolución","p":["Cuando se conceda la libertad condicional se librará oficio a la Dirección de Institutos Penales para que en el establecimiento donde se halle el recluso beneficiado con aquélla, se labre un acta compromisoria de las condiciones exigidas por el art. 13 del Código Penal, la que será suscripta por el penado y a quién además se le entregará una cédula con transcripción de esas condiciones y con las anotaciones que lo informan sobre su situación legal de liberado condicional. Cumplidos esos requisitos, de inmediato se lo pondrá en libertad.","El acta mencionada, con la constancia de haberse hecho efectiva la liberación, indicando día y hora será remitida al Tribunal por intermedio de la citada Dirección General para ser agregada al expediente. También la dirección del establecimiento respectivo comunicará enseguida al Patronato de Liberados la libertad del recluso, notificando previamente a éste que debe presentarse a la oficina de aquélla institución, dentro del término de tres días hábiles a los efectos de lo dispuesto en el inciso quinto del citado art. 13."],"s":"Cuando se conceda la libertad condicional se librará oficio a la Dirección de Institutos Penales para que en el establecimiento donde se halle el recluso beneficiado con aquélla, se labre un acta compromisoria de las…","nt":[]},{"n":42,"l":"42","t":"Nueva Solicitud","p":["Cuando se deniegue el pedido de libertad condicional, se oficiará a la mencionada dirección de Institutos Penales para que se notifique al penado recurrente y no se dará curso en el Tribunal a nueva solicitud de ese beneficio hasta que hubieran transcurrido seis meses a contar de la fecha de la denegatoria anterior. Para que ese plazo no se prolongue más de lo fijado, la dirección del establecimiento podrá iniciar los trámites de la nueva solicitud con prudente anticipación, pero sólo será remitida al Tribunal al vencimiento del término mencionado.","Con igual antelación podrán iniciarse los trámites de la primera solicitud a fin de que el Tribunal se halle en condiciones de resolverla inmediatamente que se hubieran cumplido los plazos fijados por el citado art. 13 y por el 53 del Código Penal.","Cuando la denegatoria del beneficio se fundare en la existencia de un proceso pendiente no regirá el plazo de seis meses fijados para la presentación de nueva solicitud, pudiendo formulársele inmediatamente de fallado aquél proceso en forma definitiva."],"s":"Cuando se deniegue el pedido de libertad condicional, se oficiará a la mencionada dirección de Institutos Penales para que se notifique al penado recurrente y no se dará curso en el Tribunal a nueva solicitud de ese beneficio…","nt":[]},{"n":43,"l":"43","t":"Renovación y Nuevo Cómputo","p":["El Tribunal que concedió el beneficio entenderá también en su revocatoria, cuando el liberado infringiere las cláusulas del acta de libertad condicional. En el caso se recomendará su captura. Si se lo aprehendiese el Tribunal respectivo practicará un nuevo cómputo de la pena con arreglo al primer párrafo del art. 15 del Código Penal, notificando al penado y a la Dirección de Institutos Penales.","También el Tribunal practicará un nuevo cómputo cuando de conformidad con el segundo párrafo del citado art. 15, resuelva no computar al liberado en el término de la condena todo o parte del tiempo que hubiere durado su libertad condicional, por haber infringido los incisos 2º, 3º ó 5º del art. 13. En este caso se notificará el nuevo cómputo al Patronato de Liberados y al liberado."],"s":"El Tribunal que concedió el beneficio entenderá también en su revocatoria, cuando el liberado infringiere las cláusulas del acta de libertad condicional","nt":[]},{"n":44,"l":"44","t":"Conocimiento de las Normas","p":["La Dirección de Institutos Penales adoptará las medidas que considere oportunas para que los reclusos de los diversos establecimientos carcelarios se hallen instruidos sobre las disposiciones de estas reglas y de los arts. 13 a 17, 52 y 53 del Código Penal."],"s":"La Dirección de Institutos Penales adoptará las medidas que considere oportunas para que los reclusos de los diversos establecimientos carcelarios se hallen instruidos sobre las disposiciones de estas reglas y de los arts. 13…","nt":[]},{"n":45,"l":"45","t":"Informes del Registro Nacional de Reincidencias","p":["Los informes que los jueces en lo penal deban requerir al Registro Nacional de Reincidencia, deberán ajustarse al trámite previsto por la Ley Nacional número 22.117* y decreto reglamentario 2004/80*. *Ley 22.117 y Dto. Regl. 2004/80 (Anexo)"],"s":"Los informes que los jueces en lo penal deban requerir al Registro Nacional de Reincidencia, deberán ajustarse al trámite previsto por la Ley Nacional número 22.117* y decreto reglamentario 2004/80*. *Ley 22.117 y Dto","nt":[]},{"n":46,"l":"46","t":"Estadísticas","p":["En los meses que por Acordada disponga el Superior Tribunal de Justicia, las Cámaras Jueces, Ministerios Públicos, Secretarias del Superior Tribunal, Jefes de Dependencias, y Direcciones de Oficinas, deberán remitir a la Secretaría a cargo de Estadísticas, las planillas de relevamiento de datos correspondientes al período inmediato anterior, no incluidas en el Software Estadístico.","Texto según Ac. 17/05 (Apéndice)"],"s":"En los meses que por Acordada disponga el Superior Tribunal de Justicia, las Cámaras Jueces, Ministerios Públicos, Secretarias del Superior Tribunal, Jefes de Dependencias, y Direcciones de Oficinas, deberán remitir a la…","nt":[]},{"n":47,"l":"47","t":"Secretaría de Tratamiento Jurídico Documental y Estadísticas","p":["La Secretaría de Tratamiento Jurídico Documental y Estadísticas, efectuará el control verificación, procesamiento y difusión de los datos estadísticos.","Texto según Ac. 17/05 (Anexo)"],"s":"La Secretaría de Tratamiento Jurídico Documental y Estadísticas, efectuará el control verificación, procesamiento y difusión de los datos estadísticos.","nt":[]},{"n":48,"l":"48","t":"Estadística de los Ministerios Públicos","p":["Derogado por Acordada Nº 17/05 (Anexo)"],"s":"Derogado por Acordada Nº 17/05 (Anexo)","nt":[]},{"n":49,"l":"49","t":"Estadística de los Juzgados de Paz","p":["Derogado por Acordada Nº 17/05 (Anexo)"],"s":"Derogado por Acordada Nº 17/05 (Anexo)","nt":[]},{"n":50,"l":"50","t":"Estadística de la Inspección de Justicia de Paz","p":["Derogado por Acordada Nº 17/05 (Anexo)"],"s":"Derogado por Acordada Nº 17/05 (Anexo)","nt":[]},{"n":51,"l":"51","t":"Estadística del Archivo General de los Tribunales","p":["Derogado por Acordada Nº 17/05 (Anexo)"],"s":"Derogado por Acordada Nº 17/05 (Anexo)","nt":[]},{"n":52,"l":"52","t":"Custodia de Expedientes","p":["Será responsable de la custodia de los expedientes, libros y documentos, el jefe de la oficina donde estuvieran, de acuerdo con los arts. 124, ap.2º y 126, inc.5º de la Ley IV-Nº 15, sin perjuicio de la responsabilidad que en cada caso pueda asignarse al personal bajo su dependencia."],"s":"Será responsable de la custodia de los expedientes, libros y documentos, el jefe de la oficina donde estuvieran, de acuerdo con los arts. 124, ap.2º y 126, inc.5º de la Ley IV-Nº 15, sin perjuicio de la responsabilidad que en…","nt":[]},{"n":53,"l":"53","t":"Libros de Tribunales","p":["Sin perjuicio de otros libros que la Ley o el Superior Tribunal dispongan, en cada Secretaría de Sala, Tribunal o Juzgado, deberán llevarse los siguientes:","1) de entradas y salidas de expedientes.","2) de oficios y comunicaciones, que podrán componerse con copias carbónicas.","3) de recibos de expedientes.","4) de sentencias.","5) de autos interlocutorios con fuerza de definitiva y autos varios.","6) de expedientes a notificación y asistencia profesional, conforme lo establecido en la"],"s":"Sin perjuicio de otros libros que la Ley o el Superior Tribunal dispongan, en cada Secretaría de Sala, Tribunal o Juzgado, deberán llevarse los siguientes: 1) de entradas y salidas de expedientes.","nt":["Acordada Nº 68/75* al que podrán tener acceso únicamente los profesionales y otros auxiliares de","Ac. 68/75. Anexo","Ac. 81/13. Libros de Cámara de Apelaciones Penal y de Menores. Art. 21 a 24. (Anexo)","Ac. 116/20: Art. 53 inc. 8 Libro de Registro de Armas","Ac.180/22. Expediente Electrónico. (Anexo)"]},{"n":54,"l":"54","t":"Avisos Comerciales","p":["En las oficinas de los tribunales y organismos del Poder Judicial no se usarán objetos con avisos comerciales o profesionales."],"s":"En las oficinas de los tribunales y organismos del Poder Judicial no se usarán objetos con avisos comerciales o profesionales.","nt":[]},{"n":55,"l":"55","t":"Comunicaciones al Superior Tribunal","p":["Las comunicaciones al Superior Tribunal o Salas de las Cámaras de Apelaciones y la elevación de expedientes de estas últimas, deberán efectuarse a la Secretaría que corresponda."],"s":"Las comunicaciones al Superior Tribunal o Salas de las Cámaras de Apelaciones y la elevación de expedientes de estas últimas, deberán efectuarse a la Secretaría que corresponda.","nt":[]},{"n":56,"l":"56","t":"Comunicaciones y Gestiones de Superintendencia","p":["Toda comunicación en materia administrativa y de superintendencia que sea dirigida al Superior Tribunal, deberá enviarse a la Secretaría de igual denominación.","Las gestiones ante los poderes públicos en materia de superintendencia deberán realizarse por intermedio del Superior Tribunal. Por excepción, los Magistrados, Funcionarios y empleados que desearan realizar gestiones de esta naturaleza de interés general deberán solicitar previamente autorización del Presidente del Superior Tribunal."],"s":"Toda comunicación en materia administrativa y de superintendencia que sea dirigida al Superior Tribunal, deberá enviarse a la Secretaría de igual denominación.","nt":[]},{"n":57,"l":"57","t":"Sanciones a Auxiliares de la Justicia, Litigantes y Particulares","p":["Los jueces de todos los grados y los Tribunales de Justicia podrán imponer sanciones de apercibimiento, multa de hasta una suma igual a la que perciba el empleado de la categoría inferior de la escala administrativa presupuestaria correspondiente al personal judicial y arrestos de hasta treinta días a los abogados, procuradores, litigantes y particulares por faltas cometidas contra su dignidad o decoro en las audiencias o escritos, o contra su autoridad o investidura u obstruyendo el curso de la justicia, o por observar un desempeño profesional moralmente reprochable en las causas que interviniesen. Iguales sanciones podrán ser aplicadas a los litigantes y sus representantes por falta de respeto y consideración recíprocas o carencias de mensura en las audiencias o dignidad de estilo en los escritos. Las sanciones de arresto impuestas por los Jueces de Paz no podrán exceder de diez días."],"s":"Los jueces de todos los grados y los Tribunales de Justicia podrán imponer sanciones de apercibimiento, multa de hasta una suma igual a la que perciba el empleado de la categoría inferior de la escala administrativa…","nt":[]},{"n":58,"l":"58","t":"Cumplimiento de las Sanciones - Recursos","p":["El arresto a que se refiere el art. anterior deberá cumplirse en dependencias del Tribunal o juzgado o en el domicilio del sancionado.","Las sanciones dispuestas, que no sean de apercibimiento, serán susceptibles de un recurso de revocatoria ante el Superior Tribunal si hubieren sido aplicadas por este organismo. Cuando fueren aplicadas por las restantes autoridades, procederá un recurso de revocatoria con apelación en subsidio para ante el Superior Tribunal, dentro del tercer día. El recurrente fundará el recurso en el momento de interponerlo. En todos los casos el recurso se concederá en efecto suspensivo."],"s":"El arresto a que se refiere el art. anterior deberá cumplirse en dependencias del Tribunal o juzgado o en el domicilio del sancionado.","nt":[]},{"n":59,"l":"59","t":"Sin perjuicio de las atribuciones y deberes que le…","p":["Sin perjuicio de las atribuciones y deberes que le señalan la Constitución, las leyes y las acordadas que el mismo dicte, el Superior Tribunal de Justicia se ajustará también a las que en el presente capítulo se determinan."],"s":"Sin perjuicio de las atribuciones y deberes que le señalan la Constitución, las leyes y las acordadas que el mismo dicte, el Superior Tribunal de Justicia se ajustará también a las que en el presente capítulo se determinan.","nt":[]},{"n":60,"l":"60","t":"Acuerdos Ordinarios y Extraordinarios","p":["El Superior Tribunal se reunirá en acuerdo ordinario los días hábiles que designe. El número de estos acuerdos se determinará conforme a lo que requieran las tareas del Tribunal. También podrán reunirse en acuerdo extraordinario en días hábiles o feriados cuando por circunstancias especiales fuere convocado por el Presidente o lo dispusiera la mayoría del Tribunal. Cuando en el transcurso de un acuerdo, en materia administrativa, alguno de los integrantes del Cuerpo se inhibiera para intervenir en el tratamiento de uno o más puntos del temario, la consideración del mismo continuará con los restantes miembros. Aceptada la inhibición, si el voto de los otros miembros fuere concordante en la decisión del punto, ello constituirá sin otro trámite, resolución válida. En caso contrario el Tribunal se integrará con el o los subrogantes que corresponda."],"s":"El Superior Tribunal se reunirá en acuerdo ordinario los días hábiles que designe","nt":[]},{"n":61,"l":"61","t":"Comisiones","p":["El Superior Tribunal podrá designar comisiones, contemplando la necesidad, como así también la naturaleza de los asuntos sometidos a su consideración."],"s":"El Superior Tribunal podrá designar comisiones, contemplando la necesidad, como así también la naturaleza de los asuntos sometidos a su consideración.","nt":[]},{"n":62,"l":"62","t":"Bandera Nacional Feriados, Asuetos y Homenajes","p":["La Bandera Nacional debe estar izada todos los días hábiles durante las horas de oficina. Además los días domingos y feriados durante todo el día.","El Superior Tribunal podrá disponer feriados y asuetos judiciales; la colocación de la bandera a media asta; la remisión de notas de condolencia; la concurrencia a actos determinados y, en general, las medidas de homenaje y condolencia que fuesen de costumbre. Cuando el Poder Ejecutivo disponga para la administración izar la bandera a media asta, la medida regirá también para el Poder Judicial.","Para la destrucción de símbolos patrios afectados al uso de dependencias judiciales, dados de baja, deberá procederse conforme a la Acordada Nº 50 año 1977*."],"s":"La Bandera Nacional debe estar izada todos los días hábiles durante las horas de oficina","nt":["Ac. 50/77. Anexo"]},{"n":63,"l":"63","t":"Nombramientos y Sanciones","p":["Corresponde al Superior Tribunal nombrar a los funcionarios y empleados del Poder Judicial en forma directa o a propuesta, conforme con lo dispuesto en las disposiciones pertinentes de la Constitución y las leyes y asimismo aplicar sanciones a los Magistrados, Funcionarios y empleados de la administración de justicia, con arreglo a lo que se determina en el presente Reglamento."],"s":"Corresponde al Superior Tribunal nombrar a los funcionarios y empleados del Poder Judicial en forma directa o a propuesta, conforme con lo dispuesto en las disposiciones pertinentes de la Constitución y las leyes y asimismo…","nt":[]},{"n":64,"l":"64","t":"Juicios Verbales, Audiencias e Informes in voce","p":["Los juicios verbales, audiencias o informes “in voce” se realizarán en los días de acuerdos ordinarios, salvo que se dispusiera lo contrario."],"s":"Los juicios verbales, audiencias o informes “in voce” se realizarán en los días de acuerdos ordinarios, salvo que se dispusiera lo contrario.","nt":[]},{"n":65,"l":"65","t":"Resoluciones del Superior Tribunal","p":["Las decisiones del Superior Tribunal de Justicia se adoptarán por mayoría de los jueces que lo integran, siempre que estos acordaren en la solución del caso. En caso de vacancia u otro impedimento de alguno de los integrantes del Cuerpo, éste se integrará con el subrogante legal. Exceptuase la situación prevista en el art. 44 de la Ley IV-Nº15 cuando al momento de pase a voto definitivo uno de los miembros se encontrare en uso de licencia; en ese caso, será válida la decisión de los restantes si fuera concordante en la solución del litigio, dejándose constancia formal por Secretaría. Cuando los jueces hábiles no concordaran en la solución del juicio, el Superior Tribunal será integrado en la forma establecida en el art. 68 del presente Reglamento.","Si llamados los autos para definitiva y al tiempo de pase a voto el ministro correspondiente se hallare en uso de licencia, la votación se continuará con los siguientes, pero reintegrado aquél, volverá el expediente para su voto, cualquiera fuere el orden y estado –con o sin voto- en que se encontrare; continuando posteriormente con los restantes Ministros en el orden que correspondiere.","En el caso de los recursos extraordinarios legislados por la Ley XII-Nº 6 (Antes Ley 2335), y a los fines del art. 44 primera parte de la Ley IV-Nº 15, se entenderá que el llamado de autos para sentencia o autos para definitiva se produce en la oportunidad prevista por el art. 292 del CPCyC; por lo cual, si la licencia del Juez reemplazado terminare antes de dicho llamado, el Magistrado se reintegrará al conocimiento de la causa, cesando cualquier integración anterior del Alto Cuerpo.","Salvo los casos previstos precedentemente, las decisiones del Superior Tribunal serán suscriptas por la totalidad de los miembros que lo integran.","Frente a dos posiciones que cuenten con igual número de opiniones coincidentes en un expediente, el titular de la tercera opinión deberá adherirse a una de las posiciones, sin perjuicio de dejar a salvo su opinión personal.","No se permitirá la abstención del deber de emitir voto, el que se emitirá en el orden determinado en el sorteo, pudiendo adherir al voto de cualquiera de los miembros que lo hubieren hecho."],"s":"Las decisiones del Superior Tribunal de Justicia se adoptarán por mayoría de los jueces que lo integran, siempre que estos acordaren en la solución del caso","nt":[]},{"n":66,"l":"66","t":"Procedimiento para la Emisión de Votos","p":["Si a la fecha del acuerdo definitivo en un expediente, el Ministro que emitió voto en primer término se encontrase en uso de licencia, hubiese dejado de pertenecer al Tribunal o tuviera otro impedimento, se efectuará nuevo sorteo para la emisión del primer voto entre los integrantes restantes.","Por vía de sorteo en cada caso, se establecerá el orden en que los Ministros intervendrán en cada asunto o causa. Los sorteos se harán de manera que el trabajo se distribuya equitativamente entre los mismos.","Cada miembro emitirá su voto en el orden predeterminado en el sorteo, pudiendo adoptarse en la redacción la forma impersonal. La opinión de la mayoría puede ser llevada por uno de los Ministros, y la de la minoría del mismo modo.","En los casos de nueva composición del Alto Cuerpo, el Ministro entrante ocupará la ubicación del saliente en el orden de emisión de votos en las causas que aún no hayan pasado a votación En las causas en trámite ante el Superior Tribunal de Justicia que no hubiesen tenido resolución, se dará intervención a los nuevos miembros en el orden de su incorporación."],"s":"Si a la fecha del acuerdo definitivo en un expediente, el Ministro que emitió voto en primer término se encontrase en uso de licencia, hubiese dejado de pertenecer al Tribunal o tuviera otro impedimento, se efectuará nuevo…","nt":[]},{"n":67,"l":"67","t":"Lista de Conjueces para Integrar el Superior Tribunal Cámaras de Apelaciones - Juzgados de Primera Instancia","p":["Antes del 15 de diciembre de cada año el Superior Tribunal procederá a formar las listas de conjueces para integrar el Alto Cuerpo, las Cámaras de Apelación y Juzgados de Primera Instancia, en los casos de vacancia, recusación, excusación o impedimento de sus miembros, titulares y subrogantes, las que se compondrán de abogados sorteados de las listas a que se refiere el artículo 48, inc. 27 de la Ley IV-Nº 15, en número de diez (10) conjueces para el Superior Tribunal, diez (10) para las Cámaras de Apelación, diez (10) para los Juzgados de Primera Instancia de la Primera Circunscripción Judicial y cinco (5) para los Juzgados de Primera Instancia de cada una de las demás circunscripciones judiciales de la Provincia. Si en alguna de las circunscripciones el número de abogados en condiciones de integrar las listas no alcanzara a cinco (5) o diez (10) según el caso, las nóminas se formarán complementándolas con abogados de otras circunscripciones."],"s":"Antes del 15 de diciembre de cada año el Superior Tribunal procederá a formar las listas de conjueces para integrar el Alto Cuerpo, las Cámaras de Apelación y Juzgados de Primera Instancia, en los casos de vacancia,…","nt":[]},{"n":68,"l":"68","t":"Integración del Superior Tribunal en asuntos de su competencia. Sorteo","p":["El Superior Tribunal de Justicia se integrará conforme a las previsiones de la Ley Orgánica, con:","1) El Procurador General.","2) Los integrantes de las Cámaras de Apelaciones, Fiscal y Defensor de Cámara, por sorteo entre los que reúnan las condiciones para ser miembros del Superior Tribunal de Justicia, siguiendo un sistema rotativo con exclusión de los ya sorteados, para volver a empezar cuando la lista estuviere agotada.","3) Por los abogados de la Matrícula que integren la lista de conjueces del Superior Tribunal de Justicia, siguiendo el mecanismo del artículo siguiente.","El sorteo a estos efectos se efectuará ante el Presidente y Secretario del Superior Tribunal de Justicia."],"s":"El Superior Tribunal de Justicia se integrará conforme a las previsiones de la Ley Orgánica, con: 1) El Procurador General.","nt":[]},{"n":69,"l":"69","t":"Integración del Superior Tribunal con Conjueces","p":["Si se tratare de la integración del Superior Tribunal con conjueces, la designación de los mismos se hará por el procedimiento de la desinsaculación por sorteo entre los que figuren en la nómina respectiva prevista por el artículo 67 de este Reglamento. Para el sorteo se observarán las normas señaladas en el artículo anterior."],"s":"Si se tratare de la integración del Superior Tribunal con conjueces, la designación de los mismos se hará por el procedimiento de la desinsaculación por sorteo entre los que figuren en la nómina respectiva prevista por el…","nt":[]},{"n":70,"l":"70","t":"Lista de Profesionales","p":["Entre el 1º y el 15 de diciembre de cada año, el Superior Tribunal procederá a confeccionar por sorteo las listas de escribanos, contadores públicos y martilleros que deban actuar durante el año siguiente en las designaciones de oficio. Así también confeccionarán la nómina de martilleros que intervendrán como rematadores en los juicios de concursos y quiebras."],"s":"Entre el 1º y el 15 de diciembre de cada año, el Superior Tribunal procederá a confeccionar por sorteo las listas de escribanos, contadores públicos y martilleros que deban actuar durante el año siguiente en las designaciones…","nt":[]},{"n":71,"l":"71","t":"Texto según Ac. 132/95 Procedimientos para la Confección de las Listas","p":["Para la confección de las listas de profesionales auxiliares de la justicia, los interesados, deberán presentar en el mes de octubre de cada año, su solicitud al Juzgado de Primera Instancia en lo Civil y Comercial en tumo de la circunscripción judicial de su domicilio real. Dichas solicitudes serán elevadas por los juzgados al Superior Tribunal de Justicia, antes del 30 de noviembre.","Antes del 15 de diciembre de cada año, el Superior Tribunal de Justicia procederá a la confección de listas, siguiendo un orden numérico correlativo al de la presentación de los profesionales inscriptos en una misma especialidad (martilleros de oficio y para concursos, contadores de oficio y peritos en general), que no excedan de cien (100), y en tal supuesto se limitarán las mismas a ese número mediante sorteo. Las listas de escribanos se compondrán de diez (10) escribanos para la Primera circunscripción Judicial; seis (6) para las Segunda, Tercera, Cuarta y Quinta Circunscripciones Judiciales de la Provincia, sorteados de las nóminas que se confeccionarán, por circunscripciones, de los escribanos titulares y adscriptos con asiento en cada una de ellas. Habrá tantas listas de cada especialidad como circunscripciones judiciales, debiendo integrarse las mismas con profesionales radicados en las respectivas circunscripciones. Para la integración de las listas de quince (15) síndicos titulares y diez (10) suplentes para cada uno de los juzgadas de primera instancia en lo Civil, Comercial y Laboral de las distintas circunscripciones a que se refiere el art. 253 de la Ley 24.522, el Consejo Profesional de Ciencias Económicas remitirá al Superior Tribunal, antes del 15 de noviembre de cada año, la nómina de profesionales que reúnan las condiciones legales.","Texto según Ac. 183/21 REGISTRO DE SINDICOS CONCURSALES:","Artículo Primero: Cada Cámara de Apelación con competencia en la materia de las distintas Circunscripciones Judiciales de la Provincia, llevarán un registro con destino a la inscripción de estudios contables y profesionales para actuar como síndicos concursales, conforme lo previsto por el inc.1º del art. 253 de la Ley 24.522. Dicho registro constará de dos libros: A) de los Estudios Contables y B) Contadores Públicos, en los que inscribirán por orden alfabético a los estudios contables y a los profesionales respectivamente, que reúnan los requisitos establecidos en la disposición legal citada, debiendo observarse asimismo lo previsto en el art. 27 de la Ley IV-Nº 15.","Deberá además, confeccionarse un legajo personal para cada síndico – individuo y estudio – integrantes de las listas de sorteo de síndicos titulares y suplentes, en el cual se registrarán los concursos y quiebras en que resultaren sorteados y designados, sanciones impuestas y todo otro dato que se considere pertinente para evaluar el desenvolvimiento profesional.","Artículo Segundo: La nómina de los estudios contables y contadores inscriptos será comunicada al Consejo Profesional de Ciencias Económicas de la Provincia, a fin de que suministre por escrito en el término de diez (10) días corridos, las observaciones e informes que estime pertinentes, con el objeto de alcanzar la más adecuada integración de las listas.","Artículo Tercero: En la confección de las listas cuatrianuales – art. 253 inc. 2º y 3º de la Ley 24.522-, las Cámaras de Apelaciones reglamentarán el procedimiento para la formación de las mismas, y problemas conexos al ejercicio de la superintendencia sobre ellos – art. 255, siguiente y concordantes de la citada Ley-, debiendo, a tales fines en lo posible coordinar entre las Cámaras competentes, las normas que regirán el trámite de inscripción y posterior confección de listas. Ello, sin perjuicio del ejercicio de la superintendencia que, sobre toda la administración de justicia, compete al Superior Tribunal de Justicia – (Ley IV-Nº 15).","Artículo Cuarto: Antes del 15 de Diciembre de cada año, las Cámaras de Apelaciones procederá a la formación de las listas, para las Circunscripciones Judiciales respectivas en acto público y serán remitidas a los Juzgados los que a su vez desinsacularán los estudios contables y/o profesionales en cada oportunidad en que sea requerida su designación – art. 253 inc. cuatro, siguientes y concordantes de la Ley 24.522.","Artículo Quinto: Tuvo aplicación por única vez para la primera confección de listas.","REGISTRO DE ENAJENADORES Y ESTIMADORES:","Artículo Sexto: La Cámara de Apelaciones en lo Civil y Comercial de la Primera Circunscripción Judicial, al igual que en la Segunda y Tercera Circunscripción Judicial – en lo Civil, Comercial y Laboral – habilitarán un registro de enajenadores y estimadores –arts. 261, 262 y 291 de la Ley 24.522 -, a tal fin se llevarán los libros esas denominaciones en los que se anotarán los datos personales de los inscriptos, sus documentos habilitantes y los datos específicamente exigidos en su caso por la Ley.","Texto según Ac. Nº 132/95 y 139/95 Acdo. Cám. Civil Posadas Nº 10/07. Reglamento para 1ra y 4ta Circunscripción. (Anexo) Acdo. Cám. Civil Oberá Nº 01/96. Reglamento para 2da Circunscripción. (Anexo) Acdo. Cám. Civil Eldorado Nº 14/96. Reglamento para 3ra Circunscripción. (Anexo)"],"s":"Para la confección de las listas de profesionales auxiliares de la justicia, los interesados, deberán presentar en el mes de octubre de cada año, su solicitud al Juzgado de Primera Instancia en lo Civil y Comercial en tumo de…","nt":[]},{"n":72,"l":"72","t":"Integración de Listas","p":["En los casos en que la nómina de los profesionales inscriptos y presentados no supere en número de dos, se integrará en la siguiente forma: de la lista de la Primera Circunscripción judicial se desinsacularán en forma excluyente, tres para cada una de las circunscripciones que así lo requieran."],"s":"En los casos en que la nómina de los profesionales inscriptos y presentados no supere en número de dos, se integrará en la siguiente forma: de la lista de la Primera Circunscripción judicial se desinsacularán en forma…","nt":[]},{"n":73,"l":"73","t":"Autoridades de Feria en el Superior Tribunal","p":["Con quince días de anticipación a la feria ordinaria de cada año, el Superior Tribunal designará a los Magistrados y Funcionarios que actuarán durante dichas ferias, consultando en lo posible la opinión de los mismos y , en caso de no haber acuerdo, por sorteo.","Serán Magistrados y Funcionarios de feria en el Superior Tribunal el Presidente Titular o uno de sus subrogantes legales, y un Secretario. Se designarán asimismo los empleados necesarios para el servicio judicial y administrativo."],"s":"Con quince días de anticipación a la feria ordinaria de cada año, el Superior Tribunal designará a los Magistrados y Funcionarios que actuarán durante dichas ferias, consultando en lo posible la opinión de los mismos y , en…","nt":["Ac. 80/09- Establece que la Feria Judicial de verano se extiende desde el día 26 de Diciembre hasta el 31 de Enero, ambas"]},{"n":74,"l":"74","t":"Autoridades de Feria en las Cámaras de Apelaciones, Juzgados y otros Organismos","p":["En las Cámaras de Apelaciones desempeñarán sus funciones como Camaristas y Funcionarios de feria, el Presidente Titular o uno de sus subrogantes legales y un Secretario, en cada una de ellas.","La Sala de feria quedará constituida con los citados Magistrados, o en su caso, con los Magistrados, Funcionarios o conjueces que deban intervenir por subrogación legal.","EN LA PRIMERA CIRCUNSCRIPCIÓN JUDICIAL: desempeñarán sus funciones como Magistrados y Funcionarios de feria un Juez con competencia en lo Civil y Comercial; uno en Familia; uno en lo Laboral y otro, además en el Fuero Penal; tres (3) Fiscales, a saber: a) dos (2) con asiento en Posadas: un (1) Agente Fiscal de Instrucción y un (1) Fiscal que actuará en los otros fueros; b) un (1) Agente Fiscal de Instrucción en Apóstoles y Alem, -conforme acuerdo de los mismos, los que asegurarán que no se afecte el servicio- que entenderá en las actuaciones que tramiten en el período indicado, en las dependencias judiciales con asiento en las ciudades citadas, y tres (3) Defensores de Primera Instancia a saber: a) dos (2) con asiento en Posadas: uno del fuero Penal y el otro del fuero Civil, Comercial y Laboral; b) uno (1) de fuero Universal de Apóstoles y/o Leandro N. Alem, que entenderá en las actuaciones que tramiten en el período indicado, en las dependencias judiciales con asiento en las ciudades citadas; un Secretario en lo Civil, Comercial y Laboral y un Secretario en lo Penal.","EN LA SEGUNDA Y TERCERA CIRCUNSCRIPCIONES, un Juez con competencia en lo Civil, Comercial y Laboral y otro en lo Penal, un Fiscal y un Defensor de cada fuero, un Secretario en lo Civil, Comercial y Laboral y un Secretario de Familia y otro de fuero Penal. (Ac. 44/11 y Ac. 102/15) EN LA CUARTA CIRCUNSCRIPCIÓN JUDICIAL, un Juez, un representante del Ministerio Público y un Secretario.","JUZGADOS DE PAZ: En los Juzgados de Paz, un Juez titular o suplente, y un secretario si lo hubiere y fuera necesario.","ORGANISMOS AUXILIARES En el Archivo General, Dirección de Administración, en la Inspección de Justicia de Paz, en la Biblioteca y en la Oficina de Mandamientos y Notificaciones también se designarán los Funcionarios durante las referidas ferias.","Los Funcionarios y empleados que se desempeñan durante las ferias serán designados consultando las necesidades del servicio, a propuesta de los respectivos jueces y jefes de dependencias.","Texto según Ac. 54/98, Ac. 29/01, Ac. 103/02, Ac. 94/06, Ac. 44/11, Ac. 102/15."],"s":"En las Cámaras de Apelaciones desempeñarán sus funciones como Camaristas y Funcionarios de feria, el Presidente Titular o uno de sus subrogantes legales y un Secretario, en cada una de ellas.","nt":["Ac. 81/13. Cámara de Apelaciones en lo Penal y de Menores. Art. 26 (Anexo)"]},{"n":75,"l":"75","t":"Inspecciones a cargo del Presidente, Ministros o Procurador General","p":["Además de las inspecciones que realicen las Cámaras o el Superior tribunal, el Presidente los Ministros y el Procurador general del Alto Cuerpo, podrán constituirse en el momento que lo consideren oportuno en cualquiera de los organismos judiciales o administrativos del Poder Judicial, para verificar el cumplimiento de los horarios, observar la marcha de la labor que se realiza en los mismos o tomar las medidas que estimen convenientes, debiendo informar oportunamente al Superior Tribunal."],"s":"Además de las inspecciones que realicen las Cámaras o el Superior tribunal, el Presidente los Ministros y el Procurador general del Alto Cuerpo, podrán constituirse en el momento que lo consideren oportuno en cualquiera de los…","nt":[]},{"n":76,"l":"76","t":"La presidencia del Superior Tribunal de Justicia, será ejercida…","p":["La presidencia del Superior Tribunal de Justicia, será ejercida durante dos (2) años, por uno de sus miembros designados por mayoría absoluta de los integrantes de ese Tribunal, pudiendo ser reelecto.","Dicha elección se realizará en el mes de Diciembre del año en que corresponda elegir. Entrará en funciones el 1º de Enero del año siguiente al de su elección. En la misma época pero anualmente serán designados los subrogantes que lo reemplazarán en los casos de ausencia o impedimento transitorio.-"],"s":"La presidencia del Superior Tribunal de Justicia, será ejercida durante dos (2) años, por uno de sus miembros designados por mayoría absoluta de los integrantes de ese Tribunal, pudiendo ser reelecto.","nt":[]},{"n":77,"l":"77","t":"Conf. art. 38 de la Ley IV-Nº 15 Representación y Protocolo","p":["El Presidente representa al Superior Tribunal de Justicia en los actos protocolares ante los otros poderes públicos y, en todas sus relaciones con funcionarios, entidades o personas.","En los actos protocolares se observarán las disposiciones del ceremonial administrativo.","Credenciales de Identificación - Medallas Acreditativas del Cargo desempeñado - Carnet Profesional"],"s":"El Presidente representa al Superior Tribunal de Justicia en los actos protocolares ante los otros poderes públicos y, en todas sus relaciones con funcionarios, entidades o personas.","nt":[]},{"n":78,"l":"78","t":"La Presidencia del Superior Tribunal de Justicia otorgará a…","p":["La Presidencia del Superior Tribunal de Justicia otorgará a Magistrados y Funcionarios del Poder Judicial credenciales identificatorias que se confeccionarán en cuero, las que deberán ser devueltas cuando el portador deje de desempeñar el cargo que ocupaba al serle otorgado dicho documento.","El Superior Tribunal podrá hacer acuñar medallas acreditativas del cargo respectivo a los Ministros del Superior Tribunal, Procurador General, Camaristas, Fiscal y Defensor de Cámara y Jueces de Primera Instancia.","El Superior Tribunal podrá otorgar carnet identificatorio a los empleados del Poder Judicial que lo soliciten explicando los motivos, el que tendrá una vigencia de cinco años y será confeccionado en tela y deberá contener fotografía y firma del interesado, con indicación de su número, apellido, nombre y cargo, dependencia, número del documento de identidad y domicilio. Dicho documento deberá ser devuelto cuando el empleado deje de pertenecer al Poder Judicial.","Los carnets de los profesionales que actúen como auxiliares de la Justicia y cuya matrícula lleva el Superior Tribunal, será otorgada por el Presidente del Cuerpo. Dicha credencial deberá contener: 1) apellido y nombre, 2) profesión, 3) número de inscripción en la respectiva matrícula y fecha, 4) fotografía tipo cédula de identidad, 5) número de documento de identidad del interesado, 6) fecha de otorgamiento del carnet, 7) firma del profesional y 8) firma y sello del Presidente del Superior Tribunal.","Las características generales de los distintivos y credenciales a que se refiere el presente artículo, serán determinadas por el Presidente."],"s":"La Presidencia del Superior Tribunal de Justicia otorgará a Magistrados y Funcionarios del Poder Judicial credenciales identificatorias que se confeccionarán en cuero, las que deberán ser devueltas cuando el portador deje de…","nt":["Ac. 53/03. Prohíbe el uso de chapas identificatorias en los vehículos particulares de Magistrados y Funcionarios."]},{"n":79,"l":"79","t":"Firma","p":["El Presidente del Superior Tribunal firma las comunicaciones dirigidas al Presidente de la Nación, a los Gobernadores de Provincia, a los Ministros y a las autoridades superiores militares y eclesiásticas, las referentes a embargos o disposición o manejos de fondos de carácter litigioso los cheques judiciales y las demás comunicaciones que estime conveniente. Legaliza la firma de los Secretarios del Superior Tribunal de Justicia.","Despachos y Providencias."],"s":"El Presidente del Superior Tribunal firma las comunicaciones dirigidas al Presidente de la Nación, a los Gobernadores de Provincia, a los Ministros y a las autoridades superiores militares y eclesiásticas, las referentes a…","nt":[]},{"n":80,"l":"80","t":"Resoluciones Ad–Referéndum. Recursos","p":["Preside y dirige el trámite en los asuntos del Superior Tribunal, provee con su sola firma el despacho de trámite, pudiendo disponer la devolución de los escritos con defectos de forma o con peticiones notoriamente improcedentes. En caso de urgencia podrá disponer otras providencias adreferéndum del Cuerpo, dando cuenta en la primera oportunidad. Contra sus providencias procede el recurso de apelación dentro del tercero día para ante el Superior Tribunal."],"s":"Preside y dirige el trámite en los asuntos del Superior Tribunal, provee con su sola firma el despacho de trámite, pudiendo disponer la devolución de los escritos con defectos de forma o con peticiones notoriamente improcedentes","nt":[]},{"n":81,"l":"81","t":"Facultades del Presidente en Materia de Contrataciones","p":["El Presidente autorizará y aprobará las contrataciones dentro de la competencia que se establece en el capítulo destinado a reglamentar el Régimen de Contrataciones."],"s":"El Presidente autorizará y aprobará las contrataciones dentro de la competencia que se establece en el capítulo destinado a reglamentar el Régimen de Contrataciones.","nt":[]},{"n":82,"l":"82","t":"Dirección de Audiencias y Acuerdos","p":["Preside las audiencias públicas, pudiendo los demás Ministros hacer uso de la palabra con su venia. Le corresponde la dirección de los acuerdos."],"s":"Preside las audiencias públicas, pudiendo los demás Ministros hacer uso de la palabra con su venia","nt":[]},{"n":83,"l":"83","t":"Subrogación en la Presidencia del Superior Tribunal","p":["En los casos de ausencia, recusación, excusación u otros impedimentos el Presidente será sustituido por los subrogantes legales. Si el titular y sus subrogantes legales tuviesen impedimentos para presidir el Superior Tribunal en alguna causa judicial o de la esfera administrativa y de superintendencia, los reemplazarán en dicho carácter los Magistrados y Funcionarios conforme al orden establecido en el art. 43 de la Ley IV-Nº 15 y los arts. 68 y 69 del presente Reglamento."],"s":"En los casos de ausencia, recusación, excusación u otros impedimentos el Presidente será sustituido por los subrogantes legales","nt":[]},{"n":84,"l":"84","t":"Policía del Superior Tribunal","p":["La autoridad policial que actúe en la sede del Superior Tribunal dependerá del Presidente quién podrá disponer respecto de ella las medidas que estime conveniente. Dicha autoridad la ejerce directamente o por intermedio de los Secretarios Administrativos, de Superintendencia y Judicial.-"],"s":"La autoridad policial que actúe en la sede del Superior Tribunal dependerá del Presidente quién podrá disponer respecto de ella las medidas que estime conveniente","nt":["Ac. 158/98. Seguridad y Vigilancia de Organismos Judiciales (Anexo)"]},{"n":85,"l":"85","t":"El Superior Tribunal tendrá dos Secretarías, una Administrativas y…","p":["El Superior Tribunal tendrá dos Secretarías, una Administrativas y de Superintendencia, y otra Judicial, las que intervendrán respectivamente en las causas pertinentes que se ventilen ante dicho Tribunal.","Cumplirán sus funciones en horario matutino, y vespertino cuando las necesidades del servicio así lo requieran, en la forma que determine el
