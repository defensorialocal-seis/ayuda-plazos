n:","1) Formular los asientos contables en el Registro Analítico de la Ejecución Presupuestaria, en las distintas etapas del gasto y mantenerlos actualizados.","2) Efectuar los libramientos de las Órdenes de Cargo y de Pago.","3) Confeccionar mensualmente el Estado de Ejecución Presupuestaria para ser remitido a la Contaduría General y al Tribunal de Cuentas de la Provincia, la Ejecución Presupuestaria Anual y la clasificación de gastos por finalidad y función, a los efectos del cierre del Ejercicio.","4) Confeccionar anualmente la Carpeta de Estados Contables de la Cuenta de Presupuesto General y de Fondo de Justicia.","5) Llevar un registro de Resoluciones y Disposiciones por orden numérico y correlativo.","6) Confeccionar la documentación relativa a Caja Chica y Fondos Fijos.","7) Registrar y remitir bajo constancia los expedientes al Departamento de Tesorería del Poder Judicial para su cargo y registrar los Partes Diarios de Tesorería.","8) Enviar anualmente al Tribunal de Cuentas de la Provincia copia de las Acordadas y Resoluciones emitidas por el Excelentísimo Superior Tribunal de Justicia.","9) Realizar todo informe sugerido y/o requerido por la Autoridad Superior pertinente sobre su área de competencia."],"s":"Sector Contabilidad: Su misión será efectuar la registración contable de los gastos e inversiones que efectúe el Poder Judicial, con sus partidas correspondientes, sobre la base de los créditos del Presupuesto vigente de la…","nt":[]},{"n":216,"l":"216","t":"Sector Liquidaciones de Haberes","p":["Sector Liquidaciones de Haberes: Su Misión será la liquidación de los haberes del Personal del Poder Judicial y sus funciones serán:","1) Efectuar la carga de los Partes de Novedades mensuales y suplementarios de sueldos.","2) Realizar la liquidación de haberes correspondientes a la totalidad de los agentes del Poder Judicial con arreglo a las disposiciones del presupuesto.","3) Realizar las retenciones que correspondan por embargos, petición alimentos, reintegros por liquidaciones y pagos indebidos, Impuestos nacionales o provinciales y cualquier otra retención que sea dispuesta por la normativa legal vigente.","4) Llevar un registro de Altas y Bajas de Personal.","5) Controlar el Pedido de Fondos con los Resúmenes de Conceptos.","6) Elevar mensualmente al Director todos los informes salariales establecidos por la normativa del Estado Provincial.","7) Mantener actualizados los legajos personales de los agentes del Poder Judicial.","8) Realizar las Certificaciones de Servicios requeridas para los trámites jubilatorios, préstamos u otras gestiones.","9) Confeccionar los formularios, certificaciones y demás trámites necesarios para el cobro de los Seguros.","10) Elevar mensualmente a la Tesorería un listado de altas y bajas de Embargos y Peticiones de Alimentos.","11) Realizar todo tipo de informes inherentes al Sector."],"s":"Sector Liquidaciones de Haberes: Su Misión será la liquidación de los haberes del Personal del Poder Judicial y sus funciones serán: 1) Efectuar la carga de los Partes de Novedades mensuales y suplementarios de sueldos.","nt":[]},{"n":217,"l":"217","t":"Sector Rendiciones de Cuentas","p":["Sector Rendiciones de Cuentas: Su Misión será efectuar las rendiciones finales de gastos y recursos de las Cuentas de Presupuesto General y de Fondo de Justicia en forma mensual y anual para el Cierre del Ejercicio y sus funciones serán:","1) Controlar el Parte Diario de Cargos y Descargos de las dos cuentas: Presupuesto General y Fondo de Justicia que elabora Tesorería.","2) Armar los legajos controlando el Parte con los Expedientes rendidos por Tesorería.","3) Elaborar el Balance Mensual acompañado de: Resumen de Gastos Rendidos, Detalle de Gastos discriminados por Partidas, Reintegros, Residuos Pasivos, Transferencias de Tesorería General de la Provincia, Recaudaciones de la Cuenta de Fondo de Justicia, Plazos Fijos y Detalle de Responsables y Sub-responsables.","4) Desglosar, foliar, colocar sello del mes a todas las hojas, boletas y comprobantes del Expediente, controlando los mismos.","5) Remitir al Tribunal de Cuentas los legajos correspondientes con las Planillas de Rendición Mensual.","6) Elaborar la Planilla de Movimientos de Responsables de las dos Cuentas para incorporar a la Carpeta del Cierre del Ejercicio del Poder Judicial.","7) Archivar la documentación del Ejercicio y de los Ejercicios anteriores.","8) Efectuar todos los informes requeridos y/o sugeridos por la Autoridad Superior pertinente inherentes a su sector."],"s":"Sector Rendiciones de Cuentas: Su Misión será efectuar las rendiciones finales de gastos y recursos de las Cuentas de Presupuesto General y de Fondo de Justicia en forma mensual y anual para el Cierre del Ejercicio y sus…","nt":[]},{"n":218,"l":"218","t":"Sector Patrimonio","p":["Sector Patrimonio: Su Misión será intervenir en todo lo relacionado con los Bienes Inventariables: recepción, registración, depósito y entrega de los mismos, teniendo a su cargo el control de la totalidad del Patrimonio del Poder Judicial y sus funciones serán:","1) Mantener actualizada la contabilidad patrimonial utilizando formularios idénticos a los que tiene en uso el Departamento de Bienes Fiscales de la Contaduría General e informar mensualmente el movimiento registrado.","2) Intervenir en la recepción de todos los bienes patrimoniales inventariables adquiridos, labrando las correspondientes Actas definitivas de Recepción y controlando que las mismas cumplan con lo estipulado.","3) Registrar el alta de los bienes adquiridos utilizando el nomenclador establecido, asignándole el número de Inventario y entregando los mismos a la dependencia solicitante.","4) Registrar las bajas de los bienes inventariables, las que serán informadas por los responsables de cada dependencia en el formulario correspondiente.","5) Llevar diariamente el movimiento patrimonial por orden numérico de entrada, por tipo de elemento y por dependencia.","6) Llevar el control periódico de las existencias y estado de conservación de los bienes patrimoniales.","7) Mantener actualizado el estado de los pedidos de elementos inventariables pendientes por falta de existencia, así como el cuadro de necesidades previsibles a corto, mediano y largo plazo, ambos por Dependencia y por tipo de bien.","8) Atender los requerimientos de bienes inventariables del Poder Judicial de todas las dependencias de Capital y del Interior.","9) Requerir al responsable de cada dependencia la realización de un inventario anual de los elementos que se encuentran bajo su custodia (bajas, roturas, reposiciones).","10) Realizar inspecciones anuales en cada dependencia a fin de efectuar el inventario de los bienes.","11) Realizar las gestiones relacionadas con el patentamiento y seguros de los rodados que conforman el parque automotor del Poder Judicial y los impuestos inmobiliarios que gravan a los bienes inmuebles del Poder Judicial.","12) Realizar todo informe requerido por la Superioridad."],"s":"Sector Patrimonio: Su Misión será intervenir en todo lo relacionado con los Bienes Inventariables: recepción, registración, depósito y entrega de los mismos, teniendo a su cargo el control de la totalidad del Patrimonio del…","nt":[]},{"n":219,"l":"219","t":"Sector Suministros","p":["Sector Suministros: Su Misión será intervenir en todo lo relacionado con los Bienes de consumo: recepción, registración, depósito y entrega de los mismos y sus funciones son:","1) Mantener actualizada la contabilidad de los bienes de consumo que tiene a su cargo, registrando diariamente los bienes de consumo recibidos y entregados.","2) Recibir las solicitudes de bienes de las Dependencias del Poder Judicial, verificar si se poseen los bienes en stock y en caso contrario solicitar la compra de los mismos elevando la Orden de Provisión.","3) Intervenir en la recepción de los bienes no inventariables labrando las correspondientes Actas definitivas de recepción y controlando que las mismas cumplan con lo estipulado.","4) Proveer los elementos que tiene a su cargo a las distintas dependencias que lo solicitan, enviando la mercadería requerida por los responsables autorizados y confeccionar el remito de materiales entregados.","5) Mantener en depósito un stock permanente y suficiente de elementos de uso frecuente y previsible.","6) Llevar un registro permanente y actualizado del inventario en unidades de los bienes de consumo que se encuentren en el depósito y almacenar los elementos bajo su responsabilidad.","7) Llevar la estadística a fin de informar periódicamente el consumo por Dependencias y por tipo de bien señalando los excesos en los niveles de consumo que eventualmente constate.","8) Planificar semestralmente las compras a realizarse en base a la estadística de consumo de cada uno de los bienes.","9) Archivar las copias de la documentación emanada por el Sector.","10) Realizar todo tipo de informes requerido por la Superioridad."],"s":"Sector Suministros: Su Misión será intervenir en todo lo relacionado con los Bienes de consumo: recepción, registración, depósito y entrega de los mismos y sus funciones son: 1) Mantener actualizada la contabilidad de los…","nt":[]},{"n":220,"l":"220","t":"Sector Compras","p":["Sector Compras: Su Misión será organizar y atender las Compras, adquisiciones, prestaciones de servicios y contrataciones necesarias para el normal funcionamiento del Poder Judicial y sus funciones serán:","1) Tramitar las Licitaciones, las compras directas y los gastos menores.","2) Diligenciar los llamados a Licitación Publica y Privada sobre la base de lo estipulado en la Ley de Contabilidad, llevar a cabo la tarea administrativa de la venta de Pliegos de las Licitaciones y de la apertura de los mismos.","3) Controlar la aplicación del Régimen de Contrataciones y de las Cláusulas Generales y Particulares en el Pliego de Condiciones.","4) Asistir y colaborar con la Comisión de Preadjudicación, la que deberá ser designada expresamente para cada Acto por el Excelentísimo Superior Tribunal de Justicia.","5) Mantener actualizado el archivo de Registro de Proveedores de la Provincia, debiendo para ello requerir periódicamente las novedades al mismo.","6) Programar las compras a realizar en el ejercicio inmediato posterior al que se esta ejecutando a fin de incluirlas en el anteproyecto de necesidades y prioridades.","7) Recibir los pedidos de compras y de ser necesario, previo informe del Sector u oficina técnica que corresponda, solicitar las cotizaciones de precios de los bienes, pedir los saldos de las partidas al sector Contabilidad y elevar a la Superioridad para su autorización, luego de la cual se confeccionará la Orden de Provisión.","8) Llevar un registro de las compras mensuales.","9) Realizar todo tipo de informes requeridos por la Superioridad."],"s":"Sector Compras: Su Misión será organizar y atender las Compras, adquisiciones, prestaciones de servicios y contrataciones necesarias para el normal funcionamiento del Poder Judicial y sus funciones serán: 1) Tramitar las…","nt":["Ac. 60/14. Pliego de Bases y Condiciones para Contratación Directa. (Anexo)","Ac. 54/22. Pliego de Bases y Condiciones para la adquisición de Bienes y Servicios. (Anexo)"]},{"n":221,"l":"221","t":"Sector Mesa de Entradas","p":["Sector Mesa de Entradas: Su Misión será llevar un registro interno y externo de las entradas y salidas de toda la documentación que ingresa y egresa a la Dirección de Administración y sus funciones serán:","1) Llevar un registro numérico de toda la correspondencia y documentación recibida que tenga trámite en la Dirección de Administración.","2) Recibir la correspondencia y efectuar el envío de la documentación que se le entregue al efecto.","3) Actuar como gestor interno de la Dirección de Administración para lo cual llevará un Registro de Pases Internos entre los diferentes sectores de la misma.","4) Realizar el armado de expedientes administrativos contables, confeccionando la carátula de los mismos y dándoles el número correspondiente de la Dirección de Administración, verificando la foliatura y todo lo referente a la validez del Expediente.","5) Evacuar las consultas sobre el movimiento de los Expedientes.","6) Realizar todo informe requerido por la Superioridad."],"s":"Sector Mesa de Entradas: Su Misión será llevar un registro interno y externo de las entradas y salidas de toda la documentación que ingresa y egresa a la Dirección de Administración y sus funciones serán: 1) Llevar un registro…","nt":[]},{"n":222,"l":"222","t":"Sector Secretaría","p":["Sector Secretaría: Su Misión será actuar como enlace entre el Director de Administración y los demás sectores en que se estructura la Dirección de Administración y como nexo entre la Dirección de Administración y el Superior Tribunal de Justicia. Sus funciones serán:","1) Realizar todos los trabajos de redacción de notas, disposiciones, resoluciones, proyectos de"],"s":"Sector Secretaría: Su Misión será actuar como enlace entre el Director de Administración y los demás sectores en que se estructura la Dirección de Administración y como nexo entre la Dirección de Administración y el Superior…","nt":["Acordadas, oficios, pases, informes, etc."]},{"n":223,"l":"223","t":"Sector Mantenimiento","p":["Sector Mantenimiento: Derogado por la Ac. 81/07, que crea la Dirección de Arquitectura Judicial."],"s":"Sector Mantenimiento: Derogado por la Ac. 81/07, que crea la Dirección de Arquitectura Judicial.","nt":[]},{"n":224,"l":"224","t":"Sector Arquitectura, Diseño y Proyectos","p":["Sector Arquitectura, Diseño y Proyectos: Derogado por la Ac. 81/07, que crea la Dirección de Arquitectura Judicial."],"s":"Sector Arquitectura, Diseño y Proyectos: Derogado por la Ac. 81/07, que crea la Dirección de Arquitectura Judicial.","nt":[]},{"n":225,"l":"225","t":"Régimen de contrataciones","p":["Establécese el siguiente régimen de contrataciones:","Disposiciones generales v normas aplicables. Toda compra o venta por cuenta del Poder Judicial, así como todo contrato sobre locaciones,arrendamientos, trabajos o suministros se sujetarán a las disposiciones de este Reglamento y a las que, en forma general, o para caso particular, dicte el Superior Tribunal de Justicia, los pliegos de condiciones generales, particulares y técnicas; y a la Ley VII N° ll D.J. (antes Ley 2.303 de Contabilidad de la Provincia de Misiones) y su Decreto Reglamentario Nº 3.421/86. Para el caso de obras, por las disposiciones que, en forma general, o para caso particular, dicte el Superior Tribunal de Justicia y por aplicación de la Ley X N° 4 D.J. (antes Ley 83 de Obras Públicas) y su reglamentación vigente, pliegos de condiciones genérales, pliego de condiciones particulares y especificaciones técnicas. Serán también parte del marco legal lo establecido por la Ley I N° 89 D.J. (antes Ley 2.970 de Procedimiento Administrativo) y los principios generales de derecho, en la medida que no se contrapongan a las particularidades del procedimiento.","Inciso 1°) Regla general. Todas las contrataciones se harán -según la naturaleza de la operación- por licitación pública o concurso de antecedentes, salvo las excepciones enumeradas en el Inciso 2º; quedando prohibido el desdoblamiento de las compras con el fin de variar el procedimiento a seguir, conforme lo establecido en el Art. 15 del Decreto 3421/86 Reglamentario de la Ley VII-N° 11.","LICITACIÓN PÚBLICA: Los llamados a licitación pública se publicarán en el Boletín Oficial y en un diario o periódico de circulación habitual en la Provincia, sin perjuicio de la utilización de otros medios de difusión escritos cuando así lo disponga la autoridad competente, de oficio o a requerimiento de la Dirección de Administración, con el fin de lograr mayor concurrencia. Todos los términos previstos en este inciso son corridos. Cuando el importe estimado de la contratación exceda la suma -que al efecto fije la Acordada respectiva las publicaciones pertinentes se harán por 3 días y la apertura se fijará a los 5 días como mínimo y 10 como máximo después del último día de publicación.","Si el importe no excede la suma establecida, las publicaciones se harán por 2 días y la apertura sé fijará a los 3 días como mínimo y 5 como máximo después del último día de publicación. Todos los términos previstos en este inciso son corridos.","La autoridad competente constituirá una comisión de preadjudicación, conforme los lincamientos de la Ley VII-N° 11 y su Decreto Reglamentario 3421/86.","Inciso 2°) Excepciones. No obstante lo establecido en el párrafo anterior podrá contratarse mediante el procedimiento de:","A) LICITACIÓN PRIVADA: Cuando el valor estimado para la operación - cualquiera sea su naturaleza- no exceda el importe fijado por la Acordada respectiva. Se fijará día y hora para la apertura de las propuestas, debiendo invitarse a un mínimo de tres firmas inscriptas en el ramo respectivo en el Registro Oficial de Proveedores del Estado, o aquellas que se encuentren tramitando su inscripción, siempre que acrediten su aceptación definitiva antes de la apertura de las propuestas; sin perjuicio de la publicación que pueda realizarse en la página web del Poder Judicial. El plazo de presentación de las ofertas y apertura de las mismas no podrá ser menor a 24 horas a partir de la entrega del pedido de cotización ni mayor a 10 días. Se labrará acta de la apertura, firmada por los agentes públicos participantes y por los oferentes o sus representantes, en su caso, si así lo quisieran. El acto de apertura lo llevará a cabo una comisión de preadjudicación que se regirá por los mismos lincamientos que en las licitaciones públicas.","B) REMATE PÚBLICO: Cuando se trate de venta de bienes de propiedad del Poder Judicial y que haya sido autorizada por el Superior Tribunal de Justicia se aplicará este procedimiento por intermedio de los órganos oficiales o privados que hayan sido designados por éste.","C) CONTRATACIÓN DIRECTA: De acuerdo con el importe:","a) Cuando el valor estimado de la operación no exceda el importe fijado por Acordada.","Cualquiera sea el importe:","b) La compra de inmuebles u otros bienes en remate público, previa fijación del precio máximo a abonarse en la operación, por parte de la autoridad con facultad de aprobar la contratación,","c) Los contratos de alquiler o arrendamientos de bienes inmuebles o muebles, d) Cuando circunstancias imprevisibles* o razones de urgencia debidamente fundadas no permitan esperar la gestión de una licitación, las que serán consideradas por resolución fundada de la autoridad competente,","e) Cuando la autoridad competente lo determine expresamente con carácter general o particular,","f) Cuando una licitación haya sido declarada desierta total o parcialmente o no se hubieran presentado en la misma ofertas admisibles a juicio de la autoridad competente. Las contrataciones que se realicen en virtud del presente inciso deberán regirse por las mismas condiciones y requisitos con que se efectuó el llamado a licitación. No será de aplicación el presente inciso, cuando la licitación no se haya concretado por vencimiento del plazo de mantenimiento de ofertas imputable exclusivamente a la autoridad que llamó a licitación,","g) Los trabajos, obras y/o servicios científicos, técnicos o artísticos cuya adquisición y/o ejecución se efectúe con empresas, profesionales, técnicos y/o personas especializadas y reconocidas como tales por la autoridad competente,","h) La contratación con organismos públicos nacionales, provinciales, municipales o entidades en las cuales los mismos tengan participación,","i) La publicidad oficial de todo tipo,","j) La compra o suscripción de libros, periódicos, diarios, revistas, cualquier tipo de impresos (« y publicaciones en general, así como la contratación de trabajos de imprenta, encuadernación, confección de tapas y sellos de todo tipo,","k) La adquisición de bienes y/o servicios cuya fabricación, venta o prestación sea exclusiva de quienes tengan facultad legal para ello, o que solo provea una determinada persona o entidad, siempre y cuando la autoridad competente considere que no existen sustitutos convenientes.","1) Las compras y locaciones en países extranjeros, siempre que la autoridad competente considere no conveniente realizar en ellas la licitación,","m) Cuando exista notoria escasez de los bienes a adquirir en el mercado provincial, circunstancia que deberá ser acreditada en cada caso por el sector competente,","n) Cuando se trate dé la adquisición de bienes que deban reunir características propias para permitir su acople o integración a otras ya existentes o formar juegos o sustituir unidades que forman un conjunto. La excepción prevista en el presente inciso será utilizada cuando los bienes a integrar sean accesorios a lo principal ya existente,","ñ) Cuando se trate de adquirir bienes o servicios cuyo precio es oficial,","o) El lavado y engrase de vehículos, compra de lubricantes para el uso de los mismos y en general para cualquier uso, neumáticos, repuestos y accesorios; reparaciones de toda índole de dichos vehículos o de sus elementos, y todos los demás gastos relacionados con los vehículos, como seguros, patentes, alquiler de garaje para estacionamiento, etc.","p) Instalaciones eléctricas, de agua, desagües, cloacas, etc. y sus arreglos o modificaciones,","q) Reparación de máquinas de oficina, artefactos, equipos de refrigeración y/o calefacción, relojes, equipos informáticos, etc.","r) La compra de productos que contengan sustancialmente terciados, enchapados y/o compensados,","s) La venta de bienes en condición de rezago siempre que haya sido autorizada por el Superior Tribunal de Justicia,","t) La venta de publicaciones que dicte el Poder Judicial,","u) Las operaciones con entidades de servicios públicos - electricidad, teléfono, etc.-, cualquiera sea su importe,","v) La compra de productos para satisfacer necesidades de orden sanitario. Las causales de excepción para realizar contrataciones directas deberán estar debidamente fundadas en las respectivas actuaciones, bajo responsabilidad exclusiva de la autoridad con competencia para contratar que las invoca. Esta autoridad, ejerce así la facultad excluyente de determinar el mérito, oportunidad o conveniencia del acto.","D) CONCURSO DE PRECIOS: Las construcciones, trabajos, instalaciones y obras en general, así como la provisión, adecuación o reparación de máquinas, aparatos, instalaciones, materiales y elementos permanentes de trabajo o actividad que sean accesorios o complementarios de la obra que se construya o realice, que no superen el importe fijado por el Art. 13 Inc. b de la Ley X-N° 4 D.J. (antes Ley 83 de Obras Públicas) y sus modificaciones.","E) CONTRATACIÓN DIRECTA POR LEY DE OBRAS PÚBLICAS: Cuando, en los mismos supuestos del apartado C), los trabajos no superen el importe fijado en el Art. 13 Inc. c. 1 de la Ley X- N° 4 D.J. (antes Ley 83 de Obras Públicas) y sus modificaciones, o habiendo superado dicho monto, recayeran en las excepciones de los puntos c. 2 a c. 10 de la misma Ley.","Inciso 3°) Competencia. Fijase la competencia de los diversos órganos del Poder Judicial de la siguiente forma:","A) El Superior Tribunal de Justicia: autorizará y aprobará operaciones cuyo importe supere el fijado por la Acordada respectiva.","B) El Presidente: autorizará y aprobará operaciones cuyo importe no supere el fijado por la Acordada a que se refiere el apartado A). En los casos en que se necesite con urgencia la aprobación de los trámites y se trate de operaciones cuyos importes superen su competencia, el Presidente podrá recabar del Superior Tribunal -en Acuerdos extraordinarios- la aprobación de las correspondientes contrataciones.","C) El Secretario Administrativo de Superintendencia v Judicial que corresponda, autorizará y aprobará operaciones cuyo importe no supere el fijado por la Acordada respectiva.","D) El Director y/o Subdirector de Administración: autorizará y aprobará operaciones cúyo importe no supere el fijado por la Acordada respectiva.","Inciso 4°) Régimen de cajas chicas y fondos permanentes.","A) El Superior Tribunal de Justicia resolverá -a propuesta de la Dirección de Administración- la institución de una o más cajas chicas en las diversas dependencias del Poder Judicial, para atender los siguientes tipos de gastos:","1) Por servicios públicos: como ser teléfono, corriente eléctrica, suministro de agua, tasas, patentes, obras sanitarias, etc., cualquiera sea su monto, siempre que no corresponda abonarlos a través de la Subsecretaría de Obras y Servicios Públicos o a través de la Subsecretaría de Transporte, Puertos, Aeropuertos y Redes de Comunicaciones.","2) Gastos de cualquier otra naturaleza y por cualquier causa salvo pago de haberes del personal de presupuesto, hasta un monto que en cada operación no exceda el que al efecto se fije por Acordada.","Este límite podrá ser modificado por resolución de Presidencia ad-referéndum, a pedido fundado de la Dirección de Administración.","B) Antes de cada fin de ejercicio financiero, conforme a la correspondiente Circular que cada año dicte la Contaduría General de la Provincia, el Superior Tribunal de Justicia con intervención de la Dirección de Administración, procederá a instituir los fondos permanentes para el ejercicio siguiente, fijándose su monto, el que podrá ser modificado por el mismo procedimiento que en el caso de las cajas chicas, cada vez que se considere oportuno.","Texto según Ac. 117/23: Vigencia: a partir de 1º de Agosto de 2023."],"s":"Establécese el siguiente régimen de contrataciones: Disposiciones generales v normas aplicables. Toda compra o venta por cuenta del Poder Judicial, así como todo contrato sobre locaciones,arrendamientos, trabajos o suministros…","nt":["Ac. 60/14. Pliego de Bases y Condiciones para Contratación Directa. (Anexo)","Ac. 54/22. Pliego de Bases y Condiciones para la adquisición de Bienes y Servicios. (Anexo)"]},{"n":226,"l":"226","t":"Sin perjuicio de la presente reglamentación, el Cuerpo Médico…","p":["Sin perjuicio de la presente reglamentación, el Cuerpo Médico Forense de la Provincia de Misiones se ajustará a las disposiciones pertinentes del Título XI, Capítulo VI de la Ley IV-Nº 15.","Ver además en el Apéndice “Cuerpo Médico Forense”"],"s":"Sin perjuicio de la presente reglamentación, el Cuerpo Médico Forense de la Provincia de Misiones se ajustará a las disposiciones pertinentes del Título XI, Capítulo VI de la Ley IV-Nº 15.","nt":["Ac. 23/17. Reglamento para el Cuerpo Médico Forense (Anexo)","Ac. 9/11. Morgue Judicial. Reglamento. Protocolo de Autopsias. (Anexo)","Ac. 122/17: Créase la Comisión de Reconocimientos Médicos (CRM), dependiente del Departamento","Ac. 214/21: Incorpora Art. 15 inc. h) y Art. 20 inc. h)"]},{"n":227,"l":"227","t":"Los Escribanos deberán observar, a los efectos de su…","p":["Los Escribanos deberán observar, a los efectos de su inscripción en la matrícula, las normas establecidas en el art. 3 de la Ley I-Nº 118- Antes Ley 3.743.","Ley I-Nº 118 (Antes Ley 3.743) (Anexo)"],"s":"Los Escribanos deberán observar, a los efectos de su inscripción en la matrícula, las normas establecidas en el art. 3 de la Ley I-Nº 118- Antes Ley 3.743.","nt":[]},{"n":228,"l":"228","t":"Registro de Sello y Firma - Fianzas","p":["Los Escribanos del Registro deberán registrar un sello y firma en un formulario especial y constituir fianza, de conformidad con lo dispuesto por el art.12 y siguientes de la Ley I-Nº 118- Antes Ley N° 3.743.","Ley I-Nº 118 (Antes Ley 3.743) (Anexo)"],"s":"Los Escribanos del Registro deberán registrar un sello y firma en un formulario especial y constituir fianza, de conformidad con lo dispuesto por el art.12 y siguientes de la Ley I-Nº 118- Antes Ley N° 3.743.","nt":[]},{"n":229,"l":"229","t":"Continuación y Renovación de Fianzas","p":["La constitución o renovación de las fianzas de carácter personal deberá peticionarse acompañando a la solicitud los datos personales del fiador y los títulos, valores o documentaciones que acrediten la solvencia material del mismo. Las de carácter real, con la boleta de depósito judicial o la escritura de hipoteca correspondiente, debiendo ser otorgados tales actos a la orden del Presidente del Superior Tribunal. El Presidente del Superior Tribunal apreciará la fianza ofrecida y resolverá al respecto previa vista al Procurador General. La resolución que recayere será susceptible del recurso de apelación dentro del tercero día ante el Superior Tribunal."],"s":"La constitución o renovación de las fianzas de carácter personal deberá peticionarse acompañando a la solicitud los datos personales del fiador y los títulos, valores o documentaciones que acrediten la solvencia material del mismo","nt":[]},{"n":230,"l":"230","t":"Auxiliares de la Justicia","p":["Los auxiliares de la Justicia a los que las leyes hayan fijado el respectivo procedimiento de inscripción o matriculación, que pretendan ejercer sus respectivas profesiones en el ámbito de la Provincia, deberán acreditar ante el Superior Tribunal de Justicia los requisitos que exijan las leyes que regulan las respectivas profesiones."],"s":"Los auxiliares de la Justicia a los que las leyes hayan fijado el respectivo procedimiento de inscripción o matriculación, que pretendan ejercer sus respectivas profesiones en el ámbito de la Provincia, deberán acreditar ante…","nt":[]},{"n":231,"l":"231","t":"Recaudos generales a falta de leyes específicas","p":["A falta de leyes específicas, todo interesado que desea inscribirse en la matrícula deberá:","a) acreditar mayoría de edad y demás circunstancias personales en la forma determinada en el art. 79 y concordantes del Código Civil;","b) acreditar buena conducta mediante información expedida por autoridad competente;","c) formular declaración jurada de no estar afectado por ninguna inhabilidad legal;","d) acompañar los títulos, certificados o comprobantes que legalmente, a juicio del Presidente del Superior Tribunal, en su caso, lo habiliten para el ejercicio de su profesión o función;","e) prestar juramento ante el Superior Tribunal de ejercer leal y fielmente su profesión o función.","Llenados los requisitos exigidos precedentemente y previa vista al Procurador General, el Presidente del Superior Tribunal aprobará o rechazará la inscripción solicitada. En el primer caso dispondrá la inscripción en la matrícula y el otorgamiento por Secretaría de la certificación que acredite dicha circunstancia. Asimismo se otorgará el carné profesional."],"s":"A falta de leyes específicas, todo interesado que desea inscribirse en la matrícula deberá: a) acreditar mayoría de edad y demás circunstancias personales en la forma determinada en el art. 79 y concordantes del Código Civil;","nt":[]},{"n":232,"l":"232","t":"Matrícula de Procuradores - Requisitos Trámite de Inscripción","p":["La inscripción en el Registro de Procuradores deberá ser solicitada por los interesados ante la Secretaría Administrativa y de Superintendencia del Superior Tribunal de Justicia, ante la cual acreditarán los requisitos establecidos por la Ley 10.996, en la siguiente forma:","a) mayoría de edad, que se justificará con la partida de nacimiento, Libreta de Enrolamiento o Documento Nacional de Identidad;","b) prestar el juramento que determina el artículo 3° inciso 2) de la Ley citada; *c) acompañar Título Universitario Habilitante, pudiendo el Superior Tribunal de Justicia, requerir informe a la Jefatura de Títulos de la respectiva Universidad – Nacional y Oficiales de las Provincias -, si el mismo fue expedido por dicha Casa de Altos estudios, en aquellos títulos presentados directamente ante la Secretaría Administrativa y de Superintendencia del Superior Tribunal de Justicia, para su inscripción en el Registro de Procuradores;","d) suministrar los datos de filiación e identificación necesarios a los fines del pedido de informes de antecedentes a la policía provincial;","e) prestar la fianza que se refiere el artículo 233 de este Reglamento.","Cumplimentados los requisitos precedentemente señalados, la Secretaría Administrativa y de Superintendencia procederá a fijar en el transparente del Tribunal un edicto con el nombre del Procurador que solicita la inscripción, durante el término de ocho días. Vencido dicho término y recepcionado el informe a que se refiere el inc. d), se correrá vista de las actuaciones al Procurador general por el término de tres días. Con el dictamen de dicho funcionario, el Presidente del Superior Tribunal aprobará o rechazará la inscripción interesada. En el primer caso, dispondrá la inscripción y señalará audiencia para que el interesado preste juramento de desempeñar fiel y lealmente su profesión, cumplido lo cual se otorgarán al interesado los recaudos correspondientes a la inscripción solicitada.","En los casos previstos en el presente artículo y en el anterior, las resoluciones del Presidente serán susceptibles del recurso de apelación dentro del tercero día ante el Superior Tribunal. *c) Texto según Acordada Nº 24/02."],"s":"La inscripción en el Registro de Procuradores deberá ser solicitada por los interesados ante la Secretaría Administrativa y de Superintendencia del Superior Tribunal de Justicia, ante la cual acreditarán los requisitos…","nt":[]},{"n":233,"l":"233","t":"Fianza","p":["Cuando las leyes específicas exijan rendir fianza, la misma deberá constituirse mediante un depósito bancario de Pesos Cinco Mil Seiscientos Sesenta y Tres con Cuarenta y Dos centavos ($5.663,42) a la orden del Superior Tribunal de Justicia y una garantía personal o real de Pesos Ciento Trece Mil Doscientos Sesenta y Ocho con Treinta y Nueve Centavos ($113.268,39). El Presidente del Superior Tribunal de Justicia no admitirá fianzas de terceros que hubieren otorgado dos o mas garantías de la misma especie. El Superior Tribunal podrá adecuar los montos referidos cada vez que lo considere Conveniente."],"s":"Cuando las leyes específicas exijan rendir fianza, la misma deberá constituirse mediante un depósito bancario de Pesos Cinco Mil Seiscientos Sesenta y Tres con Cuarenta y Dos centavos ($5.663,42) a la orden del Superior…","nt":[]},{"n":234,"l":"234","t":"Texto según Acdo. 37/21 Matrícula de Martilleros - Fianzas","p":["Para el otorgamiento de la matrícula de martilleros se observarán las disposiciones de la Ley Nacional N° 25.028, de la Ley Provincial 493 y las Acordadas Nº 32/73 y *100/83 del Superior Tribunal en cuanto fueren de aplicación.","Ley 25.028. Régimen Legal de Martilleros y Corredores - Modifica la Ley 20.266, exigiendo título universitario habilitante, entre otros requisitos. (Anexo) Ac. Nº 32/73. Regula Inscripción en la Matrícula de los Martilleros en el Registro Público de Comercio y en el STJ. (Anexo) * Ac. 6/16. Reglamenta el Registro Público (Ex Reg. de Comercio, Martilleros y Corredores). Deroga la Ac. 100/83 (Anexo)"],"s":"Para el otorgamiento de la matrícula de martilleros se observarán las disposiciones de la Ley Nacional N° 25.028, de la Ley Provincial 493 y las Acordadas Nº 32/73 y *100/83 del Superior Tribunal en cuanto fueren de aplicación.","nt":[]},{"n":235,"l":"235","t":"La oficina de Seguridad dependiente del Superior Tribunal de…","p":["La oficina de Seguridad dependiente del Superior Tribunal de Justicia estará integrada por un Jefe, un Sub-jefe y el personal subalterno que determine la ley de presupuesto.","Ac. Nº 158/98. Servicio de vigilancia y seguridad del Poder Judicial (Anexo)"],"s":"La oficina de Seguridad dependiente del Superior Tribunal de Justicia estará integrada por un Jefe, un Sub-jefe y el personal subalterno que determine la ley de presupuesto.","nt":[]},{"n":236,"l":"236","t":"Sede y misión específica","p":["La Oficina de Seguridad funcionará en el local que le asigne el Superior Tribunal de Justicia, y tendrá como misión específica la de resguardar la integridad personal de los miembros del Poder"],"s":"La Oficina de Seguridad funcionará en el local que le asigne el Superior Tribunal de Justicia, y tendrá como misión específica la de resguardar la integridad personal de los miembros del Poder","nt":[]},{"n":237,"l":"237","t":"Policía Judicial","p":["Dicha dependencia ajustará su cometido a las órdenes que emanen directamente del Presidente del Superior Tribunal de Justicia y las que éste imparta por intermedio de los Secretarios Administrativos, de Superintendencia y Judicial.","En especial tendrá a su cargo las siguientes funciones:","a) Será el centro de operaciones donde se planificará y ejecutará en función de su cometido el accionar que las circunstancias exijan.","b) Si fuere necesario y en caso en que eventualidades imprevistas así lo aconsejen, tendrá contacto con las Fuerzas de Seguridad.","c) Será receptáculo de toda información atinente a su misión a los efectos de su evaluación análisis y comprobación.","d) Recogerá y acumulará los antecedentes personales de moralidad y costumbres, y ambientales de ser necesario, de todo postulante a cargo en el Poder Judicial, cuyo material será puesto a disposición del Superior Tribunal de Justicia.","e) El Jefe de la Oficina hará conocer de inmediato y por escrito, cuando se cometieran delitos contra la propiedad que directa o indirectamente afecten los bienes del Poder Judicial, o a la persona física de sus componentes. El mismo temperamento se seguirá cuando éstos se vieran comprendidos en hechos que lesionen su propia dignidad y paralelamente el buen nombre de la Justicia.","f) En los casos en que los miembros del Superior Tribunal, solos o en comitiva, deban trasladarse a cualquier lugar de la Provincia, Seguridad adoptará los recaudos pertinentes que hagan al resguardo de su integridad física y las de quienes eventualmente lo acompañen.-","g) El Jefe de Seguridad será informado semanalmente o cuando fuere necesario, por los choferes de los vehículos afectados al servicio del Presidente del Superior Tribunal, del estado de seguridad de los mismos y especialmente cuando deba desplazarse fuera de Posadas.","h) Tomará conocimiento de las instrucciones a que ajusta su cometido el personal policial que presta servicio en el edificio del Superior Tribunal, Cámaras, Juzgados y demás dependencias, a fin de que la Oficina de Seguridad coadyuve a la común finalidad que se persigue.","i) La Oficina llevará un libro en el que se registrarán las novedades que se produjeren, o los eventos que no comprendan el normal movimiento diario.-"],"s":"Dicha dependencia ajustará su cometido a las órdenes que emanen directamente del Presidente del Superior Tribunal de Justicia y las que éste imparta por intermedio de los Secretarios Administrativos, de Superintendencia y…","nt":["Ac. 158/98: Reglamento del Servicio de Vigilancia del Poder Judicial de Misiones. (Anexo)"]},{"n":1001,"l":"237 bis","t":"Dirección de Arquitectura Judicial","p":["La Dirección de Arquitectura Judicial funcionará bajo la órbita del Superior Tribunal de Justicia, el que tendrá a su cargo el contralor de las actividades relacionadas a la infraestructura judicial, programación de crecimiento edilicio, mantenimiento y conservación del patrimonio arquitectónico; y la adquisición y mantenimiento de máquinas, equipos y automotores necesarios para el funcionamiento del Poder Judicial de la Provincia de Misiones.","Inc. a) La Dirección de Arquitectura Judicial actuará bajo la Jefatura de un Director, quien tendrá a su cargo la organización y distribución de las distintas áreas y tareas necesarias para el funcionamiento de los inmuebles y sus instalaciones que albergan a las dependencias judiciales, como asimismo de las maquinarias, equipamiento y vehículos que las mismas requieran para su normal desempeño.","Inc. b) La Dirección de Arquitectura Judicial contará con un Departamento de Logística, Planificación y Proyectos, y un Departamento de Mantenimiento y Servicios Generales. Cada uno de estos sectores estará a cargo de un agente con categoría de Jefe de Departamento, y contará con el personal y equipamiento necesario para las funciones asignadas, contando con una Oficina Técnica integrada por profesionales idóneos, y un área de taller y servicios compuesta por personal capacitado para las distintas tareas. Inc.","Inc. c) FUNCIONES:","C.1) Del Departamento de Logística, Planificación y Proyectos: Evaluar las necesidades edilicias, y programar, proyectar y proponer las obras necesarias.","Este Departamento llevará a cabo la totalidad de la tarea correspondiente al proyecto, cómputo y presupuesto oficial de las obras a ejecutarse, la elaboración de los pliegos, el llamado a concurso de las mismas, su seguimiento, fiscalización, y recepción en nombre del Poder Judicial.","Para ello deberá: Evaluar necesidades edilicias, programar planes de crecimiento edilicio para las distintas localidades del interior y de la Capital de la Provincia, Proyectar las obras adecuadas para cubrir las necesidades; proponer alternativas y soluciones económicamente viables y efectivas a los problemas edilicios del Poder Judicial.","C.2) Del Departamento de Mantenimiento y Servicios Generales: Tiene la función de realizar el trabajo de mantenimiento preventivo y correctivo de los inmuebles y sus instalaciones, máquinas, equipos y vehículos afectados a las dependencias judiciales.","Para el cumplimiento de estas funciones se distribuyen las tareas en dos áreas: -Área de Mantenimiento de Edificios: Debe realizar la programación de los trabajos de mantenimiento preventivo de edificios e instalaciones (sanitarias, eléctricas, ascensores, telefonía, etc.) como asimismo la organización de los trabajos de mantenimiento correctivo (reparación) de edificios e instalaciones, y -Área de Mantenimiento de Máquinas y automotores: Este sector deberá realizar la verificación periódica de unidades automotrices, la programación de servicios de mantenimiento de las mismas, seguimiento y control, de reparaciones no programadas, verificación periódica y programación de reparaciones de equipos acondicionadores de aire, calefacción, ventiladores, equipos de telefonía, e instalaciones eléctricas en general, como así también de las máquinas de escribir, calculadoras, fechadores mecánicos, controladores de asistencia, y otros elementos de oficina existentes en las distintas dependencias del Poder Judicial de la Provincia.","Inc. d) Del Personal: La organización referida en el presente art. 237 bis será cubierta con personal de presupuesto, contratado y/o adscripto y podrá ser modificada por Acordada cuando necesidades de carácter orgánico – funcional así lo requieran.","Inc. e) Subrogación: En caso de ausencia, vacancia o impedimento del Director de Arquitectura Judicial, éste será subrogado en sus funciones – alternativamente – por el Jefe de Departamento de Logística, Planificación y Proyecto y del Departamento de Mantenimiento y Servicios Generales. En caso de ausencia simultánea ejercerá la jefatura transitoria el agente de mayor categoría de cualquiera de los dos Departamentos antes mencionados."],"s":"La Dirección de Arquitectura Judicial funcionará bajo la órbita del Superior Tribunal de Justicia, el que tendrá a su cargo el contralor de las actividades relacionadas a la infraestructura judicial, programación de…","nt":["Ac. 81/07 – Incorpora al Título I, el Capítulo XX, “Dirección de Arquitectura” integrado por el art. 237 bis."]},{"n":1002,"l":"237 ter","t":"Dirección de Asuntos Jurídicos del Poder Judicial","p":["La Dirección de Asuntos Jurídicos del Poder Judicial de la Provincia de Misiones funcionará bajo la órbita del Superior Tribunal de Justicia.","Inc. 1: Son Objetivos de la Dirección atender los asuntos legales relacionados con el Poder Judicial de la Provincia de Misiones, en el campo de la legislación general, que no sea competencia del Sr. Fiscal de Estado de la Provincia de Misiones, para defender los intereses del organismo mediante el cumplimiento de las disposiciones vigentes, así como todo lo concerniente a los aspectos jurídicos de las relaciones con el personal al servicio del Poder Judicial.","Inc. 2: Funcionario a Cargo.- La Dirección de Asuntos Jurídicos estará a cargo de un Director quien tendrá el deber de organizar y gestionar las siguientes áreas: a) Área de Trámites Administrativos y b) Área de Ejecuciones Fiscales y Asuntos Judiciales, para lo cual se lo faculta a los efectos del dictado del reglamento interno de la Dirección el cual será aprobado en definitiva por el Alto Cuerpo.","En cada una de las áreas previstas en el inciso anterior, se destacará a personal del Poder Judicial que posea título de abogado, a los efectos de que los mismos colaboren con el Director en las labores que se les asignen en orden a las funciones atribuidas al mismo.","A su vez, la Dirección contará con dos oficiales de justicia destinados a realizar todas las notificaciones y diligencias administrativas y judiciales que surjan en el marco de los trámites que lleva adelante la dirección, actuando los mismos como oficiales de justicia ad hoc, en las causas judiciales en trámite en la provincia.","Inc. 3: Son Funciones de la Dirección de Asuntos Jurídicos dictaminar en los trámites administrativos inherentes al Poder Judicial, de acuerdo a lo dispuesto por la ley de Procedimientos Administrativos, así como la ley de obra pública y contabilidad, y toda otra normativa legal que disponga la necesidad de dictar un acto administrativo en el ámbito del Poder Judicial.","En particular, son funciones de la Dirección: a.- Cumplir con todas las normativas emanadas por el Superior Tribunal de Justicia, así como con la legislación vigente; b.- Acordar con el Superior Tribunal de Justicia el despacho de los asuntos que le encomiende; c.- Ejercer la representación jurídica del Poder Judicial, por medio de mandato otorgado por el Presidente del Superior Tribunal de Justicia de la Provincia de Misiones, ante autoridades judiciales y administrativas, en asuntos contenciosos y no contenciosos en las diversas ramas del derecho, ya sea como actor, demandado o tercero interesado, en todos aquellos asuntos que no sean competencia del Sr. Fiscal de Estado de la Provincia de Misiones; d.- Emitir dictamen verificando la legalidad y legitimidad de los actos y procedimientos administrativos desarrollados en el ámbito del Poder Judicial y en toda otra cuestión que se someta a su consideración; e.- Colaborar en la preparación de los documentos y reglamentos de aplicación general y proyectar los actos administrativos a suscribir por el Presidente o por el Alto Cuerpo, cuando se debatan cuestiones jurídicas novedosas o complejas f.- Supervisar los proyectos de actos administrativos de alcance general o particular, definitivos o interlocutorios, que redacten las distintas direcciones administrativas u oficinas que dependan del Superior Tribunal. g.- Intervenir en los procesos de contrataciones desde la integración de las comisiones de preadjudicación, con los dictámenes que fuere menester. h.- Intervenir en la confección, interpretación y modificación de los pliegos de Bases y Condiciones que rijan las contrataciones celebradas por el Superior Tribunal de Justicia o sus órganos. i.- Intervenir como instructor en los sumarios administrativos, en los términos de la Ac. 229/19-art. 7. j.- Redactar contratos y documentos sobre diversos actos jurídicos en que el Poder Judicial de la Provincia de Misiones intervenga; k.- Revisar contratos y actos jurídicos realizados por los distintos órganos del Poder Judicial; l.- Tramitar ante los organismos gubernamentales correspondientes, los asuntos relativos a concesiones, permisos, licencias autorizaciones, etc., que requieran las distintas reparticiones del Poder Judicial de la Provincia de Misiones; m.- Conocer y tramitar los demás asuntos jurídicos que determine el Presidente del Superior Tribunal de Justicia, en los cuales el Poder Judicial de la Provincia de Misiones tenga interés o se le dé intervención por la autoridad competente; n.- Llevar adelante las ejecuciones fiscales tendientes al recupero judicial de la Tasa Judicial (Ley XXII-Nº 37), coordinando con las diferentes reparticiones del Poder Judicial los trámites inherentes a dicho Recupero ñ.- Atender y coordinar los programas y proyectos especiales que le confieran autoridades superiores; o.- Informar periódicamente ante la Presidencia del Superior Tribunal de Justicia, sobre el desarrollo de las actividades de la Dirección.","Inc. 4: Subrogancia. En caso de ausencia o vacancia, del Director de Asuntos Jurídicos será subrogado por los funcionarios a cargo de la Oficina de Auditoria y Control de Tasa de Justicia del Poder Judicial, hasta tanto el Presidente del STJ designe los responsables de la áreas de Trámites Administrativos y Ejecuciones Fiscales y Asuntos Judiciales.","Inc. 5: Son Requisitos para ser Director, contar con Título Universitario de Abogado, con una antigüedad mínima de cinco (5) años de antigüedad en el ejercicio efectivo de la matrícula o en el desempeño de función judicial, tener domicilio dentro de la primera circunscripción judicial de la Provincia, estar matriculado en el Colegio de Abogados de la Provincia de Misiones, tener matricula de Procurador y estar matriculado en la justicia federal.- El cargo de Director, es incompatible con el ejercicio profesional en la Jurisdicción provincial, rigiendo a su vez las incompatibilidades previstas en la Ley I-Nº 104.-","Inc. 6: El Director deberá coordinar y supervisar el cumplimiento de las funciones de las Áreas de Trámites administrativos y Ejecuciones fiscales y Asuntos Judiciales, a los fines de garantizar la emisión de dictámenes legales, en materia administrativa no jurisdiccional verificando su correspondencia con las normas constitucionales, legales y reglamentarias vigentes, previo a la emisión de actos administrativos por el Tribunal Superior de Justicia. Además, deberá garantizar la permanente revisión y actualización normativa, conforme lo requiera el Superior Tribunal de Justicia, de acuerdo a las necesidades de servicio y de la organización. Asimismo, tendrá a su cargo las demás funciones que le confiera el Alto Cuerpo.","A su vez, tiene el deber de vigilar cuidadosamente la cobranza judicial a cargo de la dirección y de los apoderados externos cuando éstos sean apoderados por el Superior Tribunal de Justicia, tendiente a lograr la mayor percepción de los valores que se le confían, con eficiencia, honradez, y celo profesional.-","Inc. 7: El Director en su carácter de encargado del Área de Trámites Administrativos deberá emitir opinión jurídica – en los términos del artículo 21 de la Ley I-Nº 89 – y técnica de los proyectos en materia administrativa no jurisdiccional, que deban ser considerados por el Alto Cuerpo en Acuerdo, cuando así lo requiera el Presidente o alguno de los Ministros del STJ, verificando su correspondencia con las normas constitucionales, legales y reglamentarias vigentes.- Así como toda otra función que le sea asignada por el Director de Asuntos Jurídicos.-","Inc. 8, 9 y 10: Dejados sin efecto por La Ac. 44/22. Crea la Secretaria de Ejecuciones Fiscales -Tasa de Justicia. Incorpora el Capítulo XXIII. Incorpora el Art. 237 quinquies al RPJ- Vigencia a partir de 02-05-2022"],"s":"La Dirección de Asuntos Jurídicos del Poder Judicial de la Provincia de Misiones funcionará bajo la órbita del Superior Tribunal de Justicia.","nt":["Ac. 8/11 – Incorpora al Título I, el Capítulo XXI, “Dirección de Asuntos Jurídicos del Poder Judicial” integrado por el art."]},{"n":1003,"l":"237 cuarto","t":"Cuerpo de Inspectores de Obra","p":["El Cuerpo de Inspectores de Obras dependerá directamente del Administrador General del Poder Judicial o de quien éste oportunamente designe con aprobación de Presidencia, quienes tendrán amplias facultades de fiscalización de las actividades relacionadas a la infraestructura judicial y el mantenimiento y conservación del patrimonio arquitectónico del Poder Judicial; a fin de establecer mecanismos de control de la correcta aplicación de los recursos económicos puestos a disposición del servicio de justicia.","a) Dependencia Funcional y Estructura Organizativa: El Cuerpo de Inspectores de Obras del Poder Judicial, responderá directamente al Administrador General del Poder Judicial, quien tendrá la facultad de designar, con aprobación de Presidencia del Superior Tribunal de Justicia al responsable del Seguimiento de las actuaciones llevadas a cabo por este cuerpo. El Administrador General tendrá asimismo la facultad de proponer a los integrantes del Cuerpo de Inspectores de Obras, los cuales deberán reunir los requisitos que éste oportunamente determine, además de los establecidos en el art. 34 de la Ley X-Nº 4 de Obras Públicas de la Provincia.","b) Misión: Fiscalizar las actividades relacionadas a la infraestructura judicial y el mantenimiento y conservación del patrimonio arquitectónico del Poder Judicial; con la finalidad de establecer mecanismos de control de la correcta aplicación de los recursos económicos puestos a disposición del servicio de justicia.","c) Funciones: 1) Llevar un registro de las fechas y condiciones generales de inicios de obras, como así también de sus plazos de ejecución y de las maquinarias y herramientas que fueran puestas a disposición de la obra al inicio de la misma.","2) Verificar el cumplimiento de los Pliegos de Bases y Condiciones Generales, Particulares, Técnicas y Específicas como así también de la Memoria Descriptiva y de los planos; todo mediante la constatación in situ en la obra.","3) Llevar un registro de Proyectos de Obra realizando el seguimiento de las mismas y comunicando inmediatamente al Director de Arquitectura las desviaciones detectadas, a fin de prever situaciones futuras de riesgo, que puedan generar Órdenes de Servicios hacia el Contratista.","4) Gestionar y llevar un registro de las Ordenes de Servicios que fueran emitidas al contratista, realizando a su vez el seguimiento de las mismas a fin de verificar su cumplimiento y comunicando cada novedad al respecto, al Director de Arquitectura Judicial.","5) Validar los materiales utilizados en los casos en que sus características resulte fácilmente verificables.","6) Actuar como Representante Técnico del Poder Judicial ante el Contratista a fin de tomar conocimiento del Plan Correctivo de las desviaciones detectadas.","7) Realizar la gestión de las Certificaciones de Obra, tanto parciales y provisorias, como totales y definitivas, emitiendo informe de Obra dirigido al Director de Arquitectura Judicial, quien autorizará la conformación por parte del Cuerpo de Inspectores de Obras, del Acta de Recepción, la cual será suscripta por el Representante Técnico y el Contratista.","8) Realizar cualquier otro tipo de tareas de índole técnica asignada por el Administrador General o quien éste designe con aprobación de Presidencia del Superior Tribunal de Justicia.","9) Comunicar a la Dirección de Arquitectura Judicial las deficiencias o errores, que existieren en proyectos o planos, que fueran denunciados, por escrito, por el contratista con carácter previo al inicio de los trabajos. *Texto incorporado por Ac. 136/14. Vigencia a partir del 1 de Octubre de 2014.","Anexo Ac. 136. Proyecto Creación Cuerpo de Inspectores de Obra (Anexo)"],"s":"El Cuerpo de Inspectores de Obras dependerá directamente del Administrador General del Poder Judicial o de quien éste oportunamente designe con aprobación de Presidencia, quienes tendrán amplias facultades de fiscalización de…","nt":[]},{"n":1004,"l":"237 quinquies","t":"Secretaría de Ejecuciones Fiscales – Tasa de Justicia","p":["Secretaria de Ejecuciones Fiscales -Tasa de Justicia-:","Inciso Iº OBJETIVO: La Secretaría de Ejecuciones Fiscales del Poder Judicial, tiene como objetivo el recupero de los importes adeudados en concepto de Tasa de Justicia y aranceles comprendidos en el Fondo de Justicia, cuyos certificados de deuda fueron expedidos ante el incumplimiento de los obligados al pago, en los términos de lo dispuesto por los arts. 22 y 23 de la Ley XXII-N°37.","Inciso 2º FUNCIONES: Son sus funciones: a) Llevar adelante las ejecuciones fiscales tendientes al recupero judicial de la tasa de Justicia, por aplicación expresa de la Ley XXII-N°37 Digesto Jurídico, coordinando con las diferentes reparticiones judiciales los trámites inherentes al cobro; b) Intervenir en toda cuestión en las que se contienda la determinación de Tasa de Justicia, conforme lo establecido por el Art. 19 -último párrafo- de la Ley XXII-N°37 Digesto Jurídico; c) Asesorar a las reparticiones judiciales, en cuanto a la redacción y confección de los certificados de deuda emitidos por incumplimiento del pago de tasa de justicia; d) Proponer al Superior Tribunal del Justicia, las modificaciones legales y reglamentarias, con la finalidad de optimizar el procedimiento de recupero de Tasa de Justicia; e) Representar al Poder Judicial de Misiones, en los juicios iniciados con la finalidad de percepción de Tasa de Justicia, conforme disposiciones del art. 23 de la Ley XXII-N°37. f) Atender y coordinar los programas y proyectos especiales que le confieran autoridades superiores; g) Dictar cursos de capacitación, a las distintas áreas judiciales, referentes a la modalidad de certificación de deudas por Tasa de Justicia y ejecuciones fiscales, h) Llevar adelante Registro de Deudores de Tasa de Justicia.","Inciso 3º: La Secretaría de Ejecuciones Fiscales estará a cargo de un Funcionario Judicial, con título de abogado, encargado de iniciar, tramitar y ser parte en las acciones judiciales tendientes al cobro de la tasa de justicia y demás acreencias que integran el Fondo de Justicia y dependerá del Superior Tribunal de Justicia, conforme lo dispuesto por el art. 3 inc. 3 Ley XXII-N°37. Son requisitos para estar a cargo de esta Secretaría: contar con título universitario de abogado, con una antigüedad mínima de cuatro años en el ejercicio activo de la profesión o en el desempeño de la función judicial. En caso de subrogancia o vacancia será subrogado por el Director de Asuntos Jurídicos.","Inciso 4º: El Funcionario a cargo de la Secretaría de Ejecuciones Fiscales del Superior Tribunal de Justicia, podrá ejercer la representación jurídica del Poder Judicial, por medio de mandato judicial otorgado por el Superior Tribunal de Justicia de la Provincia de Misiones. Llevará adelante los trámites judiciales tendientes al recupero de la Tasa de Justicia en toda la provincia en los términos de lo establecido por Ley XXII-N°37 Digesto Jurídico.","En estos términos queda facultado el Secretario para requerir al Cuerpo de Inspectores el informe al que refiere el punto Quinto de la Acordada N° 65/07.","Inciso 5º: La Secretaría estará conformada por las siguientes áreas: •Área verificación de certificados de deuda: El responsable de área deberá verificar el cumplimiento de los requisitos formales, de los certificados de deuda. Recibido el certificado de deuda, se procede a comprobar el cumplimiento de los requisitos formales. Ante la falta de algunos de ellos o la errónea asignación de valores, fechas o falta de firmas, se procederá a reintegrar a origen dicho título fiscal, para la correspondiente corrección o emisión de nuevo certificado de deuda. •Área de confección de demandas: Verificados los requisitos de los certificados, se procederá a confeccionar demanda de ejecución fiscal. El responsable de área deberá verificar la demanda y documental que han de presentarse. •Área de Ejecuciones Tributarias: Funcionará con los profesionales designados a tal fin, quienes llevarán adelante la procuración de las causas iniciadas por la Secretaría con la coordinación del Sr. Secretario.","Inciso 6º: REGISTRO PROVINCIAL DE DEUDORES DE TASA DE JUSTICIA: Créase un Registro Provincial de Deudores de Tasa de Justicia, que estará a cargo de la Secretaría de Ejecuciones Fiscales del Poder Judicial. En el mismo se dejará constancia del nombre completo o razón social, en su caso, de deudores de Tasa de Justicia debidamente certificada, domicilio, número de documento o CEUT para referir a personas jurídicas y monto (incluido la multa del 100% prevista por el Art. 19 de la Ley XXII-N°37 DDJJ.","Inciso 7º: La Secretaría contará con oficiales de Justicia, designados a tal fin, con la función de efectuar todas las notificaciones y diligencias judiciales que surjan en el marco de los trámites que lleva adelante la Secretaría, cumpliendo dicha función en toda la Provincia de Misiones. Son funciones de los Oficiales de Justicia designados para actuar en la Secretaría: a) Llevar adelante las notificaciones y mandamientos e intimaciones de pago, con el encargado del Área Ejecuciones Fiscales. A tales fines, el Oficial de Justicia deberá informar al encargado del Área Ejecuciones Fiscales las medidas pendientes de diligenciamiento y coordinar el traslado del mismo para cumplimiento de sus funciones, b) A los fines del cumplimiento de sus funciones, los oficiales de justicia asignados, cuentan con las mismas facultades de llevar adelante las notificaciones en toda la Provincia de Misiones, requerir el auxilio de la fuerza pública si fuere necesario, y allanar domicilio, las que fueran expresamente otorgadas por los juzgados correspondientes. Deberán ajustar sus actuaciones a los deberes y atribuciones que le confiere la Ley IV-N°15."],"s":"Secretaria de Ejecuciones Fiscales -Tasa de Justicia-: Inciso Iº OBJETIVO: La Secretaría de Ejecuciones Fiscales del Poder Judicial, tiene como objetivo el recupero de los importes adeudados en concepto de Tasa de Justicia y…","nt":["Ac. 44/22; Incorpora al Título I, el Capítulo XXIII, “Secretaría de Ejecuciones Fiscales -Tasa de Justicia-” integrado por el"]},{"n":238,"l":"238","t":"En el presente Reglamento se llaman “Magistrados” a los…","p":["En el presente Reglamento se llaman “Magistrados” a los Jueces de todos los grados “Funcionarios”, a los miembros del Ministerio Público, Secretarios del Superior Tribunal, de las Cámaras de Apelaciones, de los Juzgados de Primera Instancia y de Paz, Secretario del Registro Público de Comercio, Jefe y Subjefe de la Inspección de Justicia de Paz, Jefe del Archivo General de los Tribunales, Director, Subdirector y Tesorero de la Dirección de Administración, Director y Subdirector de Biblioteca, Jefe de la Oficina de Mandamientos y Notificaciones Oficiales de Justicia, médicos de los Tribunales y Forenses y Jefe de la Oficina de Seguridad, y “empleados” al resto del personal."],"s":"En el presente Reglamento se llaman “Magistrados” a los Jueces de todos los grados “Funcionarios”, a los miembros del Ministerio Público, Secretarios del Superior Tribunal, de las Cámaras de Apelaciones, de los Juzgados de…","nt":[]},{"n":239,"l":"239","t":"Clasificación del personal según su función","p":["Los agentes del Poder Judicial, se clasificarán en la siguiente forma:","a) Personal judicial propiamente dicho.","b) Personal administrativo.","c) Personal de seguridad.","d) Personal de servicio y maestranza.","Están comprendidos en el primer agrupamiento los funcionarios y empleados que actúan en la esfera judicial del Superior Tribunal, de las Salas de las Cámaras de Apelaciones, de los Juzgados de Primera Instancia y de Paz, los de los Ministerio Públicos y los Oficiales de Justicia.","Pertenecen al segundo los empleados del Superior Tribunal no comprendidos en la anterior clasificación, el Secretario y empleados del Registro Público de Comercio con asiento en Posadas, los Funcionarios y empleados de la Dirección de Administración, los de Inspección de Justicia de Paz, los del Archivo General de los Tribunales, y los de la Biblioteca del Superior Tribunal.","Integran el personal de seguridad los agentes afectados a la Oficina de Seguridad.","Son considerados como personal de servicio y maestranza el Mayordomo, los ordenanzas y los choferes de los Tribunales, dependencias del Ministerio Público y organismos administrativos del Poder Judicial."],"s":"Los agentes del Poder Judicial, se clasificarán en la siguiente forma: a) Personal judicial propiamente dicho.","nt":[]},{"n":240,"l":"240","t":"Los Funcionarios deberán acreditar las condiciones establecidas en el…","p":["Los Funcionarios deberán acreditar las condiciones establecidas en el art. 17 de la Ley N° 651.","Para ingresar a cargos de empleados en los Tribunales, Juzgados Letrados, oficinas del Ministerio Público y demás organismos administrativos del Poder Judicial, se deberán reunir las condiciones de edad, nacionalidad e instrucción secundaria establecida en el art.104 segundo apartado de la Ley N° 651.","Para acceder a empleos en los Juzgados de Paz deberán acreditar las mismas condiciones con excepción de la instrucción que bastará con haber aprobado el plan de enseñanza primaria.","El personal de maestranza deberá reunir las mismas exigencias que éstos últimos.","Además de acreditar los requisitos precedentes, para ser admitidos como Funcionarios o empleado de la Administración de Justicia se requieren:","a) Presentar certificado acreditante de buena salud expedido por el médico de los Tribunales.","b) Observar una conducta intachable.","c) Saber escribir a máquina.","d) Acreditar condiciones de idoneidad para el cargo mediante exámenes que establece el art. 246 de este Reglamento.","e) Buena conducta, acreditada mediante informe que será requerido por Secretaría Administrativa a las autoridades pertinentes.","f) Rendir fianzas en los casos en que el cargo o empleo así lo requiera, con las disposiciones en vigor."],"s":"Los Funcionarios deberán acreditar las condiciones establecidas en el art. 17 de la Ley N° 651.","nt":["Ac. 15/11. Capacitación a empleados ingresantes. (Anexo)","Ac. 93/12. Capacitación a empleados ingresantes. Amplía Ac. 15/11. (Anexo)"]},{"n":241,"l":"241","t":"Declaración de cargos","p":["Todo aquél que aspire ingresar a la Administración de Justicia deberá hacer manifestación expresa de los cargos que haya ocupado o que ocupe. La omisión maliciosa de cualquiera de ellos o su falsedad, comprobada que fuere, acarreará la cesantía del funcionario o empleado.","Dicha manifestación deberá ser formulada por el aspirante en oportunidad de cumplir el mismo con los recaudos indicados en los primeros cinco incisos del artículo precedente."],"s":"Todo aquél que aspire ingresar a la Administración de Justicia deberá hacer manifestación expresa de los cargos que haya ocupado o que ocupe","nt":[]},{"n":242,"l":"242","t":"Incapacidades para el nombramiento","p":["No podrán ser nombrados funcionarios o empleados quienes hubieren sido penados por motivos deshonrosos o estuviesen procesados criminalmente; los concursados o quebrados no rehabilitados y los fraudulentos, los que estuvieren afectados por indignidad, los que hubieren sido separados de su empleo por mal desempeño comprobado de su tarea, los impedidos física y psíquicamente para el desempeño de las mismas y los parientes dentro del cuarto grado de consanguinidad o afinidad con los funcionarios titulares bajo cuya dependencia inmediata deberá prestar servicio.-"],"s":"No podrán ser nombrados funcionarios o empleados quienes hubieren sido penados por motivos deshonrosos o estuviesen procesados criminalmente; los concursados o quebrados no rehabilitados y los fraudulentos, los que estuvieren…","nt":[]},{"n":243,"l":"243","t":"Meritorios","p":["Derogado por Acordada Nº 16/00."],"s":"Derogado por Acordada Nº 16/00.","nt":[]},{"n":244,"l":"244","t":"Carácter de los nombramientos","p":["Los nombramientos de Funcionarios y empleados que efectuare el Superior Tribunal de Justicia tendrán el carácter de provisionales por el término de seis meses.","Dentro del quinto mes de la designación del agente, el Presidente del Superior Tribunal, el Tribunal que corresponda, Juez o Jefe de la dependencia, según el caso, deberán elevar al Superior Tribunal un informe detallado con respecto a la aptitud y demás condiciones demostradas por el agente. Con dicho informe el Superior Tribunal decidirá el definitivo."],"s":"Los nombramientos de Funcionarios y empleados que efectuare el Superior Tribunal de Justicia tendrán el carácter de provisionales por el término de seis meses.","nt":[]},{"n":245,"l":"245","t":"Del acceso a la Administración de Justicia","p":["Todo acceso al empleo en la Administración de Justicia deberá efectuarse, sin más excepciones que las previstas en el primer párrafo del artículo 249 para los cargos de Jefe de Departamento, Jefe de División, Oficial superior de primera, Oficial Superior de Segunda y Jefe de Despacho, por la categoría y retribución correspondiente al cargo de menor jerarquía del escalafón de los empleados judiciales, cualquiera sea su tarea, técnica, judicial propiamente dicha o administrativa, a asignar a nuevos empleados. Igual criterio regirá para el ingreso en su área, para el personal de servicio y maestranza. El personal de maestranza que aspire a ser designado en la categoría de empleado judicial deberá acreditar las condiciones requeridas para tales empleos y cumplir con las exigencias del concurso e ingreso por la categoría de menor jerarquía que prevén este artículo y el 240 del presente Reglamento.","El Superior Tribunal, podrá eximir del concurso y/o autorizar el ingreso a una categoría administrativa similar a la que detentaba en el escalafón obrero de maestranza y servicios cuando los antecedentes del solicitante lo justifiquen."],"s":"Todo acceso al empleo en la Administración de Justicia deberá efectuarse, sin más excepciones que las previstas en el primer párrafo del artículo 249 para los cargos de Jefe de Departamento, Jefe de División, Oficial superior…","nt":[]},{"n":246,"l":"246","t":"Concursos","p":["Para ingresar al Poder Judicial en la categoría de empleados, los aspirantes deberán rendir una prueba de dactilografía, consistente en diez minutos de escritura al dictado y diez minutos de copia.","Los que hayan aprobado la prueba de dactilografía a juicio del Tribunal, Juez o Funcionario proponente, deberán rendir examen manuscrito por 10 minutos, calificándose redacción, caligrafía y ortografía. Además se los examinará en un cuestionario por escrito, sobre: a) conocimientos generales sobre la Constitución Nacional y Provincial y en especial a lo referente al Poder Judicial, b) conocimientos de la Ley Orgánica del Poder Judicial y c) generalidades sobre organización judicial y administrativa de la Provincia de Misiones. Cuando se trate de aspirantes a ingresar en la Dirección de Administración, el cuestionario escrito mediante el cual se lo examinará, se referirá a los siguientes conocimientos: a) generalidades sobre la Ley de Contabilidad de la Provincia, b) capítulo XVI del Reglamento para el Poder Judicial referente a la organización de la Dirección de Administración, c) ejercicios sobre las cuatro operaciones aritméticas y cálculos de porcentajes con y sin máquina de calcular. Al elevar el funcionario proponente la propuesta de ingreso del agente que haya resultado mejor calificado en el examen, deberá acompañar la documentación que acredite los requisitos legales y las pruebas rendidas por los intervinientes en el mismo."],"s":"Para ingresar al Poder Judicial en la categoría de empleados, los aspirantes deberán rendir una prueba de dactilografía, consistente en diez minutos de escritura al dictado y diez minutos de copia.","nt":[]},{"n":247,"l":"247","t":"Reincorporación","p":["Podrán ser reincorporados a la Justicia de la Provincia, en cargo de igual categoría o en la inmediata inferior a la que ocupaban, los Funcionarios y empleados que hubiesen renunciado siempre que exista vacante, que no hubiese transcurrido un plazo superior a cinco años desde su retiro y que el peticionante hubiese prestado servicio durante cinco años como mínimo en el Poder Judicial, debiendo encontrarse además a la fecha de la reincorporación dentro de las condiciones establecidas en el art. 240 inc, a), b), e) y f)."],"s":"Podrán ser reincorporados a la Justicia de la Provincia, en cargo de igual categoría o en la inmediata inferior a la que ocupaban, los Funcionarios y empleados que hubiesen renunciado siempre que exista vacante, que no hubiese…","nt":[]},{"n":248,"l":"248","t":"De las promociones","p":["Producida una vacante en cualquiera de las categorías de Funcionarios o empleados cuya designación compete al Superior Tribunal de Justicia, la Secretaría Administrativa y de Superintendencia lo hará saber al mismo, quien dispondrá de aquella de acuerdo con las necesidades del servicio, todo sin perjuicio de que el Magistrado, Funcionario del Ministerio Público y Jefe de la dependencia donde se hubiere producido la vacante formule la pertinente propuesta de ascenso de entre los agentes de la categoría inferior a la de llenar. A tales efectos se formará una lista completa de los agentes de las dos categorías inmediatas inferiores al cargo a cubrir, teniendo en cuenta todas las circunscripciones judiciales, cuando existan pedidos de traslados registrados de una a otra circunscripción, y sino existieren únicamente de la circunscripción en la que se hubiere producido la vacante, lista que se formará con la intervención de la Secretaría Administrativa y de Superintendencia, siguiendo el orden de méritos, con indicación del organismo en el que prestan servicios y sanciones disciplinarias no prescriptas. El personal judicial de la Justicia de Paz para ser promovidos a cargos de Primera Instancia, deberá acreditar título secundario o cinco años de antigüedad en funciones judiciales sin perjuicio de las demás exigencias del art. 136 de la Ley IV- N° 15 y de este Reglamento.-"],"s":"Producida una vacante en cualquiera de las categorías de Funcionarios o empleados cuya designación compete al Superior Tribunal de Justicia, la Secretaría Administrativa y de Superintendencia lo hará saber al mismo, quien…","nt":[]},{"n":249,"l":"249","t":"Concursos para promociones","p":["A propuesta de un Ministro, conforme al mejor servicio Judicial, en el ámbito exclusivamente del Superior Tribunal de Justicia, podrán acceder a cargos vacantes de: Jefe de Despacho, Oficial Superior de Segunda, Oficial Superior de Primera, Jefe de División o Jefe de Departamento, sin otros requisitos que ser mayor de edad, haber aprobado el plan de enseñanza secundaria, y los previstos en el art. 23 de la Ley IV-N º 15, no siendo de aplicación en este caso el art. 246 RPJ.","A propuesta de los Magistrados, Funcionarios y Jefes de las respectivas reparticiones podrán acceder a los cargos vacantes de: Jefe de Despacho, Oficial Superior de Segunda, Oficial Superior de Primera, Jefe de División o Jefe de Departamento, sin necesidad de rendir las pruebas previstas en el art. 246 los profesionales con título terciario o universitario expedido por universidad argentina o extranjera, legítimamente admitidos por la Nación o escuelas especializadas pertinentes, y que además reúnan las condiciones establecidas en el art. 23 de la Ley IV- Nº 15.","En su defecto, para cubrir el cargo de Jefe de Despacho, las promociones respectivas se efectuaran por concurso de oposición entre los empleados de las tres categorías inmediatas inferiores que desean participar en el concurso y se inscribiesen a tal fin o aquellos que sin reunir este requisito solicitaren autorización al Superior Tribunal de Justicia, quien evaluará cada caso en particular. Si uno solo se presentare en el concurso, igualmente deberá rendir el examen pertinente de capacitación para el cargo. Si ningún pretendiente se presentare, el concurso se declarará vacante y el Superior Tribunal de Justicia, dispondrá del cargo conforme al mejor servicio judicial.","No será necesario el llamado a concurso para las promociones de los agentes que se desempeñen en cargos técnicos, cuando estos tengan antigüedad no menor de diez (10) años. A tal efecto, entiéndese por cargos técnicos el que desempeñan los encargados de: Mesa de Entrada, el personal de la Secretaría Administrativa y de Superintendencia, el de Dirección de Administración, el de la Biblioteca y el del Archivo."],"s":"A propuesta de un Ministro, conforme al mejor servicio Judicial, en el ámbito exclusivamente del Superior Tribunal de Justicia, podrán acceder a cargos vacantes de: Jefe de Despacho, Oficial Superior de Segunda, Oficial…","nt":[]},{"n":250,"l":"250","t":"Texto según Ac. 73/08 Procedimiento y temario del concurso","p":["Cuando la cobertura del cargo de Jefe de Despacho se efectúe por concurso, el Superior Tribunal de Justicia dispondrá el llamado pertinente, especificando la categoría a cubrir, área y asiento de la misma, fijará la fecha y lugar del examen, designará a los integrantes del Tribunal examinador que estará presidido por el Magistrado o Funcionario a cuya dependencia se hubiere asignado la vacante, los que deberán confeccionar el temario que versará sobre mecanografía redacción, ortografía, nociones sobre procedimiento del fuero que corresponda, actos y providencias de trámite correspondiente al cargo a cubrir, conocimiento de la Constitución Provincial, en especial, sobre el Poder Judicial, Ley Orgánica y Reglamento para el Poder Judicial y elevarlo a consideración del Superior Tribunal de Justicia para su aprobación con antelación no menor de veinte días de la fecha fijada para el examen. La realización del concurso se hará saber al personal de las distintas dependencias del Poder Judicial con una antelación no menor de diez días, poniéndose el temario a disposición de los interesados en la dependencia en que se encuentre la vacante a cubrir. Los que deseen participar deberán inscribirse personalmente o por escrito en la Secretaría Administrativa y de Superintendencia, hasta cinco días antes de la fecha fijada para el examen, pudiendo también hacerlo por telegrama. El examen versará sobre la totalidad de los puntos del temario aprobado y la lista de los concursantes se formará con todos los agentes que se hubiesen inscriptos. Efectuado el examen, la mesa examinadora calificará las pruebas rendidas en las escalas de “muy bueno”, “bueno”, “regular” y “malo” y las elevará sin más trámite al Superior Tribunal de Justicia. Numéricamente “muy bueno” corresponderá a 10 y 9; “bueno” a 8 y 7; “regular” a 6, 5 y 4 y “malo” a 3, 2 y 1."],"s":"Cuando la cobertura del cargo de Jefe de Despacho se efectúe por concurso, el Superior Tribunal de Justicia dispondrá el llamado pertinente, especificando la categoría a cubrir, área y asiento de la misma, fijará la fecha y…","nt":[]},{"n":251,"l":"251","t":"Oficiales Superiores","p":["En la Secretaría del Superior Tribunal de Justicia, en las Salas de las Cámaras de Apelaciones, y en las de los Juzgados de cualquier grado, habrá un Oficial Superior que deberá reunir las condiciones establecidas en el art. 136 primer apartado de la Ley IV - N° 15.","El Presidente del Superior Tribunal, el de las Cámaras de Apelaciones y el Juez respectivo determinarán el agente de la dependencia que se desempeñará en ese carácter, debiendo recaer en el de mayor categoría presupuestaria pero nunca inferior a Jefe de Despacho.","Los cargos de Oficiales Superiores de los Juzgados de Paz serán provistos por el Superior Tribunal cuando las necesidades del servicio judicial así lo exijan."],"s":"En la Secretaría del Superior Tribunal de Justicia, en las Salas de las Cámaras de Apelaciones, y en las de los Juzgados de cualquier grado, habrá un Oficial Superior que deberá reunir las condiciones establecidas en el art.…","nt":[]},{"n":252,"l":"252","t":"Los Magistrados de todos los grados de la Justicia…","p":["Los Magistrados de todos los grados de la Justicia letrada, el Procurador General, el Fiscal y Defensor de Cámara jurarán ante el Superior Tribunal de Justicia. Los demás Magistrados Funcionarios, auxiliares de Justicia y empleados lo harán ante el Presidente del Tribunal o"],"s":"Los Magistrados de todos los grados de la Justicia letrada, el Procurador General, el Fiscal y Defensor de Cámara jurarán ante el Superior Tribunal de Justicia","nt":[]},{"n":253,"l":"253","t":"M
