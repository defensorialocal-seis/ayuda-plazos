 Presidente del Superior Tribunal desempeñándose con el personal auxiliar que se establezca."],"s":"El Superior Tribunal tendrá dos Secretarías, una Administrativas y de Superintendencia, y otra Judicial, las que intervendrán respectivamente en las causas pertinentes que se ventilen ante dicho Tribunal.","nt":["Ac. 135/82. Reglamentación de las Secretarías (Anexo)","Ac. 21/83. modif. arts. 5º y 10º Ac. 135/82 (Anexo)"]},{"n":86,"l":"86","t":"Subrogación de las Secretarías","p":["Los Secretarios Administrativos y de Superintendencia, y Judicial, intervendrán conjunta o alternativamente en las causas que se ventilen ante el Superior Tribunal y se reemplazarán entre sí. Si los Secretarios del Superior Tribunal estuviesen impedidos de actuar, la subrogación será ejercida por los Secretarios de la Sala I, II, y III de la Cámara de Apelaciones en lo Civil y Comercial, quienes se desempeñarán para la sustituciones durante el primero, segundo y tercero cuatrimestre de cada año respectivamente."],"s":"Los Secretarios Administrativos y de Superintendencia, y Judicial, intervendrán conjunta o alternativamente en las causas que se ventilen ante el Superior Tribunal y se reemplazarán entre sí. Si los Secretarios del Superior…","nt":["Ac. 135/82. Reglamentación de las Secretarías (Anexo)","Ac. 21/83. modif. arts. 5º y 10º Ac. 135/82 (Anexo)"]},{"n":87,"l":"87","t":"Firma","p":["Los Secretarios deberán suscribir las comunicaciones correspondientes a la Secretaría que no firme el Presidente o que no se encomiende por Ley o reglamento a otros funcionarios o empleados."],"s":"Los Secretarios deberán suscribir las comunicaciones correspondientes a la Secretaría que no firme el Presidente o que no se encomiende por Ley o reglamento a otros funcionarios o empleados.","nt":["Ac. 135/82. Reglamentación de las Secretarías (Anexo)","Ac. 21/83. modif. arts. 5º y 10º Ac. 135/82 (Anexo)"]},{"n":88,"l":"88","t":"Atención del Público","p":["Sin perjuicio de las audiencias que en cada caso concedan el Presidente o los Ministros, los litigantes, profesionales y el público en general serán atendidos por los Secretarios, salvo en los trámites ordinarios, los que se efectuarán ante las oficinas del Tribunal."],"s":"Sin perjuicio de las audiencias que en cada caso concedan el Presidente o los Ministros, los litigantes, profesionales y el público en general serán atendidos por los Secretarios, salvo en los trámites ordinarios, los que se…","nt":[]},{"n":89,"l":"89","t":"Jefes del Personal","p":["Los Secretarios son los jefes inmediatos del personal de su Secretaría, sin perjuicio de la autoridad que respecto del mismo ejercen el Presidente y los Ministros."],"s":"Los Secretarios son los jefes inmediatos del personal de su Secretaría, sin perjuicio de la autoridad que respecto del mismo ejercen el Presidente y los Ministros.","nt":[]},{"n":90,"l":"90","t":"Recepción de Pruebas y Juicios Verbales","p":["Las audiencias de pruebas, con excepción de la confesional y los juicios verbales, se realizarán ante los respectivos Secretarios, salvo que cualquiera de las partes solicitara la presencia del Presidente o del Tribunal. Los Secretarios darán cuenta al Presidente de los incidentes que se produzcan durante las audiencias y deban ser resueltos por el Tribunal."],"s":"Las audiencias de pruebas, con excepción de la confesional y los juicios verbales, se realizarán ante los respectivos Secretarios, salvo que cualquiera de las partes solicitara la presencia del Presidente o del Tribunal","nt":[]},{"n":91,"l":"91","t":"Funciones de la Secretaría Administrativa y de Superintendencia","p":["Además de las funciones que el art. 127 de la Ley IV-Nº 15 confiere a la Secretaría Administrativa y de Superintendencia del Superior Tribunal, tramitarán ante la misma todos los asuntos de carácter administrativo y de superintendencia que por este reglamento no se encomendare a otro funcionario, debiendo realizarse ante los titulares de ella las gestiones personales de los interesados.","Le corresponde intervenir:","a) En los acuerdos que realice el Superior Tribunal y en las Acordadas que se dictan.","b) En los juramentos que deban recibirse ante el Superior Tribunal o ante el Presidente.","c) En los procedimientos de nombramientos y cesaciones de Magistrados Funcionarios y empleados del Poder Judicial.","d) En todo cuanto concierne al registro de Magistrados, Funcionarios y empleados; sus licencias sanciones, calificaciones de concepto, comunicaciones, etc.","e) En lo pertinente a su cargo de la Policía del Superior Tribunal.","f) En las legalizaciones de las firmas de los Magistrados y Funcionarios de la justicia provincial.","g) Deberá llevar, además los libros de acuerdos, nombramientos, juramentos designaciones de oficio, legajos en general, sanciones y archivo de la administración judicial que no pertenezca al Archivo General.","Reglamentación de las Secretarías. Las funciones de los Secretarios Administrativos y de Superintendencia se encuentran además en la Ac. Nº 135/82, modificada por la Ac. 21/83 (Anexo)"],"s":"Además de las funciones que el art. 127 de la Ley IV-Nº 15 confiere a la Secretaría Administrativa y de Superintendencia del Superior Tribunal, tramitarán ante la misma todos los asuntos de carácter administrativo y de…","nt":[]},{"n":92,"l":"92","t":"Personal dependiente de la Secretaría Administrativa y de Superintendencia","p":["Dependerán de la Secretaría Administrativa y de Superintendencia, el personal de su oficina, la mayordomía, el personal de servicio, los choferes y el personal de maestranza."],"s":"Dependerán de la Secretaría Administrativa y de Superintendencia, el personal de su oficina, la mayordomía, el personal de servicio, los choferes y el personal de maestranza.","nt":[]},{"n":93,"l":"93","t":"Auxiliares de la Justicia","p":["La Secretaría Administrativa y de Superintendencia llevará además: 1°) el registro de procuradores con arreglo a lo dispuesto en la Ley 10.996 y las Acordadas reglamentarias. 2°) el registro de martilleros inscriptos con arreglo a lo dispuesto en el art. 7° de la Acordada 32/73* 3°) el registro de los demás auxiliares de la justicia."],"s":"La Secretaría Administrativa y de Superintendencia llevará además: 1°) el registro de procuradores con arreglo a lo dispuesto en la Ley 10.996 y las Acordadas reglamentarias. 2°) el registro de martilleros inscriptos con…","nt":["Ac. 32/73. Martilleros. Matrícula. Fianza (Anexo)"]},{"n":94,"l":"94","t":"Actos Protocolares","p":["Las gestiones referentes a actos protocolares se efectuarán ante la Secretaría Administrativa y de Superintendencia, a la que se dará intervención correspondiente en aquellos que realice el Superior Tribunal."],"s":"Las gestiones referentes a actos protocolares se efectuarán ante la Secretaría Administrativa y de Superintendencia, a la que se dará intervención correspondiente en aquellos que realice el Superior Tribunal.","nt":[]},{"n":95,"l":"95","t":"Funciones de la Secretaría Judicial del Superior Tribunal","p":["La Secretaría intervendrá en el trámite de expedientes judiciales de competencia del Superior Tribunal (art. 48 de la Ley IV-15), deberá presentar al Presidente o al Superior Tribunal los escritos y actuaciones pendientes de despacho someter al Tribunal los incidentes a resolución en los juicios.","Intervendrá además en:","a) La expedición de testimonios, certificados y demás piezas análogas correspondientes a los expedientes judiciales.","b) La clasificación y distribución de los expedientes en estado de sentencia.","c) La confrontación y autenticación de las sentencias.","d) La confección de los autos y sentencias conforme al resultado de los acuerdos.","e) La custodia de los expedientes y documentos que estuvieren a su cargo, siendo el Secretario directamente responsable de su pérdida o deterioro.","f) llevar los libros de Autos y Sentencias del Superior Tribunal y un registro de expedientes en estado de sentencia.","Reglamentación de las Secretarías. Acordada Nº 135/82, modificada por Ac. 21/83 (Anexo)."],"s":"La Secretaría intervendrá en el trámite de expedientes judiciales de competencia del Superior Tribunal (art. 48 de la Ley IV-15), deberá presentar al Presidente o al Superior Tribunal los escritos y actuaciones pendientes de…","nt":[]},{"n":96,"l":"96","t":"Entre el 1° y 15 de diciembre de cada…","p":["Entre el 1° y 15 de diciembre de cada año, cada una de las Cámaras de Apelaciones dispondrán, de común acuerdo la integración de las respectivas Salas. Si no mediara acuerdo, la integración se resolverá por sorteo. Dicha integración se comunicará al Superior Tribunal.","En la misma ocasión se sorteará el orden en que los Vocales de las distintas Salas se subrogarán entre sí y el orden en que los de cada Sala emitirán sus respectivos votos, según que el número de entrada interno del expediente fuere par o impar.","Ver además: Ac. 81/13: Cámara de Apelaciones en lo Penal y de Menores (Anexo)"],"s":"Entre el 1° y 15 de diciembre de cada año, cada una de las Cámaras de Apelaciones dispondrán, de común acuerdo la integración de las respectivas Salas","nt":[]},{"n":97,"l":"97","t":"Integración con Vocales de otras Cámaras, Jueces y Conjueces","p":["Cuando deba integrarse algunas de las Salas de una Cámara con Vocales de la otra Cámara o con Jueces de Primera Instancia, intervendrá el Magistrado que resulte desinsaculado por sorteo a efectuarse siguiendo un sistema rotativo con exclusión de los Magistrados ya sorteados.","Si se tratare de la integración con Conjueces, la designación de los mismos se hará por el procedimiento de la desinsaculación por sorteo entre los que figuran en la nómina respectiva prevista en el art.67 del presente reglamento.","En los casos de integración de la Sala de una Cámara con Vocales de la otra Cámara corresponderá la emisión del primer voto al Vocal del fuero de la causa."],"s":"Cuando deba integrarse algunas de las Salas de una Cámara con Vocales de la otra Cámara o con Jueces de Primera Instancia, intervendrá el Magistrado que resulte desinsaculado por sorteo a efectuarse siguiendo un sistema…","nt":["Ac. 81/13. Cámara de Apelaciones en lo Penal y de Menores. Art. 7º (Anexo)"]},{"n":98,"l":"98","t":"Presidencia de las Cámaras de Apelaciones y de los Tribunales Penales Subrogaciones","p":["PRESIDENCIA: La Presidencia de las Cámaras de Apelaciones será ejercida en la forma prevista en el art. 50 de la Ley IV-Nº 15. Su intervención en los respectivos expedientes queda limitada al período de ejercicio en ese cargo, y tendrá los deberes y atribuciones que establece el art. 95 de la Ley IV-Nº 15. En caso de impedimento, ausencia, vacancia, recusación o excusación el Presidente será sustituido por los restantes miembros de la Cámara en el orden que hubieren resultado desinsaculados de conformidad al art. 50 de la Ley IV-Nº 15.","Para la Cámara de Apelaciones en lo Laboral de la Primera Circunscripción, serán de aplicación las normas legales y reglamentarias vigentes para la Cámara de Apelaciones en lo Civil y Comercial de la Primera Circunscripción Judicial en cuanto fueren compatibles.","La Presidencia de los Tribunales Penales será ejercida por uno de sus miembros, designado por componentes. Dicha elección se realizará en el mes de diciembre de cada año y ejercerá sus funciones a partir del 1º de Enero del año siguiente al de su elección. En la misma época serán designados los subrogantes que los reemplazarán en los casos de ausencia o impedimento transitorio.","Si se tratare de renuncia, fallecimiento o separación del cargo, se elegirá en el primer acuerdo del Tribunal, después de integrado el mismo, el miembro que desempeñará la Presidencia para completar el resto del período. En cada caso, las designaciones se comunicarán al Superior Tribunal de Justicia.","La Cámara de Apelaciones Penal y de Menores elegirá a su Presidente antes del 15 de diciembre de cada año. El ejercicio del cargo empezará el 1° de enero y terminará el 31 de diciembre de cada año, sin tener en cuenta para la elección que el electo hubiere ejercido la presidencia con carácter interino, o en reemplazo por licencia o acefalía. En la misma oportunidad serán designados los subrogantes, primero, segundo y tercero, quienes desempeñarán, en ese orden, las funciones del Presidente en caso de licencia o acefalía, salvo que cesare en el cargo, en cuyo caso regirá lo dispuesto en el Artículo 39 de la IV - Nº 15. (Ac. 81/13, art. 2º- Anexo) SUBROGACIONES CÁMARAS DE APELACIONES EN LO CIVIL, COMERCIAL, DE FAMILIA Y FISCAL TRIBUTARIA Primera Circunscripción Judicial: El orden de subrogación en caso de excusación, recusación, vacancia u otro impedimento de los miembros de las Salas de las Cámaras de Apelaciones será el que establece el primer párrafo del art. 52 de la Ley IV- Nº 15:","1) por los miembros de la otra u otras Salas, por sorteo;","2) por los miembros de la Cámara de Apelaciones del otro fuero, por sorteo;","3) por los Jueces de Primera Instancia del mismo fuero con asiento en la Primera Circunscripción Judicial, por sorteo;","4) por los demás Jueces de Primera Instancia de la mencionada circunscripción;","5) por los conjueces designados conforme a las previsiones legales y reglamentarias pertinentes. (Ac. 189/16 y 190/16, pto. Octavo) CÁMARAS DE APELACIONES EN LO CIVIL, COMERCIAL, LABORAL y de FAMILIA Segunda y Tercera Circunscripción Judicial En caso de excusación, recusación, vacancia u otro impedimento, los miembros de las Salas de la Cámara de Apelación serán suplidos de acuerdo al procedimiento establecido por el Segundo párrafo del art. 52 de la Ley IV- Nº 15:","1) los miembros del Tribunal en lo Penal de la respectiva circunscripción judicial;","2) por los Jueces de Primera Instancia en lo Civil y Comercial de la respectiva circunscripción judicial;","3) por los Jueces de Primera Instancia en el Fuero Laboral de la respectiva circunscripción judicial;","4) por los conjueces de la respectiva circunscripción judicial. (Ac.196/15, pto. Sexto y Ac. 219/15 pto. Sexto) CÁMARA DE APELACIONES EN LO CIVIL, COMERCIAL, LABORAL, de FAMILIA y VIOLENCIA FAMILIAR Cuarta Circunscripción Judicial En los casos de recusación, excusación, vacancia, impedimento o licencia de alguno de sus miembros, serán suplidos en el siguiente orden:","a) por los miembros de la otra Sala, por sorteo;","b) por los Jueces en lo Civil, Comercial y Laboral y de Familia y Violencia Familiar de la Cuarta Circunscripción Judicial con asiento en Puerto Rico, según corresponda;","c) Por el Juez Correccional y de Menores de la Cuarta Circunscripción Judicial, con asiento en Puerto Rico;","d) por el Juez de Instrucción de la Cuarta Circunscripción Judicial, con asiento en Puerto Rico;","e) por los demás Jueces de Primera Instancia del fuero de la Cuarta Circunscripción Judicial;","f) por Conjueces designados conforme a previsiones legales y reglamentarias. (Ac. 29/21, pto. Sexto) CÁMARA DE APELACIONES EN LO LABORAL Primera Circunscripción Judicial: Las normas legales y reglamentarias vigentes para la Cámara de Apelaciones Civil referentes a subrogación entre sus propios miembros y con Vocales de otra Cámara, Jueces y conjueces, serán aplicables en cuanto fueran compatibles. (Ac. 6/93, pto. Cuarto) CÁMARAS DE APELACIONES EN LO PENAL Y DE MENORES Jurisdicción en toda la Provincia De conformidad al art. 52 de la Ley IV-Nº 15, en caso de excusación, recusación, vacancia u otro impedimento de los miembros de las Salas de la Cámaras de Apelaciones, serán suplidos:","1) por los miembros de la otra u otras Salas, por sorteo;","2) por los miembros de la Cámara de Apelaciones del otro fuero, por sorteo;","3) por los Jueces de Primera Instancia del mismo fuero con asiento en la Primera Circunscripción Judicial, por sorteo;","4) por los demás Jueces de Primera Instancia de la mencionada circunscripción;","5) por los Conjueces designados conforme a las previsiones legales y reglamentarias pertinentes. (Ac. 81/13, art. 7º. Anexo) TRIBUNALES EN LO PENAL de todas las Circunscripciones:","En los casos de recusación, excusación, vacancia, impedimento o licencia, los Jueces de los Tribunales en lo Penal se suplirán de la siguiente forma: inc.a) Con los Jueces de otro Tribunal en lo Penal, en aquellas circunscripciones en que haya más de uno, desinsaculados en el sorteo a efectuarse siguiendo un sistema rotativo con exclusión de los magistrados ya sorteados, para volver a empezar cuando la lista ya estuviere agotada.","Donde no hubiera más que un Tribunal Penal, por los miembros de la Cámara de Apelaciones en lo Civil, Comercial y Laboral de la respectiva Circunscripción. inc.b) Con los Jueces en lo Correccional y de Menores de la circunscripción pertinente, sorteados de la misma forma prevista para los Jueces de Tribunal en aquellas circunscripciones en que hubiere más de uno. inc.c) Con los Jueces de Primera Instancia en lo Civil y Comercial y luego en lo Laboral, en ambos casos de la respectiva circunscripción y por sorteo de igual manera; inc.d) Con conjueces, por el procedimiento de la desinsaculación por sorteo entre los que figuran en las nóminas respectivas.","En los casos de integración de los Tribunales, corresponderá la emisión de los primeros votos a los miembros titulares."],"s":"PRESIDENCIA: La Presidencia de las Cámaras de Apelaciones será ejercida en la forma prevista en el art. 50 de la Ley IV-Nº 15","nt":["Ac. 23/05 CSJN, Ac. 119/06, Ac. 136/06, Ac. 65/10, Ac. 77/10. Competencia y Radicación para la Instrucción y el"]},{"n":99,"l":"99","t":"Texto según: Ac. 189/16, Ac. 190/16 Notificación de la integración de las Salas","p":["En caso de la integración se hará saber a las partes personalmente o por cédula la composición de la Sala, la que no fallará la causa antes de que la integración esté consentida."],"s":"En caso de la integración se hará saber a las partes personalmente o por cédula la composición de la Sala, la que no fallará la causa antes de que la integración esté consentida.","nt":[]},{"n":100,"l":"100","t":"Reglamento Interno Acuerdos","p":["Las Cámaras de Apelaciones ajustarán su reglamento interno a las disposiciones del presente y las que el Superior Tribunal dictare en el futuro. Deberán comunicar a éste los días de Acuerdo que señalaren, que no podrán ser menos de dos semanales y alternados, así como las disposiciones reglamentarias que adoptaren.","Hasta tanto cada Tribunal Penal dicte su correspondiente reglamento interno, adoptará para su funcionamiento las disposiciones del Reglamento para el Poder Judicial y Acordadas pertinentes, en cuanto fueren compatibles.","Para la Cámara de Apelaciones en lo Laboral de la Primera Circunscripción, serán de aplicación las normas legales y reglamentarias vigentes para la Cámara de Apelaciones de la Primera Circunscripción Judicial en cuanto fueren compatibles."],"s":"Las Cámaras de Apelaciones ajustarán su reglamento interno a las disposiciones del presente y las que el Superior Tribunal dictare en el futuro","nt":["Ac. 81/13. Acuerdos Ordinarios y Extraordinarios de la Cámara de Apelaciones Penal y de Menores –Art. 13 y 14. (Anexo)"]},{"n":101,"l":"101","t":"Tribunal Pleno","p":["Antes de dictar sentencia en las causas sometidas a su pronunciamiento, cada Sala deberá informarse de la jurisprudencia existente en el Tribunal y de existir resoluciones contradictorias podrá convocar al Tribunal en pleno para fijar jurisprudencia, el que deberá ajustarse en estos casos a lo dispuesto en el art. 53 de la Ley IV-Nº 15."],"s":"Antes de dictar sentencia en las causas sometidas a su pronunciamiento, cada Sala deberá informarse de la jurisprudencia existente en el Tribunal y de existir resoluciones contradictorias podrá convocar al Tribunal en pleno…","nt":["Ac. 81/13. Cámara de Apelaciones Penal y de Menores. Resoluciones (Anexo)","Ac. 81/13. Cámara de Apelaciones Penal y de Menores. Resoluciones (Anexo)"]},{"n":102,"l":"102","t":"Libros de las Cámaras de Apelaciones","p":["Sin perjuicios de los libros que cada Sala debe llevar con arreglo a lo dispuesto por el art. 53 del presente Reglamento, por una Mesa de Entradas común a las Salas en lo Civil, Comercial y Laboral, se llevará un libro dividido en dos secciones, en la primera de las cuales se registrarán con numeración correlativa, conforme al orden de entrada, los expedientes llegados a la Alzada en virtud de recursos de apelación concedidos libremente y en relación así como los recursos de queja interpuestos ante la Cámara. En los casos que fuere requerido algún expediente “ad-efectum videndi” éste quedará registrado en el mismo número del expediente venido en grado de apelación, aclarándose tal circunstancia en la columna de “Observaciones” del libro. Asimismo si el recurso de queja prosperase, el expediente que lo haya motivado será registrado con la misma numeración que ya tuviese el de queja.","En la segunda sección del libro y también con numeración correlativa, pero independiente de la anterior, se registrarán los expedientes que por cualquier otro motivo y en virtud de la competencia de las Salas sean elevados a las mismas.","En caso de que un expediente vuelva a la Alzada por cualquier otro recurso o incidente, a los fines que entienda las mismas Sala que actuó (art. 28 de la Ley IV-Nº 15), se registrará con numeración correlativa si correspondiere de acuerdo al orden de entrada; en caso contrario, éste quedará registrado con el mismo número del anterior, con el agregado “bis”. Los expedientes entrados se distribuirán de acuerdo al número cronológico de ingreso en Mesa de Entradas.","El mismo temperamento se adoptará por la Cámara en lo Criminal, Correccional y de Menores.","Cuando en diversas causas penales conexas hubiesen intervenido distintas Salas, producida la acumulación material de las mismas conocerá en todas ellas la Sala que hubiese intervenido en la de prevención más antigua y en caso de prevenciones simultáneas, la que hubiese intervenido primero.","Asimismo, la Mesa de Entradas de las Cámaras en lo Civil, Comercial y Laboral llevarán un libro dividido en dos secciones destinado al registro de expedientes del fuero laboral llegados a la Alzada, observándose en el mismo las normas que se indican en los apartados primero y segundo del presente artículo."],"s":"Sin perjuicios de los libros que cada Sala debe llevar con arreglo a lo dispuesto por el art. 53 del presente Reglamento, por una Mesa de Entradas común a las Salas en lo Civil, Comercial y Laboral, se llevará un libro…","nt":["Ac. 81/13. Cámara de Apelaciones Penal y de Menores. Libros. (Anexo)"]},{"n":103,"l":"103","t":"Inspección de Juzgados y otros Organismos","p":["Sin perjuicio de las visitas a las cárceles y a otros organismos que deban efectuarse conforme a las leyes, los jueces del Tribunal Penal Oral procederán a realizar, por lo menos una vez al año, una visita de inspección a los Juzgados de primera instancia de dicho fuero de la provincia, a fin de comprobar las condiciones en que los mismos desenvuelven sus respectivos cometidos, examinar sus libros, el estado de las causas, la forma en que se manifiesta en ellas el impulso procesal y formular las observaciones que estimaren convenientes, debiendo informar al Superior Tribunal el resultado de la inspección realizada.","El cumplimiento de esta misión en los juzgados de primera instancia del interior podrá ser delegado a uno solo de los miembros del Tribunal Penal. Con el mismo objeto, los vocales de la Cámara de Apelaciones en lo Civil y Comercial, como así también los vocales de la Cámara Laboral deberán constituirse por lo menos una vez al año en los juzgados de primera instancia de sus fueros.","Cuando la inspección se realizare en el interior de la Provincia podrá delegar la tarea en cualquiera de sus miembros. Al término de la inspección procederá a informar al Superior Tribunal. Así mismo los miembros de los Tribunales Penales, los vocales de las Cámaras de Apelaciones en lo Civil y Comercial y los vocales de la Cámara Laboral por lo menos una vez cada seis meses deberán inspeccionar en los juzgados de primera Instancia de sus respectivos fueros, las órdenes de pagos que se hayan librado en los precitados juzgados de primera instancia, debiéndose indicar en el acta de inspección, la cantidad de las mismas, si ellas fueron libradas en los formularios que provee la Dirección de Administración y si existen la pertinente providencia en los expedientes judiciales en donde se halla ordenado su libramiento; al término de la inspección procederán informar al Superior Tribunal.","Texto según Ac. 125/03 y 64/06 Acdo. 18/6/08: Exceptúa a la Cámara de Apelaciones Civil y Comercial de la 1ª Circunscripción de las obligaciones previstas por el art. 103 in fine del RPJ, encomendando al Cuerpo de Inspectores del Superior Tribunal la inspección del movimiento de órdenes de pago libradas por los juzgados de su jurisdicción. Vigencia: desde el 01/07/08, como experiencia piloto y hasta nueva disposición. (Anexo) Acdo. 05/05/09: Exceptúa a la Cámara de Apelaciones Laboral de la 1ª Circunscripción de las obligaciones previstas por el art. 103 in fine del RPJ, encomendando al Cuerpo de Inspectores del Superior Tribunal la inspección del movimiento de órdenes de pago libradas por los juzgados de su jurisdicción. Vigencia: desde el 01/06/09. (Anexo)"],"s":"Sin perjuicio de las visitas a las cárceles y a otros organismos que deban efectuarse conforme a las leyes, los jueces del Tribunal Penal Oral procederán a realizar, por lo menos una vez al año, una visita de inspección a los…","nt":["Ac. 70/10: Exceptúa a las Cámaras de Apelaciones Civil, Comercial y Laboral de la 2ª y la 3ª Circunscripción de las"]},{"n":104,"l":"104","t":"Examen de Martilleros","p":["Derogado de hecho porque: La Ley 25.028 – Régimen Legal de Martilleros y Corredores modifica la Ley 20.266, exigiendo título universitario habilitante, entre otros requisitos.","Ley 25.028. Régimen Legal de Martilleros y Corredores - modifica la Ley 20.266, exigiendo título universitario habilitante, entre otros requisitos. (Anexo)"],"s":"Derogado de hecho porque: La Ley 25.028 – Régimen Legal de Martilleros y Corredores modifica la Ley 20.266, exigiendo título universitario habilitante, entre otros requisitos.","nt":["Ac. 32/73. Regula la inscripción en la matrícula de los Martilleros en el Registro Público de Comercio y en el Superior","Ac. 6/16. Reglamenta el Registro Público (Ex Reg. de Comercio, Martilleros y Corredores). Deroga la Ac. 100/83 (Anexo)"]},{"n":105,"l":"105","t":"Subrogación de las Secretarías de Cámaras y Tribunales Penales","p":["Los Secretarios de la Cámara de Apelaciones Civil, Comercial, de Familia y Fiscal Tributaria de la Primera Circunscripción se subrogarán de la siguiente forma: el Secretario de la Sala I subrogará al de la Sala III; el Secretario de la Sala II al de la Sala I y el Secretario de la Sala III al de la Sala II. Si mediare ausencia, vacancia o impedimento de todos ellos la subrogación estará a cargo de los Secretarios de las Salas IV y V de la Cámara, en ese orden, y por último por los Secretarios de la Cámara Laboral, comenzando por el de más alta numeración. Los Secretarios de las Salas IV y V se subrogarán entre sí. Si mediare ausencia, vacancia o impedimento de ambos, serán subrogados en primer término por el Secretario de la Sala III, luego por el de la Sala II y luego por el de la Sala I, y por último por los Secretarios de la Cámara Laboral, comenzando por el de más alta numeración. (Ac. 7/17, pto. Primero) Los Secretarios de las Cámaras de Apelaciones Civil, Comercial y Laboral de la Segunda y Tercera Circunscripción Judicial, serán subrogados: a) por los Secretarios de los Juzgados Laborales; b) por los Secretarios de los Juzgados en lo Civil y Comercial; en todos los casos de la respectiva Circunscripción Judicial y en ese orden. (Ac. 213/93 pto. Séptimo, modificado por la Ac. 18/08) Los Secretarios de las Cámaras de Apelaciones Civil, Comercial, Laboral, de Familia y Violencia Familiar de la Cuarta Circunscripción Judicial, con asiento en Puerto Rico se subrogarán: a) entre sí. b) Si mediare ausencia, vacancia o impedimento de los mismos, la subrogación estará a cargo de los Secretarios del Juzgado Civil, Comercial y Laboral; c) del Juzgado de Familia y Violencia Familiar, en todos los casos de la respectiva Circunscripción Judicial con asiento en Puerto Rico. (Ac. 29/21, pto. Noveno) Los Secretarios de la Cámara de Apelaciones en lo Laboral de la Primera Circunscripción Judicial se subrogarán entre sí. Si mediare ausencia, vacancia o impedimento de los mismos, la subrogación estará a cargo de los Secretarios de la Cámara de Apelaciones en lo Civil y Comercial, actuando estos últimos por cuatrimestres, comenzando por el titular de la Sala Iª (Ac. 6/93, pto. Octavo) En las circunscripciones en que hubiera más de un Tribunal Penal, los secretarios se subrogarán entre sí; si mediare ausencia, vacancia o impedimento de los mismos, la subrogación estará a cargo de los Secretarios Correccionales y de Menores, y luego por los de los Juzgados de Instrucción, actuando por trimestres, comenzando por la Secretaría Nº 1 del Juzgado Correccional Nº 1; agotados ellos se continuará con los Secretarios de Instrucción, comenzando con el Secretario Nº 1 del Juzgado de Instrucción Nº 1.","Texto según:"],"s":"Los Secretarios de la Cámara de Apelaciones Civil, Comercial, de Familia y Fiscal Tributaria de la Primera Circunscripción se subrogarán de la siguiente forma: el Secretario de la Sala I subrogará al de la Sala III; el…","nt":["Ac. 135/82. Reglamentación de las Secretarías (Anexo)","Ac. 6/93. Cámara de Apelaciones en lo Laboral 1ª Circ., asume jurisdicción. Subrogación de Secretarios.","Ac. 213/93. Modif. por Ac. Nº 18/08 Secretarías de Cámaras y Tribunales Penales de la 2ª y 3ª Circ. Judicial.","Ac. 111/97. Secretarías de Tribunales Penales donde haya más de un Tribunal","Ac. 18/08. Secretarías de Cámaras y Tribunales Penales de la 2ª y 3ª Circ. Judicial. Modif. Ac. 213/93","Ac. 81/13. Secretarías de Cámara de Apelaciones Penal y de Menores. Art. 16. (Anexo)","Ac. 7/17. Subrogación Secretarías de la Cámara de Apelaciones Civil, Comercial, de Familia y Fiscal Tributaria de la Primera"]},{"n":106,"l":"106","t":"El Juez de Primera Instancia, deberá personalmente: a) Dirigir…","p":["El Juez de Primera Instancia, deberá personalmente:","a) Dirigir el procedimiento y vigilar que los juicios se tramiten dentro de los términos de la Ley sin perjuicio de las obligaciones que en este sentido impone la Ley IV-Nº 15 a los Secretarios de actuación.","b) Dar audiencia a los litigantes y sus representantes todos los días hábiles.","c) Visitar como mínimo una vez por semana las Secretarías del Juzgado a fin de comprobar si los Secretarios y el personal de las mismas cumplen sus obligaciones dentro de las normas que les marca el Código respectivo, la Ley Orgánica y este Reglamento."],"s":"El Juez de Primera Instancia, deberá personalmente: a) Dirigir el procedimiento y vigilar que los juicios se tramiten dentro de los términos de la Ley sin perjuicio de las obligaciones que en este sentido impone la Ley IV-Nº…","nt":[]},{"n":107,"l":"107","t":"Homenajes","p":["Los Jueces de todos los grados podrán disponer la remisión de notas de condolencias; la concurrencia a determinados actos y, en general, las medidas que fuesen de costumbre, con excepción de las que competen al Superior Tribunal de Justicia."],"s":"Los Jueces de todos los grados podrán disponer la remisión de notas de condolencias; la concurrencia a determinados actos y, en general, las medidas que fuesen de costumbre, con excepción de las que competen al Superior…","nt":[]},{"n":108,"l":"108","t":"Turnos","p":["A los efectos de la iniciación de las nuevas causas, los Juzgados de Primera Instancia en lo Civil, Comercial, de Familia y Laboral de la Primera, Segunda y Tercera Circunscripción Judicial, estarán permanentemente de turno. (Ac. 148/07, Art. Tercero) Cada vez que se promueva un juicio o incidente ante los juzgados mencionados, el escrito inicial se presentará en la Mesa de Entradas Única para su asignación y registración, conforme competencia (Ac. 148/07, Art. Cuarto) NOTA: La Ac. 148/07 reglamenta la Mesa de Entradas Única Informatizada –MEUI-, para los Juzgados de Primera Instancia en lo Civil Comercial, de Familia y Laboral de la Primera, Segunda y Tercera Circunscripción Judicial, por lo que el art. 108 en su redacción original se mantiene para la Cuarta Circunscripción, en lo que resulte de aplicación, dado que en su actual conformación, los órganos que la componen de hecho son de turno permanente: -Dos (2) Juzgados de Primera Instancia en lo Civil, Comercial, Laboral y de Familia: Nº 1 con asiento en Puerto Rico y Nº 2 con asiento en Jardín América; -Un (1) Juzgado de Instrucción; -Un (1) Juzgado correccional y de Menores;","Por ello, a continuación se transcribe el texto en su redacción original, según Ac. 73/02:","Art. 108: Los turnos de los Juzgados de Primera Instancia de la Provincia, se ajustarán a las siguientes normas:","1) JUZGADOS EN LO CIVIL Y COMERCIAL: en las Circunscripciones Judiciales con más de un juzgado en éste fuero, los turnos deberán ser de ciento cincuenta (150) expedientes por juzgado.","2) JUZGADOS DE FAMILIA: en las Circunscripciones Judiciales con más de un juzgado de éste fuero, los turnos serán de setenta y cinco (75) expedientes por juzgado.","3) JUZGADOS EN LO LABORAL: en las Circunscripciones Judiciales con más de un Juzgado de éste fuero, los turnos deberán ser de cincuenta (50) expedientes por juzgado.","4) AL INICIARSE EL AÑO CALENDARIO CONTINUARÁ EN TURNO: Aquel que hubiere estado al finalizar el año anterior, siempre hasta completar la cantidad de expedientes, según el fuero, indicadas en los incisos precedentes; debiendo comenzar con la numeración correspondiente al año, pero computando a los fines de las cantidades por turno las ingresadas en el anterior. Continuará luego el turno el juzgado que sigue en orden numérico y así sucesivamente.","5) NO SE COMPUTARÁN: En las cantidades mencionadas en los incisos 1), 2) y 3), los exhortos, oficios, inscripciones en los Registros de Comercio, Actos y Contratos Mandatos y de Juicios Universales, solicitudes de licencia, pedidos de extracción de expedientes del archivo, certificaciones, incidentes y todos los de carácter administrativo.","6) EN LOS CASOS DE CONEXIDAD O DE FUERO DE ATRACCIÓN, los juicios se promoverán directamente en el Juzgado donde radique el principal.","7) AGOTADO CADA TURNO: en los juzgados correspondientes, el Juez deberá comunicarlo a la Cámara de Apelación respectiva y al juzgado que sigue en orden de turno.","Ver además:"],"s":"A los efectos de la iniciación de las nuevas causas, los Juzgados de Primera Instancia en lo Civil, Comercial, de Familia y Laboral de la Primera, Segunda y Tercera Circunscripción Judicial, estarán permanentemente de turno.…","nt":["Ac. 148/07: MEUI – Reglamento de la Mesa de Entrada Única Informatizada de la Primera, Segunda y Tercera","Ac. 77/06: MEUI - Autorización de viajes a menores de edad: Excluye de su introducción por la MEU, ingresando","Ac. 109/06: MEUI - Secretarías de Ejecución Tributaria – Ingreso de causas. (Anexo).","Ac. 59/07 (Pto. Tercero): TURNO PERMANENTE el Juzgado Civil, Comercial, Laboral y de Familia de Alem (Primera","Ac. 92/07 (Pto. Tercero): TURNO PERMANENTE el Juzgado Civil, Comercial, Laboral y de Familia de Jardín América","Ac. 24/09 (Pto. Tercero): TURNO PERMANENTE del Juzgado Civil, Comercial, Laboral y de Familia de Puerto Iguazú.","Ac. 18/11 (Pto. Cuarto): TURNO PERMANENTE del Juzgado Civil, Comercial, Laboral y de Familia Nº1 de Oberá.","Ac. 19/11 (Pto. Cuarto): TURNO PERMANENTE del Juzgado Civil, Comercial, Laboral y de Familia Nº1 de Eldorado.","Ac. 79/12 (Pto. Tercero): TURNO PERMANENTE del Juzgado Civil, Comercial, Laboral y de Familia de San Vicente.","Ac. 234/15 (Pto. Cuarto): TURNO PERMANENTE del Juzgado Civil, Comercial, Laboral, de Fam a N° 2. En los Juzgados en lo Criminal se llevará una Mesa de Entradas por cada Secretaría.","Ver MEUI – Mesa de Entradas Única Informatizada (Anexo) Expediente en que deba actuar Juez Subrogante."],"s":"En todos los Juzgados de Primera Instancia de la Provincia en materia Civil, Comercial, Laboral y de Familia, la distribución de los expedientes que tuvieran entrada, será efectuada por intermedio de una Mesa de Entrada única,…","nt":[]},{"n":110,"l":"110","t":"Notificación de la Radicación","p":["En los juicios en que por inhibición o recusación deba actuar un nuevo Juez en el orden de subrogación legal, dicha causa pasará al Juzgado que le sigue en turno dentro de las veinticuatro horas de ser notificada automáticamente la resolución respectiva, conforme el art. 133 del CPCyC. Si el Juez subrogante perteneciere a un fuero distinto al de la causa, continuará interviniendo el mismo Secretario, salvo caso de recusación o inhibición de dicho Funcionario.","Acdo. de Cámara 8/89 (Anexo)"],"s":"En los juicios en que por inhibición o recusación deba actuar un nuevo Juez en el orden de subrogación legal, dicha causa pasará al Juzgado que le sigue en turno dentro de las veinticuatro horas de ser notificada…","nt":[]},{"n":111,"l":"111","t":"Subrogación de los Jueces","p":["En los casos de recusación, excusación, vacancia, impedimento o licencia, los Jueces de Primera Instancia se suplirán de la siguiente forma:","PRIMERA CIRCUNSCRIPCION JUDICIAL POSADAS Texto según Ac. 81/22.","JUZGADOS En los casos de recusación, excusación, vacancia, impedimento o licencia, los Jueces de Primera Instancia se suplirán de la siguiente forma: -JUZGADOS DE PRIMERA INSTANCIA EN LO CIVIL Y COMERCIAL","1. Entre si CIVIL Y COMERCIAL N° 8 Al CIVIL Y COMERCIAL N° 1 CIVIL Y COMERCIAL N° 7 Al CIVIL Y COMERCIAL N° 8 CIVIL Y COMERCIAL N° 6 Al CIVIL Y COMERCIAL N° 7 CIVIL Y COMERCIAL N° 5 Al CIVIL Y COMERCIAL N° 6 CIVIL Y COMERCIAL N° 4 Al CIVIL Y COMERCIAL N° 5 CIVIL Y COMERCIAL N° 3 Al CIVIL Y COMERCI  así lo establezca la ley en uno de los diarios que figuran inscriptos en el registro especial que llevará el Superior Tribunal de Justicia."],"s":"La publicación de edictos judiciales se hará en el Boletín Oficial de la Provincia y cuando así lo establezca la ley en uno de los diarios que figuran inscriptos en el registro especial que llevará el Superior Tribunal de…","nt":[]},{"n":114,"l":"114","t":"Empresas Periodísticas. Inscripción","p":["Las empresas periodísticas, para inscribirse en el mencionado registro, deberán acreditar; un tiraje mínimo de mil ejemplares diarios, domicilio comercial, lugar de impresión, zona de circulación, fecha de fundación, nombre del editor responsable y la tarifa correspondiente."],"s":"Las empresas periodísticas, para inscribirse en el mencionado registro, deberán acreditar; un tiraje mínimo de mil ejemplares diarios, domicilio comercial, lugar de impresión, zona de circulación, fecha de fundación, nombre…","nt":[]},{"n":115,"l":"115","t":"Edictos en las demás Circunscripciones Judiciales","p":["En el caso de que las demás Circunscripciones Judiciales no existan diarios inscriptos en el registro mencionado en el artículo anterior, las publicaciones deberán efectuarse en diarios de la Capital de la Provincia."],"s":"En el caso de que las demás Circunscripciones Judiciales no existan diarios inscriptos en el registro mencionado en el artículo anterior, las publicaciones deberán efectuarse en diarios de la Capital de la Provincia.","nt":[]},{"n":116,"l":"116","t":"Registro","p":["El Superior Tribunal, los Juzgados de Primera Instancia de todos los fueros y los Juzgados de Paz de todas las categorías llevarán un registro público en el que se consignarán en cada designación el nombre del periódico y la carátula del expediente. Estas designaciones deben ser efectuadas por riguroso orden de figuración en la lista respectiva y no podrá repetirse un diario hasta que la misma no esté agotada. El Secretario de actuación es responsable de la estricta observancia de lo dispuesto. Entre el 15 y el 30 de diciembre, los Juzgados de todos los fueros elevarán al Superior Tribunal una nómina de las designaciones efectuadas durante el año."],"s":"El Superior Tribunal, los Juzgados de Primera Instancia de todos los fueros y los Juzgados de Paz de todas las categorías llevarán un registro público en el que se consignarán en cada designación el nombre del periódico y la…","nt":[]},{"n":117,"l":"117","t":"Texto de edictos, exhortos, mandamientos, oficios y cédulas","p":["Los Juzgados y Tribunales, se atendrán, al disponer la publicación de edictos, y al librar exhortos, mandamientos, oficios y cédulas, a los textos que se consignan en el Apéndice del presente Reglamento, sin perjuicio de las adaptaciones que las modalidades del caso puedan hacer imprescindibles.","Texto uniforme para la redacción de edictos. (Anexo) Ley IV-Nº28 (Antes Ley 3312). Régimen procesal de comunicaciones judiciales y demás requerimientos al Poder Legislativo de la Provincia de Misiones. (Anexo)"],"s":"Los Juzgados y Tribunales, se atendrán, al disponer la publicación de edictos, y al librar exhortos, mandamientos, oficios y cédulas, a los textos que se consignan en el Apéndice del presente Reglamento, sin perjuicio de las…","nt":[]},{"n":118,"l":"118","t":"Informe sobre causas penales","p":["Sin perjuicio del cumplimiento de lo dispuesto en los arts. 46 y 47 del presente Reglamento además entre el 1° y el 8 de julio de cada año, cada Juzgado con competencia en lo Penal y Correccional, deberá elevar al Tribunal Penal un breve informe con respecto al número de causas de índole criminal y correccional ingresadas en el respectivo Juzgado durante el primer semestre cantidad de sentencias dictadas en dicho lapso; el número de expedientes en trámite “con detenido” y la nómina completa de los procesados que se encontrasen privados de su libertad con indicación de la causa a que pertenezcan, la fecha de iniciación de ésta y el estado de la misma al momento del informe."],"s":"Sin perjuicio del cumplimiento de lo dispuesto en los arts. 46 y 47 del presente Reglamento además entre el 1° y el 8 de julio de cada año, cada Juzgado con competencia en lo Penal y Correccional, deberá elevar al Tribunal…","nt":[]},{"n":119,"l":"119","t":"Armas decomisadas en causas penales","p":["Las armas de toda índole que fuesen decomisadas por los Jueces en lo Penal de Primera Instancia serán remitidas al Registro Provincial de Armas a los fines previstos en la Ley Nacional N° 20.429, su decreto reglamentario N° 395/75 y Ley XVII-Nº 9 (Antes Ley 799), dejándose constancia de sus características, marca, numeración y estado de conservación conforme a lo previsto en la Acordada N° 10/75, sin perjuicio de lo dispuesto por la Acordada N° 17/73 en cuanto no ha sido modificada por la legislación referida precedentemente.","Art. 53 inc. 8 Libro de Registro de Armas. Vigencia: a partir del 21/09/2020"],"s":"Las armas de toda índole que fuesen decomisadas por los Jueces en lo Penal de Primera Instancia serán remitidas al Registro Provincial de Armas a los fines previstos en la Ley Nacional N° 20.429, su decreto reglamentario N°…","nt":["Ac. 17/73. Armas depositadas en sede judicial (Anexo)","Ac. 10/75. Modificación Ac. 17/73 (Anexo)","Ac. 49/79. Informes sobre Armas (Anexo)"]},{"n":120,"l":"120","t":"Publicación mensual","p":["Entre el 1° y el 10 de cada mes, los Jueces de Primera Instancia deberán publicar en el Boletín Oficial y remitir a la Cámara de Apelaciones o Tribunal Penal que corresponda, las listas de los juicios pendientes de resolución o sentencia definitiva, de conformidad a lo señalado en el art. 34, Ley IV-Nº 15."],"s":"Entre el 1° y el 10 de cada mes, los Jueces de Primera Instancia deberán publicar en el Boletín Oficial y remitir a la Cámara de Apelaciones o Tribunal Penal que corresponda, las listas de los juicios pendientes de resolución…","nt":[]},{"n":121,"l":"121","t":"Fiscalías de Primera Instancia Nominación y Competencia","p":["LAS FISCALÍAS DE PRIMERA INSTANCIA de la Provincia llevarán la siguiente nominación:","A) PRIMERA CIRCUNSCRIPCIÓN JUDICIAL:","I- CON ASIENTO EN POSADAS:","1) Fuero Penal:","a) Fiscalías de Instrucción a- Fiscalía de Instrucción Nº 1, cuyo titular actuará como Agente Fiscal de Instrucción Nº 1, ante el Juzgado de Instrucción Nº 1; (Ac. 255/91, pto. Vigésimo segundo, inc 1- a) b- Fiscalía de Instrucción Nº 2, cuyo titular actuará como Agente Fiscal de Instrucción Nº 2 ante el Juzgado de Instrucción Nº 2; (Ac. 255/91, pto. Vigésimo segundo, inc 1- a) c- Fiscalía de Instrucción Nº 3, cuyo titular actuará como Agente Fiscal de Instrucción Nº 3 ante el Juzgado de Instrucción Nº 3; (Ac. 155/93, pto. Séptimo) d- Fiscalía de Instrucción Nº 6, cuyo titular actuará como Agente Fiscal de Instrucción Nº 6 actuará ante el Juzgado de Instrucción Nº 6; (Ac. 17/11, pto. Octavo) e- Fiscalía de Instrucción Nº 7, cuyo titular actuará como Agente Fiscal de Instrucción Nº 7 actuará ante el Juzgado de Instrucción Nº 7; (Ac. 17/11, pto. Octavo)","b) Fiscalías Correccional y de Menores a- Fiscalía en lo Correccional y de Menores Nº 1 cuyo titular actuará como Agente Fiscal en lo Correccional y de Menores Nº 1 ante el Juzgado Correccional y de Menores Nº 1. (Ac. 255/91, pto.","Vigésimo segundo, inc 1- b) b- Fiscalía en lo Correccional y de Menores Nº 2 cuyo titular actuará como Agente Fiscal en lo Correccional y de Menores Nº 1 ante el Juzgado Correccional y de Menores Nº 2. (Ac. 255/91, pto.","Vigésimo segundo, inc 1- b)","2) Fuero Civil, Comercial, Laboral y de Familia:","a) Fiscalías Civil, Comercial y Laboral a- Fiscalía Civil, Comercial y Laboral Nº 1 y Nº 2, cuyo titular actuará como Fiscal Civil, Comercial y Laboral Nº 1 y Nº 2, los que actuarán por turnos de quince (15) días cada una, correspondiéndoles la primera quincena a la Fiscalía Nº 1 y la segunda quincena a la Fiscalía Nº 2. (Ac. 20/08, pto. Primero) II- CON ASIENTO EN APÓSTOLES:","1) Fuero Penal:","a) Fiscalía de Instrucción a- Fiscalía de Instrucción Nº 4 cuyo titular actuará como Agente Fiscal de Instrucción Nº 4 ante el Juzgado de Instrucción Nº 4. (Ac. 37/93, pto. Noveno)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía Civil, Comercial, Laboral de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar de Apóstoles (Ac. 4/21, Pto. Sexto) B) SEGUNDA CIRCUNSCRIPCIÓN JUDICIAL.","I- CON ASIENTO EN OBERÁ:","1) Fuero Penal:","a) Fiscalía de Instrucción a- Fiscalía de Instrucción Nº 1, cuyo titular actuará como Agente Fiscal de Instrucción Nº 1, ante el Juzgado de Instrucción Nº 1. (Ac. 213/93, pto. décimo quinto) b- Fiscalía de Instrucción Nº 2, cuyo titular actuará como Agente Fiscal de Instrucción Nº 2, ante el Juzgado de Instrucción Nº 2. (Ac. 213/93, pto. décimo sexto)","b) Fiscalía Correccional y de Menores","a) Fiscalía en lo Correccional y de Menores Nº 1 cuyo titular actuará como Agente Fiscal en lo Correccional y de Menores Nº 1 ante el Juzgado Correccional y de Menores Nº 1. (Ac. 255/91, pto.","Vigésimo segundo, inc 2- b)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalías Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía Civil, Comercial y Laboral, cuyo titular actuará como Fiscal Civil, Comercial y Laboral Nº 1. (Ac. 255/91, pto. Vigésimo segundo, inc. 2- c, que dispone además la pérdida de competencia penal de la que hasta el momento era Fiscalía de Fuero Universal) b- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar Nº 2, cuyo titular actuará como Fiscal Civil, Comercial, Laboral y de Familia Nº 2. (Ac. 18/11, pto. Octavo) II- CON ASIENTO EN ARISTÓBULO DEL VALLE","1) Fuero Civil, Comercial, Laboral y de Familia y Violencia Familiar:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar, cuyo titular ejercerá jurisdicción ante el Juzgado Civil, Comercial, Laboral, de Familia y Violencia Familiar de Aristóbulo del Valle. (Ac. 102/16, pto. Segundo y Tercero) III- CON ASIENTO EN ALEM:","1) Fuero Penal:","a) Fiscalía de Instrucción a- Fiscalía de Instrucción Nº 5, cuyo titular actuará como Agente Fiscal de Instrucción Nº 5 ante el Juzgado de Instrucción Nº 5. (Ac. 37/93, pto. Noveno)","2) Fuero Civil, Comercial, Laboral y de Familia:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral y de Familia a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral y de Familia con asiento en Leandro N. Alem ante el Juzgado Civil, Comercial, Laboral y de Familia de dicha localidad. (Ac. 59/07, pto.","Sexto) C) TERCERA CIRCUNSCRIPCIÓN JUDICIAL.","I- CON ASIENTO EN ELDORADO:","1) Fuero Penal:","a) Fiscalías de Instrucción a- Fiscalía de Instrucción Nº 1, cuyo titular actuará como Agente Fiscal de Instrucción Nº 1, ante el Juzgado de Instrucción Nº 1; (Ac. 213/93, pto. décimo quinto) b- Fiscalía de Instrucción Nº 2, cuyo titular actuará como Agente Fiscal de Instrucción Nº 2, ante el Juzgado de Instrucción Nº 2; (Ac. 213/93, pto. décimo sexto)","b) Fiscalía Correccional y de Menores a- Fiscalía en lo Correccional y de Menores Nº 1 cuyo titular actuará como Agente Fiscal en lo Correccional y de Menores Nº 1 ante el Juzgado Correccional y de Menores Nº 1. (Ac. 255/91, pto.","Vigésimo segundo, inc 3- b)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalías Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía Civil, Comercial y Laboral N° 1 tendrá competencia en el fuero Civil y Comercial. (La Ley 2889, art. 8 inc. b) dispone la pérdida de competencia Penal de la Fiscalía de Fuero Universal) b- Fiscalía Civil, Comercial, Laboral y de Familia Nº 2 tendrá competencia en lo Civil, Comercial, Laboral y de Familia. (Ac. 19/11, pto. Octavo) II- CON ASIENTO EN PUERTO IGUAZÚ:","1) Fuero Penal:","a) Fiscalía de Instrucción a- Fiscalía de Instrucción Nº 3, cuyo titular actuará como Agente Fiscal de Instrucción Nº 3 ante el Juzgado de Instrucción Nº 3. (Ac. 88/06, pto. Séptimo)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar con asiento en Puerto Iguazú; (Ac. 24/09, pto. Séptimo, Ac. 133/18, pto. Séptimo-Cambio de Nominación) III- CON ASIENTO EN ANDRESITO","1) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar con asiento en Comandante Andresito actuará ante el Juzgado Civil, Comercial y Laboral (Ac. 192/18, pto.","Tercero) D) CUARTA CIRCUNSCRIPCIÓN JUDICIAL:","I- CON ASIENTO EN PUERTO RICO","1) Fuero Penal:","a) Fiscalía de Instrucción, Correccional y de Menores a- Fiscalía de Instrucción, Correccional y de Menores N° 1 de la Cuarta Circunscripción Judicial, con asiento en Puerto Rico actuará ante el Juzgado de Instrucción Nº 1 y ante el Juzgado Correccional y de Menores Nº1 con asiento en Puerto Rico. (Ac. 127/21, Pto. Cuarto)","2) Fuero Civil, Comercial, Laboral de Familia y Violencia Familiar","a) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar N.º 1 actuará ante los juzgados del fuero en su competencia territorial (Ac. 127/21, pto. Quinto) II- CON ASIENTO EN JARDÍN AMÉRCA:","1) Fuero Penal","a) Fiscalía de Instrucción a- Fiscalía de Instrucción, cuyo titular actuará como Agente Fiscal de Instrucción ante el Juzgado de Instrucción Nº 2. (Ac. 200/18, pto. Sexto)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral y de Familia con asiento en Jardín América, ante el Juzgado Civil, Comercial, Laboral y de Familia de dicha localidad; (Ac. 92/07, pto.","Sexto) III- CON ASIENTO EN MONTECARLO Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar","a) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar de Montecarlo (Ac. 11/21, pto. Sexto) E) QUINTA CIRCUNSCRIPCIÓN JUDICIAL.","I- CON ASIENTO EN SAN VICENTE:","1) Fuero Penal","a) Fiscalías de Instrucción a- Fiscalía de Instrucción Nº 3, cuyo titular actuará como Agente Fiscal de Instrucción Nº 3 ante el Juzgado de Instrucción Nº 3 (Ac. 64/02 pto. octavo)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar Nº 3, cuyo titular actuará como Fiscal Civil, Comercial, Laboral y de Familia Nº 3 (Ac. 79/12, pto. Sexto) II- CON ASIENTO EN SAN PEDRO","1) Fuero Penal:","a) Fiscalías de Instrucción a- Fiscalía de Instrucción Nº1 , cuyo titular actuará como Agente Fiscal N.º 1 ante el Juzgado de Instrucción de igual denominación (Ac. 38/21, pto. Sexto)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar con asiento en San Pedro a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar de la Tercera Circunscripción Judicial con asiento en la localidad de San Pedro (Ac. 162/19, pto. Cuarto) Ampliado por L.2889, L.2988, Ac.255/91, Ac.37/93, Ac.155/93, Ac.213/93, Ac.64/02, Ac.88/06,"],"s":"LAS FISCALÍAS DE PRIMERA INSTANCIA de la Provincia llevarán la siguiente nominación: A) PRIMERA CIRCUNSCRIPCIÓN JUDICIAL:","nt":["Ac.59/07, L.3936, Ac.92/07, L.4096, Ac.24/09, Ac.17/11, Ac.18/11, Ac.19/11, Ac.79/12, Ac.","Ac. 147/98 pto. Tercero)","Ac. 4/21 Pto. Décimo: cambia denominación de la Defensoría de Fuero Universal por Defensoría Oficial de","Ac. 76/13. Pago de Adicional por Subrogación de Magistrados y Funcionarios con Acuerdo Legislativo"]},{"n":122,"l":"122","t":"Turnos del Ministerio Público","p":["En las causas del fuero Civil, Comercial y Laboral se tendrá en cuenta para determinar el turno, la fecha de entrada del expediente en el Juzgado, y en las cuestiones penales la fecha de comisión del hecho y en caso de duda, la de iniciación del sumario.","A) PRIMERA CIRCUNSCRIPCIÓN JUDICIAL:","I- CON ASIENTO EN POSADAS:","1) Fuero Penal:","a) Fiscalías de Instrucción a- Las Fiscalía de Instrucción Nº 1, Nº 2, Nº 3, Nº 6 y Nº 7 actuarán por turnos mensuales, que coincidirá con el que corresponda al Juzgado de Instrucción de igual denominación. (Ac. 255/91, pto.","Séptimo-para Fiscalías Nº 1 y 2- y Ac. 155/93, pto. Décimo para Fiscalía Nº 3; Ac. 17/11, pto. Décimo segundo para Fiscalías Nº 6 y 7)","b) Fiscalías Correccional y de Menores a- Las Fiscalías en lo Correccional y de Menores Nº 1 y Nº 2 actuarán por turnos mensuales, que coincidirá con el que corresponda al Juzgados en lo Correccional y de Menores de igual denominación. (Ac. 255/91, pto. Vigésimo séptimo)","c) Defensorías de Instrucción a- Las Defensorías de Instrucción Nº 1, Nº 2 y Nº 3, Nº 4 y Nº 5, actuarán por turnos mensuales, que coincidirá con el que corresponda al Juzgado de Instrucción de igual denominación. (Ac. 255/91, pto.","Séptimo-para Defensorías Nº 1 y 2- y Ac. 147/98, pto. Cuarto para Defensoría Nº 3; Ac. 17/11 pto.","Décimo Segundo para Defensorías Nº 4 y Nº 5))","d) Defensorías Oficiales Correccional y de Menores a- Las Defensorías Oficiales en lo Correccional y de Menores Nº 1 y Nº 2 actuarán por turnos mensuales, que coincidirá con el que corresponda al Juzgados en lo Correccional y de Menores de igual denominación. (Ac. 255/91, pto. Vigésimo séptimo)","2) Fuero Civil y Comercial:","a) Fiscalías Civiles de Primera Instancia a- Las Fiscalías Civiles de Primera Instancia Nº 1 y Nº 2 actuarán por turnos de quince (15) días cada una, correspondiéndoles primera quincena a la Fiscalía Nº 1 y la segunda quincena a la Fiscalía Nº 2. (Ac. 20/08, pto. Primero)","b) Defensorías Oficiales de Primera Instancia a- Las Defensorías Oficiales de Primera Instancia números 3, 4, 5, y 6 de la Primera Circunscripción Judicial actuarán por turnos mensuales comenzando el año calendario la Defensoría N° 3.","La Defensoría Civil, Comercial, Laboral y de Familia Nº 7 de Villa Cabello, actuará en turno permanente en su competencia territorial. (Ac. 80/12, pto. Tercero) La Defensoría Civil, Comercial, Laboral y de Familia N° 9 de Itaembé Miní actuará en turno permanente y tendrá jurisdicción territorial dentro de los límites comprendidos por: Ruta Nacional N° 12 - Av. Luís Quaranta (N); Av. Alicia Moreau de Justo (E) (Ruta 213); Av. Nº 254 (S) y Arroyo Mártires (O). (Ac. 158/15, pto. Tercero)","3) Fuero Laboral:","a) Defensoría Oficial del Trabajador a- Defensoría Oficial del Trabajador, que ejercerá su ministerio en todas las Instancias del Fuero Laboral y tendrá las funciones determinadas en el art. 118 inc. 11, 12 y 13 de la Ley IV-N° 15.","II- CON ASIENTO EN GARUPÁ:","1) Fuero Civil, Comercial, Laboral y de Familia:","a) Defensoría Civil, Comercial, Laboral y de Familia a- La Defensoría Civil, Comercial, Laboral y de Familia Nº 8 de Garupá, actuará en turno permanente en su competencia territorial, dentro de los límites del Municipio de Garupá. (Ac. 81/12, ptos. Tercero y Cuarto) III- CON ASIENTO EN APÓSTOLES:","1) Fuero Penal:","a) Fiscalía de Instrucción a- La Fiscalía de Instrucción Nº 4 actuará en turnos permanentes en su competencia territorial. (Ac. 37/93, pto. Décimo cuarto)","2) Defensoría de Instrucción:","a) Defensoría de Instrucción a- La Defensoría de Instrucción Nº 4 actuará en turnos permanentes en su competencia territorial. (Ac. 37/93, pto. Décimo cuarto y Ley 3353; Ac. 4/21 Pto. Décimo cambia la denominación de la dependencia)","1) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar a- La Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar de la ciudad de Apóstoles actuará en turno permanente en su respectiva competencia territorial (Ac. 4/21, pto. Octavo)","b) Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar a- La Defensoría de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar de la ciudad de Apóstoles actuará en turno permanente en su respectiva competencia territorial (Ac. 4/21, pto. Octavo) B) SEGUNDA CIRCUNSCRIPCIÓN:","I- CON ASIENTO EN OBERÁ:","1) Fuero Penal:","a) Fiscalías de Instrucción a- Las Fiscalías de Instrucción Nº 1 y Nº 2actuarán por turnos mensuales que coincidirá con los que correspondan a los Juzgados de Instrucción de igual denominación (Ac. 213/93 pto. Décimo octavo)","b) Fiscalías Correccional y de Menores","a) Fiscalía en lo Correccional y de Menores Nº 1 cuyo titular actuará como Agente Fiscal en lo Correccional y de Menores Nº 1 ante el Juzgado Correccional y de Menores Nº 1. (Ac. 255/91, pto.","Vigésimo segundo, inc 2- b)","c) Defensorías Oficiales de Instrucción y en lo Correccional y de Menores a- Las Defensorías Oficiales de Instrucción, y las Defensorías en lo Correccional y de Menores Nº 1 y Nº 2 actuarán por turnos mensuales. (Ac. 255/91 pto. Vigésimo séptimo).","2) Fuero Civil, Comercial, Laboral y de Familia","a) Fiscalías Civil, Comercial, Laboral y de Familia a- Las Fiscalías en lo Civil, Comercial, Laboral y de Familia actuarán por turnos mensuales, alternándose la Nº 1 y la Nº 2 (Ac. 18/11, pto. Décimo)","b) Defensorías Civil, Comercial, Laboral y de Familia a- Las Defensorías en lo Civil, Comercial, Laboral y de Familia actuarán por turnos mensuales, alternándose Nº 1 y Nº 2 (Ac. 18/11, pto. Décimo)","3) Fuero Laboral:","a) Defensoría Oficial del Trabajador a- Defensoría Oficial del Trabajador, que ejercerá su ministerio en todas las Instancias del Fuero Laboral y tendrá las funciones determinadas en el art. 118 inc. 11, 12 y 13 de la Ley IV-N° 15.","II- CON ASIENTO EN ARISTÓBULO DEL VALLE:","a) Defensoría de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- La Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar estará actuará en turno permanente en su respectiva competencia territorial. (Ac. 234/15, punto Séptimo)","b) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- La Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar, cumplirá turno corrido y continuo en su respectiva competencia territorial. (Ac. 102/16, pto. Tercero) III- CON ASIENTO EN ALEM:","1) Fuero Penal:","a) Fiscalía de Instrucción a- La Fiscalía de Instrucción Nº 5 actuará en turnos permanentes en su competencia territorial. (Ac. 37/93, pto. Décimo cuarto)","2) Fuero Universal:","a) Defensoría Oficial de Instrucción a- La Defensoría Oficial de Instrucción Nº 1 actuará en turnos permanentes en su competencia territorial. (Ac. 37/93, pto. Décimo cuarto y Ley 3353; Ac. 112/21, pto. Séptimo)","3) Fuero Civil Comercial, Laboral y de Familia:","a) Fiscalía Civil, Comercial, Laboral y de Familia a- La Fiscalía Civil, Comercial, Laboral y de Familia con asiento en Alem, actuará en turno permanente en su competencia territorial. (Ac. 59/07, pto. Octavo)","b) Defensoría Civil, Comercial, Laboral y de Familia a- La Defensoría Civil, Comercial, Laboral y de Familia con asiento en Alem, actuará en turno permanente en su competencia territorial. (Ac. 59/07, pto. Octavo) b- Defensoría Oficial de Familia y Violencia Familiar Nº 1 de Leandro N. Alem actuará dentro de la competencia territorial que le asigna la ley. (Ac. 112/21, pto. Décimo C) TERCERA CIRCUNSCRIPCIÓN JUDICIAL:","I- CON ASIENTO EN ELDORADO:","1) Fuero Penal:","a) Fiscalías de Instrucción a- Las Fiscalías de Instrucción Nº 1 y Nº 2 actuarán por turnos mensuales que coincidirá con los que correspondan a los Juzgados de Instrucción de igual denominación (Ac. 213/93, pto. Décimo octavo)","b) Fiscalías Correccional y de Menores a- Fiscalía en lo Correccional y de Menores Nº 1 cuyo titular actuará como Agente Fiscal en lo Correccional y de Menores Nº 1 ante el Juzgado Correccional y de Menores Nº 1. (Ac. 255/91, pto.","Vigésimo segundo, inc 3- b)","c) Defensorías Oficiales de Instrucción y en lo Correccional y de Menores a- Las Defensorías Oficiales de Instrucción y en lo Correccional y de Menores Nº 1 y Nº 2 actuarán por turnos mensuales. (Ac. 255/91 pto. Vigésimo séptimo). b- La actuación de las Defensorías Oficiales de Instrucción, Correccional y de Menores Nº 1 y Nº 2 de la Tercera Circunscripción Judicial con asiento en Eldorado, en la etapa plenaria, en materia correccional, se regulará conforme a la competencia en razón del turno, por aplicación correlativa, metódica y concordante de la reglamentación vigente bajo el presente título “Turnos del Ministerio Público”- Art. 122 RPJ. (Ac. 23/08, Pto. Primero)","2) Fuero Civil Comercial, Laboral y de Familia:","a) Fiscalía Civil, Comercial, Laboral y de Familia a- La Fiscalía en lo Civil, Comercial, Laboral y de Familia Nº 2 actuará por turnos mensuales, alternándose con la Fiscalía Civil y Comercial Nº 1. (Ac. 19/11, pto. Décimo)","b) Defensoría en lo Civil, Comercial, Laboral y de Familia a- La Defensoría en lo Civil, Comercial, Laboral y de Familia Nº 2 actuará por turnos mensuales, alternándose con la Defensoría Civil y Comercial Nº 1. (Ac. 19/11, pto. Décimo) II) CON ASIENTO EN PUERTO IGUAZÚ:","1) Fuero Penal:","a) Agente Fiscal de Instrucción y Defensor Oficial de Instrucción a- El Agente Fiscal de Instrucción y el Defensor Oficial de Instrucción, ambos Nº 3, actuarán en turno permanente en su respectiva competencia territorial. (Ac. 88/06 pto. Décimo primero).","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral y de Familia a- La Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral y de Familia actuará en turno permanente en su respectiva competencia territorial. (Ac. 24/09, pto. Noveno)","b) Defensorías Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Las Defensorías en lo Civil, Comercial, Laboral y de Familia Nº 1 y la Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar Nº 5 de Puerto Iguazú, actuarán por turnos mensuales, comenzando el año calendario por la Defensoría Nº 1. (Ac. 187/16, pto. Sexto) III- CON ASIENTO EN COMANDANTE ANDRESITO:","1) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar Nº 1 actuará en turno permanente en la jurisdicción territorial de Comandante Andresito. (Ac. 90/18, pto. Cuarto)","b) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar Nº 1 actuará en turno permanente en la jurisdicción territorial de Comandante Andresito. (Ac. 192/18, pto. Cuarto) D) CUARTA CIRCUNSCRIPCIÓN JUDICIAL:","I- CON ASIENTO EN PUERTO RICO","1) Fuero Penal:","a) Fiscalía de Instrucción, Correccional y de Menores a- Fiscalía de Instrucción, Correccional y de Menores N° 1 de la Cuarta Circunscripción Judicial, con asiento en Puerto Rico actuará en tumo permanente. (Ac. 127/21, Pto. Tercero)","b) Defensoría Instrucción, Correccional y de Menores Defensoría Oficial de Instrucción, Correccional y de Menores N° 1 de la Cuarta Circunscripción Judicial, con asiento en Puerto Rico actuará en tumo permanente. (Ac. 127/21, Pto. Tercero)","2) Fuero Civil, Comercial, Laboral de Familia y Violencia Familiar","a) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar Nº 1 actuará en turno permanente en su competencia territorial (Ac. 127/21, pto. Quinto)","b) Defensorías Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar N° 1 y Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar N° 2 de Puerto Rico actuarán por turnos mensuales, correspondiendo a la Defensoría N° 1 los meses impares y los pares a la N° 2. Ac 127/21, Pto. Sexto) II- CON ASIENTO EN JARDÍN AMÉRICA","1) Fuero Penal","a) Fiscalía de Instrucción y Defensoría de Instrucción a- La Fiscalía y la Defensoría de Instrucción con asiento en Jardín América actuarán en turno permanente en su respectiva competencia territorial. (Ac. 200/18 punto Décimo Primero)","2) Fuero Civil, Comercial, Laboral y de Familia","a) Defensoría y Fiscalía Civil, Comercial, Laboral y de Familia a- La Defensoría y la Fiscalía Civil, Comercial, Laboral y de Familia con asiento en Jardín América actuarán en turno permanente en su respectiva competencia territorial. (Ac. 92/07, pto. Octavo) III- CON ASIENTO EN MONTECARLO Fuero Civil, Comercial, Laboral de Familia y Violencia Familiar","a) Fiscalía y Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar a- La Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral y Violencia Familiar y la Defensoría Oficial de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar de Montecarlo, actuarán en turno permanente en su respectiva jurisdicción territorial (Ac. 11/21, pto. Séptimo) E) QUINTA CIRCUNSCRIPCIÓN JUDICIAL:","I- CON ASIENTO SAN VICENTE:","1) Fuero Penal:","a) Fiscalía de Instrucción y Defensoría de Instrucción a- La Fiscalía de Instrucción Nº 3 y la Defensoría de Instrucción, actuarán en turno permanente en su respectiva competencia territorial. (Ac. 64/02 pto. Duodécimo).","2) Fuero Civil Comercial, Laboral y de Familia:","a) Fiscalía y Defensoría de Primera Instancia Civil, Comercial, Laboral y de Familia a- La Fiscalía de Primera Instancia Civil, Comercial, Laboral y de Familia Nº 3 y la Defensoría de Primera Instancia Civil, Comercial, Laboral y de Familia Nº 3 estarán en turno permanente en su respectiva jurisdicción territorial. (Ac. 79/12, pto. Octavo) II- CON ASIENTO EN SAN PEDRO","1) Fuero Penal","a) Fiscalía de Instrucción y Defensoría de Instrucción a- La Fiscalía de Instrucción Nº 1 y la Defensoría de Instrucción Nº 1 actuarán en turno permanente en su respectiva jurisdicción territorial. (Ac. 38/21, Pto. Décimo)","2) Fuero Civil, Comercial, Laboral, de Familia y Violencia Familiar:","a) Fiscalía de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar estará en turno permanente en su respectiva jurisdicción territorial (Ac. 162/19, pto. Sexto)","b) Defensoría de Primera Instancia Civil, Comercial, Laboral, de Familia y Violencia Familiar a- Las Defensoría de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar N.º 1 y N.º 2 de la Tercera Circunscripción Judicial con asiento en la localidad de San Pedro actuarán en tumos mensuales, correspondiendo a la N° 1 los meses impares y a la N° 2 los meses pares. (Ac. 162/19, pto. Sexto; Ac. 184/24, pto. Sexto) III- CON ASIENTO EN BERNARDO DE IRIGOYEN","1) Fuero Civil, Comercial, Laboral y de Familia","a) Defensoría de Primera Instancia en lo Civil, Comercial, Laboral y de Familia a- La Defensoría de Primera Instancia en lo Civil, Comercial, Laboral y de Familia Nº 4 de Bernardo de Irigoyen actuará en turno permanente en su respectiva competencia territorial. (Ac. 82/12, pto.","Tercero) Actualizado por Ac.255/91, Ac.37/93, Ac.155/93, Ac.213/93, Ac.147/98, Ac.64/02, Ac.88/06,"],"s":"En las causas del fuero Civil, Comercial y Laboral se tendrá en cuenta para determinar el turno, la fecha de entrada del expediente en el Juzgado, y en las cuestiones penales la fecha de comisión del hecho y en caso de duda,…","nt":["Ac.59/07, Ac.92/07, Ac.20/08, Ac.23/08, L.3353, Ac.24/09, Ac. 17/11, Ac.79/12, Ac.80/12,","Ac.81/12, Ac.82/12, Ac.83/12, Ac. 158/15, Ac. 234/15, Ac. 102/16, Ac. 187/16, Ac. 90/18 , Ac. 192/18, Ac."]},{"n":123,"l":"123","t":"Gestiones de los Defensores Oficiales","p":["Cuando las gestiones que determina el art. 117 de la Ley IV – Nº 15 hayan sido comenzadas en la oficina de un determinado Defensor, los juicios podrán ser iniciados en cualquier mes aunque no sea el que corresponda a su turno."],"s":"Cuando las gestiones que determina el art. 117 de la Ley IV – Nº 15 hayan sido comenzadas en la oficina de un determinado Defensor, los juicios podrán ser iniciados en cualquier mes aunque no sea el que corresponda a su turno.","nt":[]},{"n":124,"l":"124","t":"Patrocinio por el Defensor Oficial","p":["El deber de patrocinar a los pobres cesa para el Defensor Oficial comprobada que sea la existencia de bienes para entender su defensa. En tal caso, el citado funcionario deberá comunicarlo al Juez de la causa y éste notificará al interesado para que en el término de tres días formule las objeciones que creyere pertinentes. Si las formulase, el Juez de oficio, dispondrá las medidas necesarias para determinar si es o no pobre. Si se acreditase lo primero, continuará actuando el mismo Defensor Oficial, en caso contrario o si no hubiese hecho objeciones, se procederá en la forma establecida en el art.53, inc. 2° del CPC."],"s":"El deber de patrocinar a los pobres cesa para el Defensor Oficial comprobada que sea la existencia de bienes para entender su defensa","nt":[]},{"n":125,"l":"125","t":"Los Secretarios de los Juzgados desempeñarán las funciones que…","p":["Los Secretarios de los Juzgados desempeñarán las funciones que por ley corresponden y además las auxiliares compatibles con su cargo que les confíe el Magistrado."],"s":"Los Secretarios de los Juzgados desempeñarán las funciones que por ley corresponden y además las auxiliares compatibles con su cargo que les confíe el Magistrado.","nt":["Ac. 135/82 y 21/83. Reglamentan funcionamiento de las Secretarías (Anexo)","Ac. 109/06. Reglamenta la aplicación de la Ley 4314. Pone en funcionamiento la Secretaría de Ejecución Fiscal del J.C. Nº 1","Ac. 55/08. Secretarías Juzgados de Paz. Certificación de Firmas y Fotocopias. Amplía Art. 5º Ac. 135/82. (Anexo)","Res. 919/09. Pone en funcionamiento la Secretaría de Ejecución Fiscal del J.C. Nº 4 (Aenexo)"]},{"n":126,"l":"126","t":"Turnos a los fines administrativos","p":["A los fines de orden administrativo del Juzgado, se llevará un libro especial de Entradas y Salidas, y cada titular de Secretaría estará de turno durante quince días de cada mes."],"s":"A los fines de orden administrativo del Juzgado, se llevará un libro especial de Entradas y Salidas, y cada titular de Secretaría estará de turno durante quince días de cada mes.","nt":[]},{"n":127,"l":"127","t":"Libros","p":["En cada Secretaría de Juzgado o Tribunal deberá llevarse los libros indicados en el art. 53 del presente Reglamento. Además en cada Secretaría del fuero Penal se llevará el Libro de Fianzas que establece el art. 311 del Código Procesal Penal aprobado por la Ley 2.677, en el que se anotarán aquellas por orden cronológico y sin dejar claros y un Libro de Detenidos con la filiación de los mismos, causas, fecha de detención, libertad o en su caso, pase a disposición de otro Juzgado."],"s":"En cada Secretaría de Juzgado o Tribunal deberá llevarse los libros indicados en el art. 53 del presente Reglamento","nt":[]},{"n":128,"l":"128","t":"Jefes de Personal","p":["Los Secretarios de los Juzgados son los jefes directos del personal de sus respectivas Secretarías, sin perjuicio de la autoridad que sobre el mismo ejerce el Juez a cuyo cargo se hallare el Juzgado.-"],"s":"Los Secretarios de los Juzgados son los jefes directos del personal de sus respectivas Secretarías, sin perjuicio de la autoridad que sobre el mismo ejerce el Juez a cuyo cargo se hallare el Juzgado.-","nt":[]},{"n":129,"l":"129","t":"Acto de presencia en las Subastas","p":["A los efectos de la fiscalización del acto los Secretarios de los Juzgados deberán asistir a los remates judiciales que se dispusieran en los juicios en trámite en sus respectivas Secretarías debiendo suscribir el acta de remate y formular las observancias que estimaren pertinentes. El incumplimiento del Funcionario a dicha obligación se considerará falta grave. Si el Juzgado interviniente fuese de Primera Instancia y la subasta se efectuare dentro de la jurisdicción de un Juzgado de Paz de la respectiva circunscripción judicial, en el respectivo auto podrá disponerse que la referida fiscalización sea ejercida por el Juez o Secretario de dicho Juzgado de Paz.","Las subastas podrán efectuarse en las oficinas del martillero; sobre el mismo inmueble; en el lugar donde se encuentren depositados los bienes o donde el Magistrado respectivo lo considere más conveniente; debiendo en este último caso, expresarse en el auto correspondiente las razones de tal conveniencia.","Las partes interesadas deberán proveer de movilidad a dichos Funcionarios cuando la subasta se realizare fuera del radio del Juzgado."],"s":"A los efectos de la fiscalización del acto los Secretarios de los Juzgados deberán asistir a los remates judiciales que se dispusieran en los juicios en trámite en sus respectivas Secretarías debiendo suscribir el acta de…","nt":[]},{"n":130,"l":"130","t":"Subrogación de los Secretarios","p":["Los Secretarios del Juzgado se reemplazarán entre sí. En su defecto, la sustitución será ejercida por los Secretarios del Juzgado que corresponda, por subrogación legal, comenzando por el de igual numeración de la que es titular el reemplazado.","El reemplazo de los Secretarios, que no obedezcan a excusación se efectuará sin necesidad de dictarse resolución alguna en el respectivo expediente.- El titular de la Secretaría de Ejecución Tributaria del Juzgado Civil y Comercial Nº 7 será subrogado en primer término por los Secretarios de dicho juzgado. Luego por el orden que a continuación se establece: la Secretaría de Ejecución Fiscal Tributaria Nº 7 subrogará a la de igual nombre Nº 4; la Secretaría de Ejecución Fiscal Tributaria Nº 4 subrogará a la de igual nombre Nº 8 y la Secretaría de Ejecución Fiscal Tributaria Nº 8 subrogará a la de igual nombre Nº 7. (Ac. 239/14, pto.","Quinto)."],"s":"Los Secretarios del Juzgado se reemplazarán entre sí. En su defecto, la sustitución será ejercida por los Secretarios del Juzgado que corresponda, por subrogación legal, comenzando por el de igual numeración de la que es…","nt":["Ac. 135/82 y 21/83. Reglamentan funcionamiento de las Secretarías (Anexo).","Ac. 109/06. Subrogación de Secretarías de Ejecución Fiscal creadas por la Ley 4314. Pone en funcionamiento la Secretaría","Res. Presidencia 919/09. Pone en funcionamiento la Secretaría creada en el Juzgado Civil Nº 4 (Anexo)","Ac. 239/14. pto. Quinto: Subrogación de Secretarios de Ejecución Fiscal. (Anexo)"]},{"n":131,"l":"131","t":"En oportunidad de elevar al Superior Tribunal la terna…","p":["En oportunidad de elevar al Superior Tribunal la terna para la designación de Jueces de Paz titulares o suplentes, prevista por el art. 150 de la Constitución de la Provincia, la autoridad municipal respectiva deberá observar en todos los casos los siguientes recaudos:","1) Datos personales completos de los integrantes de la terna;","2) Número de Libreta de Enrolamiento o Libreta Cívica;","3) Número de la Cédula de Identidad y autoridad que la hubiese expedido;","4) Certificado de Salud;","5) Acreditar que los integrantes de la terna reúnen las condiciones mencionadas en los art. 67 y 68 de la Ley IV-Nº 15, y de la Acordada 101/83, según que la propuesta sea para cubrir el cargo de Juez de Paz de primera categoría, segunda categoría o tercera categoría respectivamente.","Ley IV- Nº 15. Art. 87: estableció la Justicia de Paz Letrada para los Juzgados de Primera y Segunda Categoría, manteniendo el sistema de ternas municipales para la Tercera Categoría (Anexo)"],"s":"En oportunidad de elevar al Superior Tribunal la terna para la designación de Jueces de Paz titulares o suplentes, prevista por el art. 150 de la Constitución de la Provincia, la autoridad municipal respectiva deberá observar…","nt":["Ac. 101/83. Jueces de Paz. Anexo"]},{"n":132,"l":"132","t":"Terna alternativa - Facultades del Superior Tribunal","p":["Cualquiera que fuese el orden en que figuren los propuestos en la lista, la misma será considerada como de naturaleza alternativa, debiéndose en lo posible, previamente a toda designación, comisionar a uno o más miembros del Superior Tribunal a los efectos de que tomen conocimiento personal de los candidatos y recaben a tal fin la opinión de las personas e instituciones del medio.-"],"s":"Cualquiera que fuese el orden en que figuren los propuestos en la lista, la misma será considerada como de naturaleza alternativa, debiéndose en lo posible, previamente a toda designación, comisionar a uno o más miembros del…","nt":[]},{"n":133,"l":"133","t":"Comisiones Encomendadas","p":["El diligenciamiento de las comisiones que le fueren encomendadas a los Jueces de Paz deberán ser practicadas por éstos dentro de un término que no podrá exceder de diez días hábiles siguientes a la recepción.","Si se hubiese dispuesto la intervención del interesado y éste no concurriese en el término señalado, procederá a devolver la comunicación del organismo judicial de origen, con la constancia correspondiente.-"],"s":"El diligenciamiento de las comisiones que le fueren encomendadas a los Jueces de Paz deberán ser practicadas por éstos dentro de
