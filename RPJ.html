agistrados de quienes dependerán, pudiendo estos delegar dicha facultad.- Juramentos de empleados","p":["Al ingresar a la Administración de Justicia los empleados prestarán juramento ante el Presidente del Tribunal, Magistrado o Funcionario de quienes directamente dependerán. En los Juzgados de Primera de Instancia la recepción del juramento podrá ser delegada en algunos de los Secretarios.-"],"s":"Al ingresar a la Administración de Justicia los empleados prestarán juramento ante el Presidente del Tribunal, Magistrado o Funcionario de quienes directamente dependerán","nt":[]},{"n":254,"l":"254","t":"Sin perjuicio de las obligaciones que establecen las leyes,…","p":["Sin perjuicio de las obligaciones que establecen las leyes, los Magistrados y Funcionarios y empleados están obligados a: *1) Observar una conducta irreprochable, tanto en el desempeño de sus tareas como fuera de ellas y en el uso de las distintas plataformas digitales de comunicación. *Inc. 1 Texto según Ac. 73/20, pto. Primero. Vigencia: a partir 1° de Julio de 2020.","2) Residir en el lugar en que se desempeñen sus tareas o dentro de un radio de pronta comunicación que no exceda de cincuenta kilómetros de aquél. El Superior Tribunal podrá dispensar temporalmente de esta obligación a los Magistrados de todas las instancias y a los demás Funcionarios y empleados de la administración de justicia.","3) No evacuar consultas ni dar asesoramiento en los casos de contienda judicial actual o posible.","4) No realizar actos de proselitismo político en los lugares de trabajo o con motivo u ocasión del desempeño de sus funciones. El agente que pretendiese ser o fuere electo para desempeñar cargos de representación política en el orden nacional o provincial o fuera designado miembro o Funcionario del Poder Ejecutivo o Legislativo de la Nación o de la Provincia, deberá solicitar licencia a partir del momento en que fuere nominado, la que será acordada sin percepción de haberes hasta quince (15) días después de finalizado su mandato. Si terminada la licencia el agente no se presentare a retomar su cargo, se considerará que hace abandono del mismo. Igual obligación rige para el agente que fuera nominado para ejercer una representación política en municipalidades de primera y segunda categorías, o fuere designado para ejercer funciones en las mismas.","5) Levantar en el plazo de sesenta días, contados desde la fecha de su notificación, bajo apercibimiento de suspensión o cesantía, cualquier embargo que se trabe sobre sus sueldos o el concurso que se hubiere decretado. Excepcionalmente y con mención específica de la razón que lo determine, el Superior Tribunal podrá ampliar este plazo y aún eximir al interesado del cumplimiento de esta obligación.","6) No prestar servicios por ningún título en estudios de abogados, escribanos procuradores u otros profesionales que actúen en el foro de la Provincia.","7) No ejercer profesiones liberales ni aún con motivos de nombramientos de oficio o a propuesta de partes.","8) No practicar deportes como profesional.","9) No participar en asociaciones profesionales, con excepción de las mutualistas, ni en comisiones directivas de ninguna asociación, sin autorización del Superior Tribunal.","10) Abstenerse de peticionar a las autoridades de otros poderes del Estado por motivos vinculados con el Poder Judicial, en cualesquiera de sus aspectos, sin la venia de la autoridad de superintendencia.","11) Respetar la vía jerárquica en todas las comunicaciones y/o peticiones internas del Poder Judicial. *12) Los Magistrados y Funcionarios de todos los grados no podrán ausentarse de la circunscripción sin previa comunicación a sus superiores ni abandonar la jurisdicción provincial sin autorización expresa de los mismos. Exceptúase de lo ordenado precedentemente a aquellos Magistrados y Funcionarios que se ausenten de su jurisdicción en ocasión de tránsito vecinal fronterizo, saliendo e ingresando por las zonas aduaneras correspondientes, con los países limítrofes de Paraguay y Brasil, siempre y cuando el Magistrado o Funcionario en cuestión no se encuentre de turno, dicho período de tránsito no exceda de 12 hs. y no se exceda de los 50 km. de radio permitidos para alejarse de su jurisdicción, caso contrario deberán solicitar la autorización pertinente. *Inc. 12. Texto según Ac. 53/17"],"s":"Sin perjuicio de las obligaciones que establecen las leyes, los Magistrados y Funcionarios y empleados están obligados a: *1) Observar una conducta irreprochable, tanto en el desempeño de sus tareas como fuera de ellas y en el…","nt":[]},{"n":255,"l":"255","t":"Obligaciones especiales","p":["Los Magistrados, Funcionarios y empleados están especialmente obligados y su inobservancia será considerada falta grave a:","1) Guardar absoluta reserva con respecto a los asuntos vinculados con las funciones de los respectivos Tribunales y dependencias judiciales o administrativas, sin perjuicio de la información que pueda suministrarse al periodismo en los casos en que se encuentre en juego un interés público, aunque respetando siempre las necesidades fundadas de mantener reserva que impongan las leyes o reglamentos, como así el propio criterio del Magistrado, Funcionario o empleado.","2) No gestionar asuntos de terceros ni interesarse por ellos, salvo los supuestos de representación necesaria.","3) Rehusar dádivas o beneficios.","4) No practicar juegos por dineros ni frecuentar lugares destinados a ellos.","5) No ejercer el comercio ni actividad lucrativa alguna sin autorización de la autoridad de Superintendencia.","6) No desempeñar ningún empleo público o privado, con las excepciones previstas en el art. 20 de la Ley IV- Nº 15, aún con carácter interino, sin autorización de la autoridad de Superintendencia.","A los efectos de este artículo, entiéndese por “cargo privado” toda actividad retribuida dependiente de terceros. Exceptuándose los cargos docentes y las comisiones de estudios, siempre que no mediare incompatibilidad horaria.","Circular Nº 7/15 - Prohibición de ejercer la docencia y tomar exámenes en horario matutino, bajo pena de considerarse falta grave, salvo expresa autorización de éste Alto Cuerpo."],"s":"Los Magistrados, Funcionarios y empleados están especialmente obligados y su inobservancia será considerada falta grave a: 1) Guardar absoluta reserva con respecto a los asuntos vinculados con las funciones de los respectivos…","nt":[]},{"n":256,"l":"256","t":"Obligación de Inventario de Bienes","p":["Los Magistrados y Funcionarios, al hacerse cargo y al cesar en sus funciones, levantarán un inventario de los bienes inventariables existentes en su oficina y que estuviesen bajo su directa dependencia, indicando características y estado de los mismos. Dicho inventario será elevado a la Secretaría Administrativa y de Superintendencia del Superior Tribunal, dejándose copia en la oficina.-"],"s":"Los Magistrados y Funcionarios, al hacerse cargo y al cesar en sus funciones, levantarán un inventario de los bienes inventariables existentes en su oficina y que estuviesen bajo su directa dependencia, indicando…","nt":[]},{"n":257,"l":"257","t":"Obligaciones especiales de los Secretarios","p":["Sin perjuicio de las demás obligaciones señaladas en las leyes y en este Capítulo, los Secretarios de todas las instancias están especialmente obligados a:","1) Velar por el orden, disciplina y eficacia de la labor que realiza el personal a sus órdenes, siendo directamente responsable de la conducta observada por los mismos.","2) Velar por el fiel cumplimiento de las leyes, reglamentos, resoluciones directivas impartidas por el Superior Jerárquico.","3) Hacer saber a su Superior Jerárquico su retiro temporario de la Secretaría."],"s":"Sin perjuicio de las demás obligaciones señaladas en las leyes y en este Capítulo, los Secretarios de todas las instancias están especialmente obligados a: 1) Velar por el orden, disciplina y eficacia de la labor que realiza…","nt":[]},{"n":258,"l":"258","t":"Obligaciones especiales de los empleados","p":["Además de las obligaciones indicadas en el presente capítulo los empleados deberán:","1) Dar aviso inmediato a su jefe o al sustituto, a los efectos de su comunicación a la autoridad superior, cuando les fuera imposible concurrir a su empleo.","2) No abandonar su labor sin permiso de su jefe.","3) Observar las normas de disciplina, corrección y respeto en el trato directo con sus superiores jerárquicos, el respeto del personal, profesionales y público. *4) Cumplir estrictamente la vestimenta exigida por Acordada debiendo el jefe inmediato tomar las medidas pertinentes en caso de inobservancia."],"s":"Además de las obligaciones indicadas en el presente capítulo los empleados deberán: 1) Dar aviso inmediato a su jefe o al sustituto, a los efectos de su comunicación a la autoridad superior, cuando les fuera imposible…","nt":["Ac. 36/77 y 11/81 (Anexo)"]},{"n":259,"l":"259","t":"Uso del teléfono","p":["Queda prohibido sin ninguna excepción el uso de los teléfonos de los Juzgados dependencias del Ministerio Público y demás organismos del Poder Judicial de la Provincia, para comunicaciones de larga distancia de carácter particular, debiendo limitarse las oficiales a las necesidades imprescindibles del servicio.","Las comunicaciones urbanas por motivos de carácter particular sólo podrán ser autorizadas por el Jefe inmediato en caso de impostergable necesidad."],"s":"Queda prohibido sin ninguna excepción el uso de los teléfonos de los Juzgados dependencias del Ministerio Público y demás organismos del Poder Judicial de la Provincia, para comunicaciones de larga distancia de carácter…","nt":[]},{"n":260,"l":"260","t":"Registro de llamadas telefónicas","p":["En cada Juzgado o dependencia que tenga teléfono deberá llevarse un cuaderno o anotador en el que se consignarán la fecha, el destinatario, motivo de cada llamada a larga distancia que por razones de servicio judicial se dispusiere."],"s":"En cada Juzgado o dependencia que tenga teléfono deberá llevarse un cuaderno o anotador en el que se consignarán la fecha, el destinatario, motivo de cada llamada a larga distancia que por razones de servicio judicial se…","nt":[]},{"n":261,"l":"261","t":"Remisión de planillas de llamadas","p":["Al término de cada uno de los bimestres: enero-febrero; marzo-abril; mayo-junio; julio-agosto; septiembre-octubre; y noviembre-diciembre, la Secretaria o el Jefe de dependencia respectivos deberán remitir a la Secretaría Administrativa y de Superintendencia, una planilla discriminatoria de las llamadas a que se refiere el artículo anterior. No se librará ninguna orden de pago por el servicio telefónico correspondiente, en tanto no se haya dado cumplimiento dicha remisión, siendo responsable el Secretario o Jefe de cada dependencia o Juez de Paz, si, por no haberse efectuado dicho envío en el tiempo debido o por registrar la planilla deficiencias o por otras causas, la empresa dispusiere la suspensión o cancelación del servicio por falta de pago; ello sin perjuicio de aplicar al funcionario moroso las sanciones disciplinarias que correspondiere."],"s":"Al término de cada uno de los bimestres: enero-febrero; marzo-abril; mayo-junio; julio-agosto; septiembre-octubre; y noviembre-diciembre, la Secretaria o el Jefe de dependencia respectivos deberán remitir a la Secretaría…","nt":[]},{"n":262,"l":"262","t":"Obligaciones especiales del personal de servicio","p":["Sin perjuicio de cumplir con las demás obligaciones contenidas en este capítulo, el personal de servicio y choferes deberán:","1) Permanecer en los lugares que les fueren destinados y no hacer abandono de ellos sin previa orden del Mayordomo, salvo en los casos de llamados directos por parte de sus Jefes o del personal los que deberán ser cumplimentados de modo diligente y en el menor tiempo posible.","2) Diariamente, al finalizar sus tareas, los ordenanzas deberán recorrer los sectores asignados, para cerrar ventanas, apagar luces, etc., verificando el cerramiento seguro de los locales.","3) Los choferes deberán limitarse al cumplimiento estricto de la diligencia que les fuera encomendada por los Jueces, Funcionarios o Mayordomo de quienes dependan, debiendo consignarse en un cuaderno especial las horas de comienzo y finalización del respectivo cometido y la mención del Juez, Funcionario o Mayordomo que lo haya ordenado.","4) Los choferes deberán solicitar al Mayordomo la autorización correspondiente cuando sus servicios fueran requeridos por los Jefes de Mesa de Entradas u otros empleados para el cumplimiento de diligencias judiciales o administrativas fuera del Tribunal, Juzgado o dependencia.","5) Mientras no se encuentren afectados al cumplimiento de alguna diligencia específica Los choferes deberán cooperar en la dependencia a que pertenezcan en la realización de las tareas internas que les fueren encomendadas.","6) Los choferes son directamente responsables del correcto uso, cuidado y conservación de los vehículos a su cargo, debiendo mantenerlos siempre limpios y en las mejores condiciones posibles. Al finalizar sus tareas deberán guardarlos en el lugar del Tribunal, Juzgado o dependencia destinado al efecto.","7) Será considerada falta grave, que podrá llegar hasta la cesantía del empleado, la afectación por los choferes de los vehículos a su cargo a tareas distintas a las ordenadas o al empleo de los vehículos oficiales en tareas extrañas a la labor judicial, dentro del horario de trabajo o fuera de él."],"s":"Sin perjuicio de cumplir con las demás obligaciones contenidas en este capítulo, el personal de servicio y choferes deberán: 1) Permanecer en los lugares que les fueren destinados y no hacer abandono de ellos sin previa orden…","nt":[]},{"n":263,"l":"263","t":"Jefe del personal de servicio","p":["El Mayordomo o el empleado que lo sustituya en caso de licencia, ausencia o impedimento o el designado en los juzgados u otras dependencia del Poder Judicial, es el Jefe directo del personal de servicio, debiendo éste cumplir de modo inmediato y diligente las órdenes que le impartiera el Mayordomo o Jefe. Todo acto de desobediencia o irrespetuosidad deberá ser inmediatamente comunicado por el Mayordomo o Jefe a la autoridad superior de la repartición, a los efectos de la adopción de las medidas que correspondieren.","Personal de servicio que se desempeña en inmuebles donde funciona más de un organismo del Poder Judicial"],"s":"El Mayordomo o el empleado que lo sustituya en caso de licencia, ausencia o impedimento o el designado en los juzgados u otras dependencia del Poder Judicial, es el Jefe directo del personal de servicio, debiendo éste cumplir…","nt":[]},{"n":264,"l":"264","t":"En los inmuebles donde funciona más de un organismo…","p":["En los inmuebles donde funciona más de un organismo del Poder Judicial, el personal de servicio es afectado en común para todos ellos, debiendo realizar sus tareas bajo la dirección de un Jefe o Mayordomo, quien recibirá las órdenes o instrucciones que los Magistrados o Funcionarios les impartan, todo sin perjuicio de los artículos 262 y 263 del presente Reglamento. A tales efectos y en lo referente a las relaciones administrativas y la aplicación del Reglamento el personal de servicio estará directamente bajo la superintendencia del Magistrado o Funcionario de mayor jerarquía.","En los casos de Magistrados y Funcionarios de igual jerarquía, se ejercerá la superintendencia rotativamente, comenzando por el de más baja numeración y por el término que se establezca por resolución de Presidencia del Superior Tribunal de Justicia.","Las propuestas de designación del personal de servicio deberán ser elevadas por el Magistrado o Funcionario de turno, con la conformidad de los demás colegas que ocupan el mismo inmueble."],"s":"En los inmuebles donde funciona más de un organismo del Poder Judicial, el personal de servicio es afectado en común para todos ellos, debiendo realizar sus tareas bajo la dirección de un Jefe o Mayordomo, quien recibirá las…","nt":[]},{"n":265,"l":"265","t":"Unidades automotrices destinadas a juzgados del interior","p":["La o las unidades automotrices propiedad del Poder Judicial y destinadas a los Juzgados del interior, estarán bajo el contralor directo del Juez en lo Penal más antiguo, y al servicio de todos los Juzgados de la Circunscripción, salvo los de Paz.","Para el uso de estas unidades se observarán las disposiciones de la Acordada N° 24/67.* *Anexo."],"s":"La o las unidades automotrices propiedad del Poder Judicial y destinadas a los Juzgados del interior, estarán bajo el contralor directo del Juez en lo Penal más antiguo, y al servicio de todos los Juzgados de la…","nt":[]},{"n":266,"l":"266","t":"Los empleados registrarán personalmente la entrada y la salida…","p":["Los empleados registrarán personalmente la entrada y la salida diaria en el reloj de la dependencia, si lo hubiera, o en planillas mensuales que se llevarán al efecto.","El horario establecido deberá cumplirse estrictamente, de modo tal que la hora exacta de iniciación de las tareas el personal se encuentre en su puesto, no debiendo retirarse antes de la hora indicada como finalización de aquéllas."],"s":"Los empleados registrarán personalmente la entrada y la salida diaria en el reloj de la dependencia, si lo hubiera, o en planillas mensuales que se llevarán al efecto.","nt":["Ac. 31/08. Reglamenta uso de Relojes de Control de Puntualidad y Asistencia. (Anexo)"]},{"n":267,"l":"267","t":"De los permisos","p":["Los permisos para llegar después o retirarse antes de hora, como asimismo para ausentarse durante el período de labor, quedan por regla general, prohibidos, solo podrán otorgarse si circunstancias excepcionales y debidamente fundadas justificasen transitoriamente el permiso. Los Secretarios de los Tribunales, o Juzgados, los titulares de los Ministerios Públicos y los Jefes de dependencia, llevarán un libro donde se consignarán los pedidos de retiros efectuados por el personal a sus órdenes, determinándose el nombre y apellido del solicitante, el motivo y la hora de salida y regreso. Establecer el permiso por motivos de adaptación escolar de hijo/a en el nivel inicial y primer grado, debiendo el agente presentar una constancia expedida por la institución educativa correspondiente. Establecer el permiso para acompañamiento escolar para asistir a reuniones o actos escolares de los hijos/as en todos los niveles escolares, el que no podrá exceder de las 12 horas anuales. Para los dos últimos permisos, el funcionario o jefe autorizante de la dependencia que corresponda, debe dejar asentado en el libro donde se consignan los pedidos de retiros efectuados por el personal determinándose el nombre y apellido del solicitante, la hora de salida y regreso. En el caso de que ambos progenitores integren el personal del Poder Judicial de Misiones, el permiso solo podrá ser utilizado por uno de ellos, salvo que haya más de un hijo/a en la misma situación, en cuyo caso ambos podrán hacer uso del permiso"],"s":"Los permisos para llegar después o retirarse antes de hora, como asimismo para ausentarse durante el período de labor, quedan por regla general, prohibidos, solo podrán otorgarse si circunstancias excepcionales y debidamente…","nt":["Ac. 31/08. Reglamenta uso de Relojes de Control de Puntualidad y Asistencia. (Anexo)"]},{"n":268,"l":"268","t":"Sanciones","p":["El retiro del trabajo sin causas justificadas y permiso del Jefe o Secretario, según correspondiere, implicará el descuento de un día de sueldo, sin perjuicio de las sanciones disciplinarias pertinentes."],"s":"El retiro del trabajo sin causas justificadas y permiso del Jefe o Secretario, según correspondiere, implicará el descuento de un día de sueldo, sin perjuicio de las sanciones disciplinarias pertinentes.","nt":[]},{"n":269,"l":"269","t":"Registro de Inasistencias y Tardanzas","p":["El funcionario o empleado designado por el Presidente, Juez, titular del Ministerio Público o Jefe, como encargado de las planillas de asistencia, las controlará diez minutos después de iniciadas las tareas, trazando una línea horizontal con lápiz rojo en el lugar correspondiente a los empleados que no hubiesen registrado su firma.","En las dependencias donde hubiere reloj marcador, en control de las tarjetas se hará mensualmente."],"s":"El funcionario o empleado designado por el Presidente, Juez, titular del Ministerio Público o Jefe, como encargado de las planillas de asistencia, las controlará diez minutos después de iniciadas las tareas, trazando una línea…","nt":[]},{"n":270,"l":"270","t":"Justificación de Tardanzas","p":["El empleado que se presentase después de los 10 minutos y antes de los 60 minutos de iniciados las tareas, deberá justificar ante el Secretario, titular del Ministerio Público o Jefe de la oficina de quien dependa, el motivo de su falta de puntualidad y únicamente si la razón fuesen debidamente fundada y atendible se le podrá justificar la tardanza. Si no fuese justificada por el Jefe de la dependencia, será sancionado con el descuento de medio día de sueldo."],"s":"El empleado que se presentase después de los 10 minutos y antes de los 60 minutos de iniciados las tareas, deberá justificar ante el Secretario, titular del Ministerio Público o Jefe de la oficina de quien dependa, el motivo…","nt":[]},{"n":271,"l":"271","t":"Tardanzas superiores a una hora","p":["Toda tardanza injustificada que excediese de los primeros sesenta minutos de la hora fijada para la iniciación de las tareas, será considerada falta de asistencia. En estos casos, el empleado que incurriera en el retraso, deberá exponer brevemente por escrito las razones del mismo y la justificación sólo podrá acordarse excepcionalmente y con criterio restrictivo. Los secretarios no se hallan facultados para justificar estas tardanzas, debiendo conocer de las mismas el Presidente del Tribunal o el Juez respectivo.","Si la tardanza no fuese justificada el empleado podrá retirarse de la oficina, debiendo, se retire o no, descontársele los haberes de ese día al finalizar el mes.","En las oficinas administrativas y del Ministerio Público, el conocimiento de estas tardanzas estará a cargo de los respectivos Jefes."],"s":"Toda tardanza injustificada que excediese de los primeros sesenta minutos de la hora fijada para la iniciación de las tareas, será considerada falta de asistencia","nt":[]},{"n":272,"l":"272","t":"Justificaciones de Inasistencias de Empleados","p":["El empleado que tuviese impedimento insuperable para concurrir a sus tareas, deberá arbitrar la forma para hacer saber de inmediato dicha circunstancia a su jefe directo, sea por vía telefónica o por otro medio, con exposición concreta de la causa que le impide cumplir con su obligación del día. Al día siguiente o subsiguiente, según el caso, el empleado deberá ratificar por escrito el motivo de su inasistencia, el que será apreciado por el Presidente del Tribunal Juez, titular del Ministerio Público o Jefe de la oficina, los que únicamente podrán justificarla si la causa invocada fuera atendible y razonablemente insuperable, a cuyo efecto requerirá al agente las aclaraciones y explicaciones que considere convenientes. Contra lo resuelto no procederá recurso alguno. No se podrán justificar más de dos (2) inasistencias por mes y hasta un máximo de seis (6) por año. Toda falta de hasta dos días debe considerarse como inasistencia, con excepción de las previstas en el art. 311 que serán consideradas como licencia.","Resolución 117-STJ-80 Sanciones por inasistencias reiteradas (Anexo)"],"s":"El empleado que tuviese impedimento insuperable para concurrir a sus tareas, deberá arbitrar la forma para hacer saber de inmediato dicha circunstancia a su jefe directo, sea por vía telefónica o por otro medio, con exposición…","nt":[]},{"n":273,"l":"273","t":"Jueces de Paz. Inasistencias y autorización para ausentarse","p":["El Jefe de la Inspección de la Justicia de Paz conocerá de los pedidos de justificación de inasistencias y de las autorizaciones para ausentarse de la jurisdicción hasta por dos días, de los Jueces de Paz de todas las categorías."],"s":"El Jefe de la Inspección de la Justicia de Paz conocerá de los pedidos de justificación de inasistencias y de las autorizaciones para ausentarse de la jurisdicción hasta por dos días, de los Jueces de Paz de todas las categorías.","nt":[]},{"n":274,"l":"274","t":"Inasistencias de Magistrados y Funcionarios","p":["El Presidente del Superior Tribunal entenderá en las inasistencias de hasta dos (2) días de los señores Ministros del Alto Cuerpo, del Procurador General, de los Presidentes de Cámara Jueces de Primera Instancia, Jefe de Inspección de Justicia de Paz, Jefe del Archivo General de los Tribunales, Director de Biblioteca, Secretarios del Superior Tribunal, Jefe de la Oficina de Mandamientos y Notificaciones y Jefe de la Oficina de Seguridad. El Procurador General conocerá de las inasistencias por igual término de los titulares de los Ministerios Públicos. Los Presidentes de las Cámaras de Apelaciones conocerán igualmente de las inasistencias de hasta dos (2) días de los Vocales y Secretarios de las respectivas Cámaras y los Jueces de Primera Instancia y de Paz, de las de los Secretarios de su Juzgado: El Jefe de Inspección de Justicia de Paz conocerá de las inasistencias también de hasta dos (2) días, del Subjefe, el Director de Administración del Poder Judicial, de las del Subdirector y Tesorero, el Director de Biblioteca del Subdirector de la misma dependencia, el Jefe de la Oficina de Mandamientos y Notificaciones de las de los Oficiales de Justicia y el Jefe de la oficina de Seguridad, de las de su personal."],"s":"El Presidente del Superior Tribunal entenderá en las inasistencias de hasta dos (2) días de los señores Ministros del Alto Cuerpo, del Procurador General, de los Presidentes de Cámara Jueces de Primera Instancia, Jefe de…","nt":[]},{"n":275,"l":"275","t":"Exhibición de los Legajos de Inasistencias","p":["En la ocasión señalada por los arts. 75, 103 y 139 del presente Reglamento, los miembros del Superior Tribunal, el Procurador General, los Vocales de las Cámaras de Apelaciones o el Jefe de Inspección de Justicia de Paz, según correspondiere, requerirán a los titulares de los Juzgados y demás dependencias del Poder Judicial, inspeccionadas, la exhibición de los legajos de justificación de inasistencias, tardanzas y el libro de retiro, pudiendo observar y aun sancionar en el mismo acto a los Magistrados o Funcionarios que en la justificación de inasistencias tardanzas o concesión de permisos hubieran procedido con manifiesta complacencia."],"s":"En la ocasión señalada por los arts. 75, 103 y 139 del presente Reglamento, los miembros del Superior Tribunal, el Procurador General, los Vocales de las Cámaras de Apelaciones o el Jefe de Inspección de Justicia de Paz, según…","nt":[]},{"n":276,"l":"276","t":"Verificación de Asistencia y Puntualidad","p":["Por lo menos una vez al mes, los titulares del Ministerio Público, los Secretarios del Superior Tribunal, de las Cámaras de Apelaciones y de los Juzgados, el Director de Administración, el Jefe de la Inspección de Justicia de Paz, el Jefe del Archivo General de los Tribunales, el Director de Biblioteca, el Jefe de la Oficina de Mandamientos y Notificaciones y el jefe de la oficina de Seguridad deberán comprobar personalmente el cumplimiento del horario de entrada a sus tareas de los empleados de la dependencia a su cargo, a cuyo efecto deberán encontrarse en esas oportunidades en sus respectivos despachos como máximo quince minutos después del comienzo de la labor diaria.","Dejarán constancia de su presencia al pie de la planilla de asistencia del día o en las tarjetas de control y harán saber al Presidente del Superior Tribunal de las Cámaras de Apelaciones o Juez, según el caso, las irregularidades que observaren.","En los Tribunales o Juzgados donde hubiere más de un Secretario, dicho cometido será cumplido mensualmente en forma rotativa por los mismos, con arreglo a lo que dispongan a tal efecto el Presidente del Tribunal o Juez.","En los Tribunales, Juzgados de Primera Instancia y de Paz que estuvieren de turno, los titulares de las Secretarías deberán encontrarse en su despecho diariamente, desde la hora de iniciación de las tareas del Tribunal o Juzgado."],"s":"Por lo menos una vez al mes, los titulares del Ministerio Público, los Secretarios del Superior Tribunal, de las Cámaras de Apelaciones y de los Juzgados, el Director de Administración, el Jefe de la Inspección de Justicia de…","nt":["Ac. 31/08. Reglamenta uso de Relojes de Control de Puntualidad y Asistencia. (Anexo)"]},{"n":277,"l":"277","t":"Cómputo mensual de Tardanzas e Inasistencias","p":["El último día de cada mes el Secretario, titular del Ministerio Público o Jefe de oficina deberá cerrar la planilla mensual respectiva o efectuar el control de tarjetas y registrará el número de inasistencias y tardanzas, justificadas o no, en que hubiesen incurrido durante dicho lapso los empleados de la dependencia. Además, el primer día hábil inmediato siguiente, los Secretarios pondrán dicha planilla a consideración del Presidente del Tribunal o Juez, a los efectos previstos por el artículo 279 de este Reglamento."],"s":"El último día de cada mes el Secretario, titular del Ministerio Público o Jefe de oficina deberá cerrar la planilla mensual respectiva o efectuar el control de tarjetas y registrará el número de inasistencias y tardanzas,…","nt":[]},{"n":278,"l":"278","t":"Comunicaciones al Superior Tribunal. Descuentos por Inasistencias","p":["En la ocasión indicada en la segunda parte del artículo anterior, el Presidente de las Cámaras, los Jueces, el titular del Ministerio Público y Jefe de oficina, comunicarán a la Secretaría Administrativa y de Superintendencia del Superior Tribunal, las inasistencias justificadas o injustificadas y las tardanzas injustificadas en que hubiesen incurrido los Funcionarios y empleados de sus respectivas dependencias a los efectos de la toma de razón de ellas en el legajo de cada agente.","Cumplida esta última diligencia, la Secretaría reexpedirá dicha comunicación directamente, por medio de un simple pase, a la Dirección de Administración a fin de que la misma proceda a efectuar los descuentos que correspondieren en los sueldos de los funcionarios y empleados por las inasistencias y tardanzas injustificadas que hubiesen registrado en el mes.","Sanciones por Inasistencias y Tardanzas reiteradas."],"s":"En la ocasión indicada en la segunda parte del artículo anterior, el Presidente de las Cámaras, los Jueces, el titular del Ministerio Público y Jefe de oficina, comunicarán a la Secretaría Administrativa y de Superintendencia…","nt":[]},{"n":279,"l":"279","t":"Régimen de Progresividad","p":["Los Presidentes de las Cámaras de Apelaciones, los Jueces, miembros del Ministerio Público o Jefes de oficinas que en la oportunidad a que se refiere el último apartado del artículo 277 o en cualquier otro momento adviertan en un lapso de seis meses, como mínimo, reiteradas faltas de puntualidad o de asistencia de algún empleado, hayan sido ellas justificadas o no impondrán un llamado de atención la primera vez, un apercibimiento en caso de primera reiteración, una suspensión de tres días sin goce de sueldo en la segunda, debiendo elevar los antecedentes al Superior Tribunal si el empleado persistiera en sus faltas de puntualidad o de asistencia no obstante las sanciones aplicadas. En estos casos, la autoridad de Superintendencia impondrá al agente una suspensión de hasta diez días sin goce de sueldo y cesantía en caso de nueva reincidencia, previo sumario administrativo en este último supuesto. Las sanciones a que se refiere el presente artículo deberán ser en cada caso comunicadas a la Secretaría Administrativa, de Superintendencia y Judicial, a los efectos del registro de la misma en el legajo personal del empleado.","Sanciones por Inasistencias y Tardanzas Reiteradas Excepciones al Régimen de Progresividad 279 bis) El régimen de progresividad de las sanciones previstas por inasistencias y/o tardanzas reiteradas en el artículo anterior, no será de aplicación cuando se constate dichas infracciones por Magistrados o Funcionarios en las ocasiones previstas en los artículos 75 y 103 de este Reglamento.","En estos supuestos, el Magistrado o Funcionario aplicará la medida disciplinaria que a su juicio fuere procedente o, en su caso, requerirá al Superior Tribunal de Justicia la instrucción del sumario pertinente, si así lo creyere necesario."],"s":"Los Presidentes de las Cámaras de Apelaciones, los Jueces, miembros del Ministerio Público o Jefes de oficinas que en la oportunidad a que se refiere el último apartado del artículo 277 o en cualquier otro momento adviertan en…","nt":[]},{"n":280,"l":"280","t":"Inasistencias y Tardanzas de Magistrados y Funcionarios","p":["Las previsiones contempladas en el presente capítulo respecto de las inasistencias y tardanzas de empleados podrán ser aplicadas extensivamente a los Magistrados, titulares del Ministerio Público, Secretarios y otros Funcionarios en los casos en que el Superior Tribunal, su Presidente o los Ministros del Alto Cuerpo o los respectivos superiores jerárquicos comprobaren inasistencias o ausencias injustificadas o reiteradas, o la llegada frecuente de los Magistrados, Funcionarios, Secretarios y Jefes de oficina a sus correspondientes despachos con marcado retraso o el retiro de los mismos con excesiva antelación a la hora de cese de la labor. En estos casos se aplicará las sanciones previstas en este Reglamento que pudieran corresponder o se dispondrá lo pertinente que la situación aconseje.","Inasistencias que exceden de dos días."],"s":"Las previsiones contempladas en el presente capítulo respecto de las inasistencias y tardanzas de empleados podrán ser aplicadas extensivamente a los Magistrados, titulares del Ministerio Público, Secretarios y otros…","nt":[]},{"n":281,"l":"281","t":"Normas Aplicables","p":["El conocimiento de las solicitudes de justificación de inasistencias que excedan el término de dos días estará a cargo, en cada caso, de la autoridad respectiva, la que se ajustará a las normas que este Reglamento prevé para las licencias.","Resolución 117-STJ-80 Sanciones por inasistencias reiteradas. (Anexo)"],"s":"El conocimiento de las solicitudes de justificación de inasistencias que excedan el término de dos días estará a cargo, en cada caso, de la autoridad respectiva, la que se ajustará a las normas que este Reglamento prevé para…","nt":[]},{"n":282,"l":"282","t":"Agentes a quienes comprende - Forma de computar las Licencias","p":["El régimen de licencias que contempla este capítulo es aplicable, salvo las excepciones expresas, a todos los Magistrados, Funcionarios y empleados del Poder Judicial, con funciones permanentes o transitorias cualquiera que fuese la forma de su retribución. El otorgamiento de licencia, salvo disposición expresa en contrario, se entenderá por días corridos."],"s":"El régimen de licencias que contempla este capítulo es aplicable, salvo las excepciones expresas, a todos los Magistrados, Funcionarios y empleados del Poder Judicial, con funciones permanentes o transitorias cualquiera que…","nt":[]},{"n":283,"l":"283","t":"Autoridad que conoce en los pedidos de Licencia","p":["El Superior Tribunal de Justicia conocerá en los pedidos de licencia formulados por los magistrados y funcionarios que excediesen de quince días y en los de licencia ordinaria por compensación de servicios prestados durante las ferias ordinarias o extraordinarias de los mismos. En relación a los empleados (no funcionarios ni magistrados), el Superior Tribunal de Justicia delega la concesión de dichas licencias que excedan los 5 (cinco) días, en el funcionario a cargo de la Secretaría Administrativa y de Superintendencia - Sección Personal.","Art. 283: Texto según Ac. 205/22. Vigencia: a partir del 1º de Febrero de 2023."],"s":"El Superior Tribunal de Justicia conocerá en los pedidos de licencia formulados por los magistrados y funcionarios que excediesen de quince días y en los de licencia ordinaria por compensación de servicios prestados durante…","nt":[]},{"n":284,"l":"284","t":"Presidente del Superior Tribunal de Justicia","p":["El Presidente del Superior Tribunal de Justicia concederá:","1) En las solicitudes de licencia de hasta quince (15) días del Procurador General, de los Presidentes de las Cámaras de Apelaciones, Presidente del Tribunal Penal, Jueces de Primera Instancia, funcionarios del Superior Tribunal de Justicia, Director de Administración, Jefe de Inspección de Justicia de Paz, Jefe del Archivo General de los Tribunales, Director de Biblioteca, Jefe de la Oficina de Mandamientos y Notificaciones, Jefe y Sub Jefe Provincial del Cuerpo Médico Forense y Jefe de la Oficina de Seguridad.","2) En las solicitudes de licencia de seis a quince días formuladas por los señores Vocales de las Cámaras de Apelaciones, Jueces de Tribunales, titulares del Ministerio Público, Jueces de Paz de todas las categorías, funcionarios de las Cámaras de Apelaciones y de la Justicia letrada de Primera Instancia, Subdirector de Administración y Tesorero del Poder Judicial, Subjefe de Inspección de Justicia de Paz, Subdirector de Biblioteca, Oficiales de Justicia y funcionarios de esta dependencia, de los Ministerios Públicos, de los funcionarios de los Juzgados de Paz de todas las categorías.","3) En las licencias por maternidad de los empleados, funcionarios y magistrados.","Art. 284: Texto según Ac. 205/22. Vigencia: a partir del 1º de Febrero de 2023."],"s":"El Presidente del Superior Tribunal de Justicia concederá: 1) En las solicitudes de licencia de hasta quince (15) días del Procurador General, de los Presidentes de las Cámaras de Apelaciones, Presidente del Tribunal Penal,…","nt":[]},{"n":285,"l":"285","t":"Otras Autoridades","p":["Los Presidentes de las Cámaras de Apelaciones, los Jueces de Primera Instancia, los titulares de los Ministerios Públicos, los Jueces de paz, el Director de Administración, el Jefe del Archivo General de los Tribunales, el Director de Biblioteca, el Jefe de la Oficina de Mandamientos y Notificaciones y el Jefe de la oficina de Seguridad, conocerán en los pedidos de licencia de hasta cinco (5) días que formularan los Funcionarios y empleados de los respectivos Tribunales, juzgados y organismos administrativos. El Procurador General y los Presidentes de las Cámaras de Apelaciones tendrán la misma atribución respecto de los titulares de los Ministerios Públicos y Vocales de Cámara, respectivamente, debiendo el señor Procurador General comunicar, en su caso, a quienes deban subrogar. El Jefe de la Inspección de la Justicia de paz tendrá la misma atribución respecto del Subjefe y Jueces de Paz."],"s":"Los Presidentes de las Cámaras de Apelaciones, los Jueces de Primera Instancia, los titulares de los Ministerios Públicos, los Jueces de paz, el Director de Administración, el Jefe del Archivo General de los Tribunales, el…","nt":[]},{"n":286,"l":"286","t":"Oportunidad de la elevación de los pedidos de Licencia","p":["Las licencias se pedirán con una anticipación no menor de cinco (5) días, salvo los casos de enfermedad o de fuerza mayor, y se elevarán de inmediato, no pudiendo el agente hacer uso de ellas mientras no hayan sido otorgadas, salvo casos de emergencia debidamente justificadas siendo pasible de sanciones disciplinarias el peticionario que transgrediese estas disposiciones."],"s":"Las licencias se pedirán con una anticipación no menor de cinco (5) días, salvo los casos de enfermedad o de fuerza mayor, y se elevarán de inmediato, no pudiendo el agente hacer uso de ellas mientras no hayan sido otorgadas,…","nt":[]},{"n":287,"l":"287","t":"Opinión de los Jefes Directos","p":["Los pedidos de licencia de los Secretarios de Cámara y de Juzgados de Primera Instancia de los Subjefes de organismos administrativos, Jueces y Secretarios de los Juzgados de Paz y de los empleados en general de la administración de justicia que deban ser elevados al Presidente o al Superior Tribunal, se efectuarán, según el caso, por intermedio de las respectivas Cámaras Jueces, jefes de organismos administrativos o Jefe de la Inspección de Justicia de Paz, de los que aquellos directamente dependan debiendo los mismos expresar su opinión al respecto. Los miembros de las Cámaras de Apelaciones, los Jueces de Primera Instancia, los integrantes del Ministerio Público, los jefes de los organismos administrativos y los médicos forenses, elevarán directamente sus solicitudes al Presidente del Superior Tribunal, por intermedio de la Secretaría Administrativa y de Superintendencia.","El Secretario Administrativo y de Superintendencia, y el Judicial, elevarán sus solicitudes al Presidente del Superior Tribunal de Justicia."],"s":"Los pedidos de licencia de los Secretarios de Cámara y de Juzgados de Primera Instancia de los Subjefes de organismos administrativos, Jueces y Secretarios de los Juzgados de Paz y de los empleados en general de la…","nt":[]},{"n":288,"l":"288","t":"Comunicación de la concesión de la Licencia Facultades del Superior Tribunal","p":["En cada caso que los Presidentes de las Cámaras de Apelaciones, Jueces de Primera Instancia, titulares del Ministerio Público, Jefes de organismos administrativos y Jueces de Paz concedan a los Funcionarios y empleados bajo su dependencia alguna licencia dentro de las facultades que le acuerda el presente Reglamento, deberán comunicar en la oportunidad establecida en el art. 278 dicho otorgamiento al Superior Tribunal con mención concreta de la causa invocada por el agente, a los efectos de las anotaciones correspondientes en el legajo respectivo.","En los casos en que el presidente del Superior Tribunal considerase que la causal invocada no justificaba la concesión de la licencia o advirtiese frecuencia o complacencia en el otorgamiento de las mismas, requerirá al Juez o Funcionario que la hubiese concedido la elevación del expediente respectivo y ordenará que por Secretaría Administrativa y de Superintendencia, se produzca el pertinente informe, según correspondiere y pasará el expediente o el informe, a conocimiento del Superior Tribunal, el que podrá, según el caso, revocar de oficio la concesión de la licencia, disponer el descuento respectivo en el sueldo del peticionario y aplicar las sanciones que estimare corresponder al Juez o Funcionario otorgante."],"s":"En cada caso que los Presidentes de las Cámaras de Apelaciones, Jueces de Primera Instancia, titulares del Ministerio Público, Jefes de organismos administrativos y Jueces de Paz concedan a los Funcionarios y empleados bajo su…","nt":[]},{"n":289,"l":"289","t":"Sanciones por Falsedad","p":["Será considerada falta grave toda simulación realizada con el fin de obtener licencia o justificación de inasistencia. El agente se hará pasible de suspensión por tiempo determinado que podrá llegar a la cesantía en caso de reincidencia. Igual sanción se aplicará al médico de Tribunales o Forense según correspondiere, que extendiese certificación falsa sin perjuicio de pasarse las actuaciones a la Justicia Penal. Si la certificación proviniese de otro médico oficial o particular, se comunicará tal circunstancia a la autoridad de la que éstos dependan y se pasarán igualmente las actuaciones a la Justicia Penal."],"s":"Será considerada falta grave toda simulación realizada con el fin de obtener licencia o justificación de inasistencia","nt":[]},{"n":290,"l":"290","t":"Abandono de Servicio","p":["El agente que faltase sin aviso a sus obligaciones durante cinco (5) días laborables consecutivos, incurre en abandono de servicio. El jefe inmediato tiene la obligación de poner en conocimiento de su superior esta circunstancia en la fecha en que el agente llegue al máximo indicado debiendo informarse a la autoridad de Superintendencia la que intimará al agente para que se reintegre en el término de 24 horas, bajo apercibimiento de cesantía por abandono de servicio."],"s":"El agente que faltase sin aviso a sus obligaciones durante cinco (5) días laborables consecutivos, incurre en abandono de servicio","nt":[]},{"n":291,"l":"291","t":"Recurso por denegatoria de Licencia","p":["Contra la resolución denegatoria de pedido de licencia formulado al Superior Tribunal procederá un recurso de revocatoria dentro del tercero día. Cuando se trate de resolución dictada por el Presidente del Superior Tribunal, Presidente de las Cámaras de Apelaciones, Jueces o Funcionarios respectivos, procederá un recurso de revocatoria con apelación en subsidio para ante el Superior Tribunal de Justicia dentro del término de tres días debiendo fundarse el recurso al interponerse."],"s":"Contra la resolución denegatoria de pedido de licencia formulado al Superior Tribunal procederá un recurso de revocatoria dentro del tercero día","nt":[]},{"n":292,"l":"292","t":"Los Magistrados, Funcionarios y Empleados del Poder Judicial inclusive,…","p":["Los Magistrados, Funcionarios y Empleados del Poder Judicial inclusive, los Jueces de Paz de todas las categorías y el personal de servicio y maestranza, gozarán de licencia durante el período comprendido en las ferias ordinarias y extraordinarias fijadas por el Superior Tribunal de Justicia, de acuerdo al artículo 116 de la Ley N° 651. Dichas licencias son obligatorias.","Los Jueces y Funcionarios que durante el receso judicial salieran del lugar de asiento del Juzgado o Tribunal, deberán comunicarlo al Superior Tribunal."],"s":"Los Magistrados, Funcionarios y Empleados del Poder Judicial inclusive, los Jueces de Paz de todas las categorías y el personal de servicio y maestranza, gozarán de licencia durante el período comprendido en las ferias…","nt":["Ac. 80/09. Establece que la Feria Judicial de verano se extiende desde el día 26 de Diciembre hasta el 31 de Enero, ambas","Ac. 122/06 y modificatorias. Presentismo (Anexo)"]},{"n":293,"l":"293","t":"Ordinarias y Extraordinarias. Vencimiento de las reservas Jubilación: Agotamiento obligatorio de los días pendientes","p":["Los Magistrados, Funcionarios y Agentes que hubieren prestado servicios durante las ferias ordinarias, o extraordinarias, tendrán derecho a una licencia compensatoria equivalente, a cumplirse a continuación del vencimiento de las mismas.","Las peticiones para hacer uso de la licencia compensatoria en época distinta a las indicadas sólo podrán resolverse favorablemente si mediaran razones atendibles y concretamente fundadas pero en ningún caso podrán otorgarse compensaciones para ser gozadas durante el mes de diciembre.","No podrá fraccionarse la compensación de licencias ordinarias, salvo que razones de servicio así lo aconsejen, disponiéndose un plazo máximo de tres años para solicitar y agotar la misma. Dicho plazo se computará desde la fecha de inicio del derecho al goce de la licencia, vencido el cual caducará la posibilidad de usufructuar la misma.","Solo es procedente la compensación de las licencias no gozadas con la percepción de los haberes correspondientes, en los siguientes casos:","a) cuando el agente cesa en sus funciones por cualquier causa, tendrá derecho al cobro de la parte de licencia proporcional al tiempo trabajado en el año calendario en que se produzca la baja;","b) en caso de fallecimiento del agente, sus derechohabientes, conforme al régimen legal vigente, percibirán las sumas que pudieran corresponder por licencias no utilizadas, conforme al inciso anterior.","Los Magistrados, Funcionarios y Agentes que hubieren iniciado los trámites previsionales establecidos por Ley XIX-N° 56 Digesto Jurídico, deberán gozar de los días de licencia compensatoria por servicios prestados en feria, previo a disponer el cese en el servicio.","Para ello, una vez notificado por parte del Instituto de Previsión Social la resolución acordando el beneficio provisional solicitado, deberá la Oficina de Personal informar los días de licencia compensatorias por servicios prestados en feria judicial no gozados por el Magistrado, Funcionario o Agente. Con dicho informe, por Presidencia del Alto Cuerpo, se comunicará al Magistrado, Funcionario o Agente, que debe agotar los días de licencia pendientes, previo al otorgamiento del cese en servicio.","Quienes se encontraren en uso de licencia prevista en el Art. 296 del presente reglamento, que hubieran iniciado su jubilación por invalidez ante el Instituto de Previsión Social, deberán igualmente agotar los días de licencia compensatoria por servicios prestados en feria judicial. Conforme el procedimiento indicado, la Oficina de Personal deberá informar los días pendientes de ser gozados, para lo cual previo al cese deberá agotar dichas licencias. Por resolución de Presidencia del Alto Cuerpo se dispondrá el cese de la licencia prevista en el artículo citado en el presente párrafo (licencia que imponga largo tratamiento de salud).","La licencia compensatoria será con goce íntegro de sus haberes.","No podrá extenderse el cese en el servicio, ni aceptarse la renuncia al Magistrado, Funcionario o Agente, que no haya agotado los días pendientes de licencias compensatorias por servicios prestados en feria, según corresponda.","Texto según Ac. 213/21. Vigencia: A partir del 1º de Enero de 2022."],"s":"Los Magistrados, Funcionarios y Agentes que hubieren prestado servicios durante las ferias ordinarias, o extraordinarias, tendrán derecho a una licencia compensatoria equivalente, a cumplirse a continuación del vencimiento de…","nt":["Comunicado de Secretaría Adm. Secc. Personal: A partir del 15-02-2022, las solicitudes por compensación de servicios"]},{"n":294,"l":"294","t":"Interrupción de Licencias Ordinarias","p":["Las licencias por ferias judiciales se interrumpen únicamente por razones de servicio. En tal caso el agente tendrá derecho a completar su licencia durante el año calendario con la salvedad establecida en el segundo apartado del artículo anterior.","Toda otra licencia de que se hallare gozando el agente al tiempo de la iniciación o en el curso de las ferias ordinarias o extraordinarias no interrumpe las mismas ni da derecho a compensación alguna."],"s":"Las licencias por ferias judiciales se interrumpen únicamente por razones de servicio","nt":[]},{"n":295,"l":"295","t":"Licencia por causal que imponga Corto Tratamiento de Salud","p":["Para el tratamiento de afecciones comunes o por accidente acaecido fuera de servicio se concederá hasta cuarenta y cinco días de licencia por año calendario, en forma discontinua con percepción íntegra de haberes. Toda licencia por esta causal de hasta diez días continuos, será acreditada con el certificado del Médico de Tribunales, del Médico Forense, del Médico de Policía, del Médico Oficial o del particular, según el caso (art. 302) y en los casos que excedan de este término se dará intervención a la Junta Médica prevista en el art. 226 quien dictaminará si corresponde acordar dicha licencia por el régimen establecido en los artículos 296 y 297. Pasados los cuarenta y cinco días esta licencia será sin goce de haberes.","Texto según Ac. 122/17"],"s":"Para el tratamiento de afecciones comunes o por accidente acaecido fuera de servicio se concederá hasta cuarenta y cinco días de licencia por año calendario, en forma discontinua con percepción íntegra de haberes","nt":["Ac. 122/06 y Modificatorias: Presentismo (Anexo)"]},{"n":296,"l":"296","t":"Licencia por afecciones Psiquiátricas Licencia Especial previa a la Jubilación","p":["Por afecciones que impongan largo tratamiento de salud o por motivos que aconsejen la hospitalización o el alejamiento del agente por razones de profilaxis o seguridad se concederá hasta un año corrido de licencia, con percepción íntegra de haberes, previo dictamen de la junta médica prevista en el art. 226 de este Reglamento.","Por afecciones de tipo psiquiátricas se concederá hasta 9 meses corridos de licencia, siguiendo el procedimiento establecido por el art. 296 bis, con percepción íntegra de haberes, previo dictamen de la junta médica prevista en el art. 226 de este Reglamento, luego de lo cual se determinará su incapacidad según baremos.","Al vencimiento de este plazo, subsistiendo la causal que determinó la licencia, previo los reconocimientos médicos antes mencionados, se concederá la ampliación de la misma hasta por un año, en que el agente percibirá la mitad de su remuneración.","En los casos de enfermedades oncológicas, HIV u otras que el Superior Tribunal de Justicia determine en forma expresa, el agente podrá percibir la totalidad de su salario durante el año mencionado “supra”.","Al cumplimiento de la prórroga será nuevamente reconocido por las autoridades médicas las que determinarán, de acuerdo con la capacidad laborativa del agente, las funciones que podrá desempeñar en la administración de justicia. En caso de incapacidad total se aplicarán las leyes de previsión y ayuda social provinciales correspondientes.","Para el caso de enfermedades que por su naturaleza puedan ser consideradas incurables avanzadas que imposibiliten el reintegro del agente a su función, éste podrá gozar, a partir del diagnóstico, de una licencia especial con goce íntegro de haberes hasta tanto pueda obtener la jubilación por invalidez, sin perjuicio de utilización de los plazos fijados precedentemente para las licencias por largo tratamiento. La Junta Médica determinará si la patología que presenta el agente puede ser encuadrada en las definiciones de “incapacidad total”, en los términos instituidos por la Tabla de Evaluación de Incapacidades (BAREMO) sancionada por Decreto Nacional N° 659/96 o norma que la sustituya y en tal caso el agente será intimado a solicitar jubilación por invalidez debiendo comunicar la iniciación del requerimiento previsional en el plazo de quince días. En caso contrario, vencido el plazo indicado la jubilación será iniciada de oficio por parte del Poder Judicial.","Autorizar a la Dirección de Asuntos Jurídicos a iniciar los trámites de jubilación por invalidez, de aquellos agentes que considerada la invalidez en los términos del párrafo precedente, no iniciaren dicho procedimiento, considerando al área enunciada como “Representante de la Repartición”, en los términos del Decreto N° 514/98 (inc. 6), reglamentario del Art. 58 Ley XIX N° 2 DJ. La iniciación del trámite previsional o su presentación ante el ente previsional, será notificado al agente involucrado, quien deberá acreditar la continuidad del procedimiento en un plazo de quince días de tomado conocimiento, bajo apercibimiento de percibir la mitad de su remuneración, de conformidad con el segundo párrafo del presente artículo modificado por Acordada 54/11. Transcurrido un año desde que el agente fuere intimado a iniciar trámite jubilatorio, podrá ordenarse su baja y cese en el servicio.","Texto según Ac. 122/17"],"s":"Por afecciones que impongan largo tratamiento de salud o por motivos que aconsejen la hospitalización o el alejamiento del agente por razones de profilaxis o seguridad se concederá hasta un año corrido de licencia, con…","nt":["Ac. 122/06 y Modificatorias: Presentismo (Anexo)"]},{"n":297,"l":"297","t":"Texto según Ac. 122/17 Enfermedades consideradas Causales de Largo Tratamiento","p":["Para solicitar licencia a los fines del artículo anterior se consideran causales las siguientes: enfermedades infecciosas, cardíacas, degenerativas, progresivas o blastomatosas, del sistema nervioso, de los sentidos, traumatismos y/o sus secuelas, malformaciones, intoxicaciones, intervenciones quirúrgicas. Esta enumeración no es taxativa, quedando a juicio de la Junta Médica la consideración de otras causales.","Para conceder las licencias de acuerdo con el presente artículo deberán comprobarse que las mismas imposibilitan al agente el normal cumplimiento de sus funciones o ponen en peligro de contagio a otras personas."],"s":"Para solicitar licencia a los fines del artículo anterior se consideran causales las siguientes: enfermedades infecciosas, cardíacas, degenerativas, progresivas o blastomatosas, del sistema nervioso, de los sentidos,…","nt":["Ac. 122/06 y modificatorias. Presentismo (Anexo)"]},{"n":298,"l":"298","t":"Enfermedad Contagiosa. Presunción Diagnóstica Provisoria","p":["La presunción diagnóstica, suficientemente fundada, de una enfermedad contagiosa, justificará el otorgamiento de licencia hasta tanto se determine el estado de salud del agente. El diagnóstico definitivo deberá producirse en el menor tiempo posible con intervención de la Junta Médica."],"s":"La presunción diagnóstica, suficientemente fundada, de una enfermedad contagiosa, justificará el otorgamiento de licencia hasta tanto se determine el estado de salud del agente","nt":[]},{"n":299,"l":"299","t":"Licencias por Accidentes de Trabajo y Enfermedades Profesionales","p":["En caso de enfermedad profesional contraída en acto de servicio, o de incapacidad temporaria, originada por el hecho o en ocasión del trabajo o función, se concederá hasta dos años de licencia con goce de haberes, prorrogables en iguales condiciones por un año más.","Si de cualquiera de estos dos casos se derivara una incapacidad parcial permanente, deberá adecuarse las tareas del agente a su nuevo estado."],"s":"En caso de enfermedad profesional contraída en acto de servicio, o de incapacidad temporaria, originada por el hecho o en ocasión del trabajo o función, se concederá hasta dos años de licencia con goce de haberes, prorrogables…","nt":["Ac. 122/06 y modificatorias. Presentismo (Anexo)"]},{"n":300,"l":"300","t":"Del Procedimiento en los Casos de Licencia por Razones de Salud","p":["Los agentes que por razones de salud no pudiesen desempeñar sus tareas están obligados a concurrir a la sede del Cuerpo Médico Forense en las primeras horas de labor a efecto del Examen Médico correspondiente. Así mismo deberá comunicar ésta circunstancia a la dependencia de la que forman parte aun cuando se encontraren fuera de la jurisdicción. La obligación de concurrir al examen preindicado únicamente será exceptuada cuando el agente se hallare imposibilitado por encontrarse internado o afectado por enfermedad que impidiese su ambulación. En cualquier caso el responsable de la dependencia podrá solicitar la designación de un Oficial ad-hoc del Cuerpo Médico Forense a fin de que se constituya en el lugar en que se encontrare el agente a efectos de constatar la situación denunciada. El agente que estuviere impedido de concurrir al consultorio del Cuerpo Médico Forense deberá acreditar tal circunstancia con la presentación, dentro de las veinticuatro (24) horas de ocurrida la inasistencia la historia clínica completa a su afección (Nombre, etiología, evolución, tratamiento) y la indicación precisa del lugar en que será encontrado. Todo en el formulario que será previsto por la Secretaría Administrativa y de Superintendencia del Superior Tribunal de Justicia.","Certificado Médico Auditoría Médica 300 bis) Presentación de certificado: La presentación del certificado Médico, por parte del agente, funcionario y/o Magistrado, deberá realizarse en forma personal, en las oficinas del CMF, excepto que se encuentren imposibilitados para la deambulación, por razones de su enfermedad. El mismo debe presentarse en forma inmediata al finalizar la consulta con el médico de cabecera tratante. Cuando la consulta se realizare en horario vespertino, el certificado resultante deberá presentarse en el horario de la jornada laboral siguiente, sin perjuicio de la debida comunicación a su jefe o superior en ambos casos. Ante la presentación de un certificado en dependencia de Junta Médica, el agente siempre será entrevistado por el Médico de Tribunales, quien evaluará cada caso en particular, realizando la correspondiente auditoría y otorgará la certificación de la licencia según los correspondientes protocolos médicos.","Estudios complementarios, recetas, etc. El agente debe acompañar al certificado, los estudios complementarios de diagnóstico que se le practicaron, las recetas de medicamentos otorgadas por el médico tratante, como así también las indicaciones terapéuticas correspondientes.","Ante la falta de los requisitos citados en el punto anterior, el médico de tribunales tiene la facultad de exigir al agente el cumplimiento de lo reglamentado, posponiendo la certificación de auditoría hasta tanto se presente la totalidad de la documentación.","Auditoría Médica de Licencias: Ante la presentación de un Certificado médico con indicación de licencia, los médicos de tribunales, deberán evaluar la Indicación de la misma, en el contexto global de la patología y en relación al criterio aplicado por el médico tratante, antes de otorgar la Certificación en caso de corresponder. Debe exigir, la presentación, de las documentales adicionales al certificado (estudios complementarios, recetas e indicaciones terapéuticas, eventual resumen de historia clínica y toda otra documentación que acredite el padecimiento de alguna afección y la conducta terapéutica a seguir). Ante la falta de la documental citada, el Médico de Tribunales informará al empleado, posponiendo la certificación de la licencia, hasta tanto se cumplimente con la presentación de lo faltante. El médico de Tribunales debe entrevistar siempre al empleado, por motivo de la solicitud de licencia, a los fines de la comprobación de la enfermedad consignada.","Realizada la auditoría médica y la entrevista del personal, el médico de Tribunales deberá otorgar la certificación de la licencia, pudiendo aceptar los tiempos indicados por el profesional tratante o acortar los mismos, si los considerare excesivos en relación al diagnóstico consignado.","Para el caso en que el agente se encuentre imposibilitado de concurrir a las oficinas del CMF, por razones de su enfermedad, deberá informar al mismo de la situación, ante lo cual, la Comisión de Reconocimientos Médicos, se constituirá en el domicilio del agente, a los fines de la constatación de la enfermedad y tramitación de la licencia en cuestión, en los términos de la reglamentación vigente del funcionamiento de dicha Comisión.","Ante la sospecha de falsedad del Certificado Médico, el médico de Tribunales deberá proceder conforme lo dispone el art. 296 quater. La junta, tendrá la facultad de suspender y/o denegar la licencia al agente.","Para los casos de licencia que impongan largo tratamiento, el coordinador del Departamento Laboral, deberá organizar un cronograma de seguimiento y control, el que podrá aplicarse por convocatoria programada del agente y si el mismo se encontrare imposibilitado para la deambulación por razones de enfermedad o reposo, se correrá vista a la CRM, para la ejecución de visitas programadas en el domicilio denunciado por el agente.","Texto según Ac. 122/17"],"s":"Los agentes que por razones de salud no pudiesen desempeñar sus tareas están obligados a concurrir a la sede del Cuerpo Médico Forense en las primeras horas de labor a efecto del Examen Médico correspondiente","nt":[]},{"n":301,"l":"301","t":"Intervención personal del médico del Cuerpo Médico Forense Intervención de la Junta Médica","p":["Constituido el agente en el Consultorio del Cuerpo Médico Forense se le practicará el reconocimiento médico expidiéndose el certificado que será entregado al interesado para la realización del trámite de licencia. Estos sin perjuicios de disponerse si correspondiere, la intervención de la Junta Médica en el caso previsto por el Artículo 296.","Lugares donde no hubiese Médico de Tribunales o Forense o fuera de la Jurisdicción Provincial"],"s":"Constituido el agente en el Consultorio del Cuerpo Médico Forense se le practicará el reconocimiento médico expidiéndose el certificado que será entregado al interesado para la realización del trámite de licencia","nt":[]},{"n":302,"l":"302","t":"En las localidades de la Provincia donde no hubiesen…","p":["En las localidades de la Provincia donde no hubiesen médicos de Tribunales o Forense, el certificado deberá ser expedido por el médico de policía o, a falta de éste, por cualquier otro médico oficial, y en defecto de ambos, por un médico particular. Tratándose del caso previsto por el art. 296 se seguirá el procedimiento allí establecido.","Si el agente se encontrare fuera de la jurisdicción de la Provincia al momento de contraer la enfermedad, deberá justificarlo, en el caso del art. 295, con certificado expedido por un médico dependiente del Ministerio de Salud Pública de la Nación, o en su defecto, por el Ministerio similar de la Provincia donde el interesado se encontrare; en ambos casos, debidamente legalizado. Si la situación fuese la prevista por el art. 296, se seguirá el procedimiento allí establecido.","Empleado que no se encontrare en su domicilio al momento de constituirse el Médico de Tribunales o Forense"],"s":"En las localidades de la Provincia donde no hubiesen médicos de Tribunales o Forense, el certificado deberá ser expedido por el médico de policía o, a falta de éste, por cualquier otro médico oficial, y en defecto de ambos,…","nt":[]},{"n":303,"l":"303","t":"Cuando el empleado no se hallare en su domicilio…","p":["Cuando el empleado no se hallare en su domicilio al ir a efectuarse el examen médico incurrirá en falta grave y será reprimido con suspensión u otras sanciones más grave en caso de reincidencia, salvo el caso de que, por urgencia originada por la gravedad o especial naturaleza de la enfermedad, hubiese sido necesaria la internación del agente, circunstancia que, asimismo el facultativo deberá comprobar."],"s":"Cuando el empleado no se hallare en su domicilio al ir a efectuarse el examen médico incurrirá en falta grave y será reprimido con suspensión u otras sanciones más grave en caso de reincidencia, salvo el caso de que, por…","nt":["Ac. 179/15. Control de Ausentismo y Seguimiento del personal. (Anexo)"]},{"n":304,"l":"304","t":"Permiso para ausentarse de la Provincia","p":["Los agentes del Poder Judicial en uso de licencia por enfermedad, no podrán ausentarse de la provincia sin permiso de la autoridad que le otorgó la licencia. Si esta fuere superior a cinco días deberá entender en la autorización el Presidente del Superior Tribunal."],"s":"Los agentes del Poder Judicial en uso de licencia por enfermedad, no podrán ausentarse de la provincia sin permiso de la autoridad que le otorgó la licencia","nt":[]},{"n":305,"l":"305","t":"Del Alta","p":["En los casos de licencias concedida por aplicación del art. 296 el agente no podrá ser reincorporado a su empleo hasta tanto el médico correspondiente no otorgue el certificado de alta.","El mismo médico podrá aconsejar que al reanudar sus tareas se le asigne al agente, durante un lapso determinado, funciones adecuadas para completar su restablecimiento, o que las mismas se desenvuelvan en un lugar apropiado a esa finalidad."],"s":"En los casos de licencias concedida por aplicación del art. 296 el agente no podrá ser reincorporado a su empleo hasta tanto el médico correspondiente no otorgue el certificado de alta.","nt":[]},{"n":306,"l":"306","t":"Restablecimiento del Agente","p":["Todas las licencias concedidas por causa de enfermedad o accidente quedarán canceladas con el restablecimiento del agente. El agente deberá en todos los casos solicitar la reincorporación a sus funciones, aún cuando no hubiere vencido el término de su licencia siempre que se encontrara en condiciones de reanudar sus tareas, de acuerdo con lo que prescribe el presente capítulo."],"s":"Todas las licencias concedidas por causa de enfermedad o accidente quedarán canceladas con el restablecimiento del agente","nt":[]},{"n":307,"l":"307","t":"Licencia por nacimiento o por guarda","p":["a- Por nacimiento: se acordará a la agente mujer progenitora gestante, licencia, con goce de sueldo, de ciento treinta y cinco (135) días, divididos en dos períodos, uno anterior de cuarenta y cinco (45) días y otro posterior al parto de noventa (90) días. Sin embargo, la interesada podrá solicitar la reducción del periodo previo hasta treinta días, en cuyo caso se extenderá proporcionalmente el período posterior. Este criterio se aplicará también cuando el parto se adelante respecto de la fecha prevista. En caso que el nacimiento se retrasare en relación a la fecha presunta fijada por el médico, el excedente se imputará al segundo período. En esta licencia el médico forense podrá limitarse a visar el certificado expedido por el médico particular u otro oficial. El término de ciento treinta y cinco (135) días que se consagra en este artículo podrá modificarse en los siguientes casos:","1) En caso de parto prematuro, se sumará a dicha licencia el número de días equivalentes a la diferencia entre la fecha de nacimiento y la fecha de alta médica del recién nacido.","2) En caso de nacimientos múltiples el plazo se extenderá a ciento ochenta (180) días, divididos en dos períodos, uno anterior de cuarenta y cinco (45) días y otro posterior al parto de ciento treinta y cinco (135) días. Sin embargo, la interesada podrá solicitar la reducción del período previo hasta treinta (30) días, en cuyo caso se extenderá proporcionalmente el período posterior. b- Por guarda con fines de adopción o guarda del art. 657 del CCCN de niños, niñas y adolescentes: se acordará licencia, con goce de sueldo, de ciento cinco (105) días a partir del otorgamiento judicial de la guarda. En caso de guardas múltiples el plazo se extenderá a ciento cincuenta (150) días. Cuando haya más de un guardador y ambos/as sean agentes del poder judicial, los/las guardadores/ras deberán optar manifestando cuál de ellos/as va a hacer uso de esta licencia, correspondiéndole a el/la otro/a co-guardador/a la licencia por asunto familiar del art. 311 inc. 2), apartado b).","Texto según Ac. 19/21. Vigencia: a partir del 05/04/2021 Fallecimiento de agente en uso de licencia por nacimiento o por guarda 307 bis) En caso de fallecimiento del/de la agente que estuviere haciendo uso de las licencias anteriores, el otro progenitor/a o guardador/a del niño, niña o adolescente tendrá derecho a usufructuar el resto de la licencia.","Texto según Ac. 19/21. Vigencia: a partir del 05/04/2021 Fallecimiento del menor.","Licencia por adopción o guarda de personas con discapacidad 307 ter) a- En caso de fallecimiento del niño, niña o adolescente se interrumpen las licencias anteriores, b- En caso de nacimiento o guarda con fines de adopción de niños, niñas y/o adolescentes con discapacidad, se sumarán a las licencias anteriores lo establecido en la Ley Provincial I – Nº 132 (antes Ley 4123) Texto según Ac. 19/21. Vigencia: a partir del 05/04/2021 Ley I – Nº 132: “Art. 1: Establécese régimen de licencia especial de hasta ciento ochenta (180) días con goce íntegro de haberes por hijo con discapacidad, en los términos del Artículo 4 de la Ley XIX – Nº 23 (Antes Ley 2707)”."],"s":"a- Por nacimiento: se acordará a la agente mujer progenitora gestante, licencia, con goce de sueldo, de ciento treinta y cinco (135) días, divididos en dos períodos, uno anterior de cuarenta y cinco (45) días y otro posterior…","nt":["Ac. 122/06 y modificatorias. Presentismo (Anexo)"]},{"n":308,"l":"308","t":"Cambio de Tareas","p":["A petición de la interesada y previa certificación médica se le podrá acordar a aquélla cambio de tarea a partir de la concepción hasta el comienzo de la licencia por maternidad.-"],"s":"A petición de la interesada y previa certificación médica se le podrá acordar a aquélla cambio de tarea a partir de la concepción hasta el comienzo de la licencia por maternidad.-","nt":[]},{"n":309,"l":"309","t":"Permiso para atención del Lactante","p":["La agente madre del lactante, tendrá derecho a un descanso de una (1) hora, o dos de media hora diaria, por un período no superior a (1) año posterior a la fecha de nacimiento, salvo que por razones médicas sea necesario que la madre amamante a su hijo por un lapso más prolongado. En caso de nacimientos múltiples, la reducción horaria se incrementará proporcionalmente a la cantidad de hijos.","En lugar de estos descansos podrá optar por un permiso para iniciar sus tareas una hora después de la fijada para la entrada o retirarse una hora antes de la salida."],"s":"La agente madre del lactante, tendrá derecho a un descanso de una (1) hora, o dos de media hora diaria, por un período no superior a (1) año posterior a la fecha de nacimiento, salvo que por razones médicas sea necesario que…","nt":[]},{"n":310,"l":"310","t":"Texto según Ac. 77/13 Licencia por enfermedad de un miembro del Grupo Familiar","p":["Inciso 1º- En caso de grave enfermedad que ponga en peligro la vida del cónyuge, hijos padres o hermanos consanguíneos, diez días corridos de licencia. Si esa persona se encontrare en jurisdicción de otra provincia y el agente necesitare trasladarse el lugar, veinte días. Al término de esta licencia el agente deberá acreditar con los pertinentes certificados médicos la causal invocada.","Inciso 2º- Para consagrarse a la atención de un miembro enfermo del grupo familiar constituido en el hogar, hasta cuarenta días corridos, continuos o discontinuos, por año calendario. A este fin el agente deberá expresar, por declaración jurada, que es indispensable su asistencia. Estas causales de enfermedad deberán ser comprobadas por el médico de Tribunales o Forense correspondiente. En las demás localidades deberá recurrirse a esos efectos a los médicos de Salud Pública de la Provincia radicados en el lugar, o de la Nación o correspondiente Provincia, si el agente estuviere en otra jurisdicción."],"s":"Inciso 1º- En caso de grave enfermedad que ponga en peligro la vida del cónyuge, hijos padres o hermanos consanguíneos, diez días corridos de licencia","nt":["Ac. 122/06 y modificatorias. Presentismo (Anexo)"]},{"n":311,"l":"311","t":"Texto según Ac. 122/17 Licencia por Asunto Familiar","p":["Desde el día de su ingreso el/la agente tendrá derecho a hacer uso de licencia remunerada en los casos y por los términos siguientes:","1) Matrimonio: a) del agente, diez días; b) de sus hijos, dos días","2) Nacimiento o guarda: a) Por nacimiento: de los hijos del agente varón progenitor o de los hijos de la agente mujer progenitora no gestante: quince (15) días, que serán utilizados a continuación de la fecha del nacimiento; b) Por guarda: del niño, niña o adolescente a cargo del/de la co-guardador/a que no hubiere optado por la licencia del art. 307 inc. b): quince (15) días, que serán utilizados a continuación de la fecha de otorgamiento judicial de la guarda con fines de adopción o de la guarda del art. 657 del CCCN.","3) Fallecimientos: a) del cónyuge o pariente consanguíneo de primer grado, cinco días; b) de parientes afines de primer grado, y consanguíneo y afines de segundo grado, dos días.","Estos términos se elevarán al doble cuando la persona hubiere fallecido fuera de la jurisdicción de la Provincia y el agente deba trasladarse al lugar.","Inc. 2) Texto según Ac. 19/21. Vigencia: a partir del 05/04/2021"],"s":"Desde el día de su ingreso el/la agente tendrá derecho a hacer uso de licencia remunerada en los casos y por los términos siguientes: 1) Matrimonio: a) del agente, diez días; b) de sus hijos, dos días","nt":["Ac. 122/06 y modificatorias. Adicional por Presentismo (Anexo)"]},{"n":312,"l":"312","t":"Licencia por Motivos Personales","p":["Sólo en casos excepcionales y con expresión concreta de la causa que la motiva, el Presidente del Superior Tribunal, los Presidentes de las Cámaras de Apelaciones, Jueces, titulares de los Ministerios Públicos y Jefes de dependencias administrativas podrán, dentro de las facultades que les confiere el presente Reglamento, conceder licencia en caso de fuerza mayor o graves asuntos de familia.","Toda licencia por esta causal que exceda de ocho (8) días será sin goce de sueldo y en total no podrá exceder de un mes en el año calendario.","Texto según Ac. 81/09 Licencia para ejercer Representación en Entidades que nucleen a Personal del Poder Judicial"],"s":"Sólo en casos excepcionales y con expresión concreta de la causa que la motiva, el Presidente del Superior Tribunal, los Presidentes de las Cámaras de Apelaciones, Jueces, titulares de los Ministerios Públicos y Jefes de…","nt":[]},{"n":313,"l":"313","t":"El Superior Tribunal podrá conceder licencia de hasta veinte…","p":["El Superior Tribunal podrá conceder licencia de hasta veinte días en el año calendario continuos o discontinuos, al Magistrado, Funcionario o empleado que tuviere que ejercer una representación en nombre de los agentes del Poder Judicial. Esta licencia se otorgará con goce de haberes, salvo que la gestión o representación ya estuviere retribuida suficientemente por la entidad que los nuclea.","Licencia Gremial 313 bis) El Superior Tribunal de Justicia concederá licencia gremial con goce de haberes hasta a dos agentes que hayan sido elegidos para desempeñar cargos de representación gremial en la entidad sindical con personería gremial reconocida para que agrupe a los empleados del Poder Judicial de la Provincia, por el término de la duración de su mandato, siempre que se encuentren en el ejercicio efectivo de las funciones gremiales. La Comisión Directiva deberá comunicar dentro de los treinta (30) días de quedar constituida, los nombres de los agentes que se harán acreedores a la mencionada licencia. Finalizados sus mandatos deberán reintegrarse al servicio dentro de los cinco (5) días hábiles de cesación.","Licencia para realizar Estudios o Actividad Cultural o Deportiva en el País o en el Extranjero"],"s":"El Superior Tribunal podrá conceder licencia de hasta veinte días en el año calendario continuos o discontinuos, al Magistrado, Funcionario o empleado que tuviere que ejercer una representación en nombre de los agentes del…","nt":[]},{"n":314,"l":"314","t":"Podrá concederse licencia sin goce de haberes por el…","p":["Podrá concederse licencia sin goce de haberes por el término máximo de dos años al agente que tenga como mínimo cinco años de antigüedad en el Poder Judicial Provincial y deba realizar estudios, investigaciones, trabajos científicos, técnicos, artísticos, o participar en congresos o conferencias de esa índole en el país o en el extranjero.","Igual beneficio podrá otorgarse para mejorar la preparación técnica o profesional del agente o cumplir actividades culturales o deportivas."],"s":"Podrá concederse licencia sin goce de haberes por el término máximo de dos años al agente que tenga como mínimo cinco años de antigüedad en el Poder Judicial Provincial y deba realizar estudios, investigaciones, trabajos…","nt":[]},{"n":315,"l":"315","t":"Ejercicio de Representación en el Interés Público","p":["Las licencias a que se refiere el art. anterior podrán ser concedidas con goce de sueldo, pero por un término no mayor de un año, cuando existan probadas razones de interés público, en general, o del Poder Judicial, en particular, en el cometido a cumplir por el agente o éste actúe representando al país, a la Provincia o al Poder Judicial.","En estos casos se tendrá en cuenta las condiciones, títulos y aptitudes del agente, el beneficio que el otorgamiento de la licencia deparará al interés público y se determinarán así mismo, las obligaciones de aquél a favor del Poder Judicial en el cumplimiento de la misión.","En el supuesto previsto en el presente artículo y cuando la licencia no excediera del término de dos meses, la misma no podrá otorgarse durante los meses de noviembre y diciembre."],"s":"Las licencias a que se refiere el art. anterior podrán ser concedidas con goce de sueldo, pero por un término no mayor de un año, cuando existan probadas razones de interés público, en general, o del Poder Judicial, en…","nt":[]},{"n":316,"l":"316","t":"Licencia por Servicio Militar","p":["Los agentes que deban incorporarse al servicio militar tendrán derecho a las siguientes licencias, con el 50% de su remuneración desde la fecha de su incorporación hasta cinco días después de la baja asentada en la libreta de enrolamient
