o, en los casos en que el agente hubiera sido declarado inepto o fuere exceptuado; y hasta quince días después de haber sido dado de baja si hubiere cumplido con el período para el cual fue convocado y éste fuera mayor de seis meses.","Igualmente se concederá licencia de cinco días, con la remuneración expresada, cuando el período fuera inferior a seis meses. Si la permanencia bajo bandera se prolongase por culpa del empleado éste dejará de percibir la remuneración establecida durante el término adicionado.","El personal que en carácter de reservista sea incorporado transitoriamente a las Fuerzas Armadas de la Nación, como única retribución, la correspondiente a su grado en caso de ser oficial o suboficial de reserva. Cuando el sueldo del cargo civil fuese mayor de dicha remuneración, la Dirección de Administración liquidará la diferencia."],"s":"Los agentes que deban incorporarse al servicio militar tendrán derecho a las siguientes licencias, con el 50% de su remuneración desde la fecha de su incorporación hasta cinco días después de la baja asentada en la libreta de…","nt":[]},{"n":317,"l":"317","t":"Derecho a Licencia en cada Decenio","p":["En el transcurso del segundo y posteriores decenios, el agente podrá usar licencia, sin remuneración, por el término de seis meses, fraccionables en dos períodos iguales o desiguales.","El término de licencia no utilizado en un decenio no puede ser acumulado en los subsiguientes y entre la finalización de la licencia del decenio anterior y el comienzo de la siguiente del posterior deberá transcurrir un lapso de dos años como mínimo.","Para el cómputo de servicios no se tendrá en cuenta los que hubiese prestado el agente en otros organismos, judiciales o no, de la Nación o de ésta y otras provincias.","Licencia para rendir Examen en Facultades e Institutos de Corrientes, Chaco y Formosa"],"s":"En el transcurso del segundo y posteriores decenios, el agente podrá usar licencia, sin remuneración, por el término de seis meses, fraccionables en dos períodos iguales o desiguales.","nt":[]},{"n":318,"l":"318","t":"Para rendir examen en facultades, institutos o casas de…","p":["Para rendir examen en facultades, institutos o casas de estudios pertenecientes a la Universidad del Nordeste o a cualquier otra Universidad oficial o privada con sede en las provincias de Corrientes, Chaco o Formosa y siempre que los organismos primeramente mencionados no estuviesen ubicados en esta Provincia de Misiones, los agentes gozarán de licencia remunerada hasta cuatro veces por año y por un período máximo de cinco días laborables cada vez."],"s":"Para rendir examen en facultades, institutos o casas de estudios pertenecientes a la Universidad del Nordeste o a cualquier otra Universidad oficial o privada con sede en las provincias de Corrientes, Chaco o Formosa y siempre…","nt":[]},{"n":319,"l":"319","t":"Casas de Estudio con sede en la Provincia","p":["Los agentes gozarán de licencia remunerada hasta cuatro veces por año, por un período máximo de tres días laborables cada vez, en el caso en que, teniendo la casa de estudios su sede en esta Provincia, no coincidiera con el asiento de la oficina en que prestan servicios. En el supuesto de que la institución educativa se encuentre en la misma localidad de prestación de servicios del agente, la licencia por examen será de dos (2) días por cada examen o prórroga, distribuidos en el día inmediato anterior y en el día del examen, hasta un máximo de cuatro (4) oportunidades por año."],"s":"Los agentes gozarán de licencia remunerada hasta cuatro veces por año, por un período máximo de tres días laborables cada vez, en el caso en que, teniendo la casa de estudios su sede en esta Provincia, no coincidiera con el…","nt":[]},{"n":320,"l":"320","t":"Texto según Ac. 129/25. Vigencia: 20-08-2025 Exámenes en otras Facultades e Institutos","p":["Para rendir examen en facultades, institutos o casa de estudios ubicados en la Capital Federal, o en otras provincias distintas a las especificadas en el art. 318, los agentes gozarán de una licencia remunerada de hasta cuatro veces por año, por un período máximo de siete días laborables.","Último Examen de la Carrera Universitaria 320 bis) En oportunidad de rendir el último examen de la carrera universitaria, el agente tendrá derecho a una licencia adicional de dos días corridos, que se sumarán a los plazos establecidos en los artículos 318, 319 y 320, según corresponda."],"s":"Para rendir examen en facultades, institutos o casa de estudios ubicados en la Capital Federal, o en otras provincias distintas a las especificadas en el art. 318, los agentes gozarán de una licencia remunerada de hasta cuatro…","nt":[]},{"n":321,"l":"321","t":"Art. incorporado por Ac. 129/25. Vigencia: 20-08-2025 Normas especiales para los casos de Licencia por Examen","p":["Los períodos de licencia para rendir examen no son acumulables pero por causa debidamente justificada y siempre que no se resintieren las necesidades del servicio, podrá concederse hasta dos períodos conjuntamente.","Las solicitudes de licencias para examen deberán ser formuladas con suficiente antelación debiendo el agente citar las materias que se propone rendir. Es obligatorio acreditar la inscripción en la casa de estudios, como asimismo, dentro de los cinco días de producido justificar haber rendido el examen, so pena de pérdida de la licencia remunerada.","La abstención injustificada de rendir examen podrá dar lugar a la denegación de futura licencias para tal fin, o, en su caso, a la reducción o revocación de la licencia concedida."],"s":"Los períodos de licencia para rendir examen no son acumulables pero por causa debidamente justificada y siempre que no se resintieren las necesidades del servicio, podrá concederse hasta dos períodos conjuntamente.","nt":[]},{"n":322,"l":"322","t":"Permiso para Agentes Estudiantes","p":["Los agentes del Poder Judicial podrán solicitar permiso, dentro del horario de trabajo cuando sea imprescindible su asistencia a clase, cursos prácticos y demás asistencias inherentes a su calidad de estudiantes y no fuere posible adaptar su horario a aquella necesidad. Deberán acreditar:","a) Su condición de estudiantes en cursos oficiales, incorporados o privados (nacionales, provinciales o municipales).","b) La necesidad de asistir al establecimiento educacional en horas de oficina.","Podrán obtenerlo cumpliendo los recaudos antes mencionados, sin goce de haberes, a cuyo efecto se computará como media inasistencia todo permiso de hasta dos horas diarias e inasistencia completa cuando aquél excediese de dicho lapso. Al término de cada mes, la Dirección de Administración deberá efectuar los descuentos correspondientes."],"s":"Los agentes del Poder Judicial podrán solicitar permiso, dentro del horario de trabajo cuando sea imprescindible su asistencia a clase, cursos prácticos y demás asistencias inherentes a su calidad de estudiantes y no fuere…","nt":[]},{"n":323,"l":"323","t":"Premio Estímulo","p":["Los empleados del Poder Judicial y el personal de servicio y maestranza, que durante el año calendario inmediato anterior no registraren licencias, con excepción de las establecidas en los artículos 307 y 311, de las licencias por examen previstas en los artículos 318, 319, 320 y 320 bis, ni inasistencias, faltas de puntualidad o sanciones disciplinarias, tendrán derecho, como estímulo, a una licencia suplementaria de cinco días en la época de su elección, pudiendo tal licencia ser gozada a continuación de las ordinarias, salvo que razones impostergables de servicio se opongan a dicha acumulación.","No se podrá hacer uso de este beneficio durante los meses de noviembre y diciembre Texto según Ac. 133/25 (Anexo) Presentismo; Ac. 122/06 y modificatorias (Anexo)"],"s":"Los empleados del Poder Judicial y el personal de servicio y maestranza, que durante el año calendario inmediato anterior no registraren licencias, con excepción de las establecidas en los artículos 307 y 311, de las licencias…","nt":[]},{"n":324,"l":"324","t":"Sin perjuicio de las responsabilidades penales y civiles emergentes…","p":["Sin perjuicio de las responsabilidades penales y civiles emergentes de hechos delictuosos o falta, los agentes de la Administración de Justicia quedan sujetos a la aplicación de las siguientes medidas disciplinarias, por faltas de los mismos previstas en este Reglamento y cometidas en el desempeño de sus funciones o fuera de ellas: apercibimiento, multa de hasta veinticinco por ciento del sueldo del sancionado, suspensión, cesantía y exoneración.","Las sanciones de suspensión en todos los casos serán sin goce de haberes."],"s":"Sin perjuicio de las responsabilidades penales y civiles emergentes de hechos delictuosos o falta, los agentes de la Administración de Justicia quedan sujetos a la aplicación de las siguientes medidas disciplinarias, por…","nt":[]},{"n":325,"l":"325","t":"Caducidad de Sanciones","p":["A los efectos vinculados con el ascenso y reincorporación de los agentes las sanciones disciplinarias previstas en el art. 324 caducarán en los siguientes plazos: la de apercibimiento a los seis meses. La de suspensión, hasta 10 días a los 2 años y las que excedan de dicho término a los cinco años. La de cesantía a los diez años. La sanción de exoneración tiene carácter de imprescriptible.","En los casos de suspensión el plazo de caducidad comenzará a computarse a partir de la finalización del cumplimiento de la sanción.-"],"s":"A los efectos vinculados con el ascenso y reincorporación de los agentes las sanciones disciplinarias previstas en el art. 324 caducarán en los siguientes plazos: la de apercibimiento a los seis meses","nt":[]},{"n":326,"l":"326 a 335","t":"Los artículos 326 a 335 remiten al Reglamento de…","p":["Los artículos 326 a 335 remiten al Reglamento de Procedimiento para la Instrucción de Sumarios Administrativos e Informaciones Sumarias del Poder Judicial de la Provincia de Misiones, aprobado por Acordada N.º 229/19."],"s":"Los artículos 326 a 335 remiten al Reglamento de Procedimiento para la Instrucción de Sumarios Administrativos e Informaciones Sumarias del Poder Judicial de la Provincia de Misiones, aprobado por Acordada N.º 229/19.","nt":[]},{"n":336,"l":"336","t":"La calificación de los empleados del Poder Judicial se…","p":["La calificación de los empleados del Poder Judicial se efectuará anualmente, con arreglo a los siguientes conceptos:","a) Antigüedad en el Poder Judicial de la Provincia.","b) Antigüedad en la categoría.","c) Títulos.","d) Asistencia.","e) Comportamiento General (conducta y contracción al cargo).","f) Capacidad (conocimientos generales, actitudes e idoneidad en relación a las funciones que desempeña).","A los efectos de la calificación el período anual queda establecido entre el 1° de enero y el 26 de diciembre de cada año."],"s":"La calificación de los empleados del Poder Judicial se efectuará anualmente, con arreglo a los siguientes conceptos: a) Antigüedad en el Poder Judicial de la Provincia.","nt":[]},{"n":337,"l":"337","t":"Oportunidad y formación de Listas","p":["En el mes de marzo del año siguiente, se elevarán indefectiblemente a la Secretaría Administrativa y de Superintendencia, las planillas de calificaciones con el puntaje de los conceptos e) y f) del artículo anterior.","Vencido ese plazo, se procederá por Secretaría Administrativa a consignar en cada una de ellas el puntaje correspondiente a que se refieren los incisos a), b), c), y d) del artículo citado. Cumplido ese requisito se formarán las listas por categoría y orden de prioridad de todos los empleados.","Al agente que hubiere gozado de licencia sin goce de haberes no se le computarán los períodos respectivos a los fines de la antigüedad prevista en los incisos a) y b)."],"s":"En el mes de marzo del año siguiente, se elevarán indefectiblemente a la Secretaría Administrativa y de Superintendencia, las planillas de calificaciones con el puntaje de los conceptos e) y f) del artículo anterior.","nt":[]},{"n":338,"l":"338","t":"Elementos para la formación de Listas","p":["Para la confección de las listas a que se refiere el artículo anterior se observarán las siguientes reglas:","a) Antigüedad: Se computará un punto, el 26 de diciembre, por cada año de servicio o fracción que exceda de seis meses, lapso que se contará a partir de la fecha de toma de posesión del cargo.","b) Antigüedad en la categoría: Se computará un punto, al 26 de diciembre, por cada año en la categoría que reviste o fracción que exceda de seis meses.","c) Títulos: Secundarios, 5 puntos; profesor o licenciado 10 puntos; estudios universitarios con 12 materias aprobadas en las carreras de Ciencias Económicas, Abogacía, Procuración y Notariado, 15 puntos; y títulos obtenidos en las carreras mencionadas, 20 puntos.","d) Asistencia: No registrando el agente inasistencias durante el año, se le computarán 10 puntos, hasta dos inasistencias, 5 puntos, hasta cuatro, 4 puntos, hasta seis, 3 puntos; hasta ocho 2 puntos; hasta diez, 1 punto, más de diez, 0 punto. No registrando el agente licencias en el año salvo las previstas en los artículos 307, 311 y 313 hasta un máximo de diez días respecto de este último, se le asignarán 10 puntos, registrando cinco días, 5 puntos, hasta diez días, 3 puntos, más de diez días en el año, 0 punto.","e) Comportamiento General: Muy bueno, de 8 a 10 puntos, Bueno, de 6 a 7 puntos; Regular, de 4 a 5 puntos; Insuficiente de 0 a 3 puntos.","f) Capacidad: Se observará la calificación y puntaje indicado en el inciso e)."],"s":"Para la confección de las listas a que se refiere el artículo anterior se observarán las siguientes reglas: a) Antigüedad: Se computará un punto, el 26 de diciembre, por cada año de servicio o fracción que exceda de seis…","nt":[]},{"n":339,"l":"339","t":"Autoridad Calificadora","p":["La calificación se realizará por las autoridades siguientes:","a) La de los empleados administrativos y judiciales del Superior Tribunal, por los miembros de dicho cuerpo y los Secretarios Administrativos, de Superintendencia y Judiciales.","b) La de los empleados de las Cámaras de Apelaciones, por los miembros de las Cámaras y los Secretarios de las mismas.","c) La de los empleados de Juzgados de Primera Instancia y de Paz de toda la Provincia por el Juez o Juez de Paz, en su caso, con el Secretario respectivo.","d) La de los empleados de la Inspección de Justicia de Paz, por el Jefe y Subjefe de dicha oficina.","e) La de los empleados de los Ministerio Públicos, por el titular de cada dependencia.","f) La de los empleados del Archivo General de los Tribunales, por el Jefe de dicha dependencia.","g) La de los empleados de Biblioteca, por el Director y el Subdirector de dicha dependencia.","h) La de los empleados de la Dirección de Administración, por el Director, el Subdirector y el Tesorero.","i) La de los empleados de la Oficina de Mandamientos y Notificaciones, por el Jefe de dicha dependencia.","j) La de los empleados de la Oficina de Seguridad, por el Jefe de la misma.","k) La del personal de maestranza por el titular del organismo y Secretaría, y Jefe de dicho personal, donde lo hubieren.","El personal será calificado en la oficina donde se encontrare prestando servicios con un mínimo de tres meses."],"s":"La calificación se realizará por las autoridades siguientes: a) La de los empleados administrativos y judiciales del Superior Tribunal, por los miembros de dicho cuerpo y los Secretarios Administrativos, de Superintendencia y…","nt":[]},{"n":340,"l":"340","t":"Reclamo de Puntaje","p":["El agente que se considerase perjudicado por la calificación total o de algún concepto podrá recurrir dentro de los diez días de habérsele notificado su calificación, ante el Superior Tribunal de Justicia mediante escrito fundado."],"s":"El agente que se considerase perjudicado por la calificación total o de algún concepto podrá recurrir dentro de los diez días de habérsele notificado su calificación, ante el Superior Tribunal de Justicia mediante escrito fundado.","nt":[]},{"n":1005,"l":"340 bis","t":"Dejado sin efecto por Ac. 229/19","p":["Dejado sin efecto por Ac. 229/19. Ver nuevo Reglamento de Sumarios en Capítulo IX – RPJ","– Artículos 326 a 335-"],"s":"Dejado sin efecto por Ac. 229/19","nt":[]},{"n":341,"l":"341","t":"Publicación del Reglamento","p":["La publicación del presente Reglamento ha sido autorizada por el Superior Tribunal de Justicia."],"s":"La publicación del presente Reglamento ha sido autorizada por el Superior Tribunal de Justicia.","nt":[]},{"n":342,"l":"342","t":"Derogación de Disposiciones","p":["Quedan derogadas todas las disposiciones que se opongan al presente Reglamento."],"s":"Quedan derogadas todas las disposiciones que se opongan al presente Reglamento.","nt":[]}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),N=D.nodes,A=D.arts,MAX=342,$=s=>document.querySelector(s),main=$('#main'),side=$('#side');
const PAL=[['#5b50c4','#eeecfb'],['#2c74b3','#e6f1fb'],['#237f64','#e3f5ee'],['#b8602a','#fdefe4'],['#b0436b','#fce9f0'],['#85701f','#f6f1df'],['#4f5d77','#e9edf3']];
const SW=new Set('de del la las los el y e o en a al por para con u'.split(' '));
const tc=s=>(s||'').toLowerCase().split(' ').map((w,i)=>i&&SW.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const xref=s=>s.replace(/\b((?:art[íi]culos?|arts?\.)\s*(?:N\.?\s?[º°]\s*)?)(\d{1,3})\b(?!\s*(?:\)|º|°)?\s*(?:inc\.?\s*\d+\)?\s*)?(?:de la Ley|de la ley|del C[oó]digo|de la Constituci|del Decreto|de la Ac))/gi,(m,p,n)=>byL[n]?`${p}<a class="x" href="#/a/${byL[n].n}">${n}</a>`:m);
const byN={},byL={};A.forEach(a=>{byN[a.n]=a;byL[a.l]=a});for(let i=327;i<=335;i++)byL[i]=byL['326 a 335'];const ORDI={};A.forEach((a,i)=>ORDI[a.n]=i);const LB=x=>byN[x].l;
N.forEach((n,i)=>{n.i=i;n.ch=[]});N.forEach(n=>{if(n.par>=0)N[n.par].ch.push(n.i)});
const nodeOf={};N.forEach(n=>n.arts.forEach(x=>nodeOf[x]=n.i));
const sub=i=>{const n=N[i];if(n._s)return n._s;let r=[...n.arts];n.ch.forEach(c=>r=r.concat(sub(c)));return n._s=r.sort((a,b)=>ORDI[a]-ORDI[b])};
const libros=N.filter(n=>n.lv==1),root=i=>{while(N[i].par>=0)i=N[i].par;return i};
const col=i=>PAL[libros.indexOf(N[root(i)])%PAL.length][0],bg=i=>PAL[libros.indexOf(N[root(i)])%PAL.length][1];
const roman=s=>/^[IVXL]+$/i.test(s)?s.toUpperCase():tc(s);
const label=n=>n.kind+' '+roman(n.num);
const title=n=>tc(n.name)||label(n);
const rng=i=>{const s=sub(i);return s.length?(s[0]==s[s.length-1]?'Art. '+LB(s[0]):`Arts. ${LB(s[0])}–${LB(s[s.length-1])}`):''};
const PL={Capítulo:'capítulos'};
const rub=a=>a.t||'Artículo '+a.n;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('No se pudo copiar'));

/* plazos: se detectan en el texto de cada artículo */
const ORD=/\b(segundo|tercer[o]?|cuarto|quinto)\s+d[ií]a/gi,OV={segundo:2,tercer:3,tercero:3,cuarto:4,quinto:5};
const WN={un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,quince:15,veinte:20,treinta:30,sesenta:60,noventa:90,'cuarenta y cinco':45};const PZ=/(?:\((\d+)\)|\b(\d{1,3})|\b(un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta|sesenta|noventa|cuarenta y cinco))\s+(?:\(\d+\)\s+)?(d[ií]as(?:\s+h[aá]biles|\s+corridos)?|d[ií]a|meses|mes|a[ñn]os|a[ñn]o|horas|hora)/gi;
const UN=u=>/^d/i.test(u)?'días':/^m/i.test(u)?'meses':/^a/i.test(u)?'años':'horas';
A.forEach(a=>{a.z=[];a.p.forEach(p=>{for(const m of p.matchAll(PZ)){const s=Math.max(0,m.index-90),e=Math.min(p.length,m.index+m[0].length+60);
 {const v=+(m[1]||m[2]||WN[m[3].toLowerCase()]);a.z.push({v,u:UN(m[4]),l:v+' '+m[4].toLowerCase(),c:(s?'…':'')+p.slice(s,e).trim()+(e<p.length?'…':'')})}}});
 a.p.forEach(p=>{for(const m of p.matchAll(ORD)){const v=OV[norm(m[1])];a.z.push({v,u:'días',l:v+'.º día',c:p.slice(Math.max(0,m.index-90),m.index+m[0].length+60).trim()})}});a.zl=[...new Set(a.z.map(z=>z.l))]});
const hlpz=s=>s.replace(PZ,'<mark class="pz">$&</mark>').replace(ORD,'<mark class="pz">$&</mark>');

function nav(){let h='<h5>Índice</h5>';libros.forEach(l=>{if(!l.ch.length){h+=`<a class="l" data-n="${l.i}" href="#/n/${l.i}" style="border-left:4px solid ${col(l.i)};padding-left:10px;font-weight:600">${label(l)} · ${esc(tc(l.name))}</a>`;return}h+=`<details><summary style="border-left:4px solid ${col(l.i)}">${label(l)} · ${esc(tc(l.name))}</summary>`;
 l.ch.forEach(c=>h+=`<a class="l" data-n="${c}" href="#/n/${c}">${label(N[c])} · ${esc(tc(N[c].name))}</a>`);h+='</details>'});side.innerHTML=h;
 $('#fc').innerHTML=`<button class="chip" data-l="" aria-pressed="true">Toda la Ley</button>`+libros.map(l=>`<button class="chip" data-l="${l.i}" title="${esc(tc(l.name))}" aria-pressed="false">${label(l)}</button>`).join('')}
function artHTML(a){const body=a.p.map(p=>`<p class="${/^(\d+|[a-zñ])\)\s|^[-•–]\s/.test(p)?'inc':''}">${xref(hlpz(esc(p)))}</p>`).join('');
 return `<article class="art" id="a${a.n}"><header><div class="num">Art. ${a.l}</div><div><h4>${esc(rub(a))}</h4><p class="sum">${xref(esc(a.s))}</p>${a.zl.length?`<div class="zs">${a.zl.map(z=>`<span class="pzc">⏱ ${esc(z)}</span>`).join('')}</div>`:''}</div></header>
 <div class="acts"><button class="btn sm" data-act="t">Ver texto completo</button><button class="ghost sm" data-act="c" data-n="${a.n}">Copiar</button><button class="ghost sm" data-act="l" data-n="${a.n}">Enlace</button></div><div class="full" hidden>${body}${a.nt&&a.nt.length?`<div class="nt"><b>Normas complementarias citadas</b><ul>${a.nt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div></article>`}
function crumbs(i){let c=[],k=i;while(k>=0){c.unshift(`<a href="#/n/${k}">${label(N[k])}</a>`);k=N[k].par}return `<nav class="crumb"><a href="#/">Inicio</a><span>›</span>${c.join('<span>›</span>')}</nav>`}
function card(i){const n=N[i],s=sub(i);const txt=n.ch.length?n.ch.slice(0,4).map(c=>tc(N[c].name)||label(N[c])).join(' · ')+(n.ch.length>4?' · …':''):s.slice(0,4).map(x=>rub(byN[x])).join(' · ')+(s.length>4?' · …':'');
 return `<a class="card" href="#/n/${i}" style="--ac:${col(i)};--b:${bg(i)}"><h3><span class="big">${label(n)}</span><br>${esc(title(n))}</h3><p>${esc(txt)}</p><div class="meta"><span>${rng(i)}</span><span>${s.length} art.</span>${n.ch.length?`<span>${n.ch.length} ${PL[N[n.ch[0]].kind]}</span>`:''}</div></a>`}
const foot=()=>`<p class="foot">Texto del Reglamento para el Poder Judicial de la Provincia de Misiones, edición 2025 (publicación oficial del Superior Tribunal de Justicia), según el documento cargado. No incluye el Reglamento de Sumarios (Ac. 229/19) ni los anexos del Complemento, solo las referencias a ellos. Los nombres de los títulos son descriptivos. Las síntesis y los plazos se extraen automáticamente del texto de cada artículo y son solo una guía de lectura: verificá siempre con la versión oficial vigente.</p>`;
function home(){const cnt=k=>N.filter(n=>n.kind==k).length;
 main.innerHTML=`<section class="hero"><span class="eyebrow">Provincia de Misiones</span><h1>Reglamento para el Poder Judicial de la Provincia de Misiones</h1><p>Texto del Reglamento (edición 2025) del Superior Tribunal de Justicia, con las normas complementarias que cita cada artículo, con índice navegable, síntesis de cada artículo, búsqueda inteligente, referencias cruzadas y buscador de plazos.</p>
 <div class="stats"><div class="stat"><b>${A.length}</b><span>artículos</span></div><div class="stat"><b>${cnt('Título')}</b><span>títulos</span></div><div class="stat"><b>${cnt('Capítulo')}</b><span>capítulos</span></div></div>
 <div class="go"><input id="gn" type="text" inputmode="numeric" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button><a class="btn" href="#/plazos">⏱ Buscar plazos</a></div></section>
 <div class="sec"><h2>Títulos</h2><span>Acceso rápido a cada título de la Ley</span></div><div class="grid">${libros.map(l=>card(l.i)).join('')}</div>
 <div class="sec"><h2>Accesos rápidos por capítulo</h2><span>${cnt('Capítulo')} capítulos</span></div><div class="grid">${N.filter(n=>n.lv==2).map(n=>card(n.i)).join('')}</div>${foot()}`;
 const go=()=>{const v=$('#gn').value.trim().toLowerCase();byL[v]?location.hash='/a/'+byL[v].n:toast('Ingresá un artículo entre 1 y 342 (ej. 237 bis)')};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function nodeView(i){const n=N[i],s=sub(i);
 let h=crumbs(i)+`<header class="nh"><span class="eyebrow">${label(n)}</span><h1>${esc(title(n))}</h1><div class="meta"><span>${rng(i)}</span><span>${s.length} artículo${s.length>1?'s':''}</span></div></header>`;
 h+=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${s.length>1?`los artículos <b>${LB(s[0])}</b> a <b>${LB(s[s.length-1])}</b> (${s.length} en total)`:`el artículo <b>${LB(s[0])}</b>`}${n.ch.length?`, organizados en ${n.ch.length} ${PL[N[n.ch[0]].kind]}:`:', que regulan:'}</p><ul>`+
 (n.ch.length?n.ch.map(c=>`<li><a href="#/n/${c}"><b>${label(N[c])}</b> – ${esc(tc(N[c].name))}</a> <small>(${rng(c)})</small></li>`).join(''):n.arts.map(x=>`<li><a href="#/a/${x}"><b>Art. ${LB(x)}</b> – ${esc(rub(byN[x]))}</a></li>`).join(''))+'</ul></div>';
 if(n.ch.length)h+=`<div class="grid">${n.ch.map(card).join('')}</div>`;
 if(n.arts.length)h+=`<div class="bar"><button class="btn sm" data-act="all">Expandir todos los textos</button><button class="ghost sm" data-act="none">Contraer todos</button></div>`+n.arts.map(x=>artHTML(byN[x])).join('');
 const u=N.filter(m=>m.arts.length),k=u.indexOf(n);if(k>=0)h+=`<div class="pn">${k>0?`<a class="ghost" href="#/n/${u[k-1].i}">← ${esc(title(u[k-1]))}</a>`:'<span></span>'}${k<u.length-1?`<a class="ghost" href="#/n/${u[k+1].i}">${esc(title(u[k+1]))} →</a>`:''}</div>`;
 main.innerHTML=h+foot();main.style.cssText=`--ac:${col(i)};--b:${bg(i)}`;
 side.querySelectorAll('.l').forEach(l=>l.classList.remove('on'));
 let t=i;while(N[t].lv>2)t=N[t].par;const l=side.querySelector(`.l[data-n="${t}"]`);if(l){l.classList.add('on');l.parentElement.open=true}}

/* búsqueda: palabras en cualquier orden, sinónimos, números y variantes */
const STOP=new Set('de del la las el los lo al a y e o u en con por para que se su sus es son ser un una como si no mas muy le les sobre entre hay ha han este esta cuando donde cual quiero busco necesito puede pueden debe deben'.split(' '));
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
function stem(w){if(/^\d+$/.test(w)||w.length<5)return w;for(const x of ['amientos','amiento','imientos','imiento','aciones','acion','uciones','ucion','adores','ador','mente','ables','able','ando','iendo','ados','adas','idos','idas','ado','ada','ido','ida','es','s','ar','er','ir','a','o','e'])if(w.endsWith(x)&&w.length-x.length>=4)return w.slice(0,-x.length);return w}
const NUM={1:'uno un una',2:'dos',3:'tres',5:'cinco',10:'diez',15:'quince',20:'veinte',30:'treinta',60:'sesenta',90:'noventa'};
const SYN=new Map();
['plazo termino lapso periodo vencimiento vence','licencia permiso ausencia inasistencia','enfermedad salud medico certificado','feria receso inhabil habil','sancion multa apercibimiento suspension cesantia exoneracion','sumario instructor informacion sumaria','escalafon ascenso calificacion puntaje promocion','ingreso concurso examen aspirante','empleado agente funcionario magistrado','horario asistencia puntualidad','juez tribunal juzgado camara','secretaria secretario','archivo expediente','mandamiento notificacion oficial cedula','conjuez subrogante suplente','recusacion excusacion impedimento','matricula inscripcion profesional abogado','dia dias','mes meses','ano anos','hora horas'].forEach(g=>{const st=[...new Set(g.split(' ').map(stem))];st.forEach(s=>{if(!SYN.has(s))SYN.set(s,new Set());st.forEach(x=>SYN.get(s).add(x))})});
function accepted(t){const set=new Set(),s=stem(t);set.add(s);SYN.has(s)&&SYN.get(s).forEach(x=>set.add(x));if(/^\d+$/.test(t)&&NUM[+t])NUM[+t].split(' ').forEach(w=>set.add(stem(w)));for(const[n,ws]of Object.entries(NUM))if(ws.split(' ').includes(t))set.add(n);return set}
const near=(a,t)=>{if(a===t)return true;const sh=a.length<t.length?a:t,lg=a.length<t.length?t:a;return sh.length>=4&&lg.startsWith(sh)&&sh.length/lg.length>=.6};
const hit=(tk,acc)=>{for(const a of acc)for(const t of tk)if(near(a,t))return true;return false};
let ixd=0;const idx=()=>{if(ixd)return;ixd=1;A.forEach(a=>{a._m=new Set(words(rub(a)+' '+a.s+' '+a.l).map(stem));a._a=new Set([...a._m,...words(a.p.join(' ')+' '+(a.nt||[]).join(' ')).map(stem)])})};
const W=/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g,mk=(w,accs)=>{const s=stem(norm(w));return accs.some(a=>[...a].some(x=>near(x,s)))};
const hl=(t,accs)=>{let o='',p=0;for(const m of t.matchAll(W)){o+=esc(t.slice(p,m.index))+(mk(m[0],accs)?'<mark>'+esc(m[0])+'</mark>':esc(m[0]));p=m.index+m[0].length}return o+esc(t.slice(p))};
let lib='';
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
const inLib=a=>!lib||root(nodeOf[a.n])==+lib;
function search(v){const terms=[...new Set(words(v).filter(w=>!STOP.has(w)||/^\d+$/.test(w)))];if(!terms.length)return route();
 if(byL[v.trim().toLowerCase()]){location.hash='/a/'+byL[v.trim().toLowerCase()].n;return}
 idx();main.style.cssText='';const accs=terms.map(accepted),run=need=>A.filter(a=>inLib(a)&&accs.filter(x=>hit(a._a,x)).length>=need);
 let rs=run(terms.length),partial=false;if(!rs.length&&terms.length>1){partial=true;rs=run(Math.max(1,Math.ceil(terms.length/2)))}
 rs=rs.map(a=>({a,s:accs.some(x=>hit(a._m,x))?0:1,k:accs.filter(x=>hit(a._a,x)).length})).sort((x,y)=>y.k-x.k||x.s-y.s||x.a.n-y.a.n);
 const snip=a=>{const b=a.p.join(' ');let ix=0;for(const m of b.matchAll(W))if(mk(m[0],accs)){ix=m.index;break}const st=Math.max(0,ix-70);return(st?'…':'')+b.slice(st,st+240)+(b.length>st+240?'…':'')};
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${rs.length>60?' · se muestran 60':''}${lib?' · '+esc(label(N[+lib])):''}</span></div>
 <p class="hint">${partial?'Coincidencia parcial: no hay artículos con todas las palabras; se muestran los que tienen al menos la mitad. ':''}Entiende varias palabras en cualquier orden, sinónimos y números (5 = cinco), y busca también en el texto completo.</p>`+
 (rs.slice(0,60).map(({a})=>{const n=N[nodeOf[a.n]];return `<article class="art"><header><div class="num">Art. ${a.l}</div><div><h4>${hl(rub(a),accs)}<small>${esc(n.i==root(n.i)?label(n)+' · '+tc(n.name):label(N[root(n.i)])+' › '+label(n)+' · '+tc(n.name))}</small></h4><p class="sum">${hl(snip(a),accs)}</p></div></header><div class="acts"><a class="btn sm" href="#/a/${a.n}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Título.</p>')}

/* vista de plazos */
let pu='todos';
function plazosView(){main.style.cssText='';
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Plazos</span></nav><div class="sec"><h2>Buscador de plazos</h2><span>Detectados en el texto de los artículos</span></div>
 <div class="tabs">${['todos','días','meses','años','horas'].map(u=>`<button data-u="${u}" class="${u==pu?'on':''}">${tc(u)}</button>`).join('')}</div>
 <div class="ctl"><input id="pq" type="search" placeholder="Filtrar por tema: ej. prescripción, recurso, pago…"><input id="pv" type="number" min="1" placeholder="Cantidad"><select id="pl"><option value="">Toda la Ley</option>${libros.map(l=>`<option value="${l.i}"${lib==l.i?' selected':''}>${label(l)} · ${esc(tc(l.name))}</option>`).join('')}</select></div>
 <p class="cnt hint" id="pc"></p><table class="tb"><thead><tr><th>Artículo</th><th>Plazo</th><th>Contexto</th></tr></thead><tbody id="pb"></tbody></table>${foot()}`;
 const draw=()=>{const q=norm($('#pq').value),v=+$('#pv').value,l=$('#pl').value;let r=[];
  A.forEach(a=>a.z.forEach(z=>{if((pu=='todos'||z.u==pu)&&(!v||z.v==v)&&(!l||root(nodeOf[a.n])==+l)&&(!q||norm(rub(a)+' '+z.c).includes(q)))r.push({a,z})}));
  $('#pc').textContent=`${r.length} plazo${r.length==1?'':'s'}${r.length>150?' · se muestran 150':''}`;
  $('#pb').innerHTML=r.slice(0,150).map(({a,z})=>`<tr><td data-l="Artículo"><a class="x" href="#/a/${a.n}">Art. ${a.l}</a><div class="hint">${esc(rub(a))}</div></td><td data-l="Plazo"><span class="pzc">⏱ ${esc(z.l)}</span></td><td data-l="Contexto">${xref(esc(z.c))}</td></tr>`).join('')||'<tr><td colspan="3">Sin plazos con esos filtros.</td></tr>'};
 ['#pq','#pv'].forEach(s=>$(s).oninput=draw);$('#pl').onchange=e=>{setLib(e.target.value);draw()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{pu=b.dataset.u;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));draw()});draw()}

function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');main.style.cssText='';
 const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;if(ri!=null&&N[ri])setLib(String(root(ri)));else if(h!='/plazos')setLib('');
 if(h=='/plazos'){plazosView();scrollTo(0,0);return}
 if(!m||(m[1]=='n'&&!N[+m[2]])||(m[1]=='a'&&!byN[+m[2]])){home();scrollTo(0,0);side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));return}
 if(m[1]=='n'){nodeView(+m[2]);scrollTo(0,0)}
 else{const n=+m[2];nodeView(nodeOf[n]);const e=document.getElementById('a'+n);if(e){e.classList.add('hit');e.querySelector('.full').hidden=false;e.querySelector('[data-act=t]').textContent='Ocultar texto completo';setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}}
const setT=(a,t)=>{a.querySelector('.full').hidden=t;a.querySelector('[data-act=t]').textContent=t?'Ver texto completo':'Ocultar texto completo'};
document.addEventListener('click',e=>{
 const c=e.target.closest('#fc .chip');if(c){setLib(c.dataset.l);$('#q').value='';location.hash=c.dataset.l?'/n/'+c.dataset.l:'/';route();return}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,art=b.closest('.art');
 if(act=='t')setT(art,!art.querySelector('.full').hidden);
 else if(act=='all'||act=='none')document.querySelectorAll('.art').forEach(x=>setT(x,act=='none'));
 else if(act=='c'){const a=byN[+b.dataset.n];copy(`Artículo ${a.l}.- ${a.t}\n\n`+a.p.join('\n'),'Texto copiado')}
 else if(act=='l')copy(location.href.split('#')[0]+'#/a/'+b.dataset.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#12161f';r.dataset.theme=dk?'light':'dark'};
addEventListener('hashchange',route);
nav();route();
</script>
</body>
