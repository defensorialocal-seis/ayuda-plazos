blioteca del Poder Judicial;","Archivo General de los Tribunales y demás oficinas auxiliares;","11) disponer la confección de los legajos personales de magistrados, funcionarios y empleados;","12) disponer la instrucción de los sumarios administrativos ordenados por el Tribunal;","13) recibir las pruebas que se produzcan ante el Tribunal sin perjuicio del derecho de cada Ministro de asistir a las audiencias y del que tienen las partes para pedir su presencia;","14) presidir y dirigir el trámite de las causas que sustancia el Superior Tribunal de Justicia, dictar las providencias que hacen a aquél, sin perjuicio del derecho de las partes de recurrir ante el Cuerpo en pleno;","15) ordenar y distribuir el despacho de las causas con arreglo al orden que establecen las leyes de procedimiento;","16) recibir y dirigir la comunicación oficial;","17) visar las cuentas del Presupuesto del Poder Judicial;","18) redactar la memoria anual que debe presentarse al Poder Ejecutivo referente al movimiento de la Administración de Justicia, como al estado y necesidades de la misma;","19) conceder licencias a los magistrados, funcionarios y empleados en la forma y modo que determina el Reglamento para el Poder Judicial;","20) efectuar visitas de inspección a las dependencias del Poder Judicial;","21) proveer a la sustitución de jueces, funcionarios y empleados en los casos de ausencia o impedimento transitorio;","22) ejercer las demás atribuciones que le confieren las leyes de la Nación o de la Provincia."],"s":"1) representar al Poder Judicial en todo acto oficial;"},{"n":96,"t":"Corresponde al Presidente de las Cámaras de Apelaciones y de los Tribunales Penales","p":["Corresponde al Presidente de las Cámaras de Apelaciones y de los Tribunales Penales:","1) representar a las Cámaras y a los Tribunales Penales en los actos protocolares y en todas las relaciones de las mismas con magistrados, entidades o personas;","2) dictar las providencias de trámite, sin perjuicio del recurso de revocatoria ante la Sala respectiva;","3) convocar a acuerdos extraordinarios en los casos urgentes citando al Tribunal cuando las circunstancias así lo requieren;","4) elevar mensualmente al Superior Tribunal de Justicia una nómina de los expedientes que se encuentran para sentencia, con expresión del nombre de las partes y de la fecha del llamamiento de autos;","5) presidir las audiencias y recibir la prueba, sin perjuicio del derecho de los vocales para asistir a las mismas y del que tienen las partes para pedir su presencia;","6) distribuir las causas con arreglo al orden que establecen las leyes de procedimiento y cuidar el oportuno despacho de las mismas;","7) velar por el orden, la disciplina y la economía interna de las oficinas bajo su dependencia, pudiendo a tal fin, aplicar las sanciones que autoriza el Reglamento para el Poder Judicial;","8) conceder licencias a Secretarios y empleados de su dependencia conforme a las disposiciones reglamentarias en la materia."],"s":"1) representar a las Cámaras y a los Tribunales Penales en los actos protocolares y en todas las relaciones de las mismas con magistrados, entidades o personas;"},{"n":97,"t":"Para ser Juez de Primera Instancia y Juez de…","p":["Para ser Juez de Primera Instancia y Juez de Instrucción se requieren las condiciones determinadas por el artículo 139 de la Constitución Provincial."],"s":"Para ser Juez de Primera Instancia y Juez de Instrucción se requieren las condiciones determinadas por el artículo 139 de la Constitución Provincial."},{"n":98,"t":"Los Jueces de Primera Instancia y de Instrucción tienen…","p":["Los Jueces de Primera Instancia y de Instrucción tienen las facultades y atribuciones que se determinan en la presente ley, debiendo igualmente cumplir con los deberes y obligaciones impuestos al cargo y función que desempeñan."],"s":"Los Jueces de Primera Instancia y de Instrucción tienen las facultades y atribuciones que se determinan en la presente ley, debiendo igualmente cumplir con los deberes y obligaciones impuestos al cargo y función que desempeñan."},{"n":99,"t":"Corresponde a los Jueces de Primera Instancia y de Instrucción","p":["Corresponde a los Jueces de Primera Instancia y de Instrucción:","1) concurrir diariamente a su despacho y cuando no pueden hacerlo lo comunican por nota a su subrogante legal y a la Secretaría Administrativa y de Superintendencia del Superior Tribunal de Justicia;","2) conceder licencias a los Secretarios y personal de los juzgados a su cargo, cualquiera sea su causa, siempre que el término no exceda de cinco (5) días. Si excede de ese término, eleva el pedido a consideración del Presidente del Superior Tribunal de Justicia;","3) aplicar al personal de su dependencia las sanciones disciplinarias que fija el Reglamento para el Poder Judicial por faltas reiteradas, retardos o negligencias en el cumplimiento de sus funciones;","4) no puede faltar a sus tareas por más de dos (2) días hábiles consecutivos sin la correspondiente licencia que debe solicitar a la presidencia del Superior Tribunal de Justicia."],"s":"1) concurrir diariamente a su despacho y cuando no pueden hacerlo lo comunican por nota a su subrogante legal y a la Secretaría Administrativa y de Superintendencia del Superior Tribunal de Justicia;"},{"n":100,"t":"En caso de recusación, excusación, vacancia, licencia o cualquier…","p":["En caso de recusación, excusación, vacancia, licencia o cualquier otro impedimento, los Jueces de Primera Instancia se suplen conforme a las normas que fija en la respectiva reglamentación el Superior Tribunal de Justicia."],"s":"En caso de recusación, excusación, vacancia, licencia o cualquier otro impedimento, los Jueces de Primera Instancia se suplen conforme a las normas que fija en la respectiva reglamentación el Superior Tribunal de Justicia."},{"n":101,"t":"Son aplicables a los Jueces en lo Correccional y…","p":["Son aplicables a los Jueces en lo Correccional y de Menores, todas las disposiciones relativas a los Jueces de Primera Instancia y de Instrucción previstas en los artículos precedentes."],"s":"Son aplicables a los Jueces en lo Correccional y de Menores, todas las disposiciones relativas a los Jueces de Primera Instancia y de Instrucción previstas en los artículos precedentes."},{"n":102,"t":"En los casos de excusación, recusación, vacancia u otro impedimento, el régimen de subrogancias en los Juzgados en lo Correccional y de Menores es el siguiente","p":["En los casos de excusación, recusación, vacancia u otro impedimento, el régimen de subrogancias en los Juzgados en lo Correccional y de Menores es el siguiente:","1) por los Jueces en lo Correccional y de Menores de la misma circunscripción judicial;","2) por los Jueces de Instrucción de la misma circunscripción judicial;","3) por los Jueces de Primera Instancia de la misma circunscripción judicial;","4) por los conjueces designados de acuerdo con normas en vigencia."],"s":"1) por los Jueces en lo Correccional y de Menores de la misma circunscripción judicial;"},{"n":103,"t":"Son de aplicación a los Jueces de Paz en…","p":["Son de aplicación a los Jueces de Paz en lo pertinente, las disposiciones contenidas en el artículo 99."],"s":"Son de aplicación a los Jueces de Paz en lo pertinente, las disposiciones contenidas en el artículo 99."},{"n":104,"t":"Fuera de la competencia atribuida por la presente ley, son deberes de los Jueces de Paz","p":["Fuera de la competencia atribuida por la presente ley, son deberes de los Jueces de Paz:","1) comunicar al Juez de Primera Instancia en lo Civil y Comercial que corresponde, los fallecimientos que ocurren en el lugar de su jurisdicción, de personas que no tienen parientes conocidos;","2) desempeñar las comisiones que le confieren los tribunales y jueces, así como las funciones o deberes que les asignan otras leyes o reglamentos especiales;","3) llevar a conocimiento de los Defensores Oficiales de la circunscripción judicial a la que corresponde, los casos de orfandad, abandono material o peligro mortal de los menores de edad, sin perjuicio de las medidas de urgencia que puede adoptar;","4) tomar simples medidas conservatorias en los casos de herencias prima facie reputadas vacantes, debiendo dar cuenta dentro de las veinticuatro (24) horas de iniciadas las diligencias, al Juez Civil que corresponde;","5) cumplir las medidas que dispone el Superior Tribunal de Justicia en materia administrativa y de superintendencia."],"s":"1) comunicar al Juez de Primera Instancia en lo Civil y Comercial que corresponde, los fallecimientos que ocurren en el lugar de su jurisdicción, de personas que no tienen parientes conocidos;"},{"n":105,"t":"El Ministerio Público depende exclusivamente del Poder Judicial.","p":["El Ministerio Público depende exclusivamente del Poder Judicial.","Sus integrantes no perciben más emolumentos que la retribución que les asigna la Ley de Presupuesto.","Los honorarios que se les regulen por costas a cargo de la parte contraria ingresan al patrimonio del Poder Judicial, que destina dichos fondos al acrecimiento del acervo bibliográfico de la Biblioteca del Poder Judicial."],"s":"El Ministerio Público depende exclusivamente del Poder Judicial."},{"n":106,"t":"Para ser miembro del Ministerio Público se requiere ser…","p":["Para ser miembro del Ministerio Público se requiere ser mayor de edad, acreditar nacionalidad argentina por nacimiento o por naturalización y, en este caso, diez (10) años de ejercicio de la ciudadanía, poseer título de abogado expedido por universidad argentina o extranjera legalmente admitida por la Nación, con dos (2) años de ejercicio de la profesión o antigüedad en el cargo de Secretario o cuatro (4) años de desempeño de función o empleo judicial, con excepción del Procurador General, del Fiscal y Defensor de Cámara, quienes deben reunir las condiciones establecidas por el artículo 138 de la Constitución Provincial."],"s":"Para ser miembro del Ministerio Público se requiere ser mayor de edad, acreditar nacionalidad argentina por nacimiento o por naturalización y, en este caso, diez (10) años de ejercicio de la ciudadanía, poseer título de…"},{"n":107,"t":"En caso de impedimento, recusación, excusación, licencia o vacancia,…","p":["En caso de impedimento, recusación, excusación, licencia o vacancia, el Procurador General es subrogado por los Fiscales de Cámara, por sorteo y luego por los Fiscales de Primera Instancia, por sorteo.","El Fiscal de Cámara es subrogado por los Fiscales de Primera Instancia de la misma circunscripción, por sorteo.","El Defensor Oficial de Cámara es subrogado por los Defensores Oficiales de Primera Instancia de la misma circunscripción judicial, por sorteo.","Los demás integrantes se subrogan en la forma que determina la reglamentación correspondiente."],"s":"En caso de impedimento, recusación, excusación, licencia o vacancia, el Procurador General es subrogado por los Fiscales de Cámara, por sorteo y luego por los Fiscales de Primera Instancia, por sorteo."},{"n":108,"t":"El Procurador General del Superior Tribunal de Justicia tiene a su cargo las siguientes funciones","p":["El Procurador General del Superior Tribunal de Justicia tiene a su cargo las siguientes funciones:","1) es el Jefe del Ministerio Público, sobre el que ejerce superintendencia;","2) interviene en todas las acciones y recursos de inconstitucionalidad llevados a conocimiento del Superior Tribunal de Justicia;","3) dictamina en los conflictos de competencia que se suscitan entre los poderes públicos de la Provincia de los que debe conocer dicho Tribunal;","4) es parte legítima en las causas en que por las leyes en vigencia debe intervenir el Ministerio Público, cuando dichas causas llegan a conocimiento del Superior Tribunal;","5) dictamina en las cuestiones que corresponde resolver a dicho Tribunal por vía de superintendencia;","6) controla el estricto cumplimiento de las disposiciones establecidas por los códigos de procedimiento, referidas a los plazos para la terminación de causas judiciales, pidiendo pronto despacho a los Jueces o Cámaras de Apelaciones o Tribunales Penales en cualquier clase de asunto, por sí o por intermedio de los demás miembros del Ministerio Público y deduciendo con facultades amplias y sin limitación, los recursos y quejas tendientes a obtener una rápida administración de justicia, cuando se vence el término que la ley procesal fija para dictar sentencia definitiva o interlocutoria;","7) deducir de oficio o por denuncia de parte interesada ante quien corresponde, la acción contra el juez negligente;","8) expide las instrucciones y evacua las consultas que le formulan los miembros del Ministerio Público dentro de las normas generales que dicta el Superior Tribunal de Justicia;","9) coordina con el Superior Tribunal de Justicia las cuestiones de superintendencia que conjuntamente interesan al Poder Judicial y al Ministerio Público;","10) asistir cuando sea convocado, con voz y sin voto, a los acuerdos sobre cuestiones de superintendencia del Superior Tribunal de Justicia pudiendo proponer las medidas que cree adecuada;","11) denunciar o acusar, según corresponda, ante el Jurado de Enjuiciamiento de Magistrados y Funcionarios, a quienes están sujetos a su Jurisdicción, conforme al artículo 158 de la Constitución Provincial, teniendo a tal fin amplias facultades de investigación;","12) ejercer las demás funciones que le confieren la Constitución, los códigos y leyes especiales y velar por su cumplimiento;","13) evacuar las vistas que le confiere el Presidente o el Superior Tribunal;","14) Sin perjuicio de lo dispuesto en el artículo 63 de la Ley XIV – N.º 13, el Procurador General puede, por resolución fundada, designar al Fiscal o Fiscales que actúan como adjuntos del Fiscal interviniente en causas criminales."],"s":"1) es el Jefe del Ministerio Público, sobre el que ejerce superintendencia;"},{"n":109,"t":"Corresponde al Fiscal de Cámara y al Fiscal del Tribunal Penal","p":["Corresponde al Fiscal de Cámara y al Fiscal del Tribunal Penal:","1) continuar ante las respectivas Cámaras de Apelaciones la intervención de los Fiscales de Primera Instancia, y ante los respectivos Tribunales Penales la intervención de los Agentes Fiscales;","2) cuidar que los encargados de ejercer el Ministerio Fiscal ante los Juzgados de Primera Instancia, de Instrucción y en lo Correccional y de Menores promuevan las gestiones que les corresponden y desempeñen fielmente los demás deberes de su cargo;","3) asistir a las visitas de cárceles;","4) ejercer las demás funciones que especialmente se le confieren por imperio de las leyes de procedimiento y leyes especiales."],"s":"1) continuar ante las respectivas Cámaras de Apelaciones la intervención de los Fiscales de Primera Instancia, y ante los respectivos Tribunales Penales la intervención de los Agentes Fiscales;"},{"n":110,"t":"Corresponde al Defensor Oficial de Cámara","p":["Corresponde al Defensor Oficial de Cámara:","1) continuar ante las respectivas Cámaras de Apelaciones, la intervención de los Defensores Oficiales de Primera Instancia;","2) intervenir en los juicios con arreglo a lo que determinan las leyes de procedimiento y las leyes especiales;","3) actuar ante el Superior Tribunal de Justicia en los asuntos de la competencia del mismo cuando corresponde la intervención de un Defensor Oficial."],"s":"1) continuar ante las respectivas Cámaras de Apelaciones, la intervención de los Defensores Oficiales de Primera Instancia;"},{"n":111,"t":"Los Fiscales de Primera Instancia ejercen sus funciones ante…","p":["Los Fiscales de Primera Instancia ejercen sus funciones ante los Juzgados de Primera Instancia, y los Agentes Fiscales ante los Juzgados de Instrucción Penal y en los de Correccional y de Menores. El Superior Tribunal de Justicia por medio de la reglamentación pertinente, establece la competencia, turnos y subrogancia de los mismos."],"s":"Los Fiscales de Primera Instancia ejercen sus funciones ante los Juzgados de Primera Instancia, y los Agentes Fiscales ante los Juzgados de Instrucción Penal y en los de Correccional y de Menores"},{"n":112,"t":"Corresponde a los Fiscales de Primera Instancia y Agentes Fiscales","p":["Corresponde a los Fiscales de Primera Instancia y Agentes Fiscales:","1) intervenir en las cuestiones de competencia y en la tramitación de exhortos;","2) intervenir en los juicios sobre nulidad de matrimonio, filiación, ausencia con presunción de fallecimiento, divorcio, inscripción y rectificación de actas del Registro de las Personas y en todo asunto que afecta el estado civil de las personas;","3) intervenir en los concursos preventivos y quiebras, y juicios sucesorios en la forma que determinan las leyes procesales;","4) expedirse sobre los documentos y contratos presentados en juicio y sujetos al pago de sellados;","5) intervenir en todo asunto relativo al orden público;","6) intervenir en todos los casos en que la participación del Ministerio Fiscal es requerida en la forma que determinan los códigos procesales y las leyes especiales;","7) intervenir en toda causa criminal, solicitando la aplicación de las penas respectivas y demás medidas que requieren el ejercicio de su ministerio;","8) asistir a las visitas de cárceles y suministrar a los jueces datos e informes sobre las causas que requieren su despacho;","9) vigilar el estricto cumplimiento de los plazos procesales en la materia que así corresponde;","10) ejercer las demás funciones que le confieren la Constitución, los códigos y leyes especiales."],"s":"1) intervenir en las cuestiones de competencia y en la tramitación de exhortos;"},{"n":113,"t":"Los Defensores Oficiales de Primera Instancia y Defensores de…","p":["Los Defensores Oficiales de Primera Instancia y Defensores de Oficio, ejercen sus funciones ante los Jueces de Primera Instancia, de Instrucción Penal y en lo Correccional y de Menores, representando y asistiendo judicial o extrajudicialmente a los pobres, incapaces, ausentes, menores y trabajadores, de conformidad a las atribuciones y deberes que al efecto le asignan las leyes de fondo y de procedimiento. El Reglamento para el Poder Judicial determina la competencia, turnos y subrogancia de los mismos.","En todos los casos los Defensores Oficiales que actúan ante los Juzgados de Instrucción actúan también como tales, ante los Tribunales en lo Penal de su respectiva circunscripción.","Exceptúanse de la regla del apartado precedente los Defensores Oficiales de Apóstoles, Puerto Rico, San Ignacio, Leandro N. Alem, San Vicente y Puerto Iguazú, los que son suplidos por los Defensores Oficiales de la ciudad de Posadas, Oberá y Eldorado respectivamente."],"s":"Los Defensores Oficiales de Primera Instancia y Defensores de Oficio, ejercen sus funciones ante los Jueces de Primera Instancia, de Instrucción Penal y en lo Correccional y de Menores, representando y asistiendo judicial o…"},{"n":114,"t":"Los Defensores Oficiales de Primera Instancia y Defensores de…","p":["Los Defensores Oficiales de Primera Instancia y Defensores de Oficio, intervienen en todos los asuntos judiciales o extrajudiciales que se relacionan con las personas o intereses de los pobres, incapaces, ausentes, menores y trabajadores, sea en forma promiscua, directa, delegada o como patrocinantes, a fin de solicitar las medidas necesarias a los derechos de los mismos.","La actuación extrajudicial se efectúa a pedido de los interesados o de sus representantes legales.","Actúan asimismo, como amigables componedores y evacúan las consultas que les son formuladas."],"s":"Los Defensores Oficiales de Primera Instancia y Defensores de Oficio, intervienen en todos los asuntos judiciales o extrajudiciales que se relacionan con las personas o intereses de los pobres, incapaces, ausentes, menores y…"},{"n":115,"t":"El deber de patrocinar a los pobres está subordinado…","p":["El deber de patrocinar a los pobres está subordinado al conocimiento que de tal calidad obtiene el Defensor Oficial y el Defensor de Oficio. En caso de comprobarse la existencia de bienes, debe comunicar tal circunstancia al Juez de la causa, quien en caso de condena aplica las costas al patrocinado y los ingresos que por tal concepto se obtiene son destinados a los fines previstos en el artículo 105."],"s":"El deber de patrocinar a los pobres está subordinado al conocimiento que de tal calidad obtiene el Defensor Oficial y el Defensor de Oficio"},{"n":116,"t":"Pueden solicitar a los registros públicos, testimonios libres de…","p":["Pueden solicitar a los registros públicos, testimonios libres de sellados de los instrumentos necesarios para el cumplimiento de sus gestiones, como asimismo peticionar sin cargo actuaciones de oficinas públicas que gravan con tasa o impuesto dichas actuaciones."],"s":"Pueden solicitar a los registros públicos, testimonios libres de sellados de los instrumentos necesarios para el cumplimiento de sus gestiones, como asimismo peticionar sin cargo actuaciones de oficinas públicas que gravan con…"},{"n":117,"t":"Están obligados a agotar los recursos legales contra las…","p":["Están obligados a agotar los recursos legales contra las resoluciones adversas a sus representados, como asimismo consentir tales resoluciones con dictámenes fundados, cuando opinan que resulta perjudicial a los intereses defendidos la prosecución de la causa.","En los casos de demandas promovidas por los representantes de los menores o incapaces, estimadas inconsistentes o de impertinencia notoria por los Defensores Oficiales, estos pueden adoptar el procedimiento que corresponde, sin perjuicio de la responsabilidad de aquellos respecto a las consecuencias patrimoniales de su decisión."],"s":"Están obligados a agotar los recursos legales contra las resoluciones adversas a sus representados, como asimismo consentir tales resoluciones con dictámenes fundados, cuando opinan que resulta perjudicial a los intereses…"},{"n":118,"t":"Corresponde a los Defensores Oficiales de Primera Instancia y Defensores de Oficio","p":["Corresponde a los Defensores Oficiales de Primera Instancia y Defensores de Oficio:","1) intervenir como parte legítima en todos los asuntos, sea de carácter contencioso o voluntario en que están interesados menores o incapaces;","2) patrocinar y representar en los asuntos de su jurisdicción a las personas pobres que lo solicitan;","3) representar y asumir la defensa en juicio de los ausentes;","4) peticionar en nombre de los menores o incapaces, por propia iniciativa, cuando carecen de representante o existe entre éste último, cuando lo haya, y el menor o incapaz, conflicto personal u oposición de intereses;","5) asumir la defensa y patrocinio de los detenidos y procesados que no designan defensor, dentro de los términos legales;","6) patrocinar y representar a los pobres de solemnidad en las demandas o querellas que han de promover ante la jurisdicción criminal;","7) solicitar excarcelaciones en representación de procesados y prevenidos cuyas defensas asumió;","8) intervenir como parte legítima en todos los juicios criminales donde hay menores o incapaces, cuyos representantes legales son querellados por delitos cometidos contra la persona o bienes de sus representados, o cuando por razón de delito están afectados la persona o bienes de los incapaces;","9) evacuar las consultas que sobre materia penal les efectúan los pobres de solemnidad;","10) visitar periódicamente a sus defendidos en los establecimientos donde están alojados para atender su situación personal y procesal, debiendo concurrir a las visitas de cárceles;","11) representar y patrocinar a los trabajadores gratuitamente en las acciones que pretenden iniciar con motivo del vínculo laboral o cuando concurren estos a requerir sus servicios profesionales, en todas las consultas que aquellos les sometan;","12) asesorar gratuitamente a los trabajadores en las consultas que los mismos les formulan sobre materia regida por el derecho del trabajo;","13) asesorar gratuitamente a las entidades gremiales en las consultas o asuntos que les sometan a su consideración;","14) formar un expediente por menor, en el que consta las causas que originan la intervención oficial, y en el cual se agrega la documentación que se produce en lo sucesivo.","También lleva fichero en orden alfabético de los referidos menores, dejando constancia resumida en cada ficha de lo actuado en el expediente respectivo;","15) cuidar de los indicados, proporcionándole alojamiento en los establecimientos oficiales adecuados o, en su defecto, en casas particulares de modo que sean educados, o se les dé algún oficio o profesión que les proporcione un medio de vivir. Si poseen bienes de fortuna, toman las medidas para su seguridad y solicitan la designación de un tutor o curador, según corresponda;","16) atender las quejas que se les formulan por malos tratamientos a menores dados por sus padres, parientes, encargados o personas extrañas y disponer provisoriamente de los mismos, retirándolos de su guarda si es el caso debiendo enseguida plantear la cuestión al Juez correspondiente para su resolución definitiva;","17) ejercer la vigilancia sobre los establecimientos oficiales o particulares e imponerse del tratamiento y educación que se les da a los menores impidiendo la repetición de los abusos que constatan, recabando a las autoridades pertinentes las medidas adecuadas para su remedio;","18) hacer arreglos extrajudiciales con los padres sobre la prestación de alimentos a sus hijos, o representar a estos judicialmente para requerirlos ante el Juez;","19) citar a su despacho a cualquier persona cuando a su juicio es necesario para el desempeño de su ministerio, pidiéndoles explicaciones sobre hechos referentes a menores y practicar informaciones sumarias con el fin de concretar denuncias sobre malos tratos o abandono de menores;","20) fijar la forma y monto de la retribución que corresponde a los menores entregados en tenencia a particulares;","21) ejercer todos los actos que conducen a la protección de los menores como lo haría un padre de familia y deducir las acciones que corresponden contra los padres que faltan al deber de asistencia y alimentación;","22) aplicar las disposiciones precedentes en lo pertinente a los ancianos y a los incapaces;","23) fiscalizar la conducta de los representantes legales de los menores e incapaces sobre la conservación y administración de los bienes de estos y tomar las medidas necesarias para que se les provea de tutor o curador si así corresponde;","24) ejercitar y cumplir todas las demás atribuciones y deberes que les acuerdan o imponen los códigos y leyes especiales;","25) ejercer el patrocinio letrado en las solicitudes de libertad condicional y en todas las que en relación con la pena impuesta formulan ante los jueces los condenados por sentencia firme;","26) coordinar su acción con los del fuero civil, comercial, y laboral, tratándose de menores o incapaces, a cuyo efecto tienen las mismas atribuciones y deberes que aquellos;","27) ejercitar y cumplir las demás atribuciones y deberes que en el fuero penal les acuerdan o imponen los códigos y leyes especiales."],"s":"1) intervenir como parte legítima en todos los asuntos, sea de carácter contencioso o voluntario en que están interesados menores o incapaces;"},{"n":119,"t":"El patrocinio de los Defensores Oficiales de Primera Instancia…","p":["El patrocinio de los Defensores Oficiales de Primera Instancia surte sin otro requisito, los mismos efectos que la declaración judicial de pobreza. Acreditando que el defendido tiene medios suficientes para atender su defensa, cesa la actuación de estos funcionarios."],"s":"El patrocinio de los Defensores Oficiales de Primera Instancia surte sin otro requisito, los mismos efectos que la declaración judicial de pobreza"},{"n":120,"t":"Los Defensores Oficiales del Trabajador gozan de las mismas…","p":["Los Defensores Oficiales del Trabajador gozan de las mismas inmunidades, remuneraciones e incompatibilidades que los demás Defensores Oficiales de Primera Instancia."],"s":"Los Defensores Oficiales del Trabajador gozan de las mismas inmunidades, remuneraciones e incompatibilidades que los demás Defensores Oficiales de Primera Instancia."},{"n":121,"t":"Cuando hay condenación en costas a cargo de los empleadores, se depositan en juicio las sumas de dinero con el siguiente destino","p":["Cuando hay condenación en costas a cargo de los empleadores, se depositan en juicio las sumas de dinero con el siguiente destino:","1) entregar al Fondo Permanente de Seguridad Social para abogados y procuradores, la cuota legal correspondiente;","2) el saldo se deposita en una cuenta especial que se abre al efecto a la orden del Superior Tribunal de Justicia de la Provincia, que debe destinar dichos depósitos para la compra de mobiliarios, libros y útiles y todo aquello que hace al mejor funcionamiento de la Administración de Justicia."],"s":"1) entregar al Fondo Permanente de Seguridad Social para abogados y procuradores, la cuota legal correspondiente;"},{"n":122,"t":"El Superior Tribunal de Justicia, las Cámaras de Apelaciones, los Tribunales Penales, los Juzgados de Primera Instancia, los Juzgados de Instrucción, los Juzgados Correccionales y de Menores, los Juzgados de Paz de Primera Categoría y los Juzgados de Paz de Segunda Categoría, tienen como mínimo las siguientes Secretarías","p":["El Superior Tribunal de Justicia, las Cámaras de Apelaciones, los Tribunales Penales, los Juzgados de Primera Instancia, los Juzgados de Instrucción, los Juzgados Correccionales y de Menores, los Juzgados de Paz de Primera Categoría y los Juzgados de Paz de Segunda Categoría, tienen como mínimo las siguientes Secretarías:","1) una (1) el Superior Tribunal de Justicia: Secretaría General Administrativa y de Superintendencia, sin facultades jurisdiccionales y con remuneración equivalente al Juez de Primera Instancia;","2) dos (2) el Superior Tribunal de Justicia: Administrativa, de Superintendencia y Judicial.","Además en la Procuración General funcionará una (1) Secretaría Letrada;","3) dos (2) cada sala de las Cámaras de Apelaciones en lo Penal y de Menores:","Administrativa, de Superintendencia y de Sala;","4) dos (2) cada sala de las Cámaras de Apelaciones en lo Civil, Comercial y Laboral, de Familia y Violencia Familiar y de los Tribunales Penales;","5) dos (2) cada Juzgado de Primera Instancia. Además en el Juzgado Civil, Comercial y de Ejecución Fiscal Tributaria N.º 4 de la Primera Circunscripción funciona una (1) Secretaría de Ejecución Fiscal Tributaria, en el Juzgado Civil, Comercial y de Ejecución Fiscal Tributaria N.º 7 de la Primera Circunscripción funciona una (1) Secretaría de Ejecución Fiscal Tributaria y en el Juzgado Civil, Comercial y de Ejecución Fiscal Tributaria N.º 8 de la Primera Circunscripción funciona una (1) Secretaría de Ejecución Fiscal Tributaria. En las mismas se tramitan todos los juicios en materia de Ejecuciones Fiscales Tributarias y de Ejecución Fiscal previstos en el Código Fiscal, las medidas cautelares que se solicitan anticipadamente en resguardo de los créditos del fisco, aquellos en lo que se discute la aplicación y constitucionalidad de normas tributarias excepto en los que resulta competente el Superior Tribunal de Justicia; y las incidencias derivadas de los procesos anteriores y cuyo conocimiento no está atribuido a otros magistrados;","6) dos (2) cada Juzgado de Paz de Primera Categoría;","7) una (1) cada Juzgado de Paz de Segunda Categoría.","La presente ley, la Ley de Presupuesto y otras leyes especiales, pueden aumentar el número de Secretarías y el Superior Tribunal de Justicia, mediante acordadas dictadas al efecto, reglamenta su funcionamiento sin más limitaciones que las que se justifican para el mejor servicio judicial y en los derechos, atribuciones, deberes y garantías establecidas para esta clase de funcionarios."],"s":"1) una (1) el Superior Tribunal de Justicia: Secretaría General Administrativa y de Superintendencia, sin facultades jurisdiccionales y con remuneración equivalente al Juez de Primera Instancia;"},{"n":123,"t":"Para ser Secretario del Superior Tribunal de Justicia, de…","p":["Para ser Secretario del Superior Tribunal de Justicia, de las Salas de las Cámaras de Apelaciones, de los Tribunales Penales, de los Juzgados de Primera Instancia, de los Juzgados de Instrucción, de los Juzgados en lo Correccional y de Menores y de los Juzgados de Paz de Primera y Segunda Categoría, se requiere además de las condiciones generales establecidas en el artículo 24, ser abogado o escribano con título expedido por universidad argentina o extranjera legalmente admitida por la Nación.","Para ser Secretario de los Juzgados de Paz de Tercera Categoría, se requiere mayoría de edad, ciudadanía argentina, poseer título secundario o haberse desempeñado por más de cinco (5) años como empleado administrativo en organismos del Poder Judicial."],"s":"Para ser Secretario del Superior Tribunal de Justicia, de las Salas de las Cámaras de Apelaciones, de los Tribunales Penales, de los Juzgados de Primera Instancia, de los Juzgados de Instrucción, de los Juzgados en lo…"},{"n":124,"t":"Los Secretarios de actuación tienen responsabilidad propia como actuarios…","p":["Los Secretarios de actuación tienen responsabilidad propia como actuarios de procedimiento, son custodios de los documentos del juicio y fedatarios. Para ello gozan de las atribuciones y están sujetos a los deberes que les asignan los códigos, leyes especiales y el Reglamento para el Poder Judicial."],"s":"Los Secretarios de actuación tienen responsabilidad propia como actuarios de procedimiento, son custodios de los documentos del juicio y fedatarios"},{"n":125,"t":"Los Secretarios están bajo la superintendencia simultánea o concurrente…","p":["Los Secretarios están bajo la superintendencia simultánea o concurrente de los jueces en cuyo juzgado actúan, de las respectivas Salas de las Cámaras de Apelaciones y Tribunales Penales; y del Superior Tribunal de Justicia.","Son jefes de sus oficinas y los empleados ejecutan sus órdenes en todo lo relativo al despacho.","En caso de licencia, impedimento, recusación, excusación o vacancia, son reemplazados en la forma que determina el Reglamento para el Poder Judicial."],"s":"Los Secretarios están bajo la superintendencia simultánea o concurrente de los jueces en cuyo juzgado actúan, de las respectivas Salas de las Cámaras de Apelaciones y Tribunales Penales; y del Superior Tribunal de Justicia."},{"n":126,"t":"Basta la sola firma del Secretario en las providencias de mero trámite y en las que se dispone","p":["Basta la sola firma del Secretario en las providencias de mero trámite y en las que se dispone:","1) agregar y dar vista de las partidas, pericias, liquidaciones, inventarios, exhortos, oficios, rendiciones de cuentas, tasaciones, división o partición de herencias y en general documentos o actuaciones semejantes;","2) disponer vista de las actuaciones judiciales a los ministerios públicos, representantes del fisco y demás funcionarios que intervienen como parte de aquellas;","3) devolver escritos presentados fuera de término. Dentro del plazo de tres (3) días las partes pueden pedir al Juez se deje sin efecto lo dispuesto por el Secretario, siempre que en los códigos y leyes especiales no se establezca un término más breve.","Igualmente llevan la sola firma del Secretario los certificados y testimonios y los oficios ordenados por el Juez, con excepción respecto a estos últimos de los que se dirigen a los representantes del Poder Ejecutivo Nacional o Provincial, ministros y magistrados judiciales y los que ordenan extracciones o transferencias de fondos."],"s":"1) agregar y dar vista de las partidas, pericias, liquidaciones, inventarios, exhortos, oficios, rendiciones de cuentas, tasaciones, división o partición de herencias y en general documentos o actuaciones semejantes;"},{"n":127,"t":"Son funciones de los Secretarios, sin perjuicio de las que determinan las leyes y códigos de procedimiento y el Reglamento para el Poder Judicial, las siguientes","p":["Son funciones de los Secretarios, sin perjuicio de las que determinan las leyes y códigos de procedimiento y el Reglamento para el Poder Judicial, las siguientes:","1) concurrir diariamente al despacho y presentar al Presidente del Superior Tribunal de Justicia, de las Cámaras de Apelaciones o de los Tribunales Penales; a los Jueces de Primera Instancia, de Instrucción o en lo Correccional y de Menores, según corresponda, los escritos y documentos que les son entregados por los interesados;","2) organizar y ordenar los expedientes a medida que se van formando y cuidar que se mantengan en buen estado debiendo numerar correlativamente sus fojas y las notificaciones, inutilizando con una línea transversal las fojas o partes de las mismas que no se ocupan con escritura u otras actuaciones. Cuando las fojas llegan a doscientas (200), deben formar otro cuerpo y así sucesivamente;","3) llevar el contralor del movimiento de fondos de los expedientes;","4) controlar el cumplimiento de las leyes impositivas en cuanto se refiera a impuestos y tasas que gravan a contratos que se agregan a autos o actuaciones realizadas en los expedientes, los que concluidos y previa reposición de tasas judiciales entrega al Archivo General de los Tribunales;","5) custodiar los documentos y expedientes a su cargo, protocolizar las copias de las resoluciones judiciales y llevar los libros que establecen las leyes y reglamentos;","6) poner cargo a todos los escritos con indicación del día y hora de su recepción, dando recibo de los mismos o de los documentos que se les entrega por los interesados y expedir los testimonios o certificados, previa autorización judicial siempre que estos en dichos casos lo soliciten;","7) vigilar en el carácter de jefe directo del personal, el cumplimiento de sus deberes y adoptar las medidas necesarias al buen desempeño de las funciones que corresponden a los mismos;","8) dar curso inmediato a los escritos y expedientes bajo pena de satisfacer los perjuicios que causa la demora, salvo impedimento justificado;","9) dejar en los expedientes constancia de los desgloses que se hacen y copias autenticadas con su firma en los poderes y demás documentos que se consideran necesarios;","10) llevar un libro de constancia de los expedientes que se entregan en los casos autorizados por la ley, no pudiendo dispensar de esa formalidad a los jueces y funcionarios superiores, cualesquiera sea su jerarquía;","11) cuidar que la entrega de expedientes o suministros de informes no se efectúa a otras personas que las partes, abogados, procuradores, funcionarios y profesionales autorizados o a aquellos a quienes se lo permiten las leyes de procedimiento y acordadas reglamentarias;","12) no aceptar de los profesionales escritos o informes que se presentan sin indicación del mandato invocado; indicación de los mandantes por quienes se actúa; sin el número de la matrícula y domicilio legal; sin aclaratorias de las firmas y el sello profesional, o que contienen claros;","13) poner a despacho los escritos y documentos presentados, debiendo proyectar o dictar en su caso las providencias de trámite;","14) exigir recibo de todo expediente que se entrega en los casos autorizados por la ley y el reglamento;","15) darles debido cumplimiento, en la parte que les concierne a las resoluciones de los magistrados y a las diligencias y demás actuaciones judiciales;","16) asistir a los acuerdos y a las audiencias y levantar las actas cuando así lo exigen las leyes procesales;","17) desempeñar las funciones auxiliares compatibles con sus cargos que los magistrados les confían;","18) desempeñar las demás funciones que les son asignadas por las leyes generales y disposiciones reglamentarias."],"s":"1) concurrir diariamente al despacho y presentar al Presidente del Superior Tribunal de Justicia, de las Cámaras de Apelaciones o de los Tribunales Penales; a los Jueces de Primera Instancia, de Instrucción o en lo…"},{"n":128,"t":"El Secretario General Administrativo y de Superintendencia del Superior Tribunal de Justicia, le corresponde","p":["El Secretario General Administrativo y de Superintendencia del Superior Tribunal de Justicia, le corresponde:","1) ejercer la Superintendencia sobre las Secretarías Administrativas Judiciales y de Superintendencia del Superior Tribunal de Justicia;","2) intervenir en los acuerdos que realiza el Superior Tribunal de Justicia;","3) intervenir en los juramentos que deben recibirse ante el Superior Tribunal de Justicia o ante el Presidente del Cuerpo;","4) intervenir en los procedimientos de nombramientos y cesaciones de magistrados y funcionarios y empleados del Poder Judicial;","5) ejercer lo pertinente a su cargo en lo relativo al poder de policía del Superior Tribunal de Justicia;","6) llevar los libros de acuerdos, nombramientos, juramentos, designaciones, legajos en general, sanciones y archivo de la Administración Judicial que no pertenece al Archivo General.","Los Secretarios Administrativos, de Superintendencia y Judicial del Superior Tribunal de Justicia, sin perjuicio de lo dispuesto en los artículos anteriores y en cuanto a él es aplicable, le corresponde:","1) intervenir en todo lo que ataña a la función de Superintendencia sobre la Administración de Justicia;","2) organizar y dirigir las estadísticas del movimiento judicial;","3) supervisar el contralor del personal;","4) llevar los legajos del personal y los libros de registro de sanciones disciplinarias impuestas a los magistrados, funcionarios y empleados del Poder Judicial y a los profesionales auxiliares de la Justicia;","5) las autenticaciones y legalizaciones;","6) las matrículas e inscripciones de profesionales, a los que las leyes no fijan otro procedimiento de inscripción o matriculación;","7) llevar el contralor del archivo y devolución de expedientes, de las licencias en que corresponda actuar el Superior Tribunal de Justicia y los libros de fianza;","8) llevar el libro de actas del Superior Tribunal de Justicia y autorizar todos aquellos actos en que el Cuerpo actúa dentro de la esfera administrativa o de Superintendencia;","9) servir de órgano de enlace entre el Superior Tribunal de Justicia y la Dirección de Administración del Poder Judicial;","10) intervenir en general en todos los asuntos administrativos o de superintendencia o jurisdiccionales que competen al Superior Tribunal de Justicia."],"s":"1) ejercer la Superintendencia sobre las Secretarías Administrativas Judiciales y de Superintendencia del Superior Tribunal de Justicia;"},{"n":129,"t":"Los Secretarios de los Juzgados de Paz cualquiera sea…","p":["Los Secretarios de los Juzgados de Paz cualquiera sea su categoría, tienen los deberes, obligaciones y atribuciones que se les confiere en los artículos anteriores, en tanto sean compatibles con la competencia de la justicia de menor cuantía y en cuanto se ajustan a las normas procesales y reglamentarias especiales para los juicios atribuidos a esta y a las que establece el Reglamento para el Poder Judicial."],"s":"Los Secretarios de los Juzgados de Paz cualquiera sea su categoría, tienen los deberes, obligaciones y atribuciones que se les confiere en los artículos anteriores, en tanto sean compatibles con la competencia de la justicia…"},{"n":130,"t":"Si para proveer una secretaría de los juzgados letrados…","p":["Si para proveer una secretaría de los juzgados letrados no es posible la designación de una persona que tiene algunos de los títulos determinados en el artículo 123, el Juez respectivo puede designar transitoriamente, mientras dura la ausencia o impedimento de los titulares, el empleado de mayor jerarquía de cualquiera de las secretarías del juzgado a su cargo. Igual procedimiento se sigue en aquellos casos en que la ausencia o el impedimento es transitorio o circunstancial y no existe en la circunscripción judicial otro Secretario. En ambas situaciones los suplentes deben prestar juramento legal pertinente."],"s":"Si para proveer una secretaría de los juzgados letrados no es posible la designación de una persona que tiene algunos de los títulos determinados en el artículo 123, el Juez respectivo puede designar transitoriamente, mientras…"},{"n":131,"t":"Los Secretarios no pueden actuar en asuntos o causas…","p":["Los Secretarios no pueden actuar en asuntos o causas propias, o en aquellas en que tienen un interés directo o indirecto, o los tienen sus parientes hasta el cuarto grado de consanguinidad o segundo de afinidad."],"s":"Los Secretarios no pueden actuar en asuntos o causas propias, o en aquellas en que tienen un interés directo o indirecto, o los tienen sus parientes hasta el cuarto grado de consanguinidad o segundo de afinidad."},{"n":132,"t":"En cada circunscripción judicial hay uno o más Oficiales…","p":["En cada circunscripción judicial hay uno o más Oficiales de Justicia que integran con los Auxiliares Notificadores las Oficinas de Mandamientos y Notificaciones, las que funcionan con la asistencia de un jefe y los Oficiales de Justicia y Auxiliares Notificadores que determina el Reglamento del Poder Judicial o las acordadas que al efecto dicta el Superior Tribunal de Justicia, dentro de su respectivo presupuesto."],"s":"En cada circunscripción judicial hay uno o más Oficiales de Justicia que integran con los Auxiliares Notificadores las Oficinas de Mandamientos y Notificaciones, las que funcionan con la asistencia de un jefe y los Oficiales…"},{"n":133,"t":"Para ser Jefe de las Oficinas de Mandamientos y…","p":["Para ser Jefe de las Oficinas de Mandamientos y Notificaciones y oficiales de justicia, se requiere además de las condiciones generales previstas en el artículo 24, haber aprobado el plan de segunda enseñanza y tener una antigüedad de por lo menos cinco (5) años en organismos del Poder Judicial, o en su defecto haber satisfecho el ciclo completo de instrucción primaria y tener una antigüedad mínima de diez (10) años en organismos del Poder Judicial."],"s":"Para ser Jefe de las Oficinas de Mandamientos y Notificaciones y oficiales de justicia, se requiere además de las condiciones generales previstas en el artículo 24, haber aprobado el plan de segunda enseñanza y tener una…"},{"n":134,"t":"Son deberes y atribuciones de las Oficinas de Mandamientos y Notificaciones, que deben efectuarse personalmente por su jefe o con intervención de los señores Oficiales de Justicia o Auxiliares Notificadores según sea el caso","p":["Son deberes y atribuciones de las Oficinas de Mandamientos y Notificaciones, que deben efectuarse personalmente por su jefe o con intervención de los señores Oficiales de Justicia o Auxiliares Notificadores según sea el caso:","1) hacer efectivo los apremios;","2) realizar las diligencias de posesión;","3) ejecutar los mandamientos de intimación de pago, embargo o secuestro de bienes;","4) practicar las diligencias de notificación o citación que se disponen pudiendo hacer uso de la fuerza pública y realizar allanamientos de domicilio cuando está expresamente autorizado para ello;","5) cumplir al día las diligencias que se les encomiendan, respondiendo personalmente de los daños que causa por incumplimiento tardío de su cometido salvo causa justificada;","6) lo demás que establece el Reglamento para el Poder Judicial o se fija en acordadas reglamentarias que dicta el Superior Tribunal de Justicia."],"s":"1) hacer efectivo los apremios;"},{"n":135,"t":"La concurrencia de los jefes de las Oficinas de…","p":["La concurrencia de los jefes de las Oficinas de Mandamientos y Notificaciones, de los Oficiales de Justicia y de los Auxiliares Notificadores a las oficinas judiciales, como el régimen de cumplimiento del trabajo, exceso de éste, impedimento o licencias se ajusta a lo que dispone el Reglamento para el Poder Judicial y las acordadas que dicta el Superior Tribunal de Justicia."],"s":"La concurrencia de los jefes de las Oficinas de Mandamientos y Notificaciones, de los Oficiales de Justicia y de los Auxiliares Notificadores a las oficinas judiciales, como el régimen de cumplimiento del trabajo, exceso de…"},{"n":136,"t":"La Secretaría del Superior Tribunal de Justicia, de las…","p":["La Secretaría del Superior Tribunal de Justicia, de las Salas de las Cámaras de Apelaciones, de los Tribunales Penales y de los juzgados de cualquier grado cuentan con un Oficial Superior y con el personal que le asigna la Ley de Presupuesto.","Las correspondientes a los Juzgados de Paz de cualquier categoría, se proveen únicamente cuando el Superior Tribunal de Justicia así lo establece en procura de un mejor servicio judicial."],"s":"La Secretaría del Superior Tribunal de Justicia, de las Salas de las Cámaras de Apelaciones, de los Tribunales Penales y de los juzgados de cualquier grado cuentan con un Oficial Superior y con el personal que le asigna la Ley…"},{"n":137,"t":"Para desempeñar el cargo de Oficial Superior se requiere…","p":["Para desempeñar el cargo de Oficial Superior se requiere además de las condiciones establecidas por el artículo 24, haber aprobado el plan de enseñanza secundaria y tener una antigüedad de cinco (5) años en la Administración de Justicia o haber aprobado el ciclo completo de instrucción primaria y tener una antigüedad mínima de diez (10) años en organismos del Poder Judicial. Los Oficiales Superiores de los Juzgados de Paz, cualquiera sea su categoría deben satisfacer las exigencias que establece el Reglamento para el Poder Judicial.","Para optar a los demás empleos de los tribunales y juzgados letrados, de las oficinas del Ministerio Público y de los demás organismos del Poder Judicial, se requiere tener dieciocho (18) años de edad y los requisitos de nacionalidad e instrucción establecidos precedentemente. Los de los Juzgados de Paz deben acreditar idénticas condiciones con excepción de que con respecto a la instrucción basta el haber aprobado el plan de enseñanza primaria.","El personal de maestranza debe reunir iguales condiciones que estos últimos.","El cumplimiento de los años de antigüedad en la Administración de Justicia en la forma indicada precedentemente, da derecho a los empleados administrativos que llenan las demás condiciones exigidas por esta ley o por el Reglamento para el Poder Judicial, a ser promovidos por la vía pertinente a cargo de mayor jerarquía. Igual derecho se acuerda a lo de maestranza, dentro de las escalas de ascenso que el presupuesto fija al efecto. Cuando estos pasan a la categoría de empleados administrativos, deben acreditar las condiciones propias para tales empleos y nueva designación.","El Reglamento para el Poder Judicial establece para cada organismo judicial, quienes son los empleados superiores que revisten como oficiales superiores, de acuerdo a la Ley de Presupuesto vigente."],"s":"Para desempeñar el cargo de Oficial Superior se requiere además de las condiciones establecidas por el artículo 24, haber aprobado el plan de enseñanza secundaria y tener una antigüedad de cinco (5) años en la Administración…"},{"n":138,"t":"El Oficial Superior es el jefe inmediato de la…","p":["El Oficial Superior es el jefe inmediato de la Mesa de Entradas y Salidas y desempeña las demás funciones que le asigna el Reglamento para el Poder Judicial y las leyes de procedimiento."],"s":"El Oficial Superior es el jefe inmediato de la Mesa de Entradas y Salidas y desempeña las demás funciones que le asigna el Reglamento para el Poder Judicial y las leyes de procedimiento."},{"n":139,"t":"La gestión administrativa contable es cumplida por la Dirección…","p":["La gestión administrativa contable es cumplida por la Dirección de Administración del Poder Judicial, que actúa bajo la jefatura de un Director de Administración y funciona con el personal que determina la Ley de Presupuesto.","Para el ejercicio de sus funciones se sujeta a las disposiciones pertinentes del Reglamento para el Poder Judicial y subsidiariamente, por las comprendidas en las leyes contables de la Provincia siendo la Secretaría Administrativa y de Superintendencia el órgano de enlace entre la Dirección de Administración y el Superior Tribunal de Justicia."],"s":"La gestión administrativa contable es cumplida por la Dirección de Administración del Poder Judicial, que actúa bajo la jefatura de un Director de Administración y funciona con el personal que determina la Ley de Presupuesto."},{"n":140,"t":"Para ser designado Director o Subdirector es necesario reunir…","p":["Para ser designado Director o Subdirector es necesario reunir las condiciones que se señalan en el artículo 24 y poseer para el cargo de Director, título de contador público nacional, expedido por universidad argentina o extranjera legalmente admitida por la Nación y para el Subdirector, el de contador o, siendo agente del Poder Judicial, poseer certificado de enseñanza secundaria aprobado y haberse desempeñado por un lapso no menor de cinco (5) años en la Administración de Justicia y que a juicio del Superior Tribunal demuestra idoneidad para el cargo."],"s":"Para ser designado Director o Subdirector es necesario reunir las condiciones que se señalan en el artículo 24 y poseer para el cargo de Director, título de contador público nacional, expedido por universidad argentina o…"},{"n":141,"t":"Además de las situaciones previstas en el artículo 27,…","p":["Además de las situaciones previstas en el artículo 27, pueden los tribunales y jueces imponer sanciones disciplinarias a los abogados, escribanos, procuradores, peritos de toda clase, litigantes y particulares en general, por faltas cometidas contra su dignidad o decoro en las audiencias o en presentaciones y escritos de cualquier índole, o contra su autoridad obstruyendo el curso de la justicia.","Además de las sanciones previstas en el artículo citado pueden imponer arresto de hasta treinta (30) días, que deben ser cumplidos en las dependencias de los tribunales o en los domicilios respectivos."],"s":"Además de las situaciones previstas en el artículo 27, pueden los tribunales y jueces imponer sanciones disciplinarias a los abogados, escribanos, procuradores, peritos de toda clase, litigantes y particulares en general, por…"},{"n":142,"t":"Las sanciones aplicadas por el Superior Tribunal de Justicia…","p":["Las sanciones aplicadas por el Superior Tribunal de Justicia sólo son susceptibles del recurso de revocatoria ante el mismo Tribunal. Las que aplican las Cámaras de Apelaciones, o sus Salas, los Tribunales Penales, los Jueces de Primera Instancia, los Jueces de Instrucción, los Jueces en lo Correccional y de Menores o de Paz y los integrantes del Ministerio Público, que no son apercibimiento, pueden ser susceptibles del recurso de revocatoria con apelación en subsidio ante el Superior Tribunal de Justicia, dentro del tercer día. Salvo estos recursos, no se acuerda ningún otro, ni puede intentarse contra esas sanciones la acción contenciosa administrativa."],"s":"Las sanciones aplicadas por el Superior Tribunal de Justicia sólo son susceptibles del recurso de revocatoria ante el mismo Tribunal"},{"n":143,"t":"Sólo tienen validez legal las providencias, autos, acuerdos o…","p":["Sólo tienen validez legal las providencias, autos, acuerdos o fallos dictados en días y horas hábiles."],"s":"Sólo tienen validez legal las providencias, autos, acuerdos o fallos dictados en días y horas hábiles."},{"n":144,"t":"Son días hábiles a los efectos del artículo anterior,…","p":["Son días hábiles a los efectos del artículo anterior, todos los del año, excepto los sábados y domingos y los que determina la legislación nacional, los de las ferias judiciales de cada año, y los demás que expresamente establece la ley.","Cuando el Poder Ejecutivo declarase feriado un día por decreto especial, los tribunales lo reputan tal a los efectos que haya lugar.","Son horas hábiles las comprendidas dentro del horario establecido por el Superior Tribunal de Justicia para el funcionamiento de los tribunales; pero con respecto de la diligencia que los jueces, funcionarios o empleados deben practicar fuera de la oficina son horas hábiles las que median entre las siete (7) y las veinte (20).","Para la celebración de audiencias de prueba, las Cámaras de Apelaciones pueden declarar horas hábiles, con respecto a juzgados bajo su dependencia y cuando las circunstancias lo exigen."],"s":"Son días hábiles a los efectos del artículo anterior, todos los del año, excepto los sábados y domingos y los que determina la legislación nacional, los de las ferias judiciales de cada año, y los demás que expresamente…"},{"n":145,"t":"Los jueces habilitarán días y horas inhábiles para el trámite de los siguientes asuntos","p":["Los jueces habilitarán días y horas inhábiles para el trámite de los siguientes asuntos:","1) las peticiones de alimentos provisorios y litis expensas;","2) las medidas cautelares y precautorias y sus levantamientos;","3) las quiebras y concursos preventivos y las medidas consiguientes a los mismos;","4) los recursos de amparo referentes a los derechos y garantías individuales;","5) los pedidos de separación personal de los cónyuges, exclusión del domicilio conyugal y la tenencia provisoria de hijos;","6) todo lo demás cuando el interesado, a juicio del Juez, se encuentra expuesto a la pérdida de un derecho o a sufrir un grave perjuicio."],"s":"1) las peticiones de alimentos provisorios y litis expensas;"},{"n":146,"t":"El Superior Tribunal de Justicia establece el horario para…","p":["El Superior Tribunal de Justicia establece el horario para el funcionamiento de los organismos de la Administración de Justicia, que no puede ser menor que el de la administración pública provincial, fija asimismo el horario de atención al público."],"s":"El Superior Tribunal de Justicia establece el horario para el funcionamiento de los organismos de la Administración de Justicia, que no puede ser menor que el de la administración pública provincial, fija asimismo el horario…"},{"n":147,"t":"En las causas criminales, durante la etapa de instrucción,…","p":["En las causas criminales, durante la etapa de instrucción, son hábiles todos los días y horas del año, sin necesidad de habilitación especial."],"s":"En las causas criminales, durante la etapa de instrucción, son hábiles todos los días y horas del año, sin necesidad de habilitación especial."},{"n":148,"t":"Ningún término procesal corre durante los días inhábiles.","p":["Ningún término procesal corre durante los días inhábiles."],"s":"Ningún término procesal corre durante los días inhábiles."},{"n":149,"t":"Las ferias judiciales ordinarias o extraordinarias son determinadas por…","p":["Las ferias judiciales ordinarias o extraordinarias son determinadas por el Superior Tribunal de Justicia de acuerdo a las necesidades del año judicial.","En los períodos indicados los asuntos a que hace referencia el artículo 145 son atendidos por los magistrados, funcionarios y empleados que el Superior Tribunal de Justicia designa con quince (15) días de anticipación a la iniciación de la feria."],"s":"Las ferias judiciales ordinarias o extraordinarias son determinadas por el Superior Tribunal de Justicia de acuerdo a las necesidades del año judicial."},{"n":150,"t":"Habilitado el feriado por el ministro o vocal de…","p":["Habilitado el feriado por el ministro o vocal de feria, cuando el asunto ante el Superior Tribunal de Justicia o de las Cámaras de Apelaciones llega a estado de resolución, debe convocar a los demás miembros que son necesarios para la integración del Tribunal de feria."],"s":"Habilitado el feriado por el ministro o vocal de feria, cuando el asunto ante el Superior Tribunal de Justicia o de las Cámaras de Apelaciones llega a estado de resolución, debe convocar a los demás miembros que son necesarios…"},{"n":151,"t":"Los jueces que durante el receso judicial salen del…","p":["Los jueces que durante el receso judicial salen del lugar de asiento del juzgado o tribunal, deben comunicarlo al Superior Tribunal de Justicia."],"s":"Los jueces que durante el receso judicial salen del lugar de asiento del juzgado o tribunal, deben comunicarlo al Superior Tribunal de Justicia."},{"n":152,"t":"Los magistrados, funcionarios y empleados comprendidos en el artículo…","p":["Los magistrados, funcionarios y empleados comprendidos en el artículo 149 gozan de licencia anual compensatoria que es otorgada por el Superior Tribunal de Justicia entre los meses de febrero y octubre inclusive."],"s":"Los magistrados, funcionarios y empleados comprendidos en el artículo 149 gozan de licencia anual compensatoria que es otorgada por el Superior Tribunal de Justicia entre los meses de febrero y octubre inclusive."},{"n":153,"t":"La actividad judicial de los abogados y procuradores se…","p":["La actividad judicial de los abogados y procuradores se rige por las disposiciones de las respectivas leyes reglamentarias de esas profesiones, sin perjuicio de lo que establece la presente ley."],"s":"La actividad judicial de los abogados y procuradores se rige por las disposiciones de las respectivas leyes reglamentarias de esas profesiones, sin perjuicio de lo que establece la presente ley."},{"n":154,"t":"Los abogados de la matrícula están obligados a aceptar como carga pública","p":["Los abogados de la matrícula están obligados a aceptar como carga pública:","1) las designaciones para integrar como conjueces del Superior Tribunal de Justicia, de las Cámaras de Apelaciones y de los Tribunales Penales;","2) las designaciones para subrogar a los Jueces de Primera Instancia y miembros del Ministerio Público;","3) los nombramientos que efectúan los tribunales y juzgados para la defensa de los procesados pobres."],"s":"1) las designaciones para integrar como conjueces del Superior Tribunal de Justicia, de las Cámaras de Apelaciones y de los Tribunales Penales;"},{"n":155,"t":"Las designaciones y nombramientos a que se refiere el…","p":["Las designaciones y nombramientos a que se refiere el artículo anterior son irrenunciables, salvo causa debidamente justificada. El incumplimiento de las obligaciones impuestas para el cargo, les hace incurrir en multa de hasta un porcentaje igual al veinticinco por ciento (25%) de la remuneración que percibe un Ministro del Superior Tribunal de Justicia y, en caso de reincidencia, se hacen pasibles de suspensión en el ejercicio profesional. El importe de las multas se destina a los fines previstos en la Ley XXII – N.º 37."],"s":"Las designaciones y nombramientos a que se refiere el artículo anterior son irrenunciables, salvo causa debidamente justificada"},{"n":156,"t":"El ejercicio de las profesiones de escribano, contador público,…","p":["El ejercicio de las profesiones de escribano, contador público, martillero, tasadores, traductores, intérpretes, calígrafos y peritos en general, en cuanto los mismos actúan como auxiliares de la justicia, se sujetan a las disposiciones de las leyes en vigencia y las del Reglamento para el Poder Judicial.","En todos los casos en que las profesiones mencionadas están reglamentadas y sujetas a la justificación del respectivo título habilitante, se exige que estos estén expedidos por universidad argentina o extranjera debidamente admitidos por la Nación."],"s":"El ejercicio de las profesiones de escribano, contador público, martillero, tasadores, traductores, intérpretes, calígrafos y peritos en general, en cuanto los mismos actúan como auxiliares de la justicia, se sujetan a las…"},{"n":157,"t":"Los profesionales que actúan como auxiliares de la justicia…","p":["Los profesionales que actúan como auxiliares de la justicia deben inscribirse conforme lo establecido en las leyes especiales que las rigen o conforme lo dispone el Reglamento para el Poder Judicial, en caso de no existir aquellas."],"s":"Los profesionales que actúan como auxiliares de la justicia deben inscribirse conforme lo establecido en las leyes especiales que las rigen o conforme lo dispone el Reglamento para el Poder Judicial, en caso de no existir…"},{"n":158,"t":"Los nombramientos de peritos para el asesoramiento judicial, deben…","p":["Los nombramientos de peritos para el asesoramiento judicial, deben recaer en personas que poseen título habilitante conforme lo expresado en el párrafo segundo del artículo 156. Sólo en el caso de no haber personas diplomadas, los jueces pueden nombrar personas idóneas en la materia."],"s":"Los nombramientos de peritos para el asesoramiento judicial, deben recaer en personas que poseen título habilitante conforme lo expresado en el párrafo segundo del artículo 156"},{"n":159,"t":"Los profesionales que pretenden recibir nombramientos de oficio a…","p":["Los profesionales que pretenden recibir nombramientos de oficio a efectuarse por los tribunales en el año siguiente lo hacen saber por nota en sellado de ley que presentan en el mes de octubre de cada año.","Solamente pueden solicitar su inscripción en el Juzgado de Primera Instancia en turno de la circunscripción judicial del domicilio real del interesado.","Las notas de inscripción deben ser remitidas al Superior Tribunal de Justicia antes del 1 de diciembre de cada año."],"s":"Los profesionales que pretenden recibir nombramientos de oficio a efectuarse por los tribunales en el año siguiente lo hacen saber por nota en sellado de ley que presentan en el mes de octubre de cada año."},{"n":160,"t":"Con los antecedentes indicados, el Superior Tribunal de Justicia…","p":["Con los antecedentes indicados, el Superior Tribunal de Justicia confecciona antes del 15 de diciembre de cada año, para las distintas circunscripciones judiciales, las listas para nombramientos de oficio.","Las designaciones se efectúan por sorteo eliminatorio y público, de la lista que cada año remite el Superior Tribunal de Justicia.","El nombre del desinsaculado se elimina de la lista cuando debe producirse una nueva designación hasta agotar aquella, en cuyo caso se integra con su totalidad para seguir el mismo procedimiento con las nuevas designaciones.","La no aceptación del cargo o renuncia sin causa justificada, acarrea igualmente la eliminación de la lista a los fines de las desinsaculaciones hasta agotar esta."],"s":"Con los antecedentes indicados, el Superior Tribunal de Justicia confecciona antes del 15 de diciembre de cada año, para las distintas circunscripciones judiciales, las listas para nombramientos de oficio."},{"n":161,"t":"Cuando se trata de profesionales especializados en una rama…","p":["Cuando se trata de profesionales especializados en una rama de su propia profesión, la inscripción es acordada por el Presidente del Superior Tribunal de Justicia a los fines de la formación de las listas, previa comprobación de la especialidad por la presentación de títulos y antecedentes habilitantes."],"s":"Cuando se trata de profesionales especializados en una rama de su propia profesión, la inscripción es acordada por el Presidente del Superior Tribunal de Justicia a los fines de la formación de las listas, previa comprobación…"},{"n":162,"t":"El Archivo General de los Tribunales está formado por…","p":["El Archivo General de los Tribunales está formado por una Dirección con asiento en la ciudad Capital de la Provincia y Secciones locales en cada una de las circunscripciones judiciales."],"s":"El Archivo General de los Tribunales está formado por una Dirección con asiento en la ciudad Capital de la Provincia y Secciones locales en cada una de las circunscripciones judiciales."},{"n":163,"t":"El Superior Tribunal de Justicia ejerce Superintendencia sobre el…","p":["El Superior Tribunal de Justicia ejerce Superintendencia sobre el Archivo General del Poder Judicial, directamente sobre la Dirección y esta sobre las Secciones de cada circunscripción judicial."],"s":"El Superior Tribunal de Justicia ejerce Superintendencia sobre el Archivo General del Poder Judicial, directamente sobre la Dirección y esta sobre las Secciones de cada circunscripción judicial."},{"n":164,"t":"Para desempeñar las funciones de Director del Archivo General…","p":["Para desempeñar las funciones de Director del Archivo General de los Tribunales se requiere ser argentino, mayor de edad, abogado, escribano o procurador con título expedido por autoridad competente. La reglamentación determina las condiciones para desempeñar los cargos de Jefes de Archivos Seccionales."],"s":"Para desempeñar las funciones de Director del Archivo General de los Tribunales se requiere ser argentino, mayor de edad, abogado, escribano o procurador con título expedido por autoridad competente"},{"n":165,"t":"En cada una de las circunscripciones judiciales existen locales…","p":["En cada una de las circunscripciones judiciales existen locales adecuados y en lo posible dentro del recinto del lugar en que funcionan los tribunales, destinados a la guarda de todo documento, protocolos, y expedientes que por imperio de la ley deben quedar en el Archivo General del Poder Judicial."],"s":"En cada una de las circunscripciones judiciales existen locales adecuados y en lo posible dentro del recinto del lugar en que funcionan los tribunales, destinados a la guarda de todo documento, protocolos, y expedientes que…"},{"n":166,"t":"Los Archivos Seccionales del Archivo General del Poder Judicial se forman","p":["Los Archivos Seccionales del Archivo General del Poder Judicial se forman:","1) con los expedientes tramitados en los juzgados y tribunales de la respectiva circunscripción que se encuentran en estado de archivo. Se entiende por estado de archivo aquél en que la causa, actuación o proceso quedan definitivamente concluidos conforme a las prescripciones que en la materia establecen los códigos y leyes procesales o se paralizase el expediente por el término de dos (2) años;","2) con los libros y protocolos de sentencias de los juzgados y tribunales, con excepción de los últimos diez (10) años;","3) dos (2) ejemplares del Boletín Oficial y Judicial de la Nación y de la Provincia, por publicación;","4) los demás documentos y constancias emanadas del Poder Judicial o producto de la actividad tribunalicia cuya guarda considera conveniente el Superior Tribunal de Justicia."],"s":"1) con los expedientes tramitados en los juzgados y tribunales de la respectiva circunscripción que se encuentran en estado de archivo. Se entiende por estado de archivo aquél en que la causa, actuación o proceso quedan…"},{"n":167,"t":"La reglamentación general determina la forma, tiempo y condiciones…","p":["La reglamentación general determina la forma, tiempo y condiciones de entrega y recepción del material a archivarse, así como también de la extracción de piezas archivadas, la que sólo puede ser hecha por orden judicial."],"s":"La reglamentación general determina la forma, tiempo y condiciones de entrega y recepción del material a archivarse, así como también de la extracción de piezas archivadas, la que sólo puede ser hecha por orden judicial."},{"n":168,"t":"El Superior Tribunal de Justicia dicta el Reglamento Orgánico…","p":["El Superior Tribunal de Justicia dicta el Reglamento Orgánico del Archivo General de los Tribunales, como asimismo las normas para la destrucción de las causas o expedientes tramitados ante el Poder Judicial, atendiendo a las prescripciones establecidas en el presente capítulo."],"s":"El Superior Tribunal de Justicia dicta el Reglamento Orgánico del Archivo General de los Tribunales, como asimismo las normas para la destrucción de las causas o expedientes tramitados ante el Poder Judicial, atendiendo a las…"},{"n":169,"t":"Deben ser excluidos en forma absoluta para la destrucción…","p":["Deben ser excluidos en forma absoluta para la destrucción de expedientes, los juicios sucesorios, quiebras, concursos preventivos, los que resuelvan cuestiones de familia o derechos reales y en los que hubieren afectados bienes inmuebles."],"s":"Deben ser excluidos en forma absoluta para la destrucción de expedientes, los juicios sucesorios, quiebras, concursos preventivos, los que resuelvan cuestiones de familia o derechos reales y en los que hubieren afectados…"},{"n":170,"t":"La reglamentación sobre la destrucción de expedientes atiende expresamente","p":["La reglamentación sobre la destrucción de expedientes atiende expresamente:","1) a lo dispuesto en los códigos de fondo y de procedimiento sobre prescripción y perención;","2) a la publicidad por el Boletín Oficial;","3) al derecho de las partes a oponer reservas;","4) a la capacidad de los locales seccionales;","5) al interés jurídico, social, histórico y económico, del material correspondiente."],"s":"1) a lo dispuesto en los códigos de fondo y de procedimiento sobre prescripción y perención;"},{"n":171,"t":"Los expedientes que se remiten se acompañan de una…","p":["Los expedientes que se remiten se acompañan de una nómina firmada por el Secretario, que consigna el número, fuero y circunscripción a que pertenece el juzgado y secretaría en que se tramitan, nombre del Juez y del Secretario, número de expediente y fojas de que consta. Sólo debe consignarse en dicha nómina el objeto o naturaleza cuando se trata de expedientes excluidos de la incineración o destrucción en virtud de reglamentación del Superior Tribunal."],"s":"Los expedientes que se remiten se acompañan de una nómina firmada por el Secretario, que consigna el número, fuero y circunscripción a que pertenece el juzgado y secretaría en que se tramitan, nombre del Juez y del Secretario,…"},{"n":172,"t":"Los expedientes, protocolos y demás documentos que deben archivarse,…","p":["Los expedientes, protocolos y demás documentos que deben archivarse, son recibidos por el encargado de Mesa de Entrada y Salida, quien los examina haciendo constar el número de fojas y las circunstancias especiales que nota. Si encuentra alguna irregularidad o infracción a las leyes fiscales, debe comunicarla al Jefe del Archivo a fin de adoptar las medidas correspondientes."],"s":"Los expedientes, protocolos y demás documentos que deben archivarse, son recibidos por el encargado de Mesa de Entrada y Salida, quien los examina haciendo constar el número de fojas y las circunstancias especiales que nota"},{"n":173,"t":"El Archivo es organizado en secciones, colocándose separadamente los…","p":["El Archivo es organizado en secciones, colocándose separadamente los documentos que se especifican en el artículo 166 y se forman índices especiales para cada sección."],"s":"El Archivo es organizado en secciones, colocándose separadamente los documentos que se especifican en el artículo 166 y se forman índices especiales para cada sección."},{"n":174,"t":"En los índices de los expedientes se determina el…","p":["En los índices de los expedientes se determina el juzgado, secretaría y circunscripción judicial al que pertenece, como asimismo los nombres del Juez, Secretario y de las partes y el objeto del juicio.","Se forma también un índice general.","En las fichas se hacen iguales consignaciones, sin perjuicio de las demás anotaciones que establece la reglamentación."],"s":"En los índices de los expedientes se determina el juzgado, secretaría y circunscripción judicial al que pertenece, como asimismo los nombres del Juez, Secretario y de las partes y el objeto del juicio."},{"n":175,"t":"Los expedientes sólo pueden salir del Archivo, en virtud…","p":["Los expedientes sólo pueden salir del Archivo, en virtud de una orden escrita emanada de Juez competente y por un término que no excede de sesenta (60) días, vencido el cual el Jefe del Archivo solicita la devolución que no puede ser demorada sino por causa justificada, bajo pena de una multa de hasta veinticinco por ciento (25%) de la remuneración de ministro del Superior Tribunal de Justicia para el que ocasiona el retardo, aplicable por el Presidente del Superior Tribunal de Justicia con apelación ante el Cuerpo.","El importe de estas multas se destina a acrecentar el acervo bibliográfico de la Biblioteca del Poder Judicial."],"s":"Los expedientes sólo pueden salir del Archivo, en virtud de una orden escrita emanada de Juez competente y por un término que no excede de sesenta (60) días, vencido el cual el Jefe del Archivo solicita la devolución que no…"},{"n":176,"t":"Los protocolos no pueden ser extraídos del Archivo sino…","p":["Los protocolos no pueden ser extraídos del Archivo sino en caso de fuerza mayor y su extracción es autorizada y ordenada por escrito por el Jefe del Archivo."],"s":"Los protocolos no pueden ser extraídos del Archivo sino en caso de fuerza mayor y su extracción es autorizada y ordenada por escrito por el Jefe del Archivo."},{"n":177,"t":"Sin perjuicio de lo dispuesto en los artículos anteriores,…","p":["Sin perjuicio de lo dispuesto en los artículos anteriores, las partes, los profesionales y otras personas que justifican interés legítimo pueden interiorizarse de los expedientes existentes en el Archivo, de acuerdo a la reglamentación que al respecto dicta el Superior Tribunal de Justicia."],"s":"Sin perjuicio de lo dispuesto en los artículos anteriores, las partes, los profesionales y otras personas que justifican interés legítimo pueden interiorizarse de los expedientes existentes en el Archivo, de acuerdo a la…"},{"n":178,"t":"El Director del Archivo General de los Tribunales, o…","p":["El Director del Archivo General de los Tribunales, o su reemplazante legal, expide testimonios y certificados de los expedientes y demás documentos que se encuentran en el Archivo, observando las formalidades prescriptas por las leyes de la materia.","Se limita a dar fe de las constancias existentes, sin emitir juicio o apreciación al respecto.","Los testimonios pueden ser expedidos en fotocopias debidamente autenticadas, en cuyo caso se percibirá un arancel que está a cargo de los usuarios de este servicio. Su importe está relacionado con el costo del mismo, para lo cual se autoriza al Superior Tribunal de Justicia a fijar la tarifa correspondiente.","El Archivo asimismo, evacúa directamente los informes que recaban los jueces y las reparticiones de la administración nacional, provincial y municipal."],"s":"El Director del Archivo General de los Tribunales, o su reemplazante legal, expide testimonios y certificados de los expedientes y demás documentos que se encuentran en el Archivo, observando las formalidades prescriptas por…"},{"n":179,"t":"Todo pedido de testimonio o certificado de piezas agregadas…","p":["Todo pedido de testimonio o certificado de piezas agregadas a expedientes existentes en el Archivo es decretado por los jueces teniendo a la vista los autos respectivos, con intervención del representante del Ministerio Fiscal.","Corresponde al Director del Archivo practicar las anotaciones que los jueces ordenan en los protocolos y expedientes que se encuentran en el Archivo."],"s":"Todo pedido de testimonio o certificado de piezas agregadas a expedientes existentes en el Archivo es decretado por los jueces teniendo a la vista los autos respectivos, con intervención del representante del Ministerio Fiscal."},{"n":180,"t":"En los expedientes judiciales terminados, las partes y los…","p":["En los expedientes judiciales terminados, las partes y los profesionales intervinientes pueden solicitar al Juez, antes de su remisión al archivo, el desglose de documentos y la expedición de testimonios y certificaciones que hacen a su derecho.","Igualmente pueden pedir la certificación de fotocopias del expediente extraídas a su costa."],"s":"En los expedientes judiciales terminados, las partes y los profesionales intervinientes pueden solicitar al Juez, antes de su remisión al archivo, el desglose de documentos y la expedición de testimonios y certificaciones que…"},{"n":181,"t":"El Reglamento para el Poder Judicial y la Ley…","p":["El Reglamento para el Poder Judicial y la Ley de Presupuesto, determinan la dotación de funcionarios y empleados del Archivo General de los Tribunales que colaboran con el Director como asimismo dispone el primero, si lo cree oportuno, el funcionamiento de secciones territoriales del Archivo
