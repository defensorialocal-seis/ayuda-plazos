n de la Justicia de Paz, el Director del Archivo General de los Tribunales, el Director y Subdirector de la Dirección de Administración, el Director y Subdirector de Biblioteca, el Jefe de la Oficina de Mandamientos y Notificaciones, los Oficiales de Justicia y el personal profesional técnico de los Juzgados en lo Correccional y de Menores. El resto del personal se denomina empleados."],"s":"Son funcionarios de la Administración de Justicia, además de los mencionados en el artículo 2, los Secretarios, los Médicos de Tribunales y Forenses, el Jefe y Subjefe de la Inspección de la Justicia de Paz, el Director del…"},{"n":5,"t":"Son profesionales auxiliares de la Administración de Justicia: los…","p":["Son profesionales auxiliares de la Administración de Justicia: los abogados y procuradores, los escribanos, médicos, ingenieros, agrimensores, contadores, martilleros públicos, tasadores, traductores, intérpretes, calígrafos y peritos en general, en las causas que intervienen en tal carácter."],"s":"Son profesionales auxiliares de la Administración de Justicia: los abogados y procuradores, los escribanos, médicos, ingenieros, agrimensores, contadores, martilleros públicos, tasadores, traductores, intérpretes, calígrafos y…"},{"n":6,"t":"Corresponde al Poder Judicial el conocimiento y decisión de…","p":["Corresponde al Poder Judicial el conocimiento y decisión de las causas que versan sobre puntos regidos por la Constitución, por los Tratados que celebra la Provincia y por las leyes de esta, así como aquellas en que debe entender de acuerdo a las leyes de la Nación, según que las personas o cosas caigan bajo la jurisdicción provincial."],"s":"Corresponde al Poder Judicial el conocimiento y decisión de las causas que versan sobre puntos regidos por la Constitución, por los Tratados que celebra la Provincia y por las leyes de esta, así como aquellas en que debe…"},{"n":7,"t":"Los órganos judiciales en ejercicio de sus funciones aplican…","p":["Los órganos judiciales en ejercicio de sus funciones aplican la Constitución, los tratados y las leyes provinciales y nacionales de conformidad con las de procedimiento."],"s":"Los órganos judiciales en ejercicio de sus funciones aplican la Constitución, los tratados y las leyes provinciales y nacionales de conformidad con las de procedimiento."},{"n":8,"t":"En el ejercicio de la función jurisdiccional y la…","p":["En el ejercicio de la función jurisdiccional y la administrativa y de superintendencia correlativa, la potestad del Poder Judicial es exclusiva y dispone de la fuerza pública necesaria para el cumplimiento de sus decisiones. En ningún caso el Poder Ejecutivo puede arrogarse funciones jurisdiccionales, ni el conocimiento de causas pendientes o restablecer las fenecidas."],"s":"En el ejercicio de la función jurisdiccional y la administrativa y de superintendencia correlativa, la potestad del Poder Judicial es exclusiva y dispone de la fuerza pública necesaria para el cumplimiento de sus decisiones"},{"n":9,"t":"La fuerza pública dependiente del Poder Ejecutivo presta de…","p":["La fuerza pública dependiente del Poder Ejecutivo presta de inmediato el auxilio que le es requerido por los jueces o tribunales para el cumplimiento de sus responsabilidades; lo mismo cuando un Oficial de Justicia presenta orden escrita de un Juez o Tribunal para efectuar un embargo, secuestro, prisión u otras diligencias similares. Las autoridades policiales están obligadas a prestar el auxilio que se les requiere para el cumplimiento de su misión.","Asimismo, las autoridades dependientes del Poder Ejecutivo facilitan dentro de las atribuciones que les compete, los medios necesarios para que los magistrados puedan cumplir con el ejercicio de sus funciones."],"s":"La fuerza pública dependiente del Poder Ejecutivo presta de inmediato el auxilio que le es requerido por los jueces o tribunales para el cumplimiento de sus responsabilidades; lo mismo cuando un Oficial de Justicia presenta…"},{"n":10,"t":"Los tribunales y los jueces ejercen su jurisdicción en…","p":["Los tribunales y los jueces ejercen su jurisdicción en el territorio de la Provincia, con la competencia que les atribuyen la Constitución, la presente ley y las leyes especiales."],"s":"Los tribunales y los jueces ejercen su jurisdicción en el territorio de la Provincia, con la competencia que les atribuyen la Constitución, la presente ley y las leyes especiales."},{"n":11,"t":"Para los fueros Civil, Comercial, Laboral, Familia, Violencia Familiar,…","p":["Para los fueros Civil, Comercial, Laboral, Familia, Violencia Familiar, Fiscal Tributaria, Penal, Correccional y de Menores, la jurisdicción territorial de la Provincia, se divide en cinco (5) circunscripciones, con las denominaciones de Primera, Segunda, Tercera, Cuarta y Quinta."],"s":"Para los fueros Civil, Comercial, Laboral, Familia, Violencia Familiar, Fiscal Tributaria, Penal, Correccional y de Menores, la jurisdicción territorial de la Provincia, se divide en cinco (5) circunscripciones, con las…"},{"n":12,"t":"Primera Circunscripción Judicial","p":["Primera Circunscripción Judicial:","1) su asiento es la ciudad Capital de la Provincia y queda comprendida dentro de los límites de los municipios de: Posadas, Garupá, San José, Fachinal, Apóstoles, Azara, Tres Capones, Concepción de la Sierra, Santa María, Candelaria, Cerro Corá, Profundidad, Santa Ana, y Loreto;","2) se compone de: una (1) Cámara de Apelaciones en lo Civil, Comercial, de Familia, Violencia Familiar y Fiscal Tributaria con cinco (5) Salas y una (1) Cámara de Apelaciones en lo Laboral, con dos (2) Salas; la Cámara de Apelaciones en lo Civil y Comercial, de Familia, Violencia Familiar y Fiscal Tributaria ejerce jurisdicción sobre la Cuarta Circunscripción Judicial solo en materia Fiscal Tributaria.","Una (1) Cámara de Apelaciones en lo Penal con dos (2) Salas la que ejerce jurisdicción en toda la Provincia hasta tanto se creen las Cámaras de Apelaciones en lo Penal en cada una de las restantes circunscripciones judiciales; dos (2) Tribunales Penales, los que también ejercen la jurisdicción en la Cuarta Circunscripción Judicial, con la competencia establecida en el artículo 25 de la Ley XIV - N. º 13, Código Procesal Penal de la provincia de Misiones.","Con asiento en la ciudad de Posadas funcionan: cinco (5) Juzgados de Primera Instancia en lo Civil y Comercial, tres (3) Juzgados de Primera Instancia en lo Civil, Comercial y de Ejecución Fiscal Tributaria, tres (3) Juzgados de Familia de Primera Instancia, dos (2) Juzgados de Violencia Familiar de Primera Instancia, cuatro (4) Juzgados de Primera Instancia en lo Laboral, un (1) Juzgado con competencia en materia Ambiental, cinco (5) Juzgados de Instrucción y dos (2) Juzgados en lo Correccional y de Menores; el Ministerio Público integrado por una (1) Fiscalía de Cámara Civil y Comercial, una (1) Fiscalía de Cámara Penal, dos (2) Fiscalías de Tribunal, dos (2) Defensorías de Cámara, dos (2) Fiscalías en lo Civil y Comercial, cinco (5) Fiscalías de Instrucción, una (1) Fiscalía de Instrucción Especializada en Ciberdelitos con competencia en toda la Provincia, dos (2) Fiscalías en lo Correccional y de Menores, dos (2) Fiscalías de Violencia Familiar de Primera Instancia; una (1) Fiscalía con competencia en materia Ambiental, cuatro (4) Defensorías de Primera Instancia en lo Civil y Comercial, dos (2) Defensorías de Primera Instancia en lo Civil, Comercial, Laboral y de Familia, una en el barrio Itaembé Miní y otra en el barrio de Villa Cabello, una (1) Defensoría, cinco (5) Defensorías Oficiales de Instrucción, dos (2) Defensorías en lo Correccional y de Menores y dos (2) Defensorías de Violencia Familiar de Primera Instancia.","Con asiento en el barrio Fátima de la localidad de Garupá funciona una (1) Defensoría de Primera Instancia en lo Civil, Comercial, Laboral y de Familia.","Con asiento en la localidad de Garupá funcionan un (1) Juzgado de Familia y Violencia Familiar de Primera Instancia, una (1) Fiscalía de Familia y Violencia Familiar de Primera Instancia y una (1) Defensoría de Familia y Violencia Familiar de Primera Instancia.","Con asiento en la ciudad de Apóstoles funcionan: un (1) Juzgado de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar; una (1) Fiscalía en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar de Primera Instancia y una (1) Defensoría de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar; un (1) Juzgado de Instrucción, una (1) Fiscalía de Instrucción y una (1) Defensoría de Oficio.","El Juzgado de Instrucción con asiento en la ciudad de Apóstoles, ejerce la jurisdicción territorial dentro de los límites de los municipios de: Apóstoles, San José, Concepción de la Sierra, Santa María, Tres Capones y Azara.","El Juzgado de Primera Instancia en lo Civil y Comercial, Laboral, de Familia y Violencia Familiar con asiento en la ciudad de Apóstoles, ejerce la jurisdicción territorial dentro de los límites de los municipios de Apóstoles, San José, Concepción de la Sierra, Santa María, Tres Capones y Azara."],"s":"1) su asiento es la ciudad Capital de la Provincia y queda comprendida dentro de los límites de los municipios de: Posadas, Garupá, San José, Fachinal, Apóstoles, Azara, Tres Capones, Concepción de la Sierra, Santa María,…"},{"n":13,"t":"Segunda Circunscripción Judicial","p":["Segunda Circunscripción Judicial:","1) su asiento es la ciudad de Oberá y queda comprendida dentro de los límites de los municipios de: Oberá, San Martín, Guaraní, Florentino Ameghino, Los Helechos, Panambí, Campo Ramón, Campo Viera, Colonia Alberdi, General Alvear, Campo Grande, Aristóbulo del Valle, Colonia Aurora, 25 de Mayo, Alba Posse, San Javier, Itacaruaré, Mojón Grande, Leandro N. Alem, Bonpland, Caá Yarí, Almafuerte, Gobernador López, Dos Arroyos, Cerro Azul, Arroyo del Medio, Olegario V. Andrade, Mártires y Salto Encantado;","2) se compone de: una (1) Cámara de Apelaciones en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar y un (1) Tribunal Penal.","Con asiento en la ciudad de Oberá funcionan: tres (3) Juzgados de Primera Instancia en lo Civil y Comercial, un (1) Juzgado de Primera Instancia de Familia y Violencia Familiar, un (1) Juzgado de Primera Instancia en lo Laboral, dos (2) Juzgados de Instrucción, un (1) Juzgado Correccional y de Menores, el Ministerio Público integrado por una (1) Fiscalía de Cámara Civil, Comercial y Laboral, una (1) Fiscalía de Tribunal Penal, una (1) Defensoría de Cámara Civil, Comercial y Laboral, una (1) Fiscalía en lo Civil y Comercial, una (1) Fiscalía de Primera Instancia en lo Civil, Comercial y de Familia, una (1) Defensoría Civil y Comercial, dos (2) Fiscalías de Instrucción, una (1) Fiscalía Correccional y de Menores, dos (2) Defensorías de Instrucción y en lo Correccional y de Menores, una (1) Defensoría del Trabajador.","Con asiento en la localidad de Aristóbulo del Valle funcionan: un (1) Juzgado de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar, una (1) Defensoría de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar y una (1) Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar.","El Juzgado de Primera Instancia con asiento en la localidad de Aristóbulo del Valle ejerce jurisdicción territorial dentro de los límites de los municipios de Aristóbulo del Valle, Campo Grande, Campo Viera y Salto Encantado.","Con asiento en la ciudad de Leandro N. Alem funcionan: un (1) Juzgado de Primera Instancia en lo Civil, Comercial y Laboral, un (1) Juzgado de Familia y Violencia Familiar, un (1) Juzgado de Instrucción, una (1) Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral y de Familia, una (1) Fiscalía de Instrucción, una (1) Defensoría de Primera Instancia en lo Civil, Comercial, Laboral, una (1) Defensoría de Familia y Violencia Familiar y una (1) Defensoría de Instrucción. n lo Civil, Comercial, Laboral, de Familia y Violencia Familiar y un (1) Juzgado de Instrucción; el Ministerio Público integrado por una (1) Fiscalía de Primera Instancia en lo Civil, Comercial, Laboral y de Familia, una (1) Fiscalía de Instrucción, una (1) Defensoría de Primera Instancia en lo Civil, Comercial, Laboral y de Familia y una (1) Defensoría de Instrucción.","El Juzgado de Instrucción con asiento en la ciudad de San Vicente ejerce la jurisdicción territorial dentro de los límites de los municipios Dos de Mayo, El Soberbio, Fracrán y San Vicente.","Con asiento en la localidad de San Pedro funciona un (1) Juzgado de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar y un (1) Juzgado de Instrucción; el Ministerio Público integrado por: una (1) Fiscalía Civil, Comercial, Laboral, de Familia y Violencia Familiar, dos (2) Defensorías de Primera Instancia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar, una (1) Fiscalía de Instrucción, y una (1) Defensoría de Instrucción.","El Juzgado de Instrucción ejerce jurisdicción territorial dentro de los límites de los municipios de Bernardo de Irigoyen, Pozo Azul y San Pedro.","El Juzgado de Primera Instancia con competencia en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar, con asiento en la localidad de San Pedro, ejerce jurisdicción territorial dentro de los límites de los municipios de Bernardo de Irigoyen, Pozo Azul y San Pedro.","Con asiento en la localidad de Bernardo de Irigoyen funciona una (1) Defensoría Oficial de Primera Instancia en lo Civil, Comercial, Laboral y de Familia.","La Cámara de Apelaciones en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar, el Tribunal Penal y el Juzgado Correccional y de Menores de la Segunda Circunscripción Judicial, con asiento en la ciudad de Oberá, ejerce jurisdicción territorial dentro de los límites de los municipios de Dos de Mayo, El Soberbio, Fracrán y San Vicente.","La Cámara de Apelaciones en lo Civil, Comercial, Laboral, de Familia y Violencia Familiar, el Tribunal Penal y el Juzgado Correccional y de Menores de la Tercera Circunscripción Judicial, con asiento en la ciudad de Eldorado, ejerce jurisdicción territorial dentro de los límites de los municipios de Bernardo de Irigoyen, Pozo Azul y San Pedro."],"s":"1) su asiento es la ciudad de San Vicente, y queda comprendida dentro de los límites de los municipios de: Bernardo de Irigoyen, Dos de Mayo, El Soberbio, Fracrán, Pozo Azul, San Pedro y San Vicente;"},{"n":17,"t":"Los jueces de todos los grados -excepto los de…","p":["Los jueces de todos los grados -excepto los de Paz legos- y los integrantes del Ministerio Público son nombrados de conformidad a lo dispuesto en los artículos 116 inciso 10) y 149 de la Constitución Provincial. Los Jueces de Paz no letrados son nombrados en la forma que dispone el artículo 150 de la Constitución Provincial."],"s":"Los jueces de todos los grados -excepto los de Paz legos- y los integrantes del Ministerio Público son nombrados de conformidad a lo dispuesto en los artículos 116 inciso 10) y 149 de la Constitución Provincial"},{"n":18,"t":"Los jueces de todos los grados -excepto los de…","p":["Los jueces de todos los grados -excepto los de Paz legos- y los integrantes del Ministerio Público son inamovibles y conservan sus respectivos cargos mientras observan buena conducta y cumplen con sus obligaciones. Su retribución es establecida por ley y no puede ser disminuida mientras permanecen en sus funciones, salvo en caso que así se establezca en disposiciones legales sobre remuneraciones de carácter general o reglamentarias en carácter de sanción pecuniaria."],"s":"Los jueces de todos los grados -excepto los de Paz legos- y los integrantes del Ministerio Público son inamovibles y conservan sus respectivos cargos mientras observan buena conducta y cumplen con sus obligaciones"},{"n":19,"t":"Antes de asumir el cargo, los magistrados, funcionarios y…","p":["Antes de asumir el cargo, los magistrados, funcionarios y empleados de la Administración de Justicia prestan juramento de desempeñar sus obligaciones fiel y legalmente de conformidad con lo que prescriben la Constitución y las leyes de la Provincia. Los magistrados, funcionarios y empleados prestan juramento ante el Presidente del Superior Tribunal de Justicia, pudiendo delegarse dicha facultad con respecto a estos últimos, en los magistrados y funcionarios ante quienes desempeñan sus funciones."],"s":"Antes de asumir el cargo, los magistrados, funcionarios y empleados de la Administración de Justicia prestan juramento de desempeñar sus obligaciones fiel y legalmente de conformidad con lo que prescriben la Constitución y las…"},{"n":20,"t":"No pueden ser simultáneamente miembros de un mismo tribunal…","p":["No pueden ser simultáneamente miembros de un mismo tribunal parientes o afines dentro del cuarto grado civil. En caso de afinidad sobreviniente, el que la causa abandona el cargo."],"s":"No pueden ser simultáneamente miembros de un mismo tribunal parientes o afines dentro del cuarto grado civil"},{"n":21,"t":"Es incompatible la magistratura judicial con toda actividad política,…","p":["Es incompatible la magistratura judicial con toda actividad política, sea partidaria o electoral, con el ejercicio del comercio, con la realización de cualquier actividad profesional salvo que se trate de intereses propios, de los del cónyuge, de los padres o de los hijos, y con el desempeño de empleos públicos o privados rentados, electivos o ad honorem excepto con el cumplimiento de comisiones especiales de estudio o de otra naturaleza o la docente.","Igual incompatibilidad tienen los funcionarios integrantes del Ministerio Público y de las Secretarías de los Tribunales y Juzgados Letrados.","Las incompatibilidades establecidas en los párrafos anteriores no rigen para los Jueces de Paz legos, cuando son propuestos candidatos para cubrir cargos electivos, desde la fecha que se acuerda licencia sin goce de haberes, que debe ser otorgada antes de setenta (70) días del comicio y durante su mandato, de resultar electos.","A los jueces de cualquier grado y a los miembros del Ministerio Público les está prohibido practicar juegos de azar o concurrir a lugares destinados a ellos, o ejecutar actos que comprometen la dignidad del cargo.","Residen en el lugar donde ejercen sus funciones o dentro de un radio de pronta comunicación hasta cincuenta (50) kilómetros de aquél.","Es incompatible el ejercicio de cargo de funcionario o empleado con la tramitación de asuntos judiciales de terceros y la participación o empleo en estudios de abogados, procuradores y escribanos.","Tampoco pueden actuar como peritos en las listas de nombramiento de oficio, ni desempeñar otras funciones en la Administración de Justicia."],"s":"Es incompatible la magistratura judicial con toda actividad política, sea partidaria o electoral, con el ejercicio del comercio, con la realización de cualquier actividad profesional salvo que se trate de intereses propios, de…"},{"n":22,"t":"Los magistrados y funcionarios judiciales jubilados en la Provincia…","p":["Los magistrados y funcionarios judiciales jubilados en la Provincia pueden reingresar en la Administración de Justicia en un cargo judicial de jerarquía similar o superior al que desempeñaba en el momento de jubilarse. El reintegro al servicio activo entraña el derecho a percibir retribución propia del cargo en que son designados, suspendiéndose a partir del momento en que le asiste ese derecho, la liquidación del haber jubilatorio. Los servicios prestados y las remuneraciones percibidas son computables en el momento en que cesan en sus funciones para acogerse nuevamente a la jubilación, si desempeñaron el nuevo cargo durante un término no menor de dos (2) años.","Los abogados, escribanos o procuradores jubilados, los empleados jubilados en la Administración de Justicia y en otras reparticiones, sean nacionales, provinciales o municipales y en la actividad privada, no pueden ingresar en la Administración de Justicia, con excepción de los cargos de Juez y Secretario de la Justicia de Paz lega y personal de seguridad y vigilancia."],"s":"Los magistrados y funcionarios judiciales jubilados en la Provincia pueden reingresar en la Administración de Justicia en un cargo judicial de jerarquía similar o superior al que desempeñaba en el momento de jubilarse"},{"n":23,"t":"Los Jueces de Paz letrados de Primera y Segunda…","p":["Los Jueces de Paz letrados de Primera y Segunda Categoría son removidos conforme a lo establecido en el artículo 158 de la Constitución Provincial. Los Jueces de Paz legos, los funcionarios y demás empleados subalternos cuyo nombramiento no está previsto en otra forma por la Constitución o por esta ley, son designados por el Superior Tribunal de Justicia y removidos por el mismo, en caso de inconducta, impedimento, ineptitud o incumplimiento de sus funciones, siguiendo el procedimiento que establece el Reglamento para el Poder Judicial, previo sumario."],"s":"Los Jueces de Paz letrados de Primera y Segunda Categoría son removidos conforme a lo establecido en el artículo 158 de la Constitución Provincial"},{"n":24,"t":"Los jueces de cualquier grado, los miembros del Ministerio…","p":["Los jueces de cualquier grado, los miembros del Ministerio Público y demás funcionarios del Poder Judicial deben ser mayores de edad, acreditar nacionalidad argentina por nacimiento o por naturalización y en este caso, diez (10) años de ejercicio de la ciudadanía."],"s":"Los jueces de cualquier grado, los miembros del Ministerio Público y demás funcionarios del Poder Judicial deben ser mayores de edad, acreditar nacionalidad argentina por nacimiento o por naturalización y en este caso, diez…"},{"n":25,"t":"Los Jueces de Paz de Primera y Segunda Categoría…","p":["Los Jueces de Paz de Primera y Segunda Categoría perciben el ochenta por ciento (80%) y setenta por ciento (70%), respectivamente, del sueldo de Juez de Primera Instancia.","Los Secretarios de Juzgados de Paz de Primera y Segunda Categoría perciben el ochenta por ciento (80%) y setenta por ciento (70%), respectivamente, del sueldo de Secretario de Primera Instancia.","La compensación o retribución es uniforme para los magistrados, funcionarios y empleados frente a igualdad de tareas o funciones que cada uno de ellos desempeña; sólo pueden asignarse diferencias provenientes de mayores títulos que los exigidos para cada especialidad.","En ningún caso, el sueldo liquidado según el presente artículo puede ser menor al que al momento de la sanción de la presente ley perciben los magistrados y funcionarios mencionados."],"s":"Los Jueces de Paz de Primera y Segunda Categoría perciben el ochenta por ciento (80%) y setenta por ciento (70%), respectivamente, del sueldo de Juez de Primera Instancia."},{"n":26,"t":"Los funcionarios y empleados tienen los derechos, deberes y…","p":["Los funcionarios y empleados tienen los derechos, deberes y responsabilidades e incompatibilidades que la ley o los reglamentos establecen. El Superior Tribunal de Justicia acuerda un escalafón que asegura la estabilidad y el ascenso en la carrera, atendiendo a los títulos, eficiencia y antigüedad de aquellos, debidamente calificada."],"s":"Los funcionarios y empleados tienen los derechos, deberes y responsabilidades e incompatibilidades que la ley o los reglamentos establecen"},{"n":27,"t":"Las faltas de los magistrados, funcionarios, empleados y auxiliares…","p":["Las faltas de los magistrados, funcionarios, empleados y auxiliares de la Justicia son sancionadas con apercibimiento, multa determinada concretamente que no puede exceder del veinticinco por ciento (25%) del sueldo del sancionado, suspensión, cesantía y exoneración, debiendo procederse en la forma que determinan las leyes y el Reglamento para el Poder Judicial.","La cesantía y la exoneración de los empleados no sujetos a Jurado de Enjuiciamiento, son decretadas por el Superior Tribunal de Justicia de conformidad al Reglamento para el Poder Judicial."],"s":"Las faltas de los magistrados, funcionarios, empleados y auxiliares de la Justicia son sancionadas con apercibimiento, multa determinada concretamente que no puede exceder del veinticinco por ciento (25%) del sueldo del…"},{"n":28,"t":"No pueden actuar en la Administración de Justicia","p":["No pueden actuar en la Administración de Justicia:","1) los encausados por delitos dolosos, siempre que contra ellos se dicte auto de procesamiento;","2) los que fueron condenados dentro o fuera de la Provincia por delitos dolosos. Para actuar en carácter de profesional auxiliar de la Administración de Justicia, la inhabilitación es por el término de la pena más otro tanto;","3) los fallidos, mientras no son rehabilitados;","4) los inhabilitados judicialmente de conformidad con el artículo 48 del Código Civil y Comercial de la Nación."],"s":"1) los encausados por delitos dolosos, siempre que contra ellos se dicte auto de procesamiento;"},{"n":29,"t":"Las causas en que por cualquier incidente o recurso…","p":["Las causas en que por cualquier incidente o recurso conoce una de las Salas de las Cámaras de Apelaciones competen siempre a la misma cuando vuelven por cualquier otro recurso o incidente."],"s":"Las causas en que por cualquier incidente o recurso conoce una de las Salas de las Cámaras de Apelaciones competen siempre a la misma cuando vuelven por cualquier otro recurso o incidente."},{"n":30,"t":"Los tribunales y jueces deben resolver las cuestiones que…","p":["Los tribunales y jueces deben resolver las cuestiones que le someten las partes, en los plazos establecidos por las leyes de procedimiento. La mora no justificada en cumplir con esta obligación se considera falta grave y es sancionada en la forma prescripta en el artículo 27."],"s":"Los tribunales y jueces deben resolver las cuestiones que le someten las partes, en los plazos establecidos por las leyes de procedimiento"},{"n":31,"t":"Los Jueces de Primera Instancia que solicitan licencia o…","p":["Los Jueces de Primera Instancia que solicitan licencia o tienen algún impedimento temporario para el ejercicio del cargo, son suplidos automáticamente por el que estando en funciones le sigue en el orden de turno. En las circunscripciones en que no existen varios del mismo fuero, se sigue el sistema establecido para la integración por excusaciones o recusaciones."],"s":"Los Jueces de Primera Instancia que solicitan licencia o tienen algún impedimento temporario para el ejercicio del cargo, son suplidos automáticamente por el que estando en funciones le sigue en el orden de turno"},{"n":32,"t":"Los jueces, funcionarios y abogados de la lista de…","p":["Los jueces, funcionarios y abogados de la lista de conjueces, para poder reemplazar a un Juez de cualquier grado, deben poseer las condiciones y requisitos del titular a reemplazar."],"s":"Los jueces, funcionarios y abogados de la lista de conjueces, para poder reemplazar a un Juez de cualquier grado, deben poseer las condiciones y requisitos del titular a reemplazar."},{"n":33,"t":"En los asientos judiciales donde hay dos (2) o…","p":["En los asientos judiciales donde hay dos (2) o más jueces de la misma clase o fuero, se turnan en la forma que determina el Superior Tribunal de Justicia, para el conocimiento de las causas de su competencia."],"s":"En los asientos judiciales donde hay dos (2) o más jueces de la misma clase o fuero, se turnan en la forma que determina el Superior Tribunal de Justicia, para el conocimiento de las causas de su competencia."},{"n":34,"t":"El Superior Tribunal de Justicia, las Cámaras de Apelaciones,…","p":["El Superior Tribunal de Justicia, las Cámaras de Apelaciones, los Tribunales Penales, los Jueces de Primera Instancia, los Jueces de Instrucción, los Jueces en lo Correccional y de Menores y los de Paz de todas las categorías, además de los libros que exige su régimen interno, deben llevar uno en el que se asientan o incorporan por orden numérico y cronológico, todas las sentencias; y otro para los autos interlocutorios con fuerza definitiva, ambos con las firmas de los jueces."],"s":"El Superior Tribunal de Justicia, las Cámaras de Apelaciones, los Tribunales Penales, los Jueces de Primera Instancia, los Jueces de Instrucción, los Jueces en lo Correccional y de Menores y los de Paz de todas las categorías,…"},{"n":35,"t":"Todos los Jueces de Primera Instancia deben publicar al…","p":["Todos los Jueces de Primera Instancia deben publicar al finalizar cada período mensual en el Boletín Oficial y remitir a la Cámara de Apelaciones correspondiente al mismo tiempo, la lista de los juicios pendientes de resolución o sentencia definitiva.","Debe consignarse el número del expediente, la naturaleza del juicio o causa y fecha en que entra a despacho.","Asimismo, en el mes de febrero de cada año los tribunales de todos los grados y demás dependencias remiten al Superior Tribunal de Justicia los datos estadísticos del movimiento habido en los mismos durante el año anterior.","La violación de estas normas es reprimida disciplinariamente por el Superior Tribunal."],"s":"Todos los Jueces de Primera Instancia deben publicar al finalizar cada período mensual en el Boletín Oficial y remitir a la Cámara de Apelaciones correspondiente al mismo tiempo, la lista de los juicios pendientes de…"},{"n":36,"t":"Los miembros del Superior Tribunal de Justicia pueden ser…","p":["Los miembros del Superior Tribunal de Justicia pueden ser recusados sólo con causa."],"s":"Los miembros del Superior Tribunal de Justicia pueden ser recusados sólo con causa."},{"n":37,"t":"Los Jueces de Instrucción de las distintas circunscripciones judiciales…","p":["Los Jueces de Instrucción de las distintas circunscripciones judiciales practican mensualmente visita a los establecimientos carcelarios de su jurisdicción, remitiendo actas de las mismas a los Tribunales Penales, con el resultado de la inspección, en las que hacen constar el número de internos y carácter en que se encuentran, como asimismo las necesidades y medidas a adoptar a los fines del artículo 18 de la Constitución Nacional."],"s":"Los Jueces de Instrucción de las distintas circunscripciones judiciales practican mensualmente visita a los establecimientos carcelarios de su jurisdicción, remitiendo actas de las mismas a los Tribunales Penales, con el…"},{"n":38,"t":"El Superior Tribunal de Justicia está integrado por nueve…","p":["El Superior Tribunal de Justicia está integrado por nueve (9) miembros, nombrados con arreglo a lo que dispone la Constitución de la Provincia. Ejerce su jurisdicción en todo el territorio provincial y tiene su sede en la ciudad de Posadas."],"s":"El Superior Tribunal de Justicia está integrado por nueve (9) miembros, nombrados con arreglo a lo que dispone la Constitución de la Provincia"},{"n":39,"t":"La Presidencia del Superior Tribunal de Justicia, es ejercida…","p":["La Presidencia del Superior Tribunal de Justicia, es ejercida durante dos (2) años, por uno de sus miembros, designado por mayoría absoluta de los integrantes de ese Tribunal, pudiendo ser reelecto. Dicha elección se realiza en el mes de diciembre del año en que corresponde elegir. Entra en funciones el 1 de enero del año siguiente al de su elección.","En la misma época, pero anualmente son designados los subrogantes que lo reemplazan en los casos de ausencia o impedimento transitorio."],"s":"La Presidencia del Superior Tribunal de Justicia, es ejercida durante dos (2) años, por uno de sus miembros, designado por mayoría absoluta de los integrantes de ese Tribunal, pudiendo ser reelecto"},{"n":40,"t":"Si se trata de renuncia, fallecimiento o separación del…","p":["Si se trata de renuncia, fallecimiento o separación del cargo, se elige en el primer acuerdo del Tribunal el miembro que desempeñará la Presidencia para completar el resto del período."],"s":"Si se trata de renuncia, fallecimiento o separación del cargo, se elige en el primer acuerdo del Tribunal el miembro que desempeñará la Presidencia para completar el resto del período."},{"n":41,"t":"Para ser miembro del Superior Tribunal y Procurador General,…","p":["Para ser miembro del Superior Tribunal y Procurador General, se requieren las condiciones exigidas por la Constitución Provincial."],"s":"Para ser miembro del Superior Tribunal y Procurador General, se requieren las condiciones exigidas por la Constitución Provincial."},{"n":42,"t":"Las decisiones del Superior Tribunal de Justicia se adoptan…","p":["Las decisiones del Superior Tribunal de Justicia se adoptan por mayoría de los nueve (9) jueces que lo integran, siempre que estos acuerden en la solución del caso.","Si hay desacuerdo se requieren los votos necesarios para obtener mayoría de opiniones, conforme a las previsiones de los artículos siguientes."],"s":"Las decisiones del Superior Tribunal de Justicia se adoptan por mayoría de los nueve (9) jueces que lo integran, siempre que estos acuerden en la solución del caso."},{"n":43,"t":"En los casos de recusación, impedimento, vacancia o licencia…","p":["En los casos de recusación, impedimento, vacancia o licencia de algunos de los miembros del Superior Tribunal, éste se integra en caso de ser necesario, hasta completar el número legal requerido para fallar o resolver de acuerdo con el artículo anterior."],"s":"En los casos de recusación, impedimento, vacancia o licencia de algunos de los miembros del Superior Tribunal, éste se integra en caso de ser necesario, hasta completar el número legal requerido para fallar o resolver de…"},{"n":44,"t":"El orden de subrogación de los miembros del Superior Tribunal es el siguiente","p":["El orden de subrogación de los miembros del Superior Tribunal es el siguiente:","1) el Procurador General;","2) los integrantes de las Cámaras de Apelaciones y de los Tribunales Penales, Fiscal y Defensor de Cámara, Fiscal de Tribunal Penal, por sorteo entre los que reúnen las condiciones para ser miembros del Superior Tribunal;","3) por los abogados de la matrícula que integran la lista de conjueces del Superior Tribunal de Justicia."],"s":"1) el Procurador General;"},{"n":45,"t":"Integrado el Tribunal, la intervención de los reemplazantes no…","p":["Integrado el Tribunal, la intervención de los reemplazantes no cesa aunque desaparezca el motivo que dio lugar a la integración, salvo que se trate de licencia y esta termine antes del llamado de los autos para definitiva. En tal caso, el Juez reemplazado se reintegra al conocimiento de la causa. Si llamados los autos para definitiva y al tiempo de pase a voto el Ministro correspondiente se halla en uso de licencia, la votación continúa con los siguientes. Si logra la mayoría establecida en el artículo 42 para la solución del litigio, esta constituye la resolución definitiva sin otro trámite. En caso contrario se procede a la integración del Cuerpo de acuerdo a las previsiones de los artículos 42, 43 y 44."],"s":"Integrado el Tribunal, la intervención de los reemplazantes no cesa aunque desaparezca el motivo que dio lugar a la integración, salvo que se trate de licencia y esta termine antes del llamado de los autos para definitiva"},{"n":46,"t":"Salvo los casos previstos precedentemente, las decisiones del Superior…","p":["Salvo los casos previstos precedentemente, las decisiones del Superior Tribunal son suscriptas por la totalidad de los miembros que lo integran. Cada miembro emite su voto en orden determinado en el sorteo y como lo establece el Reglamento para el Poder Judicial, pudiendo adoptarse en la redacción la forma impersonal. La opinión de la mayoría puede ser llevada por uno de los Ministros y la de la minoría del mismo modo."],"s":"Salvo los casos previstos precedentemente, las decisiones del Superior Tribunal son suscriptas por la totalidad de los miembros que lo integran"},{"n":47,"t":"Por vía de sorteo en cada caso, se establece…","p":["Por vía de sorteo en cada caso, se establece el orden en que los Ministros intervienen en cada asunto o causa. Los sorteos se hacen de manera que el trabajo se distribuya equitativamente entre los mismos."],"s":"Por vía de sorteo en cada caso, se establece el orden en que los Ministros intervienen en cada asunto o causa"},{"n":48,"t":"El tratamiento del Superior Tribunal de Justicia debe ser…","p":["El tratamiento del Superior Tribunal de Justicia debe ser de Excelencia, y el de cada uno de sus miembros, el de Señoría."],"s":"El tratamiento del Superior Tribunal de Justicia debe ser de Excelencia, y el de cada uno de sus miembros, el de Señoría."},{"n":49,"t":"Sin perjuicio de lo dispuesto en los artículos 145 y 146 de la Constitución Provincial, son atribuciones del Superior Tribunal de Justicia las siguientes","p":["Sin perjuicio de lo dispuesto en los artículos 145 y 146 de la Constitución Provincial, son atribuciones del Superior Tribunal de Justicia las siguientes:","1) representar al Poder Judicial;","2) ejercer la superintendencia sobre toda la Administración de Justicia;","3) dictar su Reglamento interno y económico y el Reglamento para el Poder Judicial, estableciendo las facultades de superintendencia a ejercer por el Cuerpo y los demás Tribunales Inferiores;","4) nombrar los magistrados, funcionarios y empleados cuya designación no está asignada a otro Poder;","5) proponer al Poder Ejecutivo la creación de los organismos judiciales que estima conveniente y necesario, como asimismo la creación de empleos y dotaciones;","6) establecer, mediante acordadas dictadas al efecto, el número de Secretarías con que cuentan los Tribunales y Juzgados de la Provincia reglamentando su funcionamiento, así como los derechos, atribuciones, deberes y garantía de sus titulares;","7) organizar, en las distintas circunscripciones judiciales las Oficinas de Mandamientos y Notificaciones;","8) dotar a los Tribunales, Juzgados, Ministerios Públicos y demás dependencias y oficinas del Poder Judicial, de los respectivos planteles de personal, de conformidad con los cargos que les asigna la Ley de Presupuesto;","9) disponer la inspección por intermedio de su Presidente o miembros que designa, de las Cámaras de Apelaciones, Tribunales y Juzgados de cualquier clase, Ministerio Público y demás oficinas dependientes del Poder Judicial;","10) observar la conducta de los magistrados y funcionarios de la Administración de Justicia;","11) llamar a cualquier magistrado o funcionario de la justicia a fin de prevenirles por faltas u omisiones en el desempeño de sus funciones;","12) requerir a los magistrados y funcionarios de cualquier grado, informes verbales o por escrito, sobre asuntos vinculados con el servicio judicial;","13) disponer por razones de mejor servicio, el traslado de oficinas, de funcionarios y empleados;","14) fijar el horario de las oficinas del Poder Judicial;","15) acordar licencia a los magistrados, funcionarios y empleados de la Administración de Justicia, de acuerdo con lo que dispone el Reglamento para el Poder Judicial;","16) recibir juramentos a los magistrados y funcionarios;","17) determinar la forma de reemplazo en caso de licencia, ausencia, fallecimiento, renuncia, cesantía u otro impedimento de magistrados y funcionarios;","18) designar a propuesta de los Jueces o Presidentes de las Cámaras de Apelaciones o Tribunales Penales, a los secretarios respectivos, quienes deben tener título de abogado, expedido por universidad nacional o equiparable y ser nativos de la Provincia o acreditar en caso contrario, dos años de residencia efectiva en la misma;","19) establecer por vía reglamentaria las condiciones y cualidades que deben reunir los interesados para desempeñar los cargos de funcionarios auxiliares y empleados del Poder Judicial;","20) determinar las ferias judiciales y disponer asuetos judiciales o suspender los términos procesales cuando circunstancias especiales o acontecimientos extraordinarios lo requieren;","21) ejercer la superintendencia del notariado;","22) disponer y administrar los bienes del Poder Judicial y los fondos que les asignan el Presupuesto General de la Provincia y las leyes especiales;","23) determinar a través de normas reglamentarias la forma en que se ejecuta el presupuesto anual;","24) presentar anualmente al Poder Ejecutivo el Presupuesto de Gastos de la Administración de Justicia a fin de ser incluido en el Presupuesto General de la Provincia;","25) remitir anualmente al Poder Ejecutivo una memoria sobre el estado y las necesidades de la Administración de Justicia;","26) enviar al Poder Ejecutivo, con su mensaje respectivo, todo proyecto de ley que juzga necesario y conveniente para la Administración de Justicia;","27) confeccionar en el mes de diciembre de cada año, la lista de abogados inscriptos, así como la de conjueces cuyo número es determinado por el Reglamento para el Poder Judicial. La desinsaculación de la lista de conjueces se hace de la lista de abogados, confeccionada en cada caso a criterio del Superior Tribunal, de entre aquellos que reúnen las condiciones de ley, en acto público y con notificación a los interesados;","28) ordenar la inscripción en la matrícula de los profesionales auxiliares de la justicia, siempre que tal facultad no se atribuya por ley a otra entidad;","29) confeccionar en el mes de diciembre de cada año la lista de los profesionales auxiliares de la justicia para las designaciones de oficio y desinsacular de las mismas a quienes deben actuar en el año inmediato siguiente, de conformidad con lo que establece el Reglamento para el Poder Judicial;","30) designar con quince (15) días de anticipación, como mínimo, a los jueces, funcionarios y empleados de feria;","31) dictar las reglamentaciones conducentes al debido ejercicio de las funciones que le acuerdan esta ley, los códigos de procedimiento y demás leyes especiales;","32) en las recusaciones o excusaciones de sus propios miembros;","33) en los juicios sobre responsabilidad civil contra magistrados judiciales;","34) en los casos de informes al Poder Ejecutivo para indultar o conmutar penas, y en los de fijación o reducción de estas, autorizadas por el Código Penal. En todos estos casos se requiere la asistencia de todos sus miembros y las resoluciones son adoptadas por mayoría absoluta de votos;","35) ejercer el contralor de la conducta de sus miembros, así como la de los demás magistrados, funcionarios y empleados, pudiendo imponer sanciones disciplinarias cuando incurren en faltas u omisiones en el desempeño de sus cargos, que no son aquellas que autorizan su juzgamiento conforme a la Constitución y Ley de Enjuiciamiento de Magistrados;","36) resolver las apelaciones contra las medidas disciplinarias aplicadas por los demás organismos del Poder Judicial;","37) proyectar un régimen de escalafón de funcionarios y empleados de la Administración de Justicia, conforme a lo establecido por el artículo 26;","38) llevar los libros exigidos por los códigos y leyes procesales y los registros relativos a faltas, términos, expedientes, los que se determinan en el artículo 34, así como los demás antecedentes que exige la organización judicial."],"s":"1) representar al Poder Judicial;"},{"n":50,"t":"Las Cámaras de Apelaciones conocen como tribunal de última…","p":["Las Cámaras de Apelaciones conocen como tribunal de última instancia de los recursos contra las resoluciones de los Jueces letrados de Primera Instancia del fuero respectivo; de las recusaciones de sus propios miembros y en grado de apelación la de los jueces letrados respectivos y de los recursos por retardo o denegación de justicia contra los Jueces de Primera Instancia de sus respectivos fueros.","Efectúan inspecciones a los juzgados de su dependencia, de las que informan al Superior Tribunal de Justicia, pudiendo adoptar las medidas que tiendan a un mejor servicio judicial.","A los Tribunales Penales, les corresponde además practicar las visitas de cárceles conforme a las leyes de procedimiento, informando de las mismas al Superior Tribunal."],"s":"Las Cámaras de Apelaciones conocen como tribunal de última instancia de los recursos contra las resoluciones de los Jueces letrados de Primera Instancia del fuero respectivo; de las recusaciones de sus propios miembros y en…"},{"n":51,"t":"La Presidencia de la Cámara de Apelaciones es ejercida…","p":["La Presidencia de la Cámara de Apelaciones es ejercida por rotación anual de sus miembros en el orden numérico que es establecido por sorteo y en acuerdo de cada Cámara, entrando en funciones el primero de enero de cada año. Los restantes miembros que siguen en el orden que se establece, actúan como subrogantes en los casos de impedimento, licencia, ausencia, renuncia, excusación, recusación o vacancia.","Si el Presidente o alguno de los vocales cesa en el cargo, rige lo dispuesto en el artículo 40, en cuanto al mecanismo de sustitución.","El Presidente de cada Tribunal en lo Penal, es designado por sus respectivos componentes y dura un (1) año en sus funciones."],"s":"La Presidencia de la Cámara de Apelaciones es ejercida por rotación anual de sus miembros en el orden numérico que es establecido por sorteo y en acuerdo de cada Cámara, entrando en funciones el primero de enero de cada año"},{"n":52,"t":"Las decisiones de las Salas en sede judicial, son…","p":["Las decisiones de las Salas en sede judicial, son suscriptas por los dos (2) miembros de las mismas. El Presidente solamente interviene cuando debe dirimir con su voto una disidencia entre los vocales. Si la disidencia se origina en la Sala que integra el Presidente en ejercicio, aquella es dirimida por el Presidente subrogante que corresponde a otra Sala.","En las sentencias definitivas, cada uno de los miembros funda su voto en el orden determinado por el sorteo, pudiendo adherir al del vocal preopinante."],"s":"Las decisiones de las Salas en sede judicial, son suscriptas por los dos (2) miembros de las mismas"},{"n":53,"t":"En caso de excusación, recusación, vacancia u otro impedimento de los miembros de las Salas de la Cámaras de Apelaciones, son suplidos","p":["En caso de excusación, recusación, vacancia u otro impedimento de los miembros de las Salas de la Cámaras de Apelaciones, son suplidos:","1) por los miembros de la otra u otras Salas, por sorteo;","2) por los miembros de la Cámara de Apelaciones del otro fuero, por sorteo;","3) por los Jueces de Primera Instancia del mismo fuero con asiento en la Primera Circunscripción Judicial, por sorteo;","4) por los demás Jueces de Primera Instancia de la mencionada circunscripción;","5) por los conjueces designados conforme a las previsiones legales y reglamentarias pertinentes.","En caso de excusación, recusación, vacancia o impedimento de alguno de los miembros de las Cámaras de Apelaciones en lo Civil, Comercial y Laboral de la Segunda y Tercera Circunscripción Judicial, son suplidos en el siguiente orden por:","1) los miembros del Tribunal en lo Penal de la respectiva circunscripción judicial;","2) los Jueces de Primera Instancia en lo Civil y Comercial de la respectiva circunscripción judicial;","3) los Jueces de Primera Instancia en el Fuero Laboral de la respectiva circunscripción judicial;","4) los conjueces de la respectiva circunscripción judicial.","En los Tribunales en lo Penal:","1) por los jueces de otro Tribunal en lo Penal, en aquellas circunscripciones en que hay más de uno. Donde no hay más que un Tribunal Penal, por los miembros de la Cámara de Apelaciones en lo Civil, Comercial y Laboral de la respectiva circunscripción;","2) por el Juez en lo Correccional y de Menores de la circunscripción pertinente;","3) por los Jueces de Primera Instancia de la respectiva circunscripción;","4) por los conjueces designados de acuerdo a normas en vigencia."],"s":"1) por los miembros de la otra u otras Salas, por sorteo;"},{"n":54,"t":"Cuando un mismo caso judicial es objeto de resoluciones divergentes por parte de distintas Salas de una misma Cámara, al presentarse posteriormente uno similar, debe ser resuelto por la Cámara en pleno, de acuerdo a las siguientes reglas","p":["Cuando un mismo caso judicial es objeto de resoluciones divergentes por parte de distintas Salas de una misma Cámara, al presentarse posteriormente uno similar, debe ser resuelto por la Cámara en pleno, de acuerdo a las siguientes reglas:","1) el plenario de Cámara puede ser convocado de oficio por la Sala que interviene en el caso que lo motiva;","2) las resoluciones del Tribunal pleno se adoptan por mayoría absoluta de votos y, en caso de empate, se integra por sorteo con un vocal de la otra Cámara;","3) la revisión de fallos plenarios anteriores puede hacerse cuando lo determinan por mayoría absoluta los miembros de la Cámara;","4) la presidencia del plenario de Salas es ejercida por el Presidente de la Cámara y las diligencias procesales se cumplen ante la Sala que conoce en el asunto;","5) cuando las partes alegan sentencias contradictorias, pueden solicitar la unificación de la jurisprudencia, únicamente mediante el recurso de inaplicabilidad de ley ante el Superior Tribunal de Justicia;","6) sin perjuicio de las disposiciones que, sobre el recurso de inaplicabilidad de ley contiene las leyes de la materia, los fallos plenarios son obligatorios para las Salas de la Cámara y para los Jueces de Primera Instancia del fuero."],"s":"1) el plenario de Cámara puede ser convocado de oficio por la Sala que interviene en el caso que lo motiva;"},{"n":55,"t":"Las Cámaras de Apelaciones deben celebrar acuerdos los días…","p":["Las Cámaras de Apelaciones deben celebrar acuerdos los días que el Presidente designe, los que no pueden ser menos de dos (2) por semana, pudiendo fijar otros en caso de urgencia."],"s":"Las Cámaras de Apelaciones deben celebrar acuerdos los días que el Presidente designe, los que no pueden ser menos de dos (2) por semana, pudiendo fijar otros en caso de urgencia."},{"n":56,"t":"Toda causa para sentencia definitiva o interlocutoria debe ser…","p":["Toda causa para sentencia definitiva o interlocutoria debe ser pasada a acuerdo dentro del término que la ley fija para su dictado. Si por exceso de trabajo ello no es posible, la Cámara eleva una nómina de los expedientes demorados al Superior Tribunal de Justicia para que éste fije el término dentro del cual han de llevarse al acuerdo y resolverse dichas causas."],"s":"Toda causa para sentencia definitiva o interlocutoria debe ser pasada a acuerdo dentro del término que la ley fija para su dictado"},{"n":57,"t":"Las Cámaras dictan las disposiciones reglamentarias que han de…","p":["Las Cámaras dictan las disposiciones reglamentarias que han de regir su funcionamiento."],"s":"Las Cámaras dictan las disposiciones reglamentarias que han de regir su funcionamiento."},{"n":58,"t":"Las Salas y las Cámaras de Apelaciones y Tribunales…","p":["Las Salas y las Cámaras de Apelaciones y Tribunales Penales pueden imponer sanciones disciplinarias en los casos y condiciones en que puede hacerlo el Superior Tribunal de Justicia, en la esfera de sus atribuciones en materia de Superintendencia."],"s":"Las Salas y las Cámaras de Apelaciones y Tribunales Penales pueden imponer sanciones disciplinarias en los casos y condiciones en que puede hacerlo el Superior Tribunal de Justicia, en la esfera de sus atribuciones en materia…"},{"n":59,"t":"Actúan ante las Cámaras de Apelaciones el Fiscal y…","p":["Actúan ante las Cámaras de Apelaciones el Fiscal y el Defensor de Cámara, conforme a las disposiciones legales vigentes."],"s":"Actúan ante las Cámaras de Apelaciones el Fiscal y el Defensor de Cámara, conforme a las disposiciones legales vigentes."},{"n":60,"t":"Los Juzgados de Primera Instancia en lo Civil, Comercial,…","p":["Los Juzgados de Primera Instancia en lo Civil, Comercial, de Familia y Laboral, ejercen su Jurisdicción en todas las causas de materia Civil y Comercial, de Familia y Laboral respectivamente, de orden voluntario o contradictorio cuyo conocimiento no está atribuido a otros magistrados."],"s":"Los Juzgados de Primera Instancia en lo Civil, Comercial, de Familia y Laboral, ejercen su Jurisdicción en todas las causas de materia Civil y Comercial, de Familia y Laboral respectivamente, de orden voluntario o…"},{"n":61,"t":"En los asuntos de cualquier naturaleza, de jurisdicción voluntaria,…","p":["En los asuntos de cualquier naturaleza, de jurisdicción voluntaria, los interesados pueden recurrir ante los jueces que eligen, del fuero que corresponde.","En caso que un mismo asunto se plantee ante distintos jueces, el trámite continúa ante aquél que conoció con anterioridad a la causa."],"s":"En los asuntos de cualquier naturaleza, de jurisdicción voluntaria, los interesados pueden recurrir ante los jueces que eligen, del fuero que corresponde."},{"n":62,"t":"Los Juzgados de Primera Instancia de la materia, actúan en condición de Alzada respecto de los Juzgados de Paz de sus respectivas circunscripciones y conocen","p":["Los Juzgados de Primera Instancia de la materia, actúan en condición de Alzada respecto de los Juzgados de Paz de sus respectivas circunscripciones y conocen:","1) de los recursos que se interponen contra las resoluciones de estos últimos, en los casos en que la ley determina, haciendo su fallo ejecutoria;","2) de las quejas por retardo o denegación de justicia;","3) de las cuestiones de competencia que se suscitan entre los distintos Jueces de Paz."],"s":"1) de los recursos que se interponen contra las resoluciones de estos últimos, en los casos en que la ley determina, haciendo su fallo ejecutoria;"},{"n":63,"t":"Los Juzgados de Familia y Violencia Familiar tienen competencia en las siguientes causas establecidas en el Código Civil y Comercial de la Nación","p":["Los Juzgados de Familia y Violencia Familiar tienen competencia en las siguientes causas establecidas en el Código Civil y Comercial de la Nación:","1) Libro Primero - Parte General, Título I, Persona humana, Capítulo 10, SECCIÓN 1ª Representación y asistencia, SECCIÓN 2ª Tutela y SECCIÓN 3ª Curatela;","2) Libro Segundo - Relaciones de Familia, Títulos:","Matrimonio;","Régimen patrimonial del matrimonio;","Uniones convivenciales;","Parentesco;","Filiación;","Adopción;","Responsabilidad parental;","Procesos de familia;","3) toda otra cuestión personal derivada de las relaciones de familia."],"s":"1) Libro Primero - Parte General, Título I, Persona humana, Capítulo 10, SECCIÓN 1ª Representación y asistencia, SECCIÓN 2ª Tutela y SECCIÓN 3ª Curatela;"},{"n":64,"t":"Los Jueces de Familia son subrogados en el siguiente orden","p":["Los Jueces de Familia son subrogados en el siguiente orden:","1) por los jueces de igual competencia de la Primera Circunscripción Judicial;","2) por los Jueces de Primera Instancia en lo Civil y Comercial de la Primera Circunscripción Judicial."],"s":"1) por los jueces de igual competencia de la Primera Circunscripción Judicial;"},{"n":65,"t":"En los procesos que tramitan por ante los Juzgados…","p":["En los procesos que tramitan por ante los Juzgados de Familia creados por la presente ley, no se admite la recusación sin expresión de causa, hasta tanto se implemente el funcionamiento de la totalidad de ellos.","Para los Juzgados de Familia la Segunda Instancia se prosigue ante la Cámara de Apelaciones en lo Civil y Comercial, de Familia, Violencia Familiar y Fiscal Tributaria de la Primera Circunscripción Judicial, hasta el momento de la creación de la Cámara de Familia pertinente."],"s":"En los procesos que tramitan por ante los Juzgados de Familia creados por la presente ley, no se admite la recusación sin expresión de causa, hasta tanto se implemente el funcionamiento de la totalidad de ellos."},{"n":66,"t":"Establécese con respecto a los Juzgados de Instrucción el siguiente orden de subrogancia","p":["Establécese con respecto a los Juzgados de Instrucción el siguiente orden de subrogancia:","1) por los Jueces de Instrucción de la misma circunscripción judicial;","2) por los Jueces en lo Correccional y de Menores de la misma circunscripción;","3) por los Jueces de Primera Instancia de la respectiva circunscripción;","4) por los conjueces designados de acuerdo con normas en vigencia."],"s":"1) por los Jueces de Instrucción de la misma circunscripción judicial;"},{"n":67,"t":"Establécese con respecto a los Juzgados de Instrucción con asiento en la Primera y Segunda Circunscripción Judicial de la Provincia el siguiente orden de subrogancia","p":["Establécese con respecto a los Juzgados de Instrucción con asiento en la Primera y Segunda Circunscripción Judicial de la Provincia el siguiente orden de subrogancia:","1) los Juzgados de Instrucción con asiento en la ciudad de Posadas, se subrogan entre sí hasta agotar el orden, continuando en lo pertinente con la subrogancia preestablecida;","2) el Juzgado de Instrucción con asiento en la ciudad de Apóstoles es subrogado por los Juzgados de Instrucción con asiento en la ciudad de Posadas;","3) el Juzgado de Instrucción con asiento en la ciudad de Leandro N. Alem es subrogado por los Juzgados de Instrucción con asiento en la ciudad de Oberá."],"s":"1) los Juzgados de Instrucción con asiento en la ciudad de Posadas, se subrogan entre sí hasta agotar el orden, continuando en lo pertinente con la subrogancia preestablecida;"},{"n":68,"t":"Establécese como Defensoría de Instrucción la actual Defensoría de…","p":["Establécese como Defensoría de Instrucción la actual Defensoría de Fuero Universal N.º 1 de la Quinta Circunscripción Judicial de la Provincia, con asiento en la ciudad de San Vicente. Cuando deben efectuarse presentaciones ante los magistrados competentes, distintos al Fuero Penal de su circunscripción, son suplidos por la defensoría correspondiente con asiento en la ciudad de Oberá."],"s":"Establécese como Defensoría de Instrucción la actual Defensoría de Fuero Universal N.º 1 de la Quinta Circunscripción Judicial de la Provincia, con asiento en la ciudad de San Vicente"},{"n":69,"t":"La Defensoría de Fuero Universal N.º 1 de la…","p":["La Defensoría de Fuero Universal N.º 1 de la Primera Circunscripción Judicial con asiento en la ciudad de Apóstoles cesa su intervención cuando deban efectuarse presentaciones ante los magistrados competentes de la ciudad de Posadas, en cuyo caso es suplida por la Defensoría correspondiente con asiento en dicha ciudad; a excepción de las correspondientes al Fuero Penal.","Establécese como Defensoría de Instrucción la actual Defensoría de Fuero Universal N.º 2 de la Segunda Circunscripción Judicial de la Provincia, con asiento en la ciudad de Leandro N. Alem.","La Defensoría de Instrucción de la Segunda Circunscripción Judicial con asiento en la ciudad de Leandro N. Alem cesa su intervención cuando deban efectuarse presentaciones ante los magistrados competentes de la ciudad de Oberá, en cuyo caso es suplida por la Defensoría correspondiente con asiento en dicha ciudad; a excepción de las correspondientes al Fuero Penal."],"s":"La Defensoría de Fuero Universal N.º 1 de la Primera Circunscripción Judicial con asiento en la ciudad de Apóstoles cesa su intervención cuando deban efectuarse presentaciones ante los magistrados competentes de la ciudad de…"},{"n":70,"t":"Los Jueces de Primera Instancia en lo Civil y…","p":["Los Jueces de Primera Instancia en lo Civil y Comercial de las distintas circunscripciones judiciales, remiten al Superior Tribunal de Justicia antes del 1 de diciembre de cada año, las listas de abogados, escribanos, procuradores, martilleros públicos, médicos y peritos domiciliados en la jurisdicción, a los fines del artículo 49, inciso 27)."],"s":"Los Jueces de Primera Instancia en lo Civil y Comercial de las distintas circunscripciones judiciales, remiten al Superior Tribunal de Justicia antes del 1 de diciembre de cada año, las listas de abogados, escribanos,…"},{"n":71,"t":"Los Juzgados Correccionales y de Menores son unipersonales y…","p":["Los Juzgados Correccionales y de Menores son unipersonales y están a cargo de jueces letrados que deben reunir las mismas condiciones exigidas en el artículo 139 de la Constitución de la Provincia para los Jueces de Primera Instancia, comprendiéndoles los mismos derechos, garantías y obligaciones que a estos."],"s":"Los Juzgados Correccionales y de Menores son unipersonales y están a cargo de jueces letrados que deben reunir las mismas condiciones exigidas en el artículo 139 de la Constitución de la Provincia para los Jueces de Primera…"},{"n":72,"t":"Los Juzgados Correccionales y de Menores ejercen su jurisdicción…","p":["Los Juzgados Correccionales y de Menores ejercen su jurisdicción en el territorio de la Provincia, de conformidad con lo establecido en la presente ley y con la competencia que les atribuye la respectiva ley en la materia."],"s":"Los Juzgados Correccionales y de Menores ejercen su jurisdicción en el territorio de la Provincia, de conformidad con lo establecido en la presente ley y con la competencia que les atribuye la respectiva ley en la materia."},{"n":73,"t":"La justicia de menor cuantía está a cargo de…","p":["La justicia de menor cuantía está a cargo de los Juzgados de Paz los que, de acuerdo a su importancia se dividen en tres (3) categorías: Primera, Segunda y Tercera."],"s":"La justicia de menor cuantía está a cargo de los Juzgados de Paz los que, de acuerdo a su importancia se dividen en tres (3) categorías: Primera, Segunda y Tercera."},{"n":74,"t":"Desempeñan sus funciones como Juzgado de Paz de Primera…","p":["Desempeñan sus funciones como Juzgado de Paz de Primera Categoría, los ubicados en las ciudades de: Apóstoles, Aristóbulo del Valle, Bernardo de Irigoyen, Candelaria, Capioví, Campo Grande, Campo Ramón, Campo Viera, Cerro Azul, Colonia Wanda, Comandante Andresito, Dos de Mayo, Eldorado, El Soberbio, Garupá, Jardín América, Leandro N. Alem, Montecarlo, Oberá, Posadas, Puerto Esperanza, Puerto Iguazú, Puerto Rico, San Ignacio, San Javier, San Pedro, San Vicente y 25 de Mayo."],"s":"Desempeñan sus funciones como Juzgado de Paz de Primera Categoría, los ubicados en las ciudades de: Apóstoles, Aristóbulo del Valle, Bernardo de Irigoyen, Candelaria, Capioví, Campo Grande, Campo Ramón, Campo Viera, Cerro…"},{"n":75,"t":"Funcionan como Juzgado de Paz de Segunda Categoría los…","p":["Funcionan como Juzgado de Paz de Segunda Categoría los ubicados en las localidades de: Azara, Bonpland, Caraguatay, Colonia Aurora, Concepción de la Sierra, Corpus Christi, El Alcázar, Fracrán, Garuhapé, Gobernador Roca, Panambí, Pozo Azul, Puerto Libertad, Puerto Piray, Salto Encantado, San Antonio, San José, Santa Ana, Santo Pipó, Ruiz de Montoya y Villa Bonita."],"s":"Funcionan como Juzgado de Paz de Segunda Categoría los ubicados en las localidades de: Azara, Bonpland, Caraguatay, Colonia Aurora, Concepción de la Sierra, Corpus Christi, El Alcázar, Fracrán, Garuhapé, Gobernador Roca,…"},{"n":76,"t":"Funcionan como Juzgados de Paz de Tercera Categoría, los…","p":["Funcionan como Juzgados de Paz de Tercera Categoría, los ubicados en las localidades de: Alba Posse, Almafuerte, Arroyo del Medio, Caá Yarí, Cerro Corá, Colonia Alberdi, Colonia Delicia, Colonia Guaraní, Colonia Polana, Colonia Victoria, Dos Arroyos, Fachinal, Florentino Ameghino, General Alvear, General Urquiza, Gobernador López, Hipólito Yrigoyen, Itacaruaré, Loreto, Los Helechos, Mártires, Mojón Grande, Olegario V. Andrade, Profundidad, Puerto Leoni, San Martín, Santa María, Santiago de Liniers, Tres Capones, y 9 de Julio."],"s":"Funcionan como Juzgados de Paz de Tercera Categoría, los ubicados en las localidades de: Alba Posse, Almafuerte, Arroyo del Medio, Caá Yarí, Cerro Corá, Colonia Alberdi, Colonia Delicia, Colonia Guaraní, Colonia Polana,…"},{"n":77,"t":"En la ciudad Capital de la Provincia de Misiones…","p":["En la ciudad Capital de la Provincia de Misiones funcionan cinco (5) Juzgados de Paz de Primera Categoría. El Juzgado de Paz en lo Contravencional tiene competencia en las causas contravencionales por infracciones previstas en la Ley XIV – N.º 5 (Antes Ley 2800), Código de Faltas de la Provincia y en la extensión de certificaciones en general.","El Juzgado de Paz en lo Civil y Comercial N.º 1 y el Juzgado de Paz en lo Civil y Comercial N.º 2, tienen competencia en los asuntos contenciosos civiles y comerciales, demandas reconvencionales de acuerdo a lo previsto en el artículo 82 y acuerdos verbales."],"s":"En la ciudad Capital de la Provincia de Misiones funcionan cinco (5) Juzgados de Paz de Primera Categoría"},{"n":78,"t":"La competencia territorial de cada Juzgado de Paz está…","p":["La competencia territorial de cada Juzgado de Paz está determinada por los límites del municipio donde tiene su asiento o por la que se le asigna por leyes especiales."],"s":"La competencia territorial de cada Juzgado de Paz está determinada por los límites del municipio donde tiene su asiento o por la que se le asigna por leyes especiales."},{"n":79,"t":"La competencia en razón del monto se ajusta a…","p":["La competencia en razón del monto se ajusta a lo previsto en la Ley XII – N.º 7 (Antes Ley 2516)."],"s":"La competencia en razón del monto se ajusta a lo previsto en la Ley XII – N.º 7 (Antes Ley 2516)."},{"n":80,"t":"La competencia en razón del turno, donde funcione más…","p":["La competencia en razón del turno, donde funcione más de un Juzgado de Paz es determinada por el Superior Tribunal de Justicia."],"s":"La competencia en razón del turno, donde funcione más de un Juzgado de Paz es determinada por el Superior Tribunal de Justicia."},{"n":81,"t":"Los Juzgados de Paz de Primera Categoría conocen","p":["Los Juzgados de Paz de Primera Categoría conocen:","1) en los asuntos contenciosos civiles, comerciales y medidas cautelares, de acuerdo al monto que se establece, y en los laborales en los casos del artículo 189 de la Ley XIII – N.º 2. En los juicios laborales de pago por consignación, conocen sólo en los casos en que no se encuentra controvertido el derecho del acreedor demandado, aunque el monto es menor al establecido en el artículo 189 de la Ley XIII – N.º 2;","2) en las demandas reconvencionales siempre que el monto total que sea materia del juicio no exceda de la suma establecida para su competencia;","3) en las infracciones previstas en el Código de Faltas, Ordenanzas Municipales y todo otro asunto que determinan las leyes especiales y en los que no es necesaria la intervención del Ministerio Fiscal;","4) en cuestiones que se suscitan entre vecinos, el Juez de Paz puede intervenir a petición de parte mediante el procedimiento gratuito de audiencia verbal, utilizando métodos alternativos de resolución de conflictos, especialmente la conciliación y mediación, aplicándose estos medios alternativos de resolución en las cuestiones cuyo reclamo patrimonial no supera el monto establecido de acuerdo a lo dispuesto en el inciso 1) del presente artículo;","5) en los procesos sucesorios, testamentarios o ab intestato, cuando el valor del acervo hereditario no supera la suma que determina el Superior Tribunal de Justicia, teniendo en cuenta el valor fiscal en el caso de los inmuebles y el valor corriente en plaza en el caso de muebles y semovientes, en cuyo caso se presenta declaración jurada al iniciarse el proceso.","Si del inventario y avalúo practicado, resulta que los bienes de la sucesión tienen un valor mayor al establecido por este inciso, el Juez se declara incompetente y remite los antecedentes, previa notificación a las partes, al Juez en lo Civil y Comercial que resulte competente, proveyendo a la seguridad y conservación de los bienes del causante previo inventario. Para la tramitación de estos procesos se aplican las disposiciones que al respecto establece el Código Procesal, Civil, Comercial, de Familia y Violencia Familiar de la Provincia;","6) en las demandas de desalojo por ocupaciones precarias, no emergentes de contratos de locación, cuando la valuación fiscal del inmueble no excede de la suma que el Superior Tribunal de Justicia determina; y en demandas de desalojos relativas a locaciones, cuando las sumas de alquileres adeudados no superan el monto establecido por el Superior Tribunal de Justicia;","7) en las cuestiones de violencia familiar y menores en riesgo, cuando se requiere de medidas cautelares de extrema urgencia para la protección de las personas y siempre que el hecho se produzca fuera del radio del Juzgado de Familia o con competencia en materia de familia o en materia de violencia familiar, el Juez de Paz local debe tomar las medidas que dispone la Ley XIV – N.° 6 (Antes Ley 3325), debiendo remitir dentro de los dos (2) días las actuaciones al Juez competente. En los casos que prima facie se encuentra acreditado el incumplimiento de las medidas dispuestas en los incisos 1), 2), 3) y 8) del artículo 4 de la Ley XIV – N.° 6 (Antes Ley 3325), el Juez que las ordena puede decretar el arresto del denunciado, poniéndolo a disposición conjuntamente con las actuaciones al Juez Penal en turno, en un plazo no mayor de veinticuatro (24) horas, a sus efectos;","8) llevar a conocimiento del Ministerio Pupilar los casos de orfandad, abandono material o peligro moral de los menores, sin perjuicio de las medidas de urgencia que él pueda adoptar;","9) homologación de acuerdos transaccionales alcanzados en actuaciones escritas o verbales;","10) toda medida de carácter urgente de protección de personas o que importa el cumplimiento de deberes o facultades atribuidas por otras leyes con la debida e inmediata comunicación al Juez y al Defensor Oficial competente;","11) otorgar permisos o certificar autorizaciones a menores para viajar a otras provincias o al exterior;","12) solicitar el auxilio de la Fuerza Pública cuando es necesaria para el cumplimiento de sus funciones;","13) cooperar con los organismos competentes en la protección y preservación del medio ambiente;","14) en cuestiones municipales, entiende en los juicios de apremio hasta el monto que determina el Superior Tribunal de Justicia;","15) en las cuestiones en que supera la competencia del Juzgado y se tratan de personas de escasos recursos, el Juez actúa facilitando las medidas con el Defensor Oficial que corresponde;","16) en los asuntos que se les atribuyen por otras leyes."],"s":"1) en los asuntos contenciosos civiles, comerciales y medidas cautelares, de acuerdo al monto que se establece, y en los laborales en los casos del artículo 189 de la Ley XIII – N.º 2. En los juicios laborales de pago por…"},{"n":82,"t":"Son atribuciones de los Juzgados de Paz de Segunda…","p":["Son atribuciones de los Juzgados de Paz de Segunda Categoría entender en todos los asuntos determinados en el artículo anterior, limitándose su competencia a las sumas que establece el Superior Tribunal de Justicia."],"s":"Son atribuciones de los Juzgados de Paz de Segunda Categoría entender en todos los asuntos determinados en el artículo anterior, limitándose su competencia a las sumas que establece el Superior Tribunal de Justicia."},{"n":83,"t":"Son atribuciones de los Juzgados de Paz de Tercera…","p":["Son atribuciones de los Juzgados de Paz de Tercera Categoría entender en todos los asuntos establecidos en el artículo 81, limitándose su competencia a las sumas que establece el Superior Tribunal de Justicia."],"s":"Son atribuciones de los Juzgados de Paz de Tercera Categoría entender en todos los asuntos establecidos en el artículo 81, limitándose su competencia a las sumas que establece el Superior Tribunal de Justicia."},{"n":84,"t":"Los Juzgados de Paz no conocen de los juicios…","p":["Los Juzgados de Paz no conocen de los juicios de interdictos; quiebras, concursos preventivos y todos aquellos que versan sobre derechos reales relativos a bienes inmuebles."],"s":"Los Juzgados de Paz no conocen de los juicios de interdictos; quiebras, concursos preventivos y todos aquellos que versan sobre derechos reales relativos a bienes inmuebles."},{"n":85,"t":"Para la determinación del valor del pleito se toman…","p":["Para la determinación del valor del pleito se toman en cuenta los intereses y frutos devengados hasta la fecha de la demanda, sin considerarse las costas que se causen en el litigio.","Cuando las acciones son varias, la suma de todos los créditos fija el valor de la causa."],"s":"Para la determinación del valor del pleito se toman en cuenta los intereses y frutos devengados hasta la fecha de la demanda, sin considerarse las costas que se causen en el litigio."},{"n":86,"t":"En ningún caso los Juzgados de Paz son competentes…","p":["En ningún caso los Juzgados de Paz son competentes para intervenir en causas que se inician contra el Estado Provincial."],"s":"En ningún caso los Juzgados de Paz son competentes para intervenir en causas que se inician contra el Estado Provincial."},{"n":87,"t":"El procedimiento ante la Justicia de Paz se ajusta…","p":["El procedimiento ante la Justicia de Paz se ajusta a las normas previstas en la Ley XII – N.º 7 (Antes Ley 2516)."],"s":"El procedimiento ante la Justicia de Paz se ajusta a las normas previstas en la Ley XII – N.º 7 (Antes Ley 2516)."},{"n":88,"t":"Establécese la Justicia de Paz Letrada para los Juzgados…","p":["Establécese la Justicia de Paz Letrada para los Juzgados de Paz de Primera y Segunda Categoría de la Provincia de Misiones.","Para ser Juez de Paz de Primera y Segunda Categoría se requiere, además de las condiciones generales establecidas en el artículo 24, poseer título de abogado expedido por universidad argentina o extranjera legítimamente admitido por la Nación.","Los cargos en los juzgados ya existentes se van cubriendo a medida que las vacantes se producen. El Superior Tribunal de Justicia puede dictar las normas de funcionamiento a los efectos de realizar las adecuaciones necesarias para el cumplimiento de lo dispuesto en la presente ley.","Para ejercer el cargo de Juez de Paz no letrado, se requieren las siguientes condiciones: ser mayor de edad, argentino por nacimiento o por ciudadanía, tener una residencia continua de más de cinco (5) años en el municipio por el cual es propuesto y poseer título oficial de nivel terciario o secundario. Esta última condición puede ser reemplazada con certificado de tareas en la Administración Pública, sea nacional, provincial o municipal, y por un lapso de más de cinco (5) años."],"s":"Establécese la Justicia de Paz Letrada para los Juzgados de Paz de Primera y Segunda Categoría de la Provincia de Misiones."},{"n":89,"t":"Si en la terna remitida por la autoridad municipal…","p":["Si en la terna remitida por la autoridad municipal en las condiciones de los artículos 91 y 92, figura un candidato con título oficial vinculado con la Ciencia Jurídica, esta circunstancia debe ser priorizada por el Superior Tribunal de Justicia para el pertinente nombramiento."],"s":"Si en la terna remitida por la autoridad municipal en las condiciones de los artículos 91 y 92, figura un candidato con título oficial vinculado con la Ciencia Jurídica, esta circunstancia debe ser priorizada por el Superior…"},{"n":90,"t":"No pueden ejercer el cargo de Juez de Paz no letrado","p":["No pueden ejercer el cargo de Juez de Paz no letrado:","1) los que son condenados por delitos dolosos dentro o fuera de la Provincia;","2) los fallidos mientras no son rehabilitados;","3) los inhabilitados judicialmente de conformidad con lo dispuesto por el artículo 48 del Código Civil y Comercial de la Nación."],"s":"1) los que son condenados por delitos dolosos dentro o fuera de la Provincia;"},{"n":91,"t":"Para designar Jueces de Paz no letrados titulares o…","p":["Para designar Jueces de Paz no letrados titulares o suplentes, de cualquier categoría, el Superior Tribunal de Justicia, dentro de los diez (10) días de producida la vacante o creado un cargo, debe solicitar a la municipalidad pertinente, la remisión de la terna ordenada por el artículo 150 de la Constitución Provincial."],"s":"Para designar Jueces de Paz no letrados titulares o suplentes, de cualquier categoría, el Superior Tribunal de Justicia, dentro de los diez (10) días de producida la vacante o creado un cargo, debe solicitar a la municipalidad…"},{"n":92,"t":"La autoridad municipal requerida a los fines del artículo…","p":["La autoridad municipal requerida a los fines del artículo anterior, dentro de los treinta (30) días, debe remitir al Superior Tribunal de Justicia, la disposición municipal indicando la terna propuesta para cubrir los cargos."],"s":"La autoridad municipal requerida a los fines del artículo anterior, dentro de los treinta (30) días, debe remitir al Superior Tribunal de Justicia, la disposición municipal indicando la terna propuesta para cubrir los cargos."},{"n":93,"t":"El Superior Tribunal de Justicia, recibida la disposición conteniendo…","p":["El Superior Tribunal de Justicia, recibida la disposición conteniendo la terna de candidatos, dentro de los treinta (30) días, procede a nombrar al Juez de Paz titular o suplente, eligiéndolos, indefectiblemente, de la terna propuesta por la autoridad municipal, sin perjuicio de observarse el cumplimiento sobre inhabilidades e incompatibilidades existentes."],"s":"El Superior Tribunal de Justicia, recibida la disposición conteniendo la terna de candidatos, dentro de los treinta (30) días, procede a nombrar al Juez de Paz titular o suplente, eligiéndolos, indefectiblemente, de la terna…"},{"n":94,"t":"En caso de impedimento, licencia, recusación o excusación de…","p":["En caso de impedimento, licencia, recusación o excusación de un Juez de Paz titular, es reemplazado por el Juez de Paz suplente, cuya designación y requisitos son los mismos del titular. En caso de que ninguno de los dos pueda intervenir, entienden el Juez de Paz más próximo, a quien se remiten los autos de conformidad con la reglamentación que dicte el Superior Tribunal de Justicia.","Sólo se designa Juez de Paz suplente en aquellas ciudades o localidades en las que solamente hay un Juez de Paz titular. En donde existen dos (2) o más, la suplencia prevista para los casos del párrafo anterior, se efectúa recíprocamente por los Jueces de Paz titulares en la forma que dispone la reglamentación que dicta el Superior Tribunal de Justicia.","La función de Juez de Paz suplente es carga pública y quien la desempeña tiene derecho a percibir la compensación equivalente a la remuneración del titular, por el tiempo que ejerce la función."],"s":"En caso de impedimento, licencia, recusación o excusación de un Juez de Paz titular, es reemplazado por el Juez de Paz suplente, cuya designación y requisitos son los mismos del titular"},{"n":95,"t":"Corresponde al Presidente del Superior Tribunal de Justicia","p":["Corresponde al Presidente del Superior Tribunal de Justicia:","1) representar al Poder Judicial en todo acto oficial;","2) representar al Tribunal y mantener las relaciones de éste con los demás poderes, miembros de la Administración de Justicia y reparticiones públicas;","3) ejecutar o hacer ejecutar las resoluciones del Cuerpo, relativas a la Superintendencia y adoptar las medidas necesarias para el mejor servicio judicial, dando cuenta al Tribunal en primer acuerdo;","4) proponer las medidas del carácter indicado que juzga oportunas;","5) expedir las comunicaciones del Tribunal;","6) velar por el orden y economía internos del Tribunal, vigilancia y cumplimiento de sus deberes por parte de los funcionarios y empleados del mismo;","7) presidir los acuerdos del Cuerpo y las audiencias que el mismo concede;","8) recibir el juramento de ley a magistrados, funcionarios y empleados de la Administración de Justicia y auxiliares de la misma;","9) ejercer la autoridad y policía en la casa de justicia y la Dirección Administrativa de toda la organización judicial, velando por el estricto cumplimiento de los reglamentos, resoluciones, acordadas, pudiendo en tales casos adoptar las medidas necesarias o requerir el auxilio de la fuerza pública;","10) mantener bajo su inmediata supervisión las Secretarías Administrativas y de Superintendencia y Judicial, Dirección de Administración; Bi
