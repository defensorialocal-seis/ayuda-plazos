 General de los Tribunales, que en este caso tienen por asiento las ciudades cabeceras de las circunscripciones judiciales ubicadas en el interior de la Provincia y dependen jerárquicamente de las autoridades centrales con asiento en la ciudad Capital."],"s":"El Reglamento para el Poder Judicial y la Ley de Presupuesto, determinan la dotación de funcionarios y empleados del Archivo General de los Tribunales que colaboran con el Director como asimismo dispone el primero, si lo cree…"},{"n":182,"t":"Al procederse a la incineración o destrucción, se labra…","p":["Al procederse a la incineración o destrucción, se labra un acta en el libro de incineraciones o destrucciones de expedientes que se lleva al efecto, consignándose en ella la nómina de expedientes incinerados o destruidos y fecha de la sentencia dictada en cada uno de ellos. Previamente a la destrucción el Archivo practica las anotaciones que corresponden en los libros pertinentes."],"s":"Al procederse a la incineración o destrucción, se labra un acta en el libro de incineraciones o destrucciones de expedientes que se lleva al efecto, consignándose en ella la nómina de expedientes incinerados o destruidos y…"},{"n":183,"t":"En cada una de las circunscripciones judiciales funciona un…","p":["En cada una de las circunscripciones judiciales funciona un Registro de Mandatos, Actos y Contratos. El Reglamento para el Poder Judicial determina su asiento en un Juzgado de Primera Instancia que atienda el fuero civil en cada una de las aludidas circunscripciones y está a cargo del Juez Titular del juzgado que se designa."],"s":"En cada una de las circunscripciones judiciales funciona un Registro de Mandatos, Actos y Contratos"},{"n":184,"t":"Deben inscribirse en dicho Registro todo acto, contrato o…","p":["Deben inscribirse en dicho Registro todo acto, contrato o instrumento público o privado, que no es de carácter comercial, otorgado dentro o fuera de la Provincia, que se refieren a mandato, tutela, curatela, autorización judicial, venias maritales, limitación de administraciones legales o contractuales, constitución de sociedades civiles y sus disoluciones, como asimismo la revocatoria, renuncia, suspensión o modificación de dichos actos, quedando exceptuados de la inscripción los poderes para ejercer la representación en juicio."],"s":"Deben inscribirse en dicho Registro todo acto, contrato o instrumento público o privado, que no es de carácter comercial, otorgado dentro o fuera de la Provincia, que se refieren a mandato, tutela, curatela, autorización…"},{"n":185,"t":"Sin perjuicio de lo dispuesto en el artículo 363…","p":["Sin perjuicio de lo dispuesto en el artículo 363 del Código Civil y Comercial y de los otros medios de prueba autorizados por las leyes, el registro a que se refiere el artículo 184 basta para justificar el contrato de mandato y sus modificaciones posteriores."],"s":"Sin perjuicio de lo dispuesto en el artículo 363 del Código Civil y Comercial y de los otros medios de prueba autorizados por las leyes, el registro a que se refiere el artículo 184 basta para justificar el contrato de mandato…"},{"n":186,"t":"El Registro organiza y lleva además, un registro de…","p":["El Registro organiza y lleva además, un registro de juicios universales, donde se inscriben en orden alfabético y cronológicamente, todos los juicios de protocolización de testamentos, sucesiones testamentarias y ab intestato, observándose las disposiciones que al respecto dicta el Superior Tribunal de Justicia."],"s":"El Registro organiza y lleva además, un registro de juicios universales, donde se inscriben en orden alfabético y cronológicamente, todos los juicios de protocolización de testamentos, sucesiones testamentarias y ab intestato,…"},{"n":187,"t":"El Registro funciona conforme a las normas del Código…","p":["El Registro funciona conforme a las normas del Código Civil y Comercial de la Nación y de procedimiento, a lo que establece esta ley y las normas reglamentarias pertinentes."],"s":"El Registro funciona conforme a las normas del Código Civil y Comercial de la Nación y de procedimiento, a lo que establece esta ley y las normas reglamentarias pertinentes."},{"n":188,"t":"El Registro se divide en secciones, debiendo llevar como mínimo los siguientes libros","p":["El Registro se divide en secciones, debiendo llevar como mínimo los siguientes libros:","1) Protocolo de mandatos;","2) Protocolo de contratos;","3) Protocolo de autorizaciones, reservas legales, venias maritales, tutelas, curatelas, fianzas y otros actos similares;","4) Protocolo de otros actos jurídicos determinados por ley."],"s":"1) Protocolo de mandatos;"},{"n":189,"t":"La Inspección de Justicia de Paz es el órgano…","p":["La Inspección de Justicia de Paz es el órgano de enlace entre el Superior Tribunal de Justicia y los juzgados de menor cuantía de la Provincia. Funciona en la ciudad Capital y depende directamente del mencionado tribunal por intermedio de la Secretaría Administrativa y de Superintendencia. Su funcionamiento se ajusta a lo que dispone el Reglamento para el Poder Judicial."],"s":"La Inspección de Justicia de Paz es el órgano de enlace entre el Superior Tribunal de Justicia y los juzgados de menor cuantía de la Provincia"},{"n":190,"t":"Son funciones específicas de este organismo","p":["Son funciones específicas de este organismo:","1) velar por el normal funcionamiento de los Juzgados de Paz y el debido cumplimiento de las disposiciones legales y reglamentarias que lo rigen;","2) realizar visitas de inspección a los juzgados de su dependencia;","3) reunir periódicamente a los Jueces de Paz titulares de cada circunscripción judicial, en la ciudad asiento de los Juzgados de Primera Instancia, a los fines de impartir instrucciones y explicar normas de procedimiento;","4) efectuar toda otra actividad que determina el Reglamento para el Poder Judicial."],"s":"1) velar por el normal funcionamiento de los Juzgados de Paz y el debido cumplimiento de las disposiciones legales y reglamentarias que lo rigen;"},{"n":191,"t":"Para ser designado Jefe se requiere además de las…","p":["Para ser designado Jefe se requiere además de las condiciones establecidas en el artículo 24, poseer título de abogado, escribano o procurador expedido por universidad nacional o legalmente admitido por la Nación.","Para ser Subjefe es necesario reunir los mismos requisitos exigidos a los Jueces de Paz de primera categoría."],"s":"Para ser designado Jefe se requiere además de las condiciones establecidas en el artículo 24, poseer título de abogado, escribano o procurador expedido por universidad nacional o legalmente admitido por la Nación."},{"n":192,"t":"La Biblioteca del Poder Judicial está formada por una…","p":["La Biblioteca del Poder Judicial está formada por una Dirección con asiento en la ciudad Capital de la Provincia y Secciones locales en cada una de las circunscripciones judiciales."],"s":"La Biblioteca del Poder Judicial está formada por una Dirección con asiento en la ciudad Capital de la Provincia y Secciones locales en cada una de las circunscripciones judiciales."},{"n":193,"t":"El Superior Tribunal de Justicia ejerce la supervisión de…","p":["El Superior Tribunal de Justicia ejerce la supervisión de la Biblioteca del Poder Judicial, directamente sobre la Dirección y esta sobre las Secciones de cada circunscripción."],"s":"El Superior Tribunal de Justicia ejerce la supervisión de la Biblioteca del Poder Judicial, directamente sobre la Dirección y esta sobre las Secciones de cada circunscripción."},{"n":194,"t":"El Reglamento para el Poder Judicial determina las condiciones…","p":["El Reglamento para el Poder Judicial determina las condiciones para desempeñar el cargo de Director y los cargos de Jefes de las Secciones de Biblioteca."],"s":"El Reglamento para el Poder Judicial determina las condiciones para desempeñar el cargo de Director y los cargos de Jefes de las Secciones de Biblioteca."},{"n":195,"t":"La Biblioteca del Poder Judicial con sus respectivas Secciones…","p":["La Biblioteca del Poder Judicial con sus respectivas Secciones funcionan conforme las normas reglamentarias que al efecto dicta el Superior Tribunal."],"s":"La Biblioteca del Poder Judicial con sus respectivas Secciones funcionan conforme las normas reglamentarias que al efecto dicta el Superior Tribunal."},{"n":196,"t":"La Biblioteca del Poder Judicial provee, dentro de los…","p":["La Biblioteca del Poder Judicial provee, dentro de los límites que permite la Ley de Presupuesto, a los juzgados y tribunales letrados, libros de consulta afines con el respectivo fuero y competencia. Estos libros deben estar bajo custodia del Secretario que cada Juez determina. El contralor de su existencia y estado se efectúa conforme lo determina el Reglamento para el Poder Judicial."],"s":"La Biblioteca del Poder Judicial provee, dentro de los límites que permite la Ley de Presupuesto, a los juzgados y tribunales letrados, libros de consulta afines con el respectivo fuero y competencia"},{"n":197,"t":"Además de sus funciones como Director de Biblioteca, este…","p":["Además de sus funciones como Director de Biblioteca, este funcionario tiene a su cargo la compilación y sistematización de la jurisprudencia del Superior Tribunal de Justicia, de las Cámaras de Apelaciones y de los Tribunales Penales, así como también su eventual publicación en revistas o repertorios jurídicos, sujetándose a las normas que a ese efecto dicte el Superior Tribunal de Justicia."],"s":"Además de sus funciones como Director de Biblioteca, este funcionario tiene a su cargo la compilación y sistematización de la jurisprudencia del Superior Tribunal de Justicia, de las Cámaras de Apelaciones y de los Tribunales…"},{"n":198,"t":"Cuando el Superior Tribunal de Justicia lo cree conveniente…","p":["Cuando el Superior Tribunal de Justicia lo cree conveniente y la Ley de Presupuesto lo permite, puede editarse una publicación periódica oficial en la que se insertan las acordadas y resoluciones que dicte aquel y son de interés general; datos estadísticos del movimiento de la administración de justicia, nombramientos efectuados, listas de conjueces, martilleros y otros profesionales de la Administración de Justicia, así también como la jurisprudencia de los tribunales de la Provincia y artículos de índole doctrinaria."],"s":"Cuando el Superior Tribunal de Justicia lo cree conveniente y la Ley de Presupuesto lo permite, puede editarse una publicación periódica oficial en la que se insertan las acordadas y resoluciones que dicte aquel y son de…"},{"n":199,"t":"El Cuerpo Médico Forense se integra con los médicos…","p":["El Cuerpo Médico Forense se integra con los médicos forenses designados en cada una de las circunscripciones judiciales de la Provincia, quienes deben reunir los requisitos exigidos en el artículo 24. Asimismo, deben poseer título profesional expedido por universidad argentina o debidamente revalidado y se prefiere a los que acreditan título de médico legista, psiquiátrico o alienista, siendo el primero de estos últimos imprescindibles para ejercer el cargo de Médico Jefe.","Son designados por el Superior Tribunal de Justicia y gozan de la asignación mensual que determina la Ley de Presupuesto. Duran en sus funciones mientras observan buena conducta y sólo pueden ser removidos por el Superior Tribunal de Justicia por falta grave cometida en el desempeño de sus funciones conforme lo prescripto en el artículo 49 incisos","10) y 11)."],"s":"El Cuerpo Médico Forense se integra con los médicos forenses designados en cada una de las circunscripciones judiciales de la Provincia, quienes deben reunir los requisitos exigidos en el artículo 24"},{"n":200,"t":"Autorízase al Cuerpo Médico Forense para que, a través…","p":["Autorízase al Cuerpo Médico Forense para que, a través del Superior Tribunal de Justicia, propicie la suscripción de convenios prácticos y de cooperación científica con el Poder Ejecutivo Provincial, Universidad Nacional de Misiones y demás instituciones públicas o privadas, a fin de contar con una adecuada infraestructura y con los medios indispensables para su eficaz funcionamiento."],"s":"Autorízase al Cuerpo Médico Forense para que, a través del Superior Tribunal de Justicia, propicie la suscripción de convenios prácticos y de cooperación científica con el Poder Ejecutivo Provincial, Universidad Nacional de…"},{"n":201,"t":"La Jefatura y Subjefatura del Cuerpo Médico están a…","p":["La Jefatura y Subjefatura del Cuerpo Médico están a cargo de médicos en calidad de Jefe y Subjefe respectivamente, quienes quedan sujetos a la Superintendencia del Superior Tribunal de Justicia y a las normas reglamentarias que a tal efecto éste dicta."],"s":"La Jefatura y Subjefatura del Cuerpo Médico están a cargo de médicos en calidad de Jefe y Subjefe respectivamente, quienes quedan sujetos a la Superintendencia del Superior Tribunal de Justicia y a las normas reglamentarias…"},{"n":202,"t":"Los deberes y atribuciones del Cuerpo Médico Forense son…","p":["Los deberes y atribuciones del Cuerpo Médico Forense son establecidos, vía reglamentaria, por el Superior Tribunal de Justicia."],"s":"Los deberes y atribuciones del Cuerpo Médico Forense son establecidos, vía reglamentaria, por el Superior Tribunal de Justicia."},{"n":203,"t":"El Cuerpo Médico Forense determina, de acuerdo a las exigencias y especialidades para el cumplimiento de sus fines, el funcionamiento de las áreas que a continuación se consignan","p":["El Cuerpo Médico Forense determina, de acuerdo a las exigencias y especialidades para el cumplimiento de sus fines, el funcionamiento de las áreas que a continuación se consignan:","1) Psiquiatría;","2) Tanatología;","3) Toxicología;","4) Ginecología."],"s":"1) Psiquiatría;"},{"n":204,"t":"Las autopsias, los reconocimientos médicos y los informes policiales…","p":["Las autopsias, los reconocimientos médicos y los informes policiales decretados de oficio o a petición fiscal, son efectuados por los médicos forenses exclusivamente en las causas criminales. Por razones de pobreza pueden ser designados, cuando las partes lo solicitan, en juicios civiles, comerciales y del trabajo."],"s":"Las autopsias, los reconocimientos médicos y los informes policiales decretados de oficio o a petición fiscal, son efectuados por los médicos forenses exclusivamente en las causas criminales"},{"n":205,"t":"También pueden utilizarse supletoriamente, en casos de urgencia, los…","p":["También pueden utilizarse supletoriamente, en casos de urgencia, los servicios médicos de Policía o Salud Pública de la Provincia o de las municipalidades, cuyos servicios en estos casos son ad honorem, debiendo prestar el juramento legal a los fines del cumplimiento de la pericia o diligencia encomendada."],"s":"También pueden utilizarse supletoriamente, en casos de urgencia, los servicios médicos de Policía o Salud Pública de la Provincia o de las municipalidades, cuyos servicios en estos casos son ad honorem, debiendo prestar el…"},{"n":206,"t":"Los médicos forenses se suplen recíprocamente y en su…","p":["Los médicos forenses se suplen recíprocamente y en su defecto por el médico de Policía u otro de Salud Pública de la Provincia o de las municipalidades."],"s":"Los médicos forenses se suplen recíprocamente y en su defecto por el médico de Policía u otro de Salud Pública de la Provincia o de las municipalidades."},{"n":207,"t":"Los médicos forenses no pueden reclamar honorarios en los…","p":["Los médicos forenses no pueden reclamar honorarios en los asuntos en que intervienen por nombramiento de oficio o en aquellos en que el fisco es parte.","Tienen el libre ejercicio de la profesión."],"s":"Los médicos forenses no pueden reclamar honorarios en los asuntos en que intervienen por nombramiento de oficio o en aquellos en que el fisco es parte."},{"n":208,"t":"Los médicos forenses de la Primera Circunscripción Judicial con…","p":["Los médicos forenses de la Primera Circunscripción Judicial con el Médico Jefe, constituyen en las pertinentes oportunidades las juntas médicas para dictaminar en los casos en que es necesario ese requisito de acuerdo a las normas reglamentarias que se dictan."],"s":"Los médicos forenses de la Primera Circunscripción Judicial con el Médico Jefe, constituyen en las pertinentes oportunidades las juntas médicas para dictaminar en los casos en que es necesario ese requisito de acuerdo a las…"},{"n":209,"t":"El Superior Tribunal de Justicia dicta las disposiciones reglamentarias…","p":["El Superior Tribunal de Justicia dicta las disposiciones reglamentarias que en cada caso autoriza la presente ley y aquellas que considera necesarias para el mejor cumplimiento de la misma."],"s":"El Superior Tribunal de Justicia dicta las disposiciones reglamentarias que en cada caso autoriza la presente ley y aquellas que considera necesarias para el mejor cumplimiento de la misma."},{"n":210,"t":"Los actuales titulares de cargos de cualquier naturaleza o…","p":["Los actuales titulares de cargos de cualquier naturaleza o categoría para los cuales esta ley exige mayores requisitos o condiciones de título, nacionalidad de que los que aquellos poseen, continúan en sus funciones sin perjuicio de que los que oportunamente los reemplacen deban ajustarse a lo que en la presente se dispone."],"s":"Los actuales titulares de cargos de cualquier naturaleza o categoría para los cuales esta ley exige mayores requisitos o condiciones de título, nacionalidad de que los que aquellos poseen, continúan en sus funciones sin…"},{"n":211,"t":"Regístrese, comuníquese, dése a publicidad","p":["Regístrese, comuníquese, dése a publicidad. Cumplido, archívese."],"s":"Regístrese, comuníquese, dése a publicidad"}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),N=D.nodes,A=D.arts,MAX=A.length,$=s=>document.querySelector(s),main=$('#main'),side=$('#side');

const xref=s=>s.replace(/\b(art[íi]culos?\s+(?:N\.?\s?[º°]\s*)?)(\d{1,3})\b/gi,(m,p,n)=>+n>=1&&+n<=MAX?`${p}<a class="x" href="#/a/${n}">${n}</a>`:m);

N.forEach((n,i)=>{n.i=i;n.ch=[]});N.forEach(n=>{if(n.par>=0)N[n.par].ch.push(n.i)});
const nodeOf={};N.forEach(n=>n.arts.forEach(x=>nodeOf[x]=n.i));
const sub=i=>{const n=N[i];if(n._s)return n._s;let r=[...n.arts];n.ch.forEach(c=>r=r.concat(sub(c)));return n._s=r.sort((a,b)=>a-b)};
const libros=N.filter(n=>n.lv==1),root=i=>{while(N[i].par>=0)i=N[i].par;return i};
const col=i=>PAL[libros.indexOf(N[root(i)])%PAL.length][0],bg=i=>PAL[libros.indexOf(N[root(i)])%PAL.length][1];
const roman=s=>/^[IVXL]+$/i.test(s)?s.toUpperCase():tc(s);
const label=n=>n.kind+' '+roman(n.num);
const title=n=>tc(n.name)||label(n);
const rng=i=>{const s=sub(i);return s.length?(s[0]==s[s.length-1]?'Art. '+s[0]:`Arts. ${s[0]}–${s[s.length-1]}`):''};
const PL={Capítulo:'capítulos'};
const rub=a=>a.t||'Artículo '+a.n;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('No se pudo copiar'));

/* plazos: se detectan en el texto de cada artículo */
const ORD=/\b(segundo|tercer[o]?|cuarto|quinto)\s+d[ií]a/gi,OV={segundo:2,tercer:3,tercero:3,cuarto:4,quinto:5};
const PZ=/\((\d+)\)\s+(d[ií]as(?:\s+h[aá]biles|\s+corridos)?|d[ií]a|meses|mes|a[ñn]os|a[ñn]o|horas|hora)/gi;
const UN=u=>/^d/i.test(u)?'días':/^m/i.test(u)?'meses':/^a/i.test(u)?'años':'horas';
A.forEach(a=>{a.z=[];a.p.forEach(p=>{for(const m of p.matchAll(PZ)){const s=Math.max(0,m.index-90),e=Math.min(p.length,m.index+m[0].length+60);
 a.z.push({v:+m[1],u:UN(m[2]),l:m[1]+' '+m[2].toLowerCase(),c:(s?'…':'')+p.slice(s,e).trim()+(e<p.length?'…':'')})}});
 a.p.forEach(p=>{for(const m of p.matchAll(ORD)){const v=OV[norm(m[1])];a.z.push({v,u:'días',l:v+'.º día',c:p.slice(Math.max(0,m.index-90),m.index+m[0].length+60).trim()})}});a.zl=[...new Set(a.z.map(z=>z.l))]});
const hlpz=s=>s.replace(PZ,'<mark class="pz">$&</mark>').replace(ORD,'<mark class="pz">$&</mark>');

function nav(){let h='<h5>Índice</h5>';libros.forEach(l=>{if(!l.ch.length){h+=`<a class="l" data-n="${l.i}" href="#/n/${l.i}" style="border-left:4px solid ${col(l.i)};padding-left:10px;font-weight:600">${label(l)} · ${esc(tc(l.name))}</a>`;return}h+=`<details><summary style="border-left:4px solid ${col(l.i)}">${label(l)} · ${esc(tc(l.name))}</summary>`;
 l.ch.forEach(c=>h+=`<a class="l" data-n="${c}" href="#/n/${c}">${label(N[c])} · ${esc(tc(N[c].name))}</a>`);h+='</details>'});side.innerHTML=h;
 $('#fc').innerHTML=`<button class="chip" data-l="" aria-pressed="true">Toda la Ley</button>`+libros.map(l=>`<button class="chip" data-l="${l.i}" title="${esc(tc(l.name))}" aria-pressed="false">${label(l)}</button>`).join('')}
function artHTML(a){const body=a.p.map(p=>`<p class="${/^(\d+|[a-zñ])\)\s|^[-•–]\s/.test(p)?'inc':''}">${xref(hlpz(esc(p)))}</p>`).join('');
 return `<article class="art" id="a${a.n}"><header><div class="num">Art. ${a.n}</div><div><h4>${esc(rub(a))}</h4><p class="sum">${xref(esc(a.s))}</p>${a.zl.length?`<div class="zs">${a.zl.map(z=>`<span class="pzc">⏱ ${esc(z)}</span>`).join('')}</div>`:''}</div></header>
 <div class="acts"><button class="btn sm" data-act="t">Ver texto completo</button><button class="ghost sm" data-act="c" data-n="${a.n}">Copiar</button><button class="ghost sm" data-act="l" data-n="${a.n}">Enlace</button></div><div class="full" hidden>${body}</div></article>`}
function crumbs(i){let c=[],k=i;while(k>=0){c.unshift(`<a href="#/n/${k}">${label(N[k])}</a>`);k=N[k].par}return `<nav class="crumb"><a href="#/">Inicio</a><span>›</span>${c.join('<span>›</span>')}</nav>`}
function card(i){const n=N[i],s=sub(i);const txt=n.ch.length?n.ch.slice(0,4).map(c=>tc(N[c].name)||label(N[c])).join(' · ')+(n.ch.length>4?' · …':''):s.slice(0,4).map(x=>rub(byN[x])).join(' · ')+(s.length>4?' · …':'');
 return `<a class="card" href="#/n/${i}" style="--ac:${col(i)};--b:${bg(i)}"><h3><span class="big">${label(n)}</span><br>${esc(title(n))}</h3><p>${esc(txt)}</p><div class="meta"><span>${rng(i)}</span><span>${s.length} art.</span>${n.ch.length?`<span>${n.ch.length} ${PL[N[n.ch[0]].kind]}</span>`:''}</div></a>`}
const foot=()=>`<p class="foot">Texto de la Ley IV – N.º 15 (Ley Orgánica del Poder Judicial de la Provincia de Misiones) según el documento cargado. Las síntesis y los plazos se extraen automáticamente del texto de cada artículo y son solo una guía de lectura: verificá siempre con la versión oficial vigente.</p>`;
function home(){const cnt=k=>N.filter(n=>n.kind==k).length;
 main.innerHTML=`<section class="hero"><span class="eyebrow">Provincia de Misiones</span><h1>Ley Orgánica del Poder Judicial de Misiones</h1><p>Texto completo de la Ley IV – N.º 15, con índice navegable, síntesis de cada artículo, búsqueda inteligente, referencias cruzadas y buscador de plazos.</p>
 <div class="stats"><div class="stat"><b>${A.length}</b><span>artículos</span></div><div class="stat"><b>${cnt('Título')}</b><span>títulos</span></div><div class="stat"><b>${cnt('Capítulo')}</b><span>capítulos</span></div></div>
 <div class="go"><input id="gn" type="number" min="1" max="${MAX}" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button><a class="btn" href="#/plazos">⏱ Buscar plazos</a></div></section>
 <div class="sec"><h2>Títulos</h2><span>Acceso rápido a cada título de la Ley</span></div><div class="grid">${libros.map(l=>card(l.i)).join('')}</div>
 <div class="sec"><h2>Accesos rápidos por capítulo</h2><span>${cnt('Capítulo')} capítulos</span></div><div class="grid">${N.filter(n=>n.lv==2).map(n=>card(n.i)).join('')}</div>${foot()}`;
 const go=()=>{const v=+$('#gn').value;v>=1&&v<=MAX?location.hash='/a/'+v:toast('Ingresá un número entre 1 y '+MAX)};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function nodeView(i){const n=N[i],s=sub(i);
 let h=crumbs(i)+`<header class="nh"><span class="eyebrow">${label(n)}</span><h1>${esc(title(n))}</h1><div class="meta"><span>${rng(i)}</span><span>${s.length} artículo${s.length>1?'s':''}</span></div></header>`;
 h+=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${s.length>1?`los artículos <b>${s[0]}</b> a <b>${s[s.length-1]}</b> (${s.length} en total)`:`el artículo <b>${s[0]}</b>`}${n.ch.length?`, organizados en ${n.ch.length} ${PL[N[n.ch[0]].kind]}:`:', que regulan:'}</p><ul>`+
 (n.ch.length?n.ch.map(c=>`<li><a href="#/n/${c}"><b>${label(N[c])}</b> – ${esc(tc(N[c].name))}</a> <small>(${rng(c)})</small></li>`).join(''):n.arts.map(x=>`<li><a href="#/a/${x}"><b>Art. ${x}</b> – ${esc(rub(byN[x]))}</a></li>`).join(''))+'</ul></div>';
 if(n.ch.length)h+=`<div class="grid">${n.ch.map(card).join('')}</div>`;
 if(n.arts.length)h+=`<div class="bar"><button class="btn sm" data-act="all">Expandir todos los textos</button><button class="ghost sm" data-act="none">Contraer todos</button></div>`+n.arts.map(x=>artHTML(byN[x])).join('');
 const u=N.filter(m=>m.arts.length),k=u.indexOf(n);if(k>=0)h+=`<div class="pn">${k>0?`<a class="ghost" href="#/n/${u[k-1].i}">← ${esc(title(u[k-1]))}</a>`:'<span></span>'}${k<u.length-1?`<a class="ghost" href="#/n/${u[k+1].i}">${esc(title(u[k+1]))} →</a>`:''}</div>`;
 main.innerHTML=h+foot();main.style.cssText=`--ac:${col(i)};--b:${bg(i)}`;
 side.querySelectorAll('.l').forEach(l=>l.classList.remove('on'));
 let t=i;while(N[t].lv>2)t=N[t].par;const l=side.querySelector(`.l[data-n="${t}"]`);if(l){l.classList.add('on');l.parentElement.open=true}}

/* búsqueda: palabras en cualquier orden, sinónimos, números y variantes */
const STOP=new Set('de del la las el los lo al a y e o u en con por para que se su sus es son ser un una como si no mas muy le les sobre entre hay ha han este esta cuando donde cual quiero busco necesito puede pueden debe deben'.split(' '));
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
function stem(w){if(/^\d+$/.test(w)||w.length<5)return w;for(const x of ['amientos','amiento','imientos','imiento','aciones','acion','uciones','ucion','adores','ador','mente','ables','able','ando','iendo','ados','adas','idos','idas','ado','ada','ido','ida','es','s','ar','er','ir','a','o','e'])if(w.endsWith(x)&&w.length-x.length>=4)return w.slice(0,-x.length);return w}
const NUM={1:'uno un una',2:'dos',3:'tres',5:'cinco',10:'diez',15:'quince',20:'veinte',30:'treinta',60:'sesenta',90:'noventa'};
const SYN=new Map();
['plazo termino lapso periodo vencimiento vence','juez magistrado vocal ministro','tribunal juzgado camara','fiscal ministerio publico procurador','defensor defensoria oficial pobre','secretario actuario','paz legos letrado','competencia jurisdiccion circunscripcion','subrogancia reemplazo suplencia suplir subroga','recusacion excusacion impedimento','licencia permiso','sancion multa apercibimiento suspension cesantia','requisito condicion exigencia','feria receso inhabil habil','archivo expediente protocolo','perito profesional auxiliar abogado','oficial notificador mandamiento notificacion','nombramiento designacion','sentencia fallo resolucion','recurso apelacion revocatoria','dia dias','mes meses','ano anos','hora horas'].forEach(g=>{const st=[...new Set(g.split(' ').map(stem))];st.forEach(s=>{if(!SYN.has(s))SYN.set(s,new Set());st.forEach(x=>SYN.get(s).add(x))})});
function accepted(t){const set=new Set(),s=stem(t);set.add(s);SYN.has(s)&&SYN.get(s).forEach(x=>set.add(x));if(/^\d+$/.test(t)&&NUM[+t])NUM[+t].split(' ').forEach(w=>set.add(stem(w)));for(const[n,ws]of Object.entries(NUM))if(ws.split(' ').includes(t))set.add(n);return set}
const near=(a,t)=>{if(a===t)return true;const sh=a.length<t.length?a:t,lg=a.length<t.length?t:a;return sh.length>=4&&lg.startsWith(sh)&&sh.length/lg.length>=.6};
const hit=(tk,acc)=>{for(const a of acc)for(const t of tk)if(near(a,t))return true;return false};
let ixd=0;const idx=()=>{if(ixd)return;ixd=1;A.forEach(a=>{a._m=new Set(words(rub(a)+' '+a.s+' '+a.n).map(stem));a._a=new Set([...a._m,...words(a.p.join(' ')).map(stem)])})};
const W=/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g,mk=(w,accs)=>{const s=stem(norm(w));return accs.some(a=>[...a].some(x=>near(x,s)))};
const hl=(t,accs)=>{let o='',p=0;for(const m of t.matchAll(W)){o+=esc(t.slice(p,m.index))+(mk(m[0],accs)?'<mark>'+esc(m[0])+'</mark>':esc(m[0]));p=m.index+m[0].length}return o+esc(t.slice(p))};
let lib='';
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
const inLib=a=>!lib||root(nodeOf[a.n])==+lib;
function search(v){const terms=[...new Set(words(v).filter(w=>!STOP.has(w)||/^\d+$/.test(w)))];if(!terms.length)return route();
 if(/^\d+$/.test(v.trim())&&byN[+v]){location.hash='/a/'+(+v);return}
 idx();main.style.cssText='';const accs=terms.map(accepted),run=need=>A.filter(a=>inLib(a)&&accs.filter(x=>hit(a._a,x)).length>=need);
 let rs=run(terms.length),partial=false;if(!rs.length&&terms.length>1){partial=true;rs=run(Math.max(1,Math.ceil(terms.length/2)))}
 rs=rs.map(a=>({a,s:accs.some(x=>hit(a._m,x))?0:1,k:accs.filter(x=>hit(a._a,x)).length})).sort((x,y)=>y.k-x.k||x.s-y.s||x.a.n-y.a.n);
 const snip=a=>{const b=a.p.join(' ');let ix=0;for(const m of b.matchAll(W))if(mk(m[0],accs)){ix=m.index;break}const st=Math.max(0,ix-70);return(st?'…':'')+b.slice(st,st+240)+(b.length>st+240?'…':'')};
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${rs.length>60?' · se muestran 60':''}${lib?' · '+esc(label(N[+lib])):''}</span></div>
 <p class="hint">${partial?'Coincidencia parcial: no hay artículos con todas las palabras; se muestran los que tienen al menos la mitad. ':''}Entiende varias palabras en cualquier orden, sinónimos y números (5 = cinco), y busca también en el texto completo.</p>`+
 (rs.slice(0,60).map(({a})=>{const n=N[nodeOf[a.n]];return `<article class="art"><header><div class="num">Art. ${a.n}</div><div><h4>${hl(rub(a),accs)}<small>${esc(n.i==root(n.i)?label(n)+' · '+tc(n.name):label(N[root(n.i)])+' › '+label(n)+' · '+tc(n.name))}</small></h4><p class="sum">${hl(snip(a),accs)}</p></div></header><div class="acts"><a class="btn sm" href="#/a/${a.n}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Título.</p>')}

/* vista de plazos */
let pu='todos';
function plazosView(){main.style.cssText='';
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Plazos</span></nav><div class="sec"><h2>Buscador de plazos</h2><span>Detectados en el texto de los artículos</span></div>
 <div class="tabs">${['todos','días','meses','años','horas'].map(u=>`<button data-u="${u}" class="${u==pu?'on':''}">${tc(u)}</button>`).join('')}</div>
 <div class="ctl"><input id="pq" type="search" placeholder="Filtrar por tema: ej. prescripción, recurso, pago…"><input id="pv" type="number" min="1" placeholder="Cantidad"><select id="pl"><option value="">Toda la Ley</option>${libros.map(l=>`<option value="${l.i}"${lib==l.i?' selected':''}>${label(l)} · ${esc(tc(l.name))}</option>`).join('')}</select></div>
 <p class="cnt hint" id="pc"></p><table class="tb"><thead><tr><th>Artículo</th><th>Plazo</th><th>Contexto</th></tr></thead><tbody id="pb"></tbody></table>${foot()}`;
 const draw=()=>{const q=norm($('#pq').value),v=+$('#pv').value,l=$('#pl').value;let r=[];
  A.forEach(a=>a.z.forEach(z=>{if((pu=='todos'||z.u==pu)&&(!v||z.v==v)&&(!l||root(nodeOf[a.n])==+l)&&(!q||norm(rub(a)+' '+z.c).includes(q)))r.push({a,z})}));
  $('#pc').textContent=`${r.length} plazo${r.length==1?'':'s'}${r.length>150?' · se muestran 150':''}`;
  $('#pb').innerHTML=r.slice(0,150).map(({a,z})=>`<tr><td data-l="Artículo"><a class="x" href="#/a/${a.n}">Art. ${a.n}</a><div class="hint">${esc(rub(a))}</div></td><td data-l="Plazo"><span class="pzc">⏱ ${esc(z.l)}</span></td><td data-l="Contexto">${xref(esc(z.c))}</td></tr>`).join('')||'<tr><td colspan="3">Sin plazos con esos filtros.</td></tr>'};
 ['#pq','#pv'].forEach(s=>$(s).oninput=draw);$('#pl').onchange=e=>{setLib(e.target.value);draw()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{pu=b.dataset.u;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));draw()});draw()}

function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');main.style.cssText='';
 const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;if(ri!=null&&N[ri])setLib(String(root(ri)));else if(h!='/plazos')setLib('');
 if(h=='/plazos'){plazosView();scrollTo(0,0);return}
 if(!m||(m[1]=='n'&&!N[+m[2]])||(m[1]=='a'&&!byN[+m[2]])){home();scrollTo(0,0);side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));return}
 if(m[1]=='n'){nodeView(+m[2]);scrollTo(0,0)}
 else{const n=+m[2];nodeView(nodeOf[n]);const e=document.getElementById('a'+n);if(e){e.classList.add('hit');e.querySelector('.full').hidden=false;e.querySelector('[data-act=t]').textContent='Ocultar texto completo';setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}}
const setT=(a,t)=>{a.querySelector('.full').hidden=t;a.querySelector('[data-act=t]').textContent=t?'Ver texto completo':'Ocultar texto completo'};
document.addEventListener('click',e=>{
 const c=e.target.closest('#fc .chip');if(c){setLib(c.dataset.l);$('#q').value='';location.hash=c.dataset.l?'/n/'+c.dataset.l:'/';route();return}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,art=b.closest('.art');
 if(act=='t')setT(art,!art.querySelector('.full').hidden);
 else if(act=='all'||act=='none')document.querySelectorAll('.art').forEach(x=>setT(x,act=='none'));
 else if(act=='c'){const a=byN[+b.dataset.n];copy(`Artículo ${a.n}.- ${a.t}\n\n`+a.p.join('\n'),'Texto copiado')}
 else if(act=='l')copy(location.href.split('#')[0]+'#/a/'+b.dataset.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#12161f';r.dataset.theme=dk?'light':'dark'};
addEventListener('hashchange',route);
nav();route();
</script>
</body>
</html>
