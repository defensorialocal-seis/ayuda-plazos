a cargo de una entidad habilitada a través de uno de sus fondos que tenga autorizado a tal fin por la Comisión Nacional de Valores, organismo descentralizado actuante en la órbita del Ministerio de Economía.","El empleador no podrá, bajo ningún aspecto, bajo pena de la aplicación de la sanción prevista en el artículo 75, elegir entidades en las cuales posea participación directa o indirecta."]},{"n":63,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Información y trazabilidad","s":"Cada empleador contará con una cuenta identificada dentro de la entidad habilitada seleccionada, en la cual se registrarán:","p":["Información y trazabilidad. Cada empleador contará con una cuenta identificada dentro de la entidad habilitada seleccionada, en la cual se registrarán:","a) Las contribuciones obligatorias mensuales que realice el empleador, a través de la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía;","b) Los rendimientos, intereses y/o cualquier otra renta obtenida producto de su inversión; c) Cualquier otro ingreso de fondos, en los términos del artículo 61 de la presente;","d) Los retiros efectuados conforme los fines previstos en esta ley;","e) Las comisiones abonadas y gastos de administración del Fondo;","f) El remanente disponible."]},{"n":64,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Utilización de los recursos de los Fondos","s":"Los recursos acumulados en la cuenta correspondiente a cada empleador sólo podrán utilizarse para cubrir el pago de las obligaciones y montos previstos en el artículo 58 de la presente ley, siempre que la relación…","p":["Utilización de los recursos de los Fondos. Los recursos acumulados en la cuenta correspondiente a cada empleador sólo podrán utilizarse para cubrir el pago de las obligaciones y montos previstos en el artículo 58 de la presente ley, siempre que la relación laboral extinguida hubiera estado registrada.","En caso de que la relación laboral estuviere registrada de modo deficiente, los recursos de la cuenta podrán ser aplicados únicamente para cubrir las obligaciones y pagos que corresponderían si se consideraran solamente los datos de la relación laboral registrada.","La existencia, inexistencia o insuficiencia de recursos en la cuenta no limita, reduce, altera ni condiciona la responsabilidad del empleador por el pago íntegro de las obligaciones a su cargo derivadas de la extinción del vínculo laboral.","Ante cada situación prevista en el artículo 58 de la presente ley, que además cumpla con los requisitos previstos en el presente artículo, el empleador podrá optar por aplicar los recursos de la cuenta, o una parte de ellos, para el pago total o parcial de dicha obligación, o por no usarlos para ese caso y mantener los recursos en la cuenta."]},{"n":65,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Carencia","s":"A efectos de su capitalización y con el fin de garantizar la estabilidad financiera, el Fondo de Asistencia Laboral no responderá por las extinciones laborales previstas en el artículo 58 de la presente ley, hasta…","p":["Carencia. A efectos de su capitalización y con el fin de garantizar la estabilidad financiera, el Fondo de Asistencia Laboral no responderá por las extinciones laborales previstas en el artículo 58 de la presente ley, hasta luego de haber recibido las contribuciones correspondientes a al menos seis (6) períodos mensuales, en los términos que determine la reglamentación.","El Poder Ejecutivo nacional podrá establecer un plazo mayor, cuando por las características del sector económico o del mercado laboral, entre otros motivos atendibles, así lo aconsejen."]},{"n":66,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Interrupción o suspensión de obligación de contribución","s":"El empleador que pueda acreditar, en función de su nómina, que el saldo existente acumulado en su cuenta del Fondo de Asistencia Laboral al momento de la evaluación, cubre los porcentajes que determine la…","p":["Interrupción o suspensión de obligación de contribución. El empleador que pueda acreditar, en función de su nómina, que el saldo existente acumulado en su cuenta del Fondo de Asistencia Laboral al momento de la evaluación, cubre los porcentajes que determine la reglamentación de las posibles contingencias laborales de su nómina, podrá solicitar la interrupción o suspensión de la obligación mensual de efectuar el ingreso de las contribuciones previstas en el artículo 60 de la presente ley.","La Secretaría de Trabajo, Empleo y Seguridad Social, dependiente del Ministerio de Capital Humano, en conjunto con el Ministerio de Economía instrumentarán, en su totalidad, las condiciones y/o requisitos para acceder a dicha interrupción o suspensión.","En caso de ser concedida, el empleador quedará exceptuado de realizar la contribución por el período por el que se le haya concedido la interrupción o suspensión."]},{"n":67,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Tratamiento en el Impuesto a las Ganancias y en el Impuesto al Valor Agregado (IVA)","s":"Tratamiento en el Impuesto a las Ganancias y en el Impuesto al Valor Agregado (IVA).","p":["Tratamiento en el Impuesto a las Ganancias y en el Impuesto al Valor Agregado (IVA). Exímese del Impuesto a las Ganancias a los rendimientos, intereses y/o a cualquier otra renta derivada de las inversiones efectuadas en el marco del funcionamiento del Fondo de Asistencia Laboral, obtenidas por el empleador, incluidos los resultados que se generen como consecuencia de las transformaciones que experimente el citado Fondo por efecto de reorganizaciones societarias del empleador, con independencia de que dichas reorganizaciones reúnan o no los requisitos del artículo 80 de la Ley de Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones.","La integración de las contribuciones (obligatorias y/o voluntarias) y de cualquier otra suma, conforme lo previsto en el artículo 61, al citado Fondo, están exentas del Impuesto a las Ganancias para éste, excepto que se trate de las comisiones que reciba. Idéntico tratamiento cabe dispensar a cualquier otro importe diferente al señalado en el párrafo anterior, que se le acredite al empleador como consecuencia de la utilización del Fondo.","El beneficio previsto en este artículo no afecta la deducibilidad, en cabeza del empleador, de los pagos por extinción de la relación laboral que el mismo efectúe de manera directa, conforme a las normas generales vigentes.","Los importes sustitutivos de las indemnizaciones que se abonen a los trabajadores en el marco del presente régimen recibirán, a los fines del Impuesto a las Ganancias, el tratamiento previsto para dichas indemnizaciones. Los conceptos mencionados en este artículo, con excepción de la comisión mencionada en el segundo párrafo, no están gravados por el Impuesto al Valor Agregado (IVA)."]},{"n":68,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Responsabilidad","s":"El empleador y quienes tengan responsabilidad solidaria según las normas aplicables, serán los únicos responsables del pago de las indemnizaciones o montos que le corresponda al trabajador.","p":["Responsabilidad. El empleador y quienes tengan responsabilidad solidaria según las normas aplicables, serán los únicos responsables del pago de las indemnizaciones o montos que le corresponda al trabajador.","Las entidades administradoras en ningún caso se considerarán sujetos obligados frente al trabajador, manteniéndose como terceros ajenos a la relación jurídica entre el empleador y el trabajador."]},{"n":69,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Procedimiento","s":"Determinada la obligación de pago, si el empleador decide utilizar recursos de la cuenta del Fondo de Asistencia Laboral, deberá comunicar tal voluntad a la entidad administradora, presentando una declaración…","p":["Procedimiento. Determinada la obligación de pago, si el empleador decide utilizar recursos de la cuenta del Fondo de Asistencia Laboral, deberá comunicar tal voluntad a la entidad administradora, presentando una declaración jurada que contenga:","a) Nombre y apellido del trabajador o beneficiario correspondiente del pago;","b) Código Único de Identificación Laboral (CUIL) del trabajador o beneficiario correspondiente;","c) Datos completos de la cuenta bancaria de titularidad del trabajador o beneficiario correspondiente del pago;","d) Fecha y causa de la extinción de la relación laboral;","e) Detalle de la liquidación practicada;","f) Monto a transferir con indicación si se refiere a la cancelación total o parcial en relación con la liquidación que corresponda; y g) Otros datos que establezca la reglamentación.","La entidad administradora deberá verificar el cumplimiento de los requisitos que establecerá la reglamentación, y de encontrarse cumplidos, deberá transferir las sumas pertinentes a la cuenta bancaria del trabajador o beneficiario indicada en la declaración jurada presentada, todo ello dentro del plazo máximo de cinco (5) días hábiles.","A tales efectos instrúyase a la Administración Nacional de la Seguridad Social (ANSES), organismo descentralizado en el ámbito del Ministerio de Capital Humano y a la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, según corresponda, a celebrar los convenios con las entidades administradoras de fondos en pos de simplificar y facilitar la verificación y cumplimiento de los deberes y obligaciones previstos en el presente régimen. Asimismo, se faculta a los citados organismos a brindar a las referidas entidades administradoras la información que resulte necesaria a los fines de realizar la verificación prevista en la presente ley."]},{"n":70,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Pago de la obligación","s":"El pago de la obligación mensual a cargo del empleador, en los términos del artículo 60, se formalizará a través del procedimiento que establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo…","p":["Pago de la obligación. El pago de la obligación mensual a cargo del empleador, en los términos del artículo 60, se formalizará a través del procedimiento que establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, quien deberá velar por el cumplimiento de la obligación mensual y será la responsable de la gestión de cobro."]},{"n":71,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Entidades habilitadas","s":"Las entidades habilitadas serán las responsables de la administración, inversión y resguardo de los Fondos de Asistencia Laboral, como también de velar por el cumplimiento del procedimiento de verificación y pago,…","p":["Entidades habilitadas. Las entidades habilitadas serán las responsables de la administración, inversión y resguardo de los Fondos de Asistencia Laboral, como también de velar por el cumplimiento del procedimiento de verificación y pago, y en su defecto de efectuar las denuncias ante irregularidades que pudieran detectar.","Las entidades habilitadas únicamente podrán percibir una contraprestación, en concepto de comisiones y gastos por todas las funciones que les asigna la presente ley, con un tope de comisión del uno por ciento (1%)."]},{"n":72,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Remanente","s":"En caso de cese, disolución, liquidación o quiebra del empleador, la cuenta individual quedará extinguida, y los recursos deberán ser transferidos a una cuenta bancaria de titularidad del empleador en el país,…","p":["Remanente. En caso de cese, disolución, liquidación o quiebra del empleador, la cuenta individual quedará extinguida, y los recursos deberán ser transferidos a una cuenta bancaria de titularidad del empleador en el país, salvo disposición en contrario del juez de la quiebra.","En caso de que el empleador no cuente con trabajadores registrados en un plazo de seis (6) meses continuos, la cuenta individual, salvo que el empleador denuncie y acredite la existencia de por lo menos un reclamo judicial pendiente de resolución, quedará extinguida. Producida la extinción, los recursos deberán ser transferidos a una cuenta bancaria de titularidad del empleador en el país.","El empleador podrá solicitar la extinción de su cuenta individual a la Secretaría de Trabajo, Empleo y Seguridad Social, dependiente del Ministerio de Capital Humano, acreditando la inexistencia de contingencias laborales, debiendo dar intervención a la Agencia de Recaudación y Control Aduanero (ARCA) y a la Comisión Nacional de Valores organismos descentralizados actuantes en la órbita del Ministerio de Economía, y a la Secretaría de Finanzas del Ministerio de Economía."]},{"n":73,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Transferencia de establecimiento o cesión de personal","s":"La transferencia del establecimiento o cesión de personal, en los términos de los artículos 225, 229 y concordantes de la Ley de Contrato de Trabajo N° 20.744 (t.o.","p":["Transferencia de establecimiento o cesión de personal. La transferencia del establecimiento o cesión de personal, en los términos de los artículos 225, 229 y concordantes de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones que constituya un único establecimiento donde prestan tareas todos los trabajadores en relación de dependencia, implicará la transferencia de la cuenta asociada, incluyendo sus recursos, movimientos y remanentes, en los términos y condiciones previstos en las leyes aplicables y que se establezcan en la reglamentación. Se aplicará igual criterio para el caso de reorganizaciones en los términos del artículo 80 y 81 de la Ley de Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones."]},{"n":74,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Protección legal","s":"Los Fondos, las cuentas individuales y todos los valores incorporados a ellos, serán inembargables y estarán afectados exclusivamente a la finalidad prevista en esta ley.","p":["Protección legal. Los Fondos, las cuentas individuales y todos los valores incorporados a ellos, serán inembargables y estarán afectados exclusivamente a la finalidad prevista en esta ley."]},{"n":75,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Sanciones","s":"El empleador que utilice los recursos acumulados en las cuentas para fines distintos a los previstos en el artículo 58 de la presente ley, o que opte por una entidad habilitada sobre la cual tenga vinculación…","p":["Sanciones. El empleador que utilice los recursos acumulados en las cuentas para fines distintos a los previstos en el artículo 58 de la presente ley, o que opte por una entidad habilitada sobre la cual tenga vinculación directa o indirecta o contravenga las disposiciones del presente régimen, será sancionado con una multa de hasta el doble del monto ingresado al Fondo de Asistencia Laboral, más su rendimiento devengado a la fecha de la multa, sin perjuicio de las acciones civiles y/o penales que pudieran corresponder."]},{"n":76,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Reducción de Contribución Patronal","s":"Los empleadores, por las relaciones laborales incluidas en el presente régimen, excepto que se trate de aquellas previstas en el Régimen de Incentivo a la Formalización Laboral (RIFL) y mientras persista sus…","p":["Reducción de Contribución Patronal. Los empleadores, por las relaciones laborales incluidas en el presente régimen, excepto que se trate de aquellas previstas en el Régimen de Incentivo a la Formalización Laboral (RIFL) y mientras persista sus efectos, tendrán una reducción en las contribuciones patronales con destino a la seguridad social equivalente a la que le resulte de aplicación de conformidad con lo dispuesto en el artículo 60.","La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, evaluará, en la periodicidad que a esos efectos determine, el cumplimiento de la obligación de pago de la contribución con destino a los Fondos de Asistencia Laboral conforme lo previsto en el artículo 70, debiendo aplicar las leyes 11.683, 18.820 y 26.063 y toda aquella normativa que las complementen a los fines del cumplimiento de estos objetivos, con las particularidades que prevea la reglamentación."]},{"n":77,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Autoridades de Aplicación","s":"Vigencia.","p":["Autoridades de Aplicación. Vigencia. La Secretaría de Trabajo, Empleo y Seguridad Social dependiente del Ministerio de Capital Humano, la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, la Comisión Nacional de Valores, organismo descentralizado actuante en la órbita del Ministerio de Economía y la Secretaría de Finanzas del Ministerio de Economía, en el marco de sus respectivas competencias, serán los organismos responsables de dictar las normas complementarias y velar por el funcionamiento y cumplimiento del presente régimen, como de establecer los procedimientos de control y auditoría, incluyendo el efectivo pago de las contribuciones a los fondos, el mecanismo de cobro y destino de los montos correspondientes a sanciones, la correcta afectación de los recursos a los fines exclusivamente previstos en la presente ley y el correcto funcionamiento y cumplimiento de los deberes de las entidades habilitadas a administrar los fondos. El presente régimen entrará en vigencia a partir del 1° de junio de 2026, fecha que podrá ser prorrogada por el Poder Ejecutivo nacional, por el plazo máximo de seis (6) meses, junto con el dictado de la reglamentación y normas de instrumentación pertinentes."]},{"n":78,"nt":[],"h":"Sustitúyese el artículo 18 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 18","t":"Peritos Médicos y Psicólogos","s":"Los peritos médicos y psicólogos deberán ser profesionales legistas o especialistas en la rama de la medicina relacionada con la cuestión sometida a su dictamen.","p":["Artículo 18: Peritos Médicos y Psicólogos. Los peritos médicos y psicólogos deberán ser profesionales legistas o especialistas en la rama de la medicina relacionada con la cuestión sometida a su dictamen. Estos deberán contar con la capacidad operativa y la especialización necesaria para atender las controversias judiciales suscitadas en el marco del Sistema de Riesgos del Trabajo, asegurando la objetividad e independencia en sus dictámenes. Para ello deberán valerse de los entornos digitales que la Superintendencia de Riesgos del Trabajo ponga a su disposición, y sus trabajos serán retribuidos tomando en consideración exclusivamente la relevancia, calidad y extensión de la labor profesional realizada, con total prescindencia del monto del proceso y de la gravedad de las constataciones efectuadas."]},{"n":79,"nt":[],"h":"Sustitúyese el artículo 20 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 20","t":"Competencia por materia","s":"Serán de competencia de la Justicia Nacional del Trabajo, en general, las causas contenciosas en conflictos individuales de derecho, por demandas o reconvenciones fundadas en los contratos de trabajo, Convenciones…","p":["Artículo 20: Competencia por materia. Serán de competencia de la Justicia Nacional del Trabajo, en general, las causas contenciosas en conflictos individuales de derecho, por demandas o reconvenciones fundadas en los contratos de trabajo, Convenciones Colectivas de Trabajo, laudos con eficacia de convenciones colectivas, o disposiciones legales o reglamentarias del Derecho del Trabajo; y las causas entre trabajadores y empleadores relativas a un contrato de trabajo, aunque se funden en disposiciones del derecho común aplicables a aquél.","En los casos que versen sobre la materia establecida en el párrafo anterior y a su vez sea parte o tercero interesado el Estado nacional –Poder Ejecutivo nacional, Poder Legislativo, Poder Judicial, Ministerio Público-, incluyendo los entes previstos en el artículo 8°, inciso a), de la ley 24.156 y sus modificaciones, serán competentes el fuero Contencioso Administrativo Federal de la Ciudad Autónoma de Buenos Aires y, en las demás jurisdicciones, la Justicia Federal con competencia en lo contencioso administrativo. En ningún caso la Justicia Nacional del Trabajo podrá expedirse en las causas aquí comprendidas.","Se entenderá por modificada toda norma que asigne, en el supuesto contemplado en el párrafo anterior, competencia alguna al fuero nacional del trabajo."]},{"n":80,"nt":[],"h":"Sustitúyese el artículo 24 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 24","t":"Competencia territorial","s":"En las causas entre trabajadores y empleadores será competente, a elección del demandante, el juez del lugar del trabajo, o el del lugar de celebración del contrato, o el del domicilio del empleador.","p":["Artículo 24: Competencia territorial. En las causas entre trabajadores y empleadores será competente, a elección del demandante, el juez del lugar del trabajo, o el del lugar de celebración del contrato, o el del domicilio del empleador.","El que no tuviere domicilio fijo, podrá ser demandado en el lugar en que se encuentre o en el de su última residencia.","En las causas incoadas por asociaciones profesionales por cobro de aportes, contribuciones o cuotas, será competente el juez del domicilio del demandado.","En las causas iniciadas en los términos de las leyes 24.557 y sus modificaciones y 27.348, se estará a la competencia territorial prevista en ellas."]},{"n":81,"nt":[],"h":"Sustitúyese el artículo 26 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 26","t":"Recusación y excusación","s":"En materia de recusaciones, con y sin expresión de causa, y excusaciones de jueces, secretarios, árbitros y peritos regirán las disposiciones del Código Procesal Civil y Comercial de la Nación.","p":["Artículo 26: Recusación y excusación. En materia de recusaciones, con y sin expresión de causa, y excusaciones de jueces, secretarios, árbitros y peritos regirán las disposiciones del Código Procesal Civil y Comercial de la Nación."]},{"n":82,"nt":[],"h":"Sustitúyese el artículo 46 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 46","t":"Impulso del proceso","s":"El procedimiento será impulsado por las partes.","p":["Artículo 46: Impulso del proceso. El procedimiento será impulsado por las partes. Se producirá la caducidad de instancia cuando no se instare su curso dentro de los siguientes plazos, sin necesidad de intimación previa:","1) De seis (6) meses, en primera o única instancia.","2) De tres (3) meses, en segunda instancia y en cualquiera de las instancias en el juicio sumarísimo, en el juicio ejecutivo, en las ejecuciones especiales y en los incidentes.","3) De un (1) mes, en el incidente de caducidad de instancia.","La instancia se abre con la promoción de la demanda aunque no hubiere sido notificada la resolución que dispone su traslado y termina con el dictado de la sentencia."]},{"n":83,"nt":[],"h":"","ac":"Incorpora","tg":"Procedimiento laboral","rf":"art. 65","t":"Incorpora art. 65 · Procedimiento laboral","s":"Incorpórase como inciso 8) al artículo 65 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o.","p":["Incorpórase como inciso 8) al artículo 65 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, el siguiente texto: 8) La mención de los medios de prueba que la parte intente hacer valer para demostrar sus afirmaciones. Asimismo, presentará los documentos que obraren en su poder y si no los tuviere los individualizará indicando su contenido, la persona en cuyo poder se hallaren, o el lugar, archivo u oficina donde se encuentren."]},{"n":84,"nt":[],"h":"Sustitúyese el artículo 71 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N°106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 71","t":"Contestación de la demanda","s":"La contestación de la demanda se formulará por escrito y se ajustará, en lo aplicable, a lo dispuesto en el artículo 65 de esta ley y en el artículo 356 del Código Procesal Civil y Comercial de la Nación.","p":["Artículo 71: Contestación de la demanda. La contestación de la demanda se formulará por escrito y se ajustará, en lo aplicable, a lo dispuesto en el artículo 65 de esta ley y en el artículo 356 del Código Procesal Civil y Comercial de la Nación. La carga prevista en el inciso 1° del artículo 356 del Código Procesal Civil y Comercial de la Nación no regirá respecto de los representantes designados en juicios universales.","Del responde y de su documentación, se dará traslado al actor quien dentro del tercer día de notificado reconocerá o desconocerá la autenticidad de la documentación aportada por la demandada.","Si el demandado debidamente citado no contestare la demanda en el plazo previsto en el artículo 68 será declarado rebelde, presumiéndose como ciertos los hechos expuestos en ella, salvo prueba en contrario.","En caso de discordancia entre los datos de la persona demandada y los del que contesta la demanda, el juez tendrá por enderezada la acción, salvo oposición expresa de la parte actora. Si el trabajador actuare mediante apoderado se entenderá que el poder es suficiente para continuar la acción contra quien ha contestado la demanda."]},{"n":85,"nt":[],"h":"Sustitúyese el artículo 76 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 76","t":"Excepciones previas","s":"En materia de excepciones de previo y especial pronunciamiento, regirán las disposiciones del Código Procesal Civil y Comercial de la Nación.","p":["Artículo 76: Excepciones previas. En materia de excepciones de previo y especial pronunciamiento, regirán las disposiciones del Código Procesal Civil y Comercial de la Nación. Junto con la oposición de la excepción deberá ofrecerse toda la prueba referida a ella. En el caso de la resolución de la excepción de prescripción, para que sea resuelta de previo y especial pronunciamiento será necesario que ella no requiera la producción de prueba.","Junto con la oposición de la excepción deberá ofrecerse toda la prueba referida a ella."]},{"n":86,"nt":[],"h":"Incorpórase como inciso d) al artículo 108 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, el siguiente texto:","ac":"Incorpora","tg":"Procedimiento laboral","rf":"art. 108","t":"Incorpora art. 108 · Procedimiento laboral","s":"d) Las sentencias por las que el magistrado rechaza excepciones de incompetencia y de falta de legitimación pasiva y activa.","p":["d) Las sentencias por las que el magistrado rechaza excepciones de incompetencia y de falta de legitimación pasiva y activa."]},{"n":87,"nt":[],"h":"Sustitúyese el artículo 110 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 110","t":"Apelaciones anteriores a la sentencia","s":"Salvo el caso del artículo 146, los supuestos vinculados a la competencia del tribunal, la falta de legitimación pasiva y activa, y los de medidas cautelares, todas las apelaciones interpuestas aún en juicios prima…","p":["Artículo 110: Apelaciones anteriores a la sentencia. Salvo el caso del artículo 146, los supuestos vinculados a la competencia del tribunal, la falta de legitimación pasiva y activa, y los de medidas cautelares, todas las apelaciones interpuestas aún en juicios prima facie inapelables, se tendrán presentes con efecto diferido hasta el momento en que se haya puesto fin al proceso de conocimiento, en primera instancia, con la sentencia definitiva."]},{"n":88,"nt":[],"h":"Sustitúyese el artículo 124 de la Ley de Organización y Procedimiento de la Justicia Nacional de Trabajo N° 18.345 (t.o. por Decreto N° 106/98) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Procedimiento laboral","rf":"art. 124","t":"Dictado de fallos plenarios","s":"Prohibiciones.","p":["Artículo 124: Dictado de fallos plenarios. Prohibiciones. En materia de fallos plenarios, regirán las disposiciones del Código Procesal Civil y Comercial de la Nación.","Los criterios de aplicación obligatoria o sugerida para la resolución de aspectos concernientes a las causas judiciales, no podrán ser establecidos por otro instrumento que no sea sentencia plenaria."]},{"n":89,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Los jueces que resuelvan causas de índole laboral deberán, de forma obligatoria,…","s":"Los jueces que resuelvan causas de índole laboral deberán, de forma obligatoria, adecuar sus decisiones a los precedentes establecidos por la Corte Suprema de Justicia de la Nación en la materia.","p":["Los jueces que resuelvan causas de índole laboral deberán, de forma obligatoria, adecuar sus decisiones a los precedentes establecidos por la Corte Suprema de Justicia de la Nación en la materia.","El apartamiento infundado de los magistrados respecto de dichos criterios configurará una causal de mal desempeño en sus funciones."]},{"n":90,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Aprobación del Acuerdo de Transferencia de la función judicial en materia laboral","s":"Apruébese el “Acuerdo de Transferencia de la Función Judicial en Materia Laboral del Ámbito Nacional a la Justicia del Trabajo de la Ciudad Autónoma de Buenos Aires”, celebrado entre el Estado Nacional y el…","p":["Aprobación del Acuerdo de Transferencia de la función judicial en materia laboral. Apruébese el “Acuerdo de Transferencia de la Función Judicial en Materia Laboral del Ámbito Nacional a la Justicia del Trabajo de la Ciudad Autónoma de Buenos Aires”, celebrado entre el Estado Nacional y el Gobierno de la Ciudad Autónoma de Buenos Aires el 9 de febrero de 2026, cuyo texto se adjunta en copia como Anexo I y forma parte integrante del presente artículo.","Deróguese toda norma que se oponga a lo dispuesto en el Acuerdo que por el presente artículo se aprueba y encomiéndase al Poder Ejecutivo nacional a dictar los textos ordenados de aquellas normas que precisen ser adecuadas en virtud de lo establecido en el Acuerdo."]},{"n":91,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Encomiéndase al Poder Ejecutivo nacional a transferir al Gobierno de la Ciudad…","s":"Encomiéndase al Poder Ejecutivo nacional a transferir al Gobierno de la Ciudad Autónoma de Buenos Aires los recursos necesarios para el funcionamiento del fuero del trabajo de la Ciudad Autónoma de Buenos Aires,…","p":["Encomiéndase al Poder Ejecutivo nacional a transferir al Gobierno de la Ciudad Autónoma de Buenos Aires los recursos necesarios para el funcionamiento del fuero del trabajo de la Ciudad Autónoma de Buenos Aires, garantizando el adecuado funcionamiento transitorio de la Justicia Nacional del Trabajo, en virtud del acuerdo aprobado por el artículo precedente de esta ley, y a celebrar los convenios específicos para la transferencia de recursos que fueran necesarios para su adecuada ejecución en los términos de su Cláusula Séptima."]},{"n":92,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Las disposiciones de la ley 18.345 mantendrán su vigencia hasta tanto se encuentre…","s":"Las disposiciones de la ley 18.345 mantendrán su vigencia hasta tanto se encuentre concluido el proceso de transferencia de competencias establecido en el “Acuerdo de Transferencia de la Función Judicial en Materia…","p":["Las disposiciones de la ley 18.345 mantendrán su vigencia hasta tanto se encuentre concluido el proceso de transferencia de competencias establecido en el “Acuerdo de Transferencia de la Función Judicial en Materia Laboral del Ámbito Nacional a la Justicia del Trabajo de la Ciudad Autónoma de Buenos Aires”, aprobado por la presente ley."]},{"n":93,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Las modificaciones introducidas por el presente Título serán de aplicación a todos…","s":"Las modificaciones introducidas por el presente Título serán de aplicación a todos los procesos en trámite a partir del día siguiente al de la publicación de la presente ley en el Boletín Oficial, con excepción de…","p":["Las modificaciones introducidas por el presente Título serán de aplicación a todos los procesos en trámite a partir del día siguiente al de la publicación de la presente ley en el Boletín Oficial, con excepción de lo dispuesto en los artículos 79 y 80 de la presente ley."]},{"n":94,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Las modificaciones introducidas por los artículos 79 y 80 de la presente ley serán…","s":"Las modificaciones introducidas por los artículos 79 y 80 de la presente ley serán de aplicación a partir del día siguiente al de la publicación de la presente ley en el Boletín Oficial y en aquellos procesos en…","p":["Las modificaciones introducidas por los artículos 79 y 80 de la presente ley serán de aplicación a partir del día siguiente al de la publicación de la presente ley en el Boletín Oficial y en aquellos procesos en trámite en los que la competencia estuviere pendiente de resolución."]},{"n":95,"nt":[],"h":"Sustitúyese el artículo 60 de la Ley de Honorarios Profesionales de Abogados, Procuradores y Auxiliares de la Justicia Nacional y Federal N° 27.423 y su modificación, por el siguiente:","ac":"Sustituye","tg":"Honorarios","rf":"art. 60","t":"Sustituye art. 60 · Honorarios","s":"En los procesos no susceptibles de apreciación pecuniaria, los honorarios de los peritos y de los peritos liquidadores de averías serán fijados conforme a las pautas valorativas del artículo 16 y en un mínimo de…","p":["Artículo 60: En los procesos no susceptibles de apreciación pecuniaria, los honorarios de los peritos y de los peritos liquidadores de averías serán fijados conforme a las pautas valorativas del artículo 16 y en un mínimo de dos (2) UMA, siendo suficiente para la fijación de los honorarios mínimos, la aceptación del cargo conferido. En el caso de los demás auxiliares de la Justicia, se aplicarán las normas específicas."]},{"n":96,"nt":[],"h":"Sustitúyese el artículo 61 de la Ley de Honorarios Profesionales de Abogados, Procuradores y Auxiliares de la Justicia Nacional y Federal N° 27.423 y su modificación, por el siguiente:","ac":"Sustituye","tg":"Honorarios","rf":"art. 61","t":"Sustituye art. 61 · Honorarios","s":"En los procesos susceptibles de apreciación pecuniaria, por las actuaciones de primera instancia hasta la sentencia, los honorarios del perito y del perito liquidador de averías serán fijados conforme lo establece…","p":["Artículo 61: En los procesos susceptibles de apreciación pecuniaria, por las actuaciones de primera instancia hasta la sentencia, los honorarios del perito y del perito liquidador de averías serán fijados conforme lo establece el artículo 32. Para tales casos los honorarios mínimos a regular alcanzan a dos (2) UMA. En el caso de los demás auxiliares de la Justicia se aplicarán las normas específicas."]},{"n":97,"nt":[],"h":"Incorpórase como artículo 61 bis de la Ley de Honorarios Profesionales de Abogados, Procuradores y Auxiliares de la Justicia Nacional y Federal N° 27.423 y su modificación, el siguiente:","ac":"Incorpora","tg":"Honorarios","rf":"art. 61","t":"Incorpora art. 61 · Honorarios","s":"Los honorarios de los peritos que intervengan en las controversias judiciales, no estarán vinculados a la cuantía del respectivo juicio, ni al porcentaje de incapacidad que se dictamine en caso de producirse una…","p":["Artículo 61 bis: Los honorarios de los peritos que intervengan en las controversias judiciales, no estarán vinculados a la cuantía del respectivo juicio, ni al porcentaje de incapacidad que se dictamine en caso de producirse una pericia médica. Su regulación responderá exclusivamente a la apreciación judicial de la labor técnica realizada en el pleito y su relevancia; calidad y extensión en lo concreto y deberá fijarse en un monto que asegure una adecuada retribución al perito.","Por cada pericia, se fijará un monto mínimo de dos (2) UMA.","En caso de finalizar el proceso por transacción, avenimiento y conciliación, sin que el perito haya presentado la pericia encargada, se le regulará un cuarto (1/4) de UMA en tanto el perito haya aceptado el cargo."]},{"n":98,"nt":[],"h":"Sustitúyese el artículo 7º ter de la ley 24.013 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Ley de Empleo","rf":"art. 7 ter","t":"Sustituye art. 7 ter · Ley de Empleo","s":"Artículo 7º ter:","p":["Artículo 7º ter: El trabajador deberá informar ante la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, los aspectos que configuren irregular la registración del contrato de trabajo: falta de inscripción, la real fecha de ingreso y/o el monto total de la remuneración. La denuncia deberá formularse inmediatamente de conocida la irregularidad de la registración."]},{"n":99,"nt":[],"h":"Incorpórese como inciso i) al artículo 114 de la ley 24.013 y sus modificaciones, el siguiente texto:","ac":"Incorpora","tg":"Ley de Empleo","rf":"art. 114","t":"Incorpora art. 114 · Ley de Empleo","s":"i) Extinción por mutuo acuerdo de las partes en los términos del artículo 241 de la ley 20.744 (t.o.","p":["i) Extinción por mutuo acuerdo de las partes en los términos del artículo 241 de la ley 20.744 (t.o. 1976) y sus modificaciones."]},{"n":100,"nt":[],"h":"Sustitúyese el artículo 3° de la ley 11.544 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Jornada de trabajo","rf":"art. 3","t":"Sustituye art. 3 · Jornada de trabajo","s":"En las explotaciones comprendidas en el artículo 1°, se admiten las siguientes excepciones:","p":["Artículo 3°: En las explotaciones comprendidas en el artículo 1°, se admiten las siguientes excepciones:","a) Cuando se trate de empleos de dirección o de vigilancia;","b) Cuando los trabajos se efectúen por equipos, la duración del trabajo podrá ser prolongada más allá de las ocho (8) horas por día y de cuarenta y ocho (48) semanales;","c) En caso de accidente ocurrido o inminente, o en caso de trabajo de urgencia a efectuarse en las máquinas, herramientas o instalaciones, o en caso de fuerza mayor, pero tan sólo en la medida necesaria para evitar que un inconveniente serio ocurra en la marcha regular del establecimiento y únicamente cuando el trabajo no pueda ser efectuado durante la jornada normal, debiendo comunicarse el hecho de inmediato a las autoridades encargadas de velar por el cumplimiento de la presente ley."]},{"n":101,"nt":[],"h":"Sustitúyese el artículo 24 de la ley 25.877 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Régimen laboral","rf":"art. 24","t":"Sustituye art. 24 · Régimen laboral","s":"Los conflictos colectivos que pudieren afectar la normal prestación de servicios esenciales o actividades de importancia trascendental quedan sujetos a las siguientes garantías de prestación de servicios mínimos.","p":["Artículo 24: Los conflictos colectivos que pudieren afectar la normal prestación de servicios esenciales o actividades de importancia trascendental quedan sujetos a las siguientes garantías de prestación de servicios mínimos.","En lo que respecta a la prestación de servicios mínimos, en el caso de los servicios esenciales, en ningún caso se podrá negociar o imponer a las partes una cobertura menor al setenta y cinco por ciento (75%) de la prestación normal del servicio de que se tratare.","En el caso de las actividades o servicios de importancia trascendental, en ningún caso se podrá negociar o imponer a las partes una cobertura menor al cincuenta por ciento (50%).","Se considerarán servicios esenciales en sentido estricto las siguientes actividades:","a. El cuidado de menores y educación de niveles guardería, preescolar, primario y secundario, así como la educación especial;","b. Los servicios sanitarios y hospitalarios, así como el transporte y distribución de medicamentos e insumos hospitalarios y los servicios farmacéuticos;","c. La producción, transporte y distribución y comercialización de agua potable, gas, petróleo y otros combustibles y energía eléctrica;","d. Los servicios de telecomunicaciones, incluyendo internet y comunicaciones satelitales;","e. El servicio de recolección de residuos;","f. La aeronáutica comercial y el control de tráfico aéreo y portuario; incluyendo balizamiento, dragado, amarre, estiba, desestiba, remolque de buques y todos los servicios portuarios;","g. El transporte de caudales; y h. Los servicios privados de seguridad y custodia.","Se consideran actividades de importancia trascendental las siguientes:","a. El transporte marítimo y fluvial de personas y/o mercaderías y/o carga, servicios conexos y operaciones costa afuera, a través de los distintos medios que se utilicen para tal fin;","b. Los servicios aduaneros y migratorios, y demás vinculados al comercio exterior;","c. La producción de medicamentos y/o insumos hospitalarios;","d. El transporte terrestre y subterráneo de personas y/o mercaderías a través de los distintos medios que se utilicen para tal fin;","e. Los servicios de radio y televisión; f. Las actividades industriales continuas, incluyendo siderurgia y la producción de aluminio, actividad química y la actividad cementera;","g. La industria alimenticia en toda su cadena de valor;","h. Los servicios bancarios, financieros, servicios hoteleros y gastronómicos y el comercio electrónico; e i. La producción de bienes y/o servicios de toda actividad que estuvieran afectados a compromisos de exportación.","La Autoridad de Aplicación a propuesta de una comisión independiente y autónoma, denominada Comisión de Garantías, integrada según se establezca en la reglamentación por cinco (5) miembros de reconocida solvencia técnica, profesional y académica en materia de relaciones del trabajo, del derecho laboral o del derecho constitucional y destacada trayectoria, podrá, mediante resolución fundada, calificar como servicio esencial o servicio de importancia trascendental una actividad no incluida en las enumeraciones precedentes, cuando se diere alguna de las siguientes circunstancias:","a) La extensión y duración de la interrupción de la actividad de que se tratare pudiere poner en peligro la vida, la salud o la seguridad de la persona en toda o parte de la comunidad;","b) La actividad afectada constituyere un servicio público de importancia trascendental o de utilidad pública;","c) La interrupción o suspensión del servicio pudiere provocar una situación de crisis nacional aguda que hiciere peligrar las condiciones normales o de existencia de parte de la población; y d) La interrupción o suspensión de la producción pudiere poner en peligro el adecuado abastecimiento de productos críticos para la población.","Las fuerzas de seguridad en ningún caso podrán brindar una cobertura menor al cien por ciento (100%) de la prestación normal de su servicio.","El Poder Ejecutivo nacional dictará la reglamentación correspondiente y la Autoridad de Aplicación, las normas complementarias, aclaratorias y operativas que resulten necesarias."]},{"n":102,"nt":[],"h":"","ac":"Incorpora","tg":"Régimen laboral","rf":"art. 24","t":"Incorpora art. 24 · Régimen laboral","s":"Incorpóranse al artículo 24 de la ley 25.877 y sus modificaciones, los siguientes apartados:","p":["Incorpóranse al artículo 24 de la ley 25.877 y sus modificaciones, los siguientes apartados:","24.1: Cumplida la obligación impuesta a las partes del conflicto por el artículo 2º de la ley 14.786 y vencido el plazo de quince (15) días previsto en el artículo 11 de la misma ley, la parte que se propusiere ejercer medidas de acción directa que involucren a los servicios referidos en este artículo, deberá preavisarlo a la otra parte y a la Autoridad de Aplicación en forma fehaciente y con cinco (5) días de anticipación a la fecha en que se realizará la medida.","24.2: Dentro del día inmediato siguiente a aquél en que se efectuó el preaviso establecido en el artículo anterior, las partes acordarán ante la Autoridad de Aplicación sobre los servicios mínimos que se mantendrán con arreglo a lo dispuesto en este artículo, párrafo segundo, las modalidades de su ejecución, señalando concreta y detalladamente la forma en que se ejecutarán las prestaciones, incluyendo la designación del personal involucrado, pautas horarias, asignación de funciones y equipos.","24.3: Si las partes no cumplieran con las obligaciones previstas en los apartados que anteceden dentro de los plazos establecidos para ello, o si los servicios mínimos acordados por las mismas fueren insuficientes, la Autoridad de Aplicación, en consulta con la Comisión de Garantías, fijará los servicios mínimos para asegurar la prestación del servicio, cantidad de trabajadores que se asignará a su ejecución, pautas horarias, asignación de funciones y equipos, procurando resguardar tanto el derecho de huelga como los derechos de los usuarios afectados. La decisión será notificada a las partes involucradas y, en caso de incumplimiento, se procederá de acuerdo a lo previsto en este artículo, apartado 24.6.","24.4: Las partes en cuanto vinculadas a la prestación de un servicio o actividad considerada esencial o de importancia trascendental garantizarán la ejecución de los servicios mínimos y deberán poner en conocimiento de los usuarios, por medios de difusión masiva, las modalidades que revestirá la prestación durante el conflicto, dentro del plazo de cuarenta y ocho (48) horas antes del inicio de las medidas de acción directa, detallando el tiempo de iniciación y la duración de las medidas, la forma de distribución de los servicios mínimos garantizados y la reactivación de las prestaciones. Asimismo, deberán arbitrar los medios tendientes a la normalización de la actividad una vez finalizada la ejecución de dichas medidas. 24.5: Si la medida de acción directa consistiere en paro nacional de actividades o cualquier otra ejercida por centrales sindicales u organizaciones empresariales con representatividad sectorial múltiple, se aplicarán las disposiciones establecidas en el presente artículo.","24.6: La inobservancia por alguna de las partes de los procedimientos conciliatorios establecidos en la legislación vigente, o el incumplimiento de las resoluciones dictadas por la Autoridad de Aplicación o de los pronunciamientos emitidos por la Comisión de Garantías en ejercicio de sus facultades, dará lugar a la aplicación de las sanciones establecidas por las leyes 14.786, 23.551 y 25.212, sus modificatorias y sus normas reglamentarias y complementarias, según corresponda. La falta de cumplimiento del deber de trabajar por las personas obligadas a la ejecución de los servicios mínimos, dará lugar a las responsabilidades previstas en las disposiciones legales, estatutarias o convencionales que les resultaren aplicables."]},{"n":103,"nt":[],"h":"Sustitúyese el artículo 84 de la ley N° 24.467 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Régimen PyME","rf":"art. 84","t":"Sustituye art. 84 · Régimen PyME","s":"Las empresas comprendidas en el presente Título únicamente deberán registrar a los trabajadores mediante su inscripción en los sistemas que la Agencia de Recaudación y Control Aduanero (ARCA), organismo…","p":["Artículo 84: Las empresas comprendidas en el presente Título únicamente deberán registrar a los trabajadores mediante su inscripción en los sistemas que la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, disponga a tal fin, sin que, a estos efectos, se les pueda exigir el cumplimiento de trámite adicional alguno ante otra autoridad nacional, provincial o municipal.","La Agencia de Recaudación y Control Aduanero (ARCA) establecerá la información de la relación laboral y demás datos que deberán aportar los empleadores y los requisitos a cumplir para proceder a esta inscripción, siendo la misma suficiente a los fines de cumplimentar lo dispuesto por el artículo 7° de la ley 24.013 y sus modificaciones, sin poder requerirse mayores exigencias que las solicitadas por la precitada Agencia."]},{"n":104,"nt":[],"h":"Sustitúyese el artículo 85 de la ley N° 24.467 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Régimen PyME","rf":"art. 85","t":"Sustituye art. 85 · Régimen PyME","s":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, dispondrá un Registro Único de Personal a los fines de registrar a aquellos…","p":["Artículo 85: La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, dispondrá un Registro Único de Personal a los fines de registrar a aquellos trabajadores dependientes de las empresas comprendidas en esta ley.","La Agencia de Recaudación y Control Aduanero (ARCA) establecerá la información de la relación laboral y demás datos que deberán aportar los empleadores y los requisitos a cumplir para proceder a esta inscripción, siendo la misma suficiente a los fines de cumplimentar lo dispuesto por el artículo 7° de la ley 24.013 y sus modificaciones, sin poder requerirse mayores exigencias que las solicitadas por la precitada Agencia."]},{"n":105,"nt":[],"h":"Sustitúyese el artículo 6° de la ley N° 12.713 y su modificatoria, por el siguiente:","ac":"Sustituye","tg":"Trabajo a domicilio","rf":"art. 6","t":"Sustituye art. 6 · Trabajo a domicilio","s":"Los empresarios, intermediarios y talleristas que den trabajo a domicilio, deberán registrar a los trabajadores mediante su inscripción en los sistemas que la Agencia de Recaudación y Control Aduanero (ARCA)…","p":["Artículo 6°: Los empresarios, intermediarios y talleristas que den trabajo a domicilio, deberán registrar a los trabajadores mediante su inscripción en los sistemas que la Agencia de Recaudación y Control Aduanero (ARCA) disponga a tal fin, sin que, a estos efectos, se les pueda exigir el cumplimiento de trámite adicional alguno ante otra autoridad.","La Agencia de Recaudación y Control Aduanero (ARCA) establecerá la información de la relación laboral y demás datos que deberán aportar los empleadores y los requisitos a cumplir para proceder a esta inscripción, siendo la misma suficiente a los fines de cumplimentar lo dispuesto por el artículo 7° de la ley 24.013, sin poder requerirse mayores exigencias que las solicitadas por la precitada Agencia."]},{"n":106,"nt":[],"h":"Sustitúyese el artículo 31 de la ley N° 12.713 y su modificatoria, por el siguiente:","ac":"Sustituye","tg":"Trabajo a domicilio","rf":"art. 31","t":"Sustituye art. 31 · Trabajo a domicilio","s":"El empresario, intermediario o tallerista que no se inscriba en los sistemas de la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, o…","p":["Artículo 31: El empresario, intermediario o tallerista que no se inscriba en los sistemas de la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, o destruya los rótulos y marcas de las mercancías elaboradas, o quien niegue sin causa justificada la exhibición de dicha inscripción, o incumpla cualquiera de las disposiciones establecidas, será sancionado conforme los términos contenidos en el Régimen General de Sanciones por Infracciones Laborales previsto en el Anexo II de la ley 25.212 y sus modificatorias."]},{"n":107,"nt":[],"h":"Sustitúyese el artículo 7° de la ley N° 26.844 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Casas particulares","rf":"art. 7","t":"Período de prueba","s":"El contrato de trabajo por tiempo indeterminado se entenderá celebrado a prueba durante los primeros seis (6) meses de vigencia.","p":["Artículo 7°: Período de prueba. El contrato de trabajo por tiempo indeterminado se entenderá celebrado a prueba durante los primeros seis (6) meses de vigencia. Cualquiera de las partes podrá extinguir la relación durante ese lapso sin expresión de causa y sin generarse derecho a indemnización alguna con motivo de la extinción. El empleador no podrá contratar a un mismo empleado más de una (1) vez utilizando el período de prueba."]},{"n":108,"nt":[],"h":"Sustitúyese el artículo 14 de la ley N° 26.844 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Casas particulares","rf":"art. 14","t":"Sustituye art. 14 · Casas particulares","s":"Derechos y deberes comunes para el personal con y sin retiro.","p":["Artículo 14: Derechos y deberes comunes para el personal con y sin retiro. Los derechos y deberes comunes para las modalidades, con y sin retiro, serán:","14.1: Derechos del personal.","a) Jornada de trabajo que no podrá exceder de ocho (8) horas diarias o cuarenta y ocho (48) horas semanales. Podrá establecerse una distribución semanal desigual de las horas de trabajo, en tanto no importe una jornada ordinaria superior a las nueve (9) horas;","b) Descanso semanal de treinta y cinco (35) horas corridas a partir del sábado a las trece (13) horas;","c) Ropa y elementos de trabajo que deberán ser provistos por el empleador. Una vez transcurrido el periodo de prueba, la presente obligación podrá cumplirse a través del pago de una suma dineraria no remunerativa;","d) Alimentación sana, suficiente y que asegure la perfecta nutrición del personal. Dicha alimentación comprenderá: desayuno, almuerzo, merienda y cena, las que en cada caso deberán brindarse en función de la modalidad de prestación contratada y la duración de la jornada;","e) Obligación por parte del empleador de contratar a favor del personal un seguro por los riesgos del trabajo, según lo disponga la normativa específica en la materia y conforme lo establecido en el artículo 74 de la presente ley;","f) En el caso del personal con retiro que se desempeñe para un mismo empleador, entre el cese de una jornada y el comienzo de la otra deberá mediar una pausa no inferior a doce (12) horas.","14.2: Deberes del personal. El personal comprendido en el presente régimen tendrá los siguientes deberes:","a) Cumplir las instrucciones de servicio que se le impartan;","b) Cuidar las cosas confiadas a su vigilancia y diligencia;","c) Observar prescindencia y reserva en los asuntos de la casa de los que tuviere conocimiento en el ejercicio de sus funciones;","d) Preservar la inviolabilidad del secreto personal y familiar en materia política, moral, religiosa y en las demás cuestiones que hagan a la vida privada e intimidad de quienes habiten la casa en la que prestan servicios;","e) Desempeñar sus funciones con diligencia y colaboración."]},{"n":109,"nt":[],"h":"Sustitúyese el artículo 20 de la ley N° 26.844 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Casas particulares","rf":"art. 20","t":"Recibos","s":"Formalidad.","p":["Artículo 20: Recibos. Formalidad. Constancias bancarias. Prueba de pago. El recibo deberá ser instrumentado de forma electrónica, emitido por el sistema que determine la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía.","La documentación obrante en el banco o la constancia que éste entregare al empleador constituirá prueba suficiente del hecho de pago."]},{"n":110,"nt":[],"h":"Sustitúyese el artículo 70 de la ley N° 26.844 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Casas particulares","rf":"art. 70","t":"Actualización","s":"Tasa aplicable.","p":["Artículo 70: Actualización. Tasa aplicable. Los créditos demandados provenientes de las relaciones laborales reguladas por la presente ley serán actualizados y devengarán intereses en los mismos términos y condiciones previstas en el artículo 276 de la Ley de Contrato de Trabajo Nº 20.744 (t.o. 1976) y sus modificaciones, resultando igualmente de aplicación las normas contenidas en los artículos 277 y 278 de la citada ley y el artículo 55 de la ley de Modernización Laboral."]},{"n":111,"nt":[],"h":"Sustitúyese el artículo 12 de la ley N° 26.727 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Trabajo agrario","rf":"art. 12","t":"Contratación, subcontratación y cesión","s":"Solidaridad.","p":["Artículo 12: Contratación, subcontratación y cesión. Solidaridad. Los trabajadores serán considerados empleados directos de aquellos que registren la relación laboral, sin perjuicio de haber sido contratados con vistas a utilizar su prestación o de proporcionarlos a terceras empresas. La empresa usuaria será responsable solidaria por las obligaciones laborales y de la seguridad social respecto de los trabajadores proporcionados, exclusivamente respecto de aquellas devengadas durante el tiempo de efectiva prestación para esta última. Aquellos propietarios que den en arrendamiento maquinarias, equipamiento o las tierras de su titularidad, en ningún caso serán considerados responsables solidarios por las obligaciones emergentes de la relación laboral entre los trabajadores y aquellos que los hubieran registrado, resultando ajenos a dicho vínculo."]},{"n":112,"nt":[],"h":"","ac":"Modifica","tg":"Trabajo agrario","rf":"art. 17","t":"Modifica art. 17 · Trabajo agrario","s":"Modifíquese el artículo 17 de la ley N° 26.727 y sus modificaciones, el que quedará redactado de la siguiente forma:","p":["Modifíquese el artículo 17 de la ley N° 26.727 y sus modificaciones, el que quedará redactado de la siguiente forma:","Artículo 17: Contrato de trabajo temporario. Habrá contrato de trabajo temporario cuando la relación laboral se origine en necesidades de la explotación de carácter cíclico o estacional, o por procesos temporales propios de la actividad agrícola, pecuaria, forestal o de las restantes actividades comprendidas dentro del ámbito de aplicación de la presente ley, así como también, las que se realizaren en ferias y remates de hacienda.","Se encuentran también comprendidos en esta categoría los trabajadores contratados para la realización de tareas ocasionales, accidentales o supletorias.","La celebración de sucesivos contratos de trabajo temporario con el mismo empleador para atender a las necesidades cíclicas o estacionales descriptas en el presente artículo, cualquiera sea el número de contrataciones, no modificará la naturaleza temporaria del vínculo."]},{"n":113,"nt":[],"h":"","ac":"Sustituye","tg":"Trabajo agrario","rf":"art. 16","t":"Sustituye art. 16 · Trabajo agrario","s":"Sustitúyese el artículo 16 de la ley N° 26.727 y sus modificaciones, por el siguiente:","p":["Sustitúyese el artículo 16 de la ley N° 26.727 y sus modificaciones, por el siguiente: Artículo 16: Contrato de trabajo agrario permanente de prestación continua. El contrato de trabajo agrario se entenderá celebrado con carácter permanente y como de prestación continua, salvo los casos previstos expresamente por esta ley. Su extinción se regirá por lo dispuesto en el Título XII de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones.","Para los trabajadores de esta modalidad, el período de prueba será de ocho (8) meses."]},{"n":114,"nt":[],"h":"Sustitúyese el artículo 32 de la ley N° 26.727 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Trabajo agrario","rf":"art. 32","t":"Fijación de remuneraciones","s":"Las remuneraciones serán acordadas entre la representación trabajadora y la empleadora conforme la ley 14.250 (t.o.","p":["Artículo 32: Fijación de remuneraciones. Las remuneraciones serán acordadas entre la representación trabajadora y la empleadora conforme la ley 14.250 (t.o. 2004) y su modificación y la ley 23.546 (t.o. 2004), con posterior homologación de la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano. No podrán ser inferiores al salario mínimo vital y móvil vigente, y su monto se determinará por mes, por día y por hora.","La negociación deberá realizarse en el marco y con la coordinación de la Comisión Nacional de Trabajo Agrario."]},{"n":115,"nt":[],"h":"Sustitúyese el artículo 34 de la ley N° 26.727 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Trabajo agrario","rf":"art. 34","t":"Remuneración mínima por rendimiento del trabajo","s":"Salario mínimo garantizado.","p":["Artículo 34: Remuneración mínima por rendimiento del trabajo. Salario mínimo garantizado. La remuneración por rendimiento del trabajo se determinará en la medida del trabajo que se haya efectuado, pero en ningún caso podrá ser inferior, para una jornada de labor y a ritmo normal de trabajo, a la remuneración mínima que acuerden las partes en el marco de la negociación del artículo 32 y para esa unidad de tiempo.","En los casos de actividades cuyas remuneraciones no hayan sido fijadas o actualizadas conforme lo previsto en la presente ley, se aplicarán las dispuestas con carácter general. La remuneración mínima sustituirá a la que por aplicación del sistema de rendimiento del trabajo pudiere corresponder cuando el trabajador, estando a disposición del empleador y por razones no imputables al primero, no alcanzare a obtener ese mínimo y aún cuando ello ocurriere a causa de fenómenos meteorológicos que impidieren la realización de las tareas en la forma prevista o habitual."]},{"n":116,"nt":[],"h":"Incorpórase como artículo 34 bis a la ley N° 26.727 y sus modificatorias, el siguiente texto:","ac":"Incorpora","tg":"Trabajo agrario","rf":"art. 34","t":"Compatibilidad entre trabajo rural registrado y prestaciones sociales","s":"Los trabajadores que sean contratados bajo las modalidades de trabajo temporario, previstas en la ley 26.727 y sus modificatorias, así como aquellos comprendidos en el artículo 96 de la ley 20.744 y sus…","p":["Artículo 34 bis: Compatibilidad entre trabajo rural registrado y prestaciones sociales. Los trabajadores que sean contratados bajo las modalidades de trabajo temporario, previstas en la ley 26.727 y sus modificatorias, así como aquellos comprendidos en el artículo 96 de la ley 20.744 y sus modificatorias, tendrán derecho a percibir las asignaciones familiares contributivas establecidas en la ley 24.714.","Al cesar la relación laboral y dejar de estar alcanzados por el régimen contributivo, los trabajadores accederán automáticamente al régimen de asignaciones familiares no contributivas correspondiente, garantizándose la continuidad en la percepción del beneficio."]},{"n":117,"nt":[],"h":"Sustitúyese el artículo 89 de la ley N° 26.727 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Trabajo agrario","rf":"art. 89","t":"Atribuciones y deberes","s":"Serán atribuciones y deberes de la Comisión Nacional de Trabajo Agrario (CNTA):","p":["Artículo 89: Atribuciones y deberes. Serán atribuciones y deberes de la Comisión Nacional de Trabajo Agrario (CNTA):","a) Dictar su reglamento interno y organizar su funcionamiento;","b) Dictar el reglamento y organizar el funcionamiento de las comisiones asesoras regionales, determinando sus respectivas jurisdicciones conforme a las características ecológicas, productivas y económicas de cada zona; c) Establecer las categorías de los trabajadores permanentes que se desempeñen en cada tipo de tarea, determinando sus características, modalidades especiales y condiciones generales de trabajo;","d) Establecer, observando las pautas de la presente ley, las modalidades especiales y las condiciones de trabajo generales de las distintas actividades cíclicas, estacionales u ocasionales y sus respectivas remuneraciones, con antelación suficiente al comienzo de las tareas, teniendo especialmente en cuenta las propuestas remitidas por las comisiones asesoras regionales;","e) Convocar a la negociación salarial del sector, que deberá ser acordada por el sector trabajador y el empleador conforme las leyes 14.250 (t.o. 2004) y sus modificaciones y 23.546 (t.o. 2004), con posterior homologación del organismo de aplicación;","f) Determinar la forma de integración de los equipos mínimos o composición de cuadrillas para las tareas que fueren reglamentadas, cuando resultare necesario;","g) Dictar normas sobre las condiciones mínimas a las que deberán ajustarse las prestaciones de alimentación y vivienda a cargo del empleador teniendo en consideración las pautas de la presente ley y las características de cada región;","h) Promover el cumplimiento de las normas de higiene y seguridad en el trabajo rural;","i) Aclarar las resoluciones que se dicten en cumplimiento de esta ley;","j) Asesorar a los organismos nacionales, provinciales, de la Ciudad Autónoma de Buenos Aires, municipales o autárquicos que lo solicitaren;","k) Solicitar de las reparticiones nacionales, provinciales, de la Ciudad Autónoma de Buenos Aires, municipales o entes autárquicos, los estudios técnicos, económicos y sociales vinculados al objeto de la presente ley y sus reglamentaciones;","l) Fijar asignaciones no remunerativas en compensación por suspensiones de la prestación laboral que se fundaren por causales de emergencia climáticas, económicas, desastre natural, cualquier otra no imputable al empleador y/o cualquier otra circunstancia de fuerza mayor debidamente comprobada. En todos los casos, se requerirá el voto favorable de la parte empleadora. Los programas serán opcionales y no vinculantes para el empleador; m) Celebrar acuerdos de cooperación con entidades públicas y privadas, tanto nacionales como internacionales;","n) Encarar acciones de capacitación de los actores sociales que negocian en las comisiones asesoras regionales dependientes de la misma y de difusión de la normativa aplicable a los trabajadores comprendidos en el ámbito de aplicación de la presente ley.","Las competencias son únicamente las taxativamente enunciadas."]},{"n":118,"nt":[],"h":"Incorpórase como artículo 106 a la ley N° 26.727 y sus modificaciones, el siguiente texto:","ac":"Incorpora","tg":"Trabajo agrario","rf":"art. 106","t":"Intereses","s":"Los créditos provenientes de las relaciones de trabajo agrarias serán actualizados y devengarán intereses en los términos y bajo las condiciones previstas en el artículo 276 de la Ley de Contrato de Trabajo N°…","p":["Artículo 106: Intereses. Los créditos provenientes de las relaciones de trabajo agrarias serán actualizados y devengarán intereses en los términos y bajo las condiciones previstas en el artículo 276 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificatorias, resultando igualmente de aplicación las normas contenidas en los artículos 277 y 278 de la citada ley y el artículo 55 de la Ley de Modernización Laboral."]},{"n":119,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Objeto","s":"El presente régimen tiene por objeto establecer reglas adecuadas para promover el desarrollo de la economía de plataformas tecnológicas en el país, asegurando la independencia de quienes ofrecen o prestan a través…","p":["Objeto. El presente régimen tiene por objeto establecer reglas adecuadas para promover el desarrollo de la economía de plataformas tecnológicas en el país, asegurando la independencia de quienes ofrecen o prestan a través de dichas plataformas, los servicios de movilidad de personas y/o reparto de bienes, productos u objetos."]},{"n":120,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Definiciones","s":"A los fines del presente régimen se entiende por:","p":["Definiciones. A los fines del presente régimen se entiende por:","1. Servicio de Reparto a través de plataformas tecnológicas: comprende el retiro, traslado o entrega de bienes, productos u objetos, sin tratamiento o procesamiento, utilizando cualquier medio de transporte, incluyendo la prestación del servicio a pie, contratados a través de una plataforma tecnológica.","2. Servicio de movilidad de personas a través de plataformas tecnológicas: comprende el traslado de personas, concertado a través de una plataforma que conecta a usuarios y prestadores independientes por un precio de traslado convenido.","3. Prestador independiente de plataformas tecnológicas: persona humana que conviene la prestación del servicio privado de reparto y/o de movilidad de personas a usuarios a través de las plataformas tecnológicas de forma independiente.","4. Contrato de prestación del servicio de reparto a través de plataformas tecnológicas: contrato que se perfecciona con la aceptación a través de la plataforma entre un usuario consumidor que solicita un traslado y/o compra un bien a un particular y/o a un comercio adherido y/o solicita un servicio de reparto y un prestador independiente de plataformas que presta dicho servicio por el que recibe una retribución dineraria a través de la plataforma en la cual se registra este último.","5. Plataforma Tecnológica: aquella persona jurídica que, a título oneroso, administra o gestiona un código ejecutable en aplicaciones tecnológicas de dispositivos móviles o fijos que permite al prestador independiente de plataformas ofrecer y ser contratado por un usuario para ejecutar sus servicios de movilidad de personas y/o reparto de bienes, productos u objetos en un territorio geográfico específico y de forma independiente."]},{"n":121,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Libertad de conexión del prestador independiente a la plataforma tecnológica del…","s":"Libertad de conexión del prestador independiente a la plataforma tecnológica del servicio de movilidad de personas y reparto.","p":["Libertad de conexión del prestador independiente a la plataforma tecnológica del servicio de movilidad de personas y reparto. El prestador independiente será libre de conectarse a cualquiera de las plataformas, a través de sus respectivas aplicaciones, ofreciendo sus servicios de reparto y/o movilidad de personas durante los horarios y en el tiempo que estime convenientes, pudiendo el prestador libremente aceptar y/o rechazar solicitudes según su conveniencia y oportunidad. También será libre de definir el medio de transporte en que preste el servicio, siempre que cumpla con los requisitos legales y convencionales para ellos. Los prestadores independientes tendrán derecho a conocer los criterios utilizados por las plataformas para la agrupación de los mismos. Los criterios deberán ser expresados en lenguaje claro y deben estar disponibles de manera digital para su consulta en la máxima medida en que el derecho al secreto comercial de la plataforma lo permita."]},{"n":122,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Ámbito de Aplicación","s":"El presente régimen rige en todo el territorio de la República Argentina respecto de las relaciones que se establezcan entre prestadores independientes que prestan sus servicios a través de plataformas, en tanto…","p":["Ámbito de Aplicación. El presente régimen rige en todo el territorio de la República Argentina respecto de las relaciones que se establezcan entre prestadores independientes que prestan sus servicios a través de plataformas, en tanto éstas tengan como objeto principal intermediar en el servicio de reparto y/o movilidad de personas."]},{"n":123,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Principio de libertad de formas","s":"Las partes podrán acordar libremente los términos del contrato.","p":["Principio de libertad de formas. Las partes podrán acordar libremente los términos del contrato."]},{"n":124,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Obligaciones de las plataformas tecnológicas","s":"Son obligaciones específicas de las plataformas tecnológicas:","p":["Obligaciones de las plataformas tecnológicas. Son obligaciones específicas de las plataformas tecnológicas:","1. Brindar a los prestadores independientes la información necesaria a efectos que pueda decidir aceptar o rechazar la prestación del servicio de movilidad de personas y/o reparto requerida por un usuario.","2. Respetar la libertad de conexión del prestador independiente.","3. Ofrecer, a través de medios digitales, información vinculada a la normativa en seguridad vial y a la prestación del servicio, destinadas a los prestadores independientes.","4. Facilitar el acceso a los elementos de seguridad vial aplicables según el tipo de vehículo.","5. Contar con un mecanismo digital de reporte de quejas de manera simple, accesible y constantemente disponible para los usuarios, debiendo establecer un procedimiento eficaz para solucionar o dar respuesta a los reclamos.","6. Arbitrar los medios para que los prestadores independientes tengan instancias de atención a través de operadores y/o recepcionistas, con un rol estrictamente de soporte auxiliar, en la cual puedan obtener justificaciones respecto a las decisiones que afecten su operatoria con las plataformas."]},{"n":125,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Obligaciones de los prestadores independientes","s":"A los efectos de poder utilizar las plataformas, los prestadores independientes deben cumplir las siguientes obligaciones:","p":["Obligaciones de los prestadores independientes. A los efectos de poder utilizar las plataformas, los prestadores independientes deben cumplir las siguientes obligaciones:","1. Ser titular de la cuenta de usuario necesaria para prestar sus servicios a través de las diferentes plataformas de intermediación digital que utilice.","2. Estar inscripto debidamente ante las autoridades fiscales correspondientes y cumplir con todas sus obligaciones tributarias y de seguridad social, notificando cualquier alteración en su situación fiscal. Asimismo, deberán hacer los pagos de los aportes respectivos a través de los cuales tendrán acceso a la Prestación Básica Universal (PBU), el retiro por invalidez o la pensión por fallecimiento, previstas en el artículo 17 de la ley 24.241 y sus modificaciones y a las prestaciones del Sistema Nacional del Seguro de Salud, entre otras, según corresponda en cada caso.","3. Tener cuenta bancaria o billetera electrónica cuya Clave Bancaria Uniforme (CBU) o Clave Virtual Uniforme (CVU) sea debidamente informada a la plataforma tecnológica, a fin de recibir las transferencias que correspondan por sus servicios.","4. Respetar las normas de tránsito al momento de la prestación del servicio.","5. Cumplir su prestación debidamente y realizar los viajes que libremente decida en beneficio de tantos usuarios como decida."]},{"n":126,"nt":[],"h":"","ac":"Deroga","tg":"","rf":"","t":"Deroga","s":"Derechos de los prestadores independientes.","p":["Derechos de los prestadores independientes. Los prestadores independientes de plataformas tecnológicas del servicio de movilidad de personas y/o reparto, tendrán derecho, sin que éstos impliquen un indicio de relación laboral, subordinación o dependencia, a:","1. Rechazar cualquiera de los pedidos y/o solicitudes que reciba por la aplicación, sin obligación de brindar justificativo alguno.","2. Recibir una explicación de los motivos por los cuales la plataforma suspenda o imposibilite, parcial o totalmente, el acceso a la infraestructura digital. A su vez, tendrán derecho a interactuar con operadores y/o recepcionistas y podrán ejercer su derecho a réplica.","3. Solicitar la portabilidad de sus datos en un formato estructurado, genérico y de uso común.","4. Acceder a una capacitación en la cual se detalle el uso de la infraestructura digital, la interacción con los diferentes usuarios y a todo aquel conocimiento relevante para la prestación de sus servicios independientes. La misma será de acceso libre para los prestadores independientes, debiendo las plataformas asumir los costos asociados. 5. Acceder a una capacitación en aspectos de seguridad vial, con el objetivo de conocer las normativas de tránsito, las mejores prácticas de convivencia vial, y el correcto uso de los elementos de seguridad vial necesarios para su prestación de servicios. La misma será de acceso libre para los prestadores independientes, debiendo las plataformas asumir los costos asociados.","6. Acceder a un seguro de accidentes personales proporcionado por las plataformas, el cual, en su cobertura mínima, deberá contemplar los riesgos asociados al fallecimiento accidental, la incapacidad total y/o parcial permanente derivada de la prestación del servicio, los gastos médicos y farmacéuticos, así como los costos funerarios.","La responsabilidad de la provisión de este seguro y los gastos asociados al mismo serán objeto de libre acuerdo entre las partes involucradas, sin establecer una responsabilidad exclusiva para ninguna de ellas, ni un indicio de relación laboral o dependencia entre las plataformas y repartidores. La ampliación de las prestaciones o la implementación de seguros adicionales no implicarán incumplimiento de lo dispuesto en esta normativa, ni serán considerados como indicio de laboralidad.","7. Recibir una retribución dineraria por la prestación de sus servicios de parte del usuario consumidor, a través de la plataforma por la que ofrece o presta los servicios de movilidad de personas y/o reparto; asimismo también tiene derecho a percibir el cien por ciento (100%) del monto que los usuarios agreguen en concepto de gratificación, recompensa o propina. Dicho monto puede ser sugerido por la plataforma, a efectos ilustrativos y preservando la posibilidad de modificarlo por parte del usuario.","8. Conectarse sin tener la exigibilidad de una periodicidad o frecuencia mínima.","9. Registrarse en la aplicación sin que ello implique asumir la obligación de conectarse y/o aceptar pedidos.","10. Interrumpir la utilización de la aplicación, sin tener que dar previo aviso a la plataforma, sin perjuicio de la responsabilidad civil que pueda tener frente al usuario.","11. Prestar servicios durante el tiempo que el prestador independiente estime conveniente. 12. Conectarse a la aplicación y prestar los servicios dentro del ámbito de cobertura establecido por la plataforma tecnológica.","13. Decidir el mejor trayecto o recorrido, pudiendo valerse de la sugerencia de ruta que muestra la aplicación o utilizar otras aplicaciones de navegación de Sistemas de Posicionamiento Global (GPS), siempre que ello no perjudique al usuario."]},{"n":127,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Autoridad de Aplicación","s":"El Poder Ejecutivo nacional, vía reglamentación, determinará la autoridad de aplicación del presente régimen.","p":["Autoridad de Aplicación. El Poder Ejecutivo nacional, vía reglamentación, determinará la autoridad de aplicación del presente régimen."]},{"n":128,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Aplicación supletoria","s":"Para los casos no previstos en este régimen y su reglamentación, en lo que respecta a la vinculación entre la plataforma digital y el prestador independiente de plataformas digitales, serán de aplicación supletoria…","p":["Aplicación supletoria. Para los casos no previstos en este régimen y su reglamentación, en lo que respecta a la vinculación entre la plataforma digital y el prestador independiente de plataformas digitales, serán de aplicación supletoria las disposiciones del Código Civil y Comercial de la Nación."]},{"n":129,"nt":[]
