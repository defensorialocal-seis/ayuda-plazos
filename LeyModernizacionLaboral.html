iciones transitorias","par":55,"arts":[137],"nt":[]},{"lv":1,"k":"Título","num":"XV","name":"Modificaciones a la ley N° 23.551 y sus modificaciones – Asociaciones Sindicales","par":-1,"arts":[],"nt":[]},{"lv":2,"k":"Capítulo","num":"I","name":"De las asambleas y congresos","par":60,"arts":[138,139],"nt":[]},{"lv":2,"k":"Capítulo","num":"II","name":"De los derechos y obligaciones de las asociaciones sindicales","par":60,"arts":[140],"nt":[]},{"lv":2,"k":"Capítulo","num":"III","name":"De las asociaciones sindicales con personería gremial","par":60,"arts":[141],"nt":[]},{"lv":2,"k":"Capítulo","num":"IV","name":"De la representación sindical en la empresa","par":60,"arts":[142],"nt":[]},{"lv":2,"k":"Capítulo","num":"V","name":"De la tutela sindical","par":60,"arts":[143,144],"nt":[]},{"lv":2,"k":"Capítulo","num":"VI","name":"De las prácticas desleales","par":60,"arts":[145,146,147],"nt":[]},{"lv":2,"k":"Capítulo","num":"VII","name":"De la Autoridad de Aplicación","par":60,"arts":[148],"nt":[]},{"lv":1,"k":"Título","num":"XVI","name":"Modificaciones a la Ley N° 23.546 (t.o. 2004) sobre Procedimiento para la Negociación Colectiva","par":-1,"arts":[149,150,151],"nt":[]},{"lv":1,"k":"Título","num":"XVII","name":"Programa de Formación Laboral Básica","par":-1,"arts":[152,153],"nt":[]},{"lv":1,"k":"Título","num":"XVIII","name":"Modificaciones a la Ley Complementaria de la Ley sobre Riesgos del Trabajo Nº 27.348","par":-1,"arts":[154],"nt":[]},{"lv":1,"k":"Título","num":"XIX","name":"Registración laboral ante ARCA","par":-1,"arts":[155],"nt":[]},{"lv":1,"k":"Título","num":"XX","name":"Régimen de Incentivo a la Formalización Laboral (RIFL)","par":-1,"arts":[156,157,158,159,160,161,162,163,164],"nt":[]},{"lv":1,"k":"Título","num":"XXI","name":"Beneficios al empleo ya registrado","par":-1,"arts":[165,166,167],"nt":[]},{"lv":1,"k":"Título","num":"XXII","name":"Promoción del Empleo Registrado (PER)","par":-1,"arts":[168,169,170,171,172,173,174,175,176],"nt":[]},{"lv":1,"k":"Título","num":"XXIII","name":"Régimen de Incentivo para Medianas Inversiones (RIMI)","par":-1,"arts":[177,178,179,180,181,182,183,184,185,186,187,188],"nt":[]},{"lv":1,"k":"Título","num":"XXIV","name":"Modificaciones a leyes impositivas","par":-1,"arts":[],"nt":[]},{"lv":2,"k":"Capítulo","num":"I","name":"Impuesto al Valor Agregado","par":76,"arts":[189],"nt":[]},{"lv":2,"k":"Capítulo","num":"II","name":"Impuesto a las Ganancias","par":76,"arts":[190,191,192,193,194],"nt":[]},{"lv":1,"k":"Título","num":"XXV","name":"Reducción de la carga tributaria","par":-1,"arts":[],"nt":[]},{"lv":2,"k":"Capítulo","num":"I","name":"Impuestos selectivos al consumo","par":79,"arts":[195],"nt":[]},{"lv":2,"k":"Capítulo","num":"II","name":"Otros impuestos","par":79,"arts":[196],"nt":[]},{"lv":1,"k":"Título","num":"XXVI","name":"Derogaciones","par":-1,"arts":[197,198,199,200,201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218],"nt":[]}],"arts":[{"n":1,"nt":[],"h":"Sustitúyese el artículo 2° de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 2","t":"Ámbito de aplicación","s":"La vigencia de esta ley quedará condicionada a que la aplicación de sus disposiciones resulte compatible con la naturaleza y modalidades de la actividad de que se trate y con el específico régimen jurídico a que se…","p":["Artículo 2°: Ámbito de aplicación. La vigencia de esta ley quedará condicionada a que la aplicación de sus disposiciones resulte compatible con la naturaleza y modalidades de la actividad de que se trate y con el específico régimen jurídico a que se halle sujeta. Las disposiciones de esta ley no serán aplicables:","a. A los dependientes de la Administración Pública Nacional, provincial, de la Ciudad Autónoma de Buenos Aires o municipal, excepto que por acto expreso se los incluya en la misma o en el régimen de las convenciones colectivas de trabajo;","b. Al personal de casas particulares, con la sola excepción de aquellas normas que el régimen de la Ley del Régimen Especial de Contrato de Trabajo para el Personal de Casas Particulares N° 26.844 y sus modificaciones expresamente declare aplicables; c. A los trabajadores agrarios, sin perjuicio de que las disposiciones de la presente ley serán de aplicación supletoria en todo lo que resulte compatible y no se oponga a la naturaleza y modalidades propias del Régimen Nacional de Trabajo Agrario;","d. A las contrataciones de obra, servicios, agencia, transporte, flete y todas las reguladas en el Código Civil y Comercial de la Nación;","e. A los trabajadores independientes y sus colaboradores en los términos del artículo 97 de la Ley de Bases y Puntos de Partida para la Libertad de los Argentinos Nº 27.742;","f. A los prestadores independientes de plataformas tecnológicas conforme la regulación específica;","g. Al personal embarcado comprendido en el régimen de la Ley de Navegación Nº 20.094 y sus modificatorias, sin perjuicio de las normas de las Convenciones Colectivas de Trabajo que resulten aplicables;","h. A las personas privadas de libertad en contexto de encierro."]},{"n":2,"nt":[],"h":"Sustitúyese el artículo 4° de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 4","t":"Concepto de trabajo","s":"Constituye trabajo, a los fines de esta ley, toda actividad lícita que se preste en favor de quien tiene la facultad de dirigirla, mediante una remuneración.","p":["Artículo 4°: Concepto de trabajo. Constituye trabajo, a los fines de esta ley, toda actividad lícita que se preste en favor de quien tiene la facultad de dirigirla, mediante una remuneración.","El contrato de trabajo tiene como principal objeto la actividad productiva y creadora del ser humano en sí, en el marco de una relación de intercambio y un fin económico disciplinado por esta ley."]},{"n":3,"nt":[],"h":"Sustitúyese el artículo 9° de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 9","t":"El principio de la norma más favorable para el trabajador","s":"En caso de duda sobre la aplicación de normas legales o convencionales prevalecerá la más favorable al trabajador, considerándose el criterio de agrupamiento por instituciones, es decir, el conjunto de normas que…","p":["Artículo 9°: El principio de la norma más favorable para el trabajador. En caso de duda sobre la aplicación de normas legales o convencionales prevalecerá la más favorable al trabajador, considerándose el criterio de agrupamiento por instituciones, es decir, el conjunto de normas que rija cada una de las instituciones en el derecho del trabajo."]},{"n":4,"nt":[],"h":"Sustitúyese el artículo 11 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 11","t":"Principios de interpretación y aplicación de la ley","s":"Cuando una cuestión no pueda resolverse por aplicación de las normas que rigen el contrato de trabajo o por las leyes análogas, se decidirá conforme a los principios generales del derecho del trabajo, la equidad y…","p":["Artículo 11: Principios de interpretación y aplicación de la ley. Cuando una cuestión no pueda resolverse por aplicación de las normas que rigen el contrato de trabajo o por las leyes análogas, se decidirá conforme a los principios generales del derecho del trabajo, la equidad y la buena fe."]},{"n":5,"nt":[],"h":"Incorpórase como artículo 11 bis a la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, el siguiente texto:","ac":"Incorpora","tg":"LCT","rf":"art. 11","t":"Formación profesional","s":"La promoción profesional y la formación en el trabajo, en condiciones igualitarias de acceso y trato, será un derecho fundamental para todos los trabajadores.","p":["Artículo 11 bis: Formación profesional. La promoción profesional y la formación en el trabajo, en condiciones igualitarias de acceso y trato, será un derecho fundamental para todos los trabajadores."]},{"n":6,"nt":[],"h":"Sustitúyese el artículo 12 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 12","t":"Protección de los trabajadores","s":"Irrenunciabilidad.","p":["Artículo 12: Protección de los trabajadores. Irrenunciabilidad. Será nula y sin valor toda convención de partes que suprima o reduzca los derechos previstos en esta ley, los estatutos profesionales y las convenciones colectivas de trabajo, ya sea al tiempo de su celebración o de su ejecución, o del ejercicio de derechos provenientes de su extinción."]},{"n":7,"nt":[],"h":"Sustitúyese el artículo 15 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 15","t":"Acuerdos transaccionales conciliatorios o liberatorios","s":"Su validez.","p":["Artículo 15: Acuerdos transaccionales conciliatorios o liberatorios. Su validez. Los acuerdos transaccionales, conciliatorios o liberatorios sólo serán válidos cuando se realicen con intervención de la autoridad judicial o administrativa, y mediare resolución fundada de cualquiera de ésta que declare que mediante tales actos se ha alcanzado una justa composición de los derechos e intereses de las partes.","En todos los casos, la homologación administrativa o judicial de los acuerdos conciliatorios, transaccionales o liberatorios le otorga autoridad de cosa juzgada."]},{"n":8,"nt":[],"h":"Sustitúyese el artículo 16 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 16","t":"Aplicación analógica de las convenciones colectivas de trabajo","s":"Su exclusión.","p":["Artículo 16: Aplicación analógica de las convenciones colectivas de trabajo. Su exclusión. Las convenciones colectivas de trabajo no son susceptibles de aplicación extensiva o analógica."]},{"n":9,"nt":[],"h":"Sustitúyese el artículo 18 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 18","t":"Antigüedad del trabajador","s":"Cuando se reconozcan derechos al trabajador en función de su antigüedad, se considerará como tiempo de servicio aquel efectivamente trabajado desde el inicio de la relación laboral, incluyendo el correspondiente a…","p":["Artículo 18: Antigüedad del trabajador. Cuando se reconozcan derechos al trabajador en función de su antigüedad, se considerará como tiempo de servicio aquel efectivamente trabajado desde el inicio de la relación laboral, incluyendo el correspondiente a los sucesivos contratos a plazo que las partes hubieran celebrado. Asimismo, se computará como antigüedad el tiempo de servicio anterior, en los casos en que el trabajador hubiese cesado por cualquier causa y reingrese bajo las órdenes del mismo empleador. Si transcurriese un plazo de dos (2) años entre el cese del vínculo laboral, cualquiera fuera la causa, y el trabajador reingresara a prestar servicios con el mismo empleador, la antigüedad del tiempo de servicio anterior no será computada."]},{"n":10,"nt":[],"h":"Sustitúyese el artículo 20 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 20","t":"Gratuidad","s":"El trabajador o sus derecho-habientes gozarán del beneficio de la gratuidad en los procedimientos judiciales o administrativos derivados de la aplicación de esta ley, estatutos profesionales o convenciones…","p":["Artículo 20: Gratuidad. El trabajador o sus derecho-habientes gozarán del beneficio de la gratuidad en los procedimientos judiciales o administrativos derivados de la aplicación de esta ley, estatutos profesionales o convenciones colectivas de trabajo. Su vivienda no podrá ser afectada al pago de costas en caso alguno.","En cuanto si de los antecedentes del proceso resultase pluspetición inexcusable, configurándose ésta de manera objetiva en caso de sobreestimación de los créditos reclamados, las costas deberán ser soportadas solidariamente entre la parte y el profesional actuante."]},{"n":11,"nt":[],"h":"","ac":"Sustituye","tg":"LCT","rf":"art. 21","t":"Sustituye art. 21 · LCT","s":"Sustitúyese el artículo 21 de la Ley de Contrato de Trabajo N° 20.744 (t.o.","p":["Sustitúyese el artículo 21 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente: Artículo 21: Contrato de trabajo. Habrá contrato de trabajo, cualquiera sea su forma o denominación, siempre que una persona humana se obligue a prestar servicios en favor de otra persona y bajo la dependencia de ésta, durante un período determinado o indeterminado de tiempo, mediante el pago de una remuneración. Sus cláusulas, en cuanto a la forma y condiciones de la prestación, quedan sometidas a las disposiciones de orden público, los estatutos, las convenciones colectivas o los laudos con fuerza de tales."]},{"n":12,"nt":[],"h":"Sustitúyese el artículo 22 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 22","t":"Relación de trabajo","s":"Habrá relación de trabajo cuando una persona humana preste servicios en favor de otra persona, bajo la dependencia de ésta en forma voluntaria y mediante el pago de una remuneración.","p":["Artículo 22: Relación de trabajo. Habrá relación de trabajo cuando una persona humana preste servicios en favor de otra persona, bajo la dependencia de ésta en forma voluntaria y mediante el pago de una remuneración."]},{"n":13,"nt":[],"h":"Sustitúyese el artículo 23 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 23","t":"Presunción de la existencia del contrato de trabajo","s":"El hecho de la prestación de servicios en situación de dependencia hace presumir la existencia de un contrato de trabajo, salvo que, por las circunstancias, las relaciones o causas que lo motiven, se demostrase lo…","p":["Artículo 23: Presunción de la existencia del contrato de trabajo. El hecho de la prestación de servicios en situación de dependencia hace presumir la existencia de un contrato de trabajo, salvo que, por las circunstancias, las relaciones o causas que lo motiven, se demostrase lo contrario.","La presunción contenida en el presente artículo no será de aplicación cuando mediaren contrataciones de obras o de servicios profesionales o de oficios, o cualquier otra modalidad que comprendan prestaciones de servicios sin relación de dependencia, y se emitan los recibos o facturas correspondientes a dichas formas de contratación o el pago se realice conforme los sistemas bancarios y/u otros sistemas que determine la Reglamentación correspondiente.","Dicha ausencia de presunción se extenderá a todos los efectos, inclusive a la seguridad social."]},{"n":14,"nt":[],"h":"Sustitúyese el artículo 26 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 26","t":"Empleador","s":"Se considera empleador a la persona humana o jurídica, o conjunto de ellas aún sin personalidad jurídica propia, que, a los fines de desempeñarse bajo su dependencia, requiera los servicios de un trabajador.","p":["Artículo 26: Empleador. Se considera empleador a la persona humana o jurídica, o conjunto de ellas aún sin personalidad jurídica propia, que, a los fines de desempeñarse bajo su dependencia, requiera los servicios de un trabajador."]},{"n":15,"nt":[],"h":"Sustitúyese el artículo 27 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 27","t":"Socio-empleado","s":"Las personas que, integrando una sociedad, prestan a ésta toda su actividad en forma personal y habitual, con sujeción a las instrucciones o directivas que concretamente se le impartan, serán consideradas como…","p":["Artículo 27: Socio-empleado. Las personas que, integrando una sociedad, prestan a ésta toda su actividad en forma personal y habitual, con sujeción a las instrucciones o directivas que concretamente se le impartan, serán consideradas como trabajadores dependientes de la sociedad a los efectos de la aplicación de esta ley y de los regímenes legales o convencionales que regulan y protegen la prestación de trabajo en relación de dependencia.","Exceptúanse las sociedades de familia entre integrantes del grupo familiar primario."]},{"n":16,"nt":[],"h":"Sustitúyese el artículo 29 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 29","t":"Mediación","s":"Intermediación.","p":["Artículo 29: Mediación. Intermediación. Los trabajadores serán considerados empleados directos de aquellos que registren la relación laboral, sin perjuicio de haber sido contratados con vistas a utilizar su prestación o de proporcionarlos a terceras empresas. La empresa usuaria únicamente será responsable solidaria por las obligaciones laborales y de la seguridad social respecto de los trabajadores proporcionados, exclusivamente de aquellas devengadas durante el tiempo de efectiva prestación para esta última. En ese caso, la empresa usuaria podrá repetir contra la obligada principal."]},{"n":17,"nt":[],"h":"Sustitúyese el artículo 29 bis de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 29","t":"Sustituye art. 29 · LCT","s":"El empleador que ocupe trabajadores a través de una empresa de servicios eventuales habilitada por la autoridad competente, será solidariamente responsable con aquélla por el cumplimiento de todas las obligaciones…","p":["Artículo 29 bis: El empleador que ocupe trabajadores a través de una empresa de servicios eventuales habilitada por la autoridad competente, será solidariamente responsable con aquélla por el cumplimiento de todas las obligaciones laborales y la observancia de la instrumentación referida a la retención de aportes a la Seguridad Social que establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía.","El trabajador contratado a través de una empresa de servicios eventuales estará regido por la Convención Colectiva de la actividad o categoría en la que efectivamente preste servicios en la empresa usuaria. Atento a las características temporarias propias de la eventualidad, el trabajador eventual no podrá ser candidato y/o designado en cargo gremial alguno vinculado a la empresa usuaria que implique la aplicación de la tutela prevista en la ley 23.551 y sus modificaciones o la que en el futuro la reemplace."]},{"n":18,"nt":[],"h":"Sustitúyese el artículo 30 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 30","t":"Subcontratación y delegación","s":"Quienes cedan total o parcialmente a otros el establecimiento o explotación habilitado a su nombre, o contraten o subcontraten, cualquiera sea el acto que le dé origen, trabajos o servicios correspondientes a la…","p":["Artículo 30: Subcontratación y delegación. Quienes cedan total o parcialmente a otros el establecimiento o explotación habilitado a su nombre, o contraten o subcontraten, cualquiera sea el acto que le dé origen, trabajos o servicios correspondientes a la actividad normal y específica propia del establecimiento, dentro de su ámbito, excluyendo las actividades accesorias o coadyuvantes, deberán exigir a sus cesionarios, contratistas o subcontratistas el número del Código Único de Identificación Laboral (CUIL) de cada uno de los trabajadores que presten servicios, la constancia de pago mensuales a los Subsistemas de la Seguridad Social, constancia de pago de las remuneraciones, la información de una (1) cuenta a nombre del trabajador donde recibe su remuneración y una cobertura por riesgos del trabajo con cláusula de endoso a favor del comitente o principal. El cumplimiento del control de los requisitos referidos en este párrafo exime de toda responsabilidad al principal. Tampoco será responsable el principal ante la falsedad de información brindada por parte de los cesionarios, contratistas o subcontratistas. En caso de omitir la solicitud de los datos indicados, el principal responderá solidariamente."]},{"n":19,"nt":[],"h":"Sustitúyese el artículo 31 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 31","t":"Empresas subordinadas o relacionadas","s":"Solidaridad.","p":["Artículo 31: Empresas subordinadas o relacionadas. Solidaridad. Siempre que una (1) o más empresas, aunque tuviesen cada una de ellas personalidad jurídica propia, estuviesen bajo la dirección, control o administración de otras, o de tal modo relacionadas que constituyan un conjunto económico de carácter permanente, serán a los fines de las obligaciones contraídas por cada una de ellas con sus trabajadores y con los organismos de seguridad social, solidariamente responsables, únicamente cuando hayan mediado maniobras fraudulentas."]},{"n":20,"nt":[],"h":"Sustitúyese el artículo 52 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 52","t":"Registro del trabajador","s":"Los empleadores deberán registrar a los trabajadores ante la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, de acuerdo a la normativa…","p":["Artículo 52: Registro del trabajador. Los empleadores deberán registrar a los trabajadores ante la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, de acuerdo a la normativa que dicho organismo dicte.","Esta registración será suficiente a todos los efectos, sin que puedan exigirse requisitos adicionales por parte de ninguna otra autoridad.","El empleador deberá conservar los libros preexistentes durante un plazo de diez (10) años. A tal efecto, dichos libros podrán ser digitalizados y las copias digitales tendrán la misma validez legal que los originales en formato papel."]},{"n":21,"nt":[],"h":"Sustitúyese el artículo 53 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 53","t":"Omisión de formalidades","s":"Los jueces merituarán la omisión de formalidades en la registración en los términos del artículo 52 de la presente ley, en función de las particulares circunstancias de cada caso.","p":["Artículo 53: Omisión de formalidades. Los jueces merituarán la omisión de formalidades en la registración en los términos del artículo 52 de la presente ley, en función de las particulares circunstancias de cada caso."]},{"n":22,"nt":[],"h":"Sustitúyese el artículo 55 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 55","t":"Omisión de registración","s":"La falta de registración en los términos del artículo 52 de la presente ley, constituirá una presunción a favor de las manifestaciones del trabajador o de sus causahabientes respecto de las circunstancias que…","p":["Artículo 55: Omisión de registración. La falta de registración en los términos del artículo 52 de la presente ley, constituirá una presunción a favor de las manifestaciones del trabajador o de sus causahabientes respecto de las circunstancias que debieron constar en el pertinente registro."]},{"n":23,"nt":[],"h":"Sustitúyese el artículo 66 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 66","t":"Facultad de modificar las formas y modalidades de trabajo","s":"El empleador está facultado para introducir todos aquellos cambios relativos a la forma y modalidades de la prestación del trabajo, en tanto esos cambios no alteren modalidades esenciales del contrato, ni causen…","p":["Artículo 66: Facultad de modificar las formas y modalidades de trabajo. El empleador está facultado para introducir todos aquellos cambios relativos a la forma y modalidades de la prestación del trabajo, en tanto esos cambios no alteren modalidades esenciales del contrato, ni causen perjuicio material al trabajador.","Cuando el empleador disponga medidas vedadas por este artículo, al trabajador, previa intimación y si ésta fuere desoída, le asistirá la posibilidad de considerarse despedido sin causa."]},{"n":24,"nt":[],"h":"Sustitúyese el artículo 68 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 68","t":"Modalidades de su ejercicio","s":"El empleador, en todos los casos, deberá ejercitar las facultades que le están conferidas en los artículos anteriores, así como la de disponer suspensiones por razones económicas, en los límites y con arreglo a las…","p":["Artículo 68: Modalidades de su ejercicio. El empleador, en todos los casos, deberá ejercitar las facultades que le están conferidas en los artículos anteriores, así como la de disponer suspensiones por razones económicas, en los límites y con arreglo a las condiciones fijadas por la ley, los estatutos profesionales y las convenciones colectivas de trabajo."]},{"n":25,"nt":[],"h":"Sustitúyese el artículo 80 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 80","t":"Entrega de certificados","s":"Dentro del plazo de cuarenta y cinco (45) días hábiles desde la extinción del contrato de trabajo, el empleador deberá entregar al trabajador los certificados en los que consten los datos relativos a la relación…","p":["Artículo 80: Entrega de certificados. Dentro del plazo de cuarenta y cinco (45) días hábiles desde la extinción del contrato de trabajo, el empleador deberá entregar al trabajador los certificados en los que consten los datos relativos a la relación laboral, la función desempeñada, las capacitaciones realizadas y la constancia del ingreso de los aportes y contribuciones al Sistema de Seguridad Social.","La obligación se considerará cumplida cuando el empleador ponga a disposición del trabajador dichos certificados: a) en formato físico en la sede de la empresa; o b) en formato digital a través de cualquier sistema que permita acreditar su entrega al trabajador de manera fehaciente. Cuando la información requerida por este artículo se encuentre disponible para el trabajador a través del sitio web del organismo de la seguridad social o del sistema que establezca la Agencia de Recaudación y Control Aduanero (ARCA), también se considerará cumplida la obligación del empleador respecto de los certificados alcanzados por la información que allí conste."]},{"n":26,"nt":[],"h":"","ac":"Deroga","tg":"LCT","rf":"","t":"Deroga · LCT","s":"Derógase el Capítulo VIII del Título II de la Ley de Contrato de Trabajo N° 20.744 (t.o.","p":["Derógase el Capítulo VIII del Título II de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones."]},{"n":27,"nt":[],"h":"Sustitúyese el artículo 92 ter de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 92","t":"Sustituye art. 92 · LCT","s":"Contrato de Trabajo a tiempo parcial.","p":["Artículo 92 ter: Contrato de Trabajo a tiempo parcial.","1. El contrato de trabajo a tiempo parcial es aquel en virtud del cual el trabajador se obliga a prestar servicios durante un determinado número de horas al día o a la semana, inferiores a la jornada legal o convencional de la actividad. En este caso, la remuneración no podrá ser inferior a la proporcional que le corresponda a un trabajador a tiempo completo, establecida por ley o convenio colectivo, de la misma categoría o puesto de trabajo.","2. Los trabajadores contratados a tiempo parcial podrán realizar voluntariamente horas suplementarias respecto de la jornada reducida pactada. No podrán realizar horas extraordinarias en exceso de la jornada legal, salvo el caso del artículo 89 de la presente ley.","3. Las cotizaciones a la seguridad social y las demás que se recaudan con ésta, se efectuarán en proporción a la remuneración del trabajador y serán unificadas en caso de pluriempleo. En este último supuesto, el trabajador deberá elegir entre las obras sociales a las que aporte, aquella a la cual pertenecerá.","4. Las prestaciones de la seguridad social se determinarán reglamentariamente teniendo en cuenta el tiempo trabajado, los aportes y las contribuciones efectuadas. Los aportes y contribuciones para la obra social será la que corresponda a un trabajador de tiempo completo de la categoría en que se desempeña el trabajador.","5. Los Convenios Colectivos de Trabajo podrán determinar el porcentaje máximo de trabajadores a tiempo parcial que en cada establecimiento se desempeñarán bajo esta modalidad contractual. Asimismo, podrán establecer la prioridad de los mismos para ocupar las vacantes a tiempo completo que se produjeren en la empresa."]},{"n":28,"nt":[],"h":"Sustitúyese el artículo 95 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 95","t":"Despido antes del vencimiento del plazo","s":"Indemnización.","p":["Artículo 95: Despido antes del vencimiento del plazo. Indemnización. El despido injustificado dispuesto con antelación al vencimiento del plazo convenido, dará derecho al trabajador a percibir las indemnizaciones que correspondan por la extinción del contrato considerando, a ese solo efecto, la antigüedad que habría acumulado hasta la fecha de finalización del plazo originariamente pactado.","Cuando la extinción del contrato se produjere mediante preaviso, y estando el contrato íntegramente cumplido, el trabajador recibirá una suma de dinero equivalente a la indemnización prevista en el artículo 250 de esta ley."]},{"n":29,"nt":[],"h":"Sustitúyese el artículo 99 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 99","t":"Caracterización","s":"Cualquiera sea su denominación, se considerará que media contrato de trabajo eventual cuando la actividad del trabajador se ejerce bajo la dependencia de un empleador para la satisfacción de resultados concretos,…","p":["Artículo 99: Caracterización. Cualquiera sea su denominación, se considerará que media contrato de trabajo eventual cuando la actividad del trabajador se ejerce bajo la dependencia de un empleador para la satisfacción de resultados concretos, tenidos en vista por éste, con relación a servicios extraordinarios determinados de antemano o exigencias extraordinarias y transitorias de la empresa, explotación o establecimiento. Se entenderá además que media tal tipo de relación cuando el vínculo comienza y termina con la realización de la obra, la ejecución del acto o la prestación del servicio para el que fue contratado el trabajador.","El empleador que pretenda que el contrato inviste esta modalidad, tendrá a su cargo la prueba de su aseveración."]},{"n":30,"nt":[],"h":"","ac":"Sustituye","tg":"LCT","rf":"art. 102","t":"Sustituye art. 102 · LCT","s":"Sustitúyese el artículo 102 de la Ley de Contrato de Trabajo N° 20.744 (t.o.","p":["Sustitúyese el artículo 102 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente: Artículo 102: Trabajo prestado por integrantes de una sociedad. El contrato por el cual una sociedad, asociación, comunidad o grupo de personas, con o sin personalidad jurídica, se obligue a la prestación personal de servicios propios de una relación de trabajo por parte de sus integrantes, a favor de un tercero y bajo su dependencia, en forma permanente y exclusiva, será considerado contrato de trabajo por equipo, y cada uno de sus integrantes, trabajador dependiente del tercero a quien se hubieran prestado efectivamente los mismos."]},{"n":31,"nt":[],"h":"Sustitúyese el artículo 103 bis de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 103","t":"Beneficios sociales","s":"Se denominan beneficios sociales a las prestaciones de naturaleza jurídica de seguridad social, no remunerativas, no dinerarias, no acumulables ni sustituibles en dinero, que el empleador voluntariamente otorga al…","p":["Artículo 103 bis: Beneficios sociales. Se denominan beneficios sociales a las prestaciones de naturaleza jurídica de seguridad social, no remunerativas, no dinerarias, no acumulables ni sustituibles en dinero, que el empleador voluntariamente otorga al trabajador, directamente o por intermedio de terceros, con el objeto de mejorar la calidad de vida del trabajador y/o de su grupo familiar a cargo; por ende, estos beneficios no son salarios en especie.","En ningún caso corresponderá el pago de aportes ni contribuciones a la seguridad social, ni la aplicación de contribuciones patronales o aportes del trabajador sobre los conceptos comprendidos en la presente disposición.","Se consideran beneficios sociales las siguientes prestaciones:","a) Los servicios de comedor y alimentación del trabajador, dentro del establecimiento del empleador o en establecimientos gastronómicos cercanos durante la jornada laboral contratados por el empleador, en ese último caso, conforme a los límites que determine la Autoridad de Aplicación;","b) Los reintegros de gastos médicos, odontológicos y farmacéuticos del trabajador y su grupo familiar, asumidos por el empleador, previa presentación de comprobantes emitidos por profesionales o establecimientos habilitados. También se incluyen los planes médicos integrales otorgados en especie o las diferencias de pago de las cuotas de dichos planes;","c) La provisión de ropa de trabajo y de todo otro elemento de indumentaria o equipamiento necesario para el desempeño de las tareas del trabajador;","d) Los reintegros documentados de gastos de guardería y/o sala maternal, utilizados por los trabajadores con hijos de hasta seis (6) años de edad, cuando la empresa no cuente con esas instalaciones;","e) La provisión de útiles escolares y guardapolvos para los hijos del trabajador, otorgados en especie al inicio del período lectivo;","f) El otorgamiento o pago documentado, contra recibo, de programas, cursos o seminarios de capacitación o especialización;","g) El pago de gastos de sepelio de familiares a cargo del trabajador, debidamente documentado mediante comprobante."]},{"n":32,"nt":[],"h":"Sustitúyese el artículo 104 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 104","t":"Formas de determinar la remuneración","s":"El salario puede fijarse por tiempo o por rendimiento del trabajo, y en este último caso por unidad de obra, comisión individual o colectiva.","p":["Artículo 104: Formas de determinar la remuneración. El salario puede fijarse por tiempo o por rendimiento del trabajo, y en este último caso por unidad de obra, comisión individual o colectiva. En ningún caso las propinas podrán ser consideradas como remuneración aun cuando por los usos y costumbres de determinadas actividades sean habituales."]},{"n":33,"nt":[],"h":"Incorpórase como artículo 104 bis a la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, el siguiente texto:","ac":"Incorpora","tg":"LCT","rf":"art. 104","t":"Otros componentes remunerativos","s":"Mediante la negociación colectiva de actividad, rama, región, acuerdo de empresa y/o mediante acuerdo individual o decisión unilateral del empleador, podrán incorporarse, por encima de los salarios y/o conceptos de…","p":["Artículo 104 bis: Otros componentes remunerativos. Mediante la negociación colectiva de actividad, rama, región, acuerdo de empresa y/o mediante acuerdo individual o decisión unilateral del empleador, podrán incorporarse, por encima de los salarios y/o conceptos de pago de carácter obligatorio otros componentes retributivos dinámicos adicionales, transitorios, fijos o variables, considerando para ello tanto el mérito personal del trabajador como aspectos propios de la organización. La incorporación, modificación y conservación de dichos componentes transitorios y variables podrá ser realizada por las partes, o decisión individual del empleador, con la frecuencia que ellas determinen, sin que puedan resultar de aplicación a su respecto la continuidad tácita, la ultraactividad, ni la costumbre, cualquiera fuere el tiempo transcurrido en su mantenimiento y aplicación."]},{"n":34,"nt":[],"h":"Sustitúyese el artículo 105 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 105","t":"Formas de pago","s":"Prestaciones complementarias.","p":["Artículo 105: Formas de pago. Prestaciones complementarias. El salario debe ser satisfecho en dinero, ya sea en moneda nacional o extranjera.","Las prestaciones complementarias que no resulten beneficios sociales en los términos del artículo 103 bis de esta ley, sean en dinero o en especie, integran la remuneración del trabajador, con excepción de:","a) Los retiros de socios, gerentes de sociedades de responsabilidad limitada, directores de sociedades por acciones a cuenta de las utilidades del ejercicio debidamente contabilizada en el balance;","b) Los sistemas de distribución de utilidades o ganancias, de derechos accionarios, de cobro de dividendos y de realización de las acciones o títulos otorgados por el empleador durante la vigencia del contrato de trabajo, según las partes lo hubiesen pactado o el empleador voluntariamente lo decida, en la oportunidad y con las modalidades que este último defina con arreglo a las normas del derecho comercial aplicables en cada caso y con los límites que la Autoridad de Aplicación establezca;","c) Los reintegros de gastos acreditados con comprobantes correspondientes al uso del automóvil de propiedad de la empresa o del empleado, calculado en base a kilómetro recorrido, conforme los usos y costumbres y/o los parámetros fijados o que se fijen como deducibles en el futuro por la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía;","d) Los viáticos acreditados con comprobantes en los términos del artículo 6° de la ley 24.241;","e) El reintegro con comprobantes de las sumas que resulten por el uso por parte del trabajador del transporte público de pasajeros correspondientes por el traslado desde y hacia el lugar de trabajo, por día efectivamente trabajado;","f) El comodato de casa habitación de propiedad del empleador, ubicado en barrios o complejos circundantes al lugar de trabajo, o la locación y/o la provisión de vivienda, por cualquier título, cuando el trabajador no haya tenido antes de la celebración del contrato arraigo en el lugar;","g) Los gastos derivados del uso de telefonía celular e internet con fines laborales, totales o parciales, conforme a los límites que establezca la Autoridad de Aplicación."]},{"n":35,"nt":[],"h":"Sustitúyese el artículo 124 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 124","t":"Sustituye art. 124 · LCT","s":"Las remuneraciones en dinero debidas al trabajador deberán pagarse, bajo pena de nulidad, únicamente mediante la acreditación en cuenta abierta a su nombre en entidad bancaria o en institución de ahorro oficial.","p":["Artículo 124: Las remuneraciones en dinero debidas al trabajador deberán pagarse, bajo pena de nulidad, únicamente mediante la acreditación en cuenta abierta a su nombre en entidad bancaria o en institución de ahorro oficial.","Dicha cuenta especial tendrá el nombre de cuenta sueldo y bajo ningún concepto podrá tener límite de extracciones, ni costo alguno para el trabajador, en cuanto a su constitución, mantenimiento o extracción de fondos en todo el sistema bancario, cualquiera fuera la modalidad extractiva empleada."]},{"n":36,"nt":[],"h":"Sustitúyese el inciso f) del artículo 132 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 132","t":"Sustituye art. 132 · LCT","s":"f) Depósitos en cajas de ahorro de instituciones del Estado Nacional, de las provincias, de los municipios, de la Ciudad Autónoma de Buenos Aires, sindicales o de propiedad de asociaciones profesionales de…","p":["f) Depósitos en cajas de ahorro de instituciones del Estado Nacional, de las provincias, de los municipios, de la Ciudad Autónoma de Buenos Aires, sindicales o de propiedad de asociaciones profesionales de trabajadores, y pago de cuotas por préstamos acordados por el trabajador y esas instituciones o entidades bancarias."]},{"n":37,"nt":[],"h":"Sustitúyese el artículo 133 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 133","t":"Porcentaje máximo de retención","s":"Conformidad del trabajador.","p":["Artículo 133: Porcentaje máximo de retención. Conformidad del trabajador. Autorización administrativa. Salvo lo dispuesto en el artículo 130 de esta ley, en el caso de adelanto de remuneraciones, la deducción, retención o compensación no podrá insumir en conjunto más del veinte por ciento (20%) del monto total de la remuneración en dinero que tenga que percibir el trabajador en el momento en que se practique. Las mismas podrán consistir, siempre dentro de dicha proporción, en sumas fijas y previamente determinadas. En ningún caso podrán efectuarse las deducciones, retenciones o compensaciones a las que se hace referencia en el artículo 132 de esta ley sin el consentimiento expreso del trabajador, salvo aquéllas que provengan del cumplimiento de las leyes, estatutos profesionales o de Convenios Colectivos de Trabajo, teniendo en cuenta el tope del dos por ciento (2%) establecido en el artículo 133 de la Ley de Modernización Laboral, siempre que sean con destino al o los sindicatos signatarios de éstos. Las deducciones, retenciones o compensaciones, en todos los restantes casos, requerirán además la previa autorización del organismo competente, exigencias ambas que deberán reunirse en cada caso particular, aunque la autorización puede ser conferida, con carácter general, a un empleador o grupo de empleadores, a efectos de su utilización respecto de la totalidad de su personal y mientras no le fuese revocada por la misma autoridad que la concediera.","La Autoridad de Aplicación podrá establecer, por resolución fundada, un límite porcentual distinto para las deducciones, retenciones o compensaciones cuando la situación particular lo requiera."]},{"n":38,"nt":[],"h":"Sustitúyese el artículo 139 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 139","t":"Modalidad","s":"El recibo será confeccionado por el empleador quien deberá hacer entrega al trabajador de una copia fiel del original si fuese papel o bien mediante el sistema que permita su firma de manera digital o electrónica…","p":["Artículo 139: Modalidad. El recibo será confeccionado por el empleador quien deberá hacer entrega al trabajador de una copia fiel del original si fuese papel o bien mediante el sistema que permita su firma de manera digital o electrónica como constancia de entrega."]},{"n":39,"nt":[],"h":"Sustitúyese el artículo 140 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 140","t":"Contenido necesario","s":"El recibo de pago deberá necesariamente contener, como mínimo, las siguientes enunciaciones:","p":["Artículo 140: Contenido necesario. El recibo de pago deberá necesariamente contener, como mínimo, las siguientes enunciaciones:","a. Nombre íntegro o razón social del empleador, su domicilio y su Clave Única de Identificación Tributaria (CUIT);","b. Nombre y apellido del trabajador, su calificación profesional y su Código Único de Identificación Laboral (CUIL);","c. Total de remuneración que perciba, con indicación substancial de su determinación. Si se tratase de porcentajes o comisiones de ventas, se indicarán los importes totales de éstas últimas, y el porcentaje o comisión asignada al trabajador;","d. Los requisitos del artículo 12 del Decreto Ley 17.250/67;","e. Total bruto de la remuneración básica o fija, porcentual devengado, y tiempo que corresponda. En los trabajos remunerados a jornal o por hora, el número de jornadas u horas trabajadas. Si se tratase de remuneración por pieza o medida, número de estas, importe por unidad adoptado y monto global correspondiente al lapso liquidado;","f. Importe de las deducciones que se efectúan por aportes jubilatorios u otras autorizadas por esta ley; embargos y demás descuentos que legalmente correspondan;","g. Importe neto percibido, expresado en números y letras;","h. En el caso del artículo 129 de esta ley, firma y sello de los funcionarios o agentes dependientes de la autoridad, la que podrá ser electrónica;","i. Fecha de ingreso o antigüedad reconocida, y tarea cumplida o categoría en que efectivamente se desempeñó durante el período de pago;","j. Adicionalmente, se incluirán en el recibo, las contribuciones y/o conceptos abonados por el empleador por disposición legal o convencional, con la concreta determinación del importe, relativas a cada trabajador.","La Autoridad de Aplicación podrá disponer la inclusión de otros conceptos y datos en el recibo de pago a los fines de transparentar la totalidad de los costos asociados a la relación de trabajo y facilitar la información al trabajador."]},{"n":40,"nt":[],"h":"Sustitúyese el artículo 143 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 143","t":"Conservación - Plazo","s":"El empleador deberá conservar los recibos y otras constancias de pago a fin de acreditar sus obligaciones considerando el plazo de prescripción de obligaciones laborales -dos (2) años-, y previsionales - diez (10)…","p":["Artículo 143: Conservación - Plazo. El empleador deberá conservar los recibos y otras constancias de pago a fin de acreditar sus obligaciones considerando el plazo de prescripción de obligaciones laborales -dos (2) años-, y previsionales - diez (10) años-.","A efectos de la conservación de los recibos y otras constancias de pago, los mismos podrán ser digitalizados, los cuales tendrán la misma validez que en formato papel. El pago hecho por un último o ulteriores períodos no hace presumir el pago de los anteriores."]},{"n":41,"nt":[],"h":"Sustitúyese el artículo 154 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 154","t":"Sustituye art. 154 · LCT","s":"El empleador deberá conceder el goce de vacaciones de cada año dentro del período comprendido entre el 1º de octubre y el 30 de abril del año siguiente.","p":["Artículo 154: El empleador deberá conceder el goce de vacaciones de cada año dentro del período comprendido entre el 1º de octubre y el 30 de abril del año siguiente. Las partes podrán de mutuo acuerdo disponer el goce de vacaciones fuera del referido período.","La fecha de inicio de las vacaciones deberá ser notificada por escrito al trabajador con una antelación no menor a treinta (30) días, sin perjuicio de que las Convenciones Colectivas de Trabajo puedan establecer sistemas diferentes, conforme a las particularidades de cada actividad.","La Autoridad de Aplicación podrá autorizar, mediante resolución fundada, la concesión de vacaciones en períodos distintos a los establecidos, cuando así lo justifiquen las características especiales de la actividad.","Asimismo, el empleador y el trabajador podrán convenir el fraccionamiento del período vacacional, siempre que cada uno de los tramos no sea inferior a siete (7) días.","Cuando las vacaciones no se otorguen de manera simultánea a la totalidad de los trabajadores de un establecimiento, lugar de trabajo, sección o sector, y se acuerden en forma individual o por grupos, el empleador deberá organizarlas de tal manera que cada trabajador goce de sus vacaciones, al menos una (1) vez cada tres (3) años, durante la temporada de verano.","En caso de que las vacaciones se vean interrumpidas por enfermedad del trabajador informada en tiempo y que le permita al empleador ejercer su derecho de control, éste deberá reincorporarse a su puesto al finalizar el período originalmente previsto para el goce de las vacaciones o, en caso de continuar imposibilitado de trabajar en los términos y bajo las condiciones previstas en el artículo 208 de esta ley, una vez concluido el respectivo lapso de suspensión. El saldo de días de vacaciones no gozados deberá ser reprogramado conforme a lo establecido en los párrafos precedentes."]},{"n":42,"nt":[],"h":"Sustitúyese el artículo 197 bis de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 197","t":"Sustituye art. 197 · LCT","s":"El empleador y el trabajador podrán acordar voluntariamente un régimen de compensación de horas extraordinarias de trabajo, el cual deberá formalizarse por escrito, consignando la naturaleza voluntaria de la…","p":["Artículo 197 bis: El empleador y el trabajador podrán acordar voluntariamente un régimen de compensación de horas extraordinarias de trabajo, el cual deberá formalizarse por escrito, consignando la naturaleza voluntaria de la prestación de horas extras y sus límites, especificando el modo de funcionamiento del sistema y estableciendo un método fehaciente de control que permita a ambas partes registrar las horas efectivamente trabajadas y las horas disponibles para su goce por parte del trabajador. A tal efecto, se podrá disponer de un régimen de horas extras, banco de horas, francos compensatorios, entre otros institutos relativos a la jornada laboral.","Dicho régimen, que podrá igualmente ser pactado por el empleador con la representación sindical en la empresa, deberá respetar los descansos mínimos legales, asegurando en todo momento la protección, beneficio e interés del trabajador."]},{"n":43,"nt":[],"h":"Sustitúyese el artículo 198 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 198","t":"Jornada reducida","s":"La reducción de la jornada máxima legal solamente procederá cuando lo establezcan las disposiciones vigentes en la materia, o se encuentre estipulado en los contratos individuales, Convenios Colectivos de Trabajo u…","p":["Artículo 198: Jornada reducida. La reducción de la jornada máxima legal solamente procederá cuando lo establezcan las disposiciones vigentes en la materia, o se encuentre estipulado en los contratos individuales, Convenios Colectivos de Trabajo u otros acuerdos colectivos celebrados con la representación sindical en la empresa. Estos últimos podrán establecer métodos de cálculo de la jornada máxima en base a promedio, de acuerdo con las características de la actividad, siempre y cuando se respeten los descansos mínimos entre jornada y jornada de doce (12) horas y de descanso semanal de treinta y cinco (35) horas. Asimismo, se podrá utilizar el banco de horas de modo de compensar la mayor jornada de algún día con la menor de otro, siempre y cuando no se supere el máximo legal de la jornada semanal, o la que estipule el régimen laboral específico aplicable, ya sea, ley especial y/o Convenio Colectivo de Trabajo."]},{"n":44,"nt":[],"h":"Sustitúyese el artículo 209 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 209","t":"Aviso al empleador","s":"El trabajador, en el transcurso de la primera jornada de trabajo respecto de la cual estuviere imposibilitado de concurrir, deberá dar aviso de la enfermedad o accidente y del lugar en que se encuentra, salvo casos…","p":["Artículo 209: Aviso al empleador. El trabajador, en el transcurso de la primera jornada de trabajo respecto de la cual estuviere imposibilitado de concurrir, deberá dar aviso de la enfermedad o accidente y del lugar en que se encuentra, salvo casos de fuerza mayor. Mientras no la haga, perderá el derecho a percibir la remuneración correspondiente salvo que la existencia de la enfermedad o accidente, y su imposibilidad de dar el aviso, teniendo en consideración su carácter y gravedad, resulte luego inequívocamente acreditada."]},{"n":45,"nt":[],"h":"Sustitúyese el artículo 210 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 210","t":"Acreditación","s":"Control.","p":["Artículo 210: Acreditación. Control. Los certificados médicos que el trabajador presente para justificar inasistencias por enfermedad o accidente inculpable, deberán contener el diagnóstico médico, el tratamiento y la cantidad de días de reposo laboral indicados, y ser emitidos en todo el territorio nacional por profesionales médicos habilitados para el ejercicio de la medicina y firmados digitalmente a través de las plataformas electrónicas autorizadas por la ley 27.553 y su reglamentación.","El trabajador está obligado a someterse al control que se efectúe por el facultativo designado por el empleador.","En caso de discrepancia insalvable entre el diagnóstico inicial y el control médico realizado por el empleador, se podrá recurrir a una junta médica en institución oficial en las jurisdicciones en las que la autoridad administrativa hubiere habilitado esta opción, o requerir dictamen en institutos públicos o privados de reconocida trayectoria y solvencia técnica cuyo costo de intervención, en este último caso, deberá ser asumido por el empleador."]},{"n":46,"nt":[],"h":"Sustitúyese el artículo 225 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 225","t":"Transferencia del establecimiento","s":"En caso de transferencia por cualquier título del establecimiento, pasarán al sucesor o adquirente todas las obligaciones emergentes del contrato de trabajo que el transmitente tuviera con el trabajador al tiempo…","p":["Artículo 225: Transferencia del establecimiento. En caso de transferencia por cualquier título del establecimiento, pasarán al sucesor o adquirente todas las obligaciones emergentes del contrato de trabajo que el transmitente tuviera con el trabajador al tiempo de la transferencia, aun aquéllas que se originen con motivo de la misma, en los términos de lo estipulado por el artículo 228 de la presente ley.","El contrato de trabajo, en tales casos, continuará con el sucesor o adquirente, y el trabajador conservará la antigüedad adquirida con el transmitente y los derechos que de ella se deriven."]},{"n":47,"nt":[],"h":"Sustitúyese el artículo 228 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 228","t":"Solidaridad","s":"El transmitente y el adquirente de un establecimiento serán solidariamente responsables por las obligaciones laborales derivadas del contrato de trabajo existentes al momento de la transmisión y que afectaren al…","p":["Artículo 228: Solidaridad. El transmitente y el adquirente de un establecimiento serán solidariamente responsables por las obligaciones laborales derivadas del contrato de trabajo existentes al momento de la transmisión y que afectaren al establecimiento que se transmite, que debió o pudo haber conocido a ese momento. Por cuanto, toda información oculta o viciada que no fuera de conocimiento del adquirente luego de realizar los actos de debida diligencia para ello, lo exime de responsabilidad solidaria alguna.","Lo establecido precedentemente resulta aplicable ya sea que la transmisión se haya efectuado para surtir efectos en forma permanente o en forma transitoria.","A los efectos previstos en esta norma se considerará adquirente a todo aquel que pasare a ser titular del establecimiento aun cuando lo fuese como arrendatario o como usufructuario o como tenedor a título precario o por cualquier otro modo.","Lo establecido en el primer párrafo resulta aplicable con relación a las obligaciones emergentes del contrato de trabajo existente al tiempo de la restitución del establecimiento cuando la transmisión no estuviere destinada a surtir efectos permanentes y fuese de aplicación lo dispuesto en la última parte del artículo 227. De igual manera, será también de aplicación cuando el cambio de empleador fuese motivado por la transferencia de un contrato de locación de obra, de explotación u otro análogo, cualquiera sea la naturaleza y el carácter de los mismos."]},{"n":48,"nt":[],"h":"Sustitúyese el inciso b) del artículo 231 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 231","t":"Sustituye art. 231 · LCT","s":"b) Por el empleador, de un (1) mes cuando el trabajador tuviese una antigüedad en el empleo que no exceda de cinco (5) años y de dos (2) meses cuando fuere superior.","p":["b) Por el empleador, de un (1) mes cuando el trabajador tuviese una antigüedad en el empleo que no exceda de cinco (5) años y de dos (2) meses cuando fuere superior.","Para el supuesto en que el trabajador se encuentre en período de prueba no se requerirá la obligación de preaviso."]},{"n":49,"nt":[],"h":"Sustitúyese el artículo 240 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 240","t":"Forma","s":"La extinción del contrato de trabajo por renuncia del trabajador medie o no preaviso, deberá formalizarse, como requisito para su validez, mediante despacho telegráfico en formato físico o digital cursado por el…","p":["Artículo 240: Forma. La extinción del contrato de trabajo por renuncia del trabajador medie o no preaviso, deberá formalizarse, como requisito para su validez, mediante despacho telegráfico en formato físico o digital cursado por el trabajador a su empleador, o ante la autoridad administrativa del trabajo en la forma que determine la reglamentación.","Los despachos telegráficos serán expedidos en forma gratuita y requiriendo la validación de su identidad."]},{"n":50,"nt":[],"h":"Sustitúyese el artículo 241 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 241","t":"Formas y modalidades","s":"Las partes, por mutuo acuerdo, podrán extinguir el contrato de trabajo.","p":["Artículo 241: Formas y modalidades. Las partes, por mutuo acuerdo, podrán extinguir el contrato de trabajo. El acto deberá formalizarse mediante escritura pública o ante la autoridad judicial o administrativa del trabajo.","Será nulo y sin valor el acto que se celebre sin la presencia personal del trabajador y los requisitos consignados precedentemente.","Se considerará igualmente que la relación laboral ha quedado extinguida por voluntad concurrente de las partes, si ello resultase del comportamiento concluyente y recíproco de las mismas, que traduzca inequívocamente el abandono de la relación. En un contrato de trabajo de prestaciones continuas y permanentes, se considera configurado este supuesto luego de transcurridos dos (2) meses calendarios sin que alguna de las partes manifieste su voluntad de continuidad de éste."]},{"n":51,"nt":[],"h":"Sustitúyese el artículo 245 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 245","t":"Indemnización por antigüedad o despido","s":"En los casos de despido dispuesto por el empleador sin justa causa, habiendo o no mediado preaviso y luego de transcurrido el período de prueba, se deberá abonar al trabajador una indemnización equivalente a un (1)…","p":["Artículo 245: Indemnización por antigüedad o despido. En los casos de despido dispuesto por el empleador sin justa causa, habiendo o no mediado preaviso y luego de transcurrido el período de prueba, se deberá abonar al trabajador una indemnización equivalente a un (1) mes de sueldo por cada año de servicio o fracción mayor de tres (3) meses, tomando como base de cálculo la mejor remuneración mensual, normal y habitual devengada durante el último año o durante el tiempo de prestación de servicios si éste fuera menor.","Se entiende como remuneración, a estos fines, la devengada y pagada en cada mes calendario, por cuanto no tendrán incidencia los conceptos de pago no mensuales como el Sueldo Anual Complementario, vacaciones, premios que no sean de pago mensual. Se define como habitual, a estos fines, aquellos conceptos devengados como mínimo seis (6) meses en el último año calendario.","Se define como normal, en el caso de conceptos variables como ser premios mensuales, horas extra, comisiones, el promedio de los últimos seis (6) meses, o del último año si fuera más favorable al trabajador.","Dicha base salarial no podrá exceder el equivalente a tres (3) veces el importe del salario mensual promedio de las remuneraciones previstas en el Convenio Colectivo de Trabajo aplicable al trabajador al momento del despido, por la jornada legal o convencional, excluida la antigüedad. Los topes de cada Convenio Colectivo de Trabajo serán calculados por las partes signatarias del Convenio Colectivo de Trabajo siendo su homologación y/o registración de suficiente intervención por la Autoridad de Aplicación.","Para aquellos trabajadores excluidos de todo Convenio Colectivo de Trabajo, el tope establecido en el párrafo anterior será el del convenio aplicable al establecimiento donde preste servicios, o al convenio más favorable, en el caso que hubiera más de uno (1).","En ningún supuesto la aplicación del tope previsto en este artículo podrá ser inferior al sesenta y siete por ciento (67%) de la remuneración mensual, normal y habitual calculada conforme a lo establecido en los párrafos precedentes de este artículo.","La indemnización en ningún caso podrá ser inferior a un (1) mes de sueldo calculado sobre la base del sistema establecido en el presente artículo.","Mediante Convenio Colectivo de Trabajo, las partes podrán sustituir el presente régimen indemnizatorio por un fondo o sistema de cese laboral cuyo costo estará a cargo del empleador.","A fin de solventar la indemnización prevista en el presente y/o el pago de la suma que libremente se pacte entre las partes para el supuesto de desvinculación por voluntad concurrente conforme el artículo 241 de la presente ley, los empleadores podrán optar por establecer un fondo o sistema de cese laboral cuyo costo estará siempre a cargo del empleador; en integración o no con los Fondos de Asistencia Laboral.","La indemnización prevista en este artículo constituye la única reparación procedente frente a la extinción sin justa causa del contrato de trabajo. Su percepción importa la extinción definitiva de cualquier reclamo judicial o extrajudicial vinculado al despido, incluidos los de naturaleza civil, contractual o extracontractual, no pudiendo promoverse acciones por fuera del régimen especial establecido en esta ley.","Quedan exceptuadas únicamente las acciones basadas en ilícitos penales, en cuyo caso la reparación se regirá por las normas comunes."]},{"n":52,"nt":[],"h":"Sustitúyese el artículo 248 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 248","t":"Indemnización por antigüedad","s":"Monto.","p":["Artículo 248: Indemnización por antigüedad. Monto. Beneficiarios. En caso de muerte del trabajador, tendrán derecho a percibir una indemnización igual a la prevista en el artículo 247 de esta ley, las personas que se detallan a continuación:","a) El cónyuge o conviviente del causante;","b) Los hijos del causante menores de edad;","c) Los hijos del causante mayores de edad con Certificado Único de Discapacidad (CUD).","De concurrir dos (2) o más de los supuestos detallados anteriormente, se distribuirá la indemnización en partes iguales, es decir, considerando cada titular del crédito como uno (1).","En caso de ausencia de algunos de los supuestos indicados en los incisos anteriores, tendrán derecho los hijos del causante mayores de edad y, ante la falta de los beneficiarios considerando los supuestos detallados, se les reconoce este derecho a los padres del causante que estuvieren a cargo al momento del fallecimiento.","El empleador queda liberado del pago si cancela la misma dentro de los treinta (30) días de ocurrido el deceso considerando la documentación con la que contaba y/o que le fuera entregada con motivo del mismo. Si por alguna circunstancia algún acreedor con mejor o igual derecho que los que cobraron reclama al empleador vencido el plazo indicado, sólo tendrá una acción de repetición contra los otros acreedores quedando eximido el empleador de toda obligación.","Esta indemnización es independiente de la que se reconozca a los causahabientes del trabajador por el Sistema de Riesgos del Trabajo, según el caso, y de cualquier otro beneficio que, por las leyes, Convenciones Colectivas de Trabajo, seguros, actos o contratos de previsión, le fuesen concedidos a los mismos en razón del fallecimiento del trabajador."]},{"n":53,"nt":[],"h":"Sustitúyese el artículo 255 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 255","t":"Reingreso del trabajador","s":"Deducción de las indemnizaciones percibidas.","p":["Artículo 255: Reingreso del trabajador. Deducción de las indemnizaciones percibidas. La antigüedad del trabajador se establecerá conforme a lo dispuesto en los artículos 18 y 19 de esta ley, pero si hubiera mediado reingreso a las órdenes del mismo empleador se deducirá de las indemnizaciones de los artículos 245, 246, 247, 250, 251, 253 y 254 lo pagado oportunamente, actualizado por el Índice de Precios al Consumidor (IPC), por la causal de cese anterior.","En ningún caso la indemnización resultante podrá ser inferior a la que hubiera correspondido al trabajador si su período de servicios hubiera sido solo el último y con prescindencia de los períodos anteriores al reingreso."]},{"n":54,"nt":[],"h":"Sustitúyese el artículo 276 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 276","t":"Sustituye art. 276 · LCT","s":"Actualización y repotenciación de los créditos laborales por depreciación monetaria.","p":["Artículo 276: Actualización y repotenciación de los créditos laborales por depreciación monetaria. Los créditos provenientes de las relaciones individuales de trabajo serán actualizados por la variación que resulte del Índice de Precios al Consumidor (IPC) - Nivel General, elaborado por el Instituto Nacional de Estadística y Censos (INDEC), con más una tasa de interés del tres por ciento (3%) anual, desde que cada suma sea debida y hasta el momento del efectivo pago."]},{"n":55,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"En los juicios en trámite y aún pendientes de sentencia definitiva, a la fecha de la…","s":"En los juicios en trámite y aún pendientes de sentencia definitiva, a la fecha de la entrada en vigencia de la presente ley, incluidos los recursos de queja que se encuentren pendientes de resolución, los créditos…","p":["En los juicios en trámite y aún pendientes de sentencia definitiva, a la fecha de la entrada en vigencia de la presente ley, incluidos los recursos de queja que se encuentren pendientes de resolución, los créditos provenientes de las relaciones individuales de trabajo serán actualizados en base a los siguientes criterios:","a) A través de la aplicación de intereses moratorios ajustados a la tasa pasiva determinada por el Banco Central de la República Argentina (BCRA) a estos fines para el período correspondiente;","b) En ningún caso el resultado, aplicando las pautas del inciso a) del presente artículo, podrá ser superior al importe derivado de adicionar al capital histórico la suma resultante de la aplicación sobre el mismo del Índice de Precios al Consumidor (IPC) suministrado por el Instituto Nacional de Estadística y Censos (INDEC) con más una tasa de interés del tres por ciento (3%) anual;","c) El valor resultante no podrá ser inferior al sesenta y siete por ciento (67%) del cálculo obtenido al aplicar las pautas del inciso b) del presente artículo.","Las disposiciones del presente artículo son de orden público y serán aplicadas por los jueces o por la autoridad administrativa, de oficio o a petición de parte, incluso en los casos de concurso del deudor, así como también después de la declaración de quiebra."]},{"n":56,"nt":[],"h":"Sustitúyese el artículo 277 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"LCT","rf":"art. 277","t":"Pago en juicio","s":"Todo pago que deba realizarse en los juicios laborales se efectivizará mediante depósito bancario:","p":["Artículo 277: Pago en juicio. Todo pago que deba realizarse en los juicios laborales se efectivizará mediante depósito bancario:","a) En la cuenta sueldo del respectivo trabajador, creada en virtud de lo establecido en la ley 26.590 y su normativa complementaria y siempre que aquella se encuentre disponible;","b) Excepcionalmente y sólo en caso de ausencia de la primera, en autos a la orden del Tribunal interviniente y giro judicial personal al titular del crédito o sus derechohabientes, aún en el supuesto de haber otorgado poder.","Todo pacto de cuota litis requerirá ratificación personal y homologación judicial, y en ningún caso podrá exceder del veinte por ciento (20%) del monto del proceso.","Las sentencias judiciales condenatorias de personas humanas y/o jurídicas cuando se trate de grandes empresas podrán ser canceladas en hasta un máximo de seis (6) cuotas mensuales consecutivas, ajustadas conforme la pauta establecida en el artículo 276 de la presente ley. En el caso de las Micro, Pequeñas y Medianas Empresas la cancelación de las sentencias judiciales condenatorias de personas humanas y/o jurídicas podrán ser realizadas en hasta un máximo de doce (12) cuotas mensuales consecutivas.","El desistimiento por el trabajador de acciones y derechos se ratificará personalmente en el juicio y requerirá homologación.","Todo pago realizado sin observar lo prescripto en este artículo, así como el pacto de cuota litis o el desistimiento no homologado, serán nulos de pleno derecho.","La responsabilidad por el pago de las costas procesales, incluidos los honorarios profesionales de todo tipo allí devengados y correspondientes a la primera o única instancia, no excederán del veinticinco por ciento (25%) del monto de la sentencia, laudo, transacción o instrumento que ponga fin al diferendo. Si las regulaciones de honorarios practicadas conforme a las leyes arancelarias o usos locales, correspondientes a todas las profesiones y especialidades superaran dicho porcentaje, el juez procederá a prorratear los montos entre los beneficiarios. Para el cómputo del porcentaje indicado no se tendrá en cuenta el monto de los honorarios profesionales que hubieren representado, patrocinado o asistido a la parte condenada en costas."]},{"n":57,"nt":[],"h":"Incorpórase como artículo 278 a la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, el siguiente:","ac":"Incorpora","tg":"LCT","rf":"art. 278","t":"Remisión de antecedentes judiciales","s":"Contribuciones adeudadas con destino a Obra Social.","p":["Artículo 278: Remisión de antecedentes judiciales. Contribuciones adeudadas con destino a Obra Social. Cuando en el marco de un proceso judicial se determine que el trabajador no fue registrado, o que su registración fue deficiente porque resultó tardía, y/o con una remuneración inferior a la realmente devengada y/o porque se omitió el ingreso total o parcial de los aportes y contribuciones correspondientes a los distintos organismos de la seguridad social, el juez, en la sentencia definitiva, deberá remitir los antecedentes a la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, o al organismo competente, para la liquidación y obtención del pago de las sumas adeudadas con más las multas, recargos y accesorios que allí se determinen. En el caso de contribuciones adeudadas con destino a la Obra Social, la condena sólo podrá contemplar el pago, en este caso al trabajador, si se acreditase haber mediado privación de toda cobertura de salud, y en tal supuesto, por los importes que éste acredite haber afrontado para mantener su afiliación.","Las prestaciones salariales, indemnizatorias y/o de cualquier otra naturaleza jurídica previstas en esta ley y/o en los distintos regímenes laborales especiales y/o previsionales son incompatibles con acciones y/o reclamos por daños y perjuicios fundados en el Código Civil y Comercial de la Nación."]},{"n":58,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Objeto","s":"Créanse los Fondos de Asistencia Laboral destinados exclusivamente a coadyuvar al cumplimiento de las obligaciones y pagos que se estipulen conforme los artículos 95, 212 párrafos segundo, tercero y cuarto, 232,…","p":["Objeto. Créanse los Fondos de Asistencia Laboral destinados exclusivamente a coadyuvar al cumplimiento de las obligaciones y pagos que se estipulen conforme los artículos 95, 212 párrafos segundo, tercero y cuarto, 232, 233, 241, 245, 246, 247, 248, 250 y 254 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones, y de las indemnizaciones reparadoras de preaviso, integración, y despido, previstas en los estatutos profesionales, por parte de los empleadores del sector privado, incluso las previstas en la Ley del Régimen de Trabajo Agrario N° 26.727 y sus modificaciones.","Adicionalmente, cuando las condiciones económico-financieras de los citados fondos lo permitan y se encuentre garantizada la cobertura mínima que establezca la reglamentación, la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano, en forma conjunta con el Ministerio de Economía, podrán autorizar la ampliación de las indemnizaciones laborales que puedan ser cubiertas por los fondos.","Los referidos fondos sólo podrán prestar cobertura respecto de trabajadores registrados con una antelación no menor a doce (12) meses de la fecha de la extinción de la relación laboral. En ningún caso y bajo ninguna circunstancia prestarán cobertura respecto de trabajadores no registrados. El presente régimen no modifica, sustituye, ni altera el régimen indemnizatorio.","Se encuentran excluidos del presente régimen las relaciones laborales regidas por las leyes 22.250 y su modificatoria y 26.844 y sus modificaciones."]},{"n":59,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Naturaleza jurídica","s":"Cada empleador deberá conformar una cuenta como un patrimonio separado, de afectación específica, independiente, inajenable e inembargable, en uno de los fondos administrados por una de las entidades habilitadas a…","p":["Naturaleza jurídica. Cada empleador deberá conformar una cuenta como un patrimonio separado, de afectación específica, independiente, inajenable e inembargable, en uno de los fondos administrados por una de las entidades habilitadas a tal fin por la Comisión Nacional de Valores, organismo descentralizado actuante en la órbita del Ministerio de Economía, a elección del empleador. Los recursos disponibles en dichas cuentas estarán destinados exclusivamente al cumplimiento de las obligaciones determinadas en el artículo 58 de la presente ley."]},{"n":60,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Contribución","s":"Las cuentas de los Fondos de Asistencia Laboral se conformarán con una contribución mensual obligatoria del uno por ciento (1%) para las grandes empresas y dos coma cinco por ciento (2,5%) para las Micro, Pequeñas…","p":["Contribución. Las cuentas de los Fondos de Asistencia Laboral se conformarán con una contribución mensual obligatoria del uno por ciento (1%) para las grandes empresas y dos coma cinco por ciento (2,5%) para las Micro, Pequeñas y Medianas Empresas, de acuerdo a lo previsto en la ley 24.467 y sus modificatorias, de las remuneraciones que se toman como base para el cálculo de las contribuciones patronales con destino al Sistema Integrado Previsional Argentino (SIPA) de cada trabajador.","Los porcentajes de las cuentas de los Fondos de Asistencia podrán incrementarse hasta el uno coma cinco por ciento (1,5%) para las grandes empresas y hasta el tres por ciento (3%) para las Micro, Pequeñas y Medianas Empresas de las remuneraciones que se toman como base para el cálculo de las contribuciones patronales con destino al Sistema Integrado Previsional Argentino (SIPA) de cada trabajador, cuando así lo disponga el Poder Ejecutivo nacional atendiendo al cumplimiento de las metas asociadas a las políticas de equilibrio fiscal, previa aprobación de la Comisión Bicameral de Control de Fondos de la Seguridad Social del Honorable Congreso de la Nación.","Las sumas correspondientes serán integradas mensualmente por el empleador en oportunidad de declarar y abonar los aportes y contribuciones patronales.","En pos de la simplificación y la facilitación del costo de cumplimiento, los pagos correspondientes a los importes ingresados al Fondo de Asistencia Laboral serán canalizados a través de la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, que actuará únicamente como agente de derivación, sin asumir responsabilidad alguna por la eventual falta de pago, disponibilidad o insuficiencia de la cuenta individual.","Asimismo, en ningún caso esta derivación implicará responsabilidad alguna por parte del Estado nacional respecto de las obligaciones del empleador."]},{"n":61,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Recursos de los Fondos de Asistencia Laboral","s":"Los recursos de cada Fondo de Asistencia Laboral estarán constituidos por:","p":["Recursos de los Fondos de Asistencia Laboral. Los recursos de cada Fondo de Asistencia Laboral estarán constituidos por:","a) Las contribuciones mensuales obligatorias que deba efectuar el empleador;","b) Los rendimientos, intereses y/o cualquier otra renta derivada de las inversiones que efectúe la administradora del fondo, cuya actuación quedará sujeta a los límites de forma que el Ministerio de Economía reglamente a los fines de guardar la integralidad de sus depósitos;","c) Las contribuciones voluntarias que efectúe el empleador;","d) Las donaciones o legados que reciba;","e) Cualquier otro ingreso no contemplado en los incisos precedentes."]},{"n":62,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Administración","s":"Cada empleador tendrá una cuenta individual, de carácter común y no individualizable por trabajador, cuya administración estará a cargo de una entidad habilitada a través de uno de sus fondos que tenga autorizado a…","p":["Administración. Cada empleador tendrá una cuenta individual, de carácter común y no individualizable por trabajador, cuya administración estará
