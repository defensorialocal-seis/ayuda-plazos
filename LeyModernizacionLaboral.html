<script>
const {nodes:N,arts:A}=JSON.parse(document.getElementById('d').textContent);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],main=$('#main'),side=$('#side');
const PAL=['#5b50c4','#2c74b3','#237f64','#b8602a','#b0436b','#85701f','#4f5d77'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('No se pudo copiar'));

/* ---- jerarquía ---- */
N.forEach((n,i)=>{n.i=i;n.c=[]});N.forEach(n=>n.par>=0&&N[n.par].c.push(n.i));
const nodeOf={};N.forEach(n=>n.arts.forEach(a=>nodeOf[a]=n.i));
const sub=i=>N[i]._s||(N[i]._s=[...N[i].arts,...N[i].c.flatMap(sub)].sort((a,b)=>a-b));
const root=i=>{while(N[i].par>=0)i=N[i].par;return i};
const TT=N.filter(n=>n.lv==1);
const sty=i=>{const c=PAL[TT.indexOf(N[root(i)])%PAL.length];return `--ac:${c};--at:color-mix(in srgb,${c} var(--tm),#fff);--b:color-mix(in srgb,${c} 13%,var(--card))`};
const lab=n=>`${n.k} ${n.num}`,nm=n=>n.name||lab(n),byN=n=>A[n-1];
const rng=i=>{const s=sub(i);return !s.length?'':s[0]==s.at(-1)?`Art. ${s[0]}`:`Arts. ${s[0]}–${s.at(-1)}`};
const PLU={Capítulo:'capítulos',Sección:'secciones'};

/* ---- plazos: duraciones y fechas detectadas en el texto ---- */
const WD='un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta y cinco|cuarenta|sesenta|noventa|ciento veinte|ciento ochenta';
const WV={un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,'cuarenta y cinco':45,cuarenta:40,sesenta:60,noventa:90,'ciento veinte':120,'ciento ochenta':180};
const U='(d[ií]as?|mes(?:es)?|a[ñn]os?|horas?)(?:\\s+(h[aá]biles|corridos|calendario))?';
const MS='enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre'.split(' '),MES=MS.join('|')+'|setiembre';
const RD=`(?:\\b(?:${WD})\\s+)?\\((\\d{1,3})\\)\\s*${U}|\\b(\\d{1,3})\\s+${U}|\\b(${WD})\\s+${U}`;
const RF=`\\b(\\d{1,2})[°º]?\\s+de\\s+(${MES})\\s+de\\s+(\\d{4})`;
const UL={d:['día','días'],m:['mes','meses'],a:['año','años'],h:['hora','horas']};
const ctx=(p,i,len)=>{const s=Math.max(0,i-100),e=Math.min(p.length,i+len+70);return (s?'…':'')+p.slice(s,e).trim()+(e<p.length?'…':'')};
const Z=[];
A.forEach(a=>{a.z=[];[a.h,...a.p].filter(Boolean).forEach(p=>{
 for(const m of p.matchAll(new RegExp(RD,'gi'))){const g=m.slice(1),k=g[0]?0:g[3]?3:6;
  const v=k==6?WV[g[6].toLowerCase()]:+g[k];const uc=norm(g[k+1])[0],t=g[k+2]?norm(g[k+2]).replace('calendario','corridos').replace('habiles','hábiles'):'';
  const z={n:a.n,v,u:UL[uc][1],t,l:`${v} ${UL[uc][v==1?0:1]}${t?' '+t:''}`,c:ctx(p,m.index,m[0].length)};Z.push(z);a.z.push(z)}
 for(const m of p.matchAll(new RegExp(RF,'gi'))){const d=new Date(+m[3],MS.indexOf(norm(m[2]).replace('setiembre','septiembre')),+m[1]);
  Z.push({n:a.n,u:'fecha',d,l:d.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}),c:ctx(p,m.index,m[0].length)})}})
 a.zl=[...new Set(a.z.map(z=>z.l))]});

/* ---- vistas ---- */
const fmt=(p,i)=>{let h=esc(p).replace(/^(Art[íi]culo\s+\d+[^:]{0,12}:\s*[^.]{0,100}\.)/,'<b>$1</b>');
 return h.replace(new RegExp(RD,'gi'),'<mark class="pz">$&</mark>').replace(new RegExp(RF,'gi'),'<mark class="pz">$&</mark>')};
const artHTML=a=>{const body=(a.h?`<p class="ins">${esc(a.h)}</p>`:'')+a.p.map(p=>`<p class="${/^([a-zñ]|\d{1,2}|[ivx]+)[.)]\s|^[-•–]\s/.test(p)?'inc':''}">${fmt(p)}</p>`).join('');
 const tags=(a.ac?`<span class="tg">${a.ac}${a.rf?' '+esc(a.rf):''}${a.tg?' · '+esc(a.tg):''}</span>`:'')+a.zl.map(z=>`<span class="pzc">⏱ ${esc(z)}</span>`).join('');
 return `<article class="art" id="a${a.n}"><header><div class="num">Art. ${a.n}</div><div><h4>${esc(a.t)}</h4>${a.s?`<p class="sum">${esc(a.s)}</p>`:''}${tags?`<div class="tags">${tags}</div>`:''}</div></header>
 <div class="acts"><button class="btn sm" data-act="t">Ver texto completo</button><button class="ghost sm" data-act="c" data-n="${a.n}">Copiar</button><button class="ghost sm" data-act="l" data-n="${a.n}">Enlace</button></div>
 <div class="full" hidden>${body}${a.nt.length?`<div class="nt"><b>Notas</b><ul>${a.nt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div></article>`};
const foot=()=>`<p class="foot">Texto de la Ley 27.802 de Modernización Laboral (sancionada el 27/02/2026) según el documento cargado; no incluye sus anexos. Las síntesis, normas modificadas y plazos se extraen automáticamente del texto y son solo una guía de lectura: verificá siempre con la versión oficial vigente en el Boletín Oficial / Infoleg.</p>`;
const crumbs=i=>{const c=[];for(let k=i;k>=0;k=N[k].par)c.unshift(`<a href="#/n/${k}">${lab(N[k])}</a>`);return `<nav class="crumb"><a href="#/">Inicio</a><span>›</span>${c.join('<span>›</span>')}</nav>`};
function card(i){const n=N[i],s=sub(i),t=n.c.length?n.c.slice(0,3).map(c=>nm(N[c])).join(' · ')+(n.c.length>3?' · …':''):s.slice(0,3).map(x=>byN(x).t).join(' · ')+(s.length>3?' · …':'');
 return `<a class="card" href="#/n/${i}" style="${sty(i)}"><h3><span class="big">${lab(n)}</span><br>${esc(nm(n))}</h3><p>${esc(t)}</p><div class="meta"><span>${rng(i)}</span><span>${s.length} art.</span>${n.c.length?`<span>${n.c.length} ${PLU[N[n.c[0]].k]}</span>`:''}</div></a>`}
function nav(){let h='<h5>Índice</h5>';TT.forEach(t=>{const st=`border-left:4px solid ${PAL[TT.indexOf(t)%PAL.length]}`;
 h+=t.c.length?`<details><summary style="${st}">${lab(t)} · ${esc(nm(t))}</summary>${t.c.map(c=>`<a class="l" data-n="${c}" href="#/n/${c}">${lab(N[c])} · ${esc(nm(N[c]))}</a>`).join('')}</details>`:`<a class="l t" data-n="${t.i}" href="#/n/${t.i}" style="${st}">${lab(t)} · ${esc(nm(t))}</a>`});
 side.innerHTML=h;$('#fc').innerHTML=`<button class="chip" data-l="" aria-pressed="true">Toda la Ley</button>`+TT.map(t=>`<button class="chip" data-l="${t.i}" title="${esc(nm(t))}" aria-pressed="false">${lab(t)}</button>`).join('')}
let lib='';const setLib=v=>{lib=v;$$('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))};
const inLib=n=>!lib||root(nodeOf[n])==+lib;

function home(){main.innerHTML=`<section class="hero"><span class="eyebrow">República Argentina · Ley 27.802</span><h1>Ley de Modernización Laboral</h1><p>Texto completo de la ley con índice navegable, síntesis de cada artículo, la norma que modifica, búsqueda inteligente y buscador de plazos y fechas de vigencia.</p>
 <div class="row stats"><div class="stat"><b>${A.length}</b><span>artículos</span></div><div class="stat"><b>${TT.length}</b><span>títulos</span></div><div class="stat"><b>${N.filter(n=>n.lv==2).length}</b><span>capítulos</span></div><div class="stat"><b>${Z.length}</b><span>plazos y fechas</span></div></div>
 <div class="row go"><input id="gn" type="text" inputmode="numeric" placeholder="Ir al artículo N.º"><button class="btn" id="gb">Ir</button><a class="btn" href="#/plazos">⏱ Buscar plazos</a></div></section>
 <div class="sec"><h2>Títulos</h2><span>Acceso rápido a cada título de la ley</span></div><div class="grid">${TT.map(t=>card(t.i)).join('')}</div>
 <div class="sec"><h2>Accesos rápidos por capítulo</h2><span>${N.filter(n=>n.lv==2).length} capítulos</span></div><div class="grid">${N.filter(n=>n.lv==2).map(n=>card(n.i)).join('')}</div>${foot()}`;
 const go=()=>{const v=+$('#gn').value.trim();v>=1&&v<=A.length?location.hash='/a/'+v:toast(`Ingresá un artículo entre 1 y ${A.length}`)};$('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}
function nodeView(i){const n=N[i],s=sub(i);
 let h=crumbs(i)+`<header class="nh"><span class="eyebrow">${lab(n)}</span><h1>${esc(nm(n))}</h1><div class="meta"><span>${rng(i)}</span><span>${s.length} artículo${s.length>1?'s':''}</span></div></header>`;
 h+=n.nt.map(t=>`<div class="box"><h4>Nota</h4><p>${esc(t)}</p></div>`).join('');
 if(s.length)h+=`<div class="box"><h4>Resumen de la sección</h4><p>Comprende ${s.length>1?`los artículos <b>${s[0]}</b> a <b>${s.at(-1)}</b> (${s.length} en total)`:`el artículo <b>${s[0]}</b>`}${n.c.length?`, organizados en ${n.c.length} ${PLU[N[n.c[0]].k]}:`:', que regulan:'}</p><ul>`+(n.c.length?n.c.map(c=>`<li><a href="#/n/${c}"><b>${lab(N[c])}</b> – ${esc(nm(N[c]))}</a> <small>(${rng(c)})</small></li>`).join(''):n.arts.map(x=>`<li><a href="#/a/${x}"><b>Art. ${x}</b> – ${esc(byN(x).t)}</a></li>`).join(''))+'</ul></div>';
 if(n.c.length)h+=`<div class="grid">${n.c.map(card).join('')}</div>`;
 if(n.arts.length)h+=`<div class="row bar"><button class="btn sm" data-act="all">Expandir todos los textos</button><button class="ghost sm" data-act="none">Contraer todos</button></div>`+n.arts.map(x=>artHTML(byN(x))).join('');
 const u=N.filter(m=>m.arts.length),k=u.indexOf(n);if(k>=0)h+=`<div class="pn">${k>0?`<a class="ghost" href="#/n/${u[k-1].i}">← ${esc(nm(u[k-1]))}</a>`:'<span></span>'}${k<u.length-1?`<a class="ghost" href="#/n/${u[k+1].i}">${esc(nm(u[k+1]))} →</a>`:''}</div>`;
 main.innerHTML=h+foot();main.style.cssText=sty(i);
 $$('aside .l').forEach(l=>l.classList.remove('on'));let t=i;while(N[t].lv>2)t=N[t].par;const l=side.querySelector(`.l[data-n="${t}"]`);if(l){l.classList.add('on');if(l.parentElement.tagName=='DETAILS')l.parentElement.open=true}}

/* ---- búsqueda (palabras en cualquier orden, sinónimos y variantes) ---- */
const STOP=new Set('de del la las el los lo al a y e o u en con por para que se su sus es son ser un una como si no mas muy le les sobre entre hay ha han este esta cuando donde cual quiero busco necesito puede pueden debe deben'.split(' '));
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
const stem=w=>{if(w.length<5||/^\d+$/.test(w))return w;for(const x of['ciones','cion','mientos','miento','dores','dor','ables','able','ados','adas','idos','idas','ado','ada','ido','ida','es','s'])if(w.endsWith(x)&&w.length-x.length>=4)return w.slice(0,-x.length);return w};
const SYN=['despido cesantia desvinculacion extincion ruptura','indemnizacion reparacion','vacacion licencia descanso feriado','jornada horario hora','sindicato sindical gremio gremial asociacion','convenio convencion paritaria colectivo','salario sueldo remuneracion','preaviso aviso','prueba periodo','pyme pequena empresa','plazo termino lapso vencimiento','multa sancion infraccion','empleador patron empresa','trabajador empleado dependiente'].map(g=>g.split(' ').map(stem));
const ok=(x,y)=>x==y||(Math.min(x.length,y.length)>=4&&(x.startsWith(y)||y.startsWith(x)));
const accepted=t=>{const s=stem(t),r=new Set([s]);SYN.forEach(g=>g.some(x=>ok(x,s))&&g.forEach(x=>r.add(x)));return[...r]};
const has=(set,acc)=>acc.some(a=>[...set].some(w=>ok(a,w)));
let ixd=0;const idx=()=>{if(ixd)return;ixd=1;A.forEach(a=>{a._m=new Set(words(a.t+' '+a.s+' '+a.tg).map(stem));a._a=new Set([...a._m,...words([a.h,...a.p].join(' ')).map(stem)])})};
const W=/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g,mk=(w,accs)=>accs.some(g=>g.some(x=>ok(x,stem(norm(w)))));
const hl=(t,accs)=>{let o='',p=0;for(const m of t.matchAll(W)){o+=esc(t.slice(p,m.index))+(mk(m[0],accs)?`<mark>${esc(m[0])}</mark>`:esc(m[0]));p=m.index+m[0].length}return o+esc(t.slice(p))};
function search(v){const terms=[...new Set(words(v).filter(w=>!STOP.has(w)||/^\d+$/.test(w)))];if(!terms.length)return route();
 if(/^\d{1,3}$/.test(v.trim())&&byN(+v)){location.hash='/a/'+(+v);return}
 idx();main.style.cssText='';const accs=terms.map(accepted),run=need=>A.filter(a=>inLib(a.n)&&accs.filter(g=>has(a._a,g)).length>=need);
 let rs=run(terms.length),part=false;if(!rs.length&&terms.length>1){part=true;rs=run(Math.ceil(terms.length/2))}
 rs=rs.map(a=>({a,s:accs.filter(g=>has(a._m,g)).length,k:accs.filter(g=>has(a._a,g)).length})).sort((x,y)=>y.k-x.k||y.s-x.s||x.a.n-y.a.n);
 const snip=a=>{const b=[a.s,...a.p].join(' ');let ix=0;for(const m of b.matchAll(W))if(mk(m[0],accs)){ix=m.index;break}const st=Math.max(0,ix-70);return(st?'…':'')+b.slice(st,st+240)+(b.length>st+240?'…':'')};
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} artículo${rs.length==1?'':'s'}${rs.length>60?' · se muestran 60':''}${lib?' · '+esc(lab(N[+lib])):''}</span></div>
 <p class="hint">${part?'Coincidencia parcial: no hay artículos con todas las palabras; se muestran los que tienen al menos la mitad. ':''}Entiende varias palabras en cualquier orden, sinónimos y números, y busca también en el texto completo.</p>`+
 (rs.slice(0,60).map(({a})=>{const n=N[nodeOf[a.n]];return `<article class="art" style="${sty(n.i)}"><header><div class="num">Art. ${a.n}</div><div><h4>${hl(a.t,accs)}<small>${esc(lab(N[root(n.i)])+(n.i==root(n.i)?'':' › '+lab(n))+' · '+nm(n))}</small></h4><p class="sum">${hl(snip(a),accs)}</p></div></header><div class="acts"><a class="btn sm" href="#/a/${a.n}">Abrir artículo en su sección</a></div></article>`}).join('')||'<p>Sin coincidencias. Probá con otra palabra o quitá el filtro de Título.</p>')}

/* ---- vista de plazos ---- */
let pu='todos';
function plazosView(){main.style.cssText='';const TABS=['todos','días','meses','años','horas','fechas'];
 main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Plazos</span></nav><div class="sec"><h2>Buscador de plazos</h2><span>Duraciones y fechas detectadas en el texto de los artículos</span></div>
 <div class="row tabs">${TABS.map(u=>`<button data-u="${u}" class="${u==pu?'on':''}">${u[0].toUpperCase()+u.slice(1)}</button>`).join('')}</div>
 <div class="row ctl"><input id="pq" type="search" placeholder="Filtrar por tema: ej. despido, preaviso, registro…"><input id="pv" type="number" min="1" placeholder="Cantidad"><select id="pt"><option value="">Hábiles y corridos</option><option value="hábiles">Solo hábiles</option><option value="corridos">Solo corridos</option></select><select id="pl"><option value="">Toda la Ley</option>${TT.map(t=>`<option value="${t.i}"${lib==t.i?' selected':''}>${lab(t)} · ${esc(nm(t))}</option>`).join('')}</select></div>
 <p class="hint" id="pc"></p><table class="tb"><thead><tr><th>Artículo</th><th>Plazo</th><th>Contexto</th></tr></thead><tbody id="pb"></tbody></table>${foot()}`;
 const now=new Date(),draw=()=>{const q=norm($('#pq').value),v=+$('#pv').value,t=$('#pt').value,l=$('#pl').value;
  let r=Z.filter(z=>(pu=='todos'?z.u!='fecha':z.u==(pu=='fechas'?'fecha':pu))&&(!v||z.v==v)&&(!t||z.t==t)&&(!l||root(nodeOf[z.n])==+l)&&(!q||norm(byN(z.n).t+' '+z.c).includes(q)));
  if(pu=='fechas')r.sort((a,b)=>a.d-b.d);
  $('#pc').textContent=`${r.length} resultado${r.length==1?'':'s'}${r.length>150?' · se muestran 150':''}`;
  $('#pb').innerHTML=r.slice(0,150).map(z=>{const df=z.d?Math.ceil((z.d-now)/864e5):0,s=z.d?`<span class="st">${df<0?'ya transcurrió':df==0?'hoy':'faltan '+df+' días'}</span>`:'';
   return `<tr><td data-l="Artículo"><a class="x" href="#/a/${z.n}">Art. ${z.n}</a><div class="hint">${esc(byN(z.n).t)}</div></td><td data-l="Plazo"><span class="pzc">${z.d?'📅':'⏱'} ${esc(z.l)}</span>${s}</td><td data-l="Contexto">${esc(z.c)}</td></tr>`}).join('')||'<tr><td colspan="3">Sin resultados con esos filtros.</td></tr>'};
 ['#pq','#pv'].forEach(s=>$(s).oninput=draw);$('#pt').onchange=draw;$('#pl').onchange=e=>{setLib(e.target.value);draw()};
 $$('.tabs button').forEach(b=>b.onclick=()=>{pu=b.dataset.u;$$('.tabs button').forEach(x=>x.classList.toggle('on',x==b));draw()});draw()}

/* ---- enrutado y eventos ---- */
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');main.style.cssText='';
 const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;if(ri!=null&&N[ri])setLib(String(root(ri)));else if(h!='/plazos')setLib('');
 if(h=='/plazos'){plazosView();scrollTo(0,0);return}
 if(!m||(m[1]=='n'&&!N[+m[2]])||(m[1]=='a'&&!nodeOf[+m[2]])){home();scrollTo(0,0);$$('aside .l.on').forEach(x=>x.classList.remove('on'));return}
 if(m[1]=='n'){nodeView(+m[2]);scrollTo(0,0)}else{const n=+m[2];nodeView(nodeOf[n]);const e=$('#a'+n);if(e){e.classList.add('hit');setT(e,false);setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}}
const setT=(a,hide)=>{a.querySelector('.full').hidden=hide;a.querySelector('[data-act=t]').textContent=hide?'Ver texto completo':'Ocultar texto completo'};
document.addEventListener('click',e=>{
 const c=e.target.closest('#fc .chip');if(c){setLib(c.dataset.l);if(location.hash=='#/plazos'){plazosView();return}const q=$('#q').value;if(q.trim())search(q);else location.hash=c.dataset.l?'/n/'+c.dataset.l:'/';return}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,art=b.closest('.art');
 if(act=='t')setT(art,!art.querySelector('.full').hidden);
 else if(act=='all'||act=='none')$$('.art').forEach(x=>setT(x,act=='none'));
 else if(act=='c'){const a=byN(+b.dataset.n);copy(`Artículo ${a.n}.- ${a.t}\n\n${[a.h,...a.p].filter(Boolean).join('\n')}`,'Texto copiado')}
 else if(act=='l')copy(location.href.split('#')[0]+'#/a/'+b.dataset.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>e.target.value.trim()?search(e.target.value):route(),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#12161f';r.dataset.theme=dk?'light':'dark'};
const fit=()=>document.documentElement.style.setProperty('--th',$('.top').offsetHeight+'px');
addEventListener('resize',fit);addEventListener('hashchange',route);
nav();fit();route();document.fonts&&document.fonts.ready.then(fit);
</script>
</body>
</html>
