,"h":"","ac":"","tg":"","rf":"","t":"Bolsas de trabajo","s":"Las Bolsas de Trabajo, cualquiera fuera su denominación o modalidad de organización, que se encuentren a cargo de las asociaciones sindicales de trabajadores o bajo organismos provinciales o municipales, podrán…","p":["Bolsas de trabajo. Las Bolsas de Trabajo, cualquiera fuera su denominación o modalidad de organización, que se encuentren a cargo de las asociaciones sindicales de trabajadores o bajo organismos provinciales o municipales, podrán proponer a los empleadores que así lo requirieran un listado de los trabajadores disponibles para la realización de tareas temporarias, facilitando al empleador requirente los curriculum vitae de los candidatos propuestos por el sindicato.","El empleador podrá contratar a la persona sugerida y/o a cualquier otra que disponga, sin que pudiera considerarse exclusiva u obligatoria la solicitud y/o asignación de personal a través de las Bolsas de Trabajo.","Quedan derogadas todas las normas legales, así como las obligaciones derivadas de usos y costumbres, que se opongan al presente artículo y/o vulneren, en cualquier medida, el principio de libertad de contratación y de elección de personal por parte de cualquier empleador que así lo requiera."]},{"n":130,"nt":[],"h":"Sustitúyese el artículo 4° de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 4","t":"Sustituye art. 4 · Convenciones colectivas","s":"Las normas originadas en las convenciones colectivas que sean homologadas por la Secretaría de Trabajo, Empleo y Seguridad Social, del Ministerio de Capital Humano en su carácter de Autoridad de Aplicación, regirán…","p":["Artículo 4º: Las normas originadas en las convenciones colectivas que sean homologadas por la Secretaría de Trabajo, Empleo y Seguridad Social, del Ministerio de Capital Humano en su carácter de Autoridad de Aplicación, regirán respecto de todos los trabajadores de la actividad, o de la región, o de la categoría dentro del ámbito a que estas convenciones se refieran; cuando se trate de un acuerdo destinado a ser aplicado a más de un empleador, alcanzarán a todos los comprendidos en sus particulares ámbitos. Todo ello sin perjuicio de que los trabajadores y los empleadores invistan o no el carácter de afiliados a las respectivas asociaciones signatarias.","Será presupuesto esencial para acceder a la homologación, que la convención no contenga cláusulas violatorias de normas de orden público o que afecten el interés general.","Los Convenios Colectivos de Trabajo de empresa o de grupo de empresas, deberán observar las condiciones establecidas en el párrafo precedente y serán presentados ante la Autoridad de Aplicación para su registro, publicación y depósito, conforme a lo previsto en el artículo 5º de esta ley.","Sin perjuicio de ello, estos convenios podrán ser homologados a pedido de parte."]},{"n":131,"nt":[],"h":"Sustitúyese el artículo 6° de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 6","t":"Sustituye art. 6 · Convenciones colectivas","s":"Una convención colectiva de trabajo, cuyo término estuviere vencido, solamente mantendrá subsistentes las normas referidas a las condiciones y beneficios individuales directos del trabajo y los beneficios otorgados…","p":["Artículo 6°: Una convención colectiva de trabajo, cuyo término estuviere vencido, solamente mantendrá subsistentes las normas referidas a las condiciones y beneficios individuales directos del trabajo y los beneficios otorgados para el trabajador establecidas en virtud de ellas (cláusulas normativas) y hasta tanto entre en vigencia una nueva convención colectiva o exista un acuerdo de partes que la prorrogue. El resto de las cláusulas (obligacionales) mantendrán su vigencia sólo por acuerdo de partes."]},{"n":132,"nt":[],"h":"","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 7","t":"Sustituye art. 7 · Convenciones colectivas","s":"Sustitúyese el artículo 7° de la ley N° 14.250 (t.o.","p":["Sustitúyese el artículo 7° de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente: Artículo 7º: Las disposiciones de las convenciones colectivas deberán ajustarse a las normas legales que rigen las instituciones del derecho del trabajo, a menos que las cláusulas de la convención relacionadas con cada una de esas instituciones resultaran más favorables a los trabajadores, conforme las pautas del artículo 9° de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificaciones y siempre que no afectaren disposiciones dictadas en protección del interés general."]},{"n":133,"nt":[],"h":"Sustitúyese el artículo 9º de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 9","t":"Sustituye art. 9 · Convenciones colectivas","s":"Los aportes, contribuciones y cualquier otro concepto previstos en las Convenciones Colectivas de Trabajo, cualquiera sea su denominación u objeto, en beneficio directo o indirecto a cámaras, asociaciones,…","p":["Artículo 9°: Los aportes, contribuciones y cualquier otro concepto previstos en las Convenciones Colectivas de Trabajo, cualquiera sea su denominación u objeto, en beneficio directo o indirecto a cámaras, asociaciones, agrupaciones o personas jurídicas integradas parcialmente o totalmente por empleadores o cuyos órganos directivos estén integrados por representantes de los empleadores, no podrán superar el cero coma cinco por ciento (0,5%) de las remuneraciones de los trabajadores.","Las contribuciones y los aportes previstos en las Convenciones Colectivas de Trabajo, a favor de asociaciones de trabajadores, que sean válidas para afiliados o no afiliados comprendidos en el ámbito de la convención, no podrán superar el dos por ciento (2%) de las remuneraciones de los trabajadores. Quedan excluidas las cuotas de afiliación sindical y las cláusulas que acuerden otros beneficios especiales en función de la afiliación a la asociación profesional de trabajadores que suscribió el convenio colectivo."]},{"n":134,"nt":[],"h":"Sustitúyese el artículo 13 de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 13","t":"Sustituye art. 13 · Convenciones colectivas","s":"Los Convenios Colectivos de Trabajo podrán prever la constitución de Comisiones Paritarias, integradas por un número igual de representantes de empleadores y trabajadores del mismo ámbito personal y territorial de…","p":["Artículo 13: Los Convenios Colectivos de Trabajo podrán prever la constitución de Comisiones Paritarias, integradas por un número igual de representantes de empleadores y trabajadores del mismo ámbito personal y territorial de cada convenio colectivo de trabajo, cuyo funcionamiento y atribuciones serán las establecidas en el respectivo convenio, sin perjuicio de lo dispuesto en el artículo siguiente."]},{"n":135,"nt":[],"h":"Sustitúyese el artículo 18 de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 18","t":"Sustituye art. 18 · Convenciones colectivas","s":"Los Convenios Colectivos de ámbito mayor no podrán modificar ni disponer el contenido de los convenios de ámbito menor.","p":["Artículo 18: Los Convenios Colectivos de ámbito mayor no podrán modificar ni disponer el contenido de los convenios de ámbito menor.","Los Convenios Colectivos de empresa, podrán establecer formas de articulación entre unidades de negociación de ámbitos diferentes, ajustándose las partes a sus respectivas facultades de representación. Asimismo, podrán hacer remisión expresa de las materias a negociar en los Convenios de ámbito mayor que resulten aplicables en el ámbito personal y territorial del Convenio de ámbito menor."]},{"n":136,"nt":[],"h":"Sustitúyese el artículo 19 de la ley N° 14.250 (t.o. 2004) y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Convenciones colectivas","rf":"art. 19","t":"Sustituye art. 19 · Convenciones colectivas","s":"Queda establecido el siguiente orden de prelación de normas:","p":["Artículo 19: Queda establecido el siguiente orden de prelación de normas:","a) Un convenio colectivo posterior modifica en cualquier sentido a un convenio colectivo anterior de igual ámbito;","b) Un convenio de ámbito menor, prevalece, dentro de su ámbito de representación personal y territorial, frente a otro convenio de ámbito mayor, anterior o posterior."]},{"n":137,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"En el plazo de un (1) año contado desde la promulgación de la presente ley, la…","s":"En el plazo de un (1) año contado desde la promulgación de la presente ley, la Secretaría de Trabajo, Empleo y Seguridad Social, del Ministerio de Capital Humano, convocará a las partes legitimadas para negociar,…","p":["En el plazo de un (1) año contado desde la promulgación de la presente ley, la Secretaría de Trabajo, Empleo y Seguridad Social, del Ministerio de Capital Humano, convocará a las partes legitimadas para negociar, y/o renegociar y/o ratificar las cláusulas de los Convenios Colectivos de Trabajo que estuvieran vencidos, acorde a lo dispuesto por el artículo 6° de la ley 14.250 (t.o. 2004) y sus modificaciones.","Por petición de cualquiera de las partes legitimadas para negociar un Convenio Colectivo de Trabajo, cualquiera sea su nivel, cuyas cláusulas normativas se hallaren vigentes sólo por ultraactividad, la autoridad administrativa del trabajo podrá decretar la suspensión de los efectos del acto de homologación cuando se alegare y demostrare sumariamente que su aplicación genera distorsiones económicas graves que afecten el interés general o la aplicación de otras normas dictadas en protección de toda o parte de la población. En tales condiciones, la suspensión podrá ser decretada hasta tanto concluya su cometido la comisión paritaria de negociación del nuevo convenio colectivo."]},{"n":138,"nt":[],"h":"Sustitúyese el artículo 20 bis de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 20","t":"Sustituye art. 20 · Asociaciones sindicales","s":"Derecho de realizar Asambleas, Congresos.","p":["Artículo 20 bis: Derecho de realizar Asambleas, Congresos. La asociación sindical, legalmente reconocida, podrá convocar a asambleas de personal y congresos de delegados, siempre que ello no afecte el normal desarrollo de las actividades de la empresa ni cause perjuicio a terceros. En caso de celebrarse una asamblea dentro o fuera del establecimiento del empleador, deberá contarse con su autorización previa, tanto del horario y el tiempo de su duración.","Además, en caso de que se realice dentro del establecimiento deberá requerirse también autorización respecto del lugar.","Para ejercer dicha facultad deberá estar al día en el cumplimiento de pago de haberes.","El trabajador no devengará salarios durante el tiempo de la misma."]},{"n":139,"nt":[],"h":"Sustitúyese el artículo 20 ter de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 20","t":"Sustituye art. 20 · Asociaciones sindicales","s":"Serán consideradas infracciones muy graves:","p":["Artículo 20 ter: Serán consideradas infracciones muy graves:","a. Afectar la libertad de trabajo de quienes no adhieran a una medida de fuerza mediante actos y/o hechos y/o intimidaciones o amenazas;","b. Provocar, y/o instar y/u organizar el bloqueo o tomar un establecimiento; impedir u obstruir total o parcialmente el ingreso o egreso de personas y/o cosas al establecimiento;","c. Ocasionar daños en personas o en cosas de propiedad de la empresa o de terceros, se encuentren o no en el establecimiento del empleador (instalaciones, mercaderías, insumos y materias primas, herramientas, etc.) o retenerlas indebidamente. Verificadas dichas acciones como medidas de acción directa sindical, la entidad responsable será pasible de la aplicación de las sanciones que establezca la reglamentación, una vez cumplimentado el procedimiento que disponga al efecto la Autoridad de Aplicación, sin perjuicio de las responsabilidades civiles y/o penales que pudieran corresponder."]},{"n":140,"nt":[],"h":"Sustitúyese el artículo 23 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 23","t":"Sustituye art. 23 · Asociaciones sindicales","s":"La asociación a partir de su inscripción, adquirirá personería jurídica y tendrá los siguientes derechos:","p":["Artículo 23: La asociación a partir de su inscripción, adquirirá personería jurídica y tendrá los siguientes derechos:","a) Peticionar y representar, a solicitud de parte, los intereses individuales de sus afiliados;","b) Representar los intereses colectivos de sus afiliados en su ámbito personal y territorial;","c) Promover:","1° La formación de sociedades cooperativas y mutuales,","2° El perfeccionamiento de la legislación laboral, previsional de seguridad social,","3° La educación general y la formación profesional de los trabajadores;","d) Imponer cotizaciones a sus afiliados;","e) Realizar reuniones o asambleas conforme a las normas que regulen su ejercicio."]},{"n":141,"nt":[],"h":"Sustitúyese el artículo 29 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 29","t":"Sustituye art. 29 · Asociaciones sindicales","s":"Podrá otorgarse personería gremial a un sindicato de empresa cuando su cantidad de afiliados cotizantes fuere, durante un período mínimo y continuado de seis (6) meses anteriores a su presentación, superior a la…","p":["Artículo 29: Podrá otorgarse personería gremial a un sindicato de empresa cuando su cantidad de afiliados cotizantes fuere, durante un período mínimo y continuado de seis (6) meses anteriores a su presentación, superior a la cantidad de afiliados cotizantes en el ámbito de la misma empresa a la asociación con personería preexistente, cualquiera sea el grado o el ámbito material, territorial y personal de actuación de esta última.","A tales fines, se aplicará en lo pertinente las reglas de procedimiento previstas en el artículo anterior, con el efecto establecido en su párrafo cuarto respecto del ámbito de la empresa."]},{"n":142,"nt":[],"h":"Sustitúyese el inciso c) del artículo 44 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 44","t":"Sustituye art. 44 · Asociaciones sindicales","s":"c) Conceder a cada uno de los delegados del personal, para el ejercicio de sus funciones un crédito de hasta diez (10) horas mensuales retribuidas, salvo que el convenio colectivo aplicable disponga una cantidad…","p":["c) Conceder a cada uno de los delegados del personal, para el ejercicio de sus funciones un crédito de hasta diez (10) horas mensuales retribuidas, salvo que el convenio colectivo aplicable disponga una cantidad mayor. El ejercicio de este derecho no podrá generar la interrupción de actividades en el área de trabajo."]},{"n":143,"nt":[],"h":"Sustitúyese el artículo 50 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 50","t":"Sustituye art. 50 · Asociaciones sindicales","s":"A partir de la notificación fehaciente al empleador de su postulación para un cargo de representación sindical, cualquiera sea dicha representación y por el término de seis (6) meses, el trabajador no podrá ser…","p":["Artículo 50: A partir de la notificación fehaciente al empleador de su postulación para un cargo de representación sindical, cualquiera sea dicha representación y por el término de seis (6) meses, el trabajador no podrá ser despedido ni suspendido sin justa causa, ni modificadas sus condiciones de trabajo, salvo que mediare una reorganización total del establecimiento o sector. Esta protección cesará para aquellos trabajadores cuya postulación no hubiere sido oficializada según el procedimiento electoral aplicable desde el momento de determinarse definitivamente dicha falta de oficialización y/o que el candidato hubiere obtenido menos del cinco por ciento (5%) de los votos válidos emitidos. La asociación sindical deberá comunicar al empleador el nombre de los postulantes; lo propio podrán hacer los candidatos."]},{"n":144,"nt":[],"h":"Sustitúyese el artículo 52 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 52","t":"Sustituye art. 52 · Asociaciones sindicales","s":"Los trabajadores amparados por las garantías previstas en los artículos 40, 48 y 50 de la presente ley, no podrán ser suspendidos, despedidos ni con relación a ellos podrán modificarse las condiciones de trabajo,…","p":["Artículo 52: Los trabajadores amparados por las garantías previstas en los artículos 40, 48 y 50 de la presente ley, no podrán ser suspendidos, despedidos ni con relación a ellos podrán modificarse las condiciones de trabajo, en los términos y con los alcances que definen las citadas normas, si no mediare resolución judicial previa que los excluya de la garantía, conforme al procedimiento establecido en el artículo 47. El juez o tribunal interviniente, a pedido el empleador, dentro del plazo de cinco (5) días podrá disponer la suspensión de la prestación laboral con el carácter de medida cautelar, cuando la permanencia del cuestionado en su puesto o en mantenimiento de las condiciones de trabajo pudiere ocasionar peligro potencial para la seguridad de las personas o bienes de la empresa o el funcionamiento normal de esta.","Esta tutela regirá solamente para los delegados o representantes gremiales legalmente electos y que ocupen los cargos de titulares y para hasta dos (2) congresales titulares en grandes empresas y un (1) congresal titular en las pymes en los términos de la ley 24.467 y sus modificatorias. En este último caso la tutela solo podrá ser invocada exclusivamente durante el tiempo en que el trabajador asista al congreso en cuestión, debiendo notificar al empleador la fecha de inicio y conclusión del mismo. A aquellos que sean designados suplentes no les será aplicable la tutela sindical prevista en la presente ley. La violación por parte del empleador de las garantías establecidas en los artículos citados en el párrafo anterior, dará derecho al afectado a demandar judicialmente, por vía sumarísima, la reinstalación en su puesto, con más los salarios caídos durante la tramitación judicial, o el restablecimiento de las condiciones de trabajo.","Si se decidiere la reinstalación del trabajador, el juez podrá aplicar al empleador que no cumpliere con la decisión firme, las disposiciones del artículo 804 del Código Civil y Comercial de la Nación, durante el período de vigencia de su tutela sindical. El trabajador con cargo de delegado de personal o titular en la organización sindical con personería gremial representativa en el ámbito personal y territorial, salvo que se trate de un candidato no electo, podrá optar por considerar extinguido el vínculo laboral en virtud de la decisión del empleador, colocándose en situación de despido indirecto, en cuyo caso tendrá derecho a percibir, además de indemnizaciones por despido, una suma equivalente al importe de las remuneraciones que le hubieren correspondido durante el tiempo faltante del mandato y el año de estabilidad posterior. Si el trabajador fuese un candidato no electo tendrá derecho a percibir, además de las indemnizaciones y de las remuneraciones imputables al período de tutela aún no agotado, el importe de un (1) año más de remuneraciones, no siendo las mismas acumulables a las dispuestas en el artículo 245 bis de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificatorias. La promoción de las acciones por reinstalación o por restablecimiento de las condiciones de trabajo a las que refieren los párrafos anteriores interrumpe la prescripción de las acciones por cobro de indemnización y salarios caídos allí previstas.","El curso de la prescripción comenzará una vez que recayere pronunciamiento firme en cualquiera de los supuestos.","En cualquier caso, el empleador podrá liberar de prestar servicios al trabajador amparado por las garantías previstas en los artículos 40, 48 o 50 de la ley, en cuyo caso deberá comunicarlo, dentro de las cuarenta y ocho (48) horas hábiles, al Ministerio de Capital Humano y mantener el cumplimiento de la totalidad de los deberes que la ley o convenciones colectivas ponen a su cargo como consecuencia de la relación laboral. En este supuesto, dentro del plazo de caducidad de diez (10) días de ocurridos los hechos en que funda su decisión, deberá promover ante el juez competente acción declarativa para que se compruebe la concurrencia de los motivos fundados que autoriza el artículo 78 de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificatorias o, en su caso, requerir la exclusión de la garantía con el alcance que justifique la causa que invoque."]},{"n":145,"nt":[],"h":"Incorpórase como artículo 53 bis a la ley N° 23.551 y sus modificaciones, el siguiente texto:","ac":"Incorpora","tg":"Asociaciones sindicales","rf":"art. 53","t":"Incorpora art. 53 · Asociaciones sindicales","s":"Serán consideradas prácticas desleales y contrarias a la ética de las relaciones profesionales del trabajo por parte de las asociaciones sindicales, o en su caso, de quienes las representen:","p":["Artículo 53 bis: Serán consideradas prácticas desleales y contrarias a la ética de las relaciones profesionales del trabajo por parte de las asociaciones sindicales, o en su caso, de quienes las representen:","a) Incurrir en alguna de las acciones previstas en el artículo 20 ter de la presente ley;","b) Intervenir o interferir intencionalmente afectando el desenvolvimiento de la actividad de la empresa mediante la convocatoria a asambleas violando los términos del artículo 20 bis de la presente ley, u otras medidas de acción directa;","c) Promover la afiliación compulsiva e involuntaria de trabajadores, en forma directa o indirecta;","d) Incurrir en conductas y/o mecanismos extorsivos a los fines de lograr la afiliación compulsiva y/o involuntaria de trabajadores;","e) Incurrir en conductas y/o mecanismos extorsivos en contra de los empleadores;","f) Adoptar represalias contra los trabajadores que no se adhieran a una medida de fuerza;","g) Rehusarse a negociar colectivamente con los representantes de la parte empleadora legitimados para hacerlo o provocar dilaciones que tiendan a obstruir el proceso de negociación;","h) No acatar la conciliación obligatoria dispuesta por la autoridad con facultades suficientes."]},{"n":146,"nt":[],"h":"Sustitúyese el artículo 54 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 54","t":"Sustituye art. 54 · Asociaciones sindicales","s":"Todo damnificado por una acción y/u omisión que la presente ley define como práctica desleal podrá promover una querella ante el juez o tribunal competente.","p":["Artículo 54: Todo damnificado por una acción y/u omisión que la presente ley define como práctica desleal podrá promover una querella ante el juez o tribunal competente."]},{"n":147,"nt":[],"h":"Sustitúyese el artículo 55 de la ley N° 23.551 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 55","t":"Sustituye art. 55 · Asociaciones sindicales","s":"Las prácticas desleales se sancionarán con multas que serán fijadas de acuerdo con el Régimen General de Sanciones por Infracciones Laborales previsto en el Anexo II de la ley 25.212 y sus modificatorias de…","p":["Artículo 55: Las prácticas desleales se sancionarán con multas que serán fijadas de acuerdo con el Régimen General de Sanciones por Infracciones Laborales previsto en el Anexo II de la ley 25.212 y sus modificatorias de infracciones a las leyes de trabajo, salvo las modificaciones que aquí se establecen.","En el supuesto de prácticas desleales múltiples, o de reincidencia, la multa podrá elevarse hasta el quíntuplo del máximo previsto en la ley 25.212 y sus modificatorias.","La multa será fijada por el juez hasta un máximo del equivalente al veinte por ciento (20%) de los ingresos provenientes de las cuotas sindicales que deban pagar los afiliados en el mes en que se cometió la infracción.","Los importes de las multas serán actualizados a la fecha del efectivo pago, de acuerdo a las pautas de ajuste que correspondan a los créditos laborales. Cuando la práctica desleal pudiera ser reparada mediante el cese de la medida que la hubiere producido o la realización de los actos que resulten idóneos, conforme a la decisión calificadora, y el infractor mantuviera las medidas o dejare de cumplir los actos tendientes a la cesación de sus efectos, el importe originario se incrementará automáticamente en un diez por ciento (10%) por cada cinco (5) días de mora, mientras se mantenga el incumplimiento.","Sin perjuicio de ello, el juez, a petición de parte, podrá también aplicar lo dispuesto por el artículo 804 del Código Civil y Comercial de la Nación, quedando los importes que así se establezcan en favor del damnificado.","El importe de las multas será percibido por la autoridad administrativa del trabajo, e ingresado en una cuenta especial, y será destinado al mejoramiento de los servicios de inspección del trabajo, a cuyo fin la autoridad administrativa tomará intervención en el expediente judicial, previa citación del juez.","Cuando la práctica desleal fuese reparada mediante el cese de los actos motivantes, dentro del plazo que al efecto establezca la decisión judicial, el importe de la sanción podrá reducirse hasta el cincuenta por ciento (50%).","En aquellos casos en los que la asociación sindical o el empleado incurra reiteradamente en las conductas estipuladas en el artículo 53 bis del presente cuerpo normativo, la Justicia Nacional del Trabajo podrá revocarle la personería y/o la inscripción gremial."]},{"n":148,"nt":[],"h":"Sustitúyese el artículo 59 de la ley N° 23.551, por el siguiente:","ac":"Sustituye","tg":"Asociaciones sindicales","rf":"art. 59","t":"Sustituye art. 59 · Asociaciones sindicales","s":"Para someter las cuestiones de encuadramiento sindical a la autoridad administrativa, las asociaciones interesadas deberán agotar previamente la vía asociacional, mediante el pronunciamiento de la organización…","p":["Artículo 59: Para someter las cuestiones de encuadramiento sindical a la autoridad administrativa, las asociaciones interesadas deberán agotar previamente la vía asociacional, mediante el pronunciamiento de la organización gremial de grado superior a la que se encuentren adheridas, o a la que estén adheridas las federaciones que integren.","Si el diferendo no hubiera sido resuelto dentro de los sesenta (60) días hábiles, cualquiera de las asociaciones sindicales en conflicto, podrá someter la cuestión a conocimiento y resolución de la autoridad administrativa, que deberá pronunciarse dentro de los veinte (20) días hábiles, rigiendo en caso de silencio lo dispuesto en el artículo 10 de la ley 19.549 y su reglamentación. Agotado el procedimiento administrativo, quedará expedita la acción judicial prevista en el artículo 62, inciso e) de la presente ley.","La resolución de encuadramiento emanada de la autoridad administrativa del trabajo o de la vía asociacional, será directamente recurrible ante la Cámara Nacional de Apelaciones del Trabajo. La resolución que ponga fin al conflicto de encuadramiento sindical sólo tendrá por efecto determinar la aptitud representativa de la asociación gremial respectiva con relación al ámbito en conflicto.","El derecho de encuadramiento sindical no implica afectación de los procesos productivos y/o de servicios que se brindan por el colectivo en conflicto en el ámbito territorial y/o personal, por cuanto, será sancionable por la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano toda conducta gremial que afecte a terceros -empleador, trabajadores, clientes, proveedores, consumidores- para cual, deberá adoptar todas las medidas conducentes para evitar situaciones de abuso de derechos."]},{"n":149,"nt":[],"h":"Sustitúyese el artículo 4º de la ley N° 23.546 (t.o. 2004), por el siguiente:","ac":"Sustituye","tg":"Procedimiento CCT","rf":"art. 4","t":"Sustituye art. 4 · Procedimiento CCT","s":"En el plazo de quince (15) días a contar desde la recepción de la notificación del artículo 2º de esta ley, se constituirá la comisión negociadora con representantes de los trabajadores de acuerdo al nivel de…","p":["Artículo 4º: En el plazo de quince (15) días a contar desde la recepción de la notificación del artículo 2º de esta ley, se constituirá la comisión negociadora con representantes de los trabajadores de acuerdo al nivel de negociación que se proponga.","Si se trata de una negociación por empresa o por región, la representación sindical será la del o de los sindicatos de primer grado o de empresa con personería gremial en el ámbito territorial y personal que se pretenda negociar. Esta disposición es de orden público por cuanto toda disposición establecida por estatuto de la Organización Sindical de Segundo o Primer Grado que se oponga a la misma, no será válida.","En el supuesto de una negociación por actividad, la representación será de la Federación u Organización Gremial de Primer Grado con alcance nacional de acuerdo a la personería gremial otorgada.","En cualquiera de los casos, la representación sindical deberá integrarse respetando lo establecido en la ley 25.674.","La representación de los empleadores -cualquiera sea su nivel- se acreditará conforme lo disponga la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano en cada caso. Las partes podrán concurrir a las negociaciones con asesores técnicos con voz pero sin voto.","a) Las partes están obligadas a negociar de buena fe. Ello implica:","I. Concurrir a las reuniones acordadas o fijadas por la Autoridad de Aplicación.","II. Designar negociadores con mandato suficiente.","III. Intercambiar la información necesaria a los fines del examen de las cuestiones en debate, para entablar una discusión fundada y obtener un acuerdo. Dicho intercambio deberá obligatoriamente incluir la información relativa a la distribución de los beneficios de la productividad, la situación actual del empleo y las previsiones sobre su futura evolución.","IV. Realizar esfuerzos conducentes a lograr acuerdos.","b) En la negociación colectiva entablada al nivel de la empresa el intercambio de información alcanzará, además, a las informaciones relativas a los siguientes temas:","I. Situación económica de la empresa, del sector y del entorno en el que aquella se desenvuelve.","II. Costo laboral unitario.","III. Causales e indicadores de ausentismo.","IV. Innovaciones tecnológicas y organizacionales previstas.","V. Organización, duración y distribución del tiempo de trabajo.","VI. Siniestralidad laboral y medidas de prevención.","VII. Planes y acciones en materia de formación profesional.","c) La obligación de negociar de buena fe en los procedimientos preventivos de crisis y respecto de las empresas concursadas, impone al empleador el deber de informar a los trabajadores a través de la representación sindical sobre las causas y circunstancias que motivaron la iniciación del procedimiento de crisis o la presentación en concurso.","En el caso del procedimiento de crisis, la empresa deberá informar sobre las siguientes materias:","I. Mantenimiento del empleo.","II. Movilidad funcional, horaria o salarial.","III. Innovación tecnológica y cambio organizacional.","IV. Recalificación y formación profesional de los trabajadores.","V. Reubicación interna o externa de trabajadores y programas de reinserción laboral.","VI. Aportes convenidos al Sistema Integrado de Jubilaciones y Pensiones.","VII. Programas de apoyo a la generación de microemprendimientos para los trabajadores afectados.","En el supuesto de empresas concursadas, se deberá informar especialmente sobre las siguientes materias: I. Causas de la crisis y sus repercusiones sobre el empleo.","II. Situación económico financiera de la empresa y del entorno en que se desenvuelve.","III. Propuesta de acuerdo con los acreedores.","IV. Rehabilitación de la actividad productiva.","V. Situación de los créditos laborales.","d) Quienes reciban información calificada de confidencial por la empresa, como consecuencia del cumplimiento por parte de ésta de los deberes de información, están obligados a guardar secreto acerca de la misma.","e) Cuando alguna de las representaciones, se rehusare injustificadamente a negociar colectivamente vulnerando el principio de buena fe, en los términos del inciso a), la parte afectada por el incumplimiento podrá solicitar a la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano que adopte las medidas conducentes para la concreción de la mesa de negociación pudiendo entre otras facultades delimitar el alcance de la prórroga en la vigencia de las cláusulas obligacionales del Convenio Colectivo de Trabajo que se intenta renegociar si a ese momento aún se encontrasen vigentes, como también la de promover una acción judicial ante el tribunal laboral competente, mediante el proceso sumarísimo establecido en el artículo 498 del Código Procesal Civil y Comercial de la Nación, o equivalente de los Códigos Procesales Civiles provinciales.","El tribunal dispondrá el cese inmediato del comportamiento violatorio del deber de negociar de buena fe y sancionará a la parte incumplidora con una multa de hasta un máximo equivalente al veinte por ciento (20%) del total de la masa salarial del mes en que se produzca el hecho, correspondiente a los trabajadores comprendidos en el ámbito personal de la negociación. Si la parte infractora mantuviera su actitud, el importe de la sanción se incrementará en un diez por ciento (10%) por cada cinco (5) días de mora en acatar la decisión judicial. En el supuesto de reincidencia el máximo previsto en el presente inciso podrá elevarse hasta el equivalente al cien por ciento (100%) de esos montos.","Sin perjuicio de ello, el juez, a petición de parte, podrá también aplicar lo dispuesto por el artículo 804 del Código Civil y Comercial de la Nación. Cuando cesaren los actos que dieron origen a la acción entablada, dentro del plazo de diez (10) días que al efecto debe establecer la decisión judicial, el monto de la sanción podrá ser eliminada por el juez.","Todos los importes que así se devenguen tendrán como exclusivo destino programas de inspección de la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano."]},{"n":150,"nt":[],"h":"Sustitúyese el artículo 6º de la ley N° 23.546 (t.o. 2004), por el siguiente:","ac":"Sustituye","tg":"Procedimiento CCT","rf":"art. 6","t":"Sustituye art. 6 · Procedimiento CCT","s":"Las convenciones colectivas de trabajo son homologadas y/o registradas por la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano, en su carácter de Autoridad de Aplicación.","p":["Artículo 6º: Las convenciones colectivas de trabajo son homologadas y/o registradas por la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano, en su carácter de Autoridad de Aplicación.","La homologación o registración deberá producirse dentro de un plazo no mayor de treinta (30) días de recibida la solicitud, siempre que la convención reúna todos los requisitos establecidos a tal efecto. Transcurrido dicho plazo, sin que existan observaciones a cumplir por las partes, se la considerará tácitamente homologada."]},{"n":151,"nt":[],"h":"Sustitúyese el artículo 7º de la ley N° 23.546 (t.o. 2004), por el siguiente:","ac":"Sustituye","tg":"Procedimiento CCT","rf":"art. 7","t":"Sustituye art. 7 · Procedimiento CCT","s":"En los diferendos que se susciten en el curso de las negociaciones se aplicará la ley 14.786.","p":["Artículo 7º: En los diferendos que se susciten en el curso de las negociaciones se aplicará la ley 14.786.","Sin perjuicio de ello las partes podrán, de común acuerdo, someterse a la intervención de un servicio de mediación, conciliación y arbitraje que funcionará en el ámbito de la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano.","La reglamentación determinará sus funciones así como su organización y normas de procedimiento, preservando su autonomía."]},{"n":152,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Créase el Programa de Formación Laboral Básica para garantizar el desarrollo de las…","s":"Créase el Programa de Formación Laboral Básica para garantizar el desarrollo de las competencias mínimas necesarias para la incorporación al mundo laboral de las personas que por diversas situaciones no hubieran…","p":["Créase el Programa de Formación Laboral Básica para garantizar el desarrollo de las competencias mínimas necesarias para la incorporación al mundo laboral de las personas que por diversas situaciones no hubieran podido adquirirlas. El programa tendrá dos (2) ejes:","1. Programa de Competencias Sociolaborales Básicas. Su objetivo es el desarrollo, en especial de las personas sin terminalidad educativa, de las competencias de lectura y comprensión de textos, la expresión oral, el razonamiento matemático, la alfabetización digital y el conocimiento del marco normativo de los valores que rigen nuestro ordenamiento social según la Constitución Nacional.","2. Programa de Formación Laboral Inicial. Su objetivo es el desarrollo de las competencias iniciales en una de las ramas de la actividad productiva económica con prioridad regional y en la perspectiva de su demanda futura, que permita a las personas poder integrarse al trabajo real complementando eventualmente su formación con el Programa de Entrenamiento para el trabajo."]},{"n":153,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Desígnase a la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de…","s":"Desígnase a la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano como Autoridad de Aplicación para el desarrollo, activación y seguimiento de este Programa, así como para definir el…","p":["Desígnase a la Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano como Autoridad de Aplicación para el desarrollo, activación y seguimiento de este Programa, así como para definir el mecanismo de certificación de las competencias de sus trabajadores."]},{"n":154,"nt":[],"h":"Incorpórase como artículo 4° bis de la Ley Complementaria de la Ley sobre Riesgos del Trabajo N° 27.348, el siguiente texto:","ac":"Incorpora","tg":"Ley 27.348","rf":"art. 4 bis","t":"Incorpora art. 4 bis · Ley 27.348","s":"Artículo 4° bis:","p":["Artículo 4° bis: Se entiende que aquellas jurisdicciones que han adherido al contenido normativo están obligadas al cumplimiento íntegro de las condiciones allí establecidas, entre ellas, la estricta aplicación de la Tabla de Evaluación de Incapacidades Laborales, aprobada por el Decreto 659/96 y sus modificatorios.","En tal orden, se aclara que corresponderá:","a) En los casos en que no existan peritos médicos judiciales en las condiciones establecidas en el artículo 2° de la presente ley, cada jurisdicción deberá constituir, dotar y garantizar el adecuado funcionamiento de Cuerpos Médicos Forenses u organismos o entidades equivalentes;","b) Estos deberán contar con la capacidad operativa y la especialización necesaria para atender las controversias judiciales suscitadas en el marco del Sistema de Riesgos del Trabajo, asegurando la objetividad e independencia en sus dictámenes;","c) El plazo máximo para su completa implementación será de noventa (90) días, contados desde la entrada en vigencia de la ley por la que se incorpora el presente artículo para las jurisdicciones ya adheridas, o desde la fecha de su respectiva ley de adhesión para las que lo hagan con posterioridad;","d) En el mismo plazo establecido en el inciso precedente, las jurisdicciones adheridas deberán implementar los entornos digitales que la Superintendencia de Riesgos del Trabajo ponga a su disposición, los cuales asistirán a médicos y peritos en el cálculo de las incapacidades laborales;","e) Para la ejecución de esta modalidad, se suscribirán los convenios pertinentes que establecerán los protocolos y requisitos técnicos necesarios, garantizando la confidencialidad y seguridad de la información médica.","El incumplimiento de las obligaciones establecidas en los artículos 2°, 4°, segundo párrafo y en el presente por parte de las jurisdicciones, transcurridos los plazos previstos facultará a la Superintendencia de Riesgos del Trabajo a suspender la asistencia técnica y/o el financiamiento específico, o a determinar la restricción o el cese de cualquier otra forma de apoyo que, en el marco de sus competencias, destine a dicha jurisdicción en materia de riesgos del trabajo. Dicha medida podrá mantenerse hasta tanto la jurisdicción acredite el pleno cumplimiento de lo aquí dispuesto."]},{"n":155,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"En el marco del proceso de modernización, simplificación y unificación de los…","s":"En el marco del proceso de modernización, simplificación y unificación de los regímenes administrativos establecidos por la presente ley, y a fin de asegurar coherencia normativa entre las distintas obligaciones de…","p":["En el marco del proceso de modernización, simplificación y unificación de los regímenes administrativos establecidos por la presente ley, y a fin de asegurar coherencia normativa entre las distintas obligaciones de registración laboral, dispónese que los empleadores deberán registrar a sus trabajadores ante la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado en la órbita del Ministerio de Economía, conforme la normativa que dicho organismo dicte, teniéndose dicha registración como plena y suficiente a todos los efectos legales. El Instituto de Estadística y Registro de la Industria de la Construcción deberá adecuar sus sistemas y normativa interna a lo dispuesto en esta ley, reconociendo como válidos y suficientes los requisitos de registración establecidos por la Agencia de Recaudación y Control Aduanero (ARCA), quedando prohibido que dicho Instituto —o cualquier otra autoridad— requiera, intime o condicione a empleadores o trabajadores al cumplimiento de requisitos de registración adicionales o distintos de los establecidos por la autoridad nacional competente.","Acreditada la registración ante la Agencia de Recaudación y Control Aduanero (ARCA), se tendrán por cumplidos todos los requisitos exigidos a los empleadores en materia de registro del trabajador."]},{"n":156,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Créase el Régimen de Incentivo a la Formalización Laboral (RIFL), con una vigencia…","s":"Créase el Régimen de Incentivo a la Formalización Laboral (RIFL), con una vigencia de un (1) año contado desde el primer día del segundo mes inmediato siguiente al de la entrada en vigencia de la presente ley,…","p":["Créase el Régimen de Incentivo a la Formalización Laboral (RIFL), con una vigencia de un (1) año contado desde el primer día del segundo mes inmediato siguiente al de la entrada en vigencia de la presente ley, destinado a todos aquellos empleadores a quienes les resulten de aplicación las disposiciones del Capítulo 3 del Título IV de la Ley de Solidaridad Social y Reactivación Productiva en el Marco de la Emergencia Pública N° 27.541 y sus modificatorias, de la Ley de Contrato de Trabajo N° 20.744 (t.o. 1976) y sus modificatorias, de la ley N° 22.250 y su modificatoria y de la Ley del Régimen de Trabajo Agrario N° 26.727 y sus modificatorias, y en tanto se cumplimenten los requisitos establecidos en el presente Título."]},{"n":157,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Los empleadores comprendidos en el presente régimen gozarán de los beneficios…","s":"Los empleadores comprendidos en el presente régimen gozarán de los beneficios previstos en este Título, por cada nueva incorporación de trabajadores, en tanto cada trabajador incorporado:","p":["Los empleadores comprendidos en el presente régimen gozarán de los beneficios previstos en este Título, por cada nueva incorporación de trabajadores, en tanto cada trabajador incorporado:","a) No haya contado con una relación laboral registrada al 10 de diciembre de 2025; o b) Previo al mes de alta laboral, hubiera estado desempleado en los últimos seis (6) meses; o c) Hubiera estado inscripto en el Régimen Simplificado para Pequeños Contribuyentes; o d) Su último empleo haya sido bajo relación de dependencia en el sector público nacional, provincial, municipal o de la Ciudad Autónoma de Buenos Aires."]},{"n":158,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Aquellos que adquieran el carácter de empleador a partir del 10 de diciembre de…","s":"Aquellos que adquieran el carácter de empleador a partir del 10 de diciembre de 2025, inclusive, podrán aplicar las condiciones del presente régimen, hasta el máximo de trabajadores que determine la reglamentación,…","p":["Aquellos que adquieran el carácter de empleador a partir del 10 de diciembre de 2025, inclusive, podrán aplicar las condiciones del presente régimen, hasta el máximo de trabajadores que determine la reglamentación, el que no podrá ser superior al ochenta por ciento (80%) de la nómina de trabajadores."]},{"n":159,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Por las nuevas relaciones laborales dadas de alta en el marco del presente régimen,…","s":"Por las nuevas relaciones laborales dadas de alta en el marco del presente régimen, el empleador deberá ingresar las alícuotas previstas para el régimen general de contribuciones patronales, tomando en cuenta las…","p":["Por las nuevas relaciones laborales dadas de alta en el marco del presente régimen, el empleador deberá ingresar las alícuotas previstas para el régimen general de contribuciones patronales, tomando en cuenta las siguientes adecuaciones para los subsistemas que se mencionan seguidamente, independientemente de que el empleador encuadre en el inciso a) o b) del artículo 19 de la Ley de Solidaridad Social y Reactivación Productiva en el Marco de la Emergencia Pública N° 27.541 y sus modificatorias:","a) Una alícuota del dos por ciento (2%) total en concepto de contribuciones patronales con destino al Sistema Integrado Previsional Argentino (SIPA), al Fondo Nacional de Empleo y al Régimen de Asignaciones Familiares, correspondientes a los primeros cuarenta y ocho (48) meses contados a partir del mes de inicio de la nueva relación laboral, inclusive;","b) Una alícuota del tres por ciento (3%) con destino al Subsistema de Seguridad Social regido por la ley 19.032 (INSSJP), correspondiente a los primeros cuarenta y ocho (48) meses contados a partir del mes de inicio de la nueva relación laboral, inclusive.","Quedan excluidas del tratamiento previsto en la presente norma las alícuotas adicionales previstas en regímenes previsionales diferenciales y/o especiales de la seguridad social."]},{"n":160,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"El empleador no podrá hacer uso del beneficio previsto en este Título, con relación…","s":"El empleador no podrá hacer uso del beneficio previsto en este Título, con relación a los trabajadores que hayan sido declarados en el Régimen General de la Seguridad Social y luego de producido el distracto…","p":["El empleador no podrá hacer uso del beneficio previsto en este Título, con relación a los trabajadores que hayan sido declarados en el Régimen General de la Seguridad Social y luego de producido el distracto laboral, cualquiera fuese su causa, sean reincorporados por el mismo empleador dentro de los doce (12) meses, contados a partir de la fecha de la desvinculación.","Quedan excluidos del beneficio dispuesto en este Título los empleadores que:","a) Figuren en el Registro Público de Empleadores con Sanciones Laborales (REPSAL), creado por la Ley de Promoción del Trabajo Registrado y Prevención del Fraude Laboral N° 26.940 y sus modificaciones, por el tiempo que permanezcan en ese registro; y/o b) Incurran en prácticas de uso abusivo del beneficio establecido por el presente Título. Se entiende por prácticas de uso abusivo el hecho de producir sustituciones de personal bajo cualquier figura o el cese como empleador y la constitución de una nueva figura como tal, ya sea a través de las mismas o distintas personas humanas o jurídicas, así como también cualquier otro supuesto que establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía.","La exclusión se producirá en forma automática desde el momento en que ocurra cualquiera de las causales indicadas en los incisos a) y b) de este artículo."]},{"n":161,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"El incumplimiento de las obligaciones previstas en este Título o el acaecimiento de…","s":"El incumplimiento de las obligaciones previstas en este Título o el acaecimiento de las situaciones indicadas en el artículo anterior, producirá el decaimiento de los beneficios, debiendo el empleador, por las…","p":["El incumplimiento de las obligaciones previstas en este Título o el acaecimiento de las situaciones indicadas en el artículo anterior, producirá el decaimiento de los beneficios, debiendo el empleador, por las alícuotas diferenciales de contribuciones patronales del artículo 159, ingresar las contribuciones con destino a la seguridad social no abonadas por haberse acogido al régimen, más los intereses y sanciones que pudieran corresponder, en los términos y condiciones que, a esos efectos, establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía."]},{"n":162,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"El beneficio establecido en este Título es optativo para el empleador, por lo que la…","s":"El beneficio establecido en este Título es optativo para el empleador, por lo que la falta de ejercicio de dicha opción, a partir del inicio de la nueva relación laboral, obstará a que pueda hacer uso retroactivo…","p":["El beneficio establecido en este Título es optativo para el empleador, por lo que la falta de ejercicio de dicha opción, a partir del inicio de la nueva relación laboral, obstará a que pueda hacer uso retroactivo del beneficio por el o los períodos en que no lo hubiese gozado."]},{"n":163,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"El tratamiento especial establecido en este Título operará de forma automática al…","s":"El tratamiento especial establecido en este Título operará de forma automática al momento de darse de alta la nueva relación laboral, en los términos y condiciones que a esos efectos establezca la Agencia de…","p":["El tratamiento especial establecido en este Título operará de forma automática al momento de darse de alta la nueva relación laboral, en los términos y condiciones que a esos efectos establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía."]},{"n":164,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Las personas que sean contratadas a partir de la entrada en vigencia de la presente…","s":"Las personas que sean contratadas a partir de la entrada en vigencia de la presente ley, y se encuentren gozando de planes y/o programas de empleo y/o de asistencia social -contributivas y no contributivas-…","p":["Las personas que sean contratadas a partir de la entrada en vigencia de la presente ley, y se encuentren gozando de planes y/o programas de empleo y/o de asistencia social -contributivas y no contributivas- instrumentados por el Ministerio de Capital Humano, continuarán percibiendo dichas prestaciones, en la medida que cumplan con los requisitos aplicables a los mismos, por el plazo máximo de hasta un (1) año desde la registración de la relación laboral, en carácter de subsidio a su nueva ocupación y formalidad laboral."]},{"n":165,"nt":[],"h":"Sustitúyese, con efecto para las contribuciones que se devenguen a partir del 1º de enero de 2027, el inciso a) del artículo 16 de la ley 23.660 y sus modificaciones, por el siguiente:","ac":"Sustituye","tg":"Ley 23.660","rf":"art. 16","t":"Sustituye art. 16 · Ley 23.660","s":"a) Una contribución a cargo del empleador equivalente al seis por ciento (6%) de la remuneración de los trabajadores que presten servicios en relación de dependencia.","p":["a) Una contribución a cargo del empleador equivalente al seis por ciento (6%) de la remuneración de los trabajadores que presten servicios en relación de dependencia.","La Superintendencia de Servicios de Salud (SSS) estará facultada para auditar el destino de las contribuciones referenciadas en el párrafo precedente."]},{"n":166,"nt":[],"h":"","ac":"Deroga","tg":"Ley 11.672","rf":"art. 74","t":"Deroga art. 74 · Ley 11.672","s":"Derógase, con efecto para las contribuciones que se devenguen a partir del primero de enero de 2027, el primer párrafo del artículo 74 de la ley N° 11.672 Complementaria Permanente de Presupuesto (t.o.","p":["Derógase, con efecto para las contribuciones que se devenguen a partir del primero de enero de 2027, el primer párrafo del artículo 74 de la ley N° 11.672 Complementaria Permanente de Presupuesto (t.o. 2014) y sus modificaciones, correspondiente al artículo 80 de la ley N° 25.565 y sus modificaciones."]},{"n":167,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Hasta tanto entre en vigencia el Fondo de Asistencia Laboral (FAL), el empleador…","s":"Hasta tanto entre en vigencia el Fondo de Asistencia Laboral (FAL), el empleador obligado a su ingreso deberá abonar las alícuotas establecidas en el régimen de contribuciones patronales, sin la reducción prevista…","p":["Hasta tanto entre en vigencia el Fondo de Asistencia Laboral (FAL), el empleador obligado a su ingreso deberá abonar las alícuotas establecidas en el régimen de contribuciones patronales, sin la reducción prevista en el primer párrafo del artículo 76 de esta ley. Tampoco aplicará la mencionada reducción si el empleador es exceptuado de efectuar el pago de la contribución al Fondo de Asistencia Laboral (FAL)."]},{"n":168,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Los empleadores podrán regularizar las relaciones laborales vigentes del sector…","s":"Los empleadores podrán regularizar las relaciones laborales vigentes del sector privado iniciadas hasta la fecha de promulgación de la presente ley.","p":["Los empleadores podrán regularizar las relaciones laborales vigentes del sector privado iniciadas hasta la fecha de promulgación de la presente ley. La regularización podrá comprender relaciones laborales no registradas o aquellas deficientemente registradas conforme los parámetros que establezca la reglamentación."]},{"n":169,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"El Poder Ejecutivo nacional reglamentará los efectos que producirá la regularización…","s":"El Poder Ejecutivo nacional reglamentará los efectos que producirá la regularización de las relaciones laborales indicadas en el artículo precedente.","p":["El Poder Ejecutivo nacional reglamentará los efectos que producirá la regularización de las relaciones laborales indicadas en el artículo precedente. Esos efectos podrán comprender:","a) La extinción de la acción penal prevista por el artículo 16 del Régimen Penal Tributario, establecido por el Título IX de la ley 27.430 y la condonación de las infracciones, multas y sanciones de cualquier naturaleza correspondientes a dicha regularización, previstas en las leyes 11.683, texto ordenado en 1998 y sus modificaciones, 17.250 y sus modificatorias, 22.161, el artículo 32 de la ley 24.557 y sus modificaciones, delitos relativos a los recursos de la seguridad social de la ley 24.769 y sus modificatorias, la ley 25.212 y sus modificatorias, firmes o no, siempre que se encuentren impagas o incumplidas hasta el último día, inclusive, del mes en que se presente la solicitud de regularización;","b) Baja del Registro de Empleadores con Sanciones Laborales (REPSAL), creado por la ley 26.940 y sus modificaciones, respecto de infracciones cometidas o constatadas hasta la entrada en vigencia de la presente ley, siempre y cuando regularicen a la totalidad de los trabajadores por los que se encuentra publicado en el Registro de Empleadores con Sanciones Laborales (REPSAL) y paguen, de corresponder, la multa;","c) Condonación de la deuda por capital e intereses cuando aquella tenga origen en la falta de pago de aportes y contribuciones con destino a los subsistemas de la seguridad social, devengadas hasta el último día, inclusive, del mes en que se presente la solicitud de regularización, que se detallan a continuación:","(i) Sistema Integrado Previsional Argentino, Ley 24.241 y sus modificaciones.","(ii) Instituto Nacional de Servicios Sociales para Jubilados y Pensionados, Ley 19.032 y sus modificaciones.","(iii) Régimen Nacional del Seguro de Salud, Ley 23.661 y sus modificaciones.","(iv) Fondo Nacional de Empleo, Ley 24.013 y sus modificaciones.","(v) Régimen Nacional de Asignaciones Familiares, Ley 24.714 y sus modificatorias.","(vi) Contribución con destino al Registro Nacional de la Industria de la Construcción, Ley 22.250 y sus modificatorias.","(vii) Otros regímenes laborales o de seguridad social que determine la reglamentación. La reglamentación determinará los porcentajes de condonación que habrán de aplicarse, los que en ningún caso serán inferiores al setenta por ciento (70%) del total de las sumas adeudadas. Se podrán establecer incentivos para la cancelación de la obligación de contado y beneficios especiales para las Micro, Pequeñas y Medianas Empresas."]},{"n":170,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Los trabajadores incluidos en la regularización prevista en el presente régimen…","s":"Los trabajadores incluidos en la regularización prevista en el presente régimen tendrán derecho a computar hasta sesenta (60) meses de servicios con aportes o la menor cantidad de meses por la que se los…","p":["Los trabajadores incluidos en la regularización prevista en el presente régimen tendrán derecho a computar hasta sesenta (60) meses de servicios con aportes o la menor cantidad de meses por la que se los regularice, calculados sobre un monto mensual equivalente al Salario Mínimo Vital y Móvil o, de existir, sobre la remuneración declarada, aun cuando fuere deficiente, si ésta resultare mayor, únicamente a fin de cumplir con los años de servicios requeridos por la ley 24.241 y sus modificaciones para la obtención de la Prestación Básica Universal, pensión por invalidez o por fallecimiento y para el beneficio de prestación por desempleo previsto en el artículo 113 de la ley 24.013 y sus modificatorias. Los meses regularizados no serán considerados a los fines de la determinación de la prestación compensatoria ni de la prestación adicional por permanencia."]},{"n":171,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"La regularización de las relaciones laborales deberá efectivizarse dentro de los…","s":"La regularización de las relaciones laborales deberá efectivizarse dentro de los ciento ochenta (180) días corridos, contados desde la fecha de entrada en vigencia de la reglamentación del presente Título de la ley.","p":["La regularización de las relaciones laborales deberá efectivizarse dentro de los ciento ochenta (180) días corridos, contados desde la fecha de entrada en vigencia de la reglamentación del presente Título de la ley."]},{"n":172,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"El goce de los efectos previstos en el artículo 169 resultará procedente en la…","s":"El goce de los efectos previstos en el artículo 169 resultará procedente en la medida en que el empleador cancele la deuda que no haya sido condonada, bajo las modalidades de pago al contado o mediante plan de…","p":["El goce de los efectos previstos en el artículo 169 resultará procedente en la medida en que el empleador cancele la deuda que no haya sido condonada, bajo las modalidades de pago al contado o mediante plan de facilidades de pago, en los términos y condiciones que establezca la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía.","A tales fines, la Agencia de Recaudación y Control Aduanero (ARCA) considerará los siguientes parámetros:","a. Cantidad máxima de cuotas para el plan de facilidades de pago: setenta y dos (72);","b. Tasa máxima de financiación de dicho plan de pagos: doce por ciento (12%) nominal anual;","c. Anticipo de hasta el cinco por ciento (5%) de la deuda regularizada; d. Posibilidad de asignar un descuento en la financiación por cancelación de contado de hasta el diez por ciento (10%) en la deuda consolidada; y e. Posibilidad de segmentar los parámetros precedentes privilegiando la antigüedad de la deuda, el tamaño de la empresa, la cantidad de empleados regularizados y el monto de la regularización."]},{"n":173,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Podrán incluirse en el presente régimen las deudas que se encuentren controvertidas…","s":"Podrán incluirse en el presente régimen las deudas que se encuentren controvertidas en sede administrativa, contencioso administrativa o judicial, a la fecha de publicación de la presente ley en el Boletín Oficial,…","p":["Podrán incluirse en el presente régimen las deudas que se encuentren controvertidas en sede administrativa, contencioso administrativa o judicial, a la fecha de publicación de la presente ley en el Boletín Oficial, en tanto el empleador se allane incondicionalmente y, en su caso, desista y renuncie a toda acción y derecho, incluso al de repetición, asumiendo el pago de las costas y gastos causídicos. El allanamiento o desistimiento podrá ser total o parcial y procederá en cualquier etapa o instancia administrativa, contencioso administrativa o judicial, según corresponda."]},{"n":174,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"No podrán adherir al presente régimen los sujetos que hubieran adherido al Régimen…","s":"No podrán adherir al presente régimen los sujetos que hubieran adherido al Régimen de Promoción del Empleo Registrado previsto en el Título IV de la Ley de Bases y Puntos de Partida para la Libertad de los…","p":["No podrán adherir al presente régimen los sujetos que hubieran adherido al Régimen de Promoción del Empleo Registrado previsto en el Título IV de la Ley de Bases y Puntos de Partida para la Libertad de los Argentinos N° 27.742, por los mismos empleados regularizados."]},{"n":175,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado…","s":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, y las instituciones de la Seguridad Social, con facultades propias o delegadas en la…","p":["La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, y las instituciones de la Seguridad Social, con facultades propias o delegadas en la materia, se abstendrán de formular, de oficio, determinaciones de deuda y de labrar actas de infracción por las mismas causas y períodos comprendidos en la regularización correspondiente a los Subsistemas de la Seguridad Social, así como de formular ajustes impositivos, todo ello con causa en las relaciones laborales regularizadas en el marco de este Título."]},{"n":176,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado…","s":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, reglamentará el presente régimen dentro de los quince (15) días corridos contados a…","p":["La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, reglamentará el presente régimen dentro de los quince (15) días corridos contados a partir de su entrada en vigencia y dictará las normas complementarias que resulten necesarias a los efectos de su aplicación.","La reglamentación que se dicte no podrá establecer ninguna restricción o limitación a los sujetos, de ningún tipo, por el hecho de adherir y acogerse al presente régimen."]},{"n":177,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Creación del RIMI","s":"Créase el Régimen de Incentivo para Medianas Inversiones (RIMI), aplicable en todo el territorio de la República Argentina.","p":["Creación del RIMI. Créase el Régimen de Incentivo para Medianas Inversiones (RIMI), aplicable en todo el territorio de la República Argentina."]},{"n":178,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Objetivos","s":"Los objetivos del Régimen de Incentivo para Medianas Inversiones son principalmente, los siguientes:","p":["Objetivos. Los objetivos del Régimen de Incentivo para Medianas Inversiones son principalmente, los siguientes:","a) Incentivar las Medianas Inversiones nacionales y extranjeras en la República Argentina, a fin de garantizar la prosperidad del país;","b) Promover el desarrollo económico y de las cadenas de valor;","c) Desarrollar y fortalecer la competitividad de los diversos sectores económicos;","d) Incrementar las exportaciones de mercaderías y servicios; y e) Favorecer la creación de empleo."]},{"n":179,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Sujetos alcanzados","s":"Podrán ser beneficiarios del Régimen de Incentivo para Medianas Inversiones los sujetos comprendidos en el artículo 53 de la Ley de Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones, que…","p":["Sujetos alcanzados. Podrán ser beneficiarios del Régimen de Incentivo para Medianas Inversiones los sujetos comprendidos en el artículo 53 de la Ley de Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones, que califiquen como Micro, Pequeñas o Medianas Empresas —hasta la categoría de Mediana Empresa Tramo 2 inclusive— en los términos del artículo 2° de la ley 24.467, sus modificatorias y reglamentarias, por las inversiones productivas que realicen en el país durante los dos (2) primeros años contados a partir de la fecha de entrada en vigencia del régimen, conforme lo establezca la reglamentación."]},{"n":180,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Inversiones Productivas","s":"Concepto.","p":["Inversiones Productivas. Concepto. A los fines del Régimen de Incentivo para Medianas Inversiones se consideran inversiones productivas a aquellas destinadas a la adquisición, elaboración, fabricación y/o importación de bienes muebles nuevos -excepto automóviles-, amortizables en el impuesto a las ganancias, así como a la realización de obras, a ser afectadas directamente al desarrollo de actividades productivas en el territorio de la República Argentina.","Están expresamente excluidos del presente régimen las inversiones en activos financieros, de portfolio y bienes de cambio.","Sin perjuicio de los compromisos relativos a los montos mínimos establecidos en el artículo siguiente, las inversiones productivas efectuadas en sistemas y/o equipos de riego, bienes de alta eficiencia energética, mallas antigranizo para el sector agropecuario y en bienes semovientes, serán susceptibles de promoción, independientemente del monto de la inversión involucrada, en cada caso."]},{"n":181,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Monto mínimo de la inversión","s":"A efectos de acceder a los beneficios previstos en el Régimen de Incentivo para Medianas Inversiones, el monto de las inversiones productivas efectuadas durante el período previsto en el artículo 179, debe ser…","p":["Monto mínimo de la inversión. A efectos de acceder a los beneficios previstos en el Régimen de Incentivo para Medianas Inversiones, el monto de las inversiones productivas efectuadas durante el período previsto en el artículo 179, debe ser igual o superior a las sumas que se detallan a continuación:","a. Para las Micro empresas, en los términos del artículo 2° de la ley 24.467 y sus modificatorias y reglamentarias, la suma de: dólares estadounidenses ciento cincuenta mil (USD 150.000);","b. Para las Pequeñas empresas, en los términos del artículo 2° de la ley 24.467 y sus modificatorias y reglamentarias, la suma de: dólares estadounidenses seiscientos mil (USD 600.000);","c. Para las Medianas empresas Tramo 1, en los términos del artículo 2° de la ley 24.467 y sus modificatorias y reglamentarias, la suma de: dólares estadounidenses tres millones quinientos mil (USD3.500.000);","d. Para las Medianas empresas Tramo 2, en los términos del artículo 2° de la ley 24.467 y sus modificatorias y reglamentarias, la suma de: dólares estadounidenses nueve millones (USD 9.000.000)."]},{"n":182,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Amortización acelerada en el Impuesto a las Ganancias","s":"Los beneficiarios del Régimen de Incentivo para Medianas Inversiones podrán optar por practicar las respectivas amortizaciones de sus inversiones productivas, a partir del período fiscal de afectación del bien, de…","p":["Amortización acelerada en el Impuesto a las Ganancias. Los beneficiarios del Régimen de Incentivo para Medianas Inversiones podrán optar por practicar las respectivas amortizaciones de sus inversiones productivas, a partir del período fiscal de afectación del bien, de acuerdo con las normas previstas en los artículos 78, 87 y 88, según corresponda, de la Ley de Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones, o conforme el régimen de amortización acelerada que se establece a continuación:","a) Para inversiones en bienes muebles amortizables -excepto los bienes mencionados en los incisos c), d) y e) del presente: en dos (2) cuotas anuales, iguales y consecutivas;","b) Para inversiones en obras: como mínimo en la cantidad de cuotas anuales, iguales y consecutivas que surja de considerar su vida útil reducida al sesenta por ciento (60%) de la estimada; c) En equipos de riego agrícola y/o equipos de alta eficiencia energética: en una (1) cuota;","d) En bienes semovientes amortizables: en una (1) cuota;","e) En mallas antigranizo: en una (1) cuota.","Ejercida la mencionada opción, deberá comunicarse a la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, y tendrá que aplicarse -sin excepción- a todas las inversiones productivas que se realizan en los términos del presente régimen.","Por las inversiones en bienes a los que se refiere el artículo 78 de la Ley del Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones, la cuota de amortización será, hasta agotarse íntegramente el costo impositivo del bien de que se trate, la que surge de multiplicar por un coeficiente de uno coma seis (1,6) al valor unitario de agotamiento calculado conforme al citado artículo 78. Cuando se trate de operaciones que den derecho a la opción prevista en el artículo 71 de la Ley del Impuesto a las Ganancias, texto ordenado en 2019 y sus modificaciones, la amortización especial establecida en este artículo deberá practicarse sobre el costo determinado de acuerdo con lo dispuesto en la norma legal del gravamen.","Si la enajenación y reemplazo se realizaran en ejercicios fiscales diferentes, la amortización eventualmente computada en exceso deberá reintegrarse en el balance impositivo correspondiente a dicha enajenación.","El referido tratamiento queda sujeto a la condición de que los bienes adquiridos en reemplazo permanezcan en el patrimonio del contribuyente, en los términos de lo establecido en el artículo 186 de la presente. De no cumplirse esta condición, corresponderá rectificar las declaraciones juradas presentadas e ingresar las diferencias de impuesto resultantes más sus intereses, salvo en el supuesto previsto en el párrafo siguiente.","No se producirá la caducidad del tratamiento señalado precedentemente en el caso de reemplazo de bienes que hayan gozado de la franquicia, en tanto el monto invertido en la reposición sea igual o mayor al obtenido por su venta. Cuando el importe de la nueva adquisición fuera menor al obtenido en la venta, la proporción de las amortizaciones computadas en virtud del importe reinvertido que no se encuentre alcanzada por el programa, tendrá el tratamiento indicado en el párrafo anterior. El Ministerio de Economía dictará la normativa complementaria necesaria para precisar el alcance y la nómina de bienes de capital y tipo de obra comprendidos en este beneficio."]},{"n":183,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Devolución de créditos fiscales en el Impuesto al Valor Agregado","s":"Los créditos fiscales a que se refiere el primer artículo sin número a continuación del artículo 24 de la Ley del Impuesto al Valor Agregado, generados por las inversiones productivas comprendidas en el artículo…","p":["Devolución de créditos fiscales en el Impuesto al Valor Agregado. Los créditos fiscales a que se refiere el primer artículo sin número a continuación del artículo 24 de la Ley del Impuesto al Valor Agregado, generados por las inversiones productivas comprendidas en el artículo 180 de la presente ley, podrán computarse a los efectos de su devolución prevista en este régimen, luego de transcurridos tres (3) períodos fiscales mensuales contados a partir de aquél en que haya resultado procedente su cómputo. Las previsiones del citado artículo se aplicarán en tanto no se opongan a lo establecido en el presente régimen."]},{"n":184,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Exclusiones","s":"No podrán acogerse al tratamiento dispuesto por este Título, quienes se hallen en alguno de los siguientes supuestos:","p":["Exclusiones. No podrán acogerse al tratamiento dispuesto por este Título, quienes se hallen en alguno de los siguientes supuestos:","a. Los condenados, con condena confirmada en segunda instancia, por cualquier tipo de delito en virtud de la ley 27.401, o cuyos socios o accionistas se encuentren en dicha situación;","b. Los declarados en estado de quiebra, en los términos de las leyes 19.551 y 24.522 y sus modificatorias, según corresponda;","c. Los condenados, con condena confirmada en segunda instancia, con fundamento en la ley 24.769 y sus modificatorias o del Régimen Penal Tributario del Título IX de la Ley 27.430 y sus modificaciones, o bajo el Título I, Sección XII del Código Aduanero (Ley 22.415 y sus modificaciones), o bajo el Régimen Penal Cambiario de la Ley 19.359 (texto ordenado 1995) y sus modificaciones, según corresponda;","d. Quienes registren deudas firmes, exigibles e impagas de carácter fiscal, aduanero o previsional;","e. Las personas jurídicas en las que sus socios, administradores, directores, representantes legales, síndicos, miembros del consejo de vigilancia o quienes ocupen cargos equivalentes, hayan sido condenados, con condena confirmada en segunda instancia, con fundamento en las leyes 23.771 y 24.769 y sus modificatorias o del Régimen Penal Tributario del Título IX de la Ley 27.430 y sus modificaciones, o bajo el Título I, Sección XII del Código Aduanero (Ley 22.415 y sus modificaciones), o bajo el Régimen Penal Cambiario de la Ley 19.359 (texto ordenado 1995) y sus modificaciones, según corresponda.","f. Las personas jurídicas que accedan a los beneficios previstos en el Título VII - Régimen de Incentivo para Grandes Inversiones (RIGI) de la Ley de Bases y Puntos de Partida para la Libertad de los Argentinos 27.742 y/o a cualquier otro régimen de incentivos, por las mismas inversiones productivas.","Facúltase a la Autoridad de Aplicación a ampliar o modificar la presente exclusión.","El acaecimiento de cualquiera de los supuestos mencionados en los incisos anteriores, producido con posterioridad a la adhesión de los interesados a los beneficios establecidos en el RIMI, será causal de caducidad total de los tratamientos fiscales diferenciales previstos en los artículos 182 y 183 del presente."]},{"n":185,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Momento de la inversión productiva","s":"A los efectos de lo establecido en este Régimen, las inversiones productivas se consideran realizadas en el ejercicio fiscal anual en el que se verifique su puesta en marcha y su afectación a la producción de…","p":["Momento de la inversión productiva. A los efectos de lo establecido en este Régimen, las inversiones productivas se consideran realizadas en el ejercicio fiscal anual en el que se verifique su puesta en marcha y su afectación a la producción de ganancias gravadas, de acuerdo con la Ley de Impuesto a las Ganancias texto ordenado en 2019 y sus modificaciones."]},{"n":186,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Caducidad de los beneficios","s":"Si los bienes que dieron origen al goce de los beneficios previstos en los artículos 182 y 183, dejaran de integrar el patrimonio del beneficiario dentro de los dos (2) años fiscales de que fueran afectados, se…","p":["Caducidad de los beneficios. Si los bienes que dieron origen al goce de los beneficios previstos en los artículos 182 y 183, dejaran de integrar el patrimonio del beneficiario dentro de los dos (2) años fiscales de que fueran afectados, se producirá la caducidad de los mismos, excepto cuando:","a) Se debiera al reemplazo de un bien por otro -siempre que el valor de este último fuera igual o mayor al precio de venta del bien reemplazado-;","b) Se produjera su destrucción por caso fortuito o fuerza mayor; o c) Hubiera transcurrido un tercio de la vida útil del bien que se trate, en los términos y condiciones que establezca la reglamentación.","La Autoridad de Aplicación podrá ampliar las causales de excepción."]},{"n":187,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"Sanciones","s":"Dispuesta la revocación de los beneficios acordados, mediante acto administrativo expreso, previa instrucción del respectivo sumario administrativo y salvaguardando el derecho de defensa del beneficiario, este…","p":["Sanciones. Dispuesta la revocación de los beneficios acordados, mediante acto administrativo expreso, previa instrucción del respectivo sumario administrativo y salvaguardando el derecho de defensa del beneficiario, este último deberá restituir al Fisco: los créditos fiscales devueltos y/o, en su caso, el Impuesto a las Ganancias ingresado en defecto, más los intereses resarcitorios correspondientes, quedando alcanzado además por una multa que no podrá exceder de dos (2) veces el monto de la franquicia usufructuada, la que será graduada por la Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía."]},{"n":188,"nt":[],"h":"","ac":"","tg":"","rf":"","t":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado…","s":"La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, dictará las normas complementarias, aclaratorias y operativas necesarias para la…","p":["La Agencia de Recaudación y Control Aduanero (ARCA), organismo descentralizado actuante en la órbita del Ministerio de Economía, dictará las normas complementarias, aclaratorias y operativas necesarias para la efectiva aplicación de lo dispuesto en el presente Título, pudiendo requerir, en caso de considerarlo pertinente, la intervención de las áreas competentes de la Administración Pública Nacional."]},{"n":189,"nt":[],"h":"Incorpórase, con efectos a partir del primer día del mes inmediato siguiente al de la entrada en vigencia de esta ley, como inciso m) del cuarto párrafo del artículo 28 de la Ley de Im
