tal, muerte, renuncia o destitución del presidente, el Poder Ejecutivo será ejercido por el vicepresidente de la Nación. En caso de destitución, muerte, dimisión o inhabilidad del presidente y vicepresidente de la Nación, el Congreso determinará qué funcionario público ha de desempeñar la Presidencia, hasta que haya cesado la causa de la inhabilidad o un nuevo presidente sea electo."]},{"n":90,"k":"art","l":"89","bl":"Art. 89","nm":"Artículo 89","rl":"89","t":"Requisitos para ser presidente","s":"Presidente y vicepresidente deben haber nacido en territorio argentino o ser hijos de ciudadano nativo nacidos en el extranjero, y reunir los requisitos exigidos para ser senador.","p":["Para ser elegido presidente o vicepresidente de la Nación, se requiere haber nacido en el territorio argentino, o ser hijo de ciudadano nativo, habiendo nacido en país extranjero; y las demás calidades exigidas para ser elegido senador."]},{"n":91,"k":"art","l":"90","bl":"Art. 90","nm":"Artículo 90","rl":"90","t":"Duración y reelección","s":"Presidente y vicepresidente duran cuatro años y pueden ser reelegidos o sucederse recíprocamente por un solo período consecutivo. Tras una reelección, solo pueden volver a ser elegidos para cualquiera de los cargos con el intervalo de un período.","p":["El presidente y vicepresidente duran en sus funciones el término de cuatro años y podrán ser reelegidos o sucederse recíprocamente por un solo período consecutivo. Si han sido reelectos o se han sucedido recíprocamente no pueden ser elegidos para ninguno de ambos cargos, sino con el intervalo de un período."]},{"n":92,"k":"art","l":"91","bl":"Art. 91","nm":"Artículo 91","rl":"91","t":"Cese del mandato","s":"El presidente cesa el mismo día en que expira su período de cuatro años, sin que ningún hecho que lo haya interrumpido sea motivo para completarlo más tarde.","p":["El presidente de la Nación cesa en el poder el mismo día en que expira su período de cuatro años; sin que evento alguno que lo haya interrumpido, pueda ser motivo de que se le complete más tarde."]},{"n":93,"k":"art","l":"92","bl":"Art. 92","nm":"Artículo 92","rl":"92","t":"Remuneración e incompatibilidades","s":"Presidente y vicepresidente cobran un sueldo del Tesoro que no puede alterarse durante el período. En ese tiempo no pueden ejercer otro empleo ni recibir otro emolumento de la Nación o de una provincia.","p":["El presidente y vicepresidente disfrutan de un sueldo pagado por el Tesoro de la Nación, que no podrá ser alterado en el período de sus nombramientos. Durante el mismo período no podrán ejercer otro empleo, ni recibir ningún otro emolumento de la Nación, ni de provincia alguna."]},{"n":94,"k":"art","l":"93","bl":"Art. 93","nm":"Artículo 93","rl":"93","t":"Juramento presidencial","s":"Al asumir, presidente y vicepresidente juran ante el presidente del Senado y el Congreso reunido en Asamblea, respetando sus creencias religiosas, desempeñar con lealtad y patriotismo el cargo y observar y hacer observar la Constitución.","p":["Al tomar posesión de su cargo el presidente y vicepresidente prestarán juramento, en manos del presidente del Senado y ante el Congreso reunido en Asamblea, respetando sus creencias religiosas, de: “desempeñar con lealtad y patriotismo el cargo de presidente (o vicepresidente) de la Nación y observar y hacer observar fielmente la Constitución de la Nación Argentina”."]},{"n":95,"k":"art","l":"94","bl":"Art. 94","nm":"Artículo 94","rl":"94","t":"Elección directa en doble vuelta","s":"Presidente y vicepresidente son elegidos directamente por el pueblo, en doble vuelta, y el territorio nacional conforma un distrito único.","p":["El presidente y el vicepresidente de la Nación serán elegidos directamente por el pueblo, en doble vuelta, según lo establece esta Constitución. A este fin el territorio nacional conformará un distrito único."]},{"n":96,"k":"art","l":"95","bl":"Art. 95","nm":"Artículo 95","rl":"95","t":"Plazo de la elección","s":"La elección se efectúa dentro de los dos meses anteriores a la conclusión del mandato del presidente en ejercicio.","p":["La elección se efectuará dentro de los dos meses anteriores a la conclusión del mandato del presidente en ejercicio."]},{"n":97,"k":"art","l":"96","bl":"Art. 96","nm":"Artículo 96","rl":"96","t":"Segunda vuelta","s":"Si corresponde, la segunda vuelta se realiza entre las dos fórmulas más votadas dentro de los treinta días de la primera.","p":["La segunda vuelta electoral, si correspondiere, se realizará entre las dos fórmulas de candidatos más votadas, dentro de los treinta días de celebrada la anterior."]},{"n":98,"k":"art","l":"97","bl":"Art. 97","nm":"Artículo 97","rl":"97","t":"Proclamación con más del 45 %","s":"Si la fórmula más votada en primera vuelta obtiene más del 45 % de los votos afirmativos válidos, es proclamada presidente y vicepresidente.","p":["Cuando la fórmula que resultare más votada en la primera vuelta, hubiere obtenido más del cuarenta y cinco por ciento de los votos afirmativos válidamente emitidos, sus integrantes serán proclamados como presidente y vicepresidente de la Nación."]},{"n":99,"k":"art","l":"98","bl":"Art. 98","nm":"Artículo 98","rl":"98","t":"Proclamación con 40 % y diferencia","s":"También se proclama la fórmula más votada en primera vuelta si obtiene al menos el 40 % de los votos afirmativos válidos y una diferencia mayor de diez puntos porcentuales sobre la segunda.","p":["Cuando la fórmula que resultare más votada en la primera vuelta hubiere obtenido el cuarenta por ciento por lo menos de los votos afirmativos válidamente emitidos y, además, existiere una diferencia mayor de diez puntos porcentuales respecto del total de los votos afirmativos válidamente emitidos sobre la fórmula que le sigue en número de votos, sus integrantes serán proclamados como presidente y vicepresidente de la Nación."]},{"n":100,"k":"art","l":"99","bl":"Art. 99","nm":"Artículo 99","rl":"99","t":"Atribuciones del presidente","s":"Enumera 20 atribuciones: jefe supremo de la Nación, del gobierno y responsable político de la administración; reglamentar las leyes sin alterar su espíritu; promulgar leyes; prohibición de emitir disposiciones legislativas bajo pena de nulidad absoluta, salvo decretos de necesidad y urgencia (excluidas las materias penal, tributaria, electoral y de partidos) con control de la Comisión Bicameral Permanente; nombrar magistrados con acuerdo del Senado; indultar y conmutar penas; nombrar y remover ministros y funcionarios; abrir las sesiones del Congreso; celebrar tratados; ser comandante en jefe de las fuerzas armadas; declarar el estado de sitio y la guerra con las autorizaciones del caso; y decretar la intervención federal durante el receso del Congreso.","p":["El presidente de la Nación tiene las siguientes atribuciones:","1. Es el jefe supremo de la Nación, jefe del gobierno y responsable político de la administración general del país.","2. Expide las instrucciones y reglamentos que sean necesarios para la ejecución de las leyes de la Nación, cuidando de no alterar su espíritu con excepciones reglamentarias.","3. Participa de la formación de las leyes con arreglo a la Constitución, las promulga y hace publicar.","El Poder Ejecutivo no podrá en ningún caso bajo pena de nulidad absoluta e insanable, emitir disposiciones de carácter legislativo.","Solamente cuando circunstancias excepcionales hicieran imposible seguir los trámites ordinarios previstos por esta Constitución para la sanción de las leyes, y no se trate de normas que regulen materia penal, tributaria, electoral o el régimen de los partidos políticos, podrá dictar decretos por razones de necesidad y urgencia, los que serán decididos en acuerdo general de ministros que deberán refrendarlos, conjuntamente con el jefe de gabinete de ministros.","El jefe de gabinete de ministros personalmente y dentro de los diez días someterá la medida a consideración de la Comisión Bicameral Permanente, cuya composición deberá respetar la proporción de las representaciones políticas de cada Cámara. Esta comisión elevará su despacho en un plazo de diez días al plenario de cada Cámara para su expreso tratamiento, el que de inmediato considerarán las Cámaras. Una ley especial sancionada con la mayoría absoluta de la totalidad de los miembros de cada Cámara regulará el trámite y los alcances de la intervención del Congreso.","4. Nombra los magistrados de la Corte Suprema con acuerdo del Senado por dos tercios de sus miembros presentes, en sesión pública, convocada al efecto.","Nombra los demás jueces de los tribunales federales inferiores en base a una propuesta vinculante en terna del Consejo de la Magistratura, con acuerdo del Senado, en sesión pública, en la que se tendrá en cuenta la idoneidad de los candidatos.","Un nuevo nombramiento, precedido de igual acuerdo, será necesario para mantener en el cargo a cualquiera de esos magistrados, una vez que cumplan la edad de setenta y cinco años. Todos los nombramientos de magistrados cuya edad sea la indicada o mayor se harán por cinco años, y podrán ser repetidos indefinidamente, por el mismo trámite.","5. Puede indultar o conmutar las penas por delitos sujetos a la jurisdicción federal, previo informe del tribunal correspondiente, excepto en los casos de acusación por la Cámara de Diputados.","6. Concede jubilaciones, retiros, licencias y pensiones conforme a las leyes de la Nación.","7. Nombra y remueve a los embajadores, ministros plenipotenciarios y encargados de negocios con acuerdo del Senado; por sí solo nombra y remueve al jefe de gabinete de ministros y a los demás ministros del despacho, los oficiales de su secretaría, los agentes consulares y los empleados cuyo nombramiento no está reglado de otra forma por esta Constitución.","8. Hace anualmente la apertura de las sesiones del Congreso, reunidas al efecto ambas Cámaras, dando cuenta en esta ocasión del estado de la Nación, de las reformas prometidas por la Constitución, y recomendando a su consideración las medidas que juzgue necesarias y convenientes.","9. Prorroga las sesiones ordinarias del Congreso, o lo convoca a sesiones extraordinarias, cuando un grave interés de orden o de progreso lo requiera.","10. Supervisa el ejercicio de la facultad del jefe de gabinete de ministros respecto de la recaudación de las rentas de la Nación y de su inversión, con arreglo a la ley o presupuesto de gastos nacionales.","11. Concluye y firma tratados, concordatos y otras negociaciones requeridas para el mantenimiento de buenas relaciones con las organizaciones internacionales y las naciones extranjeras, recibe sus ministros y admite sus cónsules.","12. Es comandante en jefe de todas las fuerzas armadas de la Nación.","13. Provee los empleos militares de la Nación: con acuerdo del Senado, en la concesión de los empleos o grados de oficiales superiores de las fuerzas armadas; y por sí solo en el campo de batalla.","14. Dispone de las fuerzas armadas, y corre con su organización y distribución según las necesidades de la Nación.","15. Declara la guerra y ordena represalias con autorización y aprobación del Congreso.","16. Declara en estado de sitio uno o varios puntos de la Nación, en caso de ataque exterior y por un término limitado, con acuerdo del Senado. En caso de conmoción interior sólo tiene esta facultad cuando el Congreso está en receso, porque es atribución que corresponde a este cuerpo. El presidente la ejerce con las limitaciones prescriptas en el artículo 23.","17. Puede pedir al jefe de gabinete de ministros y a los jefes de todos los ramos y departamentos de la administración, y por su conducto a los demás empleados, los informes que crea convenientes, y ellos están obligados a darlos.","18. Puede ausentarse del territorio de la Nación, con permiso del Congreso. En el receso de éste, sólo podrá hacerlo sin licencia por razones justificadas de servicio público.","19. Puede llenar las vacantes de los empleos, que requieran el acuerdo del Senado, y que ocurran durante su receso, por medio de nombramientos en comisión que expirarán al fin de la próxima Legislatura.","20. Decreta la intervención federal a una provincia o a la ciudad de Buenos Aires en caso de receso del Congreso, y debe convocarlo simultáneamente para su tratamiento."]},{"n":101,"k":"art","l":"100","bl":"Art. 100","nm":"Artículo 100","rl":"100","t":"Jefe de Gabinete y ministros","s":"El jefe de gabinete y los demás ministros secretarios despachan los negocios de la Nación y refrendan los actos del presidente, que sin esa firma carecen de eficacia. El jefe de gabinete, con responsabilidad política ante el Congreso, ejerce la administración general del país, nombra empleados, coordina el gabinete, envía los proyectos de ley de Ministerios y de Presupuesto, recauda las rentas y ejecuta el presupuesto, concurre al Congreso sin voto y refrenda decretos delegados, de necesidad y urgencia y de promulgación parcial, sometiéndolos a la Comisión Bicameral Permanente. No puede ejercer otro ministerio.","p":["El jefe de gabinete de ministros y los demás ministros secretarios cuyo número y competencia será establecida por una ley especial, tendrán a su cargo el despacho de los negocios de la Nación, y refrendarán y legalizarán los actos del presidente por medio de su firma, sin cuyo requisito carecen de eficacia.","Al jefe de gabinete de ministros, con responsabilidad política ante el Congreso de la Nación, le corresponde:","1. Ejercer la administración general del país.","2. Expedir los actos y reglamentos que sean necesarios para ejercer las facultades que le atribuye este artículo y aquellas que le delegue el presidente de la Nación, con el refrendo del ministro secretario del ramo al cual el acto o reglamento se refiera.","3. Efectuar los nombramientos de los empleados de la administración, excepto los que correspondan al presidente.","4. Ejercer las funciones y atribuciones que le delegue el presidente de la Nación y, en acuerdo de gabinete resolver sobre las materias que le indique el Poder Ejecutivo, o por su propia decisión, en aquellas que por su importancia estime necesario, en el ámbito de su competencia.","5. Coordinar, preparar y convocar las reuniones de gabinete de ministros, presidiéndolas en caso de ausencia del presidente.","6. Enviar al Congreso los proyectos de ley de Ministerios y de Presupuesto nacional, previo tratamiento en acuerdo de gabinete y aprobación del Poder Ejecutivo.","7. Hacer recaudar las rentas de la Nación y ejecutar la ley de Presupuesto nacional.","8. Refrendar los decretos reglamentarios de las leyes, los decretos que dispongan la prórroga de las sesiones ordinarias del Congreso o la convocatoria de sesiones extraordinarias y los mensajes del presidente que promuevan la iniciativa legislativa.","9. Concurrir a las sesiones del Congreso y participar en sus debates, pero no votar.","10. Una vez que se inicien las sesiones ordinarias del Congreso, presentar junto a los restantes ministros una memoria detallada del estado de la Nación en lo relativo a los negocios de los respectivos departamentos.","11. Producir los informes y explicaciones verbales o escritos que cualquiera de las Cámaras solicite al Poder Ejecutivo.","12. Refrendar los decretos que ejercen facultades delegadas por el Congreso, los que estarán sujetos al control de la Comisión Bicameral Permanente.","13. Refrendar conjuntamente con los demás ministros los decretos de necesidad y urgencia y los decretos que promulgan parcialmente leyes. Someterá personalmente y dentro de los diez días de su sanción estos decretos a consideración de la Comisión Bicameral Permanente.","El jefe de gabinete de ministros no podrá desempeñar simultáneamente otro ministerio."]},{"n":102,"k":"art","l":"101","bl":"Art. 101","nm":"Artículo 101","rl":"101","t":"Informe y moción de censura","s":"El jefe de gabinete debe concurrir al Congreso al menos una vez por mes, alternando entre las Cámaras, para informar sobre la marcha del gobierno. Puede ser interpelado para una moción de censura por mayoría absoluta de cualquiera de las Cámaras y removido por mayoría absoluta de cada una.","p":["El jefe de gabinete de ministros debe concurrir al Congreso al menos una vez por mes, alternativamente a cada una de sus Cámaras, para informar de la marcha del gobierno, sin perjuicio de lo dispuesto en el artículo 71. Puede ser interpelado a los efectos del tratamiento de una moción de censura, por el voto de la mayoría absoluta de la totalidad de los miembros de cualquiera de las Cámaras, y ser removido por el voto de la mayoría absoluta de los miembros de cada una de las Cámaras."]},{"n":103,"k":"art","l":"102","bl":"Art. 102","nm":"Artículo 102","rl":"102","t":"Responsabilidad de los ministros","s":"Cada ministro es responsable de los actos que legaliza y solidariamente de los que acuerda con sus colegas.","p":["Cada ministro es responsable de los actos que legaliza; y solidariamente de los que acuerda con sus colegas."]},{"n":104,"k":"art","l":"103","bl":"Art. 103","nm":"Artículo 103","rl":"103","t":"Límite a las resoluciones ministeriales","s":"Los ministros no pueden tomar resoluciones por sí solos, salvo en lo concerniente al régimen económico y administrativo de sus departamentos.","p":["Los ministros no pueden por sí solos, en ningún caso, tomar resoluciones, a excepción de lo concerniente al régimen económico y administrativo de sus respectivos departamentos."]},{"n":105,"k":"art","l":"104","bl":"Art. 104","nm":"Artículo 104","rl":"104","t":"Memoria anual de los ministros","s":"Al abrir sus sesiones el Congreso, los ministros deben presentarle una memoria detallada del estado de la Nación en lo relativo a sus departamentos.","p":["Luego que el Congreso abra sus sesiones, deberán los ministros del despacho presentarle una memoria detallada del estado de la Nación en lo relativo a los negocios de sus respectivos departamentos."]},{"n":106,"k":"art","l":"105","bl":"Art. 105","nm":"Artículo 105","rl":"105","t":"Incompatibilidad con el Congreso","s":"Los ministros no pueden ser senadores ni diputados sin renunciar a sus cargos ministeriales.","p":["No pueden ser senadores ni diputados, sin hacer dimisión de sus empleos de ministros."]},{"n":107,"k":"art","l":"106","bl":"Art. 106","nm":"Artículo 106","rl":"106","t":"Asistencia a sesiones","s":"Los ministros pueden concurrir a las sesiones del Congreso y participar de los debates, pero no votar.","p":["Pueden los ministros concurrir a las sesiones del Congreso y tomar parte en sus debates, pero no votar."]},{"n":108,"k":"art","l":"107","bl":"Art. 107","nm":"Artículo 107","rl":"107","t":"Sueldo de los ministros","s":"Reciben un sueldo establecido por ley, que no puede aumentarse ni disminuirse en favor o perjuicio de quienes están en ejercicio.","p":["Gozarán por sus servicios de un sueldo establecido por la ley, que no podrá ser aumentado ni disminuido en favor o perjuicio de los que se hallen en ejercicio."]},{"n":109,"k":"art","l":"108","bl":"Art. 108","nm":"Artículo 108","rl":"108","t":"Poder Judicial","s":"El Poder Judicial de la Nación lo ejercen una Corte Suprema de Justicia y los demás tribunales inferiores que el Congreso establezca en el territorio de la Nación.","p":["El Poder Judicial de la Nación será ejercido por una Corte Suprema de Justicia, y por los demás tribunales inferiores que el Congreso estableciere en el territorio de la Nación."]},{"n":110,"k":"art","l":"109","bl":"Art. 109","nm":"Artículo 109","rl":"109","t":"Independencia judicial frente al Ejecutivo","s":"El presidente no puede en ningún caso ejercer funciones judiciales, arrogarse el conocimiento de causas pendientes ni restablecer las fenecidas.","p":["En ningún caso el presidente de la Nación puede ejercer funciones judiciales, arrogarse el conocimiento de causas pendientes o restablecer las fenecidas."]},{"n":111,"k":"art","l":"110","bl":"Art. 110","nm":"Artículo 110","rl":"110","t":"Inamovilidad e intangibilidad","s":"Los jueces de la Corte y de los tribunales inferiores conservan sus empleos mientras dure su buena conducta. Reciben una compensación fijada por ley que no puede disminuirse mientras permanezcan en funciones.","p":["Los jueces de la Corte Suprema y de los tribunales inferiores de la Nación conservarán sus empleos mientras dure su buena conducta, y recibirán por sus servicios una compensación que determinará la ley, y que no podrá ser disminuida en manera alguna, mientras permaneciesen en sus funciones."]},{"n":112,"k":"art","l":"111","bl":"Art. 111","nm":"Artículo 111","rl":"111","t":"Requisitos para integrar la Corte","s":"Para ser miembro de la Corte Suprema se requiere ser abogado de la Nación con ocho años de ejercicio y tener las calidades exigidas para ser senador.","p":["Ninguno podrá ser miembro de la Corte Suprema de Justicia, sin ser abogado de la Nación con ocho años de ejercicio, y tener las calidades requeridas para ser senador."]},{"n":113,"k":"art","l":"112","bl":"Art. 112","nm":"Artículo 112","rl":"112","t":"Juramento de los jueces de la Corte","s":"En la primera instalación, los miembros de la Corte juran en manos del presidente de la Nación administrar justicia bien y legalmente. En lo sucesivo juran ante el presidente de la misma Corte.","p":["En la primera instalación de la Corte Suprema, los individuos nombrados prestarán juramento en manos del presidente de la Nación, de desempeñar sus obligaciones, administrando justicia bien y legalmente, y en conformidad a lo que prescribe la Constitución. En lo sucesivo lo prestarán ante el presidente de la misma Corte."]},{"n":114,"k":"art","l":"113","bl":"Art. 113","nm":"Artículo 113","rl":"113","t":"Reglamento interno de la Corte","s":"La Corte Suprema dicta su reglamento interior y nombra a sus empleados.","p":["La Corte Suprema dictará su reglamento interior y nombrará a sus empleados."]},{"n":115,"k":"art","l":"114","bl":"Art. 114","nm":"Artículo 114","rl":"114","t":"Consejo de la Magistratura","s":"Regulado por ley especial sancionada por mayoría absoluta de cada Cámara, tiene a su cargo la selección de los magistrados y la administración del Poder Judicial. Se integra buscando el equilibrio entre órganos políticos, jueces, abogados de la matrícula federal y personas del ámbito académico y científico. Sus atribuciones: concursos públicos para postulantes a magistraturas inferiores, ternas vinculantes, administrar recursos y ejecutar el presupuesto judicial, facultades disciplinarias, decidir la apertura del procedimiento de remoción, suspender y acusar, y dictar reglamentos de organización judicial.","p":["El Consejo de la Magistratura, regulado por una ley especial sancionada por la mayoría absoluta de la totalidad de los miembros de cada Cámara, tendrá a su cargo la selección de los magistrados y la administración del Poder Judicial.","El Consejo será integrado periódicamente de modo que se procure el equilibrio entre la representación de los órganos políticos resultantes de la elección popular, de los jueces de todas las instancias y de los abogados de la matrícula federal. Será integrado, asimismo, por otras personas del ámbito académico y científico, en el número y la forma que indique la ley. Serán sus atribuciones:","1. Seleccionar mediante concursos públicos los postulantes a las magistraturas inferiores.","2. Emitir propuestas en ternas vinculantes, para el nombramiento de los magistrados de los tribunales inferiores.","3. Administrar los recursos y ejecutar el presupuesto que la ley asigne a la administración de justicia.","4. Ejercer facultades disciplinarias sobre magistrados.","5. Decidir la apertura del procedimiento de remoción de magistrados, en su caso ordenar la suspensión, y formular la acusación correspondiente.","6. Dictar los reglamentos relacionados con la organización judicial y todos aquellos que sean necesarios para asegurar la independencia de los jueces y la eficaz prestación de los servicios de justicia."]},{"n":116,"k":"art","l":"115","bl":"Art. 115","nm":"Artículo 115","rl":"115","t":"Remoción de jueces inferiores","s":"Los jueces de los tribunales inferiores son removidos por las causales del art. 53 por un jurado de enjuiciamiento de legisladores, magistrados y abogados. Su fallo es irrecurrible y solo destituye, sin perjuicio de la responsabilidad ante los tribunales ordinarios. Si pasan 180 días desde la apertura del procedimiento sin fallo, corresponde archivar y reponer al juez suspendido. La ley especial fija la integración y el procedimiento del jurado.","p":["Los jueces de los tribunales inferiores de la Nación serán removidos por las causales expresadas en el artículo 53, por un jurado de enjuiciamiento integrado por legisladores, magistrados y abogados de la matrícula federal. Su fallo, que será irrecurrible, no tendrá más efecto que destituir al acusado. Pero la parte condenada quedará no obstante sujeta a acusación, juicio y castigo conforme a las leyes ante los tribunales ordinarios.","Corresponderá archivar las actuaciones y, en su caso, reponer al juez suspendido, si transcurrieren ciento ochenta días contados desde la decisión de abrir el procedimiento de remoción, sin que haya sido dictado el fallo.","En la ley especial a que se refiere el artículo 114, se determinará la integración y procedimiento de este jurado."]},{"n":117,"k":"art","l":"116","bl":"Art. 116","nm":"Artículo 116","rl":"116","t":"Competencia de la justicia federal","s":"Corresponde a la Corte Suprema y a los tribunales inferiores conocer las causas que versen sobre puntos regidos por la Constitución, las leyes de la Nación (con la reserva del art. 75, inc. 12) y los tratados internacionales; las que involucren a embajadores, ministros y cónsules extranjeros; las de almirantazgo y jurisdicción marítima; los asuntos en que la Nación sea parte; y las causas entre provincias, entre una provincia y vecinos de otra, entre vecinos de distintas provincias, o entre una provincia o sus vecinos y un Estado o ciudadano extranjero.","p":["Corresponde a la Corte Suprema y a los tribunales inferiores de la Nación, el conocimiento y decisión de todas las causas que versen sobre puntos regidos por la Constitución, y por las leyes de la Nación, con la reserva hecha en el inciso 12 del artículo 75: y por los tratados con las naciones extranjeras: de las causas concernientes a embajadores, ministros públicos y cónsules extranjeros: de las causas de almirantazgo y jurisdicción marítima: de los asuntos en que la Nación sea parte: de las causas que se susciten entre dos o más provincias; entre una provincia y los vecinos de otra; entre los vecinos de diferentes provincias; y entre una provincia o sus vecinos, contra un Estado o ciudadano extranjero."]},{"n":118,"k":"art","l":"117","bl":"Art. 117","nm":"Artículo 117","rl":"117","t":"Competencia originaria y apelada de la Corte","s":"En los casos del art. 116 la Corte actúa por apelación según las reglas y excepciones que fije el Congreso. En los asuntos de embajadores, ministros y cónsules extranjeros y en los que una provincia sea parte, ejerce competencia originaria y exclusiva.","p":["En estos casos la Corte Suprema ejercerá su jurisdicción por apelación según las reglas y excepciones que prescriba el Congreso; pero en todos los asuntos concernientes a embajadores, ministros y cónsules extranjeros, y en los que alguna provincia fuese parte, la ejercerá originaria y exclusivamente."]},{"n":119,"k":"art","l":"118","bl":"Art. 118","nm":"Artículo 118","rl":"118","t":"Juicio por jurados","s":"Los juicios criminales ordinarios se terminarán por jurados cuando se establezca la institución. Se realizan en la provincia donde se cometió el delito; si se cometió fuera de la Nación, contra el Derecho de Gentes, el Congreso fija por ley el lugar del juicio.","p":["Todos los juicios criminales ordinarios, que no se deriven del derecho de acusación concedido en la Cámara de Diputados se terminarán por jurados, luego que se establezca en la República esta institución. La actuación de estos juicios se hará en la misma provincia donde se hubiera cometido el delito; pero cuando éste se cometa fuera de los límites de la Nación, contra el Derecho de Gentes, el Congreso determinará por una ley especial el lugar en que haya de seguirse el juicio."]},{"n":120,"k":"art","l":"119","bl":"Art. 119","nm":"Artículo 119","rl":"119","t":"Traición a la Nación","s":"La traición consiste únicamente en tomar las armas contra la Nación o unirse a sus enemigos prestándoles ayuda y socorro. El Congreso fija la pena por ley, que no pasa de la persona del delincuente ni transmite la infamia a sus parientes.","p":["La traición contra la Nación consistirá únicamente en tomar las armas contra ella, o en unirse a sus enemigos prestándoles ayuda y socorro. El Congreso fijará por una ley especial la pena de este delito; pero ella no pasará de la persona del delincuente, ni la infamia del reo se transmitirá a sus parientes de cualquier grado."]},{"n":121,"k":"art","l":"120","bl":"Art. 120","nm":"Artículo 120","rl":"120","t":"Ministerio Público","s":"Es un órgano independiente, con autonomía funcional y autarquía financiera, que promueve la actuación de la justicia en defensa de la legalidad y de los intereses generales de la sociedad. Lo integran un procurador general de la Nación, un defensor general de la Nación y los demás miembros que establezca la ley, que gozan de inmunidades funcionales e intangibilidad de remuneraciones.","p":["El Ministerio Público es un órgano independiente con autonomía funcional y autarquía financiera, que tiene por función promover la actuación de la justicia en defensa de la legalidad, de los intereses generales de la sociedad, en coordinación con las demás autoridades de la República.","Está integrado por un procurador general de la Nación y un defensor general de la Nación y los demás miembros que la ley establezca.","Sus miembros gozan de inmunidades funcionales e intangibilidad de remuneraciones."]},{"n":122,"k":"art","l":"121","bl":"Art. 121","nm":"Artículo 121","rl":"121","t":"Poderes reservados a las provincias","s":"Las provincias conservan todo el poder no delegado a la Nación y el que se hayan reservado expresamente por pactos especiales al incorporarse.","p":["Las provincias conservan todo el poder no delegado por esta Constitución al Gobierno federal, y el que expresamente se hayan reservado por pactos especiales al tiempo de su incorporación."]},{"n":123,"k":"art","l":"122","bl":"Art. 122","nm":"Artículo 122","rl":"122","t":"Instituciones locales","s":"Las provincias se dan sus propias instituciones locales y se rigen por ellas. Eligen gobernadores, legisladores y demás funcionarios sin intervención del Gobierno federal.","p":["Se dan sus propias instituciones locales y se rigen por ellas. Eligen sus gobernadores, sus legisladores y demás funcionarios de provincia, sin intervención del Gobierno federal."]},{"n":124,"k":"art","l":"123","bl":"Art. 123","nm":"Artículo 123","rl":"123","t":"Autonomía municipal","s":"Cada provincia dicta su constitución conforme al art. 5, asegurando la autonomía municipal y regulando su alcance y contenido en lo institucional, político, administrativo, económico y financiero.","p":["Cada provincia dicta su propia constitución, conforme a lo dispuesto por el artículo 5 asegurando la autonomía municipal y reglando su alcance y contenido en el orden institucional, político, administrativo, económico y financiero."]},{"n":125,"k":"art","l":"124","bl":"Art. 124","nm":"Artículo 124","rl":"124","t":"Regiones, convenios internacionales y recursos naturales","s":"Las provincias pueden crear regiones para el desarrollo económico y social y celebrar convenios internacionales, siempre que no sean incompatibles con la política exterior de la Nación ni afecten el crédito público o las facultades federales, con conocimiento del Congreso. Corresponde a las provincias el dominio originario de los recursos naturales existentes en su territorio.","p":["Las provincias podrán crear regiones para el desarrollo económico y social y establecer órganos con facultades para el cumplimiento de sus fines y podrán también celebrar convenios internacionales en tanto no sean incompatibles con la política exterior de la Nación y no afecten las facultades delegadas al Gobierno federal o el crédito público de la Nación; con conocimiento del Congreso Nacional. La ciudad de Buenos Aires tendrá el régimen que se establezca a tal efecto.","Corresponde a las provincias el dominio originario de los recursos naturales existentes en su territorio."]},{"n":126,"k":"art","l":"125","bl":"Art. 125","nm":"Artículo 125","rl":"125","t":"Tratados parciales y promoción provincial","s":"Las provincias pueden celebrar tratados parciales para fines de administración de justicia, intereses económicos y trabajos de utilidad común, con conocimiento del Congreso, y promover su industria, inmigración, infraestructura y desarrollo con recursos propios. También pueden conservar organismos de seguridad social para empleados públicos y profesionales y promover el desarrollo humano, el empleo, la educación, la ciencia y la cultura.","p":["Las provincias pueden celebrar tratados parciales para fines de administración de justicia, de intereses económicos y trabajos de utilidad común, con conocimiento del Congreso Federal; y promover su industria, la inmigración, la construcción de ferrocarriles y canales navegables, la colonización de tierras de propiedad provincial, la introducción y establecimiento de nuevas industrias, la importación de capitales extranjeros y la exploración de sus ríos, por leyes protectoras de estos fines, y con sus recursos propios.","Las provincias y la ciudad de Buenos Aires pueden conservar organismos de seguridad social para los empleados públicos y los profesionales; y promover el progreso económico, el desarrollo humano, la generación de empleo, la educación, la ciencia, el conocimiento y la cultura."]},{"n":127,"k":"art","l":"126","bl":"Art. 126","nm":"Artículo 126","rl":"126","t":"Prohibiciones a las provincias","s":"Las provincias no ejercen el poder delegado a la Nación: no pueden celebrar tratados parciales de carácter político, dictar leyes sobre comercio o navegación, establecer aduanas, acuñar moneda, dictar los códigos de fondo una vez sancionados por el Congreso, legislar sobre ciudadanía, naturalización, bancarrotas o falsificación de moneda, establecer derechos de tonelaje, armar buques de guerra ni levantar ejércitos (salvo invasión o peligro inminente), ni nombrar o recibir agentes extranjeros.","p":["Las provincias no ejercen el poder delegado a la Nación. No pueden celebrar tratados parciales de carácter político; ni expedir leyes sobre comercio, o navegación interior o exterior; ni establecer aduanas provinciales; ni acuñar moneda; ni establecer bancos con facultades de emitir billetes, sin autorización del Congreso Federal; ni dictar los Códigos Civil, Comercial, Penal y de Minería, después que el Congreso los haya sancionado; ni dictar especialmente leyes sobre ciudadanía y naturalización, bancarrotas, falsificación de moneda o documentos del Estado; ni establecer derechos de tonelaje; ni armar buques de guerra o levantar ejércitos, salvo el caso de invasión exterior o de un peligro tan inminente que no admita dilación dando luego cuenta al Gobierno federal; ni nombrar o recibir agentes extranjeros."]},{"n":128,"k":"art","l":"127","bl":"Art. 127","nm":"Artículo 127","rl":"127","t":"Prohibición de guerra entre provincias","s":"Ninguna provincia puede declarar ni hacer la guerra a otra. Sus quejas se someten a la Corte Suprema. Las hostilidades de hecho son actos de guerra civil, calificados de sedición o asonada, que el gobierno federal debe sofocar y reprimir.","p":["Ninguna provincia puede declarar, ni hacer la guerra a otra provincia. Sus quejas deben ser sometidas a la Corte Suprema de Justicia y dirimidas por ella. Sus hostilidades de hecho son actos de guerra civil, calificados de sedición o asonada, que el gobierno federal debe sofocar y reprimir conforme a la ley."]},{"n":129,"k":"art","l":"128","bl":"Art. 128","nm":"Artículo 128","rl":"128","t":"Gobernadores como agentes federales","s":"Los gobernadores de provincia son agentes naturales del Gobierno federal para hacer cumplir la Constitución y las leyes de la Nación.","p":["Los gobernadores de provincia son agentes naturales del Gobierno federal para hacer cumplir la Constitución y las leyes de la Nación."]},{"n":130,"k":"art","l":"129","bl":"Art. 129","nm":"Artículo 129","rl":"129","t":"Ciudad Autónoma de Buenos Aires","s":"La ciudad de Buenos Aires tiene un régimen de gobierno autónomo, con facultades propias de legislación y jurisdicción, y su jefe de gobierno es elegido directamente por el pueblo. Una ley garantiza los intereses del Estado nacional mientras sea capital de la Nación. El Congreso convoca a los habitantes de la ciudad para que, por medio de representantes, dicten el Estatuto Organizativo de sus instituciones.","p":["La ciudad de Buenos Aires tendrá un régimen de gobierno autónomo, con facultades propias de legislación y jurisdicción, y su jefe de gobierno será elegido directamente por el pueblo de la ciudad.","Una ley garantizará los intereses del Estado nacional, mientras la ciudad de Buenos Aires sea capital de la Nación.","En el marco de lo dispuesto en este artículo, el Congreso de la Nación convocará a los habitantes de la ciudad de Buenos Aires para que, mediante los representantes que elijan a ese efecto, dicten el Estatuto Organizativo de sus instituciones."]},{"n":131,"k":"tra","l":"1.ª","bl":"Disp. 1.ª","nm":"Disposición transitoria 1.ª","rl":"1.ª","t":"Soberanía sobre las islas Malvinas","s":"La Nación ratifica su legítima e imprescriptible soberanía sobre las islas Malvinas, Georgias del Sur y Sandwich del Sur y los espacios marítimos e insulares correspondientes. Su recuperación y el ejercicio pleno de la soberanía, respetando el modo de vida de sus habitantes y conforme al Derecho Internacional, es un objetivo permanente e irrenunciable del pueblo argentino.","p":["La Nación Argentina ratifica su legítima e imprescriptible soberanía sobre las islas Malvinas, Georgias del Sur y Sandwich del Sur y los espacios marítimos e insulares correspondientes, por ser parte integrante del territorio nacional.","La recuperación de dichos territorios y el ejercicio pleno de la soberanía, respetando el modo de vida de sus habitantes, y conforme a los principios del Derecho Internacional, constituyen un objetivo permanente e irrenunciable del pueblo argentino."]},{"n":132,"k":"tra","l":"2.ª","bl":"Disp. 2.ª","nm":"Disposición transitoria 2.ª","rl":"2.ª","t":"Acciones positivas (art. 37)","s":"Las acciones positivas del último párrafo del art. 37 no pueden ser inferiores a las vigentes al sancionarse la Constitución y duran lo que la ley determine.","p":["Las acciones positivas a que alude el artículo 37 en su último párrafo no podrán ser inferiores a las vigentes al tiempo de sancionarse esta Constitución y durarán lo que la ley determine (corresponde al artículo 37)."]},{"n":133,"k":"tra","l":"3.ª","bl":"Disp. 3.ª","nm":"Disposición transitoria 3.ª","rl":"3.ª","t":"Ley de iniciativa popular (art. 39)","s":"La ley que reglamente la iniciativa popular debe aprobarse dentro de los dieciocho meses de la sanción de la reforma.","p":["La ley que reglamente el ejercicio de la iniciativa popular deberá ser aprobada dentro de los dieciocho meses de esta sanción (corresponde al artículo 39)."]},{"n":134,"k":"tra","l":"4.ª","bl":"Disp. 4.ª","nm":"Disposición transitoria 4.ª","rl":"4.ª","t":"Transición del Senado","s":"Los senadores en funciones cumplen su mandato hasta su extinción. En 1995 se designa un tercer senador por distrito, con reglas de integración que reparten dos bancas a la mayoría y una a la primera minoría legislativa; se aplican las mismas reglas a las elecciones de 1998 y a la ciudad de Buenos Aires.","p":["Los actuales integrantes del Senado de la Nación desempeñarán su cargo hasta la extinción del mandato correspondiente a cada uno.","En ocasión de renovarse un tercio del Senado en mil novecientos noventa y cinco, por finalización de los mandatos de todos los senadores elegidos en mil novecientos ochenta y seis, será designado además un tercer senador por distrito por cada Legislatura. El conjunto de los senadores por cada distrito se integrará, en lo posible, de modo que correspondan dos bancas al partido político o alianza electoral que tenga el mayor número de miembros en la Legislatura, y la restante al partido político o alianza electoral que le siga en número de miembros de ella. En caso de empate, se hará prevalecer al partido político o alianza electoral que hubiera obtenido mayor cantidad de sufragios en la elección legislativa provincial inmediata anterior.","La elección de los senadores que reemplacen a aquellos cuyos mandatos vencen en mil novecientos noventa y ocho, así como la elección de quien reemplace a cualquiera de los actuales senadores en caso de aplicación del artículo 62, se hará por estas mismas reglas de designación. Empero, el partido político o alianza electoral que tenga el mayor número de miembros en la Legislatura al tiempo de la elección del senador, tendrá derecho a que sea elegido su candidato, con la sola limitación de que no resulten los tres senadores de un mismo partido político o alianza electoral.","Estas reglas serán también aplicables a la elección de los senadores por la ciudad de Buenos Aires, en mil novecientos noventa y cinco por el cuerpo electoral, y en mil novecientos noventa y ocho, por el órgano legislativo de la ciudad.","La elección de todos los senadores a que se refiere esta cláusula se llevará a cabo con una anticipación no menor de sesenta ni mayor de noventa días al momento en que el senador deba asumir su función.","En todos los casos, los candidatos a senadores serán propuestos por los partidos políticos o alianzas electorales. El cumplimiento de las exigencias legales y estatutarias para ser proclamado candidato será certificado por la Justicia Electoral Nacional y comunicado a la Legislatura.","Toda vez que se elija un senador nacional se designará un suplente quien asumirá en los casos del artículo 62.","Los mandatos de los senadores elegidos por aplicación de esta cláusula transitoria durarán hasta el nueve de diciembre del dos mil uno (corresponde al artículo 54)."]},{"n":135,"k":"tra","l":"5.ª","bl":"Disp. 5.ª","nm":"Disposición transitoria 5.ª","rl":"5.ª","t":"Renovación total del Senado","s":"Todo el Senado se elige en la forma del art. 54 dentro de los dos meses anteriores al 10 de diciembre de 2001, y se sortea quiénes salen en el primer y segundo bienio.","p":["Todos los integrantes del Senado serán elegidos en la forma indicada en el artículo 54 dentro de los dos meses anteriores al diez de diciembre del dos mil uno, decidiéndose por la suerte, luego que todos se reúnan, quienes deban salir en el primero y segundo bienio (corresponde al artículo 56)."]},{"n":136,"k":"tra","l":"6.ª","bl":"Disp. 6.ª","nm":"Disposición transitoria 6.ª","rl":"6.ª","t":"Coparticipación federal","s":"El régimen de coparticipación y el organismo fiscal federal debían establecerse antes de fines de 1996. Hasta entonces la distribución vigente de competencias, servicios, funciones y recursos no puede modificarse sin aprobación de la provincia interesada ni en su desmedro. No afecta los reclamos en trámite entre Nación y provincias.","p":["Un régimen de coparticipación conforme lo dispuesto en el inciso 2 del artículo 75 y la reglamentación del organismo fiscal federal, serán establecidos antes de la finalización del año 1996; la distribución de competencias, servicios y funciones vigentes a la sanción de esta reforma, no podrá modificarse sin la aprobación de la provincia interesada; tampoco podrá modificarse en desmedro de las provincias la distribución de recursos vigente a la sanción de esta reforma y en ambos casos hasta el dictado del mencionado régimen de coparticipación.","La presente cláusula no afecta los reclamos administrativos o judiciales en trámite originados por diferencias por distribución de competencias, servicios, funciones o recursos entre la Nación y las provincias (corresponde al artículo 75, inciso 2)."]},{"n":137,"k":"tra","l":"7.ª","bl":"Disp. 7.ª","nm":"Disposición transitoria 7.ª","rl":"7.ª","t":"Legislación del Congreso en la Capital","s":"Mientras Buenos Aires sea capital de la Nación, el Congreso ejerce en ella las atribuciones legislativas que conserve conforme al art. 129.","p":["El Congreso ejercerá en la ciudad de Buenos Aires, mientras sea capital de la Nación, las atribuciones legislativas que conserve con arreglo al artículo 129 (corresponde al artículo 75, inciso 30)."]},{"n":138,"k":"tra","l":"8.ª","bl":"Disp. 8.ª","nm":"Disposición transitoria 8.ª","rl":"8.ª","t":"Caducidad de la legislación delegada","s":"La legislación delegada preexistente sin plazo caduca a los cinco años de vigencia de esta disposición, salvo que el Congreso la ratifique expresamente por una nueva ley.","p":["La legislación delegada preexistente que no contenga plazo establecido para su ejercicio caducará a los cinco años de la vigencia de esta disposición, excepto aquella que el Congreso de la Nación ratifique expresamente por una nueva ley (corresponde al artículo 76)."]},{"n":139,"k":"tra","l":"9.ª","bl":"Disp. 9.ª","nm":"Disposición transitoria 9.ª","rl":"9.ª","t":"Primer período del presidente en ejercicio","s":"El mandato del presidente en ejercicio al sancionarse la reforma se considera su primer período.","p":["El mandato del presidente en ejercicio al momento de sancionarse esta reforma, deberá ser considerado como primer período (corresponde al artículo 90)."]},{"n":140,"k":"tra","l":"10.ª","bl":"Disp. 10.ª","nm":"Disposición transitoria 10.ª","rl":"10.ª","t":"Mandato del presidente de 1995","s":"El mandato del presidente que asuma el 8 de julio de 1995 se extingue el 10 de diciembre de 1999.","p":["El mandato del presidente de la Nación que asuma su cargo el 8 de julio de 1995, se extinguirá el 10 de Diciembre de 1999 (corresponde al artículo 90)."]},{"n":141,"k":"tra","l":"11.ª","bl":"Disp. 11.ª","nm":"Disposición transitoria 11.ª","rl":"11.ª","t":"Límite de edad de los magistrados","s":"La caducidad de los nombramientos y la duración limitada para magistrados mayores de setenta y cinco años (art. 99, inc. 4) rigen a los cinco años de la sanción de la reforma.","p":["La caducidad de los nombramientos y la duración limitada previstas en el artículo 99 inciso 4 entrarán en vigencia a los cinco años de la sanción de esta reforma constitucional (corresponde al artículo 99 inciso 4)."]},{"n":142,"k":"tra","l":"12.ª","bl":"Disp. 12.ª","nm":"Disposición transitoria 12.ª","rl":"12.ª","t":"Entrada en vigencia del Jefe de Gabinete","s":"Los arts. 100 y 101 sobre el jefe de gabinete rigen desde el 8 de julio de 1995. Se lo designa por primera vez en esa fecha y hasta entonces sus facultades las ejerce el presidente.","p":["Las prescripciones establecidas en los artículos 100 y 101 del Capítulo cuarto de la Sección segunda, de la segunda parte de esta Constitución referidas al jefe de gabinete de ministros, entrarán en vigencia el 8 de julio de 1995.","El jefe de gabinete de ministros será designado por primera vez el 8 de julio de 1995, hasta esa fecha sus facultades serán ejercitadas por el presidente de la República (corresponde a los artículos 99 inciso 7, 100 y 101)."]},{"n":143,"k":"tra","l":"13.ª","bl":"Disp. 13.ª","nm":"Disposición transitoria 13.ª","rl":"13.ª","t":"Designación de jueces inferiores","s":"Desde los 360 días de vigencia de la reforma, los magistrados inferiores solo pueden designarse por el procedimiento constitucional; hasta entonces se aplica el sistema anterior.","p":["A partir de los trescientos sesenta días de la vigencia de esta reforma, los magistrados inferiores solamente podrán ser designados por el procedimiento previsto en la presente Constitución. Hasta tanto se aplicará el sistema vigente con anterioridad (corresponde al artículo 114)."]},{"n":144,"k":"tra","l":"14.ª","bl":"Disp. 14.ª","nm":"Disposición transitoria 14.ª","rl":"14.ª","t":"Causas en trámite de juicio político","s":"Las causas en trámite ante Diputados al instalarse el Consejo de la Magistratura se le remiten a los efectos del inc. 5 del art. 114. Las ingresadas en el Senado continúan allí hasta su terminación.","p":["Las causas en trámite ante la Cámara de Diputados al momento de instalarse el Consejo de la Magistratura, les serán remitidas a efectos del inciso 5 del artículo 114. Las ingresadas en el Senado continuarán allí hasta su terminación (corresponde al artículo 115)."]},{"n":145,"k":"tra","l":"15.ª","bl":"Disp. 15.ª","nm":"Disposición transitoria 15.ª","rl":"15.ª","t":"Transición de la Ciudad de Buenos Aires","s":"Hasta que se constituyan los poderes de la autonomía de la ciudad, el Congreso mantiene legislación exclusiva sobre su territorio. El jefe de gobierno se elige en 1995 y la ley del art. 129 debe sancionarse en 270 días. Hasta el Estatuto Organizativo, los jueces de la ciudad se designan y remueven según los arts. 114 y 115.","p":["Hasta tanto se constituyan los poderes que surjan del nuevo régimen de autonomía de la ciudad de Buenos Aires, el Congreso ejercerá una legislación exclusiva sobre su territorio, en los mismos términos que hasta la sanción de la presente.","El jefe de gobierno será elegido durante el año mil novecientos noventa y cinco. La ley prevista en los párrafos segundo y tercero del artículo 129, deberá ser sancionada dentro del plazo de doscientos setenta días a partir de la vigencia de esta Constitución.","Hasta tanto se haya dictado el Estatuto Organizativo la designación y remoción de los jueces de la ciudad de Buenos Aires se regirá por las disposiciones de los artículos 114 y 115 de esta Constitución (corresponde al artículo 129)."]},{"n":146,"k":"tra","l":"16.ª","bl":"Disp. 16.ª","nm":"Disposición transitoria 16.ª","rl":"16.ª","t":"Vigencia y juramento","s":"La reforma entra en vigencia al día siguiente de su publicación. Los convencionales, el presidente, los presidentes de las Cámaras y de la Corte juran en un mismo acto el 24 de agosto de 1994 en el Palacio San José, Concepción del Uruguay. Cada poder y las autoridades provinciales y municipales disponen lo necesario para que sus miembros juren la Constitución.","p":["Esta reforma entra en vigencia al día siguiente de su publicación. Los miembros de la Convención Constituyente, el presidente de la Nación Argentina, los presidentes de las Cámaras Legislativas y el presidente de la Corte Suprema de Justicia prestan juramento en un mismo acto el día 24 de agosto de 1994, en el Palacio San José, Concepción del Uruguay, provincia de Entre Ríos.","Cada poder del Estado y las autoridades provinciales y municipales disponen lo necesario para que sus miembros y funcionarios juren esta Constitución."]},{"n":147,"k":"tra","l":"17.ª","bl":"Disp. 17.ª","nm":"Disposición transitoria 17.ª","rl":"17.ª","t":"Texto ordenado","s":"El texto constitucional ordenado sancionado por la Convención Constituyente reemplaza al hasta entonces vigente.","p":["El texto constitucional ordenado, sancionado por esta Convención Constituyente, reemplaza al hasta ahora vigente."]}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),N=D.nodes,A=D.arts;
const $=s=>document.querySelector(s),main=$('#main'),side=$('#side');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* ---- estructura ---- */
N.forEach((n,i)=>{n.i=i;n.ch=[]});N.forEach(n=>{if(n.par>=0)N[n.par].ch.push(n.i)});
const nodeOf={},byL={};
N.forEach(n=>n.arts.forEach(x=>nodeOf[x]=n.i));
A.forEach(a=>{if(a.k=='art')byL[a.l.toLowerCase()]=a});
const root=i=>{while(N[i].par>=0)i=N[i].par;return i};
const libros=N.filter(n=>n.lv==1);
const pal=i=>libros.indexOf(N[root(i)]);
const label=n=>n.lab,title=n=>n.name||n.lab;
const sub=i=>{const n=N[i];if(n._s)return n._s;let r=[...n.arts];n.ch.forEach(c=>{r=r.concat(sub(c))});return n._s=r.sort((a,b)=>a-b)};
const rub=a=>a.t||a.bl;
const rng=i=>{const s=sub(i);if(!s.length)return'';const f=A[s[0]],l=A[s[s.length-1]];
  if(s.length==1)return f.k=='tra'?'Disp. '+f.rl:f.k=='pre'?f.rl:'Art. '+f.rl;
  return(f.k=='tra'?'Disp. ':f.k=='pre'?'':'Arts. ')+(f.k=='pre'?'Preámbulo':f.rl)+'–'+l.rl};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m),()=>toast('No se pudo copiar'));
const store={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let view=store.get('cn-view','both');if(!['both','text','comm'].includes(view))view='both';

/* referencias cruzadas a artículos de la Constitución */
const xref=(s,a)=>a.k=='tr'?s:s.replace(/\b((?:art[íi]culos?|arts?\.)\s+)(\d{1,3})\b/gi,(m,p,n)=>byL[n]?`${p}<a class="x" href="#/a/${byL[n].n}">${n}</a>`:m);
const W=/[A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9]+/g;
const hl=(t,terms)=>{if(!terms||!terms.length)return esc(t);let o='',p=0;for(const m of t.matchAll(W)){o+=esc(t.slice(p,m.index));const w=norm(m[0]);o+=terms.some(x=>w.startsWith(x))?'<mark>'+esc(m[0])+'</mark>':esc(m[0]);p=m.index+m[0].length}return o+esc(t.slice(p))};

/* ---- navegación lateral y filtros ---- */
function navNode(i){const n=N[i];
  if(!n.ch.length)return `<a class="l${n.lv==1?' top1':''}" data-n="${i}" href="#/n/${i}" data-p="${pal(i)}">${esc(label(n)+(n.name?' · '+n.name:''))}</a>`;
  return `<details data-n="${i}" data-p="${pal(i)}"><summary>${esc(label(n)+(n.name?' · '+n.name:''))}</summary><a class="l ov" data-n="${i}" href="#/n/${i}">Vista general</a>${n.ch.map(navNode).join('')}</details>`}
function nav(){side.innerHTML='<h5>Índice</h5>'+libros.map(l=>navNode(l.i)).join('');
  $('#fc').innerHTML=`<button class="chip" data-l="" aria-pressed="true">Toda la Constitución</button>`+libros.map(l=>`<button class="chip" data-l="${l.i}" title="${esc(title(l))}" aria-pressed="false">${esc(l.chip||label(l))}</button>`).join('')}
let lib='';
function setLib(v){lib=v;document.querySelectorAll('#fc .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.l===v))}
const inLib=a=>!lib||root(nodeOf[a.n])==+lib;
function markNav(i){side.querySelectorAll('.l').forEach(l=>l.classList.remove('on'));
  const l=side.querySelector(`.l[data-n="${i}"]:not(.ov)`)||side.querySelector(`.l.ov[data-n="${i}"]`);
  if(l){l.classList.add('on');let p=l.parentElement;while(p&&p!==side){if(p.tagName=='DETAILS')p.open=true;p=p.parentElement}}}

/* ---- piezas de interfaz ---- */
const crumbs=i=>{let c=[],k=i;while(k>=0){c.unshift(`<a href="#/n/${k}">${esc(label(N[k]))}</a>`);k=N[k].par}return `<nav class="crumb"><a href="#/">Inicio</a><span>›</span>${c.join('<span>›</span>')}</nav>`};
const path=i=>{let c=[],k=i;while(k>=0){c.unshift(label(N[k])+(N[k].name?' · '+N[k].name:''));k=N[k].par}return c.slice(-2).join(' › ')};
const viewBar=()=>`<div class="seg" role="group" aria-label="Vista">${[['both','Texto y comentarios'],['text','Solo texto'],['comm','Solo comentarios']].map(([k,l])=>`<button data-view="${k}" aria-pressed="${view==k}">${l}</button>`).join('')}</div>`;
function card(i){const n=N[i],s=sub(i);
  const txt=n.ch.length?n.ch.slice(0,4).map(c=>N[c].name||N[c].lab).join(' · ')+(n.ch.length>4?' · …':''):s.slice(0,4).map(x=>rub(A[x])).join(' · ')+(s.length>4?' · …':'');
  return `<a class="card" data-p="${pal(i)}" href="#/n/${i}"><h3>${n.name?`<span class="big">${esc(label(n))}</span><br>${esc(n.name)}`:esc(label(n))}</h3><p>${esc(txt)}</p><div class="meta"><span>${esc(rng(i))}</span><span>${s.length} ${s.length==1?'apartado':'apartados'}</span>${n.ch.length?`<span>${n.ch.length} secciones</span>`:''}</div></a>`}
const foot=()=>`<p class="foot">Texto de la Constitución de la Nación Argentina, según la edición del Ministerio de Justicia y Derechos Humanos de la Nación (SAIJ) cargada como documento fuente. El panel «Comentario resumido» es una síntesis orientativa para facilitar la lectura y no reemplaza el texto original, que es el que prevalece.</p>`;

function rowHTML(a,terms,ctx){
  const body=a.p.map(p=>`<p class="${/^(\d+\.|[a-zñ]\)|[-•–])\s/.test(p)?'inc':''}">${xref(hl(p,terms),a)}</p>`).join('');
  const ttl=a.tt?`<h4>${xref(hl(a.tt,terms),a)}</h4>`:'';
  const nmShort=a.bl;
  return `<article class="row" id="a${a.n}"><section class="tx pn"><header><div class="num">${esc(a.bl)}</div><div><span class="lbl">Texto original</span>${ttl}${ctx?`<span class="ctx">${esc(ctx)}</span>`:''}</div></header>
  <div class="full">${body}</div><div class="acts"><button class="ghost sm" data-act="c" data-n="${a.n}">Copiar texto</button><button class="ghost sm" data-act="l" data-n="${a.n}">Copiar enlace</button></div></section>
  <div class="cm pn"><header><span class="num cnum">${esc(nmShort)}</span><span class="lbl">Comentario resumido</span></header><h4>${hl(rub(a),terms)}</h4><p>${xref(hl(a.s,terms),a)}</p><div class="acts"><button class="ghost sm" data-act="cc" data-n="${a.n}">Copiar comentario</button></div></div></article>`}

function home(){main.dataset.p='';main.dataset.view=view;
  const nArt=A.filter(a=>a.k=='art').length,nTra=A.filter(a=>a.k=='tra').length,nTr=N.filter(n=>n.kind=='Tratado').length,nTrA=A.filter(a=>a.k=='tr').length;
  const quick=N.filter(n=>n.lv>=2&&n.arts.length);
  main.innerHTML=`<section class="hero"><span class="eyebrow">República Argentina</span><h1>Constitución de la Nación Argentina</h1><p>Texto original de cada artículo de la Constitución, acompañado en un panel aparte por un comentario resumido. Incluye el Preámbulo, los 129 artículos (más el 14 bis) y las disposiciones transitorias.</p>
  <div class="stats"><div class="stat"><b>${nArt}</b><span>artículos</span></div><div class="stat"><b>${nTra}</b><span>disposiciones transitorias</span></div>${nTr?`<div class="stat"><b>${nTr}</b><span>tratados</span></div><div class="stat"><b>${nTrA}</b><span>artículos de tratados</span></div>`:''}</div>
  <div class="go"><input id="gn" type="text" placeholder="Ir al artículo N.º (ej. 14 bis)"><button class="btn" id="gb">Ir</button></div></section>
  <div class="sec"><h2>Partes</h2><span>Acceso rápido a cada parte del texto</span></div><div class="grid">${libros.map(l=>card(l.i)).join('')}</div>
  <div class="sec"><h2>Accesos rápidos por capítulo</h2><span>${quick.length} secciones</span></div><div class="grid">${quick.map(n=>card(n.i)).join('')}</div>${foot()}`;
  const go=()=>{const v=$('#gn').value.trim().toLowerCase();byL[v]?location.hash='/a/'+byL[v].n:toast('Ingresá un artículo de la Constitución (ej. 14 bis, 75)')};
  $('#gb').onclick=go;$('#gn').onkeydown=e=>e.key=='Enter'&&go()}

function nodeView(i){const n=N[i],s=sub(i);main.dataset.p=pal(i);main.dataset.view=view;
  let h=crumbs(i)+`<header class="nh"><span class="eyebrow">${esc(label(n))}</span><h1>${esc(title(n))}</h1><div class="meta"><span>${esc(rng(i))}</span><span>${s.length} ${s.length==1?'apartado':'apartados'}</span></div></header>`;
  const lst=n.ch.length?n.ch.map(c=>`<li><a href="#/n/${c}"><b>${esc(label(N[c]))}</b>${N[c].name?' – '+esc(N[c].name):''}</a> <small>(${esc(rng(c))})</small></li>`).join(''):n.arts.map(x=>`<li><a href="#/a/${x}"><b>${esc(A[x].bl)}</b> – ${esc(rub(A[x]))}</a></li>`).join('');
  const nItems=n.ch.length||n.arts.length;
  if(s.length>1||n.ch.length)h+=`<details class="box sumbox"${nItems>8?'':' open'}><summary><h4>Resumen de la sección <span class="chev">▾</span></h4></summary><p>Comprende ${s.length>1?`${n.arts.length&&!n.ch.length?'los apartados':'los apartados'} <b>${esc(A[s[0]].bl)}</b> a <b>${esc(A[s[s.length-1]].bl)}</b> (${s.length} en total)`:`el apartado <b>${esc(A[s[0]].bl)}</b>`}${n.ch.length?`, organizados en ${n.ch.length} secciones:`:', que tratan:'}</p><ul class="${nItems>10?'cols':''}">${lst}</ul></details>`;
  if(n.arts.length)h+=`<div class="bar">${viewBar()}</div>`+n.arts.map(x=>rowHTML(A[x],null,'')).join('');
  if(n.ch.length)h+=`<div class="grid">${n.ch.map(card).join('')}</div>`;
  const u=N.filter(m=>m.arts.length),k=u.indexOf(n);
  if(k>=0)h+=`<div class="pnav">${k>0?`<a class="ghost" href="#/n/${u[k-1].i}">← ${esc(title(u[k-1]))}</a>`:'<span></span>'}${k<u.length-1?`<a class="ghost" href="#/n/${u[k+1].i}">${esc(title(u[k+1]))} →</a>`:''}</div>`;
  main.innerHTML=h+foot();markNav(i)}

/* ---- búsqueda ---- */
const STOP=new Set('de del la las el los lo al a y e o u en con por para que se su sus es son ser un una como si no mas muy le les sobre entre hay ha han este esta cuando donde cual'.split(' '));
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
const stem=w=>{if(/^\d+$/.test(w)||w.length<5)return w;for(const x of ['aciones','acion','mente','ados','adas','idos','idas','ando','iendo','ado','ada','ido','ida','es','s'])if(w.endsWith(x)&&w.length-x.length>=4)return w.slice(0,-x.length);return w};
let ixd=0;const idx=()=>{if(ixd)return;ixd=1;A.forEach(a=>{a._m=[...new Set(words(a.t+' '+a.s+' '+(a.tt||'')+' '+a.bl))];a._a=[...new Set([...a._m,...words(a.p.join(' '))])]})};
function search(v){const terms=[...new Set(words(v).filter(w=>!STOP.has(w)||/^\d+$/.test(w)).map(stem))];if(!terms.length)return route();
  const key=v.trim().toLowerCase();if(byL[key]){location.hash='/a/'+byL[key].n;return}
  idx();main.dataset.p='';main.dataset.view=view;
  const has=(arr,t)=>arr.some(w=>w.startsWith(t));
  const run=need=>A.filter(a=>inLib(a)&&terms.filter(t=>has(a._a,t)).length>=need);
  let rs=run(terms.length),partial=false;if(!rs.length&&terms.length>1){partial=true;rs=run(Math.max(1,Math.ceil(terms.length/2)))}
  rs=rs.map(a=>({a,k:terms.filter(t=>has(a._a,t)).length,s:terms.filter(t=>has(a._m,t)).length})).sort((x,y)=>y.k-x.k||y.s-x.s||x.a.n-y.a.n);
  const MAXR=40;
  main.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Búsqueda</span></nav><div class="sec"><h2>Resultados para «${esc(v)}»</h2><span>${rs.length} resultado${rs.length==1?'':'s'}${rs.length>MAXR?` · se muestran ${MAXR}`:''}${lib?' · '+esc(label(N[+lib])):''}</span></div>
  <p class="hint">${partial?'Coincidencia parcial: no hay artículos con todas las palabras; se muestran los que tienen al menos la mitad. ':''}Busca varias palabras en cualquier orden, tanto en el texto original como en los comentarios.</p><div class="bar">${viewBar()}</div>`+
  (rs.slice(0,MAXR).map(({a})=>rowHTML(a,terms,path(nodeOf[a.n]))).join('')||'<p class="hint">Sin resultados. Probá con otras palabras o quitá el filtro de parte.</p>')+foot();
  side.querySelectorAll('.l').forEach(l=>l.classList.remove('on'))}

/* ---- ruteo ---- */
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/(n|a)\/(\d+)/);side.classList.remove('open');
  const ri=m?(m[1]=='n'?+m[2]:nodeOf[+m[2]]):null;
  if(ri!=null&&N[ri])setLib(String(root(ri)));else setLib('');
  if(!m||(m[1]=='n'&&!N[+m[2]])||(m[1]=='a'&&!A[+m[2]])){home();scrollTo(0,0);side.querySelectorAll('.l.on').forEach(x=>x.classList.remove('on'));return}
  if(m[1]=='n'){nodeView(+m[2]);scrollTo(0,0)}
  else{const n=+m[2];nodeView(nodeOf[n]);const e=document.getElementById('a'+n);if(e){e.classList.add('hit');setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}}
function setView(v){view=v;store.set('cn-view',v);main.dataset.view=v;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view==v))}

document.addEventListener('click',e=>{
  const c=e.target.closest('#fc .chip');if(c){setLib(c.dataset.l);$('#q').value='';location.hash=c.dataset.l?'/n/'+c.dataset.l:'/';route();return}
  const vb=e.target.closest('.seg button');if(vb){setView(vb.dataset.view);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=A[+b.dataset.n],act=b.dataset.act;
  if(act=='c')copy(`${a.nm}${a.tt?' — '+a.tt:''}\n\n`+a.p.join('\n'),'Texto copiado');
  else if(act=='cc')copy(`Comentario resumido · ${a.nm}${a.t?' · '+a.t:''}\n\n`+a.s,'Comentario copiado');
  else if(act=='l')copy(location.href.split('#')[0]+'#/a/'+a.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>search(e.target.value),180)};
$('#menu').onclick=()=>side.classList.toggle('open');
const applyTheme=t=>{if(t)document.documentElement.dataset.theme=t};applyTheme(store.get('cn-theme',''));
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#12161f',t=dk?'light':'dark';r.dataset.theme=t;store.set('cn-theme',t)};
const fitTop=()=>document.documentElement.style.setProperty('--th',$('.top').offsetHeight+'px');
addEventListener('resize',fitTop);addEventListener('hashchange',route);
nav();fitTop();route();setTimeout(fitTop,300);
</script>
</body>
</html>
