so General Constituyente, por voluntad de las provincias) y sus fines: constituir la unión nacional, afianzar la justicia, consolidar la paz interior, proveer a la defensa común, promover el bienestar general y asegurar los beneficios de la libertad. Está abierto a todos los hombres del mundo que quieran habitar el suelo argentino e invoca a Dios como fuente de toda razón y justicia. Sirve de guía para interpretar el resto del texto.","p":["Nos, los representantes del pueblo de la Nación Argentina, reunidos en Congreso General Constituyente por voluntad y elección de las provincias que la componen, en cumplimiento de pactos preexistentes, con el objeto de constituir la unión nacional, afianzar la justicia, consolidar la paz interior, proveer a la defensa común, promover el bienestar general, y asegurar los beneficios de la libertad, para nosotros, para nuestra posteridad, y para todos los hombres del mundo que quieran habitar en el suelo argentino: invocando la protección de Dios, fuente de toda razón y justicia: ordenamos, decretamos y establecemos esta Constitución, para la Nación Argentina."]},{"n":1,"k":"art","l":"1","bl":"Art. 1","nm":"Artículo 1","rl":"1","t":"Forma de gobierno","s":"La Nación adopta la forma representativa (el pueblo gobierna por medio de sus representantes), republicana (división de poderes y publicidad de los actos) y federal (Nación y provincias con competencias propias), tal como la organiza la Constitución.","p":["La Nación Argentina adopta para su gobierno la forma representativa republicana federal, según la establece la presente Constitución."]},{"n":2,"k":"art","l":"2","bl":"Art. 2","nm":"Artículo 2","rl":"2","t":"Sostenimiento del culto","s":"El Gobierno federal sostiene el culto católico apostólico romano. Se lo entiende como un apoyo del Estado a ese culto, sin que implique una religión oficial obligatoria: la libertad de cultos está garantizada en los arts. 14 y 20.","p":["El Gobierno federal sostiene el culto católico apostólico romano."]},{"n":3,"k":"art","l":"3","bl":"Art. 3","nm":"Artículo 3","rl":"3","t":"Capital de la República","s":"Las autoridades federales residen en la ciudad que el Congreso declare Capital por ley especial, previa cesión del territorio por una o más legislaturas provinciales.","p":["Las autoridades que ejercen el Gobierno federal, residen en la ciudad que se declare Capital de la República por una ley especial del Congreso, previa cesión hecha por una o más legislaturas provinciales, del territorio que haya de federalizarse."]},{"n":4,"k":"art","l":"4","bl":"Art. 4","nm":"Artículo 4","rl":"4","t":"Recursos del Tesoro nacional","s":"Enumera con qué fondos el Gobierno federal atiende los gastos de la Nación: derechos de importación y exportación, venta o locación de tierras nacionales, renta de Correos, demás contribuciones que imponga el Congreso (equitativas y proporcionales a la población) y empréstitos u operaciones de crédito que el Congreso decrete.","p":["El Gobierno federal provee a los gastos de la Nación con los fondos del Tesoro nacional formado del producto de derechos de importación y exportación, del de la venta o locación de tierras de propiedad nacional, de la renta de Correos, de las demás contribuciones que equitativa y proporcionalmente a la población imponga el Congreso General, y de los empréstitos y operaciones de crédito que decrete el mismo Congreso para urgencias de la Nación, o para empresas de utilidad nacional."]},{"n":5,"k":"art","l":"5","bl":"Art. 5","nm":"Artículo 5","rl":"5","t":"Autonomía y garantía provincial","s":"Cada provincia dicta su propia Constitución bajo el sistema representativo republicano y conforme a los principios de la Constitución Nacional, asegurando administración de justicia, régimen municipal y educación primaria. A cambio, el Gobierno federal garantiza a cada provincia el goce y ejercicio de sus instituciones.","p":["Cada provincia dictará para sí una Constitución bajo el sistema representativo republicano, de acuerdo con los principios, declaraciones y garantías de la Constitución Nacional; y que asegure su administración de justicia, su régimen municipal, y la educación primaria. Bajo de estas condiciones el Gobierno federal, garante a cada provincia el goce y ejercicio de sus instituciones."]},{"n":6,"k":"art","l":"6","bl":"Art. 6","nm":"Artículo 6","rl":"6","t":"Intervención federal","s":"El Gobierno federal puede intervenir en las provincias para garantizar la forma republicana de gobierno, repeler invasiones exteriores, y a pedido de las autoridades provinciales constituidas para sostenerlas o restablecerlas si fueron depuestas por sedición o por invasión de otra provincia.","p":["El Gobierno federal interviene en el territorio de las provincias para garantir la forma republicana de gobierno, o repeler invasiones exteriores, y a requisición de sus autoridades constituidas para sostenerlas o restablecerlas, si hubiesen sido depuestas por la sedición, o por invasión de otra provincia."]},{"n":7,"k":"art","l":"7","bl":"Art. 7","nm":"Artículo 7","rl":"7","t":"Fe y crédito entre provincias","s":"Los actos públicos y procedimientos judiciales de una provincia son válidos en las demás. El Congreso puede fijar por ley general la forma de probarlos y sus efectos legales.","p":["Los actos públicos y procedimientos judiciales de una provincia gozan de entera fe en las demás; y el Congreso puede por leyes generales determinar cuál será la forma probatoria de estos actos y procedimientos, y los efectos legales que producirán."]},{"n":8,"k":"art","l":"8","bl":"Art. 8","nm":"Artículo 8","rl":"8","t":"Ciudadanía común y extradición","s":"Los ciudadanos de cada provincia gozan en las demás de todos los derechos, privilegios e inmunidades de ciudadano. La extradición de criminales entre provincias es obligatoria y recíproca.","p":["Los ciudadanos de cada provincia gozan de todos los derechos, privilegios e inmunidades inherentes al título de ciudadano en las demás. La extradición de los criminales es de obligación recíproca entre todas las provincias."]},{"n":9,"k":"art","l":"9","bl":"Art. 9","nm":"Artículo 9","rl":"9","t":"Aduanas nacionales","s":"En todo el territorio rigen únicamente aduanas nacionales, con las tarifas que fije el Congreso. No existen aduanas provinciales.","p":["En todo el territorio de la Nación no habrá más aduanas que las nacionales, en las cuales regirán las tarifas que sancione el Congreso."]},{"n":10,"k":"art","l":"10","bl":"Art. 10","nm":"Artículo 10","rl":"10","t":"Libre circulación interior","s":"La circulación de productos nacionales y de mercancías ya despachadas en las aduanas exteriores es libre de derechos dentro del país.","p":["En el interior de la República es libre de derechos la circulación de los efectos de producción o fabricación nacional, así como la de los géneros y mercancías de todas clases, despachadas en las aduanas exteriores."]},{"n":11,"k":"art","l":"11","bl":"Art. 11","nm":"Artículo 11","rl":"11","t":"Libre tránsito entre provincias","s":"Los productos nacionales o extranjeros, el ganado y los medios de transporte que pasen de una provincia a otra no pagan derechos de tránsito, ni ningún otro derecho por el solo hecho de transitar el territorio.","p":["Los artículos de producción o fabricación nacional o extranjera, así como los ganados de toda especie, que pasen por territorio de una provincia a otra, serán libres de los derechos llamados de tránsito, siéndolo también los carruajes buques o bestias en que se transporten; y ningún otro derecho podrá imponérseles en adelante, cualquiera que sea su denominación, por el hecho de transitar el territorio."]},{"n":12,"k":"art","l":"12","bl":"Art. 12","nm":"Artículo 12","rl":"12","t":"Navegación entre provincias","s":"Los buques que van de una provincia a otra no están obligados a entrar, anclar ni pagar derechos de tránsito, y no pueden concederse preferencias a un puerto sobre otro mediante leyes o reglamentos de comercio.","p":["Los buques destinados de una provincia a otra, no serán obligados a entrar, anclar y pagar derechos por causa de tránsito, sin que en ningún caso puedan concederse preferencias a un puerto respecto de otro, por medio de leyes o reglamentos de comercio."]},{"n":13,"k":"art","l":"13","bl":"Art. 13","nm":"Artículo 13","rl":"13","t":"Nuevas provincias","s":"Pueden admitirse nuevas provincias, pero no crear una en el territorio de otra ni fusionar varias en una sin el consentimiento de las legislaturas provinciales interesadas y del Congreso.","p":["Podrán admitirse nuevas provincias en la Nación; pero no podrá erigirse una provincia en el territorio de otra u otras, ni de varias formarse una sola, sin el consentimiento de la Legislatura de las provincias interesadas y del Congreso."]},{"n":14,"k":"art","l":"14","bl":"Art. 14","nm":"Artículo 14","rl":"14","t":"Derechos de los habitantes","s":"Todos los habitantes gozan, conforme a las leyes que reglamenten su ejercicio, de los derechos de: trabajar y ejercer toda industria lícita, navegar y comerciar, peticionar a las autoridades, entrar, permanecer, transitar y salir del país, publicar ideas por la prensa sin censura previa, usar y disponer de su propiedad, asociarse con fines útiles, profesar libremente su culto, y enseñar y aprender.","p":["Todos los habitantes de la Nación gozan de los siguientes derechos conforme a las leyes que reglamenten su ejercicio; a saber: de trabajar y ejercer toda industria lícita; de navegar y comerciar; de peticionar a las autoridades; de entrar, permanecer, transitar y salir del territorio argentino; de publicar sus ideas por la prensa sin censura previa; de usar y disponer de su propiedad; de asociarse con fines útiles; de profesar libremente su culto; de enseñar y aprender."]},{"n":15,"k":"art","l":"14 bis","bl":"Art. 14 bis","nm":"Artículo 14 bis","rl":"14 bis","t":"Trabajo y seguridad social","s":"Protege el trabajo en todas sus formas: condiciones dignas, jornada limitada, descanso y vacaciones pagados, retribución justa, salario mínimo vital y móvil, igual remuneración por igual tarea, protección contra el despido arbitrario, estabilidad del empleado público y sindicato libre. Garantiza a los gremios los convenios colectivos, la conciliación y el arbitraje y el derecho de huelga. Impone una seguridad social integral e irrenunciable, con jubilaciones y pensiones móviles, protección de la familia y acceso a una vivienda digna.","p":["El trabajo en sus diversas formas gozará de la protección de las leyes, las que asegurarán al trabajador: condiciones dignas y equitativas de labor; jornada limitada; descanso y vacaciones pagados; retribución justa; salario mínimo vital móvil; igual remuneración por igual tarea; participación en las ganancias de las empresas, con control de la producción y colaboración en la dirección; protección contra el despido arbitrario; estabilidad del empleado público; organización sindical libre y democrática, reconocida por la simple inscripción en un registro especial.","Queda garantizado a los gremios: concertar convenios colectivos de trabajo; recurrir a la conciliación y al arbitraje; el derecho de huelga. Los representantes gremiales gozarán de las garantías necesarias para el cumplimiento de su gestión sindical y las relacionadas con la estabilidad de su empleo.","El Estado otorgará los beneficios de la seguridad social, que tendrá carácter de integral e irrenunciable. En especial, la ley establecerá: el seguro social obligatorio, que estará a cargo de entidades nacionales o provinciales con autonomía financiera y económica, administradas por los interesados con participación del Estado, sin que pueda existir superposición de aportes; jubilaciones y pensiones móviles; la protección integral de la familia; la defensa del bien de familia; la compensación económica familiar y el acceso a una vivienda digna."]},{"n":16,"k":"art","l":"15","bl":"Art. 15","nm":"Artículo 15","rl":"15","t":"Abolición de la esclavitud","s":"En la Argentina no hay esclavos. La compraventa de personas es un crimen, del que responden quienes la celebren y el escribano o funcionario que la autorice. Los esclavos que ingresen al país quedan libres por el solo hecho de pisar el territorio.","p":["En la Nación Argentina no hay esclavos: los pocos que hoy existen quedan libres desde la jura de esta Constitución; y una ley especial reglará las indemnizaciones a que dé lugar esta declaración. Todo contrato de compra y venta de personas es un crimen de que serán responsables los que lo celebrasen, y el escribano o funcionario que lo autorice. Y los esclavos que de cualquier modo se introduzcan quedan libres por el solo hecho de pisar el territorio de la República."]},{"n":17,"k":"art","l":"16","bl":"Art. 16","nm":"Artículo 16","rl":"16","t":"Igualdad ante la ley","s":"No hay prerrogativas de sangre ni de nacimiento, fueros personales ni títulos de nobleza. Todos los habitantes son iguales ante la ley y admisibles en los empleos sin otra condición que la idoneidad. La igualdad es la base del impuesto y de las cargas públicas.","p":["La Nación Argentina no admite prerrogativas de sangre, ni de nacimiento: no hay en ella fueros personales ni títulos de nobleza. Todos sus habitantes son iguales ante la ley, y admisibles en los empleos sin otra condición que la idoneidad. La igualdad es la base del impuesto y de las cargas públicas."]},{"n":18,"k":"art","l":"17","bl":"Art. 17","nm":"Artículo 17","rl":"17","t":"Propiedad privada","s":"La propiedad es inviolable: solo se puede privar de ella por sentencia fundada en ley. La expropiación requiere calificación de utilidad pública por ley e indemnización previa. Solo el Congreso impone contribuciones. Nadie puede ser obligado a un servicio personal sin ley o sentencia. Autores e inventores son propietarios exclusivos de su obra por el plazo legal. La confiscación de bienes queda abolida y ningún cuerpo armado puede hacer requisiciones.","p":["La propiedad es inviolable, y ningún habitante de la Nación puede ser privado de ella, sino en virtud de sentencia fundada en ley. La expropiación por causa de utilidad pública, debe ser calificada por ley y previamente indemnizada. Sólo el Congreso impone las contribuciones que se expresan en el artículo 4. Ningún servicio personal es exigible, sino en virtud de ley o de sentencia fundada en ley. Todo autor o inventor es propietario exclusivo de su obra, invento o descubrimiento, por el término que le acuerde la ley. La confiscación de bienes queda borrada para siempre del Código Penal argentino. Ningún cuerpo armado puede hacer requisiciones, ni exigir auxilios de ninguna especie."]},{"n":19,"k":"art","l":"18","bl":"Art. 18","nm":"Artículo 18","rl":"18","t":"Debido proceso y garantías penales","s":"Nadie puede ser penado sin juicio previo fundado en ley anterior al hecho ni juzgado por comisiones especiales o jueces no designados antes del hecho. Nadie está obligado a declarar contra sí mismo ni puede ser arrestado sin orden escrita de autoridad competente. Es inviolable la defensa en juicio, el domicilio, la correspondencia y los papeles privados. Abolidos la pena de muerte por causas políticas, el tormento y los azotes. Las cárceles son para seguridad y no para castigo de los detenidos.","p":["Ningún habitante de la Nación puede ser penado sin juicio previo fundado en ley anterior al hecho del proceso, ni juzgado por comisiones especiales, o sacado de los jueces designados por la ley antes del hecho de la causa. Nadie puede ser obligado a declarar contra sí mismo; ni arrestado sino en virtud de orden escrita de autoridad competente. Es inviolable la defensa en juicio de la persona y de los derechos. El domicilio es inviolable, como también la correspondencia epistolar y los papeles privados; y una ley determinará en qué casos y con qué justificativos podrá procederse a su allanamiento y ocupación. Quedan abolidos para siempre la pena de muerte por causas políticas, toda especie de tormento y los azotes. Las cárceles de la Nación serán sanas y limpias, para seguridad y no para castigo de los reos detenidos en ellas, y toda medida que a pretexto de precaución conduzca a mortificarlos más allá de lo que aquélla exija, hará responsable al juez que la autorice."]},{"n":20,"k":"art","l":"19","bl":"Art. 19","nm":"Artículo 19","rl":"19","t":"Principio de legalidad y esfera privada","s":"Las acciones privadas que no ofendan al orden ni a la moral pública ni perjudiquen a terceros están fuera del alcance de los magistrados. Nadie está obligado a hacer lo que la ley no manda ni privado de lo que ella no prohíbe.","p":["Las acciones privadas de los hombres que de ningún modo ofendan al orden y a la moral pública, ni perjudiquen a un tercero, están sólo reservadas a Dios, y exentas de la autoridad de los magistrados. Ningún habitante de la Nación será obligado a hacer lo que no manda la ley, ni privado de lo que ella no prohíbe."]},{"n":21,"k":"art","l":"20","bl":"Art. 20","nm":"Artículo 20","rl":"20","t":"Derechos de los extranjeros","s":"Los extranjeros tienen los mismos derechos civiles que los ciudadanos: ejercer industria, comercio y profesión, poseer bienes raíces, practicar su culto, testar y casarse. No están obligados a adoptar la ciudadanía ni a pagar contribuciones forzosas extraordinarias. Pueden nacionalizarse con dos años continuos de residencia, plazo que la autoridad puede acortar si acreditan servicios a la República.","p":["Los extranjeros gozan en el territorio de la Nación de todos los derechos civiles del ciudadano; pueden ejercer su industria, comercio y profesión; poseer bienes raíces, comprarlos y enajenarlos; navegar los ríos y costas; ejercer libremente su culto; testar y casarse conforme a las leyes. No están obligados a admitir la ciudadanía, ni a pagar contribuciones forzosas extraordinarias. Obtienen nacionalización residiendo dos años continuos en la Nación; pero la autoridad puede acortar este término a favor del que lo solicite, alegando y probando servicios a la República."]},{"n":22,"k":"art","l":"21","bl":"Art. 21","nm":"Artículo 21","rl":"21","t":"Deber de defender la patria","s":"Todo ciudadano argentino debe armarse en defensa de la patria y de la Constitución, conforme a las leyes del Congreso y los decretos del Ejecutivo. Los ciudadanos por naturalización quedan libres de este servicio durante diez años desde que obtienen la ciudadanía.","p":["Todo ciudadano argentino está obligado a armarse en defensa de la patria y de esta Constitución, conforme a las leyes que al efecto dicte el Congreso y a los decretos del Ejecutivo nacional. Los ciudadanos por naturalización son libres de prestar o no este servicio por el término de diez años contados desde el día en que obtengan su carta de ciudadanía."]},{"n":23,"k":"art","l":"22","bl":"Art. 22","nm":"Artículo 22","rl":"22","t":"Soberanía y sedición","s":"El pueblo no delibera ni gobierna sino por medio de sus representantes y autoridades. Toda fuerza armada o reunión de personas que se atribuya los derechos del pueblo y peticione en su nombre comete delito de sedición.","p":["El pueblo no delibera ni gobierna, sino por medio de sus representantes y autoridades creadas por esta Constitución. Toda fuerza armada o reunión de personas que se atribuya los derechos del pueblo y peticione a nombre de éste, comete delito de sedición."]},{"n":24,"k":"art","l":"23","bl":"Art. 23","nm":"Artículo 23","rl":"23","t":"Estado de sitio","s":"En caso de conmoción interior o ataque exterior que pongan en peligro la Constitución y sus autoridades, se declara el estado de sitio en la provincia o territorio afectado, con suspensión de las garantías constitucionales. Durante ese lapso el presidente no puede condenar ni aplicar penas: solo puede arrestar o trasladar personas, que pueden optar por salir del país.","p":["En caso de conmoción interior o de ataque exterior que pongan en peligro el ejercicio de esta Constitución y de las autoridades creadas por ella, se declarará en estado de sitio la provincia o territorio en donde exista la perturbación del orden, quedando suspensas allí las garantías constitucionales. Pero durante esta suspensión no podrá el presidente de la República condenar por sí ni aplicar penas. Su poder se limitará en tal caso respecto de las personas, a arrestarlas o trasladarlas de un punto a otro de la Nación, si ellas no prefiriesen salir fuera del territorio argentino."]},{"n":25,"k":"art","l":"24","bl":"Art. 24","nm":"Artículo 24","rl":"24","t":"Reforma legislativa y jurados","s":"Encomienda al Congreso promover la reforma de la legislación en todos sus ramos y establecer el juicio por jurados.","p":["El Congreso promoverá la reforma de la actual legislación en todos sus ramos, y el establecimiento del juicio por jurados."]},{"n":26,"k":"art","l":"25","bl":"Art. 25","nm":"Artículo 25","rl":"25","t":"Fomento de la inmigración","s":"El Gobierno federal fomenta la inmigración europea y no puede restringir ni gravar con impuestos la entrada de extranjeros que vengan a labrar la tierra, mejorar las industrias o introducir y enseñar ciencias y artes.","p":["El Gobierno federal fomentará la inmigración europea; y no podrá restringir, limitar ni gravar con impuesto alguno la entrada en el territorio argentino de los extranjeros que traigan por objeto labrar la tierra, mejorar las industrias, e introducir y enseñar las ciencias y las artes."]},{"n":27,"k":"art","l":"26","bl":"Art. 26","nm":"Artículo 26","rl":"26","t":"Navegación de los ríos interiores","s":"La navegación de los ríos interiores es libre para todas las banderas, sujeta solo a los reglamentos de la autoridad nacional.","p":["La navegación de los ríos interiores de la Nación es libre para todas las banderas, con sujeción únicamente a los reglamentos que dicte la autoridad nacional."]},{"n":28,"k":"art","l":"27","bl":"Art. 27","nm":"Artículo 27","rl":"27","t":"Tratados de paz y comercio","s":"El Gobierno federal debe afianzar sus relaciones de paz y comercio con las potencias extranjeras mediante tratados conformes a los principios de derecho público establecidos en la Constitución.","p":["El Gobierno federal está obligado a afianzar sus relaciones de paz y comercio con las potencias extranjeras por medio de tratados que estén en conformidad con los principios de derecho público establecidos en esta Constitución."]},{"n":29,"k":"art","l":"28","bl":"Art. 28","nm":"Artículo 28","rl":"28","t":"Razonabilidad de las leyes","s":"Los principios, garantías y derechos reconocidos por la Constitución no pueden ser alterados por las leyes que reglamentan su ejercicio.","p":["Los principios, garantías y derechos reconocidos en los anteriores artículos, no podrán ser alterados por las leyes que reglamenten su ejercicio."]},{"n":30,"k":"art","l":"29","bl":"Art. 29","nm":"Artículo 29","rl":"29","t":"Prohibición de la suma del poder público","s":"El Congreso no puede conceder al Ejecutivo nacional, ni las legislaturas a los gobernadores, facultades extraordinarias ni la suma del poder público. Esos actos son de nulidad insanable y sus autores, quienes los consientan o firmen, incurren en la pena de infames traidores a la patria.","p":["El Congreso no puede conceder al Ejecutivo nacional, ni las Legislaturas provinciales a los gobernadores de provincia, facultades extraordinarias, ni la suma del poder público, ni otorgarles sumisiones o supremacías por las que la vida, el honor o las fortunas de los argentinos queden a merced de gobiernos o persona alguna. Actos de esta naturaleza llevan consigo una nulidad insanable, y sujetarán a los que los formulen, consientan o firmen, a la responsabilidad y pena de los infames traidores a la patria."]},{"n":31,"k":"art","l":"30","bl":"Art. 30","nm":"Artículo 30","rl":"30","t":"Reforma de la Constitución","s":"La Constitución puede reformarse total o parcialmente. El Congreso declara la necesidad de reforma con el voto de al menos dos tercios de sus miembros, pero la reforma solo puede hacerla una Convención convocada al efecto.","p":["La Constitución puede reformarse en el todo o en cualquiera de sus partes. La necesidad de reforma debe ser declarada por el Congreso con el voto de dos terceras partes, al menos, de sus miembros; pero no se efectuará sino por una Convención convocada al efecto."]},{"n":32,"k":"art","l":"31","bl":"Art. 31","nm":"Artículo 31","rl":"31","t":"Supremacía constitucional","s":"La Constitución, las leyes que el Congreso dicta en su consecuencia y los tratados con potencias extranjeras son la ley suprema de la Nación. Las autoridades provinciales deben conformarse a ellas, aunque sus leyes o constituciones digan lo contrario. Para Buenos Aires se exceptúan los tratados ratificados después del Pacto de 11 de noviembre de 1859.","p":["Esta Constitución, las leyes de la Nación que en su consecuencia se dicten por el Congreso y los tratados con las potencias extranjeras son la ley suprema de la Nación; y las autoridades de cada provincia están obligadas a conformarse a ellas, no obstante cualquiera disposición en contrario que contengan las leyes o constituciones provinciales, salvo para la provincia de Buenos Aires, los tratados ratificados después del Pacto de 11 de noviembre de 1859."]},{"n":33,"k":"art","l":"32","bl":"Art. 32","nm":"Artículo 32","rl":"32","t":"Libertad de imprenta","s":"El Congreso federal no puede dictar leyes que restrinjan la libertad de imprenta ni establecer sobre ella la jurisdicción federal.","p":["El Congreso federal no dictará leyes que restrinjan la libertad de imprenta o establezcan sobre ella la jurisdicción federal."]},{"n":34,"k":"art","l":"33","bl":"Art. 33","nm":"Artículo 33","rl":"33","t":"Derechos no enumerados","s":"Los derechos y garantías enumerados no niegan otros no enumerados que nacen del principio de soberanía del pueblo y de la forma republicana de gobierno.","p":["Las declaraciones, derechos y garantías que enumera la Constitución, no serán entendidos como negación de otros derechos y garantías no enumerados; pero que nacen del principio de la soberanía del pueblo y de la forma republicana de gobierno."]},{"n":35,"k":"art","l":"34","bl":"Art. 34","nm":"Artículo 34","rl":"34","t":"Incompatibilidad de jueces y servicio federal","s":"Los jueces de las cortes federales no pueden ser a la vez jueces de tribunales provinciales. El servicio federal, civil o militar, no da residencia en la provincia donde se presta, salvo que sea el domicilio habitual, a los efectos de optar a empleos allí.","p":["Los jueces de las cortes federales no podrán serlo al mismo tiempo de los tribunales de provincia, ni el servicio federal, tanto en lo civil como en lo militar da residencia en la provincia en que se ejerza, y que no sea la del domicilio habitual del empleado, entendiéndose esto para los efectos de optar a empleos en la provincia en que accidentalmente se encuentren."]},{"n":36,"k":"art","l":"35","bl":"Art. 35","nm":"Artículo 35","rl":"35","t":"Nombres oficiales de la Nación","s":"Las denominaciones usadas desde 1810 (Provincias Unidas del Río de la Plata, República Argentina, Confederación Argentina) son nombres oficiales indistintos del Gobierno y del territorio. En la formación y sanción de las leyes se emplea la expresión «Nación Argentina».","p":["Las denominaciones adoptadas sucesivamente desde 1810 hasta el presente, a saber: Provincias Unidas del Río de la Plata; República Argentina, Confederación Argentina, serán en adelante nombres oficiales indistintamente para la designación del Gobierno y territorio de las provincias, empleándose las palabras “Nación Argentina” en la formación y sanción de las leyes."]},{"n":37,"k":"art","l":"36","bl":"Art. 36","nm":"Artículo 36","rl":"36","t":"Defensa del orden democrático","s":"La Constitución mantiene su imperio aunque se interrumpa su observancia por actos de fuerza; esos actos son insanablemente nulos y sus autores quedan sujetos a la pena del art. 29, inhabilitados a perpetuidad y excluidos de indulto y conmutación. Las acciones son imprescriptibles y los ciudadanos tienen derecho de resistencia. También atenta contra la democracia quien cometa un grave delito doloso contra el Estado con enriquecimiento. Manda al Congreso dictar una ley de ética pública.","p":["Esta Constitución mantendrá su imperio aun cuando se interrumpiere su observancia por actos de fuerza contra el orden institucional y el sistema democrático. Estos actos serán insanablemente nulos. Sus autores serán pasibles de la sanción prevista en el artículo 29, inhabilitados a perpetuidad para ocupar cargos públicos y excluidos de los beneficios del indulto y la conmutación de penas.","Tendrán las mismas sanciones quienes, como consecuencia de estos actos, usurparen funciones previstas para las autoridades de esta Constitución o las de las provincias, los que responderán civil y penalmente de sus actos. Las acciones respectivas serán imprescriptibles.","Todos los ciudadanos tienen el derecho de resistencia contra quienes ejecutaren los actos de fuerza enunciados en este artículo.","Atentará asimismo contra el sistema democrático quien incurriere en grave delito doloso contra el Estado que conlleve enriquecimiento, quedando inhabilitado por el tiempo que las leyes determinen para ocupar cargos o empleos públicos.","El Congreso sancionará una ley sobre ética pública para el ejercicio de la función."]},{"n":38,"k":"art","l":"37","bl":"Art. 37","nm":"Artículo 37","rl":"37","t":"Derechos políticos y sufragio","s":"Garantiza el pleno ejercicio de los derechos políticos conforme a la soberanía popular. El sufragio es universal, igual, secreto y obligatorio. La igualdad real de oportunidades entre varones y mujeres para cargos electivos y partidarios se garantiza con acciones positivas en el régimen de partidos y el sistema electoral.","p":["Esta Constitución garantiza el pleno ejercicio de los derechos políticos, con arreglo al principio de la soberanía popular y de las leyes que se dicten en consecuencia. El sufragio es universal, igual, secreto y obligatorio.","La igualdad real de oportunidades entre varones y mujeres para el acceso a cargos electivos y partidarios se garantizará por acciones positivas en la regulación de los partidos políticos y en el régimen electoral."]},{"n":39,"k":"art","l":"38","bl":"Art. 38","nm":"Artículo 38","rl":"38","t":"Partidos políticos","s":"Son instituciones fundamentales del sistema democrático. Su creación y actividad son libres dentro de la Constitución, que garantiza organización y funcionamiento democráticos, representación de las minorías, competencia para postular candidatos, acceso a la información pública y difusión de ideas. El Estado contribuye a su sostenimiento y capacitación, y deben dar publicidad al origen y destino de sus fondos.","p":["Los partidos políticos son instituciones fundamentales del sistema democrático.","Su creación y el ejercicio de sus actividades son libres dentro del respeto a esta Constitución, la que garantiza su organización y funcionamiento democráticos, la representación de las minorías, la competencia para la postulación de candidatos a cargos públicos electivos, el acceso a la información pública y la difusión de sus ideas.","El Estado contribuye al sostenimiento económico de sus actividades y de la capacitación de sus dirigentes.","Los partidos políticos deberán dar publicidad del origen y destino de sus fondos y patrimonio."]},{"n":40,"k":"art","l":"39","bl":"Art. 39","nm":"Artículo 39","rl":"39","t":"Iniciativa popular","s":"Los ciudadanos pueden presentar proyectos de ley en la Cámara de Diputados y el Congreso debe tratarlos en doce meses. Una ley reglamentaria, con mayoría absoluta de cada Cámara, no puede exigir más del 3 % del padrón nacional. No pueden ser objeto de iniciativa popular la reforma constitucional, los tratados, los tributos, el presupuesto ni la materia penal.","p":["Los ciudadanos tienen el derecho de iniciativa para presentar proyectos de ley en la Cámara de Diputados. El Congreso deberá darles expreso tratamiento dentro del término de doce meses.","El Congreso, con el voto de la mayoría absoluta de la totalidad de los miembros de cada Cámara, sancionará una ley reglamentaria que no podrá exigir más del tres por ciento del padrón electoral nacional, dentro del cual deberá contemplar una adecuada distribución territorial para suscribir la iniciativa.","No serán objeto de iniciativa popular los proyectos referidos a reforma constitucional, tratados internacionales, tributos, presupuesto y materia penal."]},{"n":41,"k":"art","l":"40","bl":"Art. 40","nm":"Artículo 40","rl":"40","t":"Consulta popular","s":"El Congreso, a iniciativa de Diputados, puede someter un proyecto de ley a consulta popular vinculante: si el pueblo lo aprueba, se convierte en ley con promulgación automática y la ley de convocatoria no puede vetarse. El Congreso o el presidente pueden convocar consultas no vinculantes, con voto no obligatorio. Una ley con mayoría absoluta reglamenta materias, procedimientos y oportunidad.","p":["El Congreso, a iniciativa de la Cámara de Diputados, podrá someter a consulta popular un proyecto de ley. La ley de convocatoria no podrá ser vetada. El voto afirmativo del proyecto por el pueblo de la Nación lo convertirá en ley y su promulgación será automática.","El Congreso o el presidente de la Nación, dentro de sus respectivas competencias, podrán convocar a consulta popular no vinculante. En este caso el voto no será obligatorio.","El Congreso, con el voto de la mayoría absoluta de la totalidad de los miembros de cada Cámara, reglamentará las materias, procedimientos y oportunidad de la consulta popular."]},{"n":42,"k":"art","l":"41","bl":"Art. 41","nm":"Artículo 41","rl":"41","t":"Ambiente sano","s":"Todos los habitantes tienen derecho a un ambiente sano y equilibrado y el deber de preservarlo; el daño ambiental obliga prioritariamente a recomponer. Las autoridades protegen este derecho, el uso racional de los recursos, el patrimonio natural y cultural y la biodiversidad. La Nación dicta los presupuestos mínimos de protección y las provincias los complementan. Se prohíbe el ingreso de residuos peligrosos y radiactivos.","p":["Todos los habitantes gozan del derecho a un ambiente sano, equilibrado, apto para el desarrollo humano y para que las actividades productivas satisfagan las necesidades presentes sin comprometer las de las generaciones futuras; y tienen el deber de preservarlo. El daño ambiental generará prioritariamente la obligación de recomponer, según lo establezca la ley.","Las autoridades proveerán a la protección de este derecho, a la utilización racional de los recursos naturales, a la preservación del patrimonio natural y cultural y de la diversidad biológica, y a la información y educación ambientales.","Corresponde a la Nación dictar las normas que contengan los presupuestos mínimos de protección, y a las provincias, las necesarias para complementarlas, sin que aquéllas alteren las jurisdicciones locales.","Se prohíbe el ingreso al territorio nacional de residuos actual o potencialmente peligrosos, y de los radiactivos."]},{"n":43,"k":"art","l":"42","bl":"Art. 42","nm":"Artículo 42","rl":"42","t":"Consumidores y usuarios","s":"Los consumidores y usuarios tienen derecho a la protección de su salud, seguridad e intereses económicos, a información adecuada y veraz, a la libertad de elección y a trato equitativo y digno. Las autoridades deben proteger estos derechos, defender la competencia, controlar monopolios y servicios públicos y promover asociaciones de consumidores. La ley prevé procedimientos eficaces y marcos regulatorios con participación de usuarios y provincias.","p":["Los consumidores y usuarios de bienes y servicios tienen derecho, en la relación de consumo, a la protección de su salud, seguridad e intereses económicos; a una información adecuada y veraz; a la libertad de elección y a condiciones de trato equitativo y digno.","Las autoridades proveerán a la protección de esos derechos, a la educación para el consumo, a la defensa de la competencia contra toda forma de distorsión de los mercados, al control de los monopolios naturales y legales, al de la calidad y eficiencia de los servicios públicos, y a la constitución de asociaciones de consumidores y de usuarios.","La legislación establecerá procedimientos eficaces para la prevención y solución de conflictos, y los marcos regulatorios de los servicios públicos de competencia nacional, previendo la necesaria participación de las asociaciones de consumidores y usuarios y de las provincias interesadas, en los organismos de control."]},{"n":44,"k":"art","l":"43","bl":"Art. 43","nm":"Artículo 43","rl":"43","t":"Amparo, hábeas data y hábeas corpus","s":"Toda persona puede interponer acción expedita y rápida de amparo cuando no exista otro medio judicial más idóneo, contra actos u omisiones de autoridades o particulares que lesionen con arbitrariedad o ilegalidad manifiesta derechos reconocidos por la Constitución, un tratado o una ley; el juez puede declarar la inconstitucionalidad de la norma aplicada. Legitima al afectado, al defensor del pueblo y a asociaciones en amparos colectivos (discriminación, ambiente, consumo). Prevé el hábeas data para conocer y corregir datos personales y el hábeas corpus, también durante el estado de sitio.","p":["Toda persona puede interponer acción expedita y rápida de amparo, siempre que no exista otro medio judicial más idóneo, contra todo acto u omisión de autoridades públicas o de particulares, que en forma actual o inminente lesione, restrinja, altere o amenace, con arbitrariedad o ilegalidad manifiesta, derechos y garantías reconocidos por esta Constitución, un tratado o una ley. En el caso, el juez podrá declarar la inconstitucionalidad de la norma en que se funde el acto u omisión lesiva.","Podrán interponer esta acción contra cualquier forma de discriminación y en lo relativo a los derechos que protegen al ambiente, a la competencia, al usuario y al consumidor, así como a los derechos de incidencia colectiva en general, el afectado, el defensor del pueblo y las asociaciones que propendan a esos fines, registradas conforme a la ley, la que determinará los requisitos y formas de su organización.","Toda persona podrá interponer esta acción para tomar conocimiento de los datos a ella referidos y de su finalidad, que consten en registros o bancos de datos públicos, o los privados destinados a proveer informes, y en caso de falsedad o discriminación, para exigir la supresión, rectificación, confidencialidad o actualización de aquéllos. No podrá afectarse el secreto de las fuentes de información periodística.","Cuando el derecho lesionado, restringido, alterado o amenazado fuera la libertad física, o en caso de agravamiento ilegítimo en la forma o condiciones de detención, o en el de desaparición forzada de personas, la acción de hábeas corpus podrá ser interpuesta por el afectado o por cualquiera en su favor y el juez resolverá de inmediato, aun durante la vigencia del estado de sitio."]},{"n":45,"k":"art","l":"44","bl":"Art. 44","nm":"Artículo 44","rl":"44","t":"Poder Legislativo","s":"El Poder Legislativo de la Nación lo ejerce un Congreso de dos Cámaras: Diputados de la Nación y Senadores de las provincias y de la ciudad de Buenos Aires.","p":["Un Congreso compuesto de dos Cámaras, una de diputados de la Nación y otra de senadores de las provincias y de la ciudad de Buenos Aires, será investido del Poder Legislativo de la Nación."]},{"n":46,"k":"art","l":"45","bl":"Art. 45","nm":"Artículo 45","rl":"45","t":"Cámara de Diputados: composición","s":"Se compone de representantes elegidos directamente por el pueblo de las provincias, de la ciudad de Buenos Aires y de la Capital en caso de traslado, que forman distritos electorales de un solo Estado, a simple pluralidad de sufragios. La base es un diputado cada 33.000 habitantes o fracción no menor de 16.500, y tras cada censo el Congreso fija la representación, pudiendo aumentarla pero no reducir la base.","p":["La Cámara de Diputados se compondrá de representantes elegidos directamente por el pueblo de las provincias, de la ciudad de Buenos Aires, y de la Capital en caso de traslado, que se consideran a este fin como distritos electorales de un solo Estado y a simple pluralidad de sufragios.","El número de representantes será de uno por cada treinta y tres mil habitantes o fracción que no baje de dieciséis mil quinientos.","Después de la realización de cada censo, el Congreso fijará la representación con arreglo al mismo, pudiendo aumentar pero no disminuir la base expresada para cada diputado."]},{"n":47,"k":"art","l":"46","bl":"Art. 46","nm":"Artículo 46","rl":"46","t":"Diputados de la primera Legislatura","s":"Fija cuántos diputados correspondía elegir a cada provincia para la primera Legislatura. Es una norma de carácter histórico-transitorio.","p":["Los diputados para la primera Legislatura se nombrarán en la proporción siguiente: por la provincia de Buenos Aires doce: por la de Córdoba seis: por la de Catamarca tres: por la de Corrientes cuatro: por la de Entre Ríos dos: por la de Jujuy dos: por la de Mendoza tres: por la de La Rioja dos: por la de Salta tres: por la de Santiago cuatro: por la de San Juan dos: por la de Santa Fe dos: por la de San Luis dos: y por la de Tucumán tres."]},{"n":48,"k":"art","l":"47","bl":"Art. 47","nm":"Artículo 47","rl":"47","t":"Censo general","s":"Para la segunda Legislatura debía hacerse el censo general y ajustarse a él el número de diputados. El censo solo puede renovarse cada diez años.","p":["Para la segunda Legislatura deberá realizarse el censo general, y arreglarse a él el número de diputados; pero este censo sólo podrá renovarse cada diez años."]},{"n":49,"k":"art","l":"48","bl":"Art. 48","nm":"Artículo 48","rl":"48","t":"Requisitos para ser diputado","s":"Se requiere tener 25 años cumplidos, cuatro años de ciudadanía en ejercicio y ser natural de la provincia que lo elige o tener dos años de residencia inmediata en ella.","p":["Para ser diputado se requiere haber cumplido la edad de veinticinco años, tener cuatro años de ciudadanía en ejercicio, y ser natural de la provincia que lo elija, o con dos años de residencia inmediata en ella."]},{"n":50,"k":"art","l":"49","bl":"Art. 49","nm":"Artículo 49","rl":"49","t":"Elección directa de diputados","s":"Disponía que, por esa vez, las legislaturas provinciales reglaran los medios de hacer efectiva la elección directa de los diputados y que, en lo sucesivo, el Congreso dictara una ley general. Es una norma de aplicación histórica.","p":["Por esta vez las Legislaturas de las provincias reglarán los medios de hacer efectiva la elección directa de los diputados de la Nación: para lo sucesivo el Congreso expedirá una ley general."]},{"n":51,"k":"art","l":"50","bl":"Art. 50","nm":"Artículo 50","rl":"50","t":"Duración y renovación","s":"Los diputados duran cuatro años en su representación y son reelegibles. La Cámara se renueva por mitad cada dos años; los de la primera Legislatura sorteaban quiénes salían en el primer período.","p":["Los diputados durarán en su representación por cuatro años, y son reelegibles; pero la Sala se renovará por mitad cada bienio; a cuyo efecto los nombrados para la primera Legislatura, luego que se reúnan, sortearán los que deban salir en el primer período."]},{"n":52,"k":"art","l":"51","bl":"Art. 51","nm":"Artículo 51","rl":"51","t":"Vacantes en Diputados","s":"Si queda vacante una banca, el gobierno de la provincia o de la Capital hace proceder a la elección legal de un nuevo miembro.","p":["En caso de vacante, el gobierno de provincia, o de la Capital, hace proceder a elección legal de un nuevo miembro."]},{"n":53,"k":"art","l":"52","bl":"Art. 52","nm":"Artículo 52","rl":"52","t":"Iniciativa exclusiva de Diputados","s":"Corresponde exclusivamente a la Cámara de Diputados la iniciativa de las leyes sobre contribuciones y reclutamiento de tropas.","p":["A la Cámara de Diputados corresponde exclusivamente la iniciativa de las leyes sobre contribuciones y reclutamiento de tropas."]},{"n":54,"k":"art","l":"53","bl":"Art. 53","nm":"Artículo 53","rl":"53","t":"Juicio político: acusación","s":"Solo Diputados puede acusar ante el Senado al presidente, vicepresidente, jefe de gabinete, ministros y miembros de la Corte Suprema, por mal desempeño, delito en el ejercicio de sus funciones o crímenes comunes, tras declarar haber lugar a la formación de causa por dos tercios de sus miembros presentes.","p":["Sólo ella ejerce el derecho de acusar ante el Senado al presidente, vicepresidente, al jefe de gabinete de ministros, a los ministros y a los miembros de la Corte Suprema, en las causas de responsabilidad que se intenten contra ellos, por mal desempeño o por delito en el ejercicio de sus funciones; o por crímenes comunes, después de haber conocido de ellos y declarado haber lugar a la formación de causa por la mayoría de dos terceras partes de sus miembros presentes."]},{"n":55,"k":"art","l":"54","bl":"Art. 54","nm":"Artículo 54","rl":"54","t":"Senado: composición","s":"El Senado se compone de tres senadores por cada provincia y tres por la ciudad de Buenos Aires, elegidos en forma directa y conjunta: dos bancas para el partido más votado y una para el que le sigue. Cada senador tiene un voto.","p":["El Senado se compondrá de tres senadores por cada provincia y tres por la ciudad de Buenos Aires, elegidos en forma directa y conjunta, correspondiendo dos bancas al partido político que obtenga el mayor número de votos, y la restante al partido político que le siga en número de votos. Cada senador tendrá un voto."]},{"n":56,"k":"art","l":"55","bl":"Art. 55","nm":"Artículo 55","rl":"55","t":"Requisitos para ser senador","s":"Se requiere tener 30 años, seis años de ciudadanía, una renta anual de dos mil pesos fuertes o ingreso equivalente, y ser natural de la provincia que elige o tener dos años de residencia inmediata en ella.","p":["Son requisitos para ser elegidos senador: tener la edad de treinta años, haber sido seis años ciudadano de la Nación, disfrutar de una renta anual de dos mil pesos fuertes o de una entrada equivalente, y ser natural de la provincia que lo elija, o con dos años de residencia inmediata en ella."]},{"n":57,"k":"art","l":"56","bl":"Art. 56","nm":"Artículo 56","rl":"56","t":"Duración y renovación del Senado","s":"Los senadores duran seis años, son reelegibles indefinidamente y el Senado se renueva por tercios de los distritos electorales cada dos años.","p":["Los senadores duran seis años en el ejercicio de su mandato, y son reelegibles indefinidamente; pero el Senado se renovará a razón de una tercera parte de los distritos electorales cada dos años."]},{"n":58,"k":"art","l":"57","bl":"Art. 57","nm":"Artículo 57","rl":"57","t":"Presidencia del Senado","s":"El vicepresidente de la Nación preside el Senado, pero solo vota en caso de empate.","p":["El vicepresidente de la Nación será presidente del Senado; pero no tendrá voto sino en el caso que haya empate en la votación."]},{"n":59,"k":"art","l":"58","bl":"Art. 58","nm":"Artículo 58","rl":"58","t":"Presidente provisorio","s":"El Senado nombra un presidente provisorio que lo preside cuando falta el vicepresidente o este ejerce la presidencia de la Nación.","p":["El Senado nombrará un presidente provisorio que lo presida en caso de ausencia del vicepresidente, o cuando éste ejerce las funciones de presidente de la Nación."]},{"n":60,"k":"art","l":"59","bl":"Art. 59","nm":"Artículo 59","rl":"59","t":"Juicio político: juzgamiento","s":"El Senado juzga en juicio público a los acusados por Diputados, bajo juramento. Cuando se juzga al presidente de la Nación, lo preside el presidente de la Corte Suprema. Nadie puede ser declarado culpable sino por dos tercios de los miembros presentes.","p":["Al Senado corresponde juzgar en juicio público a los acusados por la Cámara de Diputados, debiendo sus miembros prestar juramento para este acto. Cuando el acusado sea el presidente de la Nación, el Senado será presidido por el presidente de la Corte Suprema. Ninguno será declarado culpable sino a mayoría de los dos tercios de los miembros presentes."]},{"n":61,"k":"art","l":"60","bl":"Art. 60","nm":"Artículo 60","rl":"60","t":"Efectos del fallo del Senado","s":"El fallo solo puede destituir al acusado y declararlo incapaz de ocupar empleos de honor, de confianza o a sueldo en la Nación. Además, el condenado queda sujeto a acusación, juicio y castigo ante los tribunales ordinarios.","p":["Su fallo no tendrá más efecto que destituir al acusado, y aun declararle incapaz de ocupar ningún empleo de honor, de confianza o a sueldo en la Nación. Pero la parte condenada quedará, no obstante, sujeta a acusación, juicio y castigo conforme a las leyes ante los tribunales ordinarios."]},{"n":62,"k":"art","l":"61","bl":"Art. 61","nm":"Artículo 61","rl":"61","t":"Autorización del estado de sitio","s":"Corresponde al Senado autorizar al presidente a declarar el estado de sitio en uno o varios puntos del país en caso de ataque exterior.","p":["Corresponde también al Senado autorizar al presidente de la Nación para que declare en estado de sitio, uno o varios puntos de la República en caso de ataque exterior."]},{"n":63,"k":"art","l":"62","bl":"Art. 62","nm":"Artículo 62","rl":"62","t":"Vacantes en el Senado","s":"Si vaca una banca por muerte, renuncia u otra causa, el gobierno correspondiente hace proceder de inmediato a elegir un nuevo senador.","p":["Cuando vacase alguna plaza de senador por muerte, renuncia u otra causa, el Gobierno a que corresponda la vacante hace proceder inmediatamente a la elección de un nuevo miembro."]},{"n":64,"k":"art","l":"63","bl":"Art. 63","nm":"Artículo 63","rl":"63","t":"Sesiones del Congreso","s":"Ambas Cámaras se reúnen por sí mismas en sesiones ordinarias del 1.º de marzo al 30 de noviembre de cada año. Pueden ser convocadas a sesiones extraordinarias por el presidente o prorrogadas.","p":["Ambas Cámaras se reunirán por sí mismas en sesiones ordinarias todos los años desde el primero de marzo hasta el treinta de noviembre. Pueden también ser convocadas extraordinariamente por el presidente de la Nación o prorrogadas sus sesiones."]},{"n":65,"k":"art","l":"64","bl":"Art. 64","nm":"Artículo 64","rl":"64","t":"Quórum y juez de elecciones","s":"Cada Cámara juzga la validez de las elecciones, derechos y títulos de sus miembros. No entra en sesión sin mayoría absoluta de sus miembros, aunque un número menor puede compeler a los ausentes a concurrir.","p":["Cada Cámara es juez de las elecciones, derechos y títulos de sus miembros en cuanto a su validez. Ninguna de ellas entrará en sesión sin la mayoría absoluta de sus miembros; pero un número menor podrá compeler a los miembros ausentes a que concurran a las sesiones, en los términos y bajo las penas que cada Cámara establecerá."]},{"n":66,"k":"art","l":"65","bl":"Art. 65","nm":"Artículo 65","rl":"65","t":"Sesiones simultáneas","s":"Ambas Cámaras comienzan y terminan sus sesiones al mismo tiempo. Mientras estén reunidas, ninguna puede suspender sus sesiones por más de tres días sin consentimiento de la otra.","p":["Ambas Cámaras empiezan y concluyen sus sesiones simultáneamente. Ninguna de ellas, mientras se hallen reunidas, podrá suspender sus sesiones más de tres días, sin el consentimiento de la otra."]},{"n":67,"k":"art","l":"66","bl":"Art. 66","nm":"Artículo 66","rl":"66","t":"Reglamento y sanciones a miembros","s":"Cada Cámara dicta su reglamento y, con dos tercios, puede corregir a un miembro por desorden de conducta, removerlo por inhabilidad física o moral sobreviniente o excluirlo. Las renuncias se deciden por mayoría de uno sobre la mitad de los presentes.","p":["Cada Cámara hará su reglamento y podrá con dos tercios de votos, corregir a cualquiera de sus miembros por desorden de conducta en el ejercicio de sus funciones, o removerlo por inhabilidad física o moral sobreviniente a su incorporación, y hasta excluirle de su seno; pero bastará la mayoría de uno sobre la mitad de los presentes para decidir en las renuncias que voluntariamente hicieren de sus cargos."]},{"n":68,"k":"art","l":"67","bl":"Art. 67","nm":"Artículo 67","rl":"67","t":"Juramento de legisladores","s":"Senadores y diputados juran, al incorporarse, desempeñar debidamente el cargo y obrar conforme a la Constitución.","p":["Los senadores y diputados prestarán, en el acto de su incorporación, juramento de desempeñar debidamente el cargo, y de obrar en todo en conformidad a lo que prescribe esta Constitución."]},{"n":69,"k":"art","l":"68","bl":"Art. 68","nm":"Artículo 68","rl":"68","t":"Inmunidad de opinión","s":"Ningún miembro del Congreso puede ser acusado, interrogado judicialmente ni molestado por las opiniones o discursos que emita en el desempeño de su mandato.","p":["Ninguno de los miembros del Congreso puede ser acusado, interrogado judicialmente, ni molestado por las opiniones o discursos que emita desempeñando su mandato de legislador."]},{"n":70,"k":"art","l":"69","bl":"Art. 69","nm":"Artículo 69","rl":"69","t":"Inmunidad de arresto","s":"Desde su elección hasta su cese, ningún legislador puede ser arrestado, salvo que sea sorprendido in fraganti cometiendo un crimen que merezca pena de muerte, infamante u otra aflictiva; en ese caso se informa a la Cámara respectiva con la información sumaria del hecho.","p":["Ningún senador o diputado, desde el día de su elección hasta el de su cese, puede ser arrestado; excepto el caso de ser sorprendido in fraganti en la ejecución de algún crimen que merezca pena de muerte, infamante, u otra aflictiva; de lo que se dará cuenta a la Cámara respectiva con la información sumaria del hecho."]},{"n":71,"k":"art","l":"70","bl":"Art. 70","nm":"Artículo 70","rl":"70","t":"Desafuero","s":"Si se presenta querella escrita ante la justicia ordinaria contra un legislador, la Cámara respectiva, examinado el sumario en juicio público, puede suspenderlo con dos tercios de votos y ponerlo a disposición del juez competente.","p":["Cuando se forme querella por escrito ante las justicias ordinarias contra cualquier senador o diputado, examinado el mérito del sumario en juicio público, podrá cada Cámara, con dos tercios de votos, suspender en sus funciones al acusado, y ponerlo a disposición del juez competente para su juzgamiento."]},{"n":72,"k":"art","l":"71","bl":"Art. 71","nm":"Artículo 71","rl":"71","t":"Interpelación de ministros","s":"Cada Cámara puede hacer venir a su sala a los ministros del Poder Ejecutivo para recibir las explicaciones e informes que estime convenientes.","p":["Cada una de las Cámaras puede hacer venir a su sala a los ministros del Poder Ejecutivo para recibir las explicaciones e informes que estime convenientes."]},{"n":73,"k":"art","l":"72","bl":"Art. 72","nm":"Artículo 72","rl":"72","t":"Empleos del Poder Ejecutivo","s":"Ningún miembro del Congreso puede recibir empleo o comisión del Poder Ejecutivo sin consentimiento previo de su Cámara, salvo empleos de escala.","p":["Ningún miembro del Congreso podrá recibir empleo o comisión del Poder Ejecutivo, sin previo consentimiento de la Cámara respectiva, excepto los empleos de escala."]},{"n":74,"k":"art","l":"73","bl":"Art. 73","nm":"Artículo 73","rl":"73","t":"Incompatibilidades","s":"Los eclesiásticos regulares no pueden ser miembros del Congreso, ni los gobernadores de provincia por la provincia de su mando.","p":["Los eclesiásticos regulares no pueden ser miembros del Congreso, ni los gobernadores de provincia por la de su mando."]},{"n":75,"k":"art","l":"74","bl":"Art. 74","nm":"Artículo 74","rl":"74","t":"Remuneración de legisladores","s":"Los servicios de senadores y diputados son remunerados por el Tesoro de la Nación con una dotación que señala la ley.","p":["Los servicios de los senadores y diputados son remunerados por el Tesoro de la Nación, con una dotación que señalará la ley."]},{"n":76,"k":"art","l":"75","bl":"Art. 75","nm":"Artículo 75","rl":"75","t":"Atribuciones del Congreso","s":"Enumera las facultades del Congreso en 32 incisos: legislar en materia aduanera y fijar contribuciones (con régimen de coparticipación federal), contraer empréstitos, presupuesto, moneda y banco federal, dictar los códigos de fondo (Civil, Comercial, Penal, Minería y Trabajo y Seguridad Social), comercio, límites y provincias, reconocer la preexistencia de los pueblos indígenas (inc. 17), educación y cultura, crear tribunales inferiores y conceder amnistías, aprobar tratados (los tratados tienen jerarquía superior a las leyes y los de derechos humanos listados en el inc. 22 tienen jerarquía constitucional), legislar medidas de acción positiva (inc. 23), aprobar tratados de integración, declarar la guerra, aprobar el estado de sitio, legislar en la Capital, disponer la intervención federal y dictar las leyes necesarias para ejercer estos poderes (inc. 32).","p":["Corresponde al Congreso:","1. Legislar en materia aduanera. Establecer los derechos de importación y exportación, los cuales, así como las avaluaciones sobre las que recaigan, serán uniformes en toda la Nación.","2. Imponer contribuciones indirectas como facultad concurrente con las provincias. Imponer contribuciones directas, por tiempo determinado, proporcionalmente iguales en todo el territorio de la Nación, siempre que la defensa, seguridad común y bien general del Estado lo exijan. Las contribuciones previstas en este inciso, con excepción de la parte o el total de las que tengan asignación específica, son coparticipables.","Una ley convenio, sobre la base de acuerdos entre la Nación y las provincias, instituirá regímenes de coparticipación de estas contribuciones, garantizando la automaticidad en la remisión de los fondos.","La distribución entre la Nación, las provincias y la ciudad de Buenos Aires y entre éstas, se efectuará en relación directa a las competencias, servicios y funciones de cada una de ellas contemplando criterios objetivos de reparto; será equitativa, solidaria y dará prioridad al logro de un grado equivalente de desarrollo, calidad de vida e igualdad de oportunidades en todo el territorio nacional.","La ley convenio tendrá como Cámara de origen el Senado y deberá ser sancionada con la mayoría absoluta de la totalidad de los miembros de cada Cámara, no podrá ser modificada unilateralmente ni reglamentada y será aprobada por las provincias.","No habrá transferencia de competencias, servicios o funciones sin la respectiva reasignación de recursos, aprobada por la ley del Congreso cuando correspondiere y por la provincia interesada o la ciudad de Buenos Aires en su caso.","Un organismo fiscal federal tendrá a su cargo el control y fiscalización de la ejecución de lo establecido en este inciso, según lo determine la ley, la que deberá asegurar la representación de todas las provincias y la ciudad de Buenos Aires en su composición.","3. Establecer y modificar asignaciones específicas de recursos coparticipables, por tiempo determinado, por ley especial aprobada por la mayoría absoluta de la totalidad de los miembros de cada Cámara.","4. Contraer empréstitos sobre el Crédito de la Nación.","5. Disponer del uso y de la enajenación de las tierras de propiedad nacional.","6. Establecer y reglamentar un banco federal con facultad de emitir moneda, así como otros bancos nacionales.","7. Arreglar el pago de la deuda interior y exterior de la Nación.","8. Fijar anualmente, conforme a las pautas establecidas en el tercer párrafo del inciso 2 de este artículo, el presupuesto general de gastos y cálculo de recursos de la administración nacional, en base al programa general de gobierno y al plan de inversiones públicas y aprobar o desechar la cuenta de inversión.","9. Acordar subsidios del Tesoro nacional a las provincias, cuyas rentas no alcancen, según sus presupuestos, a cubrir sus gastos ordinarios.","10. Reglamentar la libre navegación de los ríos interiores, habilitar los puertos que considere convenientes, y crear o suprimir aduanas.","11. Hacer sellar moneda, fijar su valor y el de las extranjeras; y adoptar un sistema uniforme de pesos y medidas para toda la Nación.","12. Dictar los códigos Civil, Comercial, Penal, de Minería, y del Trabajo y Seguridad Social, en cuerpos unificados o separados, sin que tales códigos alteren las jurisdicciones locales, correspondiendo su aplicación a los tribunales federales o provinciales, según que las cosas o las personas cayeren bajo sus respectivas jurisdicciones; y especialmente leyes generales para toda la Nación sobre naturalización y nacionalidad, con sujeción al principio de nacionalidad natural y por opción en beneficio de la argentina: así como sobre bancarrotas, sobre falsificación de la moneda corriente y documentos públicos del Estado, y las que requiera el establecimiento del juicio por jurados.","13. Reglar el comercio con las naciones extranjeras, y de las provincias entre sí.","14. Arreglar y establecer los correos generales de la Nación.","15. Arreglar definitivamente los límites del territorio de la Nación, fijar los de las provincias, crear otras nuevas, y determinar por una legislación especial la organización, administración y gobierno que deben tener los territorios nacionales, que queden fuera de los límites que se asignen a las provincias.","16. Proveer a la seguridad de las fronteras.","17. Reconocer la preexistencia étnica y cultural de los pueblos indígenas argentinos.","Garantizar el respeto a su identidad y el derecho a una educación bilingüe e intercultural; reconocer la personería jurídica de sus comunidades, y la posesión y propiedad comunitarias de las tierras que tradicionalmente ocupan; y regular la entrega de otras aptas y suficientes para el desarrollo humano; ninguna de ellas será enajenable, transmisible ni susceptible de gravámenes o embargos.","Asegurar su participación en la gestión referida a sus recursos naturales y a los demás intereses que los afecten. Las provincias pueden ejercer concurrentemente estas atribuciones.","18. Proveer lo conducente a la prosperidad del país, al adelanto y bienestar de todas las provincias, y al progreso de la ilustración, dictando planes de instrucción general y universitaria, y promoviendo la industria, la inmigración, la construcción de ferrocarriles y canales navegables, la colonización de tierras de propiedad nacional, la introducción y establecimiento de nuevas industrias, la importación de capitales extranjeros y la exploración de los ríos interiores, por leyes protectoras de estos fines y por concesiones temporales de privilegios y recompensas de estímulo.","19. Proveer lo conducente al desarrollo humano, al progreso económico con justicia social, a la productividad de la economía nacional, a la generación de empleo, a la formación profesional de los trabajadores, a la defensa del valor de la moneda, a la investigación y al desarrollo científico y tecnológico, su difusión y aprovechamiento.","Proveer al crecimiento armónico de la Nación y al poblamiento de su territorio; promover políticas diferenciadas que tiendan a equilibrar el desigual desarrollo relativo de provincias y regiones. Para estas iniciativas, el Senado será Cámara de origen.","Sancionar leyes de organización y de base de la educación que consoliden la unidad nacional respetando las particularidades provinciales y locales: que aseguren la responsabilidad indelegable del Estado, la participación de la familia y la sociedad, la promoción de los valores democráticos y la igualdad de oportunidades y posibilidades sin discriminación alguna; y que garanticen los principios de gratuidad y equidad de la educación pública estatal y la autonomía y autarquía de las universidades nacionales.","Dictar leyes que protejan la identidad y pluralidad cultural, la libre creación y circulación de las obras del autor; el patrimonio artístico y los espacios culturales y audiovisuales.","20. Establecer tribunales inferiores a la Corte Suprema de Justicia; crear y suprimir empleos, fijar sus atribuciones, dar pensiones, decretar honores, y conceder amnistías generales.","21. Admitir o desechar los motivos de dimisión del presidente o vicepresidente de la República; y declarar el caso de proceder a nueva elección.","22. Aprobar o desechar tratados concluidos con las demás naciones y con las organizaciones internacionales y los concordatos con la Santa Sede. Los tratados y concordatos tienen jerarquía superior a las leyes.","La Declaración Americana de los Derechos y Deberes del Hombre; la Declaración Universal de Derechos Humanos; la Convención Americana sobre Derechos Humanos; el Pacto Internacional de Derechos Económicos, Sociales y Culturales; el Pacto Internacional de Derechos Civiles y Políticos y su Protocolo Facultativo; la Convención sobre la Prevención y la Sanción del Delito de Genocidio; la Convención Internacional sobre la Eliminación de todas las Formas de Discriminación Racial; la Convención sobre la Eliminación de todas las Formas de Discriminación contra la Mujer; la Convención contra la Tortura y otros Tratos o Penas Crueles, Inhumanos o Degradantes; la Convención sobre los Derechos del Niño; en las condiciones de su vigencia, tienen jerarquía constitucional, no derogan artículo alguno de la primera parte de esta Constitución y deben entenderse complementarios de los derechos y garantías por ella reconocidos. Sólo podrán ser denunciados, en su caso, por el Poder Ejecutivo nacional, previa aprobación de las dos terceras partes de la totalidad de los miembros de cada Cámara.","Los demás tratados y convenciones sobre derechos humanos, luego de ser aprobados por el Congreso, requerirán del voto de las dos terceras partes de la totalidad de los miembros de cada Cámara para gozar de la jerarquía constitucional.","23. Legislar y promover medidas de acción positiva que garanticen la igualdad real de oportunidades y de trato, y el pleno goce y ejercicio de los derechos reconocidos por esta Constitución y por los tratados internacionales vigentes sobre derechos humanos, en particular respecto de los niños, las mujeres, los ancianos y las personas con discapacidad.","Dictar un régimen de seguridad social especial e integral en protección del niño en situación de desamparo, desde el embarazo hasta la finalización del período de enseñanza elemental, y de la madre durante el embarazo y el tiempo de lactancia.","24. Aprobar tratados de integración que deleguen competencias y jurisdicción a organizaciones supraestatales en condiciones de reciprocidad e igualdad, y que respeten el orden democrático y los derechos humanos. Las normas dictadas en su consecuencia tienen jerarquía superior a las leyes.","La aprobación de estos tratados con Estados de Latinoamérica requerirá la mayoría absoluta de la totalidad de los miembros de cada Cámara. En el caso de tratados con otros Estados, el Congreso de la Nación, con la mayoría absoluta de los miembros presentes de cada Cámara, declarará la conveniencia de la aprobación del tratado y sólo podrá ser aprobado con el voto de la mayoría absoluta de la totalidad de los miembros de cada Cámara, después de ciento veinte días del acto declarativo.","La denuncia de los tratados referidos a este inciso, exigirá la previa aprobación de la mayoría absoluta de la totalidad de los miembros de cada Cámara.","25. Autorizar al Poder Ejecutivo para declarar la guerra o hacer la paz.","26. Facultar al Poder Ejecutivo para ordenar represalias, y establecer reglamentos para las presas.","27. Fijar las fuerzas armadas en tiempo de paz y guerra, y dictar las normas para su organización y gobierno.","28. Permitir la introducción de tropas Extranjeras en el territorio de la Nación, y la salida de las fuerzas nacionales fuera de él.","29. Declarar en estado de sitio uno o varios puntos de la Nación en caso de conmoción interior, y aprobar o suspender el estado de sitio declarado, durante su receso, por el Poder Ejecutivo.","30. Ejercer una legislación exclusiva en el territorio de la capital de la Nación y dictar la legislación necesaria para el cumplimiento de los fines específicos de los establecimientos de utilidad nacional en el territorio de la República. Las autoridades provinciales y municipales conservarán los poderes de policía e imposición sobre estos establecimientos, en tanto no interfieran en el cumplimiento de aquellos fines.","31. Disponer la intervención federal a una provincia o a la ciudad de Buenos Aires. Aprobar o revocar la intervención decretada, durante su receso, por el Poder Ejecutivo.","32. Hacer todas las leyes y reglamentos que sean convenientes para poner en ejercicio los poderes antecedentes, y todos los otros concedidos por la presente Constitución al Gobierno de la Nación Argentina."]},{"n":77,"k":"art","l":"76","bl":"Art. 76","nm":"Artículo 76","rl":"76","t":"Delegación legislativa","s":"Prohíbe la delegación legislativa en el Poder Ejecutivo, salvo en materias determinadas de administración o de emergencia pública, con plazo fijado y dentro de las bases que establezca el Congreso. La caducidad del plazo no afecta las relaciones jurídicas nacidas al amparo de las normas dictadas.","p":["Se prohíbe la delegación legislativa en el Poder Ejecutivo, salvo en materias determinadas de administración o de emergencia pública, con plazo fijado para su ejercicio y dentro de las bases de la delegación que el Congreso establezca.","La caducidad resultante del transcurso del plazo previsto en el párrafo anterior no importará revisión de las relaciones jurídicas nacidas al amparo de las normas dictadas en consecuencia de la delegación legislativa."]},{"n":78,"k":"art","l":"77","bl":"Art. 77","nm":"Artículo 77","rl":"77","t":"Iniciativa de las leyes","s":"Las leyes pueden tener origen en cualquiera de las Cámaras, por proyectos de sus miembros o del Poder Ejecutivo, salvo las excepciones constitucionales. Los proyectos que modifiquen el régimen electoral y de partidos requieren mayoría absoluta del total de miembros de las Cámaras.","p":["Las leyes pueden tener principio en cualquiera de las Cámaras del Congreso, por proyectos presentados por sus miembros o por el Poder Ejecutivo, salvo las excepciones que establece esta Constitución.","Los proyectos de ley que modifiquen el régimen electoral y de partidos políticos deberán ser aprobados por mayoría absoluta del total de los miembros de las Cámaras."]},{"n":79,"k":"art","l":"78","bl":"Art. 78","nm":"Artículo 78","rl":"78","t":"Trámite de sanción","s":"Aprobado un proyecto por la Cámara de origen, pasa a la otra; aprobado por ambas, pasa al Poder Ejecutivo, que si también lo aprueba lo promulga como ley.","p":["Aprobado un proyecto de ley por la Cámara de su origen, pasa para su discusión a la otra Cámara. Aprobado por ambas, pasa al Poder Ejecutivo de la Nación para su examen; y si también obtiene su aprobación, lo promulga como ley."]},{"n":80,"k":"art","l":"79","bl":"Art. 79","nm":"Artículo 79","rl":"79","t":"Aprobación en comisión","s":"Cada Cámara puede, tras aprobar un proyecto en general, delegar en sus comisiones la aprobación en particular, con mayoría absoluta del total de sus miembros, y dejar sin efecto esa delegación con igual mayoría.","p":["Cada Cámara, luego de aprobar un proyecto de ley en general, puede delegar en sus comisiones la aprobación en particular del proyecto, con el voto de la mayoría absoluta del total de sus miembros. La Cámara podrá, con igual número de votos, dejar sin efecto la delegación y retomar el trámite ordinario. La aprobación en comisión requerirá el voto de la mayoría absoluta del total de sus miembros. Una vez aprobado el proyecto en comisión, se seguirá el trámite ordinario."]},{"n":81,"k":"art","l":"80","bl":"Art. 80","nm":"Artículo 80","rl":"80","t":"Veto y promulgación parcial","s":"Se reputa aprobado por el Poder Ejecutivo todo proyecto no devuelto en diez días útiles. Los proyectos vetados parcialmente no pueden aprobarse en la parte restante, salvo que las partes no observadas tengan autonomía normativa y su aprobación no altere el espíritu ni la unidad del proyecto, con el procedimiento previsto para los decretos de necesidad y urgencia.","p":["Se reputa aprobado por el Poder Ejecutivo todo proyecto no devuelto en el término de diez días útiles. Los proyectos desechados parcialmente no podrán ser aprobados en la parte restante. Sin embargo, las partes no observadas solamente podrán ser promulgadas si tienen autonomía normativa y su aprobación parcial no altera el espíritu ni la unidad del proyecto sancionado por el Congreso. En este caso será de aplicación el procedimiento previsto para los decretos de necesidad y urgencia."]},{"n":82,"k":"art","l":"81","bl":"Art. 81","nm":"Artículo 81","rl":"81","t":"Reiteración y adiciones","s":"Un proyecto desechado totalmente por una Cámara no puede repetirse en las sesiones de ese año. Fija reglas de mayorías cuando la Cámara revisora adiciona o corrige el proyecto, para determinar si prevalece el texto de la cámara de origen o el modificado.","p":["Ningún proyecto de ley desechado totalmente por una de las Cámaras podrá repetirse en las sesiones de aquel año.","Ninguna de las Cámaras puede desechar totalmente un proyecto que hubiera tenido origen en ella y luego hubiese sido adicionado o enmendado por la Cámara revisora. Si el proyecto fuere objeto de adiciones o correcciones por la Cámara revisora, deberá indicarse el resultado de la votación a fin de establecer si tales adiciones o correcciones fueron realizadas por mayoría absoluta de los presentes o por las dos terceras partes de los presentes. La Cámara de origen podrá por mayoría absoluta de los presentes aprobar el proyecto con las adiciones o correcciones introducidas o insistir en la redacción originaria, a menos que las adiciones o correcciones las haya realizado la revisora por dos terceras partes de los presentes. En este último caso, el proyecto pasará al Poder Ejecutivo con las adiciones o correcciones de la Cámara revisora, salvo que la Cámara de origen insista en su redacción originaria con el voto de las dos terceras partes de los presentes. La Cámara de origen no podrá introducir nuevas adiciones o correcciones a las realizadas por la Cámara revisora."]},{"n":83,"k":"art","l":"82","bl":"Art. 82","nm":"Artículo 82","rl":"82","t":"Voluntad expresa","s":"La voluntad de cada Cámara debe manifestarse expresamente. Se excluye en todos los casos la sanción tácita o ficta.","p":["La voluntad de cada Cámara debe manifestarse expresamente; se excluye, en todos los casos, la sanción tácita o ficta."]},{"n":84,"k":"art","l":"83","bl":"Art. 83","nm":"Artículo 83","rl":"83","t":"Veto: insistencia del Congreso","s":"Si el Ejecutivo desecha total o parcialmente un proyecto, vuelve con objeciones a la Cámara de origen. Si ambas Cámaras lo confirman por dos tercios, es ley y pasa al Ejecutivo para su promulgación, con votaciones nominales publicadas. Si difieren sobre las objeciones, no puede repetirse ese año.","p":["Desechado en el todo o en parte un proyecto por el Poder Ejecutivo, vuelve con sus objeciones a la Cámara de su origen: ésta lo discute de nuevo, y si lo confirma por mayoría de dos tercios de votos, pasa otra vez a la Cámara de revisión. Si ambas Cámaras lo sancionan por igual mayoría, el proyecto es ley y pasa al Poder Ejecutivo para su promulgación. Las votaciones de ambas Cámaras serán en este caso nominales, por sí o por no; y tanto los nombres y fundamentos de los sufragantes, como las objeciones del Poder Ejecutivo, se publicarán inmediatamente por la prensa. Si las Cámaras difieren sobre las objeciones, el proyecto no podrá repetirse en las sesiones de aquel año."]},{"n":85,"k":"art","l":"84","bl":"Art. 84","nm":"Artículo 84","rl":"84","t":"Fórmula de sanción","s":"Las leyes se sancionan con la fórmula: «El Senado y Cámara de Diputados de la Nación Argentina, reunidos en Congreso, decretan o sancionan con fuerza de ley».","p":["En la sanción de las leyes se usará de esta fórmula: El Senado y Cámara de Diputados de la Nación Argentina, reunidos en Congreso, decretan o sancionan con fuerza de ley."]},{"n":86,"k":"art","l":"85","bl":"Art. 85","nm":"Artículo 85","rl":"85","t":"Auditoría General de la Nación","s":"El control externo del sector público nacional es atribución del Poder Legislativo y se apoya en los dictámenes de la Auditoría General de la Nación, organismo de asistencia técnica del Congreso con autonomía funcional. Su presidente es designado a propuesta del principal partido de oposición. Controla legalidad, gestión y auditoría de la administración pública e interviene en la aprobación o rechazo de las cuentas de percepción e inversión de fondos públicos.","p":["El control externo del sector público nacional en sus aspectos patrimoniales, económicos, financieros y operativos, será una atribución propia del Poder Legislativo.","El examen y la opinión del Poder Legislativo sobre el desempeño y situación general de la administración pública estarán sustentados en los dictámenes de la Auditoría General de la Nación.","Este organismo de asistencia técnica del Congreso, con autonomía funcional, se integrará del modo que establezca la ley que reglamenta su creación y funcionamiento, que deberá ser aprobada por mayoría absoluta de los miembros de cada Cámara. El presidente del organismo será designado a propuesta del partido político de oposición con mayor número de legisladores en el Congreso.","Tendrá a su cargo el control de legalidad, gestión y auditoría de toda la actividad de la administración pública centralizada y descentralizada, cualquiera fuera su modalidad de organización, y las demás funciones que la ley le otorgue. Intervendrá necesariamente en el trámite de aprobación o rechazo de las cuentas de percepción e inversión de los fondos públicos."]},{"n":87,"k":"art","l":"86","bl":"Art. 86","nm":"Artículo 86","rl":"86","t":"Defensor del Pueblo","s":"Es un órgano independiente, creado en el ámbito del Congreso, con plena autonomía funcional y sin recibir instrucciones. Defiende y protege los derechos humanos y demás derechos e intereses tutelados por la Constitución y las leyes ante actos u omisiones de la Administración y controla el ejercicio de las funciones administrativas. Tiene legitimación procesal, es designado y removido por dos tercios de los presentes de cada Cámara y dura cinco años, con una sola reelección.","p":["El Defensor del Pueblo es un órgano independiente instituido en el ámbito del Congreso de la Nación, que actuará con plena autonomía funcional, sin recibir instrucciones de ninguna autoridad. Su misión es la defensa y protección de los derechos humanos y demás derechos, garantías e intereses tutelados en esta Constitución y las leyes, ante hechos, actos u omisiones de la Administración; y el control del ejercicio de las funciones administrativas públicas.","El Defensor del Pueblo tiene legitimación procesal. Es designado y removido por el Congreso con el voto de las dos terceras partes de los miembros presentes de cada una de las Cámaras. Goza de las inmunidades y privilegios de los legisladores. Durará en su cargo cinco años, pudiendo ser nuevamente designado por una sola vez.","La organización y el funcionamiento de esta institución serán regulados por una ley especial."]},{"n":88,"k":"art","l":"87","bl":"Art. 87","nm":"Artículo 87","rl":"87","t":"Poder Ejecutivo","s":"El Poder Ejecutivo es desempeñado por un ciudadano con el título de «Presidente de la Nación Argentina».","p":["El Poder Ejecutivo de la Nación será desempeñado por un ciudadano con el título de “Presidente de la Nación Argentina”."]},{"n":89,"k":"art","l":"88","bl":"Art. 88","nm":"Artículo 88","rl":"88","t":"Acefalía","s":"Si el presidente se enferma, se ausenta de la Capital, muere, renuncia o es destituido, lo reemplaza el vicepresidente. Si faltan ambos, el Congreso determina qué funcionario ejerce la Presidencia hasta que cese la causa o sea electo un nuevo presidente.","p":["En caso de enfermedad, ausencia de la Capi
