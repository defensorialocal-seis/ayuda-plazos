n": [], "n": 193, "l": "167 bis", "s": "En los casos enunciados en el presente Capítulo, la pena se aumentará en un tercio en su mínimo y en su máximo, cuando quien ejecutare el delito fuere miembro integrante de las fuerzas…", "p": ["En los casos enunciados en el presente Capítulo, la pena se aumentará en un tercio en su mínimo y en su máximo, cuando quien ejecutare el delito fuere miembro integrante de las fuerzas de seguridad, policiales o del servicio penitenciario.", "Capítulo 2 bis: Abigeato"], "nt": ["(Artículo incorporado por art. 3° de la Ley N° 25.816 B.O.9/12/2003)", "(Capítulo incorporado por art. 3° de la Ley N° 25.890 B.O.21/5/2004)"], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Será reprimido con prisión de DOS (2) a SEIS (6) años el que se apoderare ilegítimamente de UNA (1) o más cabezas de ganado…"}], "n": 194, "l": "167 ter", "s": "Será reprimido con prisión de DOS (2) a SEIS (6) años el que se apoderare ilegítimamente de UNA (1) o más cabezas de ganado mayor o menor, total o parcialmente ajeno, que se encontrare…", "p": ["Será reprimido con prisión de DOS (2) a SEIS (6) años el que se apoderare ilegítimamente de UNA (1) o más cabezas de ganado mayor o menor, total o parcialmente ajeno, que se encontrare en establecimientos rurales o, en ocasión de su transporte, desde el momento de su carga hasta el de su destino o entrega, incluyendo las escalas que se realicen durante el trayecto.", "La pena será de TRES (3) a OCHO (8) años de prisión si el abigeato fuere de CINCO (5) o más cabezas de ganado mayor o menor y se utilizare un medio motorizado para su transporte."], "nt": ["(Artículo incorporado por art. 3° de la Ley N° 25.890 B.O.21/5/2004)"], "z": []}, {"pn": [{"t": "PR", "a": 48, "b": 120, "c": "Se aplicará reclusión o prisión de CUATRO (4) a DIEZ (10) años cuando en el abigeato concurriere alguna de las siguientes circunstan…"}], "n": 195, "l": "167 quater", "s": "Se aplicará reclusión o prisión de CUATRO (4) a DIEZ (10) años cuando en el abigeato concurriere alguna de las siguientes circunstancias:", "p": ["Se aplicará reclusión o prisión de CUATRO (4) a DIEZ (10) años cuando en el abigeato concurriere alguna de las siguientes circunstancias:", "1.- El apoderamiento se realizare en las condiciones previstas en el artículo 164. 2.- Se alteraren, suprimieren o falsificaren marcas o señales utilizadas para la identificación del animal.", "3.- Se falsificaren o se utilizaren certificados de adquisición, guías de tránsito, boletos de marca o señal, o documentación equivalente, falsos.", "4.- Participare en el hecho una persona que se dedique a la crianza, cuidado, faena, elaboración, comercialización o transporte de ganado o de productos o subproductos de origen animal.", "5.- Participare en el hecho un funcionario público quien, violando los deberes a su cargo o abusando de sus funciones, facilitare directa o indirectamente su comisión.", "6.- Participaren en el hecho TRES (3) o más personas.", "ARTICULO 167 quinque.- En caso de condena por un delito previsto en este Capítulo, el culpable, si fuere funcionario público o reuniere las condiciones personales descriptas en el artículo 167 quater inciso 4, sufrirá, además, inhabilitación especial por el doble del tiempo de la condena.", "En todos los casos antes previstos también se impondrá conjuntamente una multa equivalente de DOS (2) a DIEZ (10) veces del valor del ganado sustraído\"."], "nt": ["(Artículo incorporado por art. 3° de la Ley N° 25.890 B.O.21/5/2004)", "(Artículo incorporado por art. 3° de la Ley N° 25.890 B.O.21/5/2004)"], "z": []}, {"pn": [{"t": "PR", "a": 60, "b": 120, "c": "Será reprimido con reclusión o prisión de cinco a diez años, el que con intimidación o simulando autoridad pública o falsa orden…"}], "n": 196, "l": "168", "s": "Será reprimido con reclusión o prisión de cinco a diez años, el que con intimidación o simulando autoridad pública o falsa orden de la misma, obligue a otro a entregar, enviar, depositar…", "p": ["Será reprimido con reclusión o prisión de cinco a diez años, el que con intimidación o simulando autoridad pública o falsa orden de la misma, obligue a otro a entregar, enviar, depositar o poner a su disposición o a la de un tercero, cosas, dinero o documentos que produzcan efectos jurídicos.", "Incurrirá en la misma pena el que por los mismos medios o con violencia, obligue a otro a suscribir o destruir documentos de obligación o de crédito."], "nt": [], "z": ["5–10 años"]}, {"pn": [{"t": "PR", "a": 36, "b": 96, "c": "Será reprimido con prisión o reclusión de tres a ocho años, el que, por amenaza de imputaciones contra el honor o de violación d…"}], "n": 197, "l": "169", "s": "Será reprimido con prisión o reclusión de tres a ocho años, el que, por amenaza de imputaciones contra el honor o de violación de secretos, cometiere alguno de los hechos expresados en…", "p": ["Será reprimido con prisión o reclusión de tres a ocho años, el que, por amenaza de imputaciones contra el honor o de violación de secretos, cometiere alguno de los hechos expresados en el artículo precedente."], "nt": [], "z": ["3–8 años"]}, {"pn": [{"t": "PR", "a": 60, "b": 180, "c": "Se impondrá reclusión o prisión de cinco (5) a quince (15) años, al que sustrajere, retuviere u ocultare a una persona para sacar res…"}, {"t": "PR", "p": 1, "c": "…como consecuencia no querida por el autor. La pena será de prisión o reclusión perpetua si se causara intencionalmente la muerte de la persona ofendida. La p…"}], "n": 198, "l": "170", "s": "Se impondrá reclusión o prisión de cinco (5) a quince (15) años, al que sustrajere, retuviere u ocultare a una persona para sacar rescate.", "p": ["Se impondrá reclusión o prisión de cinco (5) a quince (15) años, al que sustrajere, retuviere u ocultare a una persona para sacar rescate. Si el autor lograre su propósito, el mínimo de la pena se elevará a ocho (8) años.", "La pena será de diez (10) a veinticinco (25) años de prisión o reclusión:", "1. Si la víctima fuese una mujer embarazada; un menor de dieciocho (18) años de edad o un mayor de setenta (70) años de edad.", "2. Si el hecho se cometiere en la persona de un ascendiente; de un hermano; del cónyuge o conviviente; o de otro individuo a quien se deba respeto particular.", "3. Si se causare a la víctima lesiones graves o gravísimas.", "4. Cuando la víctima sea una persona discapacitada; enferma; o que no pueda valerse por sí misma.", "5. Cuando el agente sea funcionario o empleado público; o pertenezca o haya pertenecido a alguna fuerza de seguridad u organismo de inteligencia del Estado.", "6. Cuando participaran en el hecho tres (3) o más personas.", "La pena será de quince (15) a veinticinco (25) años de prisión o reclusión si del hecho resultare la muerte de la persona ofendida, como consecuencia no querida por el autor. La pena será de prisión o reclusión perpetua si se causara intencionalmente la muerte de la persona ofendida.", "La pena del partícipe que, desvinculándose de los otros, se esforzare de modo que la víctima recupere la libertad, sin que tal resultado fuese la consecuencia del pago del precio de la libertad, se reducirá de un tercio a la mitad."], "nt": ["(Artículo sustituido por art. 4° de la Ley N° 25.742 B.O. 20/6/2003)"], "z": ["perpetua"]}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Sufrirá prisión de dos a seis años, el que substrajere un cadáver para hacerse pagar su devolución."}], "n": 199, "l": "171", "s": "Sufrirá prisión de dos a seis años, el que substrajere un cadáver para hacerse pagar su devolución.", "p": ["Sufrirá prisión de dos a seis años, el que substrajere un cadáver para hacerse pagar su devolución."], "nt": [], "z": ["2–6 años"]}, {"pn": [{"t": "P", "a": 1, "b": 72, "c": "Será reprimido con prisión de un mes a seis años, el que defraudare a otro con nombre supuesto, calidad simulada, fals…"}], "n": 200, "l": "172", "s": "Será reprimido con prisión de un mes a seis años, el que defraudare a otro con nombre supuesto, calidad simulada, falsos títulos, influencia mentida, abuso de confianza o aparentando…", "p": ["Será reprimido con prisión de un mes a seis años, el que defraudare a otro con nombre supuesto, calidad simulada, falsos títulos, influencia mentida, abuso de confianza o aparentando bienes, crédito, comisión, empresa o negociación o valiéndose de cualquier otro ardid o engaño."], "nt": [], "z": ["1 mes–6 años"]}, {"pn": [], "n": 201, "l": "173", "s": "Sin perjuicio de la disposición general del artículo precedente, se considerarán casos especiales de defraudación y sufrirán la pena que él establece:", "p": ["Sin perjuicio de la disposición general del artículo precedente, se considerarán casos especiales de defraudación y sufrirán la pena que él establece: 1. El que defraudare a otro en la substancia, calidad o cantidad de las cosas que le entregue en virtud de contrato o de un título obligatorio;", "2. El que con perjuicio de otro se negare a restituir o no restituyere a su debido tiempo, dinero, efectos o cualquier otra cosa mueble que se le haya dado en depósito, comisión, administración u otro título que produzca obligación de entregar o devolver;", "3. El que defraudare, haciendo suscribir con engaño algún documento;", "4. El que cometiere alguna defraudación abusando de firma en blanco, extendiendo con ella algún documento en perjuicio del mismo que la dio o de tercero;", "5. El dueño de una cosa mueble que la sustrajere de quien la tenga legítimamente en su poder, con perjuicio del mismo o de tercero;", "6. El que otorgare en perjuicio de otro, un contrato simulado o falsos recibidos; 7. El que, por disposición de la ley, de la autoridad o por un acto jurídico, tuviera a su cargo el manejo, la administración o el cuidado de bienes o intereses pecuniarios ajenos, y con el fin de procurar para sí o para un tercero un lucro indebido o para causar daño, violando sus deberes perjudicare los intereses confiados u obligare abusivamente al titular de éstos; 8. El que cometiere defraudación, substituyendo, ocultando o mutilando algún proceso, expediente, documento u otro papel importante;", "9. El que vendiere o gravare como bienes libres, los que fueren litigiosos o estuvieren embargados o gravados; y el que vendiere, gravare o arrendare como propios, bienes ajenos; 10. El que defraudare, con pretexto de supuesta remuneración a los jueces u otros empleados públicos;", "11. El que tornare imposible, incierto o litigioso el derecho sobre un bien o el cumplimiento, en las condiciones pactadas, de una obligación referente al mismo, sea mediante cualquier acto jurídico relativo al mismo bien, aunque no importe enajenación, sea removiéndolo, reteniéndolo, ocultándolo o dañándolo, siempre que el derecho o la obligación hubieran sido acordados a otro por un precio o como garantía;", "12. El titular fiduciario, el administrador de fondos comunes de inversión o el dador de un contrado de leasing, que en beneficio propio o de un tercero dispusiere, gravare o perjudicare los bienes y de esta manera defraudare los derechos de los cocontratantes; (Inciso incorporado por art. 82 de la Ley N° 24.441 B.O. 16/1/1995)", "13. El que encontrándose autorizado para ejecutar extrajudicialmente un inmueble lo ejecutara en perjuicio del deudor, a sabiendas de que el mismo no se encuentra en mora, o maliciosamente omitiera cumplimentar los recaudos establecidos para la subasta mediante dicho procedimiento especial; (Inciso incorporado por art. 82 de la Ley N° 24.441 B.O. 16/1/1995)", "14. El tenedor de letras hipotecarias que en perjuicio del deudor o de terceros omitiera consignar en el título los pagos recibidos. (Inciso incorporado por art. 82 de la Ley N° 24.441 15. El que defraudare mediante el uso de una tarjeta de compra, crédito o débito, cuando la misma hubiere sido falsificada, adulterada, hurtada, robada, perdida u obtenida del legítimo emisor mediante ardid o engaño, o mediante el uso no autorizado de sus datos, aunque lo hiciere por medio de una operación automática. (Inciso incorporado por art. 1° de la Ley N° 16. El que defraudare a otro mediante cualquier técnica de manipulación informática que altere el normal funcionamiento de un sistema informático o la transmisión de datos. (Inciso incorporado por art. 9° de la Ley N° 26.388, B.O. 25/6/2008)"], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Sufrirá prisión de dos a seis años: 1º. El que para procurarse a sí mismo o procurar a otro un provecho…"}], "n": 202, "l": "174", "s": "Sufrirá prisión de dos a seis años:", "p": ["Sufrirá prisión de dos a seis años:", "1º. El que para procurarse a sí mismo o procurar a otro un provecho ilegal en perjuicio de un asegurador o de un dador de préstamo a la gruesa, incendiare o destruyere una cosa asegurada o una nave asegurada o cuya carga o flete estén asegurados o sobre la cual se haya efectuado un préstamo a la gruesa;", "2º El que abusare de las necesidades, pasiones o inexperiencia de un menor o de un incapaz, declarado o no declarado tal, para hacerle firmar un documento que importe cualquier efecto jurídico, en daño de él o de otro, aunque el acto sea civilmente nulo;", "3º. El que defraudare usando de pesas o medidas falsas;", "4º. El empresario o constructor de una obra cualquiera o el vendedor de materiales de construcción que cometiere, en la ejecución de la obra o en la entrega de los materiales, un acto fraudulento capaz de poner en peligro la seguridad de las personas, de los bienes o del Estado;", "5º. El que cometiere fraude en perjuicio de alguna administración pública.6°.- El que maliciosamente afectare el normal desenvolvimiento de un establecimiento o explotación comercial, industrial, agropecuaria, minera o destinado a la prestación de servicios; destruyere, dañare, hiciere desaparecer, ocultare o fraudulentamente disminuyere el valor de materias primas, productos de cualquier naturaleza, máquinas, equipos u otros bienes de capital. (Inciso incorporado por art. 2° de la Ley N° 25.602 B.O.20/6/2002) En los casos de los tres incisos precedentes, el culpable, si fuere funcionario o empleado público, sufrirá además inhabilitación especial perpetua. (Párrafo sustituido por art. 3° de la Ley N° 25.602 B.O.20/6/2002)"], "nt": ["(Nota Infoleg: Por art. 4° de la Ley N° 25.602 B.O. 20/6/2002 se incorporó el art. 174 bis pero fue vetado por Decreto N° 1059/2002 B.O. 20/6/2002)"], "z": ["2–6 años", "perpetua"]}, {"pn": [], "n": 203, "l": "175", "s": "Será reprimido con multa de Será reprimido con multa de mil pesos a quince mil pesos:", "p": ["Será reprimido con multa de Será reprimido con multa de mil pesos a quince mil pesos:", "1º. El que encontrare perdida una cosa que no le pertenezca o un tesoro y se apropiare la cosa o la parte del tesoro correspondiente al propietario del suelo, sin observar las prescripciones del Código Civil;", "2º. El que se apropiare una cosa ajena, en cuya tenencia hubiere entrado a consecuencia de un error o de un caso fortuito;", "3º. El que vendiere la prenda sobre que prestó dinero o se la apropiare o dispusiere de ella, sin las formalidades legales;", "4º. El acreedor que a sabiendas exija o acepte de su deudor, a título de documento, crédito o garantía por una obligación no vencida, un cheque o giro de fecha posterior o en blanco.(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 12, "b": 36, "c": "…audos o garantías de carácter extorsivo, será reprimido con prisión de uno a tres años y con multa de pesos tres mil a pesos treinta mil. La misma pena será…"}], "n": 204, "l": "175 bis", "s": "El que, aprovechando la necesidad, la ligereza o la inexperiencia de una persona le hiciere dar o prometer, en cualquier forma, para sí o para otro, intereses u otras ventajas…", "p": ["El que, aprovechando la necesidad, la ligereza o la inexperiencia de una persona le hiciere dar o prometer, en cualquier forma, para sí o para otro, intereses u otras ventajas pecuniarias evidentemente desproporcionadas con su prestación, u otorgar recaudos o garantías de carácter extorsivo, será reprimido con prisión de uno a tres años y con multa de pesos tres mil a pesos treinta mil.", "La misma pena será aplicable al que a sabiendas adquiriere, transfiriere o hiciere valer un crédito usurario.", "La pena de prisión será de tres a seis años, y la multa de pesos quince mil a pesos ciento cincuenta mil, si el autor fuere prestamista o comisionista usurario profesional o habitual."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["1–3 años"]}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Será reprimido, como quebrado fraudulento, con prisión de dos a seis años e inhabilitación especial de tres a diez años, el comerciante declara…"}], "n": 205, "l": "176", "s": "Será reprimido, como quebrado fraudulento, con prisión de dos a seis años e inhabilitación especial de tres a diez años, el comerciante declarado en quiebra que, en fraude de sus…", "p": ["Será reprimido, como quebrado fraudulento, con prisión de dos a seis años e inhabilitación especial de tres a diez años, el comerciante declarado en quiebra que, en fraude de sus acreedores, hubiere incurrido en algunos de los hechos siguientes:", "1º Simular o suponer deudas, enajenaciones, gastos o pérdidas;", "2º No justificar la salida o existencia de bienes que debiera tener; substraer u ocultar alguna cosa que correspondiere a la masa;", "3º Conceder ventajas indebidas a cualquier acreedor."], "nt": [], "z": ["2–6 años", "3–10 años"]}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Será reprimido, como quebrado culpable, con prisión de un mes a un año e inhabilitación especial de dos a cinco años, el comerciante que hub…"}], "n": 206, "l": "177", "s": "Será reprimido, como quebrado culpable, con prisión de un mes a un año e inhabilitación especial de dos a cinco años, el comerciante que hubiere causado su propia quiebra y perjudicado a…", "p": ["Será reprimido, como quebrado culpable, con prisión de un mes a un año e inhabilitación especial de dos a cinco años, el comerciante que hubiere causado su propia quiebra y perjudicado a sus acreedores, por sus gastos excesivos con relación al capital y al número de personas de su familia, especulaciones ruinosas, juego, abandono de sus negocios o cualquier otro acto de negligencia o imprudencia manifiesta."], "nt": [], "z": ["1 mes–1 año", "2–5 años"]}, {"pn": [], "n": 207, "l": "178", "s": "Cuando se tratare de la quiebra de una sociedad comercial o de una persona jurídica que ejerza el comercio, o se hubiere abierto el procedimiento de liquidación sin quiebra de un banco u…", "p": ["Cuando se tratare de la quiebra de una sociedad comercial o de una persona jurídica que ejerza el comercio, o se hubiere abierto el procedimiento de liquidación sin quiebra de un banco u otra entidad financiera, todo director, síndico, administrador, miembro de la comisión fiscalizadora o gerente de la sociedad o establecimiento fallido o del banco o entidad financiera en liquidación sin quiebra, o contador o tenedor de libros de los mismos, que hubiere cooperado a la ejecución de alguno de los actos a que se refieren los artículos anteriores, será reprimido con la pena de la quiebra fraudulenta o culpable, en su caso. Con la misma pena será reprimido el miembro del consejo de administración o directivo, síndico, miembro de la junta fiscalizadora o de vigilancia, o gerente, tratándose de una sociedad cooperativa o mutual."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "Será reprimido con prisión de uno a cuatro años, el deudor no comerciante concursado civilmente que, para defraudar a…"}, {"t": "P", "a": 6, "b": 36, "c": "…os actos mencionados en el artículo 176. Será reprimido con prisión de seis meses a tres años, el que durante el curso de un proceso o después de una sentencia con…"}], "n": 208, "l": "179", "s": "Será reprimido con prisión de uno a cuatro años, el deudor no comerciante concursado civilmente que, para defraudar a sus acreedores, hubiere cometido o cometiere alguno de los actos…", "p": ["Será reprimido con prisión de uno a cuatro años, el deudor no comerciante concursado civilmente que, para defraudar a sus acreedores, hubiere cometido o cometiere alguno de los actos mencionados en el artículo 176.", "Será reprimido con prisión de seis meses a tres años, el que durante el curso de un proceso o después de una sentencia condenatoria, maliciosamente destruyere, inutilizare, dañare, ocultare o hiciere desaparecer bienes de su patrimonio o fraudulentamente disminuyere su valor, y de esta manera frustrare, en todo o en parte, el cumplimiento de las correspondientes obligaciones civiles."], "nt": [], "z": ["1–4 años", "6 meses–3 años"]}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Será reprimido con prisión de un mes a un año, el acreedor que consintiere en un concordato, convenio o transacción…"}], "n": 209, "l": "180", "s": "Será reprimido con prisión de un mes a un año, el acreedor que consintiere en un concordato, convenio o transacción judicial, en virtud de una connivencia con el deudor o con un tercero,…", "p": ["Será reprimido con prisión de un mes a un año, el acreedor que consintiere en un concordato, convenio o transacción judicial, en virtud de una connivencia con el deudor o con un tercero, por la cual hubiere estipulado ventajas especiales para el caso de aceptación del concordato, convenio o transacción.", "La misma pena sufrirá, en su caso, todo deudor o director, gerente o administrador de una sociedad anónima o cooperativa o de una persona jurídica de otra índole, en estado de quiebra o de concurso judicial de bienes, que concluyere un convenio de este género."], "nt": [], "z": ["1 mes–1 año"]}, {"pn": [{"t": "P", "a": 6, "b": 36, "c": "Será reprimido con prisión de seis meses a tres años: 1º el que por violencia, amenazas, engaños, abusos de confianza o cl…"}], "n": 210, "l": "181", "s": "Será reprimido con prisión de seis meses a tres años:", "p": ["Será reprimido con prisión de seis meses a tres años:", "1º el que por violencia, amenazas, engaños, abusos de confianza o clandestinidad despojare a otro, total o parcialmente, de la posesión o tenencia de un inmueble o del ejercicio de un derecho real constituido sobre él, sea que el despojo se produzca invadiendo el inmueble, manteniéndose en él o expulsando a los ocupantes;", "2º el que, para apoderarse de todo o parte de un inmueble, destruyere o alterare los términos o límites del mismo;", "3º el que, con violencias o amenazas, turbare la posesión o tenencia de un inmueble."], "nt": ["(Artículo sustituido por art. 2° Ley N° 24.454 B.O. 7/3/1995)"], "z": ["6 meses–3 años"]}, {"pn": [{"t": "P", "a": 0.5, "b": 12, "c": "Será reprimido con prisión de quince días a un año: 1º El que ilícitamente y con el propósito de causar perjuicio a otro…"}], "n": 211, "l": "182", "s": "Será reprimido con prisión de quince días a un año:", "p": ["Será reprimido con prisión de quince días a un año:", "1º El que ilícitamente y con el propósito de causar perjuicio a otro sacare aguas de represas, estanques u otros depósitos, ríos, arroyos, fuentes, canales o acueductos o las sacare en mayor cantidad que aquella a que tenga derecho;", "2º El que estorbare el ejercicio de los derechos que un tercero tuviere sobre dichas aguas;", "3º El que ilícitamente y con el propósito de causar perjuicio a otro represare, desviare o detuviere las aguas de los ríos, arroyos, canales o fuentes o usurpare un derecho cualquiera referente al curso de ellas.", "La pena se aumentará hasta dos años, si para cometer los delitos expresados en los números anteriores, se rompieren o alteraren diques, esclusas, compuertas u otras obras semejantes hechas en los ríos, arroyos, fuentes, depósitos, canales o acueductos."], "nt": [], "z": ["15 días–1 año"]}, {"pn": [{"t": "P", "a": 0.5, "b": 12, "c": "Será reprimido con prisión de quince días a un año, el que destruyere, inutilizare, hiciere desaparecer o de cualquier m…"}], "n": 212, "l": "183", "s": "Será reprimido con prisión de quince días a un año, el que destruyere, inutilizare, hiciere desaparecer o de cualquier modo dañare una cosa mueble o inmueble o un animal, total o…", "p": ["Será reprimido con prisión de quince días a un año, el que destruyere, inutilizare, hiciere desaparecer o de cualquier modo dañare una cosa mueble o inmueble o un animal, total o parcialmente ajeno, siempre que el hecho no constituya otro delito más severamente penado.", "En la misma pena incurrirá el que alterare, destruyere o inutilizare datos, documentos, programas o sistemas informáticos; o vendiere, distribuyere, hiciere circular o introdujere en un sistema informático, cualquier programa destinado a causar daños. (Párrafo incorporado por art. 10 de la Ley N° 26.388, B.O. 25/6/2008)"], "nt": [], "z": ["15 días–1 año"]}, {"pn": [], "n": 213, "l": "184", "s": "La pena será de tres (3) meses a cuatro (4) años de prisión, si mediare cualquiera de las circunstancias siguientes:", "p": ["La pena será de tres (3) meses a cuatro (4) años de prisión, si mediare cualquiera de las circunstancias siguientes:", "1. Ejecutar el hecho con el fin de impedir el libre ejercicio de la autoridad o en venganza de sus determinaciones;", "2. Producir infección o contagio en aves u otros animales domésticos;", "3. Emplear substancias venenosas o corrosivas;", "4. Cometer el delito en despoblado y en banda;", "5. Ejecutarlo en archivos, registros, bibliotecas, museos o en puentes, caminos, paseos u otros bienes de uso público; o en tumbas, signos conmemorativos, monumentos, estatuas, cuadros u otros objetos de arte colocados en edificios o lugares públicos; o en datos, documentos, programas o sistemas informáticos públicos;", "6. Ejecutarlo en sistemas informáticos destinados a la prestación de servicios de salud, de comunicaciones, de provisión o transporte de energía, de medios de transporte u otro servicio público."], "nt": ["(Artículo sustituido por art. 11 de la Ley N° 26.388, B.O. 25/6/2008)"], "z": []}, {"pn": [], "n": 214, "l": "185", "s": "Están exentos de responsabilidad criminal, sin perjuicio de la civil, por los hurtos, defraudaciones o daños que recíprocamente se causaren:", "p": ["Están exentos de responsabilidad criminal, sin perjuicio de la civil, por los hurtos, defraudaciones o daños que recíprocamente se causaren:", "1. Los cónyuges, ascendientes, descendientes y afines en la línea recta;", "2. El consorte viudo, respecto de las cosas de la pertenencia de su difunto cónyuge, mientras no hayan pasado a poder de otro;", "3. Los hermanos y cuñados, si viviesen juntos.", "La excepción establecida en el párrafo anterior, no es aplicable a los extraños que participen del delito."], "nt": [], "z": []}, {"pn": [{"t": "PR", "a": 36, "b": 120, "c": "…re incendio, explosión o inundación, será reprimido: 1º Con reclusión o prisión de tres a diez años, si hubiere peligro común para los bienes; 2º Con reclusión o prisión…"}, {"t": "PR", "a": 36, "b": 180, "c": "…rafos anteriores, cargados, parados o en movimiento; 3º Con reclusión o prisión de tres a quince años, si hubiere peligro para un archivo público, biblioteca, museo, arsen…"}, {"t": "PR", "a": 96, "b": 240, "c": "…s, si hubiere peligro de muerte para alguna persona; 5º Con reclusión o prisión de ocho a veinte años, si el hecho fuere causa inmediata de la muerte de alguna persona."}], "n": 215, "l": "186", "s": "El que causare incendio, explosión o inundación, será reprimido:", "p": ["El que causare incendio, explosión o inundación, será reprimido:", "1º Con reclusión o prisión de tres a diez años, si hubiere peligro común para los bienes;", "2º Con reclusión o prisión de tres a diez años el que causare incendio o destrucción por cualquier otro medio:", "a) De cereales en parva, gavillas o bolsas, o de los mismos todavía no cosechados;", "b) De bosques, viñas, olivares, cañaverales, algodonales, yerbatales o cualquiera otra plantación de árboles o arbustos en explotación, ya sea con sus frutos en pie o cosechados;", "c) De ganado en los campos o de sus productos amontonados en el campo o depositados;", "d) De la leña o carbón de leña, apilados o amontonados en los campos de su explotación y destinados al comercio;", "e) De alfalfares o cualquier otro cultivo de forrajes, ya sea en pie o emparvados, engavillados, ensilados o enfardados;", "f) De los mismos productos mencionados en los párrafos anteriores, cargados, parados o en movimiento;", "3º Con reclusión o prisión de tres a quince años, si hubiere peligro para un archivo público, biblioteca, museo, arsenal, astillero, fábrica de pólvora o de pirotecnia militar o parque de artillería;", "4º Con reclusión o prisión de tres a quince años, si hubiere peligro de muerte para alguna persona;", "5º Con reclusión o prisión de ocho a veinte años, si el hecho fuere causa inmediata de la muerte de alguna persona."], "nt": [], "z": ["3–10 años", "3–15 años", "8–20 años"]}, {"pn": [], "n": 216, "l": "187", "s": "Incurrirá, según los casos, en las penas señaladas en el artículo precedente, el que causare estrago por medio de sumersión o varamiento de nave, derrumbe de un edificio, inundación, de…", "p": ["Incurrirá, según los casos, en las penas señaladas en el artículo precedente, el que causare estrago por medio de sumersión o varamiento de nave, derrumbe de un edificio, inundación, de una mina o cualquier otro medio poderoso de destrucción."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 12, "b": 72, "c": "Será reprimido con prisión de uno a seis años el que, destruyendo o inutilizando diques u otras obras destinadas a…"}], "n": 217, "l": "188", "s": "Será reprimido con prisión de uno a seis años el que, destruyendo o inutilizando diques u otras obras destinadas a la defensa común contra las inundaciones u otros desastres, hiciere…", "p": ["Será reprimido con prisión de uno a seis años el que, destruyendo o inutilizando diques u otras obras destinadas a la defensa común contra las inundaciones u otros desastres, hiciere surgir el peligro de que éstos se produzcan.", "La misma pena se aplicará al que, para impedir la extinción de un incendio o las obras de defensa contra una inundación, sumersión, naufragio u otro desastre, substrajere, ocultare o hiciere inservibles, materiales, instrumentos u otros medios destinados a la extinción o a la defensa referida."], "nt": [], "z": ["1–6 años"]}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Será reprimido con prisión de un mes a un año, el que, por imprudencia o negligencia, por impericia en su arte o pr…"}], "n": 218, "l": "189", "s": "Será reprimido con prisión de un mes a un año, el que, por imprudencia o negligencia, por impericia en su arte o profesión o por inobservancia de los reglamentos u ordenanzas, causare un…", "p": ["Será reprimido con prisión de un mes a un año, el que, por imprudencia o negligencia, por impericia en su arte o profesión o por inobservancia de los reglamentos u ordenanzas, causare un incendio u otros estragos.", "Si el hecho u omisión culpable pusiere en peligro de muerte a alguna persona o causare la muerte de alguna persona, el máximo de la pena podrá elevarse hasta cinco años."], "nt": ["(Artículo sustituido por art. 3° de la Ley N° 25.189 B.O. 28/10/1999)"], "z": ["1 mes–1 año"]}, {"pn": [{"t": "PR", "a": 60, "b": 180, "c": "…materiales destinados a su preparación, será reprimido con reclusión o prisión de CINCO (5) a QUINCE (15) años. La misma pena se impondrá al que, sabiendo o debiendo saber que cont…"}, {"t": "P", "a": 36, "b": 72, "c": "…azones de su uso doméstico o industrial, será reprimida con prisión de TRES (3) a SEIS (6) años. (2) La simple tenencia de armas de fuego de uso civil, sin la debida…"}, {"t": "P", "a": 12, "b": 48, "c": "…civil, sin la debida autorización legal, será reprimida con prisión de UN (1) año a CUATRO (4) años. Si las armas fueren de guerra, la pena será de TRES (3) años y SEIS…"}, {"t": "P", "a": 48, "b": 120, "c": "…e un arma de fuego de cualquier calibre, será reprimido con prisión de CUATRO (4) a DIEZ (10) años. (3) El acopio de armas de fuego, piezas o municiones de éstas, o la…"}, {"t": "PR", "a": 48, "b": 120, "c": "…producirlas, sin la debida autorización, será reprimido con reclusión o prisión de CUATRO (4) a DIEZ (10) años. El que hiciere de la fabricación ilegal de armas de fuego una activi…"}, {"t": "PR", "a": 60, "b": 120, "c": "…de armas de fuego una actividad habitual será reprimido con reclusión o prisión de CINCO (5) a DIEZ (10) años. (4) Será reprimido con prisión de UN (1) año a SEIS (6) años el que…"}, {"t": "P", "a": 12, "b": 72, "c": "…isión de CINCO (5) a DIEZ (10) años. (4) Será reprimido con prisión de UN (1) año a SEIS (6) años el que entregare un arma de fuego, por cualquier título, a quien no a…"}, {"t": "P", "a": 36, "b": 96, "c": "…ulta de DIEZ MIL PESOS ($ 10.000.-). (5) Será reprimido con prisión de TRES (3) a OCHO (8) años e inhabilitación especial por el doble del tiempo de la condena el qu…"}], "n": 219, "l": "189 bis", "s": "(1) El que, con el fin de contribuir a la comisión de delitos contra la seguridad común o causar daños en las máquinas o en la elaboración de productos, adquiriere, fabricare,…", "p": ["(1) El que, con el fin de contribuir a la comisión de delitos contra la seguridad común o causar daños en las máquinas o en la elaboración de productos, adquiriere, fabricare, suministrare, sustrajere o tuviere en su poder bombas, materiales o aparatos capaces de liberar energía nuclear, materiales radiactivos o sustancias nucleares, o sus desechos, isótopos radiactivos, materiales explosivos, inflamables, asfixiantes, tóxicos o biológicamente peligrosos, o sustancias o materiales destinados a su preparación, será reprimido con reclusión o prisión de CINCO (5) a QUINCE (15) años.", "La misma pena se impondrá al que, sabiendo o debiendo saber que contribuye a la comisión de delitos contra la seguridad común o destinados a causar daños en las máquinas o en la elaboración de productos, diere instrucciones para la preparación de sustancias o materiales mencionados en el párrafo anterior.", "La simple tenencia de los materiales a los que se refiere el párrafo que antecede, sin la debida autorización legal, o que no pudiere justificarse por razones de su uso doméstico o industrial, será reprimida con prisión de TRES (3) a SEIS (6) años.", "(2) La simple tenencia de armas de fuego de uso civil, sin la debida autorización legal, será reprimida con prisión de 6 (SEIS) meses a 2 (DOS) años y multa de MIL PESOS ($ 1.000.-) a Si las armas fueren de guerra, la pena será de DOS (2) a SEIS (6) años de prisión. La portación de armas de fuego de uso civil, sin la debida autorización legal, será reprimida con prisión de UN (1) año a CUATRO (4) años.", "Si las armas fueren de guerra, la pena será de TRES (3) años y SEIS (6) meses a OCHO (8) años y SEIS (6) meses de reclusión o prisión.", "Si el portador de las armas a las cuales se refieren los dos párrafos que anteceden, fuere tenedor autorizado del arma de que se trate, la escala penal correspondiente se reducirá en un tercio del mínimo y del máximo.", "La misma reducción prevista en el párrafo anterior podrá practicarse cuando, por las circunstancias del hecho y las condiciones personales del autor, resultare evidente la falta de intención de utilizar las armas portadas con fines ilícitos.", "En los dos casos precedentes, se impondrá, además, inhabilitación especial por el doble del tiempo de la condena.", "El que registrare antecedentes penales por delito doloso contra las personas o con el uso de armas, o se encontrare gozando de una excarcelación o exención de prisión anterior y portare un arma de fuego de cualquier calibre, será reprimido con prisión de CUATRO (4) a DIEZ (10) años.", "(3) El acopio de armas de fuego, piezas o municiones de éstas, o la tenencia de instrumental para producirlas, sin la debida autorización, será reprimido con reclusión o prisión de CUATRO", "(4) a DIEZ (10) años.", "El que hiciere de la fabricación ilegal de armas de fuego una actividad habitual será reprimido con reclusión o prisión de CINCO (5) a DIEZ (10) años.", "(4) Será reprimido con prisión de UN (1) año a SEIS (6) años el que entregare un arma de fuego, por cualquier título, a quien no acreditare su condición de legítimo usuario. La pena será de TRES (3) años y SEIS (6) meses a DIEZ (10) años de prisión si el arma fuera entregada a un menor de DIECIOCHO (18) años.", "Si el autor hiciere de la provisión ilegal de armas de fuego una actividad habitual, la pena será de CUATRO (4) a QUINCE (15) años de reclusión o prisión.", "Si el culpable de cualquiera de las conductas contempladas en los tres párrafos anteriores contare con autorización para la venta de armas de fuego, se le impondrá, además, inhabilitación especial absoluta y perpetua, y multa de DIEZ MIL PESOS ($ 10.000.-).", "(5) Será reprimido con prisión de TRES (3) a OCHO (8) años e inhabilitación especial por el doble del tiempo de la condena el que, contando con la debida autorización legal para fabricar armas, omitiere su número o grabado conforme a la normativa vigente, o asignare a DOS (2) o más armas idénticos números o grabados.", "En la misma pena incurrirá el que adulterare o suprimiere el número o el grabado de un arma de fuego."], "nt": ["(Nota Infoleg: Por art. 4° de la Ley N° 25.886 B.O. 5/5/2004, se establece que el primer párrafo del punto 2 del artículo 189 bis entrará en vigencia a partir del término del plazo establecido de SEIS MESES, en el cual el Poder Ejecutivo Nacional dispondrá, las medidas pertinentes para facilitar el registro gratuito y sencillo de las armas de fuego de uso civil o uso civil condicionado. Asimismo, en el mismo término, se arbitrarán en todo el territorio de la Nación, con contralor de la máxima autoridad judicial que en cada jurisdicción se designe, los medios para recepcionar de parte de la población, la entrega voluntaria de toda arma de fuego que su propietario o tenedor decida realizar.)", "(Artículo sustituido por art. 1° de la Ley N° 25.886 B.O. 5/5/2004.)"], "z": ["perpetua"]}, {"pn": [], "n": 220, "l": "189 ter", "s": "—", "p": ["—"], "nt": ["(Artículo derogado por art. 2° de la Ley N° 25.886 B.O. 5/5/2004.)", "(Denominación sustituida por art. 1° de la Ley N° 26.362, B.O. 16/4/2008)"], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 96, "c": "Será reprimido con prisión de dos a ocho años, el que a sabiendas ejecutare cualquier acto que ponga en peligro la…"}], "n": 221, "l": "190", "s": "Será reprimido con prisión de dos a ocho años, el que a sabiendas ejecutare cualquier acto que ponga en peligro la seguridad de una nave, construcción flotante o aeronave.", "p": ["Será reprimido con prisión de dos a ocho años, el que a sabiendas ejecutare cualquier acto que ponga en peligro la seguridad de una nave, construcción flotante o aeronave.", "Si el hecho produjere naufragio, varamiento o desastre aéreo, la pena será de seis a quince años de reclusión o prisión.", "Si el hecho causare lesión a alguna persona, la pena será de seis a quince años de reclusión o prisión, y si ocasionare la muerte, de diez a veinticinco años de reclusión o prisión. Las disposiciones precedentes se aplicarán aunque la acción recaiga sobre una cosa propia, si del hecho deriva peligro para la seguridad común."], "nt": [], "z": ["2–8 años", "6–15 años", "10–25 años"]}, {"pn": [{"t": "P", "a": 6, "b": 36, "c": "…un tren o para hacerle descarrilar, será reprimido: 1º Con prisión de seis meses a tres años, si no se produjere descarrilamiento u otro accidente; 2º Con prisión…"}, {"t": "P", "a": 24, "b": 72, "c": "…i no se produjere descarrilamiento u otro accidente; 2º Con prisión de dos a seis años, si se produjere descarrilamiento u otro accidente; 3º Con reclusión…"}, {"t": "PR", "a": 36, "b": 120, "c": "…, si se produjere descarrilamiento u otro accidente; 3º Con reclusión o prisión de tres a diez años, si a consecuencia del accidente, resultare lesionada alguna persona;…"}, {"t": "PR", "a": 120, "b": 300, "c": "…a del accidente, resultare lesionada alguna persona; 4º Con reclusión o prisión de diez a veinticinco años, si resultare la muerte de alguna persona."}], "n": 222, "l": "191", "s": "El que empleare cualquier medio para detener o entorpecer la marcha de un tren o para hacerle descarrilar, será reprimido:", "p": ["El que empleare cualquier medio para detener o entorpecer la marcha de un tren o para hacerle descarrilar, será reprimido:", "1º Con prisión de seis meses a tres años, si no se produjere descarrilamiento u otro accidente;", "2º Con prisión de dos a seis años, si se produjere descarrilamiento u otro accidente;", "3º Con reclusión o prisión de tres a diez años, si a consecuencia del accidente, resultare lesionada alguna persona;", "4º Con reclusión o prisión de diez a veinticinco años, si resultare la muerte de alguna persona."], "nt": [], "z": ["6 meses–3 años", "2–6 años", "3–10 años"]}, {"pn": [], "n": 223, "l": "192", "s": "Será reprimido con las penas establecidas en el artículo anterior en sus casos respectivos, el que ejecutare cualquier acto tendiente a interrumpir el funcionamiento de un telégrafo o…", "p": ["Será reprimido con las penas establecidas en el artículo anterior en sus casos respectivos, el que ejecutare cualquier acto tendiente a interrumpir el funcionamiento de un telégrafo o teléfono destinado al servicio de un ferrocarril."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Será reprimido con prisión de un mes a un año, si el hecho no importare un delito más severamente penado, el que ar…"}, {"t": "P", "a": 6, "b": 36, "c": "…o tranvía en marcha. ARTICULO 193 BIS. - Será reprimido con prisión de SEIS (6) meses a TRES (3) años e inhabilitación especial para conducir por el doble del tiempo de la…"}], "n": 224, "l": "193", "s": "Será reprimido con prisión de un mes a un año, si el hecho no importare un delito más severamente penado, el que arrojare cuerpos contundentes o proyectiles contra un tren o tranvía en…", "p": ["Será reprimido con prisión de un mes a un año, si el hecho no importare un delito más severamente penado, el que arrojare cuerpos contundentes o proyectiles contra un tren o tranvía en marcha.", "ARTICULO 193 BIS. - Será reprimido con prisión de SEIS (6) meses a TRES (3) años e inhabilitación especial para conducir por el doble del tiempo de la condena, el conductor que creare una situación de peligro para la vida o la integridad física de las personas, mediante la participación en una prueba de velocidad o de destreza con un vehículo automotor, realizada sin la debida autorización de la autoridad competente.", "La misma pena se aplicará a quien organizare o promocionare la conducta prevista en el presente artículo, y a quien posibilitare su realización por un tercero mediante la entrega de un vehículo de su propiedad o confiado a su custodia, sabiendo que será utilizado para ese fin."], "nt": ["(Artículo incorporado por art. 2° de la Ley N° 26.362, B.O. 16/4/2008)"], "z": ["1 mes–1 año"]}, {"pn": [{"t": "P", "a": 3, "b": 24, "c": "…lectricidad o de sustancias energéticas, será reprimido con prisión de tres meses a dos años."}], "n": 225, "l": "194", "s": "El que, sin crear una situación de peligro común, impidiere, estorbare o entorpeciere el normal funcionamiento de los transportes por tierra, agua o aire o los servicios públicos de…", "p": ["El que, sin crear una situación de peligro común, impidiere, estorbare o entorpeciere el normal funcionamiento de los transportes por tierra, agua o aire o los servicios públicos de comunicación, de provisión de agua, de electricidad o de sustancias energéticas, será reprimido con prisión de tres meses a dos años."], "nt": [], "z": ["3 meses–2 años"]}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Serán reprimidos con prisión de un mes a un año, si el hecho no importare un delito más severamente penado, los condu…"}], "n": 226, "l e seis (6) meses a dos (2) años, el que interrumpiere o entorpeciere la comunicación telegráfica, telefónica o de otra naturaleza o resistiere violentamente el restablecimiento de la comunicación interrumpida."], "nt": ["(Artículo sustituido por art. 12 de la Ley N° 26.388, B.O. 25/6/2008)"], "z": []}, {"pn": [{"t": "PR", "a": 36, "b": 180, "c": "Será reprimido con reclusión o prisión de tres a quince años: 1º El que practicare en el mar o en ríos navegables, algún acto de d…"}], "n": 229, "l": "198", "s": "Será reprimido con reclusión o prisión de tres a quince años:", "p": ["Será reprimido con reclusión o prisión de tres a quince años:", "1º El que practicare en el mar o en ríos navegables, algún acto de depredación o violencia contra un buque o contra personas o cosas que en él se encuentren, sin estar autorizado por alguna potencia beligerante o excediendo los límites de una autorización legítimamente concedida;", "2º El que practicare algún acto de depredación o violencia contra una aeronave en vuelo o mientras realiza las operaciones inmediatamente anteriores al vuelo, o contra personas o cosas que en ellas se encuentren, sin estar autorizado por alguna potencia beligerante o excediendo los límites de una autorización legítimamente concedida;", "3º El que mediante violencia, intimidación o engaño, usurpare la autoridad de un buque o aeronave, con el fin de apoderarse de él o de disponer de las cosas o de las personas que lleva;", "4º El que, en connivencia con piratas, les entregare un buque o aeronave, su carga o lo que perteneciere a su pasaje o tripulación;", "5º El que, con amenazas o violencia, se opusiere a que el comandante o la tripulación defiendan el buque o aeronave atacado por piratas;", "6º El que, por cuenta propia o ajena, equipare un buque o aeronave destinados a la piratería;", "7º El que, desde el territorio de la República, a sabiendas traficare con piratas o les suministrare auxilio."], "nt": [], "z": ["3–15 años"]}, {"pn": [], "n": 230, "l": "199", "s": "Si los actos de violencia u hostilidad mencionados en el artículo anterior, fueren seguidos de la muerte de alguna persona que se encontrare en el buque o aeronave atacados, la pena será…", "p": ["Si los actos de violencia u hostilidad mencionados en el artículo anterior, fueren seguidos de la muerte de alguna persona que se encontrare en el buque o aeronave atacados, la pena será de diez a veinticinco años de reclusión o prisión."], "nt": [], "z": ["10–25 años"]}, {"pn": [{"t": "PR", "a": 36, "b": 120, "c": "Será reprimido con reclusión o prisión de TRES (3) a DIEZ (10) años y multa de PESOS DIEZ MIL ($ 10.000) a PESOS DOSCIENTOS MIL ($ 200.00…"}], "n": 231, "l": "200", "s": "Será reprimido con reclusión o prisión de TRES (3) a DIEZ (10) años y multa de PESOS DIEZ MIL ($ 10.000) a PESOS DOSCIENTOS MIL ($ 200.000), el que envenenare, adulterare o falsificare…", "p": ["Será reprimido con reclusión o prisión de TRES (3) a DIEZ (10) años y multa de PESOS DIEZ MIL ($ 10.000) a PESOS DOSCIENTOS MIL ($ 200.000), el que envenenare, adulterare o falsificare de un modo peligroso para la salud, aguas potables o sustancias alimenticias o medicinales destinadas al uso público o al consumo de una colectividad de personas."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 26.524 B.O. 5/11/2009)"], "z": []}, {"pn": [], "n": 232, "l": "201", "s": "Las penas del artículo precedente se aplicarán al que vendiere, pusiere en venta, suministrare, distribuyere o almacenare con fines de comercialización aguas potables, sustancias…", "p": ["Las penas del artículo precedente se aplicarán al que vendiere, pusiere en venta, suministrare, distribuyere o almacenare con fines de comercialización aguas potables, sustancias alimenticias o medicinales o mercaderías peligrosas para la salud, disimulando su carácter nocivo."], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 26.524 B.O. 5/11/2009)"], "z": []}, {"pn": [], "n": 233, "l": "201 bis", "s": "Si como consecuencia  ["Será reprimido con prisión de UNO (1) a CUATRO (4) años y multa de PESOS DIEZ MIL ($ 10.000) a PESOS DOSCIENTOS MIL ($ 200.000), el que produjere o fabricare sustancias medicinales en establecimientos no autorizados."], "nt": ["(Artículo sustituido por art. 7° de la Ley N° 26.524 B.O. 5/11/2009)"], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 36, "c": "…el artículo 204. ARTICULO 204 quinquies: Será reprimido con prisión de SEIS (6) meses a TRES (3) años el que sin autorización vendiere sustancias medicinales que requieran…"}], "n": 239, "l": "204 quater", "s": "Será reprimido con multa de PESOS DIEZ MIL ($ 10.000) a PESOS DOSCIENTOS MIL ($ 200.000), el que teniendo a su cargo la dirección, administración, control o vigilancia de un…", "p": ["Será reprimido con multa de PESOS DIEZ MIL ($ 10.000) a PESOS DOSCIENTOS MIL ($ 200.000), el que teniendo a su cargo la dirección, administración, control o vigilancia de un establecimiento destinado al expendio, almacenamiento, distribución, producción o fabricación de sustancias medicinales, a sabiendas, incumpliere con los deberes a su cargo posibilitando la comisión de alguno de los hechos previstos en el artículo 204.", "ARTICULO 204 quinquies: Será reprimido con prisión de SEIS (6) meses a TRES (3) años el que sin autorización vendiere sustancias medicinales que requieran receta médica para su comercialización."], "nt": ["(Artículo sustituido por art. 8° de la Ley N° 26.524 B.O. 5/11/2009)", "(Artículo incorporado por art. 9° de la Ley N° 26.524 B.O. 5/11/2009)"], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 24, "c": "Será reprimido con prisión de seis meses a dos años, el que violare las medidas adoptadas por las autoridades competentes…"}], "n": 240, "l": "205", "s": "Será reprimido con prisión de seis meses a dos años, el que violare las medidas adoptadas por las autoridades competentes, para impedir la introducción o propagación de una epidemia.", "p": ["Será reprimido con prisión de seis meses a dos años, el que violare ión para el ejercicio de un arte de curar, anunciare o prometiere la curación de enfermedades a término fijo o por medios secretos o infalibles;", "3º El que, con título o autorización para el ejercicio de un arte de curar, prestare su nombre a otro que no tuviere título o autorización, para que ejerza los actos a que se refiere el inciso 1º de este artículo."], "nt": [], "z": ["15 días–1 año"]}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "…o institución, será reprimido, por la sola instigación, con prisión de dos a seis años, según la gravedad del delito y las demás circunstancias establecidas…"}], "n": 244, "l": "209", "s": "El que públicamente instigare a cometer un delito determinado contra una persona o institución, será reprimido, por la sola instigación, con prisión de dos a seis años, según la gravedad…", "p": ["El que públicamente instigare a cometer un delito determinado contra una persona o institución, será reprimido, por la sola instigación, con prisión de dos a seis años, según la gravedad del delito y las demás circunstancias establecidas en el artículo 41."], "nt": [], "z": ["2–6 años"]}, {"pn": [], "n": 245, "l": "209 bis", "s": "En igual pena incurrirá quien en tiempo de conflicto armado incite públicamente a la sustracción al servicio militar legalmente impuesto o asumido.", "p": ["En igual pena incurrirá quien en tiempo de conflicto armado incite públicamente a la sustracción al servicio militar legalmente impuesto o asumido. Si el autor fuese un militar, el máximo de la pena se elevará a diez (10) años. (Artículo incorporado por art. 4° del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación)"], "nt": [], "z": []}, {"pn": [{"t": "PR", "a": 36, "b": 120, "c": "Será reprimido con prisión o reclusión de tres a diez años, el que tomare parte en una asociación o banda de tres o más personas…"}], "n": 246, "l": "210", "s": "Será reprimido con prisión o reclusión de tres a diez años, el que tomare parte en una asociación o banda de tres o más personas destinada a cometer delitos por el solo hecho de ser…", "p": ["Será reprimido con prisión o reclusión de tres a diez años, el que tomare parte en una asociación o banda de tres o más personas destinada a cometer delitos por el solo hecho de ser miembro de la asociación. Para los jefes u organizadores de la asociación el mínimo de la pena será de cinco años de prisión o reclusión."], "nt": [], "z": ["3–10 años"]}, {"pn": [{"t": "PR", "a": 60, "b": 240, "c": "Se impondrá reclusión o prisión de cinco a veinte años al que tomare parte, cooperare o ayudare a la formación o al mantenim…"}], "n": 247, "l": "210 bis", "s": "Se impondrá reclusión o prisión de cinco a veinte años al que tomare parte, cooperare o ayudare a la formación o al mantenimiento de una asociación ilícita destinada a cometer delitos…", "p": ["Se impondrá reclusión o prisión de cinco a veinte años al que tomare parte, cooperare o ayudare a la formación o al mantenimiento de una asociación ilícita destinada a cometer delitos cuando la acción contribuya a poner en peligro la vigencia de la Constitución Nacional, siempre que ella reúna por lo menos dos de las siguientes características:", "a) Estar integrada por diez o más individuos;", "b) Poseer una organización militar o de tipo militar;", "c) Tener estructura celular;", "d) Disponer de armas de guerra o explosivos de gran poder ofensivo;", "e) Operar en más de una de las jurisdicciones políticas del país;", "f) Estar compuesta por uno o más oficiales o suboficiales de las fuerzas armadas o de seguridad;", "g) Tener notorias conexiones con otras organizaciones similares existentes en el país o en el exterior;", "h) Recibir algún apoyo, ayuda o dirección de funcionarios públicos."], "nt": [], "z": ["5–20 años"]}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Ser y por cualquier medio la apología de un delito o de un condenado por delito."], "nt": [], "z": ["1 mes–1 año"]}, {"pn": [{"t": "PR", "a": 36, "b": 96, "c": "Será reprimido con reclusión o prisión de tres a ocho años el que organizare o tomare parte en agrupaciones permanentes o transi…"}, {"t": "PR", "a": 60, "b": 240, "c": "…financiación del terrorismo Artículo 213 ter.- Se impondrá reclusión o prisión de CINCO (5) a VEINTE (20) años al que tomare parte de una asociación ilícita cuyo propósito sea, med…"}, {"t": "PR", "a": 60, "b": 180, "c": "…clusión o prisión. Artículo 213 quáter.- Será reprimido con reclusión o prisión de CINCO (5) a QUINCE (15) años, salvo que correspondiere una pena mayor por aplicación de las reglas…"}], "n": 251, "l": "213 bis", "s": "Será reprimido con reclusión o prisión de tres a ocho años el que organizare o tomare parte en agrupaciones permanentes o transitorias que, sin estar comprendidas en el artículo 210 de…", "p": ["Será reprimido con reclusión o prisión de tres a ocho años el que organizare o tomare parte en agrupaciones permanentes o transitorias que, sin estar comprendidas en el artículo 210 de este código, tuvieren por objeto principal o accesorios imponer sus ideas o combatir las ajenas por la fuerza o el temor, por el solo hecho de ser miembro de la asociación.", "Capítulo VI. Asociaciones ilícitas terroristas y financiación del terrorismo", "Artículo 213 ter.- Se impondrá reclusión o prisión de CINCO (5) a VEINTE (20) años al que tomare parte de una asociación ilícita cuyo propósito sea, mediante la comisión de delitos, aterrorizar a la población u obligar a un gobierno o a una organización internacional a realizar un acto o abstenerse de hacerlo, siempre que ella reúna las siguientes características:", "a) Tener un plan de acción destinado a la propagación del odio étnico, religioso o político;", "b) Estar organizada en redes operativas internacionales;", "c) Disponer de armas de guerra, explosivos, agentes químicos o bacteriológicos o cualquier otro medio idóneo para poner en peligro la vida o la integridad de un número indeterminado de personas.", "Para los fundadores o jefes de la asociación el mínimo de la pena será de DIEZ (10) años de reclusión o prisión.", "Artículo 213 quáter.- Será reprimido con reclusión o prisión de CINCO (5) a QUINCE (15) años, salvo que correspondiere una pena mayor por aplicación de las reglas de los artículos 45 y 48, el que recolectare o proveyere bienes o dinero, con conocimiento de que serán utilizados, en todo o en parte, para financiar a una asociación ilícita terrorista de las descriptas en el artículo 213 ter, o a un miembro de éstas para la comisión de cualquiera de los delitos que constituyen su objeto, independientemente de su acaecimiento."], "nt": ["(Capítulo incorporado por art. 1° de la Ley N° 26.268 B.O. 5/7/2007)", "(Artículo incorporado por art. 2° de la Ley N° 26.268 B.O. 5/7/2007)", "(Artículo incorporado por art. 3° de la Ley N° 26.268 B.O. 5/7/2007)"], "z": ["3–8 años"]}, {"pn": [{"t": "PR", "a": 120, "b": 300, "c": "Será reprimido con reclusión o prisión de diez a veinticinco años o reclusión o prisión perpetua y en uno u otro caso, inhabilitación a…"}, {"t": "PR", "p": 1, "c": "…rimido con reclusión o prisión de diez a veinticinco años o reclusión o prisión perpetua y en uno u otro caso, inhabilitación absoluta perpetua, siempre que e…"}], "n": 252, "l": "214", "s": "Será reprimido con reclusión o prisión de diez a veinticinco años o reclusión o prisión perpetua y en uno u otro caso, inhabilitación absoluta perpetua, siempre que el hecho no se halle…", "p": ["Será reprimido con reclusión o prisión de diez a veinticinco años o reclusión o prisión perpetua y en uno u otro caso, inhabilitación absoluta perpetua, siempre que el hecho no se halle comprendido en otra disposición de este código, todo argentino o toda persona que deba obediencia a la Nación por razón de su empleo o función pública, que tomare las armas contra ésta, se uniere a sus enemigos o les prestare cualquier ayuda o socorro."], "nt": [], "z": ["10–25 años", "perpetua"]}, {"pn": [{"t": "PR", "p": 1, "c": "Será reprimido con reclusión o prisión perpetua, el que cometiere el delito previsto en el artículo precedente, en lo…"}], "n": 253, "l": "215", "s": "Será reprimido con reclusión o prisión perpetua, el que cometiere el delito previsto en el artículo precedente, en los casos siguientes:", "p": ["Será reprimido con reclusión o prisión perpetua, el que cometiere el delito previsto en el artículo precedente, en los casos siguientes:", "1º Si ejecutare un hecho dirigido a someter total o parcialmente la Nación al dominio extranjero o a menoscabar su independencia o integridad;", "2º Si indujere o decidiere a una potencia extranjera a hacer la guerra contra la República.", "3° Si perteneciere a las fuerzas armadas. (Inciso incorporado por art. 5° del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación)"], "nt": [], "z": ["perpetua"]}, {"pn": [{"t": "PR", "a": 12, "b": 96, "c": "Será reprimido con reclusión o prisión de uno a ocho años, el que tomare parte en una conspiración de dos o más personas, para…"}], "n": 254, "l": "216", "s": "Será reprimido con reclusión o prisión de uno a ocho años, el que tomare parte en una conspiración de dos o más personas, para cometer el delito de traición, en cualquiera de los casos…", "p": ["Será reprimido con reclusión o prisión de uno a ocho años, el que tomare parte en una conspiración de dos o más personas, para cometer el delito de traición, en cualquiera de los casos comprendidos en los artículos precedentes, si la conspiración fuere descubierta antes de empezar su ejecución."], "nt": [], "z": ["1–8 años"]}, {"pn": [], "n": 255, "l": "217", "s": "Quedará eximido de pena el que revelare la conspi e una negociación con un estado extranjero, la condujere de un modo perjudicial a la Nación, apartándose de sus instrucciones."], "nt": [], "z": ["3–10 años"]}, {"pn": [{"t": "P", "a": 60, "b": 180, "c": "Serán reprimidos con prisión de cinco a quince años los que se alzaren en armas para cambiar la Constitución, deponer alg…"}], "n": 264, "l": "226", "s": "Serán reprimidos con prisión de cinco a quince años los que se alzaren en armas para cambiar la Constitución, deponer alguno de los poderes públicos del gobierno nacional, arrancarle…", "p": ["Serán reprimidos con prisión de cinco a quince años los que se alzaren en armas para cambiar la Constitución, deponer alguno de los poderes públicos del gobierno nacional, arrancarle alguna medida o concesión o impedir, aunque sea temporariamente, el libre ejercicio de sus facultades constitucionales o su formación o renovación en los términos y formas legales. Si el hecho descripto en el párrafo anterior fuese perpetrado con el fin de cambiar de modo permanente el sistema democrático de gobierno, suprimir la organización federal, eliminar la división de poderes, abrogar los derechos fundamentales de la persona humana o suprimir o menoscabar, aunque sea temporariamente, la independencia económica de la Nación, la pena será de ocho a veinticinco años de prisión. Cuando el hecho fuere perpetrado por personas que tuvieren estado, empleo o asimilación militar, el mínimo de las penas se incrementará en un tercio."], "nt": [], "z": ["5–15 años", "8–25 años"]}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "…conductas previstas en el artículo 226, será reprimido con prisión de uno a cuatro años."}], "n": 265, "l": "226 bis", "s": "El que amenazare pública e idóneamente con la comisión de alguna de las conductas previstas en el artículo 226, será reprimido con prisión de uno a cuatro años.", "p": ["El que amenazare pública e idóneamente con la comisión de alguna de las conductas previstas en el artículo 226, será reprimido con prisión de uno a cuatro años."], "nt": [], "z": ["1–4 años"]}, {"pn": [], "n": 266, "l": "227", "s": "Serán reprimidos con las penas establecidas en el artículo 215 para los traidores a la patria, los miembros del Congreso que concedieren al Poder Ejecutivo Nacional y los miembros de las…", "p": ["Serán reprimidos con las penas establecidas en el artículo 215 para los traidores a la patria, los miembros del Congreso que concedieren al Poder Ejecutivo Nacional y los miembros de las legislaturas provinciales que concedieren a los Gobernadores de provincia, facultades extraordinarias, la suma del poder público o sumisiones o supremacías, por las que la vida, el honor o la fortuna de los argentinos queden a merced de algún gobierno o de alguna persona (artículo 29 de la Constitución Nacional)."], "nt": [], "z": []}, {"pn": [], "n": 267, "l": "227 bis", "s": "Serán reprimidos con las penas establecidas en el artículo 215 para los traidores a la patria, con la disminución del artículo 46, los miembros de alguno de los tres poderes del Estado…", "p": ["Serán reprimidos con las penas establecidas en el artículo 215 para los traidores a la patria, con la disminución del artículo 46, los miembros de alguno de los tres poderes del Estado nacional o de las provincias que consintieran la consumación de los hechos descriptos en el artículo 226, continuando en sus funciones o asumiéndolas luego de modificada por la fuerza la Constitución o depuesto alguno de los poderes públicos, o haciendo cumplir las medidas dispuestas por quienes usurpen tales poderes. Se aplicará de uno a ocho años de prisión o reclusión e inhabilitación absoluta por el doble de la condena, a quienes, en los casos previstos en el párrafo anterior, aceptaren colaborar continuando en funciones o asumiéndolas, con las autoridades de facto, en algunos de los siguientes cargos: ministros, secretarios de Estado, subsecretarios, directores generales o nacionales o de jerarquía equivalente en el orden nacional, provincial o municipal, presidente, vicepresidente, vocales o miembros de directorios de organismos descentralizados o autárquicos o de bancos oficiales o de empresas del Estado; sociedades del Estado, sociedades de economía mixta, o de sociedades anónimas con participación estatal mayoritaria, o de entes públicos equivalentes a los enumerados en el orden nacional, provincial o municipal, embajadores, rectores o decanos de universidades nacionales o provinciales, miembros de las fuerzas armadas o de policía o de organismos de seguridad en grados de jefes o equivalentes, intendentes municipales, o miembros del ministerio público fiscal de cualquier jerarquía o fuero, personal jerárquico del Parlamento Nacional y de las legislaturas provinciales. Si las autoridades de facto crearen diferentes jerarquías administrativas o cambiaren las denominaciones de las funciones señaladas en el párrafo anterior, la pena se aplicará a quienes las desempeñen, atendiendo a la análoga naturaleza y contenido de los cargos con relación a los actuales."], "nt": [], "z": ["1–8 años"]}, {"pn": [], "n": 268, "l": "227 ter", "s": "El máximo de la pena establecida para cualquier delito será aumentado en un medio, cuando la acción contribuya a poner en peligro la vigencia de la Constitución Nacional.", "p": ["El máximo de la pena establecida para cualquier delito será aumentado en un medio, cuando la acción contribuya a poner en peligro la vigencia de la Constitución Nacional. Esta disposición no será aplicable cuando las circunstancias mencionadas en ella se encuentren contempladas como elemento constitutivo o calificante del delito de que se trate."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 24, "c": "Se impondrá prisión de seis meses a dos años al que ejecutare o mandare ejecutar decretos de los concilios, bulas,…"}], "n": 269, "l": "228", "s": "Se impondrá prisión de seis meses a dos años al que ejecutare o mandare ejecutar decretos de los concilios, bulas, breves y rescriptos del Papa que, p ndo el hecho no constituya delito más severamente penado por este código."], "nt": [], "z": ["1–4 años"]}, {"pn": [], "n": 272, "l": "231", "s": "Luego que se manifieste la rebelión o sedición, la autoridad nacional más próxima intimará hasta dos veces a los sublevados que inmediatamente se disuelvan o retiren, dejando pasar entre…", "p": ["Luego que se manifieste la rebelión o sedición, la autoridad nacional más próxima intimará hasta dos veces a los sublevados que inmediatamente se disuelvan o retiren, dejando pasar entre una y otra intimación el tiempo necesario para ello. Si los sublevados no se retiraren inmediatamente después de la segunda intimación, la autoridad hará uso de la fuerza para disolverlos. No serán necesarias, respectivamente, la primera y segunda intimación, desde que los sublevados hicieren uso de las armas."], "nt": [], "z": []}, {"pn": [], "n": 273, "l": "232", "s": "En caso de disolverse el tumulto sin haber causado otro mal que la perturbación momentánea del orden, sólo serán enjuiciados los promotores o directores, a quienes se reprimirá con la…", "p": ["En caso de disolverse el tumulto sin haber causado otro mal que la perturbación momentánea del orden, sólo serán enjuiciados los promotores o directores, a quienes se reprimirá con la mitad de la pena señalada para el delito."], "nt": [], "z": []}, {"pn": [], "n": 274, "l": "233", "s": "El que tomare parte como promotor o director, en una conspiración de dos o más personas para cometer los delitos de rebelión o sedición, será reprimido, si la conspiración fuere…", "p": ["El que tomare parte como promotor o director, en una conspiración de dos o más personas para cometer los delitos de rebelión o sedición, será reprimido, si la conspiración fuere descubierta antes de ponerse en ejecución, con la cuarta parte de la pena correspondiente al delito que se trataba de perpetrar."], "nt": [], "z": []}, {"pn": [], "n": 275, "l": "234", "s": "El que sedujere tropas o usurpare el mando de ellas, de un buque de guerra, de una plaza fuerte o de un puesto de guardia o retuviere ilegalmente un mando político o militar para cometer…", "p": ["El que sedujere tropas o usurpare el mando de ellas, de un buque de guerra, de una plaza fuerte o de un puesto de guardia o retuviere ilegalmente un mando político o militar para cometer una rebelión o una sedición, será reprimido con la mitad de la pena correspondiente al delito que trataba de perpetrar. Si llegare a tener efecto la rebelión o la sedición, la pena será la establecida para los autores de la rebelión o de la sedición en los casos respectivos."], "nt": [], "z": []}, {"pn": [], "n": 276, "l": "235", "s": "Los funcionarios públicos que hubieren promovido o ejecutado alguno de los delitos previstos en este Título, sufrirán además inhabilitación especial por un tiempo doble del de la…", "p": ["Los funcionarios públicos que hubieren promovido o ejecutado alguno de los delitos previstos en este Título, sufrirán además inhabilitación especial por un tiempo doble del de la condena.- Los funcionarios que no hubieren resistido una rebelión o sedición por todos los medios a su alcance, sufrirán inhabilitación especial de uno a seis años.- Auméntase al doble el máximo de la pena establecida para los delitos previstos en este Título, para los jefes y agentes de la fuerza pública que incurran en ellos usando u ostentando las armas y demás materiales ofensivos que se les hayan confiado en tal calidad."], "nt": [], "z": ["1–6 años"]}, {"pn": [], "n": 277, "l": "236", "s": "Cuando al ejecutar los delitos previstos en este Título, el culpable cometiere algún otro, se observarán las reglas establecidas para el concurso de hechos punibles.", "p": ["Cuando al ejecutar los delitos previstos en este Título, el culpable cometiere algún otro, se observarán las reglas establecidas para el concurso de hechos punibles."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Será reprimido con prisión de un mes a un año, el que emple  "s": "Será reprimido con prisión de quince días a seis meses:", "p": ["Será reprimido con prisión de quince días a seis meses:", "1 El que perturbare el orden en las sesiones de los cuerpos legislativos nacionales o provinciales, en las audiencias de los tribunales de justicia o dondequiera que una autoridad esté ejerciendo sus funciones;", "2 El que sin estar comprendido en el artículo 237, impidiere o estorbare a un funcionario público cumplir un acto propio de sus funciones."], "nt": [], "z": ["15 días–6 meses"]}, {"pn": [{"t": "P", "a": 36, "b": 120, "c": "Se impondrá prisión de tres (3) a diez (10) años a los militares que: 1. Tumultuosamente peticionaren o se atribuyeren…"}, {"t": "P", "a": 12, "b": 60, "c": "…stas, estando en condiciones de hacerlo. 4. Será penado con prisión de uno (1) a cinco (5) años la conspiración para cometer los delitos de este artículo. No será pe…"}], "n": 286, "l": "241 bis", "s": "Se impondrá prisión de tres (3) a diez (10) años a los militares que:", "p": ["Se impondrá prisión de tres (3) a diez (10) años a los militares que:", "1. Tumultuosamente peticionaren o se atribuyeren la representación de una fuerza armada. 2. Tomaren armas o hicieren uso de éstas, de naves o aeronaves o extrajeren fuerzas armadas de sus asientos naturales, contra las órdenes de sus superiores.", "3. Hicieren uso del personal de la fuerza, de la nave o de la aeronave bajo su mando contra sus superiores u omitieren resistir o contener a éstas, estando en condiciones de hacerlo. 4. Será penado con prisión de uno (1) a cinco (5) años la conspiración para cometer los delitos de este artículo. No será penado por conspiración quien la denunciare en tiempo para evitar la comisión del hecho.", "5. Si en razón de los hechos previstos en este artículo resultare la muerte de una o más personas, se sufrieren pérdidas militares o se impidiere o dificultare la salvación de vidas en supuesto de catástrofe, el máximo de la pena se elevará a veinticinco (25) años. En cua
