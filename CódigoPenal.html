}, {"pn": [], "n": 103, "l": "92", "s": "Si concurriere alguna de las circunstancias enumeradas en el artículo 80, la pena será:", "p": ["Si concurriere alguna de las circunstancias enumeradas en el artículo 80, la pena será: en el caso del artículo 89, de seis meses a dos años; en el caso del artículo 90, de tres a diez años; y en el caso del artículo 91, de tres a quince años."], "nt": [], "z": ["6 meses–2 años", "3–10 años", "3–15 años"]}, {"pn": [], "n": 104, "l": "93", "s": "Si concurriere la circunstancia enunciada en el inciso 1º letra a) del artículo 81, la pena será:", "p": ["Si concurriere la circunstancia enunciada en el inciso 1º letra a) del artículo 81, la pena será: en el caso del artículo 89, de quince días a seis meses; en el caso del artículo 90, de seis meses a tres años; y en el caso del artículo 91, de uno a cuatro años."], "nt": [], "z": ["15 días–6 meses", "6 meses–3 años", "1–4 años"]}, {"pn": [{"t": "P", "a": 1, "b": 36, "c": "Se impondrá prisión de un mes a tres años o multa de mil a quince mil pesos e inhabilitación especial por uno a…"}], "n": 105, "l": "94", "s": "Se impondrá prisión de un mes a tres años o multa de mil a quince mil pesos e inhabilitación especial por uno a cuatro años, el que por imprudencia o negligencia, por impericia en su…", "p": ["Se impondrá prisión de un mes a tres años o multa de mil a quince mil pesos e inhabilitación especial por uno a cuatro años, el que por imprudencia o negligencia, por impericia en su arte o profesión, o por inobservancia de los reglamentos o deberes a su cargo, causare a otro un daño en el cuerpo o en la salud.", "Si las lesiones fueran de las descritas en los artículos 90 ó 91 y concurriera alguna de las circunstancias previstas en el segundo párrafo del artículo 84, el mínimo de la pena prevista en el primer párrafo, será de seis meses o multa de tres mil pesos e inhabilitación especial por dieciocho meses."], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 25.189 28/10/1999)", "(Multa actualizada por la Ley N° 24.286 B.O. 29/12/1993.)"], "z": ["1 mes–3 años"]}, {"pn": [{"t": "PR", "a": 24, "b": 72, "c": "…ieron violencia sobre la persona del ofendido y se aplicará reclusión o prisión de dos a seis años en caso de muerte y de uno a cuatro en caso de lesión."}], "n": 106, "l": "95", "s": "Cuando en riña o agresión en que tomaren parte más de dos personas, resultare muerte o lesiones de las determinadas en los artículos 90 y 91, sin que constare quiénes las causaron, se…", "p": ["Cuando en riña o agresión en que tomaren parte más de dos personas, resultare muerte o lesiones de las determinadas en los artículos 90 y 91, sin que constare quiénes las causaron, se tendrá por autores a todos los que ejercieron violencia sobre la persona del ofendido y se aplicará reclusión o prisión de dos a seis años en caso de muerte y de uno a cuatro en caso de lesión."], "nt": [], "z": ["2–6 años"]}, {"pn": [], "n": 107, "l": "96", "s": "Si las lesiones fueren las previstas en el artículo 89, la pena aplicable será de cuatro a ciento veinte días de prisión.", "p": ["Si las lesiones fueren las previstas en el artículo 89, la pena aplicable será de cuatro a ciento veinte días de prisión."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 6, "c": "…las demás condiciones del desafío, serán reprimidos: 1º Con prisión de uno a seis meses, al que no infiriere lesión a su adversario o sólo le causare una les…"}, {"t": "P", "a": 12, "b": 48, "c": "…re una lesión de las determinadas en el artículo 89. 2º Con prisión de uno a cuatro años, al que causare la muerte de su adversario o le infiriere lesión de l…"}], "n": 108, "l": "97", "s": "Los que se batieren en duelo, con intervención de dos o más padrinos, mayores de edad, que elijan las armas y arreglen las demás condiciones del desafío, serán reprimidos:", "p": ["Los que se batieren en duelo, con intervención de dos o más padrinos, mayores de edad, que elijan las armas y arreglen las demás condiciones del desafío, serán reprimidos:", "1º Con prisión de uno a seis meses, al que no infiriere lesión a su adversario o sólo le causare una lesión de las determinadas en el artículo 89.", "2º Con prisión de uno a cuatro años, al que causare la muerte de su adversario o le infiriere lesión de las determinadas en los artículos 90 y 91."], "nt": [], "z": ["1–6 meses", "1–4 años"]}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "…ra el autor de lesiones; 3º El que no causare lesiones, con prisión de un mes a un año."}], "n": 109, "l": "98", "s": "Los que se batieren, sin la intervención de padrinos, mayores de edad, que elijan las armas y arreglen las demás condiciones del desafío, serán reprimidos:", "p": ["Los que se batieren, sin la intervención de padrinos, mayores de edad, que elijan las armas y arreglen las demás condiciones del desafío, serán reprimidos:", "1º El que matare a su adversario, con la pena señalada para el homicida;", "2º El que causare lesiones, con la pena señalada para el autor de lesiones;", "3º El que no causare lesiones, con prisión de un mes a un año."], "nt": [], "z": ["1 mes–1 año"]}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "…zada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993) 2 Con prisión de uno a cuatro años, si se causare muerte o lesiones de las mencionadas en los artículos…"}], "n": 110, "l": "99", "s": "El que instigare a otro a provocar o a aceptar un duelo y el que desacreditare públicamente a otro por no desafiar o por rehusar un desafío, serán reprimidos:", "p": ["El que instigare a otro a provocar o a aceptar un duelo y el que desacreditare públicamente a otro por no desafiar o por rehusar un desafío, serán reprimidos: 1 Con multa de pesos mil a pesos quince mil si el duelo no se realizare o si realizándose, no se produjere muerte ni lesiones o sólo lesiones de las comprendidas en el artículo 89. (Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)", "2 Con prisión de uno a cuatro años, si se causare muerte o lesiones de las mencionadas en los artículos 90 y 91."], "nt": [], "z": ["1–4 años"]}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "…és pecuniario u otro objeto inmoral, será reprimido: 1º Con prisión de uno a cuatro años, si el duelo no se verificare o si efectuándose, no resultare muerte…"}, {"t": "PR", "a": 36, "b": 120, "c": "…e o si efectuándose, no resultare muerte ni lesiones. 2 Con reclusión o prisión de tres a diez años, si el duelo se realizare y resultaren lesiones; 3 Con reclusión o pr…"}, {"t": "PR", "a": 120, "b": 300, "c": "…años, si el duelo se realizare y resultaren lesiones; 3 Con reclusión o prisión de diez a veinticinco años, si se produjere la muerte."}], "n": 111, "l": "100", "s": "El que provocare o diere causa a un desafío, proponiéndose un interés pecuniario u otro objeto inmoral, será reprimido:", "p": ["El que provocare o diere causa a un desafío, proponiéndose un interés pecuniario u otro objeto inmoral, será reprimido:", "1º Con prisión de uno a cuatro años, si el duelo no se verificare o si efectuándose, no resultare muerte ni lesiones.", "2 Con reclusión o prisión de tres a diez años, si el duelo se realizare y resultaren lesiones; 3 Con reclusión o prisión de diez a veinticinco años, si se produjere la muerte."], "nt": [], "z": ["1–4 años", "3–10 años", "10–25 años"]}, {"pn": [{"t": "PR", "a": 36, "b": 120, "c": "…diciones ajustadas por los padrinos, será reprimido: 1º Con reclusión o prisión de tres a diez años, si causare lesiones a su adversario. 2º Con reclusión o prisión de d…"}, {"t": "PR", "a": 120, "b": 300, "c": "…es a diez años, si causare lesiones a su adversario. 2º Con reclusión o prisión de diez a veinticinco años, si le causare la muerte."}], "n": 112, "l": "101", "s": "El combatiente que faltare, en daño de su adversario, a las condiciones ajustadas por los padrinos, será reprimido:", "p": ["El combatiente que faltare, en daño de su adversario, a las condiciones ajustadas por los padrinos, será reprimido:", "1º Con reclusión o prisión de tres a diez años, si causare lesiones a su adversario.", "2º Con reclusión o prisión de diez a veinticinco años, si le causare la muerte."], "nt": [], "z": ["3–10 años", "10–25 años"]}, {"pn": [], "n": 113, "l": "102", "s": "Los padrinos de un duelo que usaren cualquier género de alevosía en la ejecución del mismo, serán reprimidos con las penas señaladas en el artículo anterior, según fueren las…", "p": ["Los padrinos de un duelo que usaren cualquier género de alevosía en la ejecución del mismo, serán reprimidos con las penas señaladas en el artículo anterior, según fueren las consecuencias que resultaren."], "nt": [], "z": []}, {"pn": [{"t": "PR", "a": 12, "b": 48, "c": "…e de ellas debiere resultar la muerte, serán reprimidos con reclusión o prisión de uno a cuatro años, si se verificare la muerte de alguno de los combatientes. Si no se v…"}], "n": 114, "l": "103", "s": "Cuando los padrinos concertaren un duelo a muerte o en condiciones tales que de ellas debiere resultar la muerte, serán reprimidos con reclusión o prisión de uno a cuatro años, si se…", "p": ["Cuando los padrinos concertaren un duelo a muerte o en condiciones tales que de ellas debiere resultar la muerte, serán reprimidos con reclusión o prisión de uno a cuatro años, si se verificare la muerte de alguno de los combatientes. Si no se verificare la muerte de alguno de ellos, la pena será de multa de pesos mil a pesos quince mil."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N°24.286 B.O. 29/12/1993)"], "z": ["1–4 años"]}, {"pn": [{"t": "P", "a": 0.5, "b": 6, "c": "…el hecho no importe un delito más grave. Será reprimida con prisión de quince días a seis meses, la agresión con toda arma, aunque no se causare herida."}], "n": 115, "l": "104", "s": "Será reprimido con uno a tres años de prisión, el que disparare un arma de fuego contra una persona sin herirla.", "p": ["Será reprimido con uno a tres años de prisión, el que disparare un arma de fuego contra una persona sin herirla.", "Esta pena se aplicará aunque se causare herida a que corresponda pena menor, siempre que el hecho no importe un delito más grave.", "Será reprimida con prisión de quince días a seis meses, la agresión con toda arma, aunque no se causare herida."], "nt": [], "z": ["15 días–6 meses"]}, {"pn": [], "n": 116, "l": "105", "s": "Si concurriera alguna de las circunstancias previstas en los artículos 80 y 81, inciso 1º, letra a), la pena se aumentará o disminuirá en un tercio respectivamente.", "p": ["Si concurriera alguna de las circunstancias previstas en los artículos 80 y 81, inciso 1º, letra a), la pena se aumentará o disminuirá en un tercio respectivamente."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "…la que el mismo autor haya incapacitado, será reprimido con prisión de 2 a 6 años. La pena será de reclusión o prisión de 3 a 10 años, si a consecuenci…"}, {"t": "PR", "a": 36, "b": 120, "c": "…, será reprimido con prisión de 2 a 6 años. La pena será de reclusión o prisión de 3 a 10 años, si a consecuencia del abandono resultare grave daño en el cuerpo o e…"}], "n": 117, "l": "106", "s": "El que pusiere en peligro la vida o la salud de otro, sea colocándolo en situación de desamparo, sea abandonando a su suerte a una persona incapaz de valerse y a la que deba mantener o…", "p": ["El que pusiere en peligro la vida o la salud de otro, sea colocándolo en situación de desamparo, sea abandonando a su suerte a una persona incapaz de valerse y a la que deba mantener o cuidar o a la que el mismo autor haya incapacitado, será reprimido con prisión de 2 a 6 años.", "La pena será de reclusión o prisión de 3 a 10 años, si a consecuencia del abandono resultare grave daño en el cuerpo o en la salud de la víctima.", "Si ocurriere la muerte, la pena será de 5 a 15 años de reclusión o prisión."], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 24.410 B.O. 2/1/1995)"], "z": []}, {"pn": [], "n": 118, "l": "107", "s": "El máximum y el mínimum de las penas establecidas en el artículo precedente, serán aumentados en un tercio cuando el delito fuera cometido por los padres contra sus hijos y por éstos…", "p": ["El máximum y el mínimum de las penas establecidas en el artículo precedente, serán aumentados en un tercio cuando el delito fuera cometido por los padres contra sus hijos y por éstos contra aquéllos o por el cónyuge.."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 24.410 B.O. 2/1/1995)"], "z": []}, {"pn": [], "n": 119, "l": "108", "s": "Será reprimido con multa de pesos setecientos cincuenta a pesos doce mil quinientos el que encontrando perdido o desamparado a un menor de diez años o a una persona herida o inválida o…", "p": ["Será reprimido con multa de pesos setecientos cincuenta a pesos doce mil quinientos el que encontrando perdido o desamparado a un menor de diez años o a una persona herida o inválida o amenazada de un peligro cualquiera; omitiere prestarle el auxilio necesario, cuando pudiere hacerlo sin riesgo personal o no diere aviso inmediatamente a la autoridad."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": []}, {"pn": [], "n": 120, "l": "109", "s": "La calumnia o falsa imputación a una persona física determinada de la comisión de un delito concreto y circunstanciado que dé lugar a la acción pública, será reprimida con multa de pesos…", "p": ["La calumnia o falsa imputación a una persona física determinada de la comisión de un delito concreto y circunstanciado que dé lugar a la acción pública, será reprimida con multa de pesos tres mil ($ 3.000.-) a pesos treinta mil ($ 30.000.-). En ningún caso configurarán delito de calumnia las expresiones referidas a asuntos de interés público o las que no sean asertivas."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 26.551 B.O. 27/11/2009)"], "z": []}, {"pn": [], "n": 121, "l": "110", "s": "El que intencionalmente deshonrare o desacreditare a una persona física determinada será reprimido con multa de pesos mil quinientos ($ 1.500.-) a pesos veinte mil", "p": ["El que intencionalmente deshonrare o desacreditare a una persona física determinada será reprimido con multa de pesos mil quinientos ($ 1.500.-) a pesos veinte mil", "($ 20.000.-). En ningún caso configurarán delito de injurias las expresiones referidas a asuntos de interés público o las que no sean asertivas. Tampoco configurarán delito de injurias los calificativos lesivos del honor cuando guardasen relación con un asunto de interés público."], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 26.551 B.O. 27/11/2009)", "(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": []}, {"pn": [], "n": 122, "l": "111", "s": "El acusado de injuria, en los casos en los que las expresiones de ningún modo estén vinculadas con asuntos de interés público, no podrá probar la verdad de la imputación salvo en los…", "p": ["El acusado de injuria, en los casos en los que las expresiones de ningún modo estén vinculadas con asuntos de interés público, no podrá probar la verdad de la imputación salvo en los casos siguientes:", "1) Si el hecho atribuido a la persona ofendida, hubiere dado lugar a un proceso penal.", "2) Si el querellante pidiera la prueba de la imputación dirigida contra él.", "En estos casos, si se probare la verdad de las imputaciones, el acusado quedará exento de pena."], "nt": ["(Artículo sustituido por art. 3° de la Ley N° 26.551 B.O. 27/11/2009)"], "z": []}, {"pn": [], "n": 123, "l": "112", "s": "—", "p": ["—"], "nt": ["(Artículo derogado por art. 4° de la Ley N° 26.551 B.O. 27/11/2009)"], "z": []}, {"pn": [], "n": 124, "l": "113", "s": "El que publicare o reprodujere, por cualquier medio, injurias o calumnias inferidas por otro, será reprimido como autor de las injurias o calumnias de que se trate, siempre que su…", "p": ["El que publicare o reprodujere, por cualquier medio, injurias o calumnias inferidas por otro, será reprimido como autor de las injurias o calumnias de que se trate, siempre que su contenido no fuera atribuido en forma sustancialmente fiel a la fuente pertinente. En ningún caso configurarán delito de calumnia las expresiones referidas a asuntos de interés público o las que no sean asertivas."], "nt": ["(Artículo sustituido por art. 5° de la Ley N° 26.551 B.O. 27/11/2009)"], "z": []}, {"pn": [], "n": 125, "l": "114", "s": "Cuando la injuria o calumnia se hubiere propagado por medio de la prensa, en la capital y territorios nacionales, sus autores quedarán sometidos a las sanciones del presente código y el…", "p": ["Cuando la injuria o calumnia se hubiere propagado por medio de la prensa, en la capital y territorios nacionales, sus autores quedarán sometidos a las sanciones del presente código y el juez o tribunal ordenará, si lo pidiere el ofendido, que los editores inserten en los respectivos impresos o periódicos, a costa del culpable, la sentencia o satisfacción."], "nt": [], "z": []}, {"pn": [], "n": 126, "l": "115", "s": "Las injurias proferidas por los litigantes, apoderados o defensores, en los escritos, discursos o informes producidos ante los tribunales y no dados a publicidad, quedarán sujetas…", "p": ["Las injurias proferidas por los litigantes, apoderados o defensores, en los escritos, discursos o informes producidos ante los tribunales y no dados a publicidad, quedarán sujetas únicamente a las correcciones disciplinarias correspondientes."], "nt": [], "z": []}, {"pn": [], "n": 127, "l": "116", "s": "Cuando las injurias fueren recíprocas, el tribunal podrá, según las circunstancias, declarar exentas de pena a las dos partes o a alguna de ellas.", "p": ["Cuando las injurias fueren recíprocas, el tribunal podrá, según las circunstancias, declarar exentas de pena a las dos partes o a alguna de ellas."], "nt": [], "z": []}, {"pn": [], "n": 128, "l": "117", "s": "El acusado de injuria o calumnia quedará exento de pena si se retractare públicamente, antes de contestar la querella o en el acto de hacerlo.", "p": ["El acusado de injuria o calumnia quedará exento de pena si se retractare públicamente, antes de contestar la querella o en el acto de hacerlo. La retractación no importará para el acusado la aceptación de su culpabilidad."], "nt": ["(Artículo sustituido por art. 6° de la Ley N° 26.551 B.O. 27/11/2009)"], "z": []}, {"pn": [], "n": 129, "l": "117 bis", "s": "1°.", "p": ["1°. (Inciso derogado por art. 14 de la Ley N° 26.388, B.O. 25/6/2008)", "2°. La pena será de seis meses a tres años, al que proporcionara a un tercero a sabiendas información falsa contenida en un archivo de datos personales.", "3°. La escala penal se aumentará en la mitad del mínimo y del máximo, cuando del hecho se derive perjuicio a alguna persona.", "4°. Cuando el autor o responsable del ilícito sea funcionario público en ejercicio de sus funciones, se le aplicará la accesoria de inhabilitación para el desempeño de cargos públicos por el doble del tiempo que el de la condena."], "nt": ["(Artículo incorporado por art. 32 de la Ley N° 25.326 B.O. 2/11/2000)", "(rúbrica del título sustituida por art. 1° de la Ley N° 25.087 B.O. 14/5/1999)", "(Nota Infoleg: Capítulo I y su rúbrica: Adulterio, derogados por art. 3° de la Ley N° 24.453"], "z": ["6 meses–3 años"]}, {"pn": [], "n": 130, "l": "118", "s": "—", "p": ["—"], "nt": ["(Artículo derogado por art. 4° de la Ley N°24.453 B.O. 7/3/1995)"], "z": []}, {"pn": [{"t": "PR", "a": 6, "b": 48, "c": "Será reprimido con reclusión o prisión de seis meses a cuatro años el que cuando mediare violencia, amenaza, abuso coactivo o intimidato…"}], "n": 131, "l": "119", "s": "Será reprimido con reclusión o prisión de seis meses a cuatro años el que cuando mediare violencia, amenaza, abuso coactivo o intimidatorio de una relación de dependencia, de autoridad,…", "p": ["Será reprimido con reclusión o prisión de seis meses a cuatro años el que cuando mediare violencia, amenaza, abuso coactivo o intimidatorio de una relación de dependencia, de autoridad, o de poder, o aprovechándose de que la víctima por cualquier causa no haya podido consentir libremente la acción.", "La pena será de cuatro a diez años de reclusión o prisión cuando el abuso por su duración o circunstancias de su realización, hubiere configurado un sometimiento sexual gravemente ultrajante para la víctima.", "La pena será de seis a quince años de reclusión o prisión cuando mediando las circunstancias del primer párrafo hubiere acceso carnal por cualquier vía.", "En los supuestos de los dos párrafos anteriores, la pena será de ocho a veinte años de reclusión o prisión si:", "a) Resultare un grave daño en la salud física o mental de la víctima;", "b) El hecho fuere cometido por ascendiente, descendiente, afín en línea recta, hermano, tutor, curador, ministro de algún culto reconocido o no, encargado de la educación o de la guarda;", "c) El autor tuviere conocimiento de ser portador de una enfermedad de transmisión sexual grave, y hubiere existido peligro de contagio;", "d) El hecho fuere cometido por dos o más personas, o con armas;", "e) El hecho fuere cometido por personal perteneciente a las fuerzas policiales o de seguridad, en ocasión de sus funciones;", "f) El hecho fuere cometido contra un menor de dieciocho años, aprovechando la situación de convivencia preexistente con el mismo.", "En el supuesto del primer párrafo, la pena será de tres a diez años de reclusión o prisión si concurren las circunstancias de los incisos a), b), d), e) o f).\""], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 25.087 B.O. 14/5/1999)"], "z": ["6 meses–4 años", "4–10 años", "6–15 años"]}, {"pn": [{"t": "PR", "a": 36, "b": 72, "c": "Será reprimido con prisión o reclusión de tres a seis años el que realizare algunas de las acciones previstas en el segundo o en…"}, {"t": "PR", "a": 72, "b": 120, "c": "…resultare un delito más severamente penado. La pena será de prisión o reclusión de seis a diez años si mediare alguna de las circunstancias previstas en l ibertad personal, cuando concurra alguna de las circunstancias siguientes:", "1. Si el hecho se cometiere con violencias o amenazas o con fines religiosos o de venganza; 2. Si el hecho se cometiere en la persona de un ascendiente, de un hermano, del cónyuge o de otro individuo a quien se deba respeto particular;", "3. Si resultare grave daño a la persona, a la salud o a los negocios del ofendido, siempre que el hecho no importare otro delito por el cual la ley imponga pena mayor;", "4. Si el hecho se cometiere simulando autoridad pública u orden de autoridad pública; 5. Si la privación de la libertad durare más de un mes."], "nt": [], "z": ["2–6 años"]}, {"pn": [{"t": "PR", "a": 60, "b": 180, "c": "Se impondrá prisión o reclusión de cinco (5) a quince (15) años, al que sustrajere, retuviere u ocultare a una persona con el fin de…"}, {"t": "PR", "p": 1, "c": "…como consecuencia no querida por el autor. La pena será de prisión o reclusión perpetua si se causare intencionalmente la muerte de la persona ofendida. La p…"}], "n": 159, "l": "142 bis", "s": "Se impondrá prisión o reclusión de cinco (5) a quince (15) años, al que sustrajere, retuviere u ocultare a una persona con el fin de obligar a la víctima o a un tercero, a hacer, no…", "p": ["Se impondrá prisión o reclusión de cinco (5) a quince (15) años, al que sustrajere, retuviere u ocultare a una persona con el fin de obligar a la víctima o a un tercero, a hacer, no hacer, o tolerar algo contra su voluntad. Si el autor lograre su propósito, el mínimo de la pena se elevará a ocho (8) años.", "La pena será de diez (10) a veinticinco (25) años de prisión o reclusión:", "1. Si la víctima fuese una mujer embarazada; un menor de dieciocho (18) años de edad; o un mayor de setenta (70) años de edad.", "2. Si el hecho se cometiere en la persona de un ascendiente; de un hermano; del cónyuge o conviviente; o de otro individuo a quien se deba respeto particular.", "3. Si se causare a la víctima lesiones graves o gravísimas.", "4. Cuando la víctima sea una persona discapacitada, enferma o que no pueda valerse por sí misma.", "5. Cuando el agente sea funcionario o empleado público o pertenezca o haya pertenecido al momento de comisión del hecho a una fuerza armada, de seguridad u organismo de inteligencia del Estado. (Inciso sustituido por art. 3° del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación)", "6. Cuando participaran en el hecho tres (3) o más personas.", "La pena será de quince (15) a veinticinco (25) años de prisión a reclusión si del hecho resultara la muerte de la persona ofendida, como consecuencia no querida por el autor. La pena será de prisión o reclusión perpetua si se causare intencionalmente la muerte de la persona ofendida.", "La pena del partícipe que, desvinculándose de los otros, se esforzare de modo que la víctima recupere la libertad, sin que tal resultado fuese la consecuencia del logro del propósito del autor, se reducirá de un tercio a la mitad."], "nt": ["(Artículo sustituido por art. 3° de la Ley N° 25.742 B.O. 20/6/2003)"], "z": ["perpetua"]}, {"pn": [{"t": "PR", "a": 12, "b": 36, "c": "Será reprimido con reclusión o prisión de uno a tres años e inhabilitación especial por doble tiempo: 1º. El funcionario que re…"}], "n": 160, "l": "143", "s": "Será reprimido con reclusión o prisión de uno a tres años e inhabilitación especial por doble tiempo:", "p": ["Será reprimido con reclusión o prisión de uno a tres años e inhabilitación especial por doble tiempo:", "1º. El funcionario que retuviera a un detenido o preso, cuya soltura haya debido decretar o ejecutar;", "2º. El funcionario que prolongare indebidamente la detención de una persona, sin ponerla a disposición del juez competente;", "3º. El funcionario que incomunicare indebidamente a un detenido;", "4º. El jefe de prisión u otro establecimiento penal, o el que lo reemplace, que recibiera algún reo sin testimonio de la sentencia firme en que se le hubiere impuesto la pena o lo colocare en lugares del establecimiento que no sean los señalados al efecto;", "5º. El alcaide o empleado de las cárceles de detenidos y seguridad que recibiere un preso sin orden de autoridad competente, salvo el caso de flagrante delito;", "6º. El funcionario competente que teniendo noticias de una detención ilegal omitiere, retardare o rehusare hacerla cesar o dar cuenta a la autoridad que deba resolver."], "nt": [], "z": ["1–3 años"]}, {"pn": [], "n": 161, "l": "144", "s": "Cuando en los casos del artículo anterior concurriere alguna de las circunstancias enumeradas en los incisos 1, 2, 3 y 5 del artículo 142, el máximo de la pena privativa de la libertad…", "p": ["Cuando en los casos del artículo anterior concurriere alguna de las circunstancias enumeradas en los incisos 1, 2, 3 y 5 del artículo 142, el máximo de la pena privativa de la libertad se elevará a cinco años."], "nt": [], "z": []}, {"pn": [{"t": "PR", "a": 12, "b": 60, "c": "Será reprimido con prisión o reclusión de uno a cinco años e inhabilitación especial por doble tiempo: 1. El funcionario público…"}, {"t": "PR", "a": 24, "b": 72, "c": "…del artículo 142, la pena privativa de la libertad será de reclusión o prisión de dos a seis años."}], "n": 162, "l": "144 bis", "s": "Será reprimido con prisión o reclusión de uno a cinco años e inhabilitación especial por doble tiempo:", "p": ["Será reprimido con prisión o reclusión de uno a cinco años e inhabilitación especial por doble tiempo:", "1. El funcionario público que, con abuso de sus funciones o sin las formalidades prescriptas por la ley, privase a alguno de su libertad personal;", "2. El funcionario que desempeñando un acto de servicio cometiera cualquier vejación contra las personas o les aplicare apremios ilegales;", "3. El funcionario público que impusiere a los presos que guarde, severidades, vejaciones, o apremios ilegales.", "Si concurriere alguna de las circunstancias enumeradas en los incisos 1, 2, 3 y 5 del artículo 142, la pena privativa de la libertad será de reclusión o prisión de dos a seis años."], "nt": [], "z": ["1–5 años", "2–6 años"]}, {"pn": [{"t": "PR", "a": 96, "b": 300, "c": "1. Será reprimido con reclusión o prisión de ocho a veinticinco años e inhabilitación absoluta y perpetua el funcionario público que impus…"}, {"t": "PR", "a": 120, "b": 300, "c": "…as en el artículo 91, la pena privativa de libertad será de reclusión o prisión de diez a veinticinco años. 3. Por tortura se entenderá no solamente los tormentos físicos, sino…"}, {"t": "PR", "p": 1, "c": "…muerte de la víctima, la pena privativa de libertad será de reclusión o prisión perpetua. Si se causare alguna de las lesiones previstas en el artículo 91, la…"}], "n": 163, "l": "144 ter", "s": "1.", "p": ["1. Será reprimido con reclusión o prisión de ocho a veinticinco años e inhabilitación absoluta y perpetua el funcionario público que impusiere a personas, legítima o ilegítimamente privadas de su libertad, cualquier clase de tortura.", "Es indiferente que la víctima se encuentre jurídicamente a cargo del funcionario, bastando que éste tenga sobre aquélla poder de hecho.", "Igual pena se impondrá a particulares que ejecutaren los hechos descritos.", "2. Si con motivo u ocasión de la tortura resultare la muerte de la víctima, la pena privativa de libertad será de reclusión o prisión perpetua. Si se causare alguna de las lesiones previstas en el artículo 91, la pena privativa de libertad será de reclusión o prisión de diez a veinticinco años.", "3. Por tortura se entenderá no solamente los tormentos físicos, sino también la imposición de sufrimientos psíquicos, cuando éstos tengan gravedad suficiente."], "nt": [], "z": ["8–25 años", "10–25 años", "perpetua"]}, {"pn": [{"t": "P", "a": 36, "b": 120, "c": "1º. Se impondrá prisión de tres a diez años al funcionario que omitiese evitar la comisión de alguno de los hecho…"}, {"t": "P", "a": 6, "b": 24, "c": "…e el hecho previsto en el artículo 144 tercero, se impondrá prisión de seis meses a dos años e inhabilitación especial de tres a seis años al funcionario a cargo…"}], "n": 164, "l": "144 quater", "s": "1º.", "p": ["1º. Se impondrá prisión de tres a diez años al funcionario que omitiese evitar la comisión de alguno de los hechos del artículo anterior, cuando tuviese competencia para ello.", "2º. La pena será de uno a cinco años de prisión para el funcionario que en razón de sus funciones tomase conocimiento de la comisión de alguno de los hechos del artículo anterior y, careciendo de la competencia a que alude el inciso precedente, omitiese denunciar dentro de las veinticuatro horas el hecho ante el funcionario, ministerio público o juez competente. Si el funcionario fuera médico se le impondrá, además, inhabilitación especial para el ejercicio de su profesión por doble tiempo de la pena de prisión.", "3º. Sufrirá la pena prevista en el inciso 1º de este artículo el juez que, tomando conocimiento en razón de su función de alguno de los hechos a que se refiere el artículo anterior, no instruyere sumario o no denunciare el hecho al juez competente dentro de las veinticuatro horas.", "4º. En los casos previstos en este artículo, se impondrá, además, inhabilitación especial perpetua para desempeñarse en cargos públicos. La inhabilitación comprenderá la de tener o portar armas de todo tipo.", "ARTICULO 144 quinto.- Si se ejecutase el hecho previsto en el artículo 144 tercero, se impondrá prisión de seis meses a dos años e inhabilitación especial de tres a seis años al funcionario a cargo de la repartición, establecimiento, departamento, dependencia o cualquier otro organismo, si las circunstancias del caso permiten establecer que el hecho no se hubiese cometido de haber mediado la debida vigilancia o adoptado los recaudos necesarios por dicho funcionario."], "nt": [], "z": ["3–10 años", "1–5 años", "6 meses–2 años"]}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Será reprimido con prisión de dos a seis años, el que condujere a una persona fuera de las fronteras de la Repúblic…"}], "n": 165, "l": "145", "s": "Será reprimido con prisión de dos a seis años, el que condujere a una persona fuera de las fronteras de la República, con el propósito de someterla ilegalmente al poder de otro o de…", "p": ["Será reprimido con prisión de dos a seis años, el que condujere a una persona fuera de las fronteras de la República, con el propósito de someterla ilegalmente al poder de otro o de alistarla en un ejército extranjero."], "nt": [], "z": ["2–6 años"]}, {"pn": [{"t": "P", "a": 36, "b": 72, "c": "…re la víctima, con fines de explotación, será reprimido con prisión de TRES (3) a SEIS (6) años. La pena será de CUATRO (4) a DIEZ (10) años de prisión cuando: 1. El…"}], "n": 166, "l": "145 bis", "s": "El que captare, transportare o trasladare, dentro del país o desde o hacia el exterior, acogiere o recibiere personas mayores de dieciocho años de edad, cuando mediare engaño, fraude,…", "p": ["El que captare, transportare o trasladare, dentro del país o desde o hacia el exterior, acogiere o recibiere personas mayores de dieciocho años de edad, cuando mediare engaño, fraude, violencia, amenaza o cualquier otro medio de intimidación o coerción, abuso de autoridad o de una situación de vulnerabilidad, concesión o recepción de pagos o beneficios para obtener el consentimiento de una persona que tenga autoridad sobre la víctima, con fines de explotación, será reprimido con prisión de TRES (3) a SEIS (6) años. La pena será de CUATRO (4) a DIEZ (10) años de prisión cuando:", "1. El autor fuere ascendiente, cónyuge, afín en línea recta, hermano, tutor, persona conviviente, curador, encargado de la educación o guarda, ministro de algún culto reconocido o no, o funcionario público;", "2. El hecho fuere cometido por TRES (3) o más personas en forma organizada;", "3. Las v os que se hubiere substraído a la potestad o guarda a que estaba legalmente sometido.", "La pena será de seis meses a dos años, si el menor no tuviera diez años."], "nt": [], "z": ["1 mes–1 año", "6 meses–2 años"]}, {"pn": [{"t": "P", "a": 6, "b": 24, "c": "Será reprimido con prisión de seis meses a dos años el que hiciere uso de amenazas para alarmar o amedrentar a una o más…"}, {"t": "PR", "a": 24, "b": 48, "c": "…armas o si las amenazas fueren anónimas. Será reprimido con prisión o reclusión de dos a cuatro años el que hiciere uso de amenazas con el propósito de obligar a otro a h…"}], "n": 172, "l": "149 bis", "s": "Será reprimido con prisión de seis meses a dos años el que hiciere uso de amenazas para alarmar o amedrentar a una o más personas.", "p": ["Será reprimido con prisión de seis meses a dos años el que hiciere uso de amenazas para alarmar o amedrentar a una o más personas. En este caso la pena será de uno a tres años de prisión si se emplearen armas o si las amenazas fueren anónimas. Será reprimido con prisión o reclusión de dos a cuatro años el que hiciere uso de amenazas con el propósito de obligar a otro a hacer, no hacer o tolerar algo contra su voluntad."], "nt": [], "z": ["6 meses–2 años", "1–3 años", "2–4 años"]}, {"pn": [], "n": 173, "l": "149 ter", "s": "En el caso del último apartado del artículo anterior, la pena será:", "p": ["En el caso del último apartado del artículo anterior, la pena será:", "1) De tres a seis años de prisión o reclusión si se emplearen armas o si las amenazas fueren anónimas; 2) De cinco a diez años de prisión o reclusión en los siguientes casos:", "a) Si las amenazas tuvieren como propósito la obtención de alguna medida o concesión por parte de cualquier miembro de los poderes públicos;", "b) Si las amenazas tuvieren como propósito el de compeler a una persona a hacer abandono del país, de una provincia o de los lugares de su residencia habitual o de trabajo."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 24, " er privado o de acceso restringido. La pena será de prisión de un (1) mes a un (1) año, si el autor además comunicare a otro o publicare el contenido de la…"}], "n": 177, "l": "153", "s": "Será reprimido con prisión de quince (15) días a seis (6) meses el que abriere o accediere indebidamente a una comunicación electrónica, una carta, un pliego cerrado, un despacho…", "p": ["Será reprimido con prisión de quince (15) días a seis (6) meses el que abriere o accediere indebidamente a una comunicación electrónica, una carta, un pliego cerrado, un despacho telegráfico, telefónico o de otra naturaleza, que no le esté dirigido; o se apoderare indebidamente de una comunicación electrónica, una carta, un pliego, un despacho u otro papel privado, aunque no esté cerrado; o indebidamente suprimiere o desviare de su destino una correspondencia o una comunicación electrónica que no le esté dirigida. En la misma pena incurrirá el que indebidamente interceptare o captare comunicaciones electrónicas o telecomunicaciones provenientes de cualquier sistema de carácter privado o de acceso restringido.", "La pena será de prisión de un (1) mes a un (1) año, si el autor además comunicare a otro o publicare el contenido de la carta, escrito, despacho o comunicación electrónica. Si el hecho lo cometiere un funcionario público que abusare de sus funciones, sufrirá además, inhabilitación especial por el doble del tiempo de la condena.", "ARTICULO 153 BIS. - Será reprimido con prisión de quince (15) días a seis (6) meses, si no resultare un delito más severamente penado, el que a sabiendas accediere por cualquier medio, sin la debida autorización o excediendo la que posea, a un sistema o dato informático de acceso restringido.", "La pena será de un (1) mes a un (1) año de prisión cuando el acceso fuese en perjuicio de un sistema o dato informático de un organismo público estatal o de un proveedor de servicios públicos o de servicios financieros."], "nt": ["(Artículo sustituido por art. 4° de la Ley N° 26.388, B.O. 25/6/2008)", "(Artículo incorporado por art. 5° de la Ley N° 26.388, B.O. 25/6/2008)"], "z": []}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "Será reprimido con prisión de uno a cuatro años, el empleado de correos o telégrafos que, abusando de su empleo, se a…"}], "n": 178, "l": "154", "s": "Será reprimido con prisión de uno a cuatro años, el empleado de correos o telégrafos que, abusando de su empleo, se apoderare de una carta, de un pliego, de un telegrama o de otra pieza…", "p": ["Será reprimido con prisión de uno a cuatro años, el empleado de correos o telégrafos que, abusando de su empleo, se apoderare de una carta, de un pliego, de un telegrama o de otra pieza de correspondencia, se impusiere de su contenido, la entregare o comunicare a otro que no sea el destinatario, la suprimiere, la ocultare o cambiare su texto."], "nt": [], "z": ["1–4 años"]}, {"pn": [], "n": 179, "l": "155", "s": "Será reprimido con multa de pesos un mil quinientos ($ 1.500) a pesos cien mil ($ 100.000), el que hallándose en posesión de una correspondencia, una comunicación electrónica, un pliego…", "p": ["Será reprimido con multa de pesos un mil quinientos ($ 1.500) a pesos cien mil ($ 100.000), el que hallándose en posesión de una correspondencia, una comunicación electrónica, un pliego cerrado, un despacho telegráfico, telefónico o de otra naturaleza, no destinados a la publicidad, los hiciere publicar indebidamente, si el hecho causare o pudiere causar perjuicios a terceros.", "Está exento de responsabilidad penal el que hubiere obrado con el propósito inequívoco de proteger un interés público."], "nt": ["(Artículo sustituido por art. 6° de la Ley N° 26.388, B.O. 25/6/2008)"], "z": []}, {"pn": [], "n": 180, "l": "156", "s": "Será reprimido con multa de pesos mil quinientos a pesos noventa mil e inhabilitación especial, en su caso, por seis meses a tres años, el que teniendo noticia, por razón de su estado,…", "p": ["Será reprimido con multa de pesos mil quinientos a pesos noventa mil e inhabilitación especial, en su caso, por seis meses a tres años, el que teniendo noticia, por razón de su estado, oficio, empleo, profesión o arte, de un secreto cuya divulgación pueda causar daño, lo revelare sin justa causa."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 24, "c": "Será reprimido con prisión de un (1) mes a dos (2) años e inhabilitación especial de un (1) a cuatro (4) años, el funcionario…"}], "n": 181, "l": "157", "s": "Será reprimido con prisión de un (1) mes a dos (2) años e inhabilitación especial de un (1) a cuatro (4) años, el funcionario público que revelare hechos, actuaciones, documentos o…", "p": ["Será reprimido con prisión de un (1) mes a dos (2) años e inhabilitación especial de un (1) a cuatro (4) años, el funcionario público que revelare hechos, actuaciones, documentos o datos, que por ley deben ser secretos."], "nt": ["(Artículo sustituido por art. 7° de la Ley N° 26.388, B.O. 25/6/2008)"], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 24, "c": "Será reprimido con la pena de prisión de un (1) mes a dos (2) años el que: 1. A sabiendas e ilegítimamente, o violando sistemas de confi…"}], "n": 182, "l": "157 bis", "s": "Será reprimido con la pena de prisión de un (1) mes a dos (2) años el que:", "p": ["Será reprimido con la pena de prisión de un (1) mes a dos (2) años el que:", "1. A sabiendas e ilegítimamente, o violando sistemas de confidencialidad y seguridad de datos, accediere, de cualquier forma, a un banco de datos personales;", "2. Ilegítimamente proporcionare o revelare a otro información registrada en un archivo o en un banco de datos personales cuyo secreto estuviere obligado a preservar por disposición de la ley.", "3. Ilegítimamente insertare o hiciere insertar datos en un archivo de datos personales. Cuando el autor sea funcionario público sufrirá, además, pena de inhabilitación especial de un", "(1) a cuatro (4) añ to fuese de mercaderías u otras cosas muebles transportadas por cualquier medio y se cometiere entre el momento de su carga y el de su destino o entrega, o durante las escalas que se realizaren. . (Inciso incorporado por art. 1° de la Ley N° 23.468 B.O. 26/1/1987)", "6º Cuando el hurto fuere de vehículos dejados en la vía pública o en lugares de acceso público. . (Inciso incorporado por art. 1° de la Ley N° 24.721 B.O. 18/11/1996)"], "nt": ["(Inciso sustituido por art. 2° de la Ley N° 25.890 B.O.21/5/2004)"], "z": ["1 mes–2 años", "1–6 años"]}, {"pn": [], "n": 188, "l": "163 bis", "s": "En los casos enunciados en el presente Capítulo, la pena se aumentará en un tercio en su mínimo y en su máximo, cuando quien ejecutare el delito fuere miembro integrante de las fuerzas…", "p": ["En los casos enunciados en el presente Capítulo, la pena se aumentará en un tercio en su mínimo y en su máximo, cuando quien ejecutare el delito fuere miembro integrante de las fuerzas de seguridad, policiales o del servicio penitenciario."], "nt": ["(Artículo incorporado por art. 2° de la Ley N° 25.816 B.O.9/12/2003)"], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 72, "c": "Será reprimido con prisión de un mes a seis años, el que se apoderare ilegítimamente de una cosa mueble, total o parci…"}], "n": 189, "l": "164", "s": "Será reprimido con prisión de un mes a seis años, el que se apoderare ilegítimamente de una cosa mueble, total o parcialmente ajena, con fuerza en las cosas o con violencia física en las…", "p": ["Será reprimido con prisión de un mes a seis años, el que se apoderare ilegítimamente de una cosa mueble, total o parcialmente ajena, con fuerza en las cosas o con violencia física en las personas, sea que la violencia tenga lugar antes del robo para facilitarlo, en el acto de cometerlo o después de cometido para procurar su impunidad."], "nt": [], "z": ["1 mes–6 años"]}, {"pn": [{"t": "PR", "a": 120, "b": 300, "c": "Se impondrá reclusión o prisión de diez a veinticinco años, si con
