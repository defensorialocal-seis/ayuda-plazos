e un delito más severamente penado."], "nt": ["(Artículo incorporado por art. 18 del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación)"], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 96, "c": "Será penado con prisión de dos (2) a ocho (8) años el militar que por imprudencia o negligencia, impericia en el arte mi…"}], "n": 303, "l": "253 ter", "s": "Será penado con prisión de dos (2) a ocho (8) años el militar que por imprudencia o negligencia, impericia en el arte militar o inobservancia de los reglamentos o deberes a su cargo, en…", "p": ["Será penado con prisión de dos (2) a ocho (8) años el militar que por imprudencia o negligencia, impericia en el arte militar o inobservancia de los reglamentos o deberes a su cargo, en el curso de conflicto armado o de asistencia o salvación en situación de catástrofe, causare o no impidiere, la muerte de una o más personas o pérdidas militares, si no resultare un delito más severamente penado."], "nt": ["(Artículo incorporado por art. 19 del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación)"], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 24, "c": "Será reprimido con prisión de seis meses a dos años, el que violare los sellos puestos por la autoridad para asegurar la…"}], "n": 304, "l": "254", "s": "Será reprimido con prisión de seis meses a dos años, el que violare los sellos puestos por la autoridad para asegurar la conservación o la identidad de una cosa.", "p": ["Será reprimido con prisión de seis meses a dos años, el que violare los sellos puestos por la autoridad para asegurar la conservación o la identidad de una cosa. Si el culpable fuere funcionario público y hubiere cometido el hecho con abuso de su cargo, sufrirá además inhabilitación especial por doble tiempo. Si el hecho se hubiere cometido por imprudencia o negligencia del funcionario público, la pena será de multa de pesos setecientos cincuenta a pesos doce mil quinientos."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["6 meses–2 años"]}, {"pn": [{"t": "P", "a": 1, "b": 48, "c": "Será reprimido con prisión de un (1) mes a cuatro (4) años, el que sustrajere, alterare, ocultare, destruyere o inutilizare en t…"}], "n": 305, "l": "255", "s": "Será reprimido con prisión de un (1) mes a cuatro (4) años, el que sustrajere, alterare, ocultare, destruyere o inutilizare en todo o en parte objetos destinados a servir de prueba ante…", "p": ["Será reprimido con prisión de un (1) mes a cuatro (4) años, el que sustrajere, alterare, ocultare, destruyere o inutilizare en todo o en parte objetos destinados a servir de prueba ante la autoridad competente, registros o documentos confiados a la custodia de un funcionario público o de otra persona en el interés del servicio público. Si el autor fuere el mismo depositario, sufrirá además inhabilitación especial por doble tiempo.", "Si el hecho se cometiere por imprudencia o negligencia del depositario, éste será reprimido con multa de pesos setecientos cincuenta ($ 750) a pesos doce mil quinientos ($ 12.500)."], "nt": ["(Artículo sustituido por art. 13 de la Ley N° 26.388, B.O. 25/6/2008)", "(Título del capítulo sustituido por art. 30 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": []}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua, el funcionario público que por sí…"}], "n": 306, "l": "256", "s": "Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua, el funcionario público que por sí o por persona interpuesta, recibiere dinero o cualquier…", "p": ["Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua, el funcionario público que por sí o por persona interpuesta, recibiere dinero o cualquier otra dádiva o aceptare una promesa directa o indirecta, para hacer, retardar o dejar de hacer algo relativo a sus funciones"], "nt": ["(Artículo sustituido por art. 31 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["1–6 años", "perpetua"]}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua para ejercer la función pública, e…"}], "n": 307, "l": "256 bis", "s": "Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua para ejercer la función pública, el que por sí o por persona interpuesta solicitare o…", "p": ["Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua para ejercer la función pública, el que por sí o por persona interpuesta solicitare o recibiere dinero o cualquier otra dádiva o aceptare una promesa directa o indirecta, para hacer valer indebidamente su influencia ante un funcionario público, a fin de que éste haga, retarde o deje de hacer algo relativo a sus funciones.", "Si aquella conducta estuviera destinada a hacer valer indebidamente una influencia ante un magistrado del Poder Judicial o del Ministerio Público, a fin de obtener la emisión, dictado, demora u omisión de un dictamen, resolución o fallo en asuntos sometidos a su competencia, el máximo de la pena de prisión o reclusión se elevará a doce años."], "nt": ["(Artículo incorporado por art. 32 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["1–6 años", "perpetua"]}, {"pn": [{"t": "PR", "a": 48, "b": 144, "c": "Será reprimido con prisión o reclusión de cuatro a doce años e inhabilitación especial perpetua, el magistrado del Poder Judicial…"}], "n": 308, "l": "257", "s": "Será reprimido con prisión o reclusión de cuatro a doce años e inhabilitación especial perpetua, el magistrado del Poder Judicial o del Ministerio Público que por sí o por persona…", "p": ["Será reprimido con prisión o reclusión de cuatro a doce años e inhabilitación especial perpetua, el magistrado del Poder Judicial o del Ministerio Público que por sí o por persona interpuesta, recibiere dinero o cualquier otra dádiva o aceptare una promesa directa o indirecta para emitir, dictar, retardar u omitir dictar una resolución, fallo o dictamen, en asuntos sometidos a su competencia"], "nt": ["(Artículo sustituido por art. 33 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["4–12 años", "perpetua"]}, {"pn": [{"t": "P", "a": 12, "b": 72, "c": "Será reprimido con prisión de uno a seis años, el que directa o indirectamente diere u ofreciere dádivas en procura…"}, {"t": "PR", "a": 24, "b": 72, "c": "…s artículos 256 bis, segundo párrafo y 257, la pena será de reclusión o prisión de dos a seis años. Si el culpable fuere funcionario público, sufrirá además inhabilitac…"}], "n": 309, "l": "258", "s": "Será reprimido con prisión de uno a seis años, el que directa o indirectamente diere u ofreciere dádivas en procura de alguna de las conductas reprimidas por los artículos 256 y 256 bis,…", "p": ["Será reprimido con prisión de uno a seis años, el que directa o indirectamente diere u ofreciere dádivas en procura de alguna de las conductas reprimidas por los artículos 256 y 256 bis, primer párrafo. Si la dádiva se hiciere u ofreciere con el fin de obtener alguna de las conductas tipificadas en los artículos 256 bis, segundo párrafo y 257, la pena será de reclusión o prisión de dos a seis años. Si el culpable fuere funcionario público, sufrirá además inhabilitación especial de dos a seis años en el primer caso y de tres a diez años en el segundo."], "nt": ["(Artículo sustituido por art. 34 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["1–6 años", "2–6 años", "3–10 años"]}, {"pn": [{"t": "R", "a": 12, "b": 72, "c": "Será reprimido con reclusión de uno (1) a seis (6) años e inhabilitación especial perpetua para ejercer la función pública el…"}], "n": 310, "l": "258 bis", "s": "Será reprimido con reclusión de uno (1) a seis (6) años e inhabilitación especial perpetua para ejercer la función pública el que, directa o indirectamente, ofreciere u otorgare a un…", "p": ["Será reprimido con reclusión de uno (1) a seis (6) años e inhabilitación especial perpetua para ejercer la función pública el que, directa o indirectamente, ofreciere u otorgare a un funcionario público de otro Estado o de una organización pública internacional, ya sea en su beneficio o de un tercero, sumas de dinero o cualquier objeto de valor pecuniario u otras compensaciones, tales como dádivas, favores, promesas o ventajas, a cambio de que dicho funcionario realice u omita realizar un acto relacionado con el ejercicio de sus funciones públicas, o para que haga valer la influencia derivada de su cargo, en un asunto vinculado a una transacción de naturaleza económica, financiera o comercial."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 25.825 B.O. 11/12/2003)"], "z": ["perpetua"]}, {"pn": [{"t": "P", "a": 1, "b": 24, "c": "Será reprimido con prisión de un mes a dos años e inhabilitación absoluta de uno a seis años, el funcionario público…"}, {"t": "P", "a": 1, "b": 12, "c": "…El que presentare u ofreciere la dádiva será reprimido con prisión de un mes a un año."}], "n": 311, "l": "259", "s": "Será reprimido con prisión de un mes a dos años e inhabilitación absoluta de uno a seis años, el funcionario público que admitiere dádivas, que fueran entregadas en consideración a su…", "p": ["Será reprimido con prisión de un mes a dos años e inhabilitación absoluta de uno a seis años, el funcionario público que admitiere dádivas, que fueran entregadas en consideración a su oficio, mientras permanezca en el ejercicio del cargo. El que presentare u ofreciere la dádiva será reprimido con prisión de un mes a un año."], "nt": [], "z": ["1 mes–2 años", "1–6 años", "1 mes–1 año"]}, {"pn": [], "n": 312, "l": "260", "s": "Será reprimido con inhabilitación especial de un mes a tres años, el funcionario público que diere a los caudales o efectos que administrare una aplicación diferente de aquella a que…", "p": ["Será reprimido con inhabilitación especial de un mes a tres años, el funcionario público que diere a los caudales o efectos que administrare una aplicación diferente de aquella a que estuvieren destinados. Si de ello resultare daño o entorpecimiento del servicio a que estuvieren destinados, se impondrá además al culpable, multa del veinte al cincuenta por ciento de la cantidad distraída."], "nt": [], "z": ["1 mes–3 años"]}, {"pn": [{"t": "PR", "a": 24, "b": 120, "c": "Será reprimido con reclusión o prisión de dos a diez años e inhabilitación absoluta perpetua, el funcionario público que sustra…"}], "n": 313, "l": "261", "s": "Será reprimido con reclusión o prisión de dos a diez años e inhabilitación absoluta perpetua, el funcionario público que sustrajere caudales o efectos cuya administración, percepción o…", "p": ["Será reprimido con reclusión o prisión de dos a diez años e inhabilitación absoluta perpetua, el funcionario público que sustrajere caudales o efectos cuya administración, percepción o custodia le haya sido confiada por razón de su cargo. Será reprimido con la misma pena el funcionario que empleare en provecho propio o de un tercero, trabajos o servicios pagados por una administración pública."], "nt": [], "z": ["2–10 años", "perpetua"]}, {"pn": [], "n": 314, "l": "262", "s": "Será reprimido con multa del veinte al sesenta por ciento del valor substraído, el funcionario público que, por imprudencia o negligencia o por inobservancia de los reglamentos o deberes…", "p": ["Será reprimido con multa del veinte al sesenta por ciento del valor substraído, el funcionario público que, por imprudencia o negligencia o por inobservancia de los reglamentos o deberes de su cargo, diere ocasión a que se efectuare por otra persona la substracción de caudales o efectos de que se trata en el artículo anterior."], "nt": [], "z": []}, {"pn": [], "n": 315, "l": "263", "s": "Quedan sujetos a las disposiciones anteriores los que administraren o custodiaren bienes pertenecientes a establecimientos de instrucción pública o de beneficencia, así como los…", "p": ["Quedan sujetos a las disposiciones anteriores los que administraren o custodiaren bienes pertenecientes a establecimientos de instrucción pública o de beneficencia, así como los administradores y depositarios de caudales embargados, secuestrados o depositados por autoridad competente, aunque pertenezcan a particulares."], "nt": [], "z": []}, {"pn": [], "n": 316, "l": "264", "s": "Será reprimido con inhabilitación especial por uno a seis meses, el funcionario público que, teniendo fondos expeditos, demorare injustificadamente un pago ordinario o decretado por…", "p": ["Será reprimido con inhabilitación especial por uno a seis meses, el funcionario público que, teniendo fondos expeditos, demorare injustificadamente un pago ordinario o decretado por autoridad competente. En la misma pena incurrirá el funcionario público que, requerido por la autoridad competente, rehusare entregar una cantidad o efecto depositado o puesto bajo su custodia o administración."], "nt": [], "z": []}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua, el funcionario público que, direc…"}], "n": 317, "l": "265", "s": "Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua, el funcionario público que, directamente, por persona interpuesta o por acto simulado, se…", "p": ["Será reprimido con reclusión o prisión de uno a seis años e inhabilitación especial perpetua, el funcionario público que, directamente, por persona interpuesta o por acto simulado, se interesare en miras de un beneficio propio o de un tercero, en cualquier contrato u operación en que intervenga en razón de su cargo.", "Esta disposición será aplicable a los árbitros, amigables componedores, peritos, contadores, tutores, curadores, albaceas, síndicos y liquidadores, con respecto a las funciones cumplidas en el carácter de tales."], "nt": ["(Artículo sustituido por art. 35 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["1–6 años", "perpetua"]}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "Será reprimido con prisión de uno a cuatro años e inhabilitación especial de uno a cinco años, el funcionario público…"}], "n": 318, "l": "266", "s": "Será reprimido con prisión de uno a cuatro años e inhabilitación especial de uno a cinco años, el funcionario público que, abusando de su cargo, solicitare, exigiere o hiciere pagar o…", "p": ["Será reprimido con prisión de uno a cuatro años e inhabilitación especial de uno a cinco años, el funcionario público que, abusando de su cargo, solicitare, exigiere o hiciere pagar o entregar indebidamente, por sí o por interpuesta persona, una contribución, un derecho o una dádiva o cobrase mayores derechos que los que corresponden."], "nt": ["(Artículo sustituido por art. 37 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["1–4 años", "1–5 años"]}, {"pn": [], "n": 319, "l": "267", "s": "Si se empleare intimidación o se invocare orden superior, comisión, mandamiento judicial u otra autorización legítima, podrá elevarse la prisión hasta cuatro años y la inhabilitación…", "p": ["Si se empleare intimidación o se invocare orden superior, comisión, mandamiento judicial u otra autorización legítima, podrá elevarse la prisión hasta cuatro años y la inhabilitación hasta seis años."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 72, "c": "Será reprimido con prisión de dos a seis años e inhabilitación absoluta perpetua, el funcionario público que convir…"}, {"t": "PR", "a": 24, "b": 72, "c": "…en razón de su cargo. ARTICULO 268 (2) — Será reprimido con reclusión o prisión de dos a seis años, multa del cincuenta por ciento al ciento por ciento del valor del en…"}, {"t": "P", "a": 0.5, "b": 24, "c": "…e el autor del hecho. ARTICULO 268 (3) — Será reprimido con prisión de quince días a dos años e inhabilitación especial perpetua el que, en razón de su cargo, estu…"}], "n": 320, "l": "268", "s": "Será reprimido con prisión de dos a seis años e inhabilitación absoluta perpetua, el funcionario público que convirtiere en provecho propio o de tercero las exacciones expresadas en los…", "p": ["Será reprimido con prisión de dos a seis años e inhabilitación absoluta perpetua, el funcionario público que convirtiere en provecho propio o de tercero las exacciones expresadas en los artículos anteriores.", "ARTICULO 268 (1). - Será reprimido con la pena del artículo 256, el funcionario público que con fines de lucro utilizare para sí o para un tercero informaciones o datos de carácter reservado de los que haya tomado conocimiento en razón de su cargo.", "ARTICULO 268 (2) — Será reprimido con reclusión o prisión de dos a seis años, multa del cincuenta por ciento al ciento por ciento del valor del enriquecimiento e inhabilitación absoluta perpetua, el que al ser debidamente requerido, no justificare la procedencia de un enriquecimiento patrimonial apreciable suyo o de persona interpuesta para disimularlo, ocurrido con posterioridad a la asunción de un cargo o empleo público y hasta dos años después de haber cesado en su desempeño.", "Se entenderá que hubo enriquecimiento no sólo cuando el patrimonio se hubiese incrementado con dinero, cosas o bienes, sino también cuando se hubiesen cancelado deudas o extinguido obligaciones que lo afectaban.", "La persona interpuesta para disimular el enriquecimiento será reprimida con la misma pena que el autor del hecho.", "ARTICULO 268 (3) — Será reprimido con prisión de quince días a dos años e inhabilitación especial perpetua el que, en razón de su cargo, estuviere obligado por ley a presentar una declaración jurada patrimonial y omitiere maliciosamente hacerlo.", "El delito se configurará cuando mediando notificación fehaciente de la intimación respectiva, el sujeto obligado no hubiere dado cumplimiento a los deberes aludidos dentro de los plazos que fije la ley cuya aplicación corresponda.", "En la misma pena incurrirá el que maliciosamente, falseare u omitiere insertar los datos que las referidas declaraciones juradas deban contener de conformidad con las leyes y reglamentos aplicables."], "nt": ["(Artículo sustituido por art. 38 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)", "(Artículo incorporado por art. 39 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a los ocho días desde su publicación.)"], "z": ["2–6 años", "15 días–2 años", "perpetua"]}, {"pn": [], "n": 321, "l": "269", "s": "Sufrirá multa de pesos tres mil a pesos setenta y cinco mil e inhabilitación absoluta perpetua el juez que dictare resoluciones contrarias a la ley expresa invocada por las partes o por…", "p": ["Sufrirá multa de pesos tres mil a pesos setenta y cinco mil e inhabilitación absoluta perpetua el juez que dictare resoluciones contrarias a la ley expresa invocada por las partes o por el mismo o citare, para fundarlas, hechos o resoluciones falsas.", "Si la sentencia fuere condenatoria en causa criminal, la pena será de tres a quince años de reclusión o prisión e inhabilitación absoluta perpetua.", "Lo dispuesto en el párrafo primero de este artículo, será aplicable, en su caso, a los árbitros y arbitradores amigables componedores."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["3–15 años", "perpetua"]}, {"pn": [], "n": 322, "l": "270", "s": "Será reprimido con multa de pesos dos mil quinientos a pesos treinta mil e inhabilitación absoluta de uno a seis años, el juez que decretare prisión preventiva por delito en virtud del…", "p": ["Será reprimido con multa de pesos dos mil quinientos a pesos treinta mil e inhabilitación absoluta de uno a seis años, el juez que decretare prisión preventiva por delito en virtud del cual no proceda o que prolongare la prisión preventiva que, computada en la forma establecida en el artículo 24, hubiere agotado la pena máxima que podría corresponder al procesado por el delito imputado."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["1–6 años"]}, {"pn": [], "n": 323, "l": "271", "s": "Será reprimido con multa de pesos dos mil quinientos a pesos treinta mil, e inhabilitación especial de uno a seis años, el abogado o mandatario judicial que defendiere o representare…", "p": ["Será reprimido con multa de pesos dos mil quinientos a pesos treinta mil, e inhabilitación especial de uno a seis años, el abogado o mandatario judicial que defendiere o representare partes contrarias en el mismo juicio, simultánea o sucesivamente o que de cualquier otro modo, perjudicare deliberadamente la causa que le estuviere confiada."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["1–6 años"]}, {"pn": [], "n": 324, "l": "272", "s": "La disposición del artículo anterior será aplicable a los fiscales, asesores y demás funcionarios encargados de emitir su dictamen ante las autoridades.", "p": ["La disposición del artículo anterior será aplicable a los fiscales, asesores y demás funcionarios encargados de emitir su dictamen ante las autoridades."], "nt": [], "z": []}, {"pn": [], "n": 325, "l": "273", "s": "Será reprimido con inhabilitación absoluta de uno a cuatro años, el juez que se negare a juzgar so pretexto de obscuridad, insuficiencia o silencio de la ley.", "p": ["Será reprimido con inhabilitación absoluta de uno a cuatro años, el juez que se negare a juzgar so pretexto de obscuridad, insuficiencia o silencio de la ley. En la misma pena incurrirá el juez que retardare maliciosamente la administración de justicia después de requerido por las partes y de vencidos los términos legales."], "nt": [], "z": ["1–4 años"]}, {"pn": [], "n": 326, "l": "274", "s": "El funcionario público que, faltando a la obligación de su cargo, dejare de promover la persecución y represión de los delincuentes, será reprimido con inhabilitación absoluta de seis…", "p": ["El funcionario público que, faltando a la obligación de su cargo, dejare de promover la persecución y represión de los delincuentes, será reprimido con inhabilitación absoluta de seis meses a dos años, a menos que pruebe que su omisión provino de un inconveniente insuperable."], "nt": [], "z": ["6 meses–2 años"]}, {"pn": [{"t": "P", "a": 1, "b": 48, "c": "Será reprimido con prisión de un mes a cuatro años, el testigo, perito o intérprete que afirmare una falsedad o negare o…"}], "n": 327, "l": "275", "s": "Será reprimido con prisión de un mes a cuatro años, el testigo, perito o intérprete que afirmare una falsedad o negare o callare la verdad, en todo o en parte, en su deposición, informe,…", "p": ["Será reprimido con prisión de un mes a cuatro años, el testigo, perito o intérprete que afirmare una falsedad o negare o callare la verdad, en todo o en parte, en su deposición, informe, traducción o interpretación, hecha ante la autoridad competente. Si el falso testimonio se cometiere en una causa criminal, en perjuicio del inculpado, la pena será de uno a diez años de reclusión o prisión.", "En todos los casos se impondrá al reo, además, inhabilitación absoluta por doble tiempo del de la condena."], "nt": [], "z": ["1 mes–4 años", "1–10 años"]}, {"pn": [], "n": 328, "l": "276", "s": "La pena del testigo, perito o intérprete falso, cuya declaración fuere prestada mediante cohecho, se agravará con una multa igual al duplo de la cantidad ofrecida o recibida.", "p": ["La pena del testigo, perito o intérprete falso, cuya declaración fuere prestada mediante cohecho, se agravará con una multa igual al duplo de la cantidad ofrecida o recibida.", "El sobornante sufrirá la pena del simple testigo falso."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 36, "c": "1.- Será reprimido con prisión de seis (6) meses a tres (3) años el que, tras la comisión de un delito ejecutado por otro, en el que n…"}], "n": 329, "l": "277", "s": "1.- Será reprimido con prisión de seis (6) meses a tres (3) años el que, tras la comisión de un delito ejecutado por otro, en el que no hubiera participado:", "p": ["1.- Será reprimido con prisión de seis (6) meses a tres (3) años el que, tras la comisión de un delito ejecutado por otro, en el que no hubiera participado:", "a) Ayudare a alguien a eludir las investigaciones de la autoridad o a sustraerse a la acción de ésta.", "b) Ocultare, alterare o hiciere desaparecer los rastros, pruebas o instrumentos del delito, o ayudare al autor o partícipe a ocultarlos, alterarlos o hacerlos desaparecer.", "c) Adquiriere, recibiere u ocultare dinero, cosas o efectos provenientes de un delito.", "d) No denunciare la perpetración de un delito o no individualizare al autor o partícipe de un delito ya conocido, cuando estuviere obligado a promover la persecución penal de un delito de esa índole.", "e) Asegurare o ayudare al autor o partícipe a asegurar el producto o provecho del delito. 2.- En el caso del inciso 1, c), precedente, la pena mínima será de un (1) mes de prisión, si, de acuerdo con las circunstancias, el autor podía sospechar que provenían de un delito. 3.- La escala penal será aumentada al doble de su mínimo y máximo, cuando:", "a) El hecho precedente fuera un delito especialmente grave, siendo tal aquel cuya pena mínima fuera superior a tres (3) años de prisión.", "b) El autor actuare con ánimo de lucro.", "c) El autor se dedicare con habitualidad a la comisión de hechos de encubrimiento.", "d) El autor fuere funcionario público.", "La agravación de la escala penal, prevista en este inciso sólo operará una vez, aun cuando concurrieren más de una de sus circunstancias calificantes. En este caso, el tribunal podrá tomar en cuenta la pluralidad de causales al individualizar la pena.", "4.- Están exentos de responsabilidad criminal los que hubieren obrado en favor del cónyuge, de un pariente cuyo vínculo no excediere del cuarto grado de consanguinidad o segundo de afinidad o de un amigo íntimo o persona a la que se debiese especial gratitud. La exención no rige respecto de los casos del inciso 1, e) y del inciso 3, b) y c). (Inciso sustituido por Art. 4º de la Ley Nº 26.087, B.O. 24/04/2006.)"], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 25.815 B.O. 1/12/2003)"], "z": []}, {"pn": [{"t": "P", "a": 36, "b": 72, "c": "Se aplicará prisión de TRES (3) a SEIS (6) años e inhabilitación especial de TRES (3) a DIEZ (10) años al funcionario…"}], "n": 330, "l": "277 bis", "s": "Se aplicará prisión de TRES (3) a SEIS (6) años e inhabilitación especial de TRES (3) a DIEZ (10) años al funcionario público que, tras la comisión del delito de abigeato en el que no…", "p": ["Se aplicará prisión de TRES (3) a SEIS (6) años e inhabilitación especial de TRES (3) a DIEZ (10) años al funcionario público que, tras la comisión del delito de abigeato en el que no hubiera participado, violando los deberes a su cargo o abusando de sus funciones, intervenga o facilite el transporte, faena, comercialización o mantenimiento de ganado, sus despojos o los productos obtenidos, conociendo su origen ilícito."], "nt": ["(Artículo incorporado por art. 6° de la Ley N° 25.890 B.O. 21/572004)"], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 36, "c": "Se impondrá prisión de SEIS (6) meses a TRES (3) años al que reuniendo las condiciones personales descriptas en el artículo…"}], "n": 331, "l": "277 ter", "s": "Se impondrá prisión de SEIS (6) meses a TRES (3) años al que reuniendo las condiciones personales descriptas en el artículo 167 quater inciso 4, por imprudencia o negligencia, intervenga…", "p": ["Se impondrá prisión de SEIS (6) meses a TRES (3) años al que reuniendo las condiciones personales descriptas en el artículo 167 quater inciso 4, por imprudencia o negligencia, intervenga en algunas de las acciones prevista en el artículo precedente, omitiendo adoptar las medidas necesarias para cerciorarse de la procedencia legítima del ganado."], "nt": ["(Artículo incorporado por art. 7° de la Ley N° 25.890 B.O. 21/572004)"], "z": []}, {"pn": [{"t": "P", "a": 24, "b": 120, "c": "1) a) Será reprimido con prisión de dos a diez años y multa de dos a diez veces del monto de la operación el que convirti…"}], "n": 332, "l": "278", "s": "1) a) Será reprimido con prisión de dos a diez años y multa de dos a diez veces del monto de la operación el que convirtiere, transfiriere, administrare, vendiere, gravare o aplicare de…", "p": ["1) a) Será reprimido con prisión de dos a diez años y multa de dos a diez veces del monto de la operación el que convirtiere, transfiriere, administrare, vendiere, gravare o aplicare de cualquier otro modo dinero u otra clase de bienes provenientes de un delito en el que no hubiera participado, con la consecuencia posible de que los bienes originarios o los subrogantes adquieran la apariencia de un origen lícito y siempre que su valor supere la suma de cincuenta mil pesos ($ 50.000), sea en un solo acto o por la reiteración de hechos diversos vinculados entre sí;", "b) El mínimo de la escala penal será de cinco (5) años de prisión, cuando el autor realizare el hecho con habitualidad o como miembro de una asociación o banda formada para la comisión continuada de hechos de esta naturaleza;", "c) Si el valor de los bienes no superare la suma indicada en este inciso, letra a, el autor será reprimido, en su caso, conforme a las reglas del artículo 277;", "2) (Inciso vetado por Decreto N° 370/2000 B.O. 10/5/2000)", "3) El que recibiere dinero u otros bienes de origen delictivo, con el fin de hacerlos aplicar en una operación que les dé la apariencia posible de un origen lícito, será reprimido conforme a las reglas del artículo 277;", "4) Los objetos a los que se refiere el delito de los incisos 1, 2 ó 3 de este artículo podrán ser decomisados", "5) La exención establecida en el inciso 4 del artículo 277 no será de aplicación a ninguno de los supuestos contemplados por el presente artículo. (Inciso incorporado por Art. 5º de la Ley Nº 26.087, B.O. 24/04/2006.)"], "nt": ["(Artículo sustituido por art. 1° de la Ley N°25.246 B.O. 10/5/2000. Nota Infoleg: inciso 2) vetado por Decreto N°370/2000 B.O. 10/5/2000: \"2) El que por temeridad o imprudencia grave cometiere alguno de los hechos descriptos en el inciso anterior, primera oración, será reprimido con multa del veinte por ciento (20%) al ciento cincuenta por ciento (150%) del valor de los bienes objeto del delito\")"], "z": ["2–10 años"]}, {"pn": [], "n": 333, "l": "279", "s": "1.", "p": ["1. Si la escala penal prevista para el delito precedente fuera menor que la establecida en las disposiciones de este Capítulo, será aplicable al caso la escala penal del delito precedente;", "2. Si el delito precedente no estuviere amenazado con pena privativa de libertad, se aplicará a su encubrimiento multa de mil pesos ($ 1.000) a veinte mil pesos ($ 20.000) o la escala penal del delito precedente, si ésta fuera menor. (Frase \"No será punible el encubrimiento de un delito de esa índole, cuando se cometiere por imprudencia, en el sentido del artículo 278, inciso 2;\" vetada por Decreto N°370/2000 B.O. 10/5/2000)", "3 Cuando el autor de alguno de los hechos descriptos en el artículo 277, incisos 1 ó 3, o en el artículo 278, inciso 1, fuera funcionario público que hubiera cometido el hecho en ejercicio u ocasión de sus funciones sufrirá además pena de inhabilitación especial de tres (3) a diez (10) años. La misma pena sufrirá el que hubiera actuado en ejercicio u ocasión de una profesión u oficio que requirieran habilitación especial. (Inciso sustituido por art. 3° de la Ley N°25.815 4. Las disposiciones de este Capítulo regirán aun cuando el delito precedente hubiera sido cometido fuera del ámbito de aplicación especial de este Código, en tanto el hecho precedente también hubiera estado amenazado con pena en el lugar de su comisión."], "nt": ["(Artículo sustituido por art. de la Ley N°25.246 B.O.10/5/2000. Vetada parcialmente por Decreto N°370/2000 B.O.10/5/2000)", "(Rúbrica del capítulo sustituida por art. 3° de la Ley N° 23.487 B.O. 26/1/1987)"], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Será reprimido con prisión de un mes a un año, el que hallándose legalmente detenido se evadiere por medio de viole…"}], "n": 334, "l": "280", "s": "Será reprimido con prisión de un mes a un año, el que hallándose legalmente detenido se evadiere por medio de violencia en las personas o fuerza en las cosas.", "p": ["Será reprimido con prisión de un mes a un año, el que hallándose legalmente detenido se evadiere por medio de violencia en las personas o fuerza en las cosas."], "nt": [], "z": ["1 mes–1 año"]}, {"pn": [{"t": "P", "a": 1, "b": 48, "c": "Será reprimido con prisión de un mes a cuatro años, el que favoreciere la evasión de algún detenido o condenado, y si fu…"}], "n": 335, "l": "281", "s": "Será reprimido con prisión de un mes a cuatro años, el que favoreciere la evasión de algún detenido o condenado, y si fuere funcionario público, sufrirá, además, inhabilitación absoluta…", "p": ["Será reprimido con prisión de un mes a cuatro años, el que favoreciere la evasión de algún detenido o condenado, y si fuere funcionario público, sufrirá, además, inhabilitación absoluta por triple tiempo.", "Si la evasión se produjere por negligencia de un funcionario público, éste será reprimido con multa de pesos argentinos mil a pesos argentinos quince mil."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["1 mes–4 años"]}, {"pn": [{"t": "P", "a": 2, "b": 24, "c": "…na inhabilitación judicialmente impuesta será reprimido con prisión de dos meses a dos años."}], "n": 336, "l": "281 bis", "s": "El que quebrantare una inhabilitación judicialmente impuesta será reprimido con prisión de dos meses a dos años.", "p": ["El que quebrantare una inhabilitación judicialmente impuesta será reprimido con prisión de dos meses a dos años."], "nt": ["(Artículo incorporado por art.4° de la Ley N° 23.487 B.O. 26/1/1987)"], "z": ["2 meses–2 años"]}, {"pn": [{"t": "PR", "a": 36, "b": 180, "c": "Serán reprimidos con reclusión o prisión de tres a quince años, el que falsificare moneda que tenga curso legal en la República y el…"}, {"t": "PR", "a": 12, "b": 60, "c": "…o pusiere en circulación.ARTICULO 283. - Será reprimido con reclusión o prisión de uno a cinco años, el que cercenare o alterare moneda de curso legal y el que introduje…"}], "n": 337, "l": "282", "s": "Serán reprimidos con reclusión o prisión de tres a quince años, el que falsificare moneda que tenga curso legal en la República y el que la introdujere, expendiere o pusiere en…", "p": ["Serán reprimidos con reclusión o prisión de tres a quince años, el que falsificare moneda que tenga curso legal en la República y el que la introdujere, expendiere o pusiere en circulación.ARTICULO 283. - Será reprimido con reclusión o prisión de uno a cinco años, el que cercenare o alterare moneda de curso legal y el que introdujere, expendiere o pusiere en circulación moneda cercenada o alterada.", "Si la alteración consistiere en cambiar el color de la moneda, la pena será de seis meses a tres años de prisión."], "nt": [], "z": ["3–15 años", "1–5 años", "6 meses–3 años"]}, {"pn": [], "n": 338, "l": "284", "s": "Si la moneda falsa, cercenada o alterada se hubiere recibido de buena fe y se expendiere o circulare con conocimiento de la falsedad, cercenamiento o alteración, la pena será de pesos…", "p": ["Si la moneda falsa, cercenada o alterada se hubiere recibido de buena fe y se expendiere o circulare con conocimiento de la falsedad, cercenamiento o alteración, la pena será de pesos argentinos mil a pesos argentinos quince mil."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": []}, {"pn": [], "n": 339, "l": "285", "s": "Para los efectos de los artículos anteriores quedan equiparados a la moneda nacional, la moneda extranjera, los títulos de la deuda nacional, provincial o municipal y sus cupones, los…", "p": ["Para los efectos de los artículos anteriores quedan equiparados a la moneda nacional, la moneda extranjera, los títulos de la deuda nacional, provincial o municipal y sus cupones, los bonos o libranzas de los tesoros nacional, provinciales y municipales, los billetes de banco, títulos, cédulas, acciones, valores negociables y tarjetas de compra, crédito o débito, legalmente emitidos por entidades nacionales o extranjeras autorizadas para ello, y los cheques de todo tipo, incluidos los de viajero, cualquiera que fuere la sede del banco girado."], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 25.930 B.O. 21/9/2004)"], "z": []}, {"pn": [], "n": 340, "l": "286", "s": "—", "p": ["—"], "nt": ["(Artículo derogado por art. 3° de la Ley N° 25.930 B.O. 21/9/2004)"], "z": []}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "Serán reprimidos con reclusión o prisión de uno a seis años e inhabilitación absoluta por doble tiempo, el funcionario público y…"}], "n": 341, "l": "287", "s": "Serán reprimidos con reclusión o prisión de uno a seis años e inhabilitación absoluta por doble tiempo, el funcionario público y el director o administrador de un banco o de una compañía…", "p": ["Serán reprimidos con reclusión o prisión de uno a seis años e inhabilitación absoluta por doble tiempo, el funcionario público y el director o administrador de un banco o de una compañía que fabricare o emitiere o autorizare la fabricación o emisión de moneda, con título o peso inferiores al de la ley, billetes de banco o cualesquiera títulos, cédulas o acciones al portador, en cantidad superior a la autorizada."], "nt": [], "z": ["1–6 años"]}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "Será reprimido con reclusión o prisión de uno a seis años: 1º. El que falsificare sellos oficiales; 2º. El que falsificare pape…"}], "n": 342, "l": "288", "s": "Será reprimido con reclusión o prisión de uno a seis años:", "p": ["Será reprimido con reclusión o prisión de uno a seis años:", "1º. El que falsificare sellos oficiales;", "2º. El que falsificare papel sellado, sellos de correos o telégrafos o cualquiera otra clase de efectos timbrados cuya emisión esté reservada a la autoridad o tenga por objeto el cobro de impuestos.- En estos casos, así como en los de los artículos siguientes, se considerará falsificación la impresión fraudulenta del sello verdadero."], "nt": [], "z": ["1–6 años"]}, {"pn": [{"t": "P", "a": 6, "b": 36, "c": "Será reprimido con prisión de seis meses a tres años: 1. El que falsificare marcas, contraseñas o firmas oficialmente usad…"}], "n": 343, "l": "289", "s": "Será reprimido con prisión de seis meses a tres años:", "p": ["Será reprimido con prisión de seis meses a tres años:", "1. El que falsificare marcas, contraseñas o firmas oficialmente usadas o legalmente requeridas para contrastar pesas o medidas, identificar cualquier objeto o certificar su calidad, cantidad o contenido, y el que las aplicare a objetos distintos de aquellos a que debían ser aplicados. 2. El que falsificare billetes de empresas públicas de transporte.", "3. El que falsificare, alterare o suprimiere la numeración de un objeto registrada de acuerdo con la ley."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 24.721 B.O. 18/11/1996)"], "z": ["6 meses–3 años"]}, {"pn": [{"t": "P", "a": 0.5, "b": 12, "c": "Será reprimido con prisión de quince días a un año, el que hiciere desaparecer de cualquiera de los sellos, timbres, mar…"}], "n": 344, "l": "290", "s": "Será reprimido con prisión de quince días a un año, el que hiciere desaparecer de cualquiera de los sellos, timbres, marcas o contraseñas, a que se refieren los artículos anteriores, el…", "p": ["Será reprimido con prisión de quince días a un año, el que hiciere desaparecer de cualquiera de los sellos, timbres, marcas o contraseñas, a que se refieren los artículos anteriores, el signo que indique haber ya servido o sido inutilizado para el objeto de su expedición.El que a sabiendas usare, hiciere usar o pusiere en venta estos sellos, timbres, etc., inutilizados, será reprimido con multa de pesos setecientos cincuenta a pesos doce mil quinientos."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": ["15 días–1 año"]}, {"pn": [], "n": 345, "l": "291", "s": "Cuando el culpable de alguno de los delitos comprendidos en los artículos anteriores, fuere funcionario público y cometiere el hecho abusando de su cargo, sufrirá, además, inhabilitación…", "p": ["Cuando el culpable de alguno de los delitos comprendidos en los artículos anteriores, fuere funcionario público y cometiere el hecho abusando de su cargo, sufrirá, además, inhabilitación absoluta por doble tiempo del de la condena.Capítulo III Falsificación de documentos en general"], "nt": [], "z": []}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "…o, de modo que pueda resultar perjuicio, será reprimido con reclusión o prisión de uno a seis años, si se tratare de un instrumento público y con prisión de seis meses…"}, {"t": "P", "a": 6, "b": 24, "c": "…a seis años, si se tratare de un instrumento público y con prisión de seis meses a dos años, si se tratare de un instrumento privado. Si el documento falsificado…"}], "n": 346, "l": "292", "s": "El que hiciere en todo o en parte un documento falso o adultere uno verdadero, de modo que pueda resultar perjuicio, será reprimido con reclusión o prisión de uno a seis años, si se…", "p": ["El que hiciere en todo o en parte un documento falso o adultere uno verdadero, de modo que pueda resultar perjuicio, será reprimido con reclusión o prisión de uno a seis años, si se tratare de un instrumento público y con prisión de seis meses a dos años, si se tratare de un instrumento privado.", "Si el documento falsificado o adulterado fuere de los destinados a acreditar la identidad de las personas o la titularidad del dominio o habilitación para circular de vehículos automotores, la pena será de tres a ocho años.", "Para los efectos del párrafo anterior están equiparados a los documentos destinados a acreditar la identidad de las personas, aquellos que a tal fin se dieren a los integrantes de las fuerzas armadas, de seguridad, policiales o penitenciarias, las cédulas de identidad expedidas por autoridad pública competente, las libretas cívicas o de enrolamiento, y los pasaportes, así como también los certificados de parto y de nacimiento."], "nt": ["(Artículo sustituido por art. 9° de la Ley N° 24.410 B.O. 2/1/1995)"], "z": ["1–6 años", "6 meses–2 años", "3–8 años"]}, {"pn": [{"t": "PR", "a": 12, "b": 72, "c": "Será reprimido con reclusión o prisión de uno a seis años, el que insertare o hiciere insertar en un instrumento público declar…"}], "n": 347, "l": "293", "s": "Será reprimido con reclusión o prisión de uno a seis años, el que insertare o hiciere insertar en un instrumento público declaraciones falsas, concernientes a un hecho que el documento…", "p": ["Será reprimido con reclusión o prisión de uno a seis años, el que insertare o hiciere insertar en un instrumento público declaraciones falsas, concernientes a un hecho que el documento deba probar, de modo que pueda resultar perjuicio.", "Si se tratase de los documentos o certificados mencionados en el último párrafo del artículo anterior, la pena será de 3 a 8 años. (Párrafo sustituido por art. 10° de la Ley N° 24.410 B.O. 2/1/1995)"], "nt": [], "z": ["1–6 años"]}, {"pn": [{"t": "P", "a": 12, "b": 36, "c": "Se impondrá prisión de UNO (1) a TRES (3) años al funcionario público que, por imprudencia o negligencia, intervenga…"}], "n": 348, "l": "293 bis", "s": "Se impondrá prisión de UNO (1) a TRES (3) años al funcionario público que, por imprudencia o negligencia, intervenga en la expedición de guías de tránsito de ganado o en el visado o…", "p": ["Se impondrá prisión de UNO (1) a TRES (3) años al funcionario público que, por imprudencia o negligencia, intervenga en la expedición de guías de tránsito de ganado o en el visado o legalización de certificados de adquisición u otros documentos que acrediten la propiedad del semoviente, omitiendo adoptar las medidas necesarias para cerciorarse de su procedencia legítima."], "nt": ["(Artículo incorporado por art. 8° de la Ley N° 25.890 B.O. 21/5/2004)"], "z": []}, {"pn": [], "n": 349, "l": "294", "s": "El que suprimiere o destruyere, en todo o en parte, un documento de modo que pueda resultar perjuicio, incurrirá en las penas señaladas en los artículos anteriores, en los casos respectivos.", "p": ["El que suprimiere o destruyere, en todo o en parte, un documento de modo que pueda resultar perjuicio, incurrirá en las penas señaladas en los artículos anteriores, en los casos respectivos."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Sufrirá prisión de un mes a un año, el médico que diere por escrito un certificado falso, concerniente a…"}], "n": 350, "l": "295", "s": "Sufrirá prisión de un mes a un año, el médico que diere por escrito un certificado falso, concerniente a la existencia o inexistencia, presente o pasada, de alguna enfermedad o lesión…", "p": ["Sufrirá prisión de un mes a un año, el médico que diere por escrito un certificado falso, concerniente a la existencia o inexistencia, presente o pasada, de alguna enfermedad o lesión cuando de ello resulte perjuicio.", "La pena será de uno a cuatro años, si el falso certificado debiera tener por consecuen <script>

const hl=(t,ts)=>{if(!ts.length)return esc(t);let o='',p=0;for(const m of t.matchAll(/[\p{L}\d]+/gu)){o+=esc(t.slice(p,m.index));const n=norm(m[0]);o+=ts.some(s=>n.startsWith(s))?`<mark>${esc(m[0])}</mark>`:esc(m[0]);p=m.index+m[0].length}return o+esc(t.slice(p))};

 $('#chips').innerHTML='<button class="chip" data-l="" aria-pressed="true">Todo el Código</button>'+L.map((l,k)=>`<button class="chip" data-l="${k}" title="${esc(l.name)}" aria-pressed="false">${l.short}</button>`).join('')}

 ${q?'':`<div class="full" hidden>${a.p.map(p=>`<p${/^(\d+[º°]|[a-z]\)|\d+\))/.test(p)?' class="inc"':''}>${ref(esc(p))}</p>`).join('')}${a.nt.length?`<div class="nt"><b>Antecedentes normativos</b><ul>${a.nt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>`}</article>`}

 (rs.slice(0,60).map(a=>card(a,{ts,snip:snip(a),sub:`${lb(CH[a.n])} · ${lab(CH[a.n])} · ${C[CH[a.n]].name}`})).join('')||'<p>Sin coincidencias.</p>')}

/* buscador de penas */
let pt='todas';
const fm=m=>{if(m<1)return Math.round(m*30)+' días';const y=Math.floor(m/12+1e-9),r=Math.round((m-y*12)*10)/10,p=[];if(y)p.push(y+(y==1?' año':' años'));if(r)p.push(r+(r==1?' mes':' meses'));return p.join(' y ')};
const TN={P:'Prisión',R:'Reclusión',PR:'Reclusión o prisión'};
const rg=x=>x.p?'perpetua':fm(x.a)+' a '+fm(x.b);
const tent=x=>x.p?(x.t.includes('R')?[{t:'R',a:180,b:240}]:[]).concat(x.t.includes('P')?[{t:'P',a:120,b:180}]:[]):[{t:x.t,a:x.a/2,b:x.b*2/3}];
function penas(){M.style.cssText='';setLib('');S.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.i=='p'));
 M.innerHTML=`<nav class="crumb"><a href="#/">Inicio</a><span>›</span><span>Penas</span></nav><div class="sec"><h2>Buscador de penas</h2><span>Prisión y reclusión detectadas en el texto de los artículos</span></div>
 <div class="tabs">${[['todas','Todas'],['P','Prisión'],['R','Reclusión'],['perp','Perpetuas']].map(([k,l])=>`<button data-u="${k}" class="${k==pt?'on':''}">${l}</button>`).join('')}</div>
 <div class="ctl"><input id="pq" type="search" placeholder="Filtrar por delito: ej. homicidio, robo, estafa…"><input id="pa" type="number" min="0" step="any" placeholder="Incluye (años)"><input id="pmn" type="number" min="0" step="any" placeholder="Mínimo ≥ (años)"><input id="pmx" type="number" min="0" step="any" placeholder="Máximo ≤ (años)"><select id="pl"><option value="">Todo el Código</option>${L.map((l,k)=>`<option value="${k}">${esc(l.name)}</option>`).join('')}</select></div>
 <div class="ctl"><label class="ck"><input type="checkbox" id="pt"> Ver escala en grado de tentativa (art. 44)</label></div>
 <p class="hint" id="pc"></p><table class="tb"><thead><tr><th>Artículo</th><th>Pena</th><th id="th2">Tentativa (art. 44)</th><th>Contexto</th></tr></thead><tbody id="pb"></tbody></table>
 <p class="foot">Tentativa (art. 44): se aplica la escala del delito consumado disminuida de un tercio a la mitad. Se calcula con la interpretación dominante: el mínimo se reduce a la mitad y el máximo en un tercio. Si la pena es reclusión perpetua, la tentativa es reclusión de 15 a 20 años; si es prisión perpetua, prisión de 10 a 15 años. No contempla el delito imposible (art. 44, último párrafo) ni el desistimiento voluntario (art. 43). Las penas se extraen automáticamente del texto: verificá en el artículo antes de usarlas.</p>`;
 const draw=()=>{const q=norm($('#pq').value),v=$('#pa').value,mn=$('#pmn').value,mx=$('#pmx').value,l=$('#pl').value,tn=$('#pt').checked;let r=[];
  A.forEach(a=>a.pn.forEach(x=>{if(pt=='perp'?!x.p:pt=='todas'?0:(x.p||!x.t.includes(pt)))return;if(l!==''&&C[CH[a.n]].l!=+l)return;if(q&&!norm(a.p.join(' ')+' '+C[CH[a.n]].name).includes(q)&&!norm(x.c).includes(q))return;
   const sc=tn?tent(x):x.p?[]:[x];if((v||mn||mx)&&!sc.some(y=>(!v||y.a<=v*12+1e-6&&y.b>=v*12-1e-6)&&(!mn||y.a>=mn*12-1e-6)&&(!mx||y.b<=mx*12+1e-6)))return;r.push({a,x})}));
  $('#pc').textContent=`${r.length} pena${r.length==1?'':'s'}${r.length>200?' · se muestran 200':''}`;
  $('#th2').style.display=tn?'':'none';
  $('#pb').innerHTML=r.slice(0,200).map(({a,x})=>`<tr><td data-l="Artículo"><a class="x" href="#/a/${a.n}">Art. ${esc(a.l)}</a><div><small>${esc(a.s.length>70?a.s.slice(0,67)+'…':a.s)}</small></div></td><td data-l="Pena"><span class="pz">${x.p?(x.t=='PR'?'Reclusión o prisión':TN[x.t])+' perpetua':TN[x.t]+' · '+rg(x)}</span></td>${tn?`<td data-l="Tentativa">${tent(x).map(y=>`<span class="pz">${TN[y.t]} · ${fm(y.a)} a ${fm(y.b)}</span>`).join('')}</td>`:''}<td data-l="Contexto">${ref(esc(x.c))}</td></tr>`).join('')||'<tr><td colspan="4">Sin penas con esos filtros.</td></tr>'};
 ['#pq','#pa','#pmn','#pmx'].forEach(s=>$(s).oninput=draw);$('#pl').onchange=draw;$('#pt').onchange=draw;
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{pt=b.dataset.u;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));draw()});draw()}
function setT(a,hide){a.querySelector('.full').hidden=hide;a.querySelector('[data-a=t]').textContent=hide?'Ver texto completo':'Ocultar texto completo'}
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/([cal])\/(\d+)/);S.classList.remove('open');M.style.cssText='';
 if(h=='/penas'){penas();scrollTo(0,0);return}
 const k=m?m[1]:'',v=m?+m[2]:-1,ci=k=='c'?v:k=='a'&&B[v]?CH[v]:-1;
 setLib(k=='l'?String(v):C[ci]?String(C[ci].l):'');
 if(k=='l'&&L[v]){libro(v);scrollTo(0,0);return}
 if(!C[ci]){home();scrollTo(0,0);S.querySelectorAll('a').forEach(a=>a.classList.remove('on'));return}
 chapter(ci);if(k=='c')scrollTo(0,0);else{const e=$('#a'+v);e.classList.add('hit');setT(e,false);setTimeout(()=>e.scrollIntoView({block:'start'}),30)}}
document.addEventListener('click',e=>{
 const c=e.target.closest('.chip');if(c){$('#q').value='';setLib(c.dataset.l);location.hash=c.dataset.l!==''?'/l/'+c.dataset.l:'/';route();return}
 const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a,art=b.closest('.art');
 if(k=='t')setT(art,!art.querySelector('.full').hidden);
 else if(k=='all'||k=='none')document.querySelectorAll('.art').forEach(x=>setT(x,k=='none'));
 else if(k=='c'){const a=B[+b.dataset.n];copy(`Artículo ${a.l}.-\n`+a.p.join('\n'),'Texto copiado')}
 else if(k=='l')copy(location.href.split('#')[0]+'#/a/'+b.dataset.n,'Enlace copiado')});
$('#home').onclick=()=>{$('#q').value='';location.hash='/';route()};
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>find(e.target.value),180)};
$('#menu').onclick=()=>S.classList.toggle('open');
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#11151e';r.dataset.theme=dk?'light':'dark'};
addEventListener('hashchange',route);addEventListener('resize',hh);
side();hh();route();

</script>
