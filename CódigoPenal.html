arts": [325, 326]}, {"n": "Capítulo XII", "name": "Falso testimonio", "arts": [327, 328]}, {"n": "Capítulo XIII", "name": "Encubrimiento y Lavado de Activos de origen delictivo", "arts": [329, 330, 331, 332, 333]}, {"n": "Capítulo XIV", "name": "Evasión y quebrantamiento de pena.", "arts": [334, 335, 336]}]}, {"n": "XII", "l": 1, "name": "Delitos contra la fe pública", "secs": [{"n": "Capítulo I", "name": "Falsificación de moneda, billetes de banco, títulos al portador y documentos de crédito", "arts": [337, 338, 339, 340, 341]}, {"n": "Capítulo II", "name": "Falsificación de sellos, timbres y marcas", "arts": [342, 343, 344, 345, 346, 347, 348, 349, 350, 351, 352, 353, 354]}, {"n": "Capítulo IV", "name": "Disposiciones comunes a los Capítulos precedentes", "arts": [355, 356]}, {"n": "Capítulo VI", "name": "Del pago con cheques sin provisión de fondos", "arts": [357, 358, 359, 360]}]}], "arts": [{"pn": [], "n": 1, "l": "1", "s": "Este código se aplicará:", "p": ["Este código se aplicará:", "1º.- Por delitos cometidos o cuyos efectos deban producirse en el territorio de la Nación Argentina, o en los lugares sometidos a su jurisdicción;", "2º.- Por delitos cometidos en el extranjero por agentes o empleados de autoridades argentinas en desempeño de su cargo."], "nt": [], "z": []}, {"pn": [], "n": 2, "l": "2", "s": "Si la ley vigente al tiempo de cometerse el delito fuere distinta de la que exista al pronunciarse el fallo o en el tiempo intermedio, se aplicará siempre la más benigna.", "p": ["Si la ley vigente al tiempo de cometerse el delito fuere distinta de la que exista al pronunciarse el fallo o en el tiempo intermedio, se aplicará siempre la más benigna. Si durante la condena se dictare una ley más benigna, la pena se limitará a la establecida por esa ley. En todos los casos del presente artículo, los efectos de la nueva ley se operarán de pleno derecho."], "nt": [], "z": []}, {"pn": [], "n": 3, "l": "3", "s": "En el cómputo de la prisión preventiva se observará separadamente la ley más favorable al procesado.", "p": ["En el cómputo de la prisión preventiva se observará separadamente la ley más favorable al procesado."], "nt": [], "z": []}, {"pn": [], "n": 4, "l": "4", "s": "Las disposiciones generales del presente código se aplicarán a todos los delitos previstos por leyes especiales, en cuanto éstas no dispusieran lo contrario.", "p": ["Las disposiciones generales del presente código se aplicarán a todos los delitos previstos por leyes especiales, en cuanto éstas no dispusieran lo contrario."], "nt": [], "z": []}, {"pn": [], "n": 5, "l": "5", "s": "Las penas que este Código establece son las siguientes:", "p": ["Las penas que este Código establece son las siguientes: reclusión, prisión, multa e inhabilitación."], "nt": [], "z": []}, {"pn": [], "n": 6, "l": "6", "s": "La pena de reclusión, perpetua o temporal, se cumplirá con trabajo obligatorio en los establecimientos destinados al efecto.", "p": ["La pena de reclusión, perpetua o temporal, se cumplirá con trabajo obligatorio en los establecimientos destinados al efecto. Los recluidos podrán ser empleados en obras públicas de cualquier clase con tal que no fueren contratadas por particulares."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 7, "l": "7", "s": "Los hombres débiles o enfermos y los mayores de sesenta años que merecieren reclusión, sufrirán la condena en prisión, no debiendo ser sometidos sino a la clase de trabajo especial que…", "p": ["Los hombres débiles o enfermos y los mayores de sesenta años que merecieren reclusión, sufrirán la condena en prisión, no debiendo ser sometidos sino a la clase de trabajo especial que determine la dirección del establecimiento."], "nt": [], "z": []}, {"pn": [], "n": 8, "l": "8", "s": "Los menores de edad y las mujeres sufrirán las condenas en establecimientos especiales.", "p": ["Los menores de edad y las mujeres sufrirán las condenas en establecimientos especiales."], "nt": [], "z": []}, {"pn": [], "n": 9, "l": "9", "s": "La pena de prisión, perpetua o temporal, se cumplirá con trabajo obligatorio, en establecimientos distintos de los destinados a los recluidos.", "p": ["La pena de prisión, perpetua o temporal, se cumplirá con trabajo obligatorio, en establecimientos distintos de los destinados a los recluidos."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 10, "l": "10", "s": "Podrán, a criterio del juez competente, cumplir la pena de reclusión o prisión en detención domiciliaria:", "p": ["Podrán, a criterio del juez competente, cumplir la pena de reclusión o prisión en detención domiciliaria:", "a) El interno enfermo cuando la privación de la libertad en el establecimiento carcelario le impide recuperarse o tratar adecuadamente su dolencia y no correspondiere su alojamiento en un establecimiento hospitalario;", "b) El interno que padezca una enfermedad incurable en período terminal;", "c) El interno díscapacitado cuando la privación de la libertad en el establecimiento carcelario es inadecuada por su condición implicándole un trato indigno, inhumano o cruel;", "d) El interno mayor de setenta (70) años;", "e) La mujer embarazada;", "f) La madre de un niño menor de cinco (5) años o de una persona con discapacidad a su cargo."], "nt": ["(Artículo sustituido por art. 4° de la Ley N° 26.472, B.O. 20/1/2009)"], "z": []}, {"pn": [], "n": 11, "l": "11", "s": "El producto del trabajo del condenado a reclusión o prisión se aplicará simultáneamente:", "p": ["El producto del trabajo del condenado a reclusión o prisión se aplicará simultáneamente:", "1º. A indemnizar los daños y perjuicios causados por el delito que no satisfaciera con otros recursos;", "2º. A la prestación de alimentos según el Código Civil;", "3º. A costear los gastos que causare en el establecimiento;", "4º. A formar un fondo propio, que se le entregará a su salida."], "nt": [], "z": []}, {"pn": [], "n": 12, "l": "12", "s": "La reclusión y la prisión por más de tres años llevan como inherente la inhabilitación absoluta, por el tiempo de la condena, la que podrá durar hasta tres años más, si así lo resuelve…", "p": ["La reclusión y la prisión por más de tres años llevan como inherente la inhabilitación absoluta, por el tiempo de la condena, la que podrá durar hasta tres años más, si así lo resuelve el tribunal, de acuerdo con la índole del delito. Importan además la privación, mientras dure la pena, de la patria potestad, de la administración de los bienes y del derecho de disponer de ellos por actos entre vivos. El penado quedará sujeto a la curatela establecida por el Código Civil para los incapaces."], "nt": [], "z": []}, {"pn": [], "n": 13, "l": "13", "s": "El condenado a reclusión o prisión perpetua que hubiere cumplido treinta y cinco (35) años de condena, el condenado a reclusión o a prisión por más de tres (3) años que hubiere cumplido…", "p": ["El condenado a reclusión o prisión perpetua que hubiere cumplido treinta y cinco (35) años de condena, el condenado a reclusión o a prisión por más de tres (3) años que hubiere cumplido los dos tercios, y el condenado a reclusión o prisión, por tres (3) años o menos, que hubiere cumplido un (1) año de reclusión u ocho (8) meses de prisión, observando con regularidad los reglamentos carcelarios, podrán obtener la libertad por resolución judicial, previo informe de la dirección del establecimiento e informe de peritos que pronostique en forma individualizada y favorable su reinserción social, bajo las siguientes condiciones:", "1º.- Residir en el lugar que determine el auto de soltura;", "2º.- Observar las reglas de inspección que fije el mismo auto, especialmente la obligación de abstenerse de consumir bebidas alcohólicas o utilizar sustancias estupefacientes;", "3º.- Adoptar en el plazo que el auto determine, oficio, arte, industria o profesión, si no tuviere medios propios de subsistencia;", "4º.- No cometer nuevos delitos;", "5º.- Someterse al cuidado de un patronato, indicado por las autoridades competentes;", "6º.- Someterse a tratamiento médico, psiquiátrico o psicológico, que acrediten su necesidad y eficacia de acuerdo al consejo de peritos.", "Estas condiciones, a las que el juez podrá añadir cualquiera de las reglas de conducta contempladas en el artículo 27 bis, regirán hasta el vencimiento de los términos de las penas temporales y hasta diez (10) años más en las perpetuas, a contar desde el día del otorgamiento de la libertad condicional."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 25.892 B.O.26/5/2004)"], "z": ["perpetua"]}, {"pn": [], "n": 14, "l": "14", "s": "La libertad condicional no se concederá a los reincidentes.", "p": ["La libertad condicional no se concederá a los reincidentes. Tampoco se concederá en los casos previstos en los artículos 80 inciso 7º, 124, 142 bis, anteúltimo párrafo, 165 y 170, anteúltimo párrafo."], "nt": ["(Artículo sustituido por art. 2° de la Ley N° 25.892 B.O.26/5/2004)"], "z": []}, {"pn": [], "n": 15, "l": "15", "s": "La libertad condicional será revocada cuando el penado cometiere un nuevo delito o violare la obligación de residencia.", "p": ["La libertad condicional será revocada cuando el penado cometiere un nuevo delito o violare la obligación de residencia. En estos casos no se computará, en el término de la pena, el tiempo que haya durado la libertad.", "En los casos de los incisos 2º, 3º, 5º y 6º del artículo 13, el Tribunal podrá disponer que no se compute en el término de la condena todo o parte del tiempo que hubiere durado la libertad, hasta que el condenado cumpliese con lo dispuesto en dichos incisos. (Párrafo sustituido por art. 3° de la Ley N° 25.892 B.O.26/5/2004)"], "nt": [], "z": []}, {"pn": [], "n": 16, "l": "16", "s": "Transcurrido el término de la condena, o el plazo de cinco años señalado en el artículo 13 sin que la libertad condicional haya sido revocada, la pena quedará extinguida, lo mismo que la…", "p": ["Transcurrido el término de la condena, o el plazo de cinco años señalado en el artículo 13 sin que la libertad condicional haya sido revocada, la pena quedará extinguida, lo mismo que la inhabilitación absoluta del artículo 12."], "nt": [], "z": []}, {"pn": [], "n": 17, "l": "17", "s": "Ningún penado cuya libertad condicional haya sido revocada, podrá obtenerla nuevamente.", "p": ["Ningún penado cuya libertad condicional haya sido revocada, podrá obtenerla nuevamente."], "nt": [], "z": []}, {"pn": [], "n": 18, "l": "18", "s": "Los condenados por tribunales provinciales a reclusión o prisión por más de cinco años serán admitidos en los respectivos establecimientos nacionales.", "p": ["Los condenados por tribunales provinciales a reclusión o prisión por más de cinco años serán admitidos en los respectivos establecimientos nacionales. Las provincias podrán mandarlos siempre que no tuvieren establecimientos adecuados."], "nt": [], "z": []}, {"pn": [], "n": 19, "l": "19", "s": "La inhabilitación absoluta importa:", "p": ["La inhabilitación absoluta importa:", "1º. La privación del empleo o cargo público que ejercía el penado aunque provenga de elección popular;", "2º. La privación del derecho electoral;", "3º. La incapacidad para obtener cargos, empleos y comisiones públicas;", "4º. La suspensión del goce de toda jubilación, pensión o retiro, civil o militar, cuyo importe será percibido por los parientes que tengan derecho a pensión.", "El tribunal podrá disponer, por razones de carácter asistencial, que la víctima o los deudos que estaban a su cargo concurran hasta la mitad de dicho importe, o que lo perciban en su totalidad, cuando el penado no tuviere parientes con derecho a pensión, en ambos casos hasta integrar el monto de las indemnizaciones fijadas."], "nt": [], "z": []}, {"pn": [], "n": 20, "l": "20", "s": "La inhabilitación especial producirá la privación del empleo, cargo, profesión o derecho sobre que recayere y la incapacidad para obtener otro del mismo género durante la condena.", "p": ["La inhabilitación especial producirá la privación del empleo, cargo, profesión o derecho sobre que recayere y la incapacidad para obtener otro del mismo género durante la condena. La inhabilitación especial para derechos políticos producirá la incapacidad de ejercer durante la condena aquellos sobre que recayere."], "nt": [], "z": []}, {"pn": [], "n": 21, "l": "20 bis", "s": "Podrá imponerse inhabilitación especial de seis meses a diez años, aunque esa pena no esté expresamente prevista, cuando el delito cometido importe:", "p": ["Podrá imponerse inhabilitación especial de seis meses a diez años, aunque esa pena no esté expresamente prevista, cuando el delito cometido importe:", "1º. Incompetencia o abuso en el ejercicio de un empleo o cargo público;", "2º. Abuso en el ejercicio de la patria potestad, adopción, tutela o curatela;", "3º. Incompetencia o abuso en el desempeño de una profesión o actividad cuyo ejercicio dependa de una autorización, licencia o habilitación del poder público."], "nt": [], "z": ["6 meses–10 años"]}, {"pn": [], "n": 22, "l": "20 ter", "s": "El condenado a inhabilitación absoluta puede ser restituido al uso y goce de los derechos y capacidades de que fue privado, si se ha comportado correctamente durante la mitad del plazo…", "p": ["El condenado a inhabilitación absoluta puede ser restituido al uso y goce de los derechos y capacidades de que fue privado, si se ha comportado correctamente durante la mitad del plazo de aquélla, o durante diez años cuando la pena fuera perpetua, y ha reparado los daños en la medida de lo posible.", "El condenado a inhabilitación especial puede ser rehabilitado, transcurrida la mitad del plazo de ella, o cinco años cuando la pena fuere perpetua, si se ha comportado correctamente, ha remediado su incompetencia o no es de temer que incurra en nuevos abusos y, además, ha reparado los daños en la medida de lo posible.", "Cuando la inhabilitación importó la pérdida de un cargo público o de una tutela o curatela, la rehabilitación no comportará la reposición en los mismos cargos.", "Para todos los efectos, en los plazos de inhabilitación no se computará el tiempo en que el inhabilitado haya estado prófugo, internado o privado de su libertad."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 23, "l": "21", "s": "La multa obligará al reo a pagar la cantidad de dinero que determinare la sentencia, teniendo en cuenta además de las causas generales del artículo 40, la situación económica del penado.", "p": ["La multa obligará al reo a pagar la cantidad de dinero que determinare la sentencia, teniendo en cuenta además de las causas generales del artículo 40, la situación económica del penado.", "Si el reo no pagare la multa en el término que fije la sentencia, sufrirá prisión que no excederá de año y medio.", "El tribunal, antes de transformar la multa en la prisión correspondiente, procurará la satisfacción de la primera, haciéndola efectiva sobre los bienes, sueldos u otras entradas del condenado. Podrá autorizarse al condenado a amortizar la pena pecuniaria, mediante el trabajo libre, siempre que se presente ocasión para ello.", "También se podrá autorizar al condenado a pagar la multa por cuotas. El tribunal fijará el monto y la fecha de los pagos, según la condición económica del condenado."], "nt": [], "z": []}, {"pn": [], "n": 24, "l": "22", "s": "En cualquier tiempo que se satisfaciera la multa, el reo quedará en libertad.", "p": ["En cualquier tiempo que se satisfaciera la multa, el reo quedará en libertad.", "Del importe se descontará, de acuerdo con las reglas establecidas para el cómputo de la prisión preventiva, la parte proporcional al tiempo de detención que hubiere sufrido."], "nt": [], "z": []}, {"pn": [], "n": 25, "l": "22 bis", "s": "Si el hecho ha sido cometido con ánimo de lucro, podrá agregarse a la pena privativa de libertad una multa, aun cuando no esté especialmente prevista o lo esté sólo en forma alternativa…", "p": ["Si el hecho ha sido cometido con ánimo de lucro, podrá agregarse a la pena privativa de libertad una multa, aun cuando no esté especialmente prevista o lo esté sólo en forma alternativa con aquélla. Cuando no esté prevista, la multa no podrá exceder de noventa mil pesos."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": []}, {"pn": [], "n": 26, "l": "23", "s": "En todos los casos en que recayese condena por delitos previstos en este Código o en leyes penales especiales, la misma decidirá el decomiso de las cosas que han servido para cometer el…", "p": ["En todos los casos en que recayese condena por delitos previstos en este Código o en leyes penales especiales, la misma decidirá el decomiso de las cosas que han servido para cometer el hecho y de las cosas o ganancias que son el producto o el provecho del delito, en favor del Estado nacional, de las provincias o de los municipios, salvo los derechos de restitución o indemnización del damnificado y de terceros.", "Si las cosas son peligrosas para la seguridad común, el comiso puede ordenarse aunque afecte a terceros, salvo el derecho de éstos, si fueren de buena fe, a ser indemnizados. Cuando el autor o los partícipes han actuado como mandatarios de alguien o como órganos, miembros o administradores de una persona de existencia ideal, y el producto o el provecho del delito ha beneficiado al mandante o a la persona de existencia ideal, el comiso se pronunciará contra éstos.", "Cuando con el producto o el provecho del delito se hubiese beneficiado un tercero a título gratuito, el comiso se pronunciará contra éste.", "Si el bien decomisado tuviere valor de uso o cultural para algún establecimiento oficial o de bien público, la autoridad nacional, provincial o municipal respectiva podrá disponer su entrega a esas entidades. Si así no fuere y tuviera valor comercial, aquélla dispondrá su enajenación. Si no tuviera valor lícito alguno, se lo destruirá.", "En el caso de condena impuesta por alguno de los delitos previstos por los artículos 142 bis o 170 de este Código, queda comprendido entre los bienes a decomisar la cosa mueble o inmueble donde se mantuviera a la víctima privada de su libertad. Los bienes decomisados con motivo de tales delitos, según los términos del presente artículo, y el producido de las multas que se impongan, serán afectados a programas de asistencia a la víctima.", "El juez podrá adoptar desde el inicio de las actuaciones judiciales las medidas cautelares suficientes para asegurar el decomiso del o de los inmuebles, fondos de comercio, depósitos, transportes, elementos informáticos, técnicos y de comunicación, y todo otro bien o derecho patrimonial sobre los que, por tratarse de instrumentos o efectos relacionados con el o los delitos que se investigan, el decomiso presumiblemente pueda recaer.", "El mismo alcance podrán tener las medidas cautelares destinadas a hacer cesar la comisión del delito o sus efectos, o a evitar que se consolide su provecho o a obtaculizar la impunidad de sus partícipes. En todos los casos se deberá dejar a salvo los derechos de restitución o indemnización del damnificado y de terceros"], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 25.815 B.O.1/12/2003)"], "z": []}, {"pn": [], "n": 27, "l": "24", "s": "La prisión preventiva se computará así:", "p": ["La prisión preventiva se computará así: por dos días de prisión preventiva, uno de reclusión; por un día de prisión preventiva, uno de prisión o dos de inhabilitación o la cantidad de multa que el tribunal fijase entre pesos treinta y cinco y pesos ciento setenta y cinco."], "nt": ["(Nota Infoleg: multa actualizada por art. 1° de la Ley N° 24.286 B.O. 29/12/1993)"], "z": []}, {"pn": [], "n": 28, "l": "25", "s": "Si durante la condena el penado se volviere loco, el tiempo de la locura se computará para el cumplimiento de la pena, sin que ello obste a lo dispuesto en el apartado tercero del inciso…", "p": ["Si durante la condena el penado se volviere loco, el tiempo de la locura se computará para el cumplimiento de la pena, sin que ello obste a lo dispuesto en el apartado tercero del inciso 1º del artículo 34."], "nt": [], "z": []}, {"pn": [], "n": 29, "l": "26", "s": "En los casos de primera condena a pena de prisión que no exceda de tres años, será facultad de los tribunales disponer en el mismo pronunciamiento que se deje en suspenso el cumplimiento…", "p": ["En los casos de primera condena a pena de prisión que no exceda de tres años, será facultad de los tribunales disponer en el mismo pronunciamiento que se deje en suspenso el cumplimiento de la pena. Esta decisión deberá ser fundada, bajo sanción de nulidad, en la personalidad moral del condenado, su actitud posterior al delito, los motivos que lo impulsaron a delinquir, la naturaleza del hecho y las demás circunstancias que demuestren la inconveniencia de aplicar efectivamente la privación de libertad. El tribunal requerirá las informaciones pertinentes para formar criterio, pudiendo las partes aportar también la prueba útil a tal efecto.", "Igual facultad tendrán los tribunales en los casos de concurso de delitos si la pena impuesta al reo no excediese los tres años de prisión.", "No procederá la condenación condicional respecto de las penas de multa o inhabilitación."], "nt": [], "z": []}, {"pn": [], "n": 30, "l": "27", "s": "La condenación se tendrá como no pronunciada si dentro del término de cuatro años, contados a partir de la fecha de la sentencia firme, el condenado no cometiere un nuevo delito.", "p": ["La condenación se tendrá como no pronunciada si dentro del término de cuatro años, contados a partir de la fecha de la sentencia firme, el condenado no cometiere un nuevo delito. Si cometiere un nuevo delito, sufrirá la pena impuesta en la primera condenación y la que le correspondiere por el segundo delito, conforme con lo dispuesto sobre acumulación de penas.", "La suspensión podrá ser acordada por segunda vez si el nuevo delito ha sido cometido después de haber transcurrido ocho años a partir de la fecha de la primera condena firme. Este plazo se elevará a diez años, si ambos delitos fueran dolosos.", "En los casos de sentencias recurridas y confirmadas, en cuanto al carácter condicional de la condena, los plazos se computarán desde la fecha del pronunciamiento originario."], "nt": [], "z": []}, {"pn": [], "n": 31, "l": "27 bis", "s": "Al suspender condicionalmente la ejecución de la pena, el Tribunal deberá disponer que, durante un plazo que fijará entre dos y cuatro años según la gravedad del delito, el condenado…", "p": ["Al suspender condicionalmente la ejecución de la pena, el Tribunal deberá disponer que, durante un plazo que fijará entre dos y cuatro años según la gravedad del delito, el condenado cumpla todas o alguna de las siguientes reglas de conducta, en tanto resulten adecuadas para prevenir la comisión de nuevos delitos:", "1. Fijar residencia y someterse al cuidado de un patronato.", "2. Abstenerse de concurrir a determinados lugares o de relacionarse con determinadas personas.", "3. Abstenerse de usar estupefacientes o de abusar de bebidas alcohólicas.", "4. Asistir a la escolaridad primaria, si no la tuviere cumplida.", "5. Realizar estudios o prácticas necesarios para su capacitación laboral o profesional. 6. Someterse a un tratamiento médico o psicológico, previo informe que acredite su necesidad y eficacia.", "7. Adoptar oficio, arte, industria o profesión, adecuado a su capacidad.", "8. Realizar trabajos no remunerados en favor del estado o de instituciones de bien público, fuera de sus horarios habituales de trabajo.", "Las reglas podrán ser modificadas por el Tribunal según resulte conveniente al caso. Si el condenado no cumpliere con alguna regla, el Tribunal podrá disponer que no se compute como plazo de cumplimiento todo o parte del tiempo transcurrido hasta ese momento. Si el condenado persistiere o reiterare el incumplimiento, el Tribunal podrá revocar la condicionalidad de la condena. El condenado deberá entonces cumplir la totalidad de la pena de prisión impuesta en la sentencia."], "nt": ["(Artículo incorporado por art. 1° de la Ley N° 24.316 B.O. 19/5/1994)"], "z": []}, {"pn": [], "n": 32, "l": "28", "s": "La suspensión de la pena no comprenderá la reparación de los daños causados por el delito y el pago de los gastos del juicio.", "p": ["La suspensión de la pena no comprenderá la reparación de los daños causados por el delito y el pago de los gastos del juicio."], "nt": [], "z": []}, {"pn": [], "n": 33, "l": "29", "s": "La sentencia condenatoria podrá ordenar:", "p": ["La sentencia condenatoria podrá ordenar:", "1. La reposición al estado anterior a la comisión del delito, en cuanto sea posible, disponiendo a ese fin las restituciones y demás medidas necesarias.", "2. La indemnización del daño material y moral causado a la víctima, a su familia o a un tercero, fijándose el monto prudencialmente por el juez en defecto de plena prueba. 3. El pago de las costas."], "nt": ["(Artículo sustituido por art. 27 de la Ley N° 25.188 B.O. 1/11/1999.)"], "z": []}, {"pn": [], "n": 34, "l": "30", "s": "La obligación de indemnizar es preferente a todas las que contrajere el responsable después de cometido el delito, a la ejecución de la pena de decomiso del producto o el provecho del…", "p": ["La obligación de indemnizar es preferente a todas las que contrajere el responsable después de cometido el delito, a la ejecución de la pena de decomiso del producto o el provecho del delito y al pago de la multa. Si los bienes del condenado no fueren suficientes para cubrir todas sus responsabilidades pecuniarias, éstas se satisfarán en el orden siguiente:", "1. La indemnización de los daños y perjuicios.", "2. El resarcimiento de los gastos del juicio.", "3. El decomiso del producto o el provecho del delito.", "4. El pago de la multa."], "nt": ["(Artículo sustituido por art. 28 de la Ley N° 25.188 B.O. 1/11/1999.)"], "z": []}, {"pn": [], "n": 35, "l": "31", "s": "La obligación de reparar el daño es solidaria entre todos los responsables del delito.", "p": ["La obligación de reparar el daño es solidaria entre todos los responsables del delito."], "nt": [], "z": []}, {"pn": [], "n": 36, "l": "32", "s": "El que por título lucrativo participare de los efectos de un delito, estará obligado a la reparación hasta la cuantía en que hubiere participado.", "p": ["El que por título lucrativo participare de los efectos de un delito, estará obligado a la reparación hasta la cuantía en que hubiere participado."], "nt": [], "z": []}, {"pn": [], "n": 37, "l": "33", "s": "En caso de insolvencia total o parcial, se observarán las reglas siguientes:", "p": ["En caso de insolvencia total o parcial, se observarán las reglas siguientes:", "1º. Tratándose de condenados a reclusión o prisión, la reparación se hará en la forma determinada en el artículo 11;", "2º. Tratándose de condenados a otras penas, el tribunal señalará la parte de sus entradas o emolumentos que deban depositar periódicamente hasta el pago total."], "nt": [], "z": []}, {"pn": [], "n": 38, "l": "34", "s": "No son punibles:", "p": ["No son punibles:", "1º. El que no haya podido en el momento del hecho, ya sea por insuficiencia de sus facultades, por alteraciones morbosas de las mismas o por su estado de inconciencia, error o ignorancia de hecho no imputables, comprender la criminalidad del acto o dirigir sus acciones. En caso de enajenación, el tribunal podrá ordenar la reclusión del agente en un manicomio, del que no saldrá sino por resolución judicial, con audiencia del ministerio público y previo dictamen de peritos que declaren desaparecido el peligro de que el enfermo se dañe a sí mismo o a los demás.", "En los demás casos en que se absolviere a un procesado por las causales del presente inciso, el tribunal ordenará la reclusión del mismo en un establecimiento adecuado hasta que se comprobase la desaparición de las condiciones que le hicieren peligroso;", "2º. El que obrare violentado por fuerza física irresistible o amenazas de sufrir un mal grave e inminente;", "3º. El que causare un mal por evitar otro mayor inminente a que ha sido extraño;", "4º. El que obrare en cumplimiento de un deber o en el legítimo ejercicio de su derecho, autoridad o cargo;", "5º. El que obrare en virtud de obediencia debida;", "6º. El que obrare en defensa propia o de sus derechos, siempre que concurrieren las siguientes circunstancias:", "a) Agresión ilegítima;", "b) Necesidad racional del medio empleado para impedirla o repelerla;", "c) Falta de provocación suficiente por parte del que se defiende.", "Se entenderá que concurren estas circunstancias respecto de aquel que durante la noche rechazare el escalamiento o fractura de los cercados, paredes o entradas de su casa, o departamento habitado o de sus dependencias, cualquiera que sea el daño ocasionado al agresor.", "Igualmente respecto de aquél que encontrare a un extraño dentro de su hogar, siempre que haya resistencia;", "7º. El que obrare en defensa de la persona o derechos de otro, siempre que concurran las circunstancias a) y b) del inciso anterior y caso de haber precedido provocación suficiente por parte del agredido, la de que no haya participado en ella el tercero defensor."], "nt": [], "z": []}, {"pn": [], "n": 39, "l": "35", "s": "El que hubiere excedido los límites impuestos por la Ley, por la autoridad o por la necesidad, será castigado con la pena fijada para el delito por culpa o imprudencia.", "p": ["El que hubiere excedido los límites impuestos por la Ley, por la autoridad o por la necesidad, será castigado con la pena fijada para el delito por culpa o imprudencia."], "nt": [], "z": []}, {"pn": [], "n": 40, "l": "36", "s": "Derogado.", "p": ["Derogado."], "nt": [], "z": []}, {"pn": [], "n": 41, "l": "37", "s": "Derogado.", "p": ["Derogado."], "nt": [], "z": []}, {"pn": [], "n": 42, "l": "38", "s": "Derogado.", "p": ["Derogado."], "nt": [], "z": []}, {"pn": [], "n": 43, "l": "39", "s": "Derogado.", "p": ["Derogado."], "nt": [], "z": []}, {"pn": [], "n": 44, "l": "40", "s": "En las penas divisibles por razón de tiempo o de cantidad, los tribunales fijarán la condenación de acuerdo con las circunstancias atenuantes o agravantes particulares a cada caso y de…", "p": ["En las penas divisibles por razón de tiempo o de cantidad, los tribunales fijarán la condenación de acuerdo con las circunstancias atenuantes o agravantes particulares a cada caso y de conformidad a las reglas del artículo siguiente."], "nt": [], "z": []}, {"pn": [], "n": 45, "l": "41", "s": "A los efectos del artículo anterior, se tendrá en cuenta:", "p": ["A los efectos del artículo anterior, se tendrá en cuenta:", "1º. La naturaleza de la acción y de los medios empleados para ejecutarla y la extensión del daño y del peligro causados;", "2º. La edad, la educación, las costumbres y la conducta precedente del sujeto, la calidad de los motivos que lo determinaron a delinquir, especialmente la miseria o la dificultad de ganarse el sustento propio necesario y el de los suyos, la participación que haya tomado en el hecho, las reincidencias en que hubiera incurrido y los demás antecedentes y condiciones personales, así como los vínculos personales, la calidad de las personas y las circunstancias de tiempo, lugar, modo y ocasión que demuestren su mayor o menor peligrosidad. El juez deberá tomar conocimiento directo y de visu del sujeto, de la víctima y de las circunstancias del hecho en la medida requerida para cada caso."], "nt": [], "z": []}, {"pn": [], "n": 46, "l": "41 bis", "s": "Cuando alguno de los delitos previstos en este Código se cometiera con violencia o intimidación contra las personas mediante el empleo de un arma de fuego la escala penal prevista para…", "p": ["Cuando alguno de los delitos previstos en este Código se cometiera con violencia o intimidación contra las personas mediante el empleo de un arma de fuego la escala penal prevista para el delito de que se trate se elevará en un tercio en su mínimo y en su máximo, sin que ésta pueda exceder el máximo legal de la especie de pena que corresponda. Este agravante no será aplicable cuando la circunstancia mencionada en ella ya se encuentre contemplada como elemento constitutivo o calificante del delito de que se trate."], "nt": ["(Artículo incorporado por art. 1° de la Ley N° 25.297 B.O. 22/9/2000)"], "z": []}, {"pn": [], "n": 47, "l": "41 ter", "s": "Las escalas penales previstas en los artículos 142 bis, 145 bis, 145 ter y 170 de este Código podrán reducirse en un tercio del máximo y en la mitad del mínimo respecto de los partícipes…", "p": ["Las escalas penales previstas en los artículos 142 bis, 145 bis, 145 ter y 170 de este Código podrán reducirse en un tercio del máximo y en la mitad del mínimo respecto de los partícipes o encubridores que, durante la sustanciación del proceso o antes de su iniciación, proporcionen información que permita conocer el lugar donde la víctima se encuentra privada de su libertad, o la identidad de otros partícipes o encubridores del hecho, o cualquier otro dato que posibilite su esclarecimiento.", "En caso de corresponder prisión o reclusión perpetua, podrá aplicarse prisión o reclusión de OCHO (8) a QUINCE (15) años.", "Sólo podrán gozar de este beneficio quienes tengan una responsabilidad penal inferior a la de las personas a quienes identificasen."], "nt": ["(Artículo sustituido por art. 12 de la Ley N° 26.364, B.O. 30/4/2008)"], "z": ["perpetua"]}, {"pn": [], "n": 48, "l": "41 quater", "s": "Cuando alguno de los delitos previstos en este Código sea cometido con la intervención de menores de dieciocho años de edad, la escala penal correspondiente se incrementará en un tercio…", "p": ["Cuando alguno de los delitos previstos en este Código sea cometido con la intervención de menores de dieciocho años de edad, la escala penal correspondiente se incrementará en un tercio del mínimo y del máximo, respecto de los mayores que hubieren participado en el mismo."], "nt": ["(Artículo incorporado por art. 1° de la Ley N° 25.767 B.O. 1/9/2003)"], "z": []}, {"pn": [], "n": 49, "l": "42", "s": "El que con el fin de cometer un delito determinado comienza su ejecución, pero no lo consuma por circunstancias ajenas a su voluntad, sufrirá las penas determinadas en el artículo 44.", "p": ["El que con el fin de cometer un delito determinado comienza su ejecución, pero no lo consuma por circunstancias ajenas a su voluntad, sufrirá las penas determinadas en el artículo 44."], "nt": [], "z": []}, {"pn": [], "n": 50, "l": "43", "s": "El autor de tentativa no estará sujeto a pena cuando desistiere voluntariamente del delito.", "p": ["El autor de tentativa no estará sujeto a pena cuando desistiere voluntariamente del delito."], "nt": [], "z": []}, {"pn": [], "n": 51, "l": "44", "s": "La pena que correspondería al agente, si hubiere consumado el delito, se disminuirá de un tercio a la mitad.", "p": ["La pena que correspondería al agente, si hubiere consumado el delito, se disminuirá de un tercio a la mitad.", "Si la pena fuere de reclusión perpetua, la pena de la tentativa será reclusión de quince a veinte años. Si la pena fuese de prisión perpetua, la de tentativa será prisión de diez a quince años.", "Si el delito fuera imposible, la pena se disminuirá en la mitad y podrá reducírsela al mínimo legal o eximirse de ella, según el grado de peligrosidad revelada por el delincuente."], "nt": [], "z": ["15–20 años", "10–15 años", "perpetua"]}, {"pn": [], "n": 52, "l": "45", "s": "Los que tomasen parte en la ejecución del hecho o prestasen al autor o autores un auxilio o cooperación sin los cuales no habría podido cometerse, tendrán la pena establecida para el delito.", "p": ["Los que tomasen parte en la ejecución del hecho o prestasen al autor o autores un auxilio o cooperación sin los cuales no habría podido cometerse, tendrán la pena establecida para el delito. En la misma pena incurrirán los que hubiesen determinado directamente a otro a cometerlo."], "nt": [], "z": []}, {"pn": [], "n": 53, "l": "46", "s": "Los que cooperen de cualquier otro modo a la ejecución del hecho y los que presten una ayuda posterior cumpliendo promesas anteriores al mismo, serán reprimidos con la pena…", "p": ["Los que cooperen de cualquier otro modo a la ejecución del hecho y los que presten una ayuda posterior cumpliendo promesas anteriores al mismo, serán reprimidos con la pena correspondiente al delito, disminuida de un tercio a la mitad. Si la pena fuere de reclusión perpetua, se aplicará reclusión de quince a veinte años y si fuere de prisión perpetua, se aplicará prisión de diez a quince años."], "nt": [], "z": ["15–20 años", "10–15 años", "perpetua"]}, {"pn": [], "n": 54, "l": "47", "s": "Si de las circunstancias particulares de la causa resultare que el acusado de complicidad no quiso cooperar sino en un hecho menos grave que el cometido por el autor, la pena será…", "p": ["Si de las circunstancias particulares de la causa resultare que el acusado de complicidad no quiso cooperar sino en un hecho menos grave que el cometido por el autor, la pena será aplicada al cómplice solamente en razón del hecho que prometió ejecutar. Si el hecho no se consumase, la pena del cómplice se determinará conforme a los preceptos de este artículo y a los del título de la tentativa."], "nt": [], "z": []}, {"pn": [], "n": 55, "l": "48", "s": "Las relaciones, circunstancias y calidades personales, cuyo efecto sea disminuir o excluir la penalidad, no tendrán influencia sino respecto al autor o cómplice a quienes correspondan.", "p": ["Las relaciones, circunstancias y calidades personales, cuyo efecto sea disminuir o excluir la penalidad, no tendrán influencia sino respecto al autor o cómplice a quienes correspondan. Tampoco tendrán influencia aquéllas cuyo efecto sea agravar la penalidad, salvo el caso en que fueren conocidas por el partícipe."], "nt": [], "z": []}, {"pn": [], "n": 56, "l": "49", "s": "No se considerarán partícipes de los delitos cometidos por la prensa a las personas que solamente prestaren al autor del escrito o grabado la cooperación material necesaria para su…", "p": ["No se considerarán partícipes de los delitos cometidos por la prensa a las personas que solamente prestaren al autor del escrito o grabado la cooperación material necesaria para su publicación, difusión o venta."], "nt": [], "z": []}, {"pn": [], "n": 57, "l": "50", "s": "Habrá reincidencia siempre que quien hubiera cumplido, total o parcialmente, pena privativa de libertad impuesta por un tribunal del país cometiere un nuevo delito punible también con…", "p": ["Habrá reincidencia siempre que quien hubiera cumplido, total o parcialmente, pena privativa de libertad impuesta por un tribunal del país cometiere un nuevo delito punible también con esa clase de pena.", "La condena sufrida en el extranjero se tendrá en cuenta para la reincidencia si ha sido pronunciada por razón de un delito que pueda, según la ley argentina, dar lugar a extradición. No dará lugar a reincidencia la pena cumplida por delitos políticos, los previstos exclusivamente en el Código de Justicia Militar, los amnistiados o los cometidos por menores de dieciocho años de edad. La pena sufrida no se tendrá en cuenta a los efectos de la reincidencia cuando desde su cumplimiento hubiera transcurrido un término igual a aquél por la que fuera impuesta, que nunca excederá de diez ni será inferior a cinco años."], "nt": [], "z": []}, {"pn": [], "n": 58, "l": "51", "s": "Todo ente oficial que lleve registros penales se abstendrá de informar sobre datos de un proceso terminado por sobreseimiento o sentencia absolutoria.", "p": ["Todo ente oficial que lleve registros penales se abstendrá de informar sobre datos de un proceso terminado por sobreseimiento o sentencia absolutoria. En ningún caso se informará la existencia de detenciones que no provengan de la formación de causa, salvo que los informes se requieran para resolver un hábeas corpus o en causas por delitos de que haya sido víctima el detenido.", "El registro de las sentencias condenatorias caducará a todos sus efectos:", "1. Después de transcurridos diez años desde la sentencia (art. 27) para las condenas condicionales;", "2. Después de transcurridos diez años desde su extinción para las demás condenas a penas privativas de la libertad;", "3. Después de transcurridos cinco años desde su extinción para las condenas a pena de multa o inhabilitación.", "En todos los casos se deberá brindar la información cuando mediare expreso consentimiento del interesado. Asimismo, los jueces podrán requerir la información, excepcionalmente, por resolución que sólo podrá fundarse en la necesidad concreta del antecedente como elemento de prueba de los hechos en un proceso judicial.", "Los tribunales deberán comunicar a los organismos de registro la fecha de caducidad: 1. Cuando se extingan las penas perpetuas;", "2. Cuando se lleve a cabo el cómputo de las penas temporales, sean condicionales o de cumplimiento efectivo;", "3. Cuando se cumpla totalmente la pena de multa o, en caso de su sustitución por prisión (art. 21, párr. 2º), al efectuar el cómputo de la prisión impuesta;", "4. Cuando declaren la extinción de las penas en los casos previstos por los artículos 65, 68 y 69.", "La violación de la prohibición de informar será considerada como violación de secreto en los términos del artículo 157, si el hecho no constituyere un delito más severamente penado."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 59, "l": "52", "s": "Se impondrá reclusión por tiempo indeterminado como accesoria de la última condena, cuando la reincidencia fuere múltiple en forma tal que mediaren las siguientes penas anteriores:", "p": ["Se impondrá reclusión por tiempo indeterminado como accesoria de la última condena, cuando la reincidencia fuere múltiple en forma tal que mediaren las siguientes penas anteriores:", "1. Cuatro penas privativas de libertad, siendo una de ellas mayor de tres años;", "2. Cinco penas privativas de libertad, de tres años o menores.", "Los tribunales podrán, por una única vez, dejar en suspenso la aplicación de esta medida accesoria, fundando expresamente su decisión en la forma prevista en el artículo 26."], "nt": [], "z": []}, {"pn": [], "n": 60, "l": "53", "s": "En los casos del artículo anterior, transcurridos cinco años del cumplimiento de la reclusión accesoria, el tribunal que hubiera dictado la última condena o impuesto la pena única estará…", "p": ["En los casos del artículo anterior, transcurridos cinco años del cumplimiento de la reclusión accesoria, el tribunal que hubiera dictado la última condena o impuesto la pena única estará facultado para otorgarle la libertad condicional, previo informe de la autoridad penitenciaria, en las condiciones compromisorias previstas en el artículo 13, y siempre que el condenado hubiera mantenido buena conducta, demostrando aptitud y hábito para el trabajo, y demás actitudes que permitan suponer verosímilmente que no constituirá un peligro para la sociedad. Transcurridos cinco años de obtenida la libertad condicional el condenado podrá solicitar su libertad definitiva al tribunal que la concedió, el que decidirá según sea el resultado obtenido en el período de prueba y previo informe del patronato, institución o persona digna de confianza, a cuyo cargo haya estado el control de la actividad del liberado. Los condenados con la reclusión accesoria por tiempo indeterminado deberán cumplirla en establecimientos federales.", "La violación por parte del liberado de cualquiera de las condiciones establecidas en el artículo 13 podrá determinar la revocatoria del beneficio acordado y su reintegro al régimen carcelario anterior. Después de transcurridos cinco años de su reintegro al régimen carcelario podrá en los casos de los incisos 1º, 2º, 3º y 5º del artículo 13, solicitar nuevamente su libertad condicional."], "nt": [], "z": []}, {"pn": [], "n": 61, "l": "54", "s": "Cuando un hecho cayere bajo más de una sanción penal, se aplicará solamente la que fijare pena mayor.", "p": ["Cuando un hecho cayere bajo más de una sanción penal, se aplicará solamente la que fijare pena mayor."], "nt": [], "z": []}, {"pn": [], "n": 62, "l": "55", "s": "Cuando concurrieren varios hechos independientes reprimidos con una misma especie de pena, la pena aplicable al reo tendrá como mínimo, el mínimo mayor y como máximo, la suma aritmética…", "p": ["Cuando concurrieren varios hechos independientes reprimidos con una misma especie de pena, la pena aplicable al reo tendrá como mínimo, el mínimo mayor y como máximo, la suma aritmética de las penas máximas correspondientes a los diversos hechos.", "Sin embargo, esta suma no podrá exceder de (50) cincuenta años de reclusión o prisión."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 25.928 B.O. 10/9/2004)"], "z": []}, {"pn": [], "n": 63, "l": "56", "s": "Cuando concurrieren varios hechos independientes reprimidos con penas divisibles de reclusión o prisión se aplicará la pena más grave, teniendo en cuenta los delitos de pena menor.", "p": ["Cuando concurrieren varios hechos independientes reprimidos con penas divisibles de reclusión o prisión se aplicará la pena más grave, teniendo en cuenta los delitos de pena menor.", "Si alguna de las penas no fuere divisible, se aplicará ésta únicamente, salvo el caso en que concurrieren la de prisión perpetua y la de reclusión temporal, en que se aplicará reclusión perpetua. La inhabilitación y la multa se aplicarán siempre, sin sujeción a lo dispuesto en el párrafo primero."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 64, "l": "57", "s": "A los efectos del artículo anterior, la gravedad relativa de las penas de diferente naturaleza se determinará por el orden en que se hallan enumeradas en el artículo", "p": ["A los efectos del artículo anterior, la gravedad relativa de las penas de diferente naturaleza se determinará por el orden en que se hallan enumeradas en el artículo", "5º."], "nt": [], "z": []}, {"pn": [], "n": 65, "l": "58", "s": "Las reglas precedentes se aplicarán también en el caso en que después de una condena pronunciada por sentencia firme se deba juzgar a la misma persona que esté cumpliendo pena por otro…", "p": ["Las reglas precedentes se aplicarán también en el caso en que después de una condena pronunciada por sentencia firme se deba juzgar a la misma persona que esté cumpliendo pena por otro hecho distinto; o cuando se hubieren dictado dos o más sentencias firmes con violación de dichas reglas. Corresponderá al juez que haya aplicado la pena mayor dictar, a pedido de parte, su única sentencia, sin alterar las declaraciones de hechos contenidas en las otras.", "Cuando por cualquier causa la justicia federal, en autos en que ella haya intervenido, no pueda aplicar esta regla, lo hará la justicia ordinaria nacional o provincial que conoció de la infracción penal, según sea el caso."], "nt": [], "z": []}, {"pn": [], "n": 66, "l": "59", "s": "La acción penal se extinguirá:", "p": ["La acción penal se extinguirá:", "1º. Por la muerte del imputado.", "2º. Por la amnistía.", "3º. Por la prescripción.", "4º. Por la renuncia del agraviado, respecto de los delitos de acción privada."], "nt": [], "z": []}, {"pn": [], "n": 67, "l": "60", "s": "La renuncia de la persona ofendida al ejercicio de la acción penal sólo perjudicará al renunciante y a sus herederos.", "p": ["La renuncia de la persona ofendida al ejercicio de la acción penal sólo perjudicará al renunciante y a sus herederos."], "nt": [], "z": []}, {"pn": [], "n": 68, "l": "61", "s": "La amnistía extinguirá la acción penal y hará cesar la condena y todos sus efectos, con excepción de las indemnizaciones debidas a particulares.", "p": ["La amnistía extinguirá la acción penal y hará cesar la condena y todos sus efectos, con excepción de las indemnizaciones debidas a particulares."], "nt": [], "z": []}, {"pn": [], "n": 69, "l": "62", "s": "La acción penal se prescribirá durante el tiempo fijado a continuación:", "p": ["La acción penal se prescribirá durante el tiempo fijado a continuación:", "1º. A los quince años, cuando se tratare de delitos cuya pena fuere la de reclusión o prisión perpetua;", "2º. Después de transcurrido el máximo de duración de la pena señalada para el delito, si se tratare de hechos reprimidos con reclusión o prisión, no pudiendo, en ningún caso, el término de la prescripción exceder de doce años ni bajar de dos años;", "3º. A los cinco años, cuando se tratare de un hecho reprimido únicamente con inhabilitación perpetua;", "4º. Al año, cuando se tratare de un hecho reprimido únicamente con inhabilitación temporal;", "5º. A los dos años, cuando se tratare de hechos reprimidos con multa."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 70, "l": "63", "s": "La prescripción de la acción empezará a correr desde la medianoche del día en que se cometió el delito o, si éste fuese continuo, en que cesó de cometerse.", "p": ["La prescripción de la acción empezará a correr desde la medianoche del día en que se cometió el delito o, si éste fuese continuo, en que cesó de cometerse."], "nt": [], "z": []}, {"pn": [], "n": 71, "l": "64", "s": "La acción penal por delito reprimido con multa se extinguirá en cualquier estado de la instrucción y mientras no se haya iniciado el juicio, por el pago voluntario del mínimo de la multa…", "p": ["La acción penal por delito reprimido con multa se extinguirá en cualquier estado de la instrucción y mientras no se haya iniciado el juicio, por el pago voluntario del mínimo de la multa correspondiente y la reparación de los daños causados por el delito. Si se hubiese iniciado el juicio deberá pagarse el máximo de la multa correspondiente, además de repararse los daños causados por el delito.", "En ambos casos el imputado deberá abandonar en favor del estado, los objetos que presumiblemente resultarían decomisados en caso que recayera condena.", "El modo de extinción de la acción penal previsto en este artículo podrá ser admitido por segunda vez si el nuevo delito ha sido cometido después de haber transcurrido ocho años a partir de la fecha de la resolución que hubiese declarado la extinción de la acción penal en la causa anterior."], "nt": ["(Artículo sustituido por art. 6° de la Ley Nº 24.316 B.O. 19/5/1994)"], "z": []}, {"pn": [], "n": 72, "l": "65", "s": "Las penas se prescriben en los términos siguientes:", "p": ["Las penas se prescriben en los términos siguientes:", "1º. La de reclusión perpetua, a los veinte años;", "2º. La de prisión perpetua, a los veinte años;", "3º. La de reclusión o prisión temporal, en un tiempo igual al de la condena;", "4º. La de multa, a los dos años."], "nt": [], "z": ["perpetua"]}, {"pn": [], "n": 73, "l": "66", "s": "La prescripción de la pena empezará a correr desde la medianoche del día en que se notificare al reo la sentencia firme o desde el quebrantamiento de la condena, si ésta hubiese empezado…", "p": ["La prescripción de la pena empezará a correr desde la medianoche del día en que se notificare al reo la sentencia firme o desde el quebrantamiento de la condena, si ésta hubiese empezado a cumplirse."], "nt": [], "z": []}, {"pn": [], "n": 74, "l": "67", "s": "La prescripción se suspende en los casos de los delitos para cuyo juzgamiento sea necesaria la resolución de cuestiones previas o prejudiciales, que deban ser resueltas en otro juicio.", "p": ["La prescripción se suspende en los casos de los delitos para cuyo juzgamiento sea necesaria la resolución de cuestiones previas o prejudiciales, que deban ser resueltas en otro juicio. Terminada la causa de la suspensión, la prescripción sigue su curso. La prescripción también se suspende en los casos de delitos cometidos en el ejercicio de la función pública, para todos los que hubiesen participado, mientras cualquiera de ellos se encuentre desempeñando un cargo público.", "El curso de la prescripción de la acción penal correspondiente a los delitos previstos en los artículos 226 y 227 bis, se suspenderá hasta el restablecimiento del orden constitucional. La prescripción se interrumpe solamente por:", "a) La comisión de otro delito;", "b) El primer llamado efectuado a una persona, en el marco de un proceso judicial, con el objeto de recibirle declaración indagatoria por el delito investigado;", "c) El requerimiento acusatorio de apertura o elevación a juicio, efectuado en la forma que lo establezca la legislación procesal correspondiente;", "d) El auto de citación a juicio o acto procesal equivalente; y", "e) El dictado de sentencia condenatoria, aunque la misma no se encuentre firme. (Párrafo sustituido por art. 1° de la Ley N° 25.990 B.O. 11/1/2005).", "La prescripción corre, se suspende o se interrumpe separadamente para cada delito y para cada uno de sus partícipes, con la excepción prevista en el segundo párrafo de este artículo."], "nt": ["(Párrafo sustituido por art. 1° de la Ley N° 25.990 B.O. 11/1/2005).", "(Artículo sustituido por art. 29 de la Ley N° 25.188 B.O. 1/11/1999. Vigencia: a partir de los ocho días desde su publicación.)"], "z": []}, {"pn": [], "n": 75, "l": "68", "s": "El indulto del reo extinguirá la pena y sus efectos, con excepción de las indemnizaciones debidas a particulares.", "p": ["El indulto del reo extinguirá la pena y sus efectos, con excepción de las indemnizaciones debidas a particulares."], "nt": [], "z": []}, {"pn": [], "n": 76, "l": "69", "s": "El perdón de la parte ofendida extinguirá la pena impuesta por delito de los enumerados en el artículo 73.", "p": ["El perdón de la parte ofendida extinguirá la pena impuesta por delito de los enumerados en el artículo 73.", "Si hubiere varios partícipes, el perdón en favor de uno de ellos aprovechará a los demás."], "nt": [], "z": []}, {"pn": [], "n": 77, "l": "70", "s": "Las indemnizaciones pecuniarias inherentes a las penas, podrán hacerse efectivas sobre los bienes propios del condenado, aun después de muerto.", "p": ["Las indemnizaciones pecuniarias inherentes a las penas, podrán hacerse efectivas sobre los bienes propios del condenado, aun después de muerto."], "nt": [], "z": []}, {"pn": [], "n": 78, "l": "71", "s": "Deberán iniciarse de oficio todas las acciones penales, con excepción de las siguientes:", "p": ["Deberán iniciarse de oficio todas las acciones penales, con excepción de las siguientes:", "1º. Las que dependieren de instancia privada;", "2º. Las acciones privadas."], "nt": [], "z": []}, {"pn": [], "n": 79, "l": "72", "s": "Son acciones dependientes de instancia privada las que nacen de los siguientes delitos:", "p": ["Son acciones dependientes de instancia privada las que nacen de los siguientes delitos:", "1º) Los previstos en los artículos 119, 120 y 130 del Código Penal cuando no resultare la muerte de la persona ofendida o lesiones de las mencionadas en el artículo 91.", "2º) Lesiones leves, sean dolosas o culposas.", "Sin embargo, en los casos de este inciso se procederá de oficio cuando mediaren razones de seguridad o interés público.", "3º) Impedimento de contacto de los hijos menores con sus padres no convivientes. En los casos de este artículo, no se procederá a formar causa sino por acusación o denuncia del agraviado, de su tutor, guardador o representantes legales. Sin embargo, se procederá de oficio cuando el delito fuere cometido contra un menor que no tenga padres, tutor ni guardador, o que lo fuere por uno de sus ascendientes, tutor o guardador.", "Cuando existieren intereses gravemente contrapuestos entre algunos de éstos y el menor, el Fiscal podrá actuar de oficio cuando así resultare más conveniente para el interés superior de aquél."], "nt": ["(Artículo sustituido por art. 14 de la Ley N° 25.087 B.O. 14/5/1999)"], "z": []}, {"pn": [], "n": 80, "l": "73", "s": "Son acciones privadas las que nacen de los siguientes delitos:", "p": ["Son acciones privadas las que nacen de los siguientes delitos:", "1. Calumnias e injurias;", "2. Violación de secretos, salvo en los casos de los artículos 154 y 157;", "3. Concurrencia desleal, prevista en el artículo 159;", "4. Incumplimiento de los deberes de asistencia familiar, cuando la víctima fuere el cónyuge."], "nt": ["(Artículo sustituido por art. 1° de la Ley N°24.453 B.O. 7/3/1995)"], "z": []}, {"pn": [], "n": 81, "l": "74", "s": "—", "p": ["—"], "nt": ["(Artículo derogado por art. 2° de la Ley N°24.453 B.O. 7/3/1995)"], "z": []}, {"pn": [], "n": 82, "l": "75", "s": "La acción por calumnia o injuria podrá ser ejercitada sólo por el ofendido y después de su muerte por el cónyuge, hijos, nietos o padres sobrevivientes.", "p": ["La acción por calumnia o injuria podrá ser ejercitada sólo por el ofendido y después de su muerte por el cónyuge, hijos, nietos o padres sobrevivientes."], "nt": [], "z": []}, {"pn": [], "n": 83, "l": "76", "s": "En los demás casos del artículo 73, se procederá únicamente por querella o denuncia del agraviado o de sus guardadores o representantes legales.", "p": ["En los demás casos del artículo 73, se procederá únicamente por querella o denuncia del agraviado o de sus guardadores o representantes legales.", "De la suspensión del juicio a prueba"], "nt": ["(Título incorporado por art. 3° de la Ley N°24.316 B.O. 19/5/1994)"], "z": []}, {"pn": [], "n": 84, "l": "76 bis", "s": "El imputado de un delito de acción pública reprimido con pena de reclusión o prisión cuyo máximo no exceda de tres años, podrá solicitar la suspensión del juicio a prueba.", "p": ["El imputado de un delito de acción pública reprimido con pena de reclusión o prisión cuyo máximo no exceda de tres años, podrá solicitar la suspensión del juicio a prueba.", "En casos de concurso de delitos, el imputado también podrá solicitar la suspensión del juicio a prueba si el máximo de la pena de reclusión o prisión aplicable no excediese de tres años. Al presentar la solicitud, el imputado deberá ofrecer hacerse cargo de la reparación del daño en la medida de lo posible, sin que ello implique confesión ni reconcimiento de la responsabilidad civil correspondiente. El juez decidirá sobre la razonabilidad del ofrecimiento en resolución fundada. La parte damnificada podrá aceptar o no la reparación ofrecida, y en este último caso, si la realización del juicio se suspendiere, tendrá habilitada la acción civil correspondiente.", "Si las circunstancias del caso permitieran dejar en suspenso el cumplimiento de la condena aplicable, y hubiese consentimiento del fiscal, el Tribunal podrá suspender la realización del juicio.", "Si el delito o alguno de los delitos que integran el concurso estuviera reprimido con pena de multa aplicable en forma conjunta o alternativa con la de prisión, será condición, además, que se pague el mínimo de la multa correspondiente.", "El imputado deberá abandonar en favor del estado, los bienes que presumiblemente resultarían decomisados en caso que recayera condena.", "No procederá la suspensión del juicio cuando un funcionario público, en el ejercicio de sus funciones, hubiese participado en el delito.", "Tampoco procederá la suspensión del juicio a prueba respecto de los delitos reprimidos con pena de inhabilitación."], "nt": ["(Artículo incorporado por art. 3° de la Ley N° 24.316 B.O. 19/5/1994)"], "z": []}, {"pn": [], "n": 85, "l": "76 ter", "s": "El tiempo de la suspensión del juicio será fijado por el Tribunal entre uno y tres años, según la gravedad del delito.", "p": ["El tiempo de la suspensión del juicio será fijado por el Tribunal entre uno y tres años, según la gravedad del delito.", "El Tribunal establecerá las reglas de conducta que deberá cumplir el imputado, conforme las previsiones del artículo 27 Bis.", "Durante ese tiempo se suspenderá la prescripción de la acción penal.", "La suspensión del juicio será dejada sin efecto si con posterioridad se conocieran circunstancias que modifiquen el máximo de la pena aplicable o la estimación acerca de la condicionalidad de la ejecución de la posible condena.", "Si durante el tiempo fijado por el Tribunal el imputado no comete un delito, repara los daños en la medida ofrecida y cumple con las reglas de conducta establecidas, se extinguirá la acción penal. En caso contrario, se llevará a cabo el juicio y si el imputado fuere absuelto se le devolverán los bienes abandonados en favor del estado y la multa pagada, pero no podrá pretender el reintegro de las reparaciones cumplidas.", "La suspensión de un juicio a prueba podrá ser concedida por segunda vez si el nuevo delito ha sido cometido después de haber transcurrido ocho años a partir de la fecha de expiración del plazo por el cual hubiera sido suspendido el juicio en el proceso anterior.", "No se admitirá una nueva suspensión de juicio respecto de quien hubiese incumplido las reglas impuestas en una suspensión anterior."], "nt": ["(Artículo incorporado por art. 4° de la Ley N° 24.316 B.O. 19/5/1994)"], "z": []}, {"pn": [], "n": 86, "l": "76 quater", "s": "La suspensión del juicio a prueba hará inaplicables al caso las reglas de prejudicialidad de los artículos 1101 y 1102 del Código Civil, y no obstará a la aplicación de las sanciones…", "p": ["La suspensión del juicio a prueba hará inaplicables al caso las reglas de prejudicialidad de los artículos 1101 y 1102 del Código Civil, y no obstará a la aplicación de las sanciones contravencionales, disciplinarias o administrativas que pudieran corresponder."], "nt": ["(Artículo incorporado por art. 5° de la Ley N° 24.316 B.O. 19/5/1994)", "(Numeración del capítulo sustituida por art. 2° de la Ley N° 24.316 B.O. 19/5/1994)"], "z": []}, {"pn": [], "n": 87, "l": "77", "s": "Para la inteligencia del texto de este código, se tendrá presente las siguientes reglas:", "p": ["Para la inteligencia del texto de este código, se tendrá presente las siguientes reglas:", "Los plazos a que este código se refiere serán contados con arreglo a las disposiciones del Código Civil. Sin embargo, la liberación de los condenados a penas privativas de libertad se efectuará al mediodía del día correspondiente.", "La expresión \"reglamentos\" u \"ordenanzas\", comprende todas las disposiciones de carácter general dictadas por la autoridad competente en la materia de que traten.", "Por los términos \"funcionario público\" y \"empleado público\", usados en este código, se designa a todo el que participa accidental o permanentemente del ejercicio de funciones públicas, sea por elección popular o por nombramiento de autoridad competente.", "Por el término militar se designa a toda persona que revista estado militar en el momento del hecho conforme la ley orgánica para el personal militar. Los funcionarios públicos civiles que integran la cadena de mando se encuentran asimilados al personal militar con relación a los delitos que cometan en su carácter de tales, cuando produzcan actos o impartan órdenes o instrucciones como integrantes de la cadena de mando si las mismas implican comisión de delito o participación en el mismo. (Párrafo incorporado por art. 1° del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación)", "Con la palabra \"mercadería\", se designa toda clase de efectos susceptibles de expendio. El término \"capitán\", comprende a todo comandante de embarcación o al que le sustituye. El término \"tripulación\", comprende a todos los que se hallan a bordo como oficiales o marineros.", "El término \"estupefacientes\", comprende los estupefacientes, psicotrópicos y demás substancias susceptibles de producir dependencia física o psíquica, que se incluyan en las listas que se elaboren y actualicen periódicamente por decreto del Poder Ejecutivo Nacional.", "El término \"establecimiento rural\" comprende todo inmueble que se destine a la cría, mejora o engorde del ganado, actividades de tambo, granja o cultivo de la tierra, a la avicultura u otras crianzas, fomento o aprovechamiento semejante. (Párrafo incorporado por art. 1° de la Ley N° El término \"documento\" comprende toda representación de actos o hechos, con independencia del soporte utilizado para su fijación, almacenamiento, archivo o transmisión. (Párrafo incorporado por art. 1° de la Ley N° 26.388, B.O. 25/6/2008)", "Los términos \"firma\" y \"suscripción\" comprenden la firma digital, la creación de una firma digital o firmar digitalmente. (Párrafo incorporado por art. 1° de la Ley N° 26.388, B.O. 25/6/2008)", "Los términos \"instrumento privado\" y \"certificado\" comprenden el documento digital firmado digitalmente. (Párrafo incorporado por art. 1° de la Ley N° 26.388, B.O. 25/6/2008)"], "nt": ["(Párrafo sustituido por art. 40 de la Ley N° 23.737 B.O.11/10/1989)"], "z": []}, {"pn": [], "n": 88, "l": "78", "s": "Queda comprendido en el concepto de \"violencia\", el uso de medios hipnóticos o narcóticos.", "p": ["Queda comprendido en el concepto de \"violencia\", el uso de medios hipnóticos o narcóticos."], "nt": [], "z": []}, {"pn": [], "n": 89, "l": "78 bis", "s": "—", "p": ["—"], "nt": ["(Artículo derogado por art. 14 de la Ley N° 26.388, B.O. 25/6/2008)"], "z": []}, {"pn": [{"t": "PR", "a": 96, "b": 300, "c": "Se aplicará reclusión o prisión de ocho a veinticinco años, al que matare a otro siempre que en este código no se estableciere o…"}], "n": 90, "l": "79", "s": "Se aplicará reclusión o prisión de ocho a veinticinco años, al que matare a otro siempre que en este código no se estableciere otra pena.", "p": ["Se aplicará reclusión o prisión de ocho a veinticinco años, al que matare a otro siempre que en este código no se estableciere otra pena."], "nt": [], "z": ["8–25 años"]}, {"pn": [{"t": "PR", "a": 96, "b": 300, "c": "…ancias extraordinarias de atenuación, el juez podrá aplicar prisión o reclusión de ocho a veinticinco años."}, {"t": "PR", "p": 1, "c": "Se impondrá reclusión perpetua o prisión perpetua, pudiendo aplicarse lo dispuesto en el artículo 52, al que matare: 1º…"}], "n": 91, "l": "80", "s": "Se impondrá reclusión perpetua o prisión perpetua, pudiendo aplicarse lo dispuesto en el artículo 52, al que matare:", "p": ["Se impondrá reclusión perpetua o prisión perpetua, pudiendo aplicarse lo dispuesto en el artículo 52, al que matare:", "1º A su ascendiente, descendiente o cónyuge, sabiendo que lo son.", "2º Con ensañamiento, alevosía, veneno u otro procedimiento insidioso.", "3º Por precio o promesa remuneratoria.", "4º Por placer, codicia, odio racial o religioso.", "5º Por un medio idóneo para crear un peligro común.", "6º Con el concurso premeditado de dos o más personas.", "7º Para preparar, facilitar, consumar u ocultar otro delito o para asegurar sus resultados o procurar la impunidad para sí o para otro o por no haber logrado el fin propuesto al intentar otro delito.", "8° A un miembro de las fuerzas de seguridad pública, policiales o penitenciarias, por su función, cargo o condición. (Inciso incorporado por art. 1° de la Ley N° 25.601", "9° Abusando de su función o cargo, cuando fuere miembro integrante de las fuerzas de seguridad, policiales o del servicio penitenciario. (Inciso incorporado por art. 1° de la Ley N° 10 A su superior militar frente a enemigo o tropa formada con armas. (Inciso incorporado por art. 2° del Anexo I de la Ley N° 26.394 B.O. 29/8/2008. Vigencia: comenzará a regir a los SEIS (6) meses de su promulgación. Durante dicho período se llevará a cabo en las áreas pertinentes un programa de divulgación y capacitación sobre su contenido y aplicación) Cuando en el caso del inciso primero de este artículo, mediaren circunstancias extraordinarias de atenuación, el juez podrá aplicar prisión o reclusión de ocho a veinticinco años."], "nt": [], "z": ["8–25 años", "perpetua"]}, {"pn": [{"t": "R", "a": 36, "b": 72, "c": "1º Se impondrá reclusión de tres a seis años, o prisión de uno a tres años: a) Al que matare a otro, encontrándose…"}, {"t": "P", "a": 12, "b": 36, "c": "1º Se impondrá reclusión de tres a seis años, o prisión de uno a tres años: a) Al que matare a otro, encontrándose en un estado de emoción viole…"}], "n": 92, "l": "81", "s": "1º Se impondrá reclusión de tres a seis años, o prisión de uno a tres años:", "p": ["1º Se impondrá reclusión de tres a seis años, o prisión de uno a tres años:", "a) Al que matare a otro, encontrándose en un estado de emoción violenta y que las circunstancias hicieren excusable.", "b) Al que, con el propósito de causar un daño en el cuerpo o en la salud, produjere la muerte de alguna persona, cuando el medio empleado no debía razonablemente ocasionar la muerte.", "2º (Inciso derogado por art. 1° de la Ley N° 24.410 B.O. 2/1/1995)"], "nt": [], "z": ["3–6 años", "1–3 años"]}, {"pn": [{"t": "PR", "a": 120, "b": 300, "c": "…ancias del inciso 1º del artículo anterior, la pena será de reclusión o prisión de diez a veinticinco años."}], "n": 93, "l": "82", "s": "Cuando en el caso del inciso 1º del artículo 80 concurriese alguna de las circunstancias del inciso 1º del artículo anterior, la pena será de reclusión o prisión de diez a veinticinco años.", "p": ["Cuando en el caso del inciso 1º del artículo 80 concurriese alguna de las circunstancias del inciso 1º del artículo anterior, la pena será de reclusión o prisión de diez a veinticinco años."], "nt": [], "z": ["10–25 años"]}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "Será reprimido con prisión de uno a cuatro años, el que instigare a otro al suicidio o le ayudare a cometerlo, si el…"}], "n": 94, "l": "83", "s": "Será reprimido con prisión de uno a cuatro años, el que instigare a otro al suicidio o le ayudare a cometerlo, si el suicidio se hubiese tentado o consumado.", "p": ["Será reprimido con prisión de uno a cuatro años, el que instigare a otro al suicidio o le ayudare a cometerlo, si el suicidio se hubiese tentado o consumado."], "nt": [], "z": ["1–4 años"]}, {"pn": [{"t": "P", "a": 6, "b": 60, "c": "Será reprimido con prisión de seis meses a cinco años e inhabilitación especial, en su caso, por cinco a diez años el que p…"}], "n": 95, "l": "84", "s": "Será reprimido con prisión de seis meses a cinco años e inhabilitación especial, en su caso, por cinco a diez años el que por imprudencia, negligencia, impericia en su arte o profesión o…", "p": ["Será reprimido con prisión de seis meses a cinco años e inhabilitación especial, en su caso, por cinco a diez años el que por imprudencia, negligencia, impericia en su arte o profesión o inobservancia de los reglamentos o de los deberes a su cargo, causare a otro la muerte.", "El mínimo de la pena se elevará a dos años si fueren más de una las víctimas fatales, o si el hecho hubiese sido ocasionado por la conducción imprudente, negligente, inexperta, o antirreglamentaria de un vehículo automotor."], "nt": ["(Artículo sustituido por art. 1° de la Ley N° 25.189 28/10/1999)"], "z": ["6 meses–5 años"]}, {"pn": [{"t": "PR", "a": 36, "b": 120, "c": "El que causare un aborto será reprimido: 1º Con reclusión o prisión de tres a diez años, si obrare sin consentimiento de la mujer. Esta pena podrá elevarse h…"}, {"t": "PR", "a": 12, "b": 48, "c": "…si el hecho fuere seguido de la muerte de la mujer. 2º Con reclusión o prisión de uno a cuatro años, si obrare con consentimiento de la mujer. El máximum de la pena se e…"}], "n": 96, "l": "85", "s": "El que causare un aborto será reprimido:", "p": ["El que causare un aborto será reprimido:", "1º Con reclusión o prisión de tres a diez años, si obrare sin consentimiento de la mujer. Esta pena podrá elevarse hasta quince años, si el hecho fuere seguido de la muerte de la mujer.", "2º Con reclusión o prisión de uno a cuatro años, si obrare con consentimiento de la mujer. El máximum de la pena se elevará a seis años, si el hecho fuere seguido de la muerte de la mujer."], "nt": [], "z": ["3–10 años", "1–4 años"]}, {"pn": [], "n": 97, "l": "86", "s": "Incurrirán en las penas establecidas en el artículo anterior y sufrirán, además, inhabilitación especial por doble tiempo que el de la condena, los médicos, cirujanos, parteras o…", "p": ["Incurrirán en las penas establecidas en el artículo anterior y sufrirán, además, inhabilitación especial por doble tiempo que el de la condena, los médicos, cirujanos, parteras o farmacéuticos que abusaren de su ciencia o arte para causar el aborto o cooperaren a causarlo.", "El aborto practicado por un médico diplomado con el consentimiento de la mujer encinta, no es punible:", "1º Si se ha hecho con el fin de evitar un peligro para la vida o la salud de la madre y si este peligro no puede ser evitado por otros medios.", "2º Si el embarazo proviene de una violación o de un atentado al pudor cometido sobre una mujer idiota o demente. En este caso, el consentimiento de su representante legal deberá ser requerido para el aborto."], "nt": [], "z": []}, {"pn": [{"t": "P", "a": 6, "b": 24, "c": "Será reprimido con prisión de seis meses a dos años, el que con violencia causare un aborto sin haber tenido el propósito…"}], "n": 98, "l": "87", "s": "Será reprimido con prisión de seis meses a dos años, el que con violencia causare un aborto sin haber tenido el propósito de causarlo, si el estado de embarazo de la paciente fuere…", "p": ["Será reprimido con prisión de seis meses a dos años, el que con violencia causare un aborto sin haber tenido el propósito de causarlo, si el estado de embarazo de la paciente fuere notorio o le constare."], "nt": [], "z": ["6 meses–2 años"]}, {"pn": [{"t": "P", "a": 12, "b": 48, "c": "Será reprimida con prisión de uno a cuatro años, la mujer que causare su propio aborto o consintiere en que otro se l…"}], "n": 99, "l": "88", "s": "Será reprimida con prisión de uno a cuatro años, la mujer que causare su propio aborto o consintiere en que otro se lo causare.", "p": ["Será reprimida con prisión de uno a cuatro años, la mujer que causare su propio aborto o consintiere en que otro se lo causare. La tentativa de la mujer no es punible."], "nt": [], "z": ["1–4 años"]}, {"pn": [{"t": "P", "a": 1, "b": 12, "c": "Se impondrá prisión de un mes a un año, al que causa
